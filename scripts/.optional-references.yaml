# .optional-references.yaml: each `optional: true` reference and each `| default ""`
# fallback in a first-party template, with the reason it is correct (ADR-0003).
# scripts/check-optional-references.py reads this file. A case with no entry
# fails, and so does an entry that matches no case. Keyed by content.
cases:
  "helm/gibson-common/templates/_helpers.tpl default {{- $digest := .digest | default \"\" -}}": "The registry host and the digest are optional parts of an image reference; the helper builds the reference without them."
  "helm/gibson-common/templates/_helpers.tpl default {{- $hasCluster := contains \"name: gibson_daemon_grpc\" ($envoyCfg | default \"\") -}}": "The validator searches the Envoy config text; empty text makes the search fail, and the validator then fails the render."
  "helm/gibson-common/templates/_helpers.tpl default {{- $hasSdsSecret := contains \"tls_certificate_sds_secret_configs\" ($envoyCfg | default \"\") -}}": "The validator searches the Envoy config text; empty text makes the search fail, and the validator then fails the render."
  "helm/gibson-common/templates/_helpers.tpl default {{- $hasTls := contains \"envoy.transport_sockets.tls\" ($envoyCfg | default \"\") -}}": "The validator searches the Envoy config text; empty text makes the search fail, and the validator then fails the render."
  "helm/gibson-common/templates/_helpers.tpl default {{- $override = .Values.gibson.daemonAddress | default \"\" -}}": "gibson.daemonAddress is the optional override; empty means the helper builds the daemon Service address."
  "helm/gibson-common/templates/_helpers.tpl default {{- $override = .Values.tenantOperator.daemonGrpcAddress | default \"\" -}}": "The legacy override; charts#360 deletes this read."
  "helm/gibson-common/templates/_helpers.tpl default {{- $registry := .registry | default \"\" -}}": "The registry host and the digest are optional parts of an image reference; the helper builds the reference without them."
  "helm/gibson-common/templates/_helpers.tpl default {{- (splitList \":\" (.Values.redis.addr | default \"\")) | first | default (printf \"%s-redis-stack\" .Release.Name) -}}": "An empty redis.addr falls back to the in-chart redis-stack Service of the release."
  "helm/gibson-operators/templates/_helpers.tpl default {{- $es := .Values.redis.auth.existingSecret | default \"\" -}}": "Normalizes an absent key to empty; the next line fails the render when both names are empty."
  "helm/gibson-operators/templates/_helpers.tpl default {{- $ps := .Values.redis.auth.passwordSecret | default \"\" -}}": "Normalizes an absent key to empty; the next line fails the render when both names are empty."
  "helm/gibson-operators/templates/platform-operator/deployment.yaml optional secret {{ .Values.platformOperator.vaultTokenSecretRef.name | default \"gibson-openbao-keys\" | quote }}": "OpenBao writes the admin token Secret later in the sync order; the operator polls VAULT_TOKEN_PATH and requeues until the kubelet projects it (deploy#971)."
  "helm/gibson-operators/templates/tenant-operator/deployment.yaml optional secret {{ .Values.tenantOperator.brokerConfig.systemTenantKekSecretRef.name | required \"tenantOperator.brokerConfig.systemTenantKekSecretRef.name is required (one-code-path)\" | quote }}": "PlatformBootstrap writes gibson-master-key later in the bringup; a required mount deadlocks the waves. The operator reads the KEK lazily and requeues (deploy#971)."
  "helm/gibson-workloads/templates/_helpers.tpl default {{- $issuer := (.Values.certManager.envoyEdge).issuer | default \"\" -}}": "An empty issuer means the edge needs no private CA; the helper returns false."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $backend := ($spec.runtime | default dict).backend | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $dRepo = .repository | default \"\" -}}": "validateGhcrCredentials reads an absent repository as empty before its prefix check; charts#376 deletes the validator."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $eaRepo = .repository | default \"\" -}}": "validateGhcrCredentials reads an absent repository as empty before its prefix check; charts#376 deletes the validator."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $fp := $webhook.failurePolicy | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $gRepo = .repository | default \"\" -}}": "validateGhcrCredentials reads an absent repository as empty before its prefix check; charts#376 deletes the validator."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $kmsKeyId := $aws.kms_key_id | default ($aws.secret_arn | default \"\") -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $kpType = $kp.type | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $ppHost := and (hasKey $pp \"host\") (ne (toString ($pp.host | default \"\")) \"\") -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $regRepo = .repository | default .registry | default \"\" -}}": "validateGhcrCredentials reads an absent repository as empty before its prefix check; charts#376 deletes the validator."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $roleArn := $aws.role_arn | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $sharedURI = .shared_cluster_uri | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $tenant := ($sbx.setec | default dict).tenant | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $tenantMode = .tenant_mode | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $tenantNeo4jTag = .tag | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- $tier := $setec.tier | default \"\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/_validators.tpl default {{- if eq ($spirePgImg.tag | default \"\") \"latest\" -}}": "The validator normalizes an absent value to empty and then compares it; a wrong or missing value fails the render."
  "helm/gibson-workloads/templates/auth/openbao-deployment.yaml optional secret {{ $keyringSecretName | quote }}": "The two keyring inputs (pull token, SMTP relay) are optional members of the keyring; the pod starts without them (deploy#1732)."
  "helm/gibson-workloads/templates/dashboard/deployment.yaml default {{ .metrics.allowedCIDRs | default \"\" | quote }}": "Empty disables CIDR filtering of the metrics endpoint, which stays cluster-internal."
  "helm/gibson-workloads/templates/dashboard/deployment.yaml optional configMap gibson-sa-identity-map": "The Zitadel bootstrap writes the map after install; the resolve-sa-identity-map init container handles the empty case (canonical-service-identity Req 5)."
  "helm/gibson-workloads/templates/dashboard/deployment.yaml optional secret gibson-dashboard-oidc": "The platform-operator mints the dashboard OIDC client at run time; the wait-for-zitadel-client init container blocks the main containers until both keys are projected."
  "helm/gibson-workloads/templates/envoy/configmap.yaml default {{- $envoyNodePort := .Values.envoy.service.nodePort | default \"\" -}}": "nodePort is kind-only; empty selects ClusterIP or LoadBalancer mode."
  "helm/gibson-workloads/templates/envoy/deployment.yaml optional secret gibson-native-login-oidc": "The native-login OIDCClient is minted at run time; the render-envoy-config init container substitutes a sentinel that matches no token until it exists."
  "helm/gibson-workloads/templates/ext-authz/deployment.yaml optional secretKeyRef gibson-dashboard-oidc/client_id": "The platform-operator mints the client at run time; ext-authz builds the human-client list from both ids, and an empty id matches no token (charts#148)."
  "helm/gibson-workloads/templates/ext-authz/deployment.yaml optional secretKeyRef gibson-native-login-oidc/client_id": "The platform-operator mints the client at run time; ext-authz builds the human-client list from both ids, and an empty id matches no token (charts#148)."
  "helm/gibson-workloads/templates/gibson/statefulset.yaml default {{- $lokiUrl := (((.Values.gibson).lokiUrl)) | default \"\" }}": "The chart ships no Loki; empty disables log queries, and the daemon reports the log backend as unavailable."
  "helm/gibson-workloads/templates/gibson/statefulset.yaml optional configMap gibson-sa-identity-map": "The Zitadel bootstrap writes the map after install; the identity resolver returns no match for an unknown sub (canonical-service-identity Req 8.2)."
  "helm/gibson-workloads/templates/gibson/statefulset.yaml optional configMapKeyRef gibson-fga-config/model_id": "The fga-init Job writes the ConfigMap after install; the daemon's ResolveWithRetry waits for both values before the FGA authorizer starts."
  "helm/gibson-workloads/templates/gibson/statefulset.yaml optional configMapKeyRef gibson-fga-config/store_id": "The fga-init Job writes the ConfigMap after install; the daemon's ResolveWithRetry waits for both values before the FGA authorizer starts."
  "helm/gibson-workloads/templates/gibson/statefulset.yaml optional secret {{ include \"gibson.cgSigningKeySecret.name\" . }}": "The daemon falls back to the master KEK and logs ErrSigningKeyNotProvisioned when the key is absent; a required mount wedges each daemon pod (GHSA-3957)."
  "helm/gibson-workloads/templates/gibson/statefulset.yaml optional secretKeyRef gibson-native-login-oidc/client_id": "The /.well-known/gibson-login endpoint answers 503 while the native-login client is not minted; a required ref crashlooped the daemon (gibson#623)."
  "helm/gibson/templates/app-url-guard.yaml default {{- $checks := list (dict \"label\" \"gibson-workloads.gibson.appUrl\" \"value\" ((((index .Values \"gibson-workloads\") | default dict).gibson | default dict).appUrl | default \"\")) (dict \"label\" \"gibson-operators.gibson.appUrl\" \"value\" ((((index .Values \"gibson-operators\") | default dict).gibson | default dict).appUrl | default \"\")) -}}": "The guard reads an absent appUrl as empty and checks only a set value."
