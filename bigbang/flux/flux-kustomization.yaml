---
# Flux Kustomization that reconciles the Gibson Big Bang package from git.
#
# This is the GitOps entrypoint Big Bang expects: it consumes the
# GitRepository source and applies bigbang/package (namespace + OCIRepository
# + HelmRelease). `wait: true` blocks until the package's resources are
# healthy, matching Big Bang's dependency-ordered reconcile model.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gibson-bigbang
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: gibson-deploy
  path: ./bigbang/package
