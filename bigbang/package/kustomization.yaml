---
# The deployable Big Bang package: the namespace + the Flux source + the
# HelmRelease for the OCI umbrella chart. This is what Big Bang's Flux
# reconciles (referenced by ../flux/flux-kustomization.yaml, spec.path).
#
# Renders standalone with: kustomize build bigbang/package
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ocirepository.yaml
  - helmrelease.yaml
