# Caller workflow for the org tree guards.
#
#   brand-guard                  fails on a retired brand string anywhere in the tracked tree
#   link-check                   fails on a broken link in any Markdown file
#   vault-auth-method-deny-list  fails on a token of a retired OpenBao login method (ADR-0009).
#                                The exceptions are in .github/.vault-auth-deny-list-allowlist.json,
#                                each keyed by the content of its line.
#   adr-citations                fails on an ADR number that docs/adr-index.md does not
#                                hold as live (charts#365). The index is a copy of
#                                docs/adr-index.md of zeroroot-ai/gibson.
#   exit-tests-off-pr            fails when an exit-test-* workflow has a pull_request,
#                                pull_request_target or merge_group trigger (ADR-0080). The one shared check, with its
#                                fixtures, is in zeroroot-ai/.github.
#
# The reusables live in zeroroot-ai/.github. None needs a secret: the
# checkout uses the calling repository's own GITHUB_TOKEN, and the scanners
# travel with the composite actions.
#
# The merge_group trigger is not optional on a repository with a merge queue. A
# required status check that never runs on merge_group stalls the queue until
# it times out, and every check in rulesets/repo/<repo>.json is required in
# both lanes.
#
# Per-repo exemptions:
#   .brand-guard-allow  repo-relative paths under a `# why:` comment
#   .lychee.toml        adds to the org link policy, never replaces it

name: tree-guards

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tree-guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brand-guard:
    uses: zeroroot-ai/.github/.github/workflows/brand-guard.yml@7626d9726b593f0e33bc668626e0dbe8771eee19 # v0.20.1

  link-check:
    uses: zeroroot-ai/.github/.github/workflows/link-check.yml@7626d9726b593f0e33bc668626e0dbe8771eee19 # v0.20.1

  vault-auth-method-deny-list:
    uses: zeroroot-ai/.github/.github/workflows/vault-auth-method-deny-list.yml@7626d9726b593f0e33bc668626e0dbe8771eee19 # v0.20.1

  exit-tests-off-pr:
    uses: zeroroot-ai/.github/.github/workflows/exit-tests-off-pr.yml@7626d9726b593f0e33bc668626e0dbe8771eee19 # v0.20.1

  adr-citations:
    uses: zeroroot-ai/.github/.github/workflows/adr-citations.yml@7626d9726b593f0e33bc668626e0dbe8771eee19 # v0.20.1
