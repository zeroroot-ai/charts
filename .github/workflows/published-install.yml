# THE published-install steps, defined ONCE and called by two workflows.
#
# WHY TWO WORKFLOWS AND NOT A MATRIX
#
# Owner call, 2026-09-16: a developer uses kind OR k3d, not both, and each
# needs its own answer. A matrix gives one run, one status and one badge for
# two claims, so "does the published chart install on k3d?" cannot be read
# without opening a log and finding the right leg. Two workflows give two
# statuses, and a developer on either distribution can point at theirs.
#
# It also stops a known-red distribution from masking the other. k3d is red on
# a Tenant-seeding problem that has nothing to do with kind; with one matrix,
# a real kind regression would land inside an already-red run.
#
# WHAT THE MATRIX WAS PROTECTING, kept. The argument for one matrix was drift:
# two workflows diverge, the second gets a fix the first does not, and then
# "it works on kind" and "it works on k3d" stop being the same claim. So the
# STEPS live here, once. The two callers choose a distribution and nothing
# else. There is no second copy to drift from.
#
# WHY THIS IS NOT exit-test-baseline-install (in zeroroot-ai/hosted)
#
# That one answers "does charts main install?" — it builds from a source
# checkout. Valuable, and not what a stranger does. A stranger runs
# `helm install` against the artifact in the registry. charts#82 is what that
# gap bought: `helm install gibson-crds` had been failing on every cluster for
# some time because the release record exceeded the 1 MiB Secret cap, and
# nothing could see it — Argo applies server-side and writes no release
# record, and the publish smoke test is `helm template`, which writes none
# either.
#
# WHY IT RUNS HERE AND NOT IN hosted
#
# MEASURED 2026-09-16, the same probe on each:
#
#     charts  (public)   ubuntu-latest : 4 vCPU, 15989 MB
#     hosted  (private)  ubuntu-latest : 2 vCPU,  ~7990 MB
#
# Public repositories get twice the machine AND unlimited standard-runner
# minutes at no cost. That is not academic: the k3d leg had been deleted from
# hosted because on 2 vCPU / 7 GB the node evicted 35 pods and the install
# died. On 4 vCPU it evicts one.
#
# WHY k3d IS WORTH RUNNING AT ALL. kind's CNI does not implement NetworkPolicy,
# so every policy this chart ships is inert there. k3s enforces them, and
# charts#80 was found exactly that way: OpenBao had no egress to the apiserver
# and every symptom pointed somewhere else.
name: published-install

on:
  workflow_call:
    inputs:
      distro:
        description: kind or k3d
        required: true
        type: string
      chart_version:
        description: The published chart version to install (default, the newest)
        required: false
        type: string

permissions:
  contents: read

jobs:
  install:
    name: published install on ${{ inputs.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NS: gibson
      CHARTS_ROOT: ${{ github.workspace }}
    steps:
      # This repo IS the installer. Only the SCRIPT is taken from the
      # checkout; every chart comes from the registry, which is the point.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # hosted owns stage 0 and the cluster verbs (ADR-0086). It is private,
      # and this is the same read-only PAT zeroroot-ai/gibson has used to read
      # it since 2026-09-07. It is never exposed to a pull request: this
      # workflow does not run on one.
      # Checked BEFORE the checkout, because the checkout's own failure does
      # not name the cause. A token that cannot see a private repository gets
      # a 404 (GitHub does not confirm the repo exists), git decides it might
      # need to log in, and the log reads
      #
      #     fatal: could not read Username for 'https://github.com'
      #
      # which sounds like a missing token and is equally consistent with a
      # present-but-wrong one. It cost a run to tell apart. This says which.
      - name: The hosted token works
        env:
          T: ${{ secrets.GH_PAT_PLATFORM_RO }}
        run: |
          set -euo pipefail
          if [ -z "$T" ]; then
            echo "::error::GH_PAT_PLATFORM_RO is empty in this repository. It is an org secret; check its visibility includes PUBLIC repositories — 'Private repositories' silently excludes this one."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/zeroroot-ai/hosted)
          case "$code" in
            200) echo "✓ the token reads zeroroot-ai/hosted" ;;
            401) echo "::error::GH_PAT_PLATFORM_RO is set but GitHub rejects it (401 Bad credentials). The value is not a valid GitHub token — a PAT begins ghp_ or github_pat_. Mint one at https://github.com/settings/personal-access-tokens with resource owner zeroroot-ai, repository zeroroot-ai/hosted, permission Contents: Read-only."; exit 1 ;;
            403) echo "::error::GH_PAT_PLATFORM_RO authenticates but is forbidden (403) on zeroroot-ai/hosted. Check SSO authorization for the zeroroot-ai organization."; exit 1 ;;
            404) echo "::error::GH_PAT_PLATFORM_RO authenticates but cannot see zeroroot-ai/hosted (404). A fine-grained token must list that repository explicitly and grant Contents: Read-only."; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code asking GitHub about zeroroot-ai/hosted"; exit 1 ;;
          esac

      - name: Check out zeroroot-ai/hosted for stage 0 and the cluster verbs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: zeroroot-ai/hosted
          ref: main
          path: hosted
          token: ${{ secrets.GH_PAT_PLATFORM_RO }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.18.4

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve the published version under test
        id: version
        run: |
          set -euo pipefail
          v="${{ inputs.chart_version }}"
          if [ -z "$v" ]; then
            # The newest published umbrella. A tag list, not a guess: the four
            # charts publish together at one version.
            v="$(helm show chart oci://ghcr.io/zeroroot-ai/charts/gibson 2>/dev/null \
                 | awk '/^version:/{print $2}')"
          fi
          [ -n "$v" ] || { echo "::error::could not resolve a published chart version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "installing published charts at $v"

      - name: Install k3d
        if: inputs.distro == 'k3d'
        run: |
          set -euo pipefail
          # 5.9.0 or newer: older k3d rolls back a cluster whose node is in
          # fact Ready, because its readiness wait cannot follow Docker's logs
          # on Docker 25+. The error names the cluster and the fault is k3d's.
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 \
            -o /usr/local/bin/k3d
          chmod +x /usr/local/bin/k3d
          k3d version

      - name: Stage 0 — the bucket, the relay and the keyring
        working-directory: hosted
        run: SUBSTRATE_DIR="$RUNNER_TEMP/substrate" make substrate ENV=kind

      # The cluster. Stage 0 owns the Docker network either way; the two verbs
      # differ only in which tool builds the node on it.
      - name: Create the ${{ inputs.distro }} cluster
        run: |
          set -euo pipefail
          if [ "${{ inputs.distro }}" = kind ]; then
            KIND_PV_DIR="$RUNNER_TEMP/kind-pv"; mkdir -p "$KIND_PV_DIR"
            sed "s|__KIND_PV_DIR__|$KIND_PV_DIR|" helm/kind-config.yaml \
              | kind create cluster --name gibson --config - --wait 180s
            echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          else
            CLUSTER=gibson ./hosted/scripts/cluster-k3d.sh create
            CLUSTER=gibson ./hosted/scripts/cluster-k3d.sh verify
            echo "KUBECONFIG=/tmp/k3d-gibson.kubeconfig" >> "$GITHUB_ENV"
          fi

      # THE assertion, and the one a stranger's command is measured against.
      #
      # RUNG=developer is the documented local install (ADR-0090):
      #
      #   helm install gibson oci://... -f values-baseline.yaml -f values-developer.yaml
      #
      # Both files come OUT OF THE PULLED ARTIFACT, never out of this
      # checkout. `helm install oci://...` cannot -f a file that lives inside
      # the chart, and a stranger has no checkout to read one from, so if the
      # rung did not travel in the artifact the claim "the only thing an
      # installer needs is helm" would be false. Passing a local overlay here
      # instead would test a path nobody outside this organization can run.
      - name: Install the published charts at the developer rung
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
          SUBSTRATE_ENV: ${{ runner.temp }}/substrate/kind/substrate.env
          RUNG: developer
        run: scripts/baseline-up.sh

      # The rung came from the ARTIFACT, not from anywhere on this runner.
      # Without this, a future edit that quietly passes a local file would
      # still go green and the stranger claim would rot silently.
      - name: The rung travelled inside the artifact
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          helm pull "oci://ghcr.io/zeroroot-ai/charts/gibson" \
            --version "$CHART_VERSION" --untar --untardir "$d"
          for f in values-baseline.yaml values-developer.yaml values-ci.yaml; do
            [ -s "$d/gibson/$f" ] \
              || { echo "::error::the published chart $CHART_VERSION carries no $f, so a stranger cannot name that rung with helm alone"; exit 1; }
            echo "  ✓ $f ships in the artifact"
          done

      # The hook Jobs are dumped too. The previous version of this step listed
      # pods and ExternalSecrets and nothing else, so when the k3d leg died at
      # `first-admin failed: DeadlineExceeded` the ONE thing that failed was
      # the one thing with no log, and the cause took a second run to find.
      - name: Diagnose a failure
        if: failure()
        run: |
          echo "=== node capacity: what the runner actually gave us ==="
          kubectl describe node | sed -n '/Capacity:/,/System Info/p' || true
          echo "=== pods ==="
          kubectl get pods -A -o wide || true
          echo "=== anything evicted, and why ==="
          kubectl get pods -A --field-selector status.phase=Failed -o wide || true
          kubectl get events -A --field-selector reason=Evicted | head -40 || true
          # A Job that hits activeDeadlineSeconds has its pod REAPED, so by the
          # time this step runs `kubectl logs job/...` has nothing to read and
          # reports "timed out waiting for the condition" — which looks like
          # the Job's own output and is not. That cost a run to notice. So dump
          # what SURVIVES the pod: the Job object, and the namespace's events.
          echo "=== the hook Jobs ==="
          kubectl -n "$NS" get jobs || true
          for j in $(kubectl -n "$NS" get jobs -o jsonpath='{range .items[?(@.status.failed)]}{.metadata.name}{"\n"}{end}' 2>/dev/null); do
            echo "--- describe job/$j (survives the pod)"
            kubectl -n "$NS" describe "job/$j" || true
            echo "--- logs job/$j (empty if the pod was already reaped)"
            kubectl -n "$NS" logs "job/$j" --tail=120 --all-containers --ignore-errors=true 2>&1 | head -120 || true
          done
          echo "=== events, newest last: these outlive every pod ==="
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -60 || true

          # first-admin waits for the tenant-operator to seed a Tenant and
          # report status.zitadelOrgID. If that never happens the Job can only
          # time out, so the Tenant's own status is the answer.
          echo "=== tenants, which is what first-admin waits on ==="
          kubectl -n "$NS" get tenants -o wide || true
          kubectl -n "$NS" get tenants -o yaml | head -120 || true
          echo "=== the operators that would seed it ==="
          kubectl -n "$NS" logs deploy/gibson-platform-operator --tail=60 || true
          kubectl -n "$NS" logs deploy/gibson-tenant-operator --tail=60 || true
          echo "=== secret plane ==="
          kubectl get externalsecrets -A || true
          kubectl get clustersecretstore -o yaml || true
