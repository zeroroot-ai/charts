# THE published-install steps, defined ONCE and called by two workflows.
#
# WHY TWO WORKFLOWS AND NOT A MATRIX
#
# Owner call, 2026-09-16: a developer uses kind OR k3d, not both, and each
# needs its own answer. A matrix gives one run, one status and one badge for
# two claims, so "does the published chart install on k3d?" cannot be read
# without opening a log and finding the right leg. Two workflows give two
# statuses, and a developer on either distribution can point at theirs.
#
# It also stops a known-red distribution from masking the other. k3d is red on
# a Tenant-seeding problem that has nothing to do with kind; with one matrix,
# a real kind regression would land inside an already-red run.
#
# WHAT THE MATRIX WAS PROTECTING, kept. The argument for one matrix was drift:
# two workflows diverge, the second gets a fix the first does not, and then
# "it works on kind" and "it works on k3d" stop being the same claim. So the
# STEPS live here, once. The two callers choose a distribution and nothing
# else. There is no second copy to drift from.
#
# THE SOURCE MODE (charts#433)
#
# exit-test-baseline-install.yml calls these steps with from_source: true. It
# answers "does charts main install?" from this checkout. It moved here from
# zeroroot-ai/hosted, because it describes the chart. The published mode
# below is what a stranger does.
#
# WHY THE PUBLISHED MODE IS NOT ENOUGH ALONE
#
# The source mode builds from a checkout. Valuable, and not what a stranger
# does. A stranger runs
# `helm install` against the artifact in the registry. charts#82 is what that
# gap bought: `helm install gibson-crds` had been failing on every cluster for
# some time because the release record exceeded the 1 MiB Secret cap, and
# nothing could see it — Argo applies server-side and writes no release
# record, and the publish smoke test is `helm template`, which writes none
# either.
#
# WHY IT RUNS HERE AND NOT IN hosted
#
# MEASURED 2026-09-16, the same probe on each:
#
#     charts  (public)   ubuntu-latest : 4 vCPU, 15989 MB
#     hosted  (private)  ubuntu-latest : 2 vCPU,  ~7990 MB
#
# Public repositories get twice the machine AND unlimited standard-runner
# minutes at no cost. That is not academic: the k3d leg had been deleted from
# hosted because on 2 vCPU / 7 GB the node evicted 35 pods and the install
# died. On 4 vCPU it evicts one.
#
# WHY k3d IS WORTH RUNNING AT ALL. kind's CNI does not implement NetworkPolicy,
# so every policy this chart ships is inert there. k3s enforces them, and
# charts#80 was found exactly that way: OpenBao had no egress to the apiserver
# and every symptom pointed somewhere else.
name: published-install

on:
  workflow_call:
    inputs:
      distro:
        description: kind or k3d
        required: true
        type: string
      chart_version:
        description: The published chart version to install (default, the newest)
        required: false
        type: string
      upgrade_from_version:
        description: >-
          With upgrade_from_previous, the published version to upgrade FROM in
          place of the one before the version under test. Use it for the version
          an environment pins, or to pass over a release that cannot install.
        required: false
        type: string
        default: ""
      from_source:
        description: >-
          Install the chart source of this checkout in place of a published
          version (charts#433). This answers "does charts main install?", the
          question the baseline install exit test asks. chart_version and the
          upgrade inputs do not apply.
        required: false
        type: boolean
        default: false
      overlay:
        description: >-
          A substrate overlay of the chart, passed to baseline-up.sh as
          OVERLAY. `guest` first installs the operators that the guest profile
          expects the cluster to own (scripts/guest-operators-up.sh).
        required: false
        type: string
        default: ""
      upgrade_from_previous:
        description: >-
          Install the PREVIOUS published version first, converge it, then upgrade
          to the version under test. Off by default, because a fresh install and
          an upgrade are different claims and most runs want the first.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install:
    name: ${{ inputs.from_source && 'source' || 'published' }} install on ${{ inputs.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NS: gibson
      CHARTS_ROOT: ${{ github.workspace }}
    steps:
      # This repo IS the installer. Only the SCRIPT is taken from the
      # checkout; every chart comes from the registry, which is the point.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # hosted owns stage 0 and the cluster verbs (ADR-0086). It is private,
      # and this is the same read-only PAT zeroroot-ai/gibson has used to read
      # it since 2026-09-07. It is never exposed to a pull request: this
      # workflow does not run on one.
      # Checked BEFORE the checkout, because the checkout's own failure does
      # not name the cause. A token that cannot see a private repository gets
      # a 404 (GitHub does not confirm the repo exists), git decides it might
      # need to log in, and the log reads
      #
      #     fatal: could not read Username for 'https://github.com'
      #
      # which sounds like a missing token and is equally consistent with a
      # present-but-wrong one. It cost a run to tell apart. This says which.
      - name: The hosted token works
        env:
          T: ${{ secrets.GH_PAT_PLATFORM_RO }}
        run: |
          set -euo pipefail
          if [ -z "$T" ]; then
            echo "::error::GH_PAT_PLATFORM_RO is empty in this repository. It is an org secret; check its visibility includes PUBLIC repositories — 'Private repositories' silently excludes this one."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/zeroroot-ai/hosted)
          case "$code" in
            200) echo "✓ the token reads zeroroot-ai/hosted" ;;
            401) echo "::error::GH_PAT_PLATFORM_RO is set but GitHub rejects it (401 Bad credentials). The value is not a valid GitHub token — a PAT begins ghp_ or github_pat_. Mint one at https://github.com/settings/personal-access-tokens with resource owner zeroroot-ai, repository zeroroot-ai/hosted, permission Contents: Read-only."; exit 1 ;;
            403) echo "::error::GH_PAT_PLATFORM_RO authenticates but is forbidden (403) on zeroroot-ai/hosted. Check SSO authorization for the zeroroot-ai organization."; exit 1 ;;
            404) echo "::error::GH_PAT_PLATFORM_RO authenticates but cannot see zeroroot-ai/hosted (404). A fine-grained token must list that repository explicitly and grant Contents: Read-only."; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code asking GitHub about zeroroot-ai/hosted"; exit 1 ;;
          esac

      - name: Check out zeroroot-ai/hosted for stage 0 and the cluster verbs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: zeroroot-ai/hosted
          ref: main
          path: hosted
          token: ${{ secrets.GH_PAT_PLATFORM_RO }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.18.4

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve the published version under test
        id: version
        run: |
          set -euo pipefail
          if [ "${{ inputs.from_source }}" = true ]; then
            if [ "${{ inputs.upgrade_from_previous }}" = true ] || [ -n "${{ inputs.chart_version }}" ]; then
              echo "::error::from_source installs this checkout; chart_version and upgrade_from_previous do not apply"
              exit 1
            fi
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "installing the chart source at $(git rev-parse HEAD)"
            exit 0
          fi
          v="${{ inputs.chart_version }}"
          if [ -z "$v" ]; then
            # The newest published umbrella. A tag list, not a guess: the four
            # charts publish together at one version.
            v="$(helm show chart oci://ghcr.io/zeroroot-ai/charts/gibson 2>/dev/null \
                 | awk '/^version:/{print $2}')"
          fi
          [ -n "$v" ] || { echo "::error::could not resolve a published chart version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "installing published charts at $v"

      # The version to upgrade FROM comes from scripts/resolve-upgrade-pair.py,
      # not from shell here. It paginates the registry tag list and compares
      # versions as integer tuples, both of which the first inline attempt got
      # wrong: one page ended at 0.132.14 and a string compare orders 0.9.0
      # after 0.10.0. It has a self-test; inline YAML cannot.
      - name: Resolve the version to upgrade from
        id: pair
        if: inputs.upgrade_from_previous
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          from="${{ inputs.upgrade_from_version }}"
          if [ -n "$from" ]; then
            python3 scripts/resolve-upgrade-pair.py --to "${{ steps.version.outputs.version }}" --from "$from"
          else
            python3 scripts/resolve-upgrade-pair.py --to "${{ steps.version.outputs.version }}"
          fi

      - name: Install k3d
        if: inputs.distro == 'k3d'
        run: |
          set -euo pipefail
          # 5.9.0 or newer: older k3d rolls back a cluster whose node is in
          # fact Ready, because its readiness wait cannot follow Docker's logs
          # on Docker 25+. The error names the cluster and the fault is k3d's.
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 \
            -o /usr/local/bin/k3d
          chmod +x /usr/local/bin/k3d
          k3d version

      - name: Stage 0 — the bucket, the relay and the keyring
        working-directory: hosted
        run: SUBSTRATE_DIR="$RUNNER_TEMP/substrate" make substrate ENV=kind

      # The cluster. Stage 0 owns the Docker network either way; the two verbs
      # differ only in which tool builds the node on it.
      - name: Create the ${{ inputs.distro }} cluster
        run: |
          set -euo pipefail
          if [ "${{ inputs.distro }}" = kind ]; then
            KIND_PV_DIR="$RUNNER_TEMP/kind-pv"; mkdir -p "$KIND_PV_DIR"
            # No --wait: the node is not Ready until a CNI runs, and kind
            # starts with none (helm/kind-config.yaml). Cilium is installed
            # next, with the one pin and the kind values of hosted (hosted#436).
            sed "s|__KIND_PV_DIR__|$KIND_PV_DIR|" helm/kind-config.yaml \
              | kind create cluster --name gibson --config -
            echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
            # shellcheck source=/dev/null
            . ./hosted/scripts/lib/cilium.sh
            cilium_install kind --set "k8sServiceHost=gibson-control-plane"
            # The Cilium operator registers the CiliumNetworkPolicy CRD after
            # it starts, so verify only once the node is Ready, in the order
            # of hosted's recreate-kind.sh (exit test run 37448588132).
            kubectl wait --for=condition=Ready nodes --all --timeout=300s
            cilium_verify
          else
            CLUSTER=gibson ./hosted/scripts/cluster-k3d.sh create
            CLUSTER=gibson ./hosted/scripts/cluster-k3d.sh verify
            echo "KUBECONFIG=/tmp/k3d-gibson.kubeconfig" >> "$GITHUB_ENV"
          fi

      # Hubble on, so the last step can read the verdict of each flow
      # (ADR-0165 rule 4, D76, charts#489). The shared Cilium values of hosted
      # keep Hubble off; this upgrade keeps every other value and turns it on
      # in the agent only. No relay: the check reads each agent with
      # `hubble observe` in the agent container.
      - name: Turn on Hubble in Cilium
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . ./hosted/scripts/lib/cilium.sh
          helm upgrade cilium "$CILIUM_CHART" --version "$(cilium_version)" \
            --namespace kube-system --reuse-values --set hubble.enabled=true \
            --wait --timeout "$CILIUM_TIMEOUT"
          cilium_verify
          echo "HUBBLE_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # PHASE 1 of an upgrade run: the PREVIOUS published version, converged.
      #
      # This is what makes the test able to catch a migration. Every other exit
      # test installs from an empty database, and Zitadel's setup Job only fails
      # when it meets a schema an EARLIER Zitadel wrote — charts#155, where
      # v4.18.0's migration 76 died on `column "owners" of relation
      # "unique_constraints" does not exist` and a fresh install was clean.
      #
      # baseline-up.sh is the same verb both times: every release it drives is
      # `helm upgrade --install`, so running it again at a newer CHART_VERSION
      # IS the upgrade a promotion performs. No second code path to drift.
      - name: Make the cluster a guest host (the guest overlay only)
        if: inputs.overlay == 'guest'
        run: scripts/guest-operators-up.sh

      - name: Phase 1 — install the previous published version
        if: inputs.upgrade_from_previous
        env:
          CHART_VERSION: ${{ steps.pair.outputs.from }}
          SUBSTRATE_ENV: ${{ runner.temp }}/substrate/kind/substrate.env
          RUNG: developer
        run: scripts/baseline-up.sh

      - name: Phase 1 — the Zitadel database is populated, not empty
        if: inputs.upgrade_from_previous
        run: |
          set -euo pipefail
          # Without a populated schema the upgrade proves nothing, so this is a
          # precondition and not a nicety: if Zitadel never finished its own
          # migrations at the old version, phase 2 would pass by meeting the
          # empty database every other test already covers.
          kubectl -n gibson wait --for=condition=complete job/gibson-zitadel-setup --timeout=900s
          # platform-postgres is a CNPG Cluster, so the primary is found by its
          # role label. stderr is kept: a failed exec must read as a failed exec,
          # never as an empty table.
          primary="$(kubectl -n gibson get pod \
                       -l cnpg.io/cluster=platform-postgres,cnpg.io/instanceRole=primary \
                       -o jsonpath='{.items[0].metadata.name}')"
          [ -n "$primary" ] || { echo "::error::no primary pod for the CNPG Cluster platform-postgres"; exit 1; }
          n="$(kubectl -n gibson exec "$primary" -c postgres -- \
                 psql -U postgres -d zitadel -tAc \
                 "select count(*) from projections.current_states")"
          [ "${n:-0}" -gt 0 ] || { echo "::error::Zitadel's projections are empty after installing ${{ steps.pair.outputs.from }}, so an upgrade from here would meet an empty database and prove nothing"; exit 1; }
          echo "Zitadel carries $n projection state row(s) at ${{ steps.pair.outputs.from }}"

      # THE assertion, and the one a stranger's command is measured against.
      #
      # RUNG=developer is the documented local install (ADR-0090):
      #
      #   helm install gibson oci://... -f values-baseline.yaml -f values-developer.yaml
      #
      # Both files come OUT OF THE PULLED ARTIFACT, never out of this
      # checkout. `helm install oci://...` cannot -f a file that lives inside
      # the chart, and a stranger has no checkout to read one from, so if the
      # rung did not travel in the artifact the claim "the only thing an
      # installer needs is helm" would be false. Passing a local overlay here
      # instead would test a path nobody outside this organization can run.
      # From source, CHART_VERSION is empty, so baseline-up.sh installs the
      # charts of this checkout (LOCAL mode) at the same rung.
      - name: Install the charts at the developer rung
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
          SUBSTRATE_ENV: ${{ runner.temp }}/substrate/kind/substrate.env
          RUNG: developer
          OVERLAY: ${{ inputs.overlay }}
        run: scripts/baseline-up.sh

      - name: The guest install runs no second copy of the four operators
        if: inputs.overlay == 'guest'
        run: |
          set -euo pipefail
          # values-guest.yaml turns the four seams off, so the release namespace
          # holds none of these operators. Each runs once, in its own namespace.
          extra="$(kubectl -n gibson get deploy -o name \
                     | grep -E 'cert-manager|external-secrets|external-dns|cloudnative-pg' || true)"
          if [ -n "$extra" ]; then
            echo "::error::the guest install rendered a second copy of an operator the cluster owns:"
            echo "$extra"
            exit 1
          fi
          for d in cert-manager/cert-manager external-secrets/external-secrets \
                   external-dns/external-dns cnpg-system/cnpg-cloudnative-pg; do
            kubectl -n "${d%%/*}" rollout status "deploy/${d#*/}" --timeout=120s
          done
          echo "  ✓ one copy of each operator, outside the release namespace, and each is ready"

      # The assertion charts#155 asked for, and it runs in BOTH modes: on a
      # fresh install it is cheap, and on an upgrade it is the whole point.
      # Named explicitly rather than left to "the sync went green", because the
      # hook failing five times is what stalled the staging promotion while
      # every pod still read Running.
      - name: The Zitadel setup hook completed, with no migration left failing
        run: |
          set -euo pipefail
          if ! kubectl -n gibson wait --for=condition=complete \
                 job/gibson-zitadel-setup --timeout=900s; then
            echo "::error::gibson-zitadel-setup did not complete. Its log follows; a line \
          reading \"migration failed\" with err.kind=AlreadyExists is the charts#155 shape — \
          a Zitadel version that cannot migrate a database an earlier version wrote."
            kubectl -n gibson logs job/gibson-zitadel-setup --tail=200 --all-containers || true
            exit 1
          fi
          log="$(kubectl -n gibson logs job/gibson-zitadel-setup --tail=400 --all-containers 2>/dev/null || true)"
          if printf '%s' "$log" | grep -q "migration failed"; then
            echo "::error::the setup Job completed but its log carries \"migration failed\", so a \
          migration was skipped rather than applied:"
            printf '%s\n' "$log" | grep -n -A3 "migration failed" | head -40
            exit 1
          fi
          echo "  ✓ gibson-zitadel-setup completed with no failing migration"

      # The rung came from the ARTIFACT, not from anywhere on this runner.
      # Without this, a future edit that quietly passes a local file would
      # still go green and the stranger claim would rot silently.
      - name: The rung travelled inside the artifact
        if: ${{ !inputs.from_source }}
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          helm pull "oci://ghcr.io/zeroroot-ai/charts/gibson" \
            --version "$CHART_VERSION" --untar --untardir "$d"
          for f in values-baseline.yaml values-developer.yaml values-ci.yaml; do
            [ -s "$d/gibson/$f" ] \
              || { echo "::error::the published chart $CHART_VERSION carries no $f, so a stranger cannot name that rung with helm alone"; exit 1; }
            echo "  ✓ $f ships in the artifact"
          done

      # The hook Jobs are dumped too. The previous version of this step listed
      # pods and ExternalSecrets and nothing else, so when the k3d leg died at
      # `first-admin failed: DeadlineExceeded` the ONE thing that failed was
      # the one thing with no log, and the cause took a second run to find.
      # ADR-0092: an identity client CONNECTS to the Zitadel Service and CLAIMS
      # the public host in a header. So no operator call to Zitadel passes
      # through the edge. This step proves it the only way that cannot be
      # faked by an old condition: it removes the edge, makes each operator
      # start again and call Zitadel again, and gives the tenant-operator a
      # new tenant to provision.
      #
      # A Ready condition alone proves nothing here, because it can be older
      # than the scale-down. The restart is what makes the proof current: the
      # platform-operator's readiness probe dials ZITADEL_URL, and on start it
      # reconciles the PlatformBootstrap and every OIDCClient again.
      #
      # It runs on the test's own throwaway cluster, after every other
      # assertion, and puts the edge back.
      - name: Both operators reach Zitadel with the edge at zero replicas
        run: |
          set -euo pipefail
          NS=gibson
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "▶ scale the edge to zero"
          edge_replicas="$(kubectl -n "$NS" get deploy/gibson-envoy -o jsonpath='{.spec.replicas}')"
          kubectl -n "$NS" scale deploy/gibson-envoy --replicas=0
          kubectl -n "$NS" wait --for=delete pod -l app.kubernetes.io/component=envoy --timeout=180s
          left="$(kubectl -n "$NS" get pod -l app.kubernetes.io/component=envoy --no-headers 2>/dev/null | wc -l)"
          [ "$left" -eq 0 ] || { echo "::error::$left edge pod(s) still exist, so the step would prove nothing"; exit 1; }

          echo "▶ restart both operators, so each one calls Zitadel again"
          kubectl -n "$NS" rollout restart deploy/gibson-platform-operator deploy/gibson-tenant-operator
          kubectl -n "$NS" rollout status deploy/gibson-platform-operator --timeout=300s
          kubectl -n "$NS" rollout status deploy/gibson-tenant-operator --timeout=300s

          echo "▶ a second tenant, provisioned with no edge"
          tier="$(kubectl get tenant primary -o jsonpath='{.spec.tier}')"
          [ -n "$tier" ] || { echo "::error::the tenant primary has no spec.tier to copy"; exit 1; }
          cat > "$RUNNER_TEMP/edgeless-tenant.yaml" <<YAML
          apiVersion: gibson.zeroroot.ai/v1alpha1
          kind: Tenant
          metadata:
            name: edgeless
          spec:
            displayName: Edgeless exit test
            owner: edgeless@localhost.zeroroot.ai
            tier: ${tier}
          YAML
          # The Tenant webhook is served by the tenant-operator, which this step
          # restarted a moment ago. A finished rollout says that the pods are
          # Ready. It does not say that the apiserver already reaches the
          # webhook on them: run 37348444179 failed here with "failed calling
          # webhook ... context deadline exceeded" two seconds after the
          # rollout. That delay is not the claim under test, so the create
          # waits for the webhook, for a bounded time, and says how long.
          created=0
          for attempt in $(seq 1 24); do
            if kubectl apply -f "$RUNNER_TEMP/edgeless-tenant.yaml" 2>"$RUNNER_TEMP/edgeless.err"; then
              created=1; echo "  the Tenant webhook answered on attempt ${attempt}"; break
            fi
            grep -q "failed calling webhook" "$RUNNER_TEMP/edgeless.err" \
              || { echo "::error::the Tenant was refused for a reason that is not the webhook's readiness:"; cat "$RUNNER_TEMP/edgeless.err"; exit 1; }
            sleep 5
          done
          [ "$created" -eq 1 ] || { echo "::error::the Tenant webhook did not answer in 120s after the tenant-operator restart:"; cat "$RUNNER_TEMP/edgeless.err"; exit 1; }
          org=""
          for _ in $(seq 1 120); do
            org="$(kubectl get tenant edgeless -o jsonpath='{.status.zitadelOrgID}' 2>/dev/null || true)"
            [ -n "$org" ] && break
            sleep 5
          done
          if [ -z "$org" ]; then
            echo "::error::the tenant edgeless got no Zitadel org in 600s with the edge at zero. The tenant-operator did not reach Zitadel by the Service."
            kubectl get tenant edgeless -o yaml | tail -40
            kubectl -n "$NS" logs deploy/gibson-tenant-operator --since-time="$since" --tail=80 || true
            exit 1
          fi
          echo "  ✓ tenant edgeless has Zitadel org $org (phase $(kubectl get tenant edgeless -o jsonpath='{.status.phase}'))"

          echo "▶ the bootstrap and every OIDCClient are Ready after the restart"
          kubectl wait platformbootstrap --all --for=condition=Ready --timeout=300s
          kubectl -n "$NS" wait oidcclient --all --for=condition=Ready --timeout=300s
          n="$(kubectl -n "$NS" get oidcclient --no-headers | wc -l)"
          [ "$n" -gt 0 ] || { echo "::error::no OIDCClient exists in $NS, so the wait above matched nothing"; exit 1; }
          echo "  ✓ PlatformBootstrap and $n OIDCClient(s) are Ready"
          # Since gibson v0.153.2 a reconcile that succeeds sets ClientExists
          # again (gibson#801). Before that release the condition stayed
          # Unknown after any transient error, beside Ready=True.
          kubectl -n "$NS" wait oidcclient --all --for=condition=ClientExists --timeout=300s
          echo "  ✓ every OIDCClient reports ClientExists=True"

          echo "▶ no operator logged a failed Zitadel call since the edge went away"
          bad=0
          for d in gibson-platform-operator gibson-tenant-operator; do
            hits="$(kubectl -n "$NS" logs "deploy/$d" --since-time="$since" --all-containers 2>/dev/null \
                    | grep -ciE 'transient zitadel error|zitadel.*(connection refused|no such host)' || true)"
            if [ "${hits:-0}" -ne 0 ]; then
              echo "::error::$d logged $hits failed Zitadel call(s) with the edge at zero:"
              kubectl -n "$NS" logs "deploy/$d" --since-time="$since" --all-containers \
                | grep -iE 'transient zitadel error|zitadel.*(connection refused|no such host)' | head -10
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "  ✓ both operator logs are clean"

          echo "▶ put the edge back"
          kubectl -n "$NS" scale deploy/gibson-envoy --replicas="${edge_replicas:-1}"
          kubectl -n "$NS" rollout status deploy/gibson-envoy --timeout=300s

      # The network policy on the running cluster (ADR-0165 rule 4, D76,
      # charts#489). After every assertion above, no flow to or from the
      # release namespace may be dropped by a policy: a drop is a pod that
      # misses a network label, or a policy that misses a flow. The log names
      # the source pod, the destination and the port.
      #
      # Then the live fixture: a pod with no network label dials Postgres. The
      # policy must refuse it, and Hubble must show the drop. Without that the
      # first half could pass on a cluster that records no flow at all.
      - name: No flow of the release is dropped by a network policy
        run: |
          set -euo pipefail
          python3 scripts/check-hubble-drops.py --namespace "$NS" --since "$HUBBLE_SINCE"

          echo "▶ the fixture: a pod with no client label dials Postgres"
          fixture_since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          kubectl -n "$NS" apply -f - <<YAML
          apiVersion: v1
          kind: Pod
          metadata:
            name: hubble-proof-unlabeled
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: dial
                image: ghcr.io/zeroroot-ai/mirror/curl:8.10.1
                command: ["sh", "-c", "curl -sS --max-time 10 telnet://platform-postgres-rw.${NS}.svc:5432 </dev/null; exit 0"]
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
          YAML
          kubectl -n "$NS" wait --for=jsonpath='{.status.phase}'=Succeeded pod/hubble-proof-unlabeled --timeout=180s
          python3 scripts/check-hubble-drops.py --namespace "$NS" --since "$fixture_since" \
            --expect-drop hubble-proof-unlabeled
          kubectl -n "$NS" delete pod hubble-proof-unlabeled --wait=false

      - name: Diagnose a failure
        if: failure()
        run: |
          echo "=== node capacity: what the runner actually gave us ==="
          kubectl describe node | sed -n '/Capacity:/,/System Info/p' || true
          echo "=== pods ==="
          kubectl get pods -A -o wide || true
          echo "=== anything evicted, and why ==="
          kubectl get pods -A --field-selector status.phase=Failed -o wide || true
          kubectl get events -A --field-selector reason=Evicted | head -40 || true
          # A Job that hits activeDeadlineSeconds has its pod REAPED, so by the
          # time this step runs `kubectl logs job/...` has nothing to read and
          # reports "timed out waiting for the condition" — which looks like
          # the Job's own output and is not. That cost a run to notice. So dump
          # what SURVIVES the pod: the Job object, and the namespace's events.
          echo "=== the hook Jobs ==="
          kubectl -n "$NS" get jobs || true
          for j in $(kubectl -n "$NS" get jobs -o jsonpath='{range .items[?(@.status.failed)]}{.metadata.name}{"\n"}{end}' 2>/dev/null); do
            echo "--- describe job/$j (survives the pod)"
            kubectl -n "$NS" describe "job/$j" || true
            echo "--- logs job/$j (empty if the pod was already reaped)"
            kubectl -n "$NS" logs "job/$j" --tail=120 --all-containers --ignore-errors=true 2>&1 | head -120 || true
          done
          echo "=== events, newest last: these outlive every pod ==="
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -60 || true

          # first-admin waits for the tenant-operator to seed a Tenant and
          # report status.zitadelOrgID. If that never happens the Job can only
          # time out, so the Tenant's own status is the answer.
          echo "=== tenants, which is what first-admin waits on ==="
          kubectl -n "$NS" get tenants -o wide || true
          kubectl -n "$NS" get tenants -o yaml | head -120 || true
          echo "=== the operators that would seed it ==="
          kubectl -n "$NS" logs deploy/gibson-platform-operator --tail=60 || true
          kubectl -n "$NS" logs deploy/gibson-tenant-operator --tail=60 || true
          echo "=== secret plane ==="
          kubectl get externalsecrets -A || true
          kubectl get clustersecretstore -o yaml || true
