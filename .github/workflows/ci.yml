# ----------------------------------------------------------------------------
# The merge gate. Every other workflow in this repo runs on push to main, on a
# schedule, or on a release — so until this file existed, nothing at all ran on
# a pull request and any change could merge.
#
# That was not a deliberate choice: the chart source moved here in the
# 2026-09-04 split (ADR-0086) and ci.yml did not come with it.
#
# THE INSTALL PROOF RUNS AFTER THE MERGE (owner decision 2026-10-05, ADR-0080).
# No workflow of this repo installs the chart on a cluster on a pull request.
# The exit tests install the PUBLISHED chart on main, daily and on dispatch:
# exit-test-published-install-kind, exit-test-published-upgrade-kind. A chart that renders and does not install
# is found there, after the merge, and fixed forward.
#
# What it runs is `make check`, the offline gate set: the golden
# snapshots for every profile, the vendored-attribution guard, and the
# cloud-free assertion. Those already existed and already passed. The defect
# was that nothing invoked them before a merge.
#
# ADR-0080: exit tests never run on a pull request. This is not an exit test. It
# needs no cluster, no cloud and no secret, which is exactly why it can gate.
# ----------------------------------------------------------------------------
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset requires the context `ci-required`. Keep this job's name in step
  # with rulesets/repo/charts.json in zeroroot-ai/.github, or the branch blocks
  # on a check that never reports.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    # `make check` took 13.5 minutes before the admission-cel gate. A cold
    # download of its Go modules adds about 1.5 minutes. The 15-minute cap
    # cancelled a run 10 ms after every gate passed (charts#609). The gates
    # added since then (the OpenBao and lease simulation tests, the Envoy
    # cluster render) bring the green runs to a median of 15.8 and a maximum
    # of 19.7 minutes (27 runs, 2026-10-12), and the 20-minute cap cancelled
    # the release PR charts#654 at 20m17s while its last gates ran. 30 minutes
    # leaves room for a slow runner and still ends a hung job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.18.4

      # bats, for `make check`'s purge-tenant-backup gate (tests/*.bats).
      # From its pinned release on GitHub, not from apt: the Ubuntu mirror
      # hung this step past the job timeout on 2026-10-07 (charts#541).
      - name: Install bats
        run: |
          scripts/install-bats.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # actionlint, for `make check`'s workflows gate. A workflow with a bad
      # expression is rejected by GitHub at dispatch and reports failure with
      # no jobs and no log, so the merge gate is the only place to catch it.
      - name: Install actionlint
        run: |
          set -euo pipefail
          ver=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint --version
          # kubeconform, for `make check`'s kubeconform gate: the render must
          # validate against the Kubernetes and CRD schemas. Pinned by version
          # and by the checksum of the release archive.
          kc=v0.8.0
          kc_sha=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${kc}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tgz
          echo "${kc_sha}  /tmp/kubeconform.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
          kubeconform -v
          # promtool, for `make check`'s alert-rules-test gate (charts#446).
          # Pinned by version and by the checksum of the release archive.
          pv=3.15.0
          pv_sha=2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${pv}/prometheus-${pv}.linux-amd64.tar.gz" -o /tmp/prometheus.tgz
          echo "${pv_sha}  /tmp/prometheus.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/prometheus.tgz -C /usr/local/bin --strip-components=1 "prometheus-${pv}.linux-amd64/promtool"
          promtool --version
          # bao, for `make check`'s openbao-seal-legacy-id gate: a real
          # OpenBao server with file storage, the version of the chart image
          # (charts#605). Pinned by the checksum of the release archive
          # (checksums-linux.txt of the release).
          bv=2.5.3
          bv_sha=74e8ce7753ac205528f93148c47c91f417bea1ce21ddb126969bf3ef5598cadd
          curl -fsSL "https://github.com/openbao/openbao/releases/download/v${bv}/bao_${bv}_Linux_x86_64.tar.gz" -o /tmp/bao.tgz
          echo "${bv_sha}  /tmp/bao.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/bao.tgz -C /usr/local/bin bao
          echo "BAO_BIN=/usr/local/bin/bao" >> "$GITHUB_ENV"
          bao version

      # Go, for `make check`'s admission-cel gate: it compiles the CEL of each
      # rendered ValidatingAdmissionPolicy with the API server compiler
      # (k8s.io/apiserver), offline (charts#601).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: tools/admission-cel/go.mod
          cache-dependency-path: tools/admission-cel/go.sum

      # `make check` runs `chart-deps`, which pulls subcharts from ghcr. The
      # packages are public, but an unauthenticated pull is rate-limited by IP
      # and shared runners exhaust that quota. Logging in costs nothing and
      # removes a class of flake that looks like a chart error.
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # golden + attribution + cloud-free. Any drift in a rendered profile fails
      # here as a snapshot diff, which is also what carries the randAlphaNum ban
      # since tools/cross-chart-check was deleted (ADR-0014).
      # `make check` includes the subchart-overrides guard, which reads the
      # org version-link manifest. The default token can check out the org
      # repo the same way pr-title-lint does (charts#14).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zeroroot-ai/.github
          ref: main
          path: org-dot-github

      - name: make check
        env:
          VERSION_LINKS: org-dot-github/version-links.yaml
        run: make check

  # The air-gap manifest is generated from the chart render and gibson's
  # component catalog. This job proves the committed copy is current; without
  # it the manifest drifts silently, which is deploy#1171 all over again. The
  # job lived in the deleted deploy repo as airgap-image-list.yml and did not
  # move with the chart.
  airgap-image-list:
    name: airgap-image-list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.18.4

      # Same reason as ci-required: the generator vendors the sub-charts from
      # ghcr, and an anonymous pull is rate-limited by IP.
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # GH_TOKEN lifts the anonymous GitHub API rate limit for the catalog
      # read; the gibson repo is public, so no wider scope is needed.
      - name: Air-gap image manifest matches the chart and gibson's catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./airgap/generate-image-list.py --check
