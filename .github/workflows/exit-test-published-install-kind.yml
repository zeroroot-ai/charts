# The PUBLISHED chart installs on kind.
#
# kind is the one CI cluster (D89). It runs Cilium, so each policy that this
# chart ships is enforced here.
#
# The steps are NOT here. They live in published-install.yml, and each kind
# exit test calls the same ones, so they cannot drift into different claims
# (ADR-0027).
#
# CADENCE. On push to main and on dispatch, never on a pull request
# (ADR-0080). A published artifact only changes when a release publishes, so a
# per-PR run would measure the same artifact repeatedly and block unrelated
# work.
name: exit-test-published-install-kind

on:
  push:
    branches: [main]
    paths:
      - 'scripts/baseline-up.sh'
      - 'helm/kind-config.yaml'
      - '.github/workflows/published-install.yml'
      - '.github/workflows/exit-test-published-install-kind.yml'
  workflow_dispatch:
    inputs:
      chart_version:
        description: The published chart version to install (default, the newest)
        required: false
        type: string

concurrency:
  group: exit-test-published-install-kind-${{ github.ref }}
  # A run that started finishes. On main an exit test is the proof (ADR-0080),
  # so a newer push queues behind it and does not cancel it (charts#625).
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install:
    uses: ./.github/workflows/published-install.yml
    with:
      chart_version: ${{ inputs.chart_version }}
    secrets: inherit
