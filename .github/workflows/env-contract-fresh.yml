# The vendored env-reader contracts match the repositories they came from.
#
# `helm/contracts/<service>-env-readers.txt` is the consumer half of ADR-0094
# layer 2: the chart injects env vars into containers built from other repos, so
# `check-env-consumed.py` compares what the render injects against a COMMITTED
# copy of each service's reader set. That copy is produced by
# `scripts/gen-env-readers.py`, which reads SIBLING CHECKOUTS on whoever's
# machine ran `make env-contract-sync`.
#
# Until this workflow existed, nothing re-ran it. `make env-contract-fresh` was
# a target no job called and `make check` did not include it, so the gate
# measured a snapshot of an unknown date. Measured 2026-10-02: two of the five
# contracts were stale on main — the dashboard had dropped TEST_AUTH_BYPASS and
# gibson had gained a literal. Neither changed a verdict, which is luck, not a
# property. A reader set that is MISSING a name makes the gate report a LIVE env
# var as dead, and deleting one of those is how a previous attempt at the values
# gate rendered a Job with `image: ":"`.
#
# CADENCE. On push to main and daily, never on a pull request (ADR-0012): the
# contract can go stale because another repository moved, which no PR here
# touches, so a per-PR run measures the wrong thing and blocks unrelated work.
#
# It checks out every source repository as a sibling, exactly as
# gen-env-readers.py resolves them. `billing` is private, so it needs a token
# with read access; the others are public and the default token reaches them.
name: env-contract-fresh

on:
  push:
    branches: [main]
    paths:
      - 'helm/contracts/**'
      - 'scripts/gen-env-readers.py'
      - '.github/workflows/env-contract-fresh.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: env-contract-fresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    steps:
      # The chart, at <workspace>/charts, because gen-env-readers.py resolves a
      # service repo as a SIBLING of the chart checkout.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: charts

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: zeroroot-ai/gibson
          ref: main
          path: gibson

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: zeroroot-ai/dashboard
          ref: main
          path: dashboard

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: zeroroot-ai/setec
          ref: main
          path: setec

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: zeroroot-ai/docs-site
          ref: main
          path: docs-site

      # billing is the one private source repository, so it needs the org's
      # read-only PAT — the same secret published-install.yml uses for hosted.
      #
      # Checked BEFORE the checkout, because the checkout's own failure does not
      # name the cause: a token that cannot see a private repository gets a 404,
      # git decides it might need to log in, and the log reads "fatal: could not
      # read Username for 'https://github.com'", which is equally consistent
      # with a missing token and a wrong one.
      - name: The billing token works
        env:
          T: ${{ secrets.GH_PAT_PLATFORM_RO }}
        run: |
          set -euo pipefail
          if [ -z "$T" ]; then
            echo "::error::GH_PAT_PLATFORM_RO is empty in this repository. It is an org secret; check its visibility includes PUBLIC repositories — 'Private repositories' silently excludes this one."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/zeroroot-ai/billing)
          case "$code" in
            200) echo "✓ the token reads zeroroot-ai/billing" ;;
            401) echo "::error::GH_PAT_PLATFORM_RO is set but GitHub rejects it (401 Bad credentials). A PAT begins ghp_ or github_pat_. Mint one at https://github.com/settings/personal-access-tokens with resource owner zeroroot-ai, repository zeroroot-ai/billing, permission Contents: Read-only."; exit 1 ;;
            403) echo "::error::GH_PAT_PLATFORM_RO authenticates but is forbidden (403) on zeroroot-ai/billing. Check SSO authorization for the zeroroot-ai organization."; exit 1 ;;
            404) echo "::error::GH_PAT_PLATFORM_RO authenticates but cannot see zeroroot-ai/billing (404). A fine-grained token must list that repository explicitly and grant Contents: Read-only."; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code asking GitHub about zeroroot-ai/billing"; exit 1 ;;
          esac

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: zeroroot-ai/billing
          ref: main
          path: billing
          token: ${{ secrets.GH_PAT_PLATFORM_RO }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: every vendored contract matches its source repository
        working-directory: charts
        run: make env-contract-fresh
