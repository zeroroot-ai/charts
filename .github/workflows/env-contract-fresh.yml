# The vendored contracts match the repositories they came from, AT THE PINNED TAG.
#
# `helm/contracts/<service>-env-readers.txt` is the consumer half of ADR-0094
# layer 2: the chart injects env vars into containers built from other repos, so
# `check-env-consumed.py` compares what the render injects against a COMMITTED
# copy of each service's reader set. `scripts/gen-env-readers.py` produces that
# copy, and `scripts/gen-config-keys.py` produces the config key contract.
#
# WHAT IT COMPARES. Each contract describes the code inside an image, and the
# chart pins that image by release tag. So the comparison is against that tag
# (scripts/pinned_source.py reads it from airgap/images.txt). The first version
# of this workflow compared against each service's `main`. `main` moves with
# every merge, so the run was red on the day after each sync: it measured the
# distance from a release to `main`, which is never zero and is not a defect.
#
# The PR-time half is `make contract-pins` in `make check`: a PR that moves an
# image pin and does not regenerate the contract fails there, offline. This
# workflow is the half that needs the source repositories: it proves that the
# committed copy is what the generator produces from the tagged source.
#
# CADENCE. On push to main and daily, never on a pull request (ADR-0080).
#
# NO PERSONAL TOKEN. Every source repository here is public. `billing` was the
# one private checkout, for a contract that governed no rendered container. The
# contract is gone, and with it the long-lived token (charts#303).
#
# FULL HISTORY WITH TAGS. The generators run `git archive <tag>` in each clone,
# so each checkout fetches its tags. The checked-out ref does not matter.
name: env-contract-fresh

on:
  push:
    branches: [main]
    paths:
      - 'helm/contracts/**'
      - 'scripts/gen-env-readers.py'
      - 'scripts/gen-config-keys.py'
      - 'scripts/gen-operator-rbac.py'
      - 'scripts/gen-grpc-methods.py'
      - 'scripts/pinned_source.py'
      - 'airgap/images.txt'
      - '.github/workflows/env-contract-fresh.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: env-contract-fresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    steps:
      # The chart, at <workspace>/charts, because gen-env-readers.py resolves a
      # service repo as a SIBLING of the chart checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: charts

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zeroroot-ai/gibson
          path: gibson
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zeroroot-ai/dashboard
          path: dashboard
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zeroroot-ai/setec
          path: setec
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: zeroroot-ai/docs-site
          path: docs-site
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: every vendored contract matches its source repository at the pinned tag
        working-directory: charts
        run: make env-contract-fresh
