# CodeQL for charts (ADR-0018, charts#378).
#
# CodeQL is the one data-flow gate in CI. charts holds Python and shell guard
# scripts and GitHub Actions workflows. This workflow calls the shared CodeQL
# workflow of zeroroot-ai/.github for the `python` and `actions` languages,
# with the `security-extended` suite that the shared workflow sets.
#
# Alerts stay in the Security tab. No workflow opens an issue for an alert.
#
# This advanced setup replaces the CodeQL default setup of the repository.
# GitHub refuses the results of an advanced setup while the default setup is
# on, so the default setup is turned off when this workflow merges.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@5d38e1f714d47b502cf18709a7d5e63430155f62 # v0.16.0
    with:
      languages: '["python","actions"]'
      # The golden files are rendered YAML, not code.
      paths-ignore: |
        helm/testdata/**
