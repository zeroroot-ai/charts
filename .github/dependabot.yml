version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
      actions-deps:
        patterns:
          - '*'
        exclude-patterns:
          - github/codeql-action*
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
  # The admission-cel guard compiles policies with the API server compiler.
  # Its k8s.io modules follow the Kubernetes minor of the clusters.
  - package-ecosystem: gomod
    directory: /tools/admission-cel
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      k8s:
        patterns:
          - 'k8s.io/*'
    commit-message:
      prefix: chore(deps)
