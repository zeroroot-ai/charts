apiVersion: v2
name: gibson-gateway-crd-files
description: |
  The CustomResourceDefinitions of agentgateway and of the Gateway API
  (charts#815). The umbrella installs the agentgateway controller and renders
  a Gateway, an AgentgatewayParameters and AgentgatewayPolicy objects. Helm
  refuses a CRD and a CR of it in one release (deploy#1627), so the CRDs ship
  here, as a dependency of gibson-crds, the release that installs first.

  files/crds/*.yaml are GENERATED by scripts/vendor-gateway-crds.py from the
  agentgateway version that helm/gibson/Chart.yaml pins and from the pinned
  Gateway API release asset. `make vendor-gateway-crds-check` fails when they
  drift. They are included through .Files.Get, like the operator CRDs.

  WHY A SUBCHART AND NOT FILES OF gibson-crds. A Helm release record is one
  Secret with a 1 MiB cap, and it stores the files of the top-level chart AND
  the rendered manifest. A dependency's files are not stored in the record,
  only what they render, so these bytes count once here.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
maintainers:
  - name: Zero Root AI
    email: team@zeroroot.ai
keywords:
  - gibson
  - crds
home: https://github.com/zeroroot-ai/charts
sources:
  - https://github.com/zeroroot-ai/charts
