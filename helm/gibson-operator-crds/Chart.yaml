apiVersion: v2
name: gibson-operator-crds
description: |
  The CustomResourceDefinitions of the cluster operators the gibson umbrella
  owns as subcharts (deploy#1728): cert-manager, external-secrets
  and the CloudNativePG operator. The umbrella renders CRs of all three, and
  Helm refuses a CRD and a CR of it in one release (deploy#1627), so the
  subcharts render with CRDs off and the CRDs ship here, as a dependency of
  gibson-crds, the release that installs first.

  files/crds/*.yaml are GENERATED by scripts/vendor-operator-crds.py from the
  exact chart versions helm/gibson/Chart.yaml pins, and CI fails when they
  drift (`make check-operator-vendoring`). They are included through
  .Files.Get rather than placed under templates/ because the CRD descriptions
  carry `{{ }}` examples that Helm would try to render.

  WHY A SUBCHART AND NOT FILES OF gibson-crds. A Helm release record is one
  Secret with a 1 MiB cap, and it stores the top-level chart's own files AND
  the rendered manifest. Four megabytes of CRDs as top-level files count
  twice and the install fails with "Secret ... Too long". A dependency's
  templates are not stored in the record, only what they render, so the same
  bytes count once here. Measured on kind, 2026-09-01.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
maintainers:
  - name: Zero Root AI
    email: team@zeroroot.ai
keywords:
  - gibson
  - crds
home: https://github.com/zeroroot-ai/deploy
sources:
  - https://github.com/zeroroot-ai/deploy
