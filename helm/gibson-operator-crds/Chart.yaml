apiVersion: v2
name: gibson-operator-crds
description: |
  The CustomResourceDefinitions of the cluster operators the gibson umbrella
  owns as subcharts: cert-manager, external-secrets and the CloudNativePG
  operator. Its own release, installed before the platform.

  WHY THIS CHART IS EMPTY, and the CRDs live one level down in
  gibson-operator-crd-files:

  A Helm release record is ONE Secret and the API server caps a Secret at
  1048576 bytes. The record holds the rendered manifest AND the top-level
  chart's own templates/ and files/, base64 inside the JSON. A dependency's
  files are NOT stored — only what they render into the manifest. So the same
  3828 KB of vendored CRDs count TWICE when they are this chart's own files
  and ONCE when they belong to a subchart.

  Measured 2026-09-14 on a kind cluster (charts#82): as top-level files, the
  record blew the cap outright and `helm install` failed. Behind the file://
  dependency it is the manifest alone. This indirection is load-bearing, not
  organisational — moving the files back up here breaks the install.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
maintainers:
  - name: Zero Root AI
    email: team@zeroroot.ai
keywords:
  - gibson
  - crds
home: https://github.com/zeroroot-ai/charts
sources:
  - https://github.com/zeroroot-ai/charts
annotations:
  org.opencontainers.image.source: https://github.com/zeroroot-ai/charts

dependencies:
  - name: gibson-operator-crd-files
    version: "0.1.0"
    repository: "file://../gibson-operator-crd-files"
