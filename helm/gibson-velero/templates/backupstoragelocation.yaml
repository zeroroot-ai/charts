{{- /*
The one BackupStorageLocation. Rendered here rather than by the sub-chart
because this is the object whose shape the platform pins.

No `credential` block on purpose. A BSL credential is an API read of a Secret
through the velero server's cached client; the bucket credential is a MOUNTED
file instead (velero.credentials.existingSecret -> AWS_SHARED_CREDENTIALS_FILE),
which the kubelet supplies and no RBAC covers. That keeps the Secret the
server reads down to exactly one, the kopia repository password.
*/}}
{{- $bucket := .Values.bucket }}
{{- if not $bucket.name }}
{{- fail "bucket.name is required: Velero writes to the durable bucket stage 0 created. There is no default that is safe to invent." }}
{{- end }}
{{- $onAWS := not (trim $bucket.endpoint) }}
{{- /* On AWS S3 the bucket is addressed by host, <bucket>.s3.<region>.amazonaws.com,
       because the network policy opens only that host: the regional host
       s3.<region>.amazonaws.com of path-style addressing reaches each bucket of
       S3 (GHSA-3wg5). A name with a dot breaks the TLS name of that host. */}}
{{- if and $onAWS (contains "." $bucket.name) }}
{{- fail (printf "bucket.name (%s) has a dot: on AWS S3 the bucket is addressed by host, and a dot breaks the TLS name of <bucket>.s3.<region>.amazonaws.com" $bucket.name) }}
{{- end }}
{{- if not (hasPrefix "backups/" $bucket.prefix) }}
{{- fail (printf "bucket.prefix (%s) must sit under backups/: retention is the bucket lifecycle rule on that prefix and nothing else." $bucket.prefix) }}
{{- end }}
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  annotations:
    # NOT a hook (charts#190). As an Argo Sync hook this object never updated
    # after the first sync: Argo leaves hooks out of the diff, so a chart bump
    # that changed only this object left the Application Synced, and auto-sync
    # never ran the hook again. Staging kept a stale Schedule for hours after
    # 0.132.1 shipped the k3s excludes.
    #
    # The CRD ordering the hook used to provide comes from elsewhere now:
    #   plain helm  the velero sub-chart ships its CRDs in crds/, which Helm
    #               applies and waits for before it renders any template
    #   Argo        the sync wave below runs after the CRDs, and
    #               SkipDryRunOnMissingResource stops the dry run from
    #               refusing a kind the same sync is about to register
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # After the server Deployment: a location the controller cannot reconcile
    # yet reports its phase as empty, which reads as a failure.
    argocd.argoproj.io/sync-wave: "10"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backup-storage-location
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider: aws
  default: true
  # The platform credential can write and read and cannot delete, so a
  # ReadWrite location never prunes: the bucket lifecycle rule owns removal.
  accessMode: ReadWrite
  validationFrequency: {{ .Values.bucket.validationFrequency | quote }}
  objectStorage:
    bucket: {{ $bucket.name | quote }}
    prefix: {{ $bucket.prefix | quote }}
  config:
    region: {{ $bucket.region | quote }}
    s3ForcePathStyle: {{ ternary "false" ($bucket.forcePathStyle | toString) $onAWS | quote }}
    {{- with $bucket.endpoint }}
    # Empty on AWS: the plugin then resolves the regional S3 endpoint itself.
    s3Url: {{ . | quote }}
    {{- end }}
