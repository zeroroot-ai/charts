# =============================================================================
# gibson-workloads Chart Values
# Lifted from the umbrella gibson chart (Phase 7.5-7.8 of
# deploy-architecture-refactor spec). The values shapes are carried forward
# verbatim — pragmatic decomposition, not pristine. Clean-up is a follow-up.
# =============================================================================
# Original file header:
# Gibson Unified Helm Chart - Default Values
# =============================================================================
# This is the default configuration for deploying the complete Gibson stack.
# For Kind cluster deployment, use: helm install -f values-kind.yaml
# For production deployment, use: helm install -f values-production.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Global Configuration
# -----------------------------------------------------------------------------
global:
  # `global.toolImage` (the alpine-k8s tool image) comes from the umbrella,
  # helm/gibson/values.yaml, and has no copy here on purpose: a standalone
  # render of this chart must set it.
  # (deploy#1733): OpenBao is the one External Secrets backend, so
  # `secretBackend` and `secretPrefix` are DELETED. Setting either fails the
  # render (gibson.assertSecretKnobsDeleted).
  # Image pull secrets for private registries
  imagePullSecrets:
    - name: ghcr-credentials
  # Storage class for persistent volumes (leave empty for default)
  storageClass: ""
  # Single replica count used by dev overlays to reduce resource usage.
  # Leave unset (nil) in production; each component has its own replicas.
  replicas: ~
  # Allow non-standard images (required for redis-stack)
  security:
    allowInsecureImages: true
  # Public DNS suffix and the SINGLE SOURCE OF TRUTH for every external
  # hostname the platform serves or claims. The gibson-common domain
  # helpers (gibson.appHost / gibson.externalOrigin / gibson.oidcIssuer /
  # gibson.zitadelExternalDomain / gibson.tlsSans) derive everything from
  # this — no template, chart, or service hardcodes a hostname (deploy#630).
  # There is no default. The profile or the environment overlay sets it, and
  # gibson.domain fails the render when it is empty, so an install cannot
  # claim the OIDC issuer, the TLS SANs and the app hosts of a domain the
  # installer does not own.
  domain: ""
  # URL scheme for the external origin. Default https; rarely overridden.
  scheme: "https"
  # External port appended to the public origin when non-default. In kind
  # the Envoy edge is a NodePort on :30443, so app.<domain>:30443 is the
  # real origin; in prod the edge is on :443 and this is empty (no suffix).
  # Set in values-kind.yaml. "443" is treated as default (no suffix).
  externalPort: ""

# -----------------------------------------------------------------------------
# Service-account identity (canonical-service-identity spec)
# -----------------------------------------------------------------------------
# Canonical list of platform service accounts whose Zitadel-numeric-sub
# mapping must exist in the gibson-sa-identity-map ConfigMap before any
# downstream consumer rolls. The post-install Zitadel bootstrap Job creates
# each SA and writes its returned numeric userId into the ConfigMap; the
# fga-init Job reads the ConfigMap to seed FGA tuples by numeric sub; the
# dashboard's resolver init container reads the ConfigMap to populate
# ALLOWED_SERVICE_SUBJECTS with comma-joined numeric subs.
#
# Readable names appear ONLY here (human input) and in log enrichment
# (operator-visible output). Auth decisions everywhere else use the numeric
# sub.
#
# Adding a new platform SA:
#   1. Append the readable name to this list.
#   2. Add an `ensure_machine_user` invocation in templates/zitadel/post-install-job.yaml.
#   3. Downstream consumers pick up the new numeric sub on their next deploy.
serviceAccounts:
  required:
    - gibson-iam-admin
    - gibson-tenant-operator
    - gibson-dashboard-sa
    # gibson-tool-runner-sa was REMOVED (deploy#1176): the tool runner was
    # renamed to gibson-executor and, , runs only as a setec
    # microVM guest image launched by the daemon's catalog refresher — it is
    # NOT a platform workload and holds no Zitadel machine user. Its Zitadel
    # SA already went away with the client_credentials runtime model
    # (sdk#306; see zitadelServiceAccounts below and
    # templates/fga-init/job.yaml) and the umbrella already dropped the name
    # from its own required list (deploy#826). Listing it here minted a
    # dangling machine user the sa-identity-map never resolves, so the
    # dashboard's resolve-sa-identity-map init waited on it forever.

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
# These can be provided via .env file or directly in values
# -----------------------------------------------------------------------------
# Gibson Core Daemon
# -----------------------------------------------------------------------------
# gibson daemon is structural infrastructure (one-code-path /
# deploy#188): it is the orchestrator that every dashboard call,
# tenant-operator Entitlements check, callback agent, and tool runner
# routes through. The previous `enabled: true|false` substitution
# toggle has been deleted — the platform cannot run without it.
# Sub-feature toggles on this block
# (`podDisruptionBudget.enabled`, `serviceAccount.create`,
# `config.metrics.enabled`, etc.) remain legitimate.
# -----------------------------------------------------------------------------
# Registration rung (ADR-0074, charts#374). One value, one of three names:
#
#   closed    every signup is refused, and /signup redirects to /login. A
#             platform admin provisions each tenant through the admin API.
#   approval  anyone may register, and an administrator approves each account
#             before it is usable. No mail transport is needed.
#   open      self-serve signup, with no card (the OSS default).
#
# The chart renders SIGNUP_SELF_SERVE on the daemon and on the dashboard from
# this one value (gibson.registrationKnob), so the two cannot disagree. The
# render fails on any other name.
#
# SECURITY NOTE: on `open`, an internet-exposed install lets any reachable
# user create an account. A public self-hosted install that does not want
# that sets `approval` or `closed`.
# -----------------------------------------------------------------------------
registration: open

gibson:
  # platformTenant is the slug of the install tenant (GIBSON_PLATFORM_TENANT).
  # The e2e runner tenancy and the Neo4j APOC check of the daemon read it. A
  # plugin does not: each tenant runs its own plugin instance, which the
  # tenant-operator deploys (gibson#815).
  platformTenant: ""

  # Audit export to the durable bucket (ADR-0113, charts#446). The daemon
  # writes each audit record to audit/<tenant>/ in this bucket, with an object
  # lock, and retention removes only rows it exported. On prem, name the
  # S3-compatible store of the customer.
  #
  # THERE IS NO DEFAULT BUCKET and no default lock mode, as for
  # platformPostgres.backup: the render fails without them. The bucket is
  # the one in platformPostgres.backup.destinationPath (the umbrella fails
  # when the two differ). baseline-up.sh fills bucket, endpoint and region
  # from substrate.env; an environment overlay sets the lock to the values
  # of its bucket policy (audit_lock_mode and audit_retention_days in
  # hosted substrate/gibson-bootstrap).
  auditExport:
    bucket: ""
    # The S3 API endpoint. Empty means AWS S3 in the region below.
    endpoint: ""
    region: "us-east-1"
    # GOVERNANCE or COMPLIANCE. It must be the mode the bucket policy
    # requires under audit/, or each write is refused.
    lockMode: ""
    # At least the retention of the bucket policy. 2192 days is six years.
    lockDays: 2192
    # The platform bucket credential: the BUCKET_ACCESS_KEY and
    # BUCKET_SECRET_KEY members of the bringup keyring, which the bringup
    # writes as the bringup-keyring Secret before the chart syncs. The same
    # credential archives the platform Postgres WAL.
    credentials:
      accessKeyIdSecret:
        name: "bringup-keyring"
        key: "bucket-access-key"
      secretAccessKeySecret:
        name: "bringup-keyring"
        key: "bucket-secret-key"
  # The neutral connection points (ADR-0060, charts#375). Empty in the core
  # chart; the private overlay that ships the billing component sets them.
  #   signupStepUrl            GIBSON_SIGNUP_STEP_URL: the external signup step
  #   signupStepCompleterPath  the SPIFFE path (under the trust domain) of the
  #                            only caller that may complete a signup step
  #   tenantActivationPath     the SPIFFE path of the only caller that may
  #                            activate a tenant
  connectionPoints:
    signupStepUrl: ""
    signupStepCompleterPath: ""
    tenantActivationPath: ""

  # Dispatch policy gate defaults.
  # Spec setec-sandbox-prod-default Task 35 / R3.1.
  #
  # Setec gating removed 2026-05-10 (operator decision: unlimited usage).
  # The dispatch policy gate, override RPC, per-tenant detonation quota,
  # circuit breaker, health probe, and startup self-check were all dropped.
  # Tools dispatched as SANDBOXED still route through Setec for hardware
  # isolation, but no daemon-side gates limit concurrency or block dispatch.
  # The dispatchPolicy values block (untrustedContent / trustedContent /
  # strictDefaultUntrusted) was deleted as part of the gate removal.


  # Spec 3 §3 — HA primitives. Daemon stays at fixed replicas (HPA deferred
  # until Spec 4's shared checkpoint state). PDB auto-on when replicas > 1.
  podDisruptionBudget:
    enabled: ~        # auto-on when replicas > 1
  topologySpreadConstraints: ~  # falls back to chart-default zone-spread.

  # Entitlements seam knob (/ deploy#1032).
  # The deployment-profile seam for the EntitlementsService gRPC boundary.
  #
  # Unset (default, self-hosted profile): the daemon uses the embedded OSS
  # ConfigProvider (no-op, unlimited). No entitlements workload is deployed.
  #
  # Set (SaaS profile, via the gitops SaaS overlay): the daemon dials the
  # remote EntitlementsService at this address over SPIFFE mTLS. The SaaS
  # overlay chart (helm/saas-overlay/entitlements-svc) deploys the actual
  # Service and sets this knob via gitops composition.
  #
  # Format: "<service-name>:<port>" (e.g. "gibson-entitlements-svc:9091")
  # Leave empty for self-hosted installs — do NOT set a no-op literal value.
  entitlementsEndpoint: ""

  # Entitlements-required guard (/ deploy#1055, gibson#1097+#1098).
  #
  # SaaS profile ONLY. When true the daemon refuses to serve if the
  # entitlements seam fails to wire at boot — it fails closed instead of
  # silently falling back to the unlimited OSS ConfigProvider. Never set this
  # on a self-hosted install; the fail-open unlimited posture is correct there.
  #
  # INVARIANT (deploy#1055 guard): if entitlementsEndpoint is set, this MUST
  # be true. Nothing enforces it at render time.
  #
  # Maps to GIBSON_ENTITLEMENTS_REQUIRED env on the daemon StatefulSet.
  # Leave unset (empty) for self-hosted installs (the default here).
  entitlementsRequired: false

  # Capability-Grant JWT signing key (GHSA-3957, gibson#1288).
  #
  # The daemon mounts templates/secrets/cg-signing-key.yaml at
  # /etc/gibson/cg-signing-key and reads current.kid / current.key from it. With
  # nothing mounted it derives the signing key from the master KEK instead —
  # unrotatable in practice, because rotating the KEK re-keys every tenant
  # secret in the platform, so one key signs every Capability-Grant JWT for the
  # life of the install.
  #
  # There is no `enabled` toggle. The mount is unconditional and the volume is
  # `optional: true`, so an install whose secrets backend has no entry yet
  # degrades to the KEK derivation with a loud daemon warning instead of
  # failing to start. Seeding the backend is what turns it on.
  cgSigningKey:
    # Where the Secret is projected. Must match the daemon's default
    # (cgSigningKeyDir() in internal/server/daemon/capabilitygrant_register.go)
    # unless GIBSON_CGJWT_SIGNING_KEY_DIR is also changed — the chart sets that
    # env var from this value, so they cannot drift.
    mountPath: /etc/gibson/cg-signing-key
    # Rotation window. FALSE in steady state.
    #
    # true projects previous.kid / previous.key alongside the current pair, so
    # grants signed under the outgoing key still verify while they expire.
    # Only flip it AFTER seeding gibson-cg-signing-key-previous in the backend:
    # the daemon treats a previous.kid file that exists but is empty as a broken
    # mount and disables capability grants entirely — it does not degrade.
    # The four steps are in templates/secrets/cg-signing-key.yaml.
    rotationWindow: false

  # Product-surface origin (gibson#1228 companion, deploy signup-email-delivery).
  #
  # GIBSON_APP_URL — the host that serves the dashboard's signup / sign-in
  # pages (app.<domain>). The daemon's self-serve signup flow builds the
  # emailed verification link from this, and ONLY this. It is deliberately
  # distinct from GIBSON_PUBLIC_URL below, which is the API-plane origin
  # (api.<domain>) and serves no product routes — a verification link built
  # from GIBSON_PUBLIC_URL resolves to nothing, and the signup can never be
  # completed.
  #
  # Empty (default) → the chart derives "<scheme>://app.<global.domain>[:port]"
  # via the gibson.externalOrigin helper (the same origin the dashboard, the
  # OIDC issuer and the redirect-URI prefix already use), so most overlays
  # never need to set this explicitly. Override only when the product surface
  # is served from a non-standard host.
  appUrl: ""

  # Expected Go toolchain the deployed daemon image was built against.
  # Spec: security-hardening Requirement 5. When non-empty, the helm test
  # `templates/tests/09-go-toolchain.yaml` runs the deployed daemon image and
  # execs `gibson --version`, then asserts the embedded `go: ...` token
  # (runtime.Version(), from pkg/version.String()) matches this value.
  # Set to "" to skip the test (e.g. for ad-hoc dev images).
  # Bump in lock-step with the `go` directive in github.com/zeroroot-ai/gibson
  # go.mod (currently `go 1.26.5`). If the daemon image is built on a newer
  # toolchain without bumping this pin, `helm test` fails on the drift.
  expectedGoToolchain: "go1.26.5"

  image:
    repository: ghcr.io/zeroroot-ai/gibson
    # Bumped to v0.33.0 in lock-step with the dashboard (v1.7.0) for
    # specs mission-draft-dashboard-wiring and
    # callback-harness-workspace-rpcs.
    #
    # v0.33.0 wires the four mission-draft RPCs
    # (Save/List/Get/Delete) on TenantAdminService to the existing
    # Redis-backed RedisMissionDraftStore (the previous Save and List
    # handlers were Unimplemented stubs); adds the seven
    # HarnessCallbackService Workspace RPCs (List, GetInfo, ReadFile,
    # WriteFile, ListFiles, Commit, Push) so out-of-process callback
    # agents can read/write workspace files and commit/push parity
    # with the in-process DefaultAgentHarness path; and lifts
    # Workspace() and Workspaces() onto the AgentHarness interface
    # so middleware wrappers route correctly.
    #
    # SDK was rev'd to v1.1.0 (additive proto bump for the seven
    # Workspace RPCs + the callbackWorkspace proxy in serve/);
    # consumer go.mod files in ext-authz, gibson-tool-runner, and
    # tenant-operator were bumped no-op for lockstep.
    #
    # Authz-registry OCI artifact follows the gibson tag (v0.33.0)
    # and DOES contain proto-annotation changes — six new RPCs on
    # TenantAdminService (Get/DeleteMissionDraft) and seven new RPCs
    # on HarnessCallbackService (Workspace*). ext-authz init pulls
    # the new artifact at pod startup.
    #
    # v0.34.0 implements the working-memory-persistence spec:
    # checkpoint schema bumped to version 2; working memory and mission
    # memory are now persisted across daemon crashes; parallel-group nodes
    # record per-child ChildStatus so resume re-dispatches only crashed
    # children. BREAKING: run `gibson mission drain --all` before upgrading.
    # Existing version-1 checkpoints will be rejected at resume with a
    # clear error.
    #
    # v0.35.0 wires the daemon's component dispatch + harness ListPlugins
    # bridge into the Window 2 plugin runtime (manifest-driven Descriptor
    # / MethodDescriptor types). PluginInfo gains a Methods []string field
    # populated by extractMethodNames() over component metadata. Pinned
    # to SDK v1.3.0 (BREAKING — Phase 1 plugin types are gone). Spec:
    # vault-refresh-and-plugin-runtime Window 2.
    #
    # v0.35.1 — Dependabot CRITICAL fix: grpc-Go v1.80.0 → v1.81.0
    # (auth bypass via missing leading slash in :path) + docker v28.5.1
    # → v28.5.2 (Moby AuthZ + privilege off-by-one). Pinned to SDK v1.3.1.
    #
    # deploy#789: digest-pinned for staging/prod immutability.
    # The `ghcr.io/zeroroot-ai/gibson` package publishes main/latest/sha-*
    # tags only (no vX.Y.Z), so the digest below is the current `main`
    # (= the staging/prod deploy reality). `<tag>@sha256:<digest>` is a valid
    # OCI reference that kubelet pulls by digest. Re-resolve on every bump:
    #   gh api /orgs/zeroroot-ai/packages/container/gibson/versions
    # dev/kind keeps a moving :main tag (values-kind.yaml) — digest-pin-check
    # exempts the kind overlay. make mirror-digests and the secure-pod image
    # rule check each digest pin.
    #
    # Pinned to commit 3af964a — the v0.128.2 release commit, which contains
    # gibson#1401. That pairing is REQUIRED, not incidental: #1401 makes
    # ext-authz refuse to start unless EXT_AUTHZ_CGJWT_KEYS_URL is https, and
    # this chart now renders https on the daemon's :8086 mTLS listener
    # (deploy#1386). Moving this pin back below #1401 while the template says
    # https bootloops ext-authz cluster-wide. gibson has no v0.128.2 IMAGE tag
    # (only ext-authz does), so the release commit's sha- tag is the honest
    # provenance here; both images pin the same commit deliberately.
    # v0.134.0 is the FLOOR for this pin (deploy#1766): it is the first
    # release whose binary carries the `dump-fga-model` subcommand
    # (gibson#1544 merged three days after v0.133.0 was cut). An older
    # binary treats the argument as noise, starts the daemon, and blocks
    # on the SPIRE socket — so the fga-init Job hangs in dump-model until
    # its deadline and the whole install wedges. Verified on this digest:
    # `gibson dump-fga-model` exits 0 in under a second with the model.
    tag: "v0.157.0@sha256:37c276c4355161baf00daa9b4d38b75e2f43780d8dabe2ef8ba5bdea09ded61a"
    # digest (deploy#1066) — when set, gibson.image renders "<repository>@<digest>"
    # and ignores tag entirely. Accepts bare hex or a "sha256:"-prefixed value.
    # Empty by default: first-party pins are hand-committed in the combined
    # tag form above ("<ref>@sha256:…"), guarded by tools/digest-pin-check,
    # re-pinned by scripts/bump-image-digest.py (deploy#1391 fan-out PRs), and
    # re-resolved against GHCR at package time by publish-umbrella-chart.yml
    # (deploy#1402 — second half).
    digest: ""
    pullPolicy: Always

  # Liveness probe tuning. Overlays (kind) extend the initial delay
  # to accommodate slow startup in resource-constrained environments.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

  replicas: 1

  ports:
    grpc: 50051
    callback: 50001
    registration: 50100
    metrics: 9090

  # Outbound mail: the one value global.email of the umbrella (hosted#223).
  # gibson.email was deleted, and setting it fails the render.

  service:
    type: ClusterIP
    grpc:
      port: 50051
    callback:
      port: 50001
    registration:
      port: 50100
    metrics:
      port: 9090
    # gibson#623 — unauthenticated native-login bootstrap listener
    # (GET /.well-known/gibson-login). Envoy's gibson_native_login cluster
    # STRICT_DNS-resolves gibson-workloads:8085, so this port must be on the
    # Service or the public `gibson login` route times out at the upstream.
    nativeLogin:
      port: 8085
    # deploy#852 — mTLS authz-registry endpoint. ext-authz fetches the
    # daemon's compiled-in authz policy here at startup (single source of
    # truth; replaces the version-pinned OCI artifact + sdk.version pin).
    authzRegistry:
      port: 8086

  config:
    logging:
      level: info

    # Secrets / KEK provider — required (one-code-path) and
    # (daemon-no-K8s-API). The previous `type: kubernetes` was
    # removed by gibson#212 / S10: the daemon now reads the master KEK
    # from a chart-mounted file rather than via the K8s API. Override
    # in overlays for aws_kms (set aws_kms.kms_key_id + role_arn) or
    # vault (set vault.address). Daemon validator accepts
    # { file, vault, aws_kms, azure, gcp }.
    security:
      key_provider:
        type: file
        file:
          # Path to the file containing the 32-byte master KEK.
          # The chart mounts the gibson-master-key Secret as a volume
          # at /etc/gibson-kek/master-key (templates/gibson/statefulset.yaml).
          path: /etc/gibson-kek/master-key

    # Prometheus metrics listener (Spec security-hardening R20 + week-2 task 18).
    #
    # The daemon exposes a TLS-only :9090 metrics endpoint terminated inside
    # the daemon binary (Option (a) decision, 2026-05-05). The chart's
    # cert-manager Certificate `gibson-daemon-metrics-tls` (rendered in
    # templates/cert-manager/component-certificates.yaml) provisions the
    # server cert + key + CA bundle; the daemon StatefulSet mounts the Secret
    # under /etc/gibson/tls/metrics/.
    #
    # mTLS is mandatory — the daemon enforces RequireAndVerifyClientCert and
    # rejects any scrape client without a certificate signed by the chart's
    # CA. Plaintext is NOT supported and there is no INSECURE_DEV escape
    # hatch (Spec 3 R20 fail-closed).
    metrics:
      enabled: true
      listenAddress: ":9090"
      tls:
        certPath: /etc/gibson/tls/metrics/tls.crt
        keyPath: /etc/gibson/tls/metrics/tls.key
        clientCAPath: /etc/gibson/tls/metrics/ca.crt

  # Authentication and authorization configuration
  auth:
    # Authentication mode: dev | enterprise | saas
    # - dev: Static tokens for local testing (not for production)
    # - enterprise: Customer's IdP via OIDC (single/multi-tenant)
    # - saas: Multi-tenant with Auth.js (Zitadel as IdP) or external OIDC
    mode: "dev"

    # Tenant claim name in OIDC tokens (for multi-tenant deployments)
    # The claim in the JWT that contains the tenant identifier
    # Common values: tenant_id, org_id, organization_id
    tenantClaim: "tenant_id"

    # Default tenant for component registration.
    # Platform-deployed components (agents, tools, plugins) register under this
    # tenant. Set to "_system" so they are shared across all customer tenants.
    # Customer-deployed components use their own tenant-scoped API key which
    # overrides this default, making them private to that tenant.
    defaultTenant: "_system"

    # Clock skew tolerance for token expiry validation
    # Allows for time differences between servers
    clockSkew: "30s"

    # OIDC providers configuration (supports multiple providers)
    # Each provider represents an identity provider that issues JWT tokens
    oidc: []
    # Example OIDC provider configuration:
    # - issuer: "https://company.okta.com"
    #   audience: "gibson"
    #   jwksTtl: "1h"
    #   jwksEndpoint: ""  # Optional: override auto-discovery
    #   claimsMapping:
    #     groups: "roles"  # Map IdP claim names to expected names

    # SPIFFE/SPIRE workload identity configuration
    # Used for in-cluster workload authentication via mTLS
    # The trust domain is the one value global.spire.trustDomain (ADR-0164).
    spiffe:
      workloadAPISocket: "/run/spire/sockets/api.sock"

    # Role bindings map group claims to Gibson roles.
    # Values must be Gibson role names: owner, admin, operator, viewer.
    # Supports wildcard patterns: *, prefix-*, *-suffix.
    roleBindings: {}
    # Example role bindings:
    # roleBindings:
    #   "Security-Team":   ["operator"]
    #   "Security-Admins": ["admin"]
    #   "Developers":      ["viewer"]

    # Local dev tokens (dev mode only)
    # WARNING: Only for local development, never use in production
    # Static tokens that bypass OIDC validation
    local:
      users: []
      # Example local users:
      # users:
      #   - name: "test-admin"
      #     token: "dev-token-12345"
      #     roles: ["admin"]
      #     tenant: "dev"
      #   - name: "test-user"
      #     token: "dev-token-user"
      #     roles: ["viewer"]
      #     tenant: "dev"


  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  persistence:
    enabled: false
    size: 10Gi
    storageClass: ""
    # storageClassName is an alias used by some overlays (Helm standard).
    storageClassName: ""

  serviceAccount:
    create: true
    name: ""
    annotations: {}


  # e2eRunner gates the exit-test runner's identity: a ServiceAccount and a
  # ClusterSPIFFEID minting spiffe://<td>/platform/e2e-runner.
  #
  # The daemon refuses a non-loopback plaintext listener (zero-trust-hardening
  # Req 1.2), so an exit test cannot dial it over a port-forward — it must be a
  # mesh peer with an attested SVID. This is that seam, and it is OFF here so
  # only the kind test overlay turns it on.
  #
  # The matching method policy lives in the gibson daemon behind the
  # test_fixtures build tag. A production daemon has no policy for this
  # identity and refuses it at boot, so enabling this against production fails
  # loud rather than granting quiet access.
  #
  # It also sets GIBSON_TEST_FIXTURES_ENABLED=true on the daemon: the runtime
  # gate the fixture build reads before it registers the mock LLM or seeds the
  # runner's tenant membership (gibson#14). The exit-test profile is one toggle.
  e2eRunner:
    enabled: false

  # ---------------------------------------------------------------------------
  # Setec sandbox dispatch (deploy#1175, ADR-0142)
  # ---------------------------------------------------------------------------
  # sandbox configures the daemon's SANDBOXED-tool execution backend: tool
  # calls are dispatched into setec microVM sandboxes over gRPC.
  # templates/gibson/configmap.yaml renders this block into the daemon
  # config's `sandbox:` block, which the daemon unmarshals into
  # config.SandboxConfig (gibson internal/infra/config/sandbox.go).
  #
  # The daemon always dials setec and sends the tenant in each request (D5,
  # gibson#756): there is no enabled switch and no fixed tenant. It dials with
  # its own SVID from the SPIRE Workload API and accepts only the SPIFFE ID
  # of the fleet (ADR-0142, gibson#756 item 11); no certificate file is read
  # on this leg. The address and the fleet ID are DERIVED from `setec.*` and
  # global.spire.trustDomain in templates/_helpers.tpl, because restating
  # them is a chance to disagree with the subchart and a disagreement
  # produces no render error — only a dial timeout or a handshake failure
  # at the first sandboxed tool call, hours later, in gibson's logs, looking
  # like a setec fault. Each field below still accepts an explicit override
  # for a fleet this chart does not install (setec.enabled=false, ADR-0087).
  #
  # gibson.validateSetecDispatch rejects a render without a running
  # in-chart frontend.
  sandbox:
    setec:
      # address is the setec frontend, host:port. Empty derives
      # <frontend>.<setec-namespace>.svc.cluster.local:<port> from setec.*.
      address: ""
      # spiffeID is the SPIFFE ID of the fleet frontend, the one server the
      # daemon accepts on this leg. Empty derives
      # spiffe://<global.spire.trustDomain>/platform/setec-frontend, the ID
      # that templates/spire-server/clusterspiffeids.yaml registers for the
      # in-chart frontend. Set it only for a fleet in another trust domain.
      spiffeID: ""
      # callTimeout bounds a single sandboxed tool call. Go duration string;
      # the daemon defaults empty to 5m.
      callTimeout: "5m"
      # sandboxClass is the Setec SandboxClass every tool/catalog launch
      # names. Setec ships `tool` (external-only egress) from v0.107.0; an
      # empty class defers to the cluster default and can silently downgrade
      # isolation, so the daemon defaults empty to `tool`.
      sandboxClass: "tool"

  # ---------------------------------------------------------------------------
  # Provider catalogue hot-reload (spec: gibson#296)
  # ---------------------------------------------------------------------------
  # The daemon reads GIBSON_PROVIDERS_CATALOGUE_PATH at startup and polls the
  # file every 5 minutes, swapping in a new catalogue whenever the file mtime
  # changes.  On parse error the previous catalogue is retained.
  #
  # cataloguePath points at the file mounted from the provider-catalogue
  # ConfigMap (templates/gibson/provider-catalogue-cm.yaml).  Operators can
  # update the model list by pushing a new ConfigMap (via gitops) and waiting
  # for the daemon's next 5-minute poll — no restart required.
  #
  # Override to "" to fall back to the binary-embedded catalogue (static; never
  # hot-reloaded).
  providers:
    cataloguePath: /etc/gibson-providers/provider-catalogue.yaml

# -----------------------------------------------------------------------------
# IdP (Identity Provider) admin credentials
# -----------------------------------------------------------------------------
# The daemon's TenantAdminService provisions agent/tool/plugin service
# accounts in an external IdP. Only `zitadel` is supported in this spec
# (agent-service-credentials); the abstraction is vendor-neutral so future
# providers can be added behind the same `idp.AdminClient` Go interface.
#
# `idp.zitadel.{issuer,orgId,projectId}` are REQUIRED whenever the chart is
# rendered — there is no sensible default for a tenant-specific Zitadel
# project URL or its numeric IDs. Each environment overlay (values-kind.yaml,
# values-aws-prod.yaml, ...) MUST supply these values. The chart will
# refuse to render if any of them is empty.
#
# The K8s Secret named by `idp.adminCredentialsSecret` carries the admin
# OAuth2 client_id / client_secret used to call the IdP's management API.
# The platform-operator's OIDCClient reconciler writes it. The daemon
# Deployment references the Secret by name.
# -----------------------------------------------------------------------------
idp:
  # Provider selector. Only "zitadel" is accepted by the daemon's
  # `idp.NewFromEnv` factory in this spec. Future providers (auth0, okta,
  # generic OIDC w/ DCR) extend the dispatch without changing this key's
  # shape.
  provider: "zitadel"

  # Name of the K8s Secret holding the admin OAuth2 credentials. The
  # daemon StatefulSet pulls `client_id`, `client_secret`, `issuer`,
  # `org_id`, `project_id` from this Secret via env-var refs.
  adminCredentialsSecret: "idp-admin-credentials"



  # Provider-specific settings. The Zitadel block is the only one
  # consumed today.
  zitadel:
    # Issuer URL of the Zitadel instance. Default targets the in-cluster
    # Zitadel service (sibling ArgoCD Application installs Zitadel before
    # gibson). EKS overlays override with the public hostname.
    issuer: "http://gibson-zitadel.gibson.svc.cluster.local:8080"

# -----------------------------------------------------------------------------
# SPIFFE identity inputs the daemon needs at runtime
# -----------------------------------------------------------------------------
# The daemon trusts identity headers ONLY when the upstream peer cert is
# the Envoy SPIFFE SVID. The chart renders the expected Envoy SPIFFE ID from
# the trust domain of the install, so the daemon's identity interceptor
# validates the peer cert URI SAN against it.
# -----------------------------------------------------------------------------
spiffe:
  # Each SPIFFE ID of the platform is the trust domain of the install
  # (global.spire.trustDomain, ADR-0164) and a path. The lists below hold
  # paths only. The chart builds each full ID with gibson.spiffeID, so no
  # values file holds a domain. The IDs of Envoy and of the daemon are fixed:
  # platform/envoy and platform/daemon.
  #
  # Direct control-plane callers of the daemon's main gRPC listener, beside
  # Envoy. Rendered into GIBSON_SPIFFE_ALLOWED_PEER_IDS. The connector-operator's
  # ConnectorInstance finalizer revokes the connector grant through the daemon
  # (gibson#1566); the daemon's method policy limits that peer to
  # RevokeConnectorGrant.
  allowedPeers:
    - platform/tenant-operator
    - platform/connector-operator
    # The platform-operator sends only its audit records (EmitAuditEvent,
    # gibson#583); the daemon's method policy admits nothing else for it.
    - platform/platform-operator
  # Peers that the daemon's harness callback listener (:50001, SPIFFE mTLS with
  # AuthorizeOneOf) accepts. MUST be non-empty when SPIFFE is configured: the
  # daemon fails to start otherwise (critical-tls-no-fallbacks Requirement 1.5).
  # Rendered into GIBSON_CALLBACK_PEER_SVIDS.
  callbackPeers:
    - platform/dashboard
    - platform/envoy
    - platform/daemon
  # The closed set of SVIDs allowed to READ the daemon's authz-registry mTLS
  # endpoint (deploy#852). MUST be non-empty when SPIFFE is configured: the
  # daemon fails closed on an empty list rather than serve the enforcement
  # policy openly. Rendered into GIBSON_AUTHZ_REGISTRY_READER_SVIDS.
  authzRegistryReaders:
    - platform/ext-authz

  # gRPC reflection on the daemon's harness callback listener. OFF by
  # default — production images do not register reflection. Set to "1"
  # ONLY for dev/debug overlays (values-kind.yaml). Rendered into
  # GIBSON_GRPC_REFLECTION on the daemon StatefulSet env when non-empty.
  # Spec: critical-tls-no-fallbacks Component 3 / Requirement 4.
  grpcReflection: ""

# -----------------------------------------------------------------------------
# Dashboard
# -----------------------------------------------------------------------------
# dashboard is structural infrastructure (one-code-path / deploy#188):
# it is the customer-facing surface — sign-up, sign-in, agent/tool/plugin
# management, billing — and the platform has no other way for an end-user
# to reach the daemon. The previous `enabled: true|false` substitution
# toggle has been deleted; the platform cannot run without it. Sub-feature
# toggles (`serviceAccount.create`, `autoscaling.enabled`,
# `podDisruptionBudget.enabled`, `ingress.enabled`,
# etc.) remain legitimate.
dashboard:

  # hstsDisabled controls whether the dashboard emits the HSTS header.
  # Default false: real-cert (staging/prod) deployments keep HSTS ON.
  # The kind/self-hosted overlay sets this true because the selfsigned-ca
  # edge cert would otherwise pin *.<domain> and brick local access (#1044).
  # Declared here so the overlay key has a base default (overlay-parity, deploy#576).
  hstsDisabled: false

  # Spec 3 §3 — HA primitives (autoscaling, PDB, NetworkPolicy).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
  podDisruptionBudget:
    enabled: ~        # auto-on when replicas > 1

  # ServiceAccount for the dashboard pod. For IRSA, set `annotations`
  # with `eks.amazonaws.com/role-arn`. The prod overlay populates this
  # from the iam-irsa Terraform module's output.
  serviceAccount:
    create: true
    name: ""  # defaults to "gibson-dashboard" when empty
    annotations: {}

  # Debug mode — set true in dev/kind values to surface full error stacks
  # in API responses, raise Auth.js log level, and enable the in-page
  # /api/debug/recent-errors ring buffer + DebugErrorPanel. Leave false
  # (default) in any environment that ever sees real users.
  debug: false

  # Externally-facing dashboard URL used as the Auth.js NEXTAUTH_URL
  # and Zitadel redirect_uri. Overlays set per-environment public URL.
  authUrl: ""

  # Signup seam knobs for the dashboard (/ deploy#1055, dashboard#917).
  #
  # The /signup page follows `registration` (top of this file).
  #
  # signup.wwwUrl (string, default ""):
  #   When set, the signup / onboarding flow directs unauthenticated users to
  #   this marketing URL for the plan/pricing page (deploy#917, dashboard#917).
  #   Unset (default) → in-app signup flow, no external marketing redirect.
  #   Maps to WWW_URL env on the dashboard Deployment (already wired; this
  #   block just documents the signup use of the existing wwwUrl knob).

  # Marketing host origin for the www/app middleware split (deploy#630 S11).
  # Empty → derived from global.domain via gibson.wwwOrigin
  # (https://www.<domain>[:port]). Set only for an off-domain marketing edge.
  wwwUrl: ""

  # Zitadel OIDC settings for the dashboard's Auth.js provider.
  # The Zitadel issuer the dashboard signs users in against.
  zitadel:
    issuer: ""

  image:
    repository: ghcr.io/zeroroot-ai/dashboard
    # deploy#789: digest-pinned for staging/prod immutability.
    #
    # Pinned to a RELEASE TAG, like every other first-party image here. It
    # used to track `main@<digest>`, which is a different thing wearing the
    # same shape: re-pinning it shipped whatever else had merged since the
    # last bump, so nobody could bump it to deliver one fix. A release tag
    # names one commit, and `scripts/bump-image-digest.py --list` reads the
    # same way for every row.
    #
    # kind keeps a moving :main tag (values-kind.yaml), exempt on purpose.
    # Bump: scripts/bump-image-digest.py --image dashboard --ref v<x.y.z> \
    #         --digest "$(HEAD /v2/zeroroot-ai/dashboard/manifests/v<x.y.z>)"
    tag: "v0.131.0@sha256:b2255e6b30730558c4251942c7afd477ce4f3c4251548654b98167b96a58d570"
    # digest (deploy#1066) — see .Values.gibson.image.digest for semantics.
    digest: ""
    pullPolicy: IfNotPresent

  replicas: 1

  # Init container configuration
  initContainers:
    # Wait for Gibson daemon to be ready before starting
    waitForGibson: true

  # Service configuration
  service:
    type: ClusterIP
    port: 3000

  # Dashboard auth-hardening controls.
  #
  # These feature flags govern breached-password checking, bot protection, and
  # transactional email delivery for the Auth.js / Zitadel flows inside the
  # Next.js dashboard. Defaults are tuned for dev/kind clusters (captcha disabled,
  # email writes to stdout) so a fresh install boots without external
  # credentials. Production deployments must override these values — the
  # chart NOTES.txt emits a warning for any disabled control post-install.
  auth:
    # Have I Been Pwned breached-password lookup during signup / password
    # change. Leave enabled in every environment — disabling allows users
    # to set passwords that are known-compromised.
    hibp:
      enabled: true          # DASHBOARD_HIBP_ENABLED

    # Bot protection on signup / login / password-reset forms.
    # provider: turnstile | hcaptcha | disabled
    # secretKey is supplied via the dashboard Secret. In dev the provider is
    # "disabled" so forms submit without a CAPTCHA round-trip. The owner
    # decided against a captcha, so the site key the browser would need is
    # not plumbed: the dashboard reads no NEXT_PUBLIC_DASHBOARD_CAPTCHA_*
    # name (charts#294).
    captcha:
      provider: "disabled"   # DASHBOARD_CAPTCHA_PROVIDER
      secretKey: ""          # DASHBOARD_CAPTCHA_SECRET_KEY (Secret ref)

    # NO email block. The dashboard sends no mail (dashboard#181): src/lib/email
    # is deleted along with nodemailer, resend and @aws-sdk/client-ses. The
    # daemon sends signup verification and invitations and Zitadel owns password
    # reset and address verification, so the platform's one relay credential
    # reaches the daemon through global.email and never this chart's
    # dashboard. A provider knob here described a sender that did not exist.

    # Post-logout redirect URI(s) — RP-initiated OIDC logout
    # (`/oidc/v1/end_session`). The dashboard's federated-signout route
    # sends `post_logout_redirect_uri` to Zitadel; Zitadel rejects with
    # `invalid_request` unless the value matches a registered URI
    # byte-for-byte.
    #
    # The first entry is projected into the dashboard Deployment as
    # POST_LOGOUT_REDIRECT_URI; the dashboard sends it verbatim (no
    # path appending, no trailing-slash synthesis). Additional entries
    # are intended for the operators-chart `oidcClients` registration
    # (see invariant below) when an environment supports more than one
    # public origin (e.g. apex + www).
    #
    # Cross-chart invariant: this list must equal the
    # `platformBootstrap.oidcClients[?(@.name=="gibson-dashboard")].postLogoutRedirectURIs`
    # value in the gibson-operators chart for the same environment, so
    # the URI the dashboard sends at logout matches the URI Zitadel has
    # registered. The two charts release independently; keeping these
    # in sync is an operator responsibility today (a chart-render gate
    # is a follow-up).
    #
    # Empty list = federated-signout will fail loud at runtime (no
    # silent fallback to request origin, which is what caused the
    # trailing-slash bug fixed by epic logout-post-uri-fix).
    postLogoutRedirectURIs: []         # POST_LOGOUT_REDIRECT_URI (first entry)

    # Social sign-in providers (all disabled by default).
    # Set clientId + clientSecret for each provider you want to enable.
    # Microsoft additionally requires tenantId (no default — see .env.example).
    # Secrets must be provided via the gibson-dashboard-secrets Secret, not
    # as plain values in this file.
    socialProviders:
      autoCreateOrg: true              # DASHBOARD_AUTO_CREATE_ORG
      github:
        clientId: ""                   # GITHUB_CLIENT_ID
        clientSecret: ""               # GITHUB_CLIENT_SECRET (Secret ref)
      gitlab:
        clientId: ""                   # GITLAB_CLIENT_ID
        clientSecret: ""               # GITLAB_CLIENT_SECRET (Secret ref)
      google:
        clientId: ""                   # GOOGLE_CLIENT_ID
        clientSecret: ""               # GOOGLE_CLIENT_SECRET (Secret ref)
      microsoft:
        clientId: ""                   # MICROSOFT_CLIENT_ID
        clientSecret: ""               # MICROSOFT_CLIENT_SECRET (Secret ref)
        tenantId: ""                   # MICROSOFT_TENANT_ID (required when microsoft is enabled)

  # The account link of the billing component (ADR-0060, charts#375). The
  # dashboard shows it when both are set. Both or neither: half a pair fails
  # the render. The dashboard holds no Stripe client (dashboard#256).
  accountLink:
    url: ""     # DASHBOARD_ACCOUNT_URL
    label: ""   # DASHBOARD_ACCOUNT_LINK_LABEL
  # The texts of the signup step of the billing component (charts#375). All
  # six or none; empty (the default) shows no step.
  signupStep:
    title: ""
    text: ""
    buttonLabel: ""
    waitingText: ""
    failureText: ""
    retryLabel: ""

  # No billing email is configured here, and none was ever sent from here.
  # This block used to point at dashboard.auth.email, which dashboard#181
  # deleted together with the dashboard's whole mailer. The platform's one
  # relay credential reaches the daemon through global.email. Whether a
  # billing notification is sent at all is the daemon's question, not this
  # chart's, and no template here renders one.

  # Ingress configuration for external access
  ingress:
    enabled: false
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # Optional: Rate limiting
      # nginx.ingress.kubernetes.io/limit-rps: "100"
    hosts:
      - host: dashboard.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dashboard-tls
        hosts:
          - dashboard.example.com

  # Observability configuration
  observability:
    enabled: true

  logLevel: info

  # Resource limits and requests.
  #
  # The memory limit is also the V8 heap knob: the Deployment sets
  # NODE_OPTIONS=--max-old-space-size to 75% of this number
  # (gibson.nodeHeapMiB), because Node otherwise sizes its heap from the host's
  # memory and never learns the cgroup it lives in. Raise the limit and the
  # heap follows; there is no second value to keep in step.
  #
  # 1Gi is the floor for a signed-in render. 512Mi was the shipped value and a
  # signed-in page exhausted the heap on every request (dashboard#150).
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi


  # Extra environment variables (optional)
  extraConfig: {}
    # Example:
    # ENABLE_GRAPH_VIEW: "true"
    # ENABLE_CHAT: "true"

  # allowedServiceSubjects: REMOVED by spec canonical-service-identity Req 5.
  # The dashboard's ALLOWED_SERVICE_SUBJECTS env is now populated at runtime
  # by the resolve-sa-identity-map init container reading the
  # gibson-sa-identity-map ConfigMap (NUMERIC subs, not readable names).
  # Modify the canonical SA list via .Values.serviceAccounts.required at
  # the top of this file.

  # Gibson Platform Public URL — required env var for the dashboard container.
  # The dashboard uses this to render user-facing links to the platform API.
  # Points to the Envoy ingress URL operators use from browsers.
  # Defaults to https://api.<global.domain>. Override in environment overlays.
  # Spec: naming-and-config-standardization Requirement 2.6.
  gibsonPlatformPublicUrl: ""

  # Dashboard PostgreSQL settings for the daemon configmap and the dashboard
  # deployment. The host, port, database and user come from the
  # platformPostgres tier helpers.
  postgres:
    enabled: true
    # password is sourced from the platformPostgres password Secret
    # (gibson-platform-postgres-credentials), the role gibson_platform.
    # The dashboard has no Postgres role of its own (charts#524).
    # NOTE: sslmode is hardcoded `require` in chart templates (Spec
    # first-deploy-unblock-and-ha R7); no sslMode/sslmode knob here.
    maxConns: 10

# `componentIngress` block removed (deploy#187 /). The
# componentIngress was a legacy direct-to-daemon gRPC ingress; the
# `validateAllPathsViaEnvoy` validator forbade `componentIngress.enabled=true`
# (Envoy is the supported daemon-access path) so the toggle was dead. The
# ingress-grpc.yaml template + the validator's Rule 3 are removed in the
# same change. External component registration goes through the Envoy
# edge listener (envoy.routes).

# -----------------------------------------------------------------------------
# Unified Platform Ingress -- Single-domain HTTP + gRPC multiplexing
# -----------------------------------------------------------------------------
# Routes both browser/API traffic (HTTP) and daemon traffic (gRPC) through a
# single domain and TLS-terminated port 443 using nginx-ingress content-type
# routing. Two Ingress resources share the same host; nginx merges them into
# one server block and dispatches based on Content-Type: application/grpc.
#
# This is independent of:
#   - dashboard.ingress  (standalone dashboard-only ingress on a separate host)
#   - componentIngress   (gRPC-only ingress for external component registration)
#
# For Kind dev clusters, leave this disabled -- services use NodePorts (30xxx).
# Enable for staging/production behind an nginx-ingress controller.
#
# Prerequisites:
#   - nginx-ingress controller deployed in the cluster
#   - TLS certificate (cert-manager or pre-provisioned) for the host
#   - DNS record pointing ingress.host to the ingress controller's external IP
ingress:
  # Master switch -- disabled by default (opt-in for production).
  enabled: false
  grpc:
    # Enable gRPC routing alongside HTTP on the same host.
    # When false, only the HTTP (dashboard) ingress is created.
    enabled: true
    # Annotations applied to the gRPC ingress only.
    # The backend-protocol: GRPC annotation is always added automatically.
    annotations: {}

# docs-svc — core optional-by-toggle docs surface (/ deploy#1034).
#
# Component taxonomy: Core, optional-by-toggle. Ships in BOTH self-hosted
# and SaaS (unlike billing, which is SaaS-only). Default-on: an
# online self-hosted operator may disable the bundled docs and the dashboard
# will link to publicFallbackUrl instead.
#
# Pin shape is the combined `tag: "v<semver>@sha256:<digest>"` — the ONE
# first-party pin shape every image uses (kubelet pulls by the embedded digest;
# the v<semver> is provenance). docs-site was formerly the lone exception,
# pinned via a separate `digest:` field; that broke the version-links fan-out,
# whose before:@ image path rewrites the combined tag, not a sibling digest
# (it failed with "bump-image-digest.py did not rewrite docs.image.tag").
# Aligning docs-site to the combined shape fixed it. The pin is kept current by
# the version-links fan-out (zeroroot-ai/.github version-links.yaml, link
# `docs-site`): each docs-site release resolves the digest and opens a
# `chore(deps): bump docs-site` PR here. Per-env overlays may still override to
# track `main` (gitops staging does).
docs:
  # enabled: true (default) renders the docs-svc Deployment + Service.
  # Set to false to suppress local docs; the Envoy docs vhost 503s and the
  # dashboard DOCS_URL links to publicFallbackUrl (online self-hosted pattern).
  enabled: true
  # publicFallbackUrl — used by the dashboard DOCS_URL when enabled=false.
  # This is the vendor's public documentation site, a product URL, not a
  # host this install serves, which is why it lives here as a plain value
  # and the template carries no literal (check-hostnames).
  publicFallbackUrl: "https://docs.zeroroot.ai"
  image:
    repository: ghcr.io/zeroroot-ai/docs-site
    # tag — combined v<semver>@sha256:<digest>, the one first-party pin shape.
    # Kubelet pulls by the embedded digest; v<semver> is provenance. Kept
    # current by the version-links fan-out (link `docs-site`), not hand-edited.
    # Manual resolve/audit: `gh api /orgs/zeroroot-ai/packages/container/docs-site/versions`.
    tag: "v0.6.14@sha256:e1d62016f19c485df8749fb0e65faf8b6f5f6f791739eb0ea6208c957c553a7c"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -----------------------------------------------------------------------------
# Redis Stack (Custom Deployment - NOT Bitnami)
# -----------------------------------------------------------------------------
# Using custom redis-stack deployment because Bitnami doesn't properly load
# Redis modules (RediSearch, RedisJSON, etc.) that Gibson requires.
redis:

  image:
    # deploy#1170 — mirrored to ghcr; Docker Hub is rate-limited per NAT IP.
    registry: ghcr.io
    repository: zeroroot-ai/mirror/redis-stack-server
    tag: "7.4.0-v1@sha256:72035434f455ecd897090d3dd83ec357d34857287f159378b965a7006312a797"
    pullPolicy: IfNotPresent

  auth:
    passwordSecret: ""
    passwordSecretKey: "redis-password"

  # Legacy redis.master.persistence block. Some overlays use this form
  # (backward-compat with Bitnami Redis chart shapes).
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Spec 2 R14 — canonical persistence block (was redis.master.persistence).
  # The chart prefers redis.persistence.* and falls back to redis.master.persistence.*
  # for backward-compat; new overlays should use redis.persistence directly.
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

  # Spec 2 R14 — RDB-snapshot to S3 backup CronJob. Disabled by default, and
  # NO overlay flips it on today — the earlier "prod overlay enables" note here
  # was false; whether prod should enable it is tracked in deploy#1496.
  #
  # deploy#1459: the job runs in TWO stages on TWO images because no mirrored
  # image ships both `redis-cli` and the `aws` CLI. Overriding either image is
  # allowed; overriding it with an image that lacks that stage's tool is not,
  # and the stage fails loudly rather than installing anything at run time.
  backup:
    enabled: false
    schedule: "0 * * * *"
    # The platform backups bucket: <workspace_name>-backups-<account_id>
    # (eks/gibson/modules/s3). REQUIRED when enabled.
    s3Bucket: ""
    # Object prefix. `longterm/` is the ONLY prefix the bucket's lifecycle
    # rule covers (GLACIER@30d, expire@6y) — objects written outside it are
    # kept forever at STANDARD price. Keep the longterm/ leader, and keep it
    # in step with the `redis_backup` IRSA policy, which grants this prefix
    # and nothing else (eks/gibson/modules/iam-irsa) and with
    # test/dr/restore-data-tier.sh, which reads it back.
    s3Prefix: "longterm/redis"
    awsRegion: ""
    # IRSA. The role (eks/gibson/modules/iam-irsa key `redis_backup`) grants
    # s3:PutObject + s3:GetObject on this prefix and NOTHING else — no
    # s3:DeleteObject, so retention stays the bucket lifecycle's job and a
    # compromised job cannot destroy the copies it made. Without the
    # annotation the pod runs unassociated and every upload 403s
    # (deploy#1535).
    serviceAccount:
      annotations: {}
    # Defaults to <release>-redis-backup. Override only to reuse an existing
    # IRSA-annotated ServiceAccount; never set this to `default`.
    serviceAccountName: ""
    # Stage 1 (init container) — MUST ship redis-cli.
    redisImage: "ghcr.io/zeroroot-ai/mirror/redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275"
    # Stage 2 (main container) — MUST ship the aws CLI.
    awsCliImage: "ghcr.io/zeroroot-ai/mirror/aws-cli:2.17.50@sha256:ac68e76ae4bbb804b0c36d56c6fdc8e6800adb46d29867ac2b73280225a7b719"

  # Spec 3 §3 R9 — PDB defaults: omitted for 1-replica Redis-Stack.
  podDisruptionBudget:
    enabled: false


  service:
    type: ClusterIP
    port: 6379

  # redis-exporter sidecar for Prometheus metrics (deploy#516).
  # Set enabled: true to add the oliver006/redis_exporter sidecar and emit
  # the RedisAuthenticationFailure PrometheusRule. Disabled by default;
  # enable in EKS prod values and wherever prometheus-operator is installed.
  metrics:
    enabled: false
    exporter:
      repository: ghcr.io/zeroroot-ai/mirror/redis-exporter
      tag: "v1.63.0@sha256:8dde0136b66ec4dfb25802283fe89852a405368b095b3893841d90499a8d4e17"
      pullPolicy: IfNotPresent

  # Ordered restart controller CronJob schedule (deploy#517).
  # * * * * * = every minute (finest CronJob granularity). Override if a
  # looser detection window is acceptable to reduce noise in job history.
  rotation:
    schedule: "* * * * *"

# -----------------------------------------------------------------------------
# Two-tier consolidated Postgres — Spec helm-eks-readiness-and-pg-split.
#
# platformPostgres   → Gibson control plane + per-tenant data-plane DBs.
# thirdPartyPostgres → Vendor apps: zitadel + openfga.
#
# one-code-path/198: the in-chart-StatefulSet toggle is GONE. The platform
# Postgres is structurally required — every environment (kind, eks,
# customer self-host) MUST point at a reachable Postgres tier. There is
# no "off" state. The chart consumes `platformPostgres.host` +
# `platformPostgres.passwordSecretName` as required values; render fails
# when either is empty. Kind overlay sets both to the kind-bootstrap
# CNPG cluster; EKS overlay sets `external.enabled=true` + RDS endpoint.
#
# `external.enabled` remains as a substitution toggle (in-chart vs RDS).
# -----------------------------------------------------------------------------
platformPostgres:
  # host MUST be set in every overlay; the helper fails render otherwise.
  host: ""
  port: 5432
  database: ""   # defaults to gibson_platform in the helper when empty
  user: ""       # alias accepted by some overlays; helper prefers `username`
  # passwordSecretName MUST be set in every overlay; helper fails render otherwise.
  passwordSecretName: ""
  passwordSecretKey: PLATFORM_DB_PASSWORD
  # sslMode: disable              (in-chart) / require (external)
  persistence:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  external:
    # When enabled, point the platform DB at an external managed Postgres (RDS)
    # instead of the in-chart CNPG. Declared with safe defaults so the aws-prod
    # overlay's keys have a base entry (deploy#576 parity); only consumed when
    # enabled=true.
    enabled: false
    host: ""
    port: 5432
    database: ""
    username: ""
    sslMode: "require"
    passwordSecretName: ""
    passwordSecretKey: "password"

openfga:

  # NOTE (deploy#1170): there is deliberately NO `image:` block here. The
  # OpenFGA Deployment is rendered by the UMBRELLA's `openfga` subchart
  # dependency, not by this chart — nothing in helm/gibson-workloads/templates
  # reads `.Values.openfga.image`, only `.Values.openfga.service.*`. The block
  # that used to sit here pinned v1.8.4 while the live pod ran the subchart's
  # v1.15.1, so it read as the image pin and was not one. Override the real
  # image at helm/gibson/values.yaml `openfga.image`.


  service:
    # HTTP API (used by go-sdk and the fga-init job)
    httpPort: 8080
    # gRPC API
    grpcPort: 8081





# -----------------------------------------------------------------------------
# ext_authz — sole authorization-decision service (spec: zitadel-envoy-gateway-migration)
# Called by Envoy ExtAuthz filter for every authenticated RPC. Mints Capability
# Grant JWTs for tool dispatch. Validates API keys for the Envoy Lua filter.
#
# Structural / not toggleable (deploy#188): ext-authz is a required
# component of the platform — every authenticated RPC is authorized by it
# before reaching the daemon. The `extAuthz.enabled` toggle was deleted; all
# ext-authz resources now render unconditionally. Sub-feature toggles
# (autoscaling, podDisruptionBudget) remain.
# -----------------------------------------------------------------------------
extAuthz:
  # logLevel is the ext-authz log level (EXT_AUTHZ_LOG_LEVEL). The hosted
  # identity exit test sets debug, so each allow decision is in the log.
  logLevel: info
  # Capability-Grant JWT validation (deploy#1155). ext-authz validates the
  # agent+jwt credentials off-cluster components present. Key resolution is
  # per-kid: the template always points EXT_AUTHZ_CGJWT_KEYS_URL at the
  # daemon's in-cluster /capabilitygrant/v1/keys endpoint.
  # gibson#1306 retired the JWKS-wide key document, so there is no jwksURL
  # knob (deploy#1311).
  #
  # issuer defaults from a cluster fact — the public apiOrigin the daemon
  # stamps as `iss` — so no env overlay has to set it. Override only when the
  # daemon's CG authority is somewhere else.
  cgjwt:
    issuer: ""    # default: gibson.apiOrigin
    audience: ""  # default: ext-authz's own (gibson-daemon)

  # Spec 3 §3 — HA primitives (autoscaling, PDB, NetworkPolicy).
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
  podDisruptionBudget:
    enabled: ~        # auto-on when replicas > 1

  image:
    repository: ghcr.io/zeroroot-ai/ext-authz
    # Bumped to 0.2.1 (was 0.2.0 in chart v0.4.0–v0.4.2) per spec
    # self-mode-authz: 0.2.0 had a tenant-cross-check ordering bug that
    # made the self-mode short-circuit unreachable on the live request
    # path — every self-mode call (sign-in's ListMyMemberships /
    # GetMyPermissions) denied with `no tenant derivable`. 0.2.1 looks
    # up the registry entry BEFORE the tenant cross-check and skips
    # tenant resolution for self-mode and unauthenticated entries.
    # Backward-compatible — legacy registry YAML without `self` keys
    # still parses cleanly. Inherits the rootfs-bind-mount-dir fix for
    # readOnlyRootFilesystem: true.
    #
    # Tag has NO `v` prefix because the ext-authz publish workflow
    # (`.github/workflows/ext-authz.yml` in zeroroot-ai/ext-authz) uses
    # `tag_pattern: v(.*)` — git tag `v0.2.0` is published as ghcr tag
    # `0.2.0`. Prior chart entries (`v0.1.1`, `v0.1.0`) referenced
    # nonexistent ghcr tags but were masked by kind overlays overriding
    # the repository. Corrected here.
    #
    # deploy#789: digest-pinned for staging/prod immutability.
    # The ext-authz package (post open-core fold) publishes main/sha-* only
    # (the `0.2.2` ghcr tag was never built), so the digest below is the
    # current `main` (staging/prod deploy reality). kind keeps :main, exempt.
    # Re-resolve: gh api /orgs/zeroroot-ai/packages/container/ext-authz/versions
    #
    # Pinned to commit 3af964a (= v0.128.2) for gibson#1401: this build fetches
    # CG key descriptors over SVID-pinned mTLS and REFUSES TO START on an http
    # EXT_AUTHZ_CGJWT_KEYS_URL. It moves in lockstep with the daemon pin above
    # and with the https/:8086 value in ext-authz/deployment.yaml (deploy#1386)
    # — the three are one change, in both directions.
    tag: "v0.157.0@sha256:a3ac56de171470f07c41962a7700ab8218cac25af5f7999714c920de51281aca"
    # digest (deploy#1066) — see .Values.gibson.image.digest for semantics.
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 2
  # ServiceAccount for the ext-authz pod. Set annotations for IRSA in the
  # prod overlay; in Kind this stays empty.
  serviceAccount:
    create: true
    name: ""  # defaults to "gibson-ext-authz" when empty
    annotations: {}
  ports:
    grpc: 9001
    http: 9002
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  fga:
    # ext-authz speaks HTTP/JSON to OpenFGA (Go net/http client), so this
    # MUST point at OpenFGA's HTTP port (openfga.service.httpPort, 8080),
    # not the gRPC port (8081). The chart template rejects gRPC-port values
    # at render time — see deploy#140.
    addr: ""  # Defaults to "{{ .Release.Name }}-openfga:{{ .Values.openfga.service.httpPort }}" (8080) if empty
  issuer: ""  # Defaults to "https://api.{{ .Values.global.domain | default "zeroroot.ai" }}"

# -----------------------------------------------------------------------------
# Envoy — SaaS-edge gateway (spec: zitadel-envoy-gateway-migration)
# Sole ingress for daemon gRPC; terminates mTLS+SPIFFE / OIDC / API key paths,
# calls ext_authz for FGA decisions, strips/signs internal identity headers.
# Disabled by default; enabled in the Kind overlay once the rest of the spec
# (HMAC secret in task 11, daemon ripout in tasks 13–17) lands.
# -----------------------------------------------------------------------------
envoy:
  # Envoy is required infrastructure (deploy#200 / one-code-path epic). The
  # chart unconditionally renders Envoy resources; there is no `.enabled`
  # opt-out. Override per-env behavior via the keys below only.

  # Dedicated ServiceAccount for the Envoy pod. NOT an API credential —
  # Envoy never calls the Kubernetes API and the token is not mounted. It
  # exists because the SA name is a workload-attestation attribute: the
  # `gibson-platform-envoy` ClusterSPIFFEID selects on the literal
  # `k8s:sa:<this name>` and the platform identity ValidatingAdmissionPolicy
  # keys on it. Envoy previously ran as the namespace `default` SA, shared
  # with every other SA-less pod in the namespace, so an SA selector would
  # have been meaningless. There is no `create` toggle: the SA is structural
  # (one-code-path), and an Envoy pod without it falls back to
  # `default` and loses its SVID.
  serviceAccount:
    name: "gibson-envoy"
    # IRSA role ARN etc. Empty everywhere today; Envoy needs no AWS identity.
    annotations: {}

  # Spec 3 §3 — HA primitives (autoscaling, PDB, NetworkPolicy).
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70
  podDisruptionBudget:
    enabled: ~        # auto-on when replicas > 1

  image:
    repository: ghcr.io/zeroroot-ai/mirror/envoy
    tag: "v1.34.0@sha256:45d37d848802f98a5647cb7522b4c1c42e0e0e775913d8e253ef3a5856bef986"
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------
  # waf — the Edge WAF (CONTEXT.md § Edge WAF, deploy#1658).
  #
  # Coraza (Apache 2) running the OWASP Core Rule Set as a WASM filter INSIDE
  # this Envoy, on every substrate and in kind. Core, always-on: there is no
  # `.enabled` and no detection-only switch. Tuning is by paranoia
  # level and anomaly threshold, and by rule exclusions in files/coraza/*.conf
  # that each name a route and a fixture.
  #
  # The module ships as the mirrored coraza-proxy-wasm image; an init
  # container copies /plugin.wasm into an emptyDir Envoy loads as a local file,
  # so air-gapped installs work. The Core Rule Set version IS this image tag
  # (0.6.0 bundles CRS v4.14.0 and Coraza v3.3.3).
  # ---------------------------------------------------------------------------
  waf:
    image:
      repository: ghcr.io/zeroroot-ai/mirror/coraza-proxy-wasm
      # The -busybox variant carries /bin/cp for the init container.
      tag: "0.6.0-busybox@sha256:6ac95e71ef11c3ae55d094e7e2da65c75d4539e233ea5e55a4bedc7b4e6a7acd"
      pullPolicy: IfNotPresent
    # CRS paranoia level for the browser chain. 1 is the CRS default: the
    # rules with the fewest false positives. Raise per chain, never globally,
    # and only with a fixture showing what the higher level catches.
    browserParanoiaLevel: 1
    # CRS paranoia level for the api. chain (body access OFF there: CRS on
    # protobuf bodies is noise, and every api. caller already presents a
    # CG-JWT bound to one method and passes ext-authz + FGA).
    apiParanoiaLevel: 1
    # CRS anomaly thresholds. 5 = one critical rule blocks (the CRS default).
    inboundAnomalyThreshold: 5
    outboundAnomalyThreshold: 4
  # initImage is the base for the `render-envoy-config` initContainer
  # which substitutes the live dashboard OAuth client_id from the
  # gibson-dashboard-oidc Secret into envoy.yaml at pod startup. Only
  # `sh` and `sed` are required — alpine/k8s is reused here because the
  # chart already pulls it for kubectl-bearing probes (see
  # tests.kubectlImage). Override in air-gapped overlays.
  # Unset repository/tag mean the shared tool image (`global.toolImage`,
  # helm/gibson/values.yaml); set both to override in an air-gapped overlay.
  initImage:
    pullPolicy: IfNotPresent
  replicas: 2
  logLevel: info

  # ---------------------------------------------------------------------------
  # Extra edge routes (charts#375): empty in the core chart. A private overlay
  # adds the components it ships, one entry each, every field stated:
  #   - path: /api/billing/webhook
  #     rewrite: /webhook
  #     service: gibson-billing-webhook
  #     port: 8090
  #     rateLimitClass: catch-all
  #     auth: signed-request
  # See templates/envoy/configmap.yaml for the fields and the two auth modes.
  extraRoutes: []

  # ---------------------------------------------------------------------------
  # Edge rate limiting (deploy#1189).
  #
  # Before this existed, `grep -E 'ratelimit|rate_limit|connection_limit'` over
  # files/envoy/envoy.yaml returned nothing: the public edge had no throttle of
  # any kind, including on the pre-auth routes that carry neither jwt_authn nor
  # ext_authz. /capabilitygrant/v1/register is the sharp one — a failed
  # host+jwt attempt reaches Postgres BEFORE signature verification, so
  # unauthenticated traffic drove DB load directly, and the same route is the
  # bootstrap-token replay surface (gibson#1215).
  #
  # WHAT THESE BUCKETS ARE KEYED ON: NOTHING, BY DESIGN. They are the FUSE.
  #
  #   Each bucket is a plain token bucket with NO descriptors, so it is a
  #   per-route CEILING on absolute request rate, per Envoy pod. That is the
  #   first of two layers (CONTEXT.md § Edge rate limit):
  #
  #     * the fuse — these buckets, per pod, absolute, always on;
  #     * the per-client quota — the shared `envoyproxy/ratelimit` service on
  #       Redis Stack (deploy#1657), keyed on the client address for pre-auth
  #       routes and on JWT subject + tenant for authenticated api. routes,
  #       failing OPEN under the fuse when it is unreachable.
  #
  #   The client address is trustworthy because of the Client-IP contract:
  #   the L4 load balancer preserves it on every substrate and every HCM sets
  #   `use_remote_address: true` + `xff_num_trusted_hops: 0`, so the peer is
  #   the client and a client-supplied x-forwarded-for is never consulted.
  #   That pairing is the rule, and scripts/check-edge-rate-limits.py holds
  #   it: a descriptor may only appear under an HCM that trusts the peer.
  #
  #   Per-client keying is a prerequisite change (client-IP preservation or
  #   PROXY protocol on the NLB, plus use_remote_address/xff_num_trusted_hops
  #   here), tracked in deploy#1241. Until then: no descriptors. A
  #   local_ratelimit config that grows a `descriptors` block while
  #   use_remote_address is unset keys every client to the same bucket, and
  #   scripts/check-edge-rate-limits.py fails the build on it.
  #
  # CONTAINMENT: buckets are PER ROUTE, and a route-level bucket fully replaces
  # the chain baseline (Envoy resolves per-filter config most-specific-first),
  # so a flood on /capabilitygrant/v1/register exhausts only that route's
  # bucket. Discovery, the authenticated /gibson.* RPC surface and the whole
  # app/www/docs vhost keep serving. That is the difference between a fuse and
  # the "one source locks everyone out" shape.
  #
  # SCALING: local_ratelimit buckets live in the Envoy process and are shared
  # across its worker threads, so the cluster-wide ceiling is
  # (value x envoy.replicas). Prod runs replicas: 1; this file defaults to 2.
  #
  # There is deliberately NO `enabled` knob (one-code-path /): a
  # boolean is exactly how a limiter ends up silently off. Every field below is
  # REQUIRED — the render FAILS on a missing, zero, negative, fractional,
  # inverted (maxTokens < tokensPerFill) or effectively-unbounded value rather
  # than falling back to something that renders clean and throttles nothing.
  # See gibson.envoy.validateRateLimitBucket in templates/_validators.tpl.
  # ---------------------------------------------------------------------------
  # streamKeepalive — what lets a mission stream survive.
  #
  # A Mission has no bounded duration: it runs until its goal is met or it is
  # stopped, which may be days, and it may go silent for long stretches while an
  # agent thinks. Four separate things used to cut such a stream, and only one
  # of them lives here.
  #
  # The other three, for the reader who finds this block and wonders why it is
  # not sufficient on its own:
  #   - the /gibson. routes carry `timeout: 0s` AND `idle_timeout: 0s`. Deleting
  #     either does NOT mean "no timeout" — Envoy's route default is 15s and its
  #     stream_idle_timeout default is 5m, both worse than what they replaced.
  #   - the daemon sets KeepaliveEnforcementPolicy{MinTime: 5s} so it does not
  #     answer Envoy's PINGs with GOAWAY too_many_pings (gibson#1482).
  #   - the SDK clients already PING at 10s.
  #
  # Every value here is validated in templates/envoy/configmap.yaml. There is no
  # default and no `enabled` knob, for the same reason the rate-limit buckets
  # have none: each degenerate value renders valid YAML that Envoy accepts and
  # then silently ends missions early.
  # ---------------------------------------------------------------------------
  streamKeepalive:
    # Downstream HTTP/2 PING interval, client -> Envoy. MUST be < 350: the NLB
    # drops any flow with no bytes for 350 seconds and that is not configurable
    # on an NLB. 30s leaves ten missed PINGs of headroom before the NLB acts.
    intervalSeconds: 30
    # How long to wait for a PING ack before declaring the connection dead.
    # MUST be < intervalSeconds, or a PING is still outstanding when the next
    # one falls due. This is also what reaps a client that vanished without a
    # FIN, which nothing else does now that the daemon routes never idle out.
    timeoutSeconds: 10
    # Listener-wide stream_idle_timeout. This is for the BROWSER hosts, which
    # share this listener with api. until the ALB split (deploy#1609) lands —
    # they should still be reaped, because holding a stream open at no cost is
    # free amplification. Mission streams opt out per-route via idle_timeout: 0s
    # rather than by disabling this. Envoy's own default is 300s; stated here so
    # it is visible rather than inherited.
    browserIdleTimeoutSeconds: 300

  rateLimit:
    # Chain-wide ceiling for the api host. Declared on the http_filters entry,
    # NOT on the api virtual host, so any virtual host added to api_routes later
    # inherits it instead of starting unlimited. Applies to every route that
    # does NOT carry its own bucket — in practice the authenticated /gibson.*
    # gRPC surface. Sized as a runaway-client fuse, not an abuse control: real
    # aggregate traffic is two orders of magnitude below this, and abusive
    # traffic on these routes is already rejected by jwt_authn before it costs
    # anything. 4000 rps sustained, 8000 burst.
    apiBaseline:
      maxTokens: 8000
      tokensPerFill: 4000
      fillIntervalSeconds: 1
    # The pre-auth discovery routes: /.well-known/openid-configuration,
    # /.well-known/gibson-login, /.well-known/agent-configuration.
    # (/.well-known/jwks.json was one of them until gibson#1306 retired the
    # JWKS-wide key document and deploy#1257 deleted the edge route;
    # /capabilitygrant/v1/keys/ until GHSA-88fg / GHSA-9q4v deleted its.) Each gets
    # its OWN bucket with these numbers (identical config, one instance per
    # route entry). Cheap, cacheable, public key/metadata reads — every CLI and
    # component bootstrap hits them, so headroom matters more than tightness.
    # 300 rps sustained, 600 burst, per route.
    preAuthDiscovery:
      maxTokens: 600
      tokensPerFill: 300
      fillIntervalSeconds: 1
    # /capabilitygrant/v1/register — the expensive pre-auth route. Registration
    # is a once-per-host event, so 30 rps sustained is ~2.6M registrations/day:
    # unreachable by legitimate use, while capping the pre-verification Postgres
    # path and the bootstrap-token replay rate at something Postgres does not
    # notice. This is the number that matters; keep it tight.
    preAuthRegister:
      maxTokens: 60
      tokensPerFill: 30
      fillIntervalSeconds: 1
    # Chain-wide ceiling for the merged public chain (app + www + apex + docs,
    # deploy#1242). Before it existed that chain's http_filters was JUST the
    # router — no limiter of any kind, while it carries every dashboard page
    # load and Server Action, the Zitadel login/OIDC surface, the www and docs
    # static sites, AND the in-cluster dashboard-to-Zitadel admin traffic
    # (ZITADEL_INTERNAL_ISSUER resolves to this vhost). Declared on the
    # http_filters entry, NOT on a virtual host, for the same reason as
    # apiBaseline: a vhost added to public_routes later inherits the floor
    # instead of starting unlimited. Sized as a runaway-client fuse, not an
    # abuse control — it MUST stay far above aggregate legitimate traffic
    # because one signup drives many in-cluster Zitadel admin calls through
    # this same chain, and a browser page load fans out to dozens of asset
    # requests. Per-client limits are separate: the rate-limit service holds
    # them (envoy.rateLimit.perClient below), keyed by the client address that
    # the L4 load balancer preserves (ADR-0079). 4000 rps sustained, 8000
    # burst — mirrors apiBaseline.
    publicBaseline:
      maxTokens: 8000
      tokensPerFill: 4000
      fillIntervalSeconds: 1
    # POST /signup on the app vhost — the signup submission (deploy#1242).
    # The signup Server Action POSTs to the page URL, and it is the expensive
    # route on the whole public chain: each accepted request can mint a
    # tenant, create a Stripe customer and drive an SES verification email —
    # with NO captcha in front of it (owner decision 2026-08-05). POST-only,
    # so page loads and RSC prefetches (GETs) do not drain the bucket and a
    # flash crowd reading /signup cannot lock out submissions. 10 rps
    # sustained is ~860k signup attempts/day: orders of magnitude above
    # legitimate use, while capping what an unauthenticated flood can extract
    # from Stripe, the tenant operator and the SES quota. An absolute
    # ceiling, not per-client. The per-client quota of the rate-limit service
    # (envoy.rateLimit.perClient.appSignupSubmit) bounds one client, and this
    # fuse bounds all of them together. When the rate-limit service does not
    # answer, the edge admits the request under this fuse only (fails open,
    # ADR-0079), and the EdgePerClientQuotaFailingOpen alert fires.
    appSignupSubmit:
      maxTokens: 20
      tokensPerFill: 10
      fillIntervalSeconds: 1
    # -------------------------------------------------------------------------
    # The PER-CLIENT layer (CONTEXT.md § Edge rate limit). Counted by
    # the shared `ratelimit` service on Redis Stack, so the quota is exact
    # across Envoy replicas. Keyed on the client address (Client-IP contract:
    # the socket peer, masked /32 v4 and /64 v6). Fixed windows, no burst.
    # Sizing rule: about ten times a real client's peak, and ALWAYS below the
    # route's fuse above, or the fuse trips first and this quota never
    # applies. scripts/check-edge-rate-limits.py compares the two.
    #
    # Fail-open by construction, not by knob: envoy.filters.http.ratelimit is
    # rendered with failure_mode_deny: false and there is no value that
    # changes it. When the service is unreachable the fuse still holds and
    # envoy_ratelimit_failure_mode_allowed counts every request that passed
    # unchecked (templates/ratelimit/alertrule.yaml pages on it).
    # -------------------------------------------------------------------------
    perClient:
      # The ratelimit service's config domain. One domain for the whole edge.
      domain: gibson-edge
      # How long Envoy waits for the quota decision before failing open.
      timeoutMs: 50
      # POST /signup on the app vhost, by client address. Signup is once per
      # human; five a minute from one address is already a script.
      appSignupSubmit:
        requestsPerUnit: 5
        unit: minute
      # OIDC login on the app vhost (/ui/login/, /oauth/, /oidc/), by
      # client address. A human retries a password a few times; thirty a
      # minute from one address is credential stuffing. Password reset and
      # invite acceptance live under /ui/login/ (Zitadel), so they share it.
      appLogin:
        requestsPerUnit: 30
        unit: minute
      # Everything else on app. (the dashboard, its Server Actions, assets),
      # by client address. 600/min is 10 rps sustained per address, which
      # covers a NAT'd office of dashboard users; the chain fuse is 4000 rps.
      appCatchAll:
        requestsPerUnit: 600
        unit: minute
      # api. pre-auth discovery (/.well-known/*), by client address. Every
      # CLI and component bootstrap reads these. The fuse is 300 rps/route.
      apiDiscovery:
        requestsPerUnit: 120
        unit: minute
      # /capabilitygrant/v1/register, by client address: once per host. The
      # fuse is 30 rps.
      apiRegister:
        requestsPerUnit: 10
        unit: minute
      # Authenticated /gibson.* RPCs, by JWT subject + tenant as ext-authz
      # asserts them (x-gibson-identity-subject / -tenant, set with
      # headers_to_set so a client copy is overwritten —). One bad
      # component throttles itself, not its customer. 50 rps per subject;
      # ten busy components per tenant stay under the 4000 rps fuse.
      apiAuthenticated:
        requestsPerUnit: 50
        unit: second
    # L4 connection admission on the api filter chain, ahead of the HTTP
    # connection manager. Caps TLS handshake churn — the cost an attacker pays
    # before any HTTP filter runs — and, together with http2MaxConcurrentStreams
    # below, bounds how much one client can extract per connection it opens.
    # 500 new connections/s sustained, 1000 burst.
    apiConnections:
      maxTokens: 1000
      tokensPerFill: 500
      fillIntervalSeconds: 1
    # Downstream HTTP/2 concurrency bound on the api chain. Envoy's default is
    # 2147483647, i.e. one connection may open unlimited concurrent streams.
    # 256 is far above what the dashboard's server-side gRPC pool or the CLI
    # ever multiplexes, and h2 clients queue on SETTINGS_MAX_CONCURRENT_STREAMS
    # rather than erroring, so this is a bound on amplification only.
    http2MaxConcurrentStreams: 256

  service:
    # NodePort for Kind dev (mapped via `make kind-create` extra-port-mappings).
    # Flip to LoadBalancer in production overlays.
    type: NodePort
    httpsPort: 443
    nodePort: 30443
    # Service annotations for cloud load-balancer controllers. A substrate
    # overlay (values-eks) adds the provider's keys
    # here, and MUST include whatever makes that provider preserve the client
    # IP (Client-IP contract). externalTrafficPolicy is Local in the
    # Service template, structurally, for the same reason.
    annotations: {}

  domains:
    # Empty values fall back to api.<global.domain> / app.<...> / apex
    # (<global.domain>) / www.<...> / docs.<...> via the ConfigMap default
    # block. deploy#427: apex + www enable marketing-canonical
    # apex routing (apex serves dashboard; www 301-redirects to apex).
    api: ""
    app: ""
    apex: ""
    docs: ""
  # Zitadel JWT issuer the jwt_authn filter validates against. When empty,
  # configmap.yaml derives it from app.<global.domain> (omitting the port
  # in production, including service.nodePort in Kind dev). Override only
  # when the issuer URL doesn't fit either default — e.g. a customer with
  # a custom Zitadel hostname.
  # Spec unified-identity-and-authorization Phase H/8.8 (Req 1.6).
  zitadel:
    issuer: ""
  spiffe:
    # When true, mounts the SPIRE Workload API socket so SDS can later wire
    # SPIFFE mTLS validation. Trust-domain SAN matching is enforced by the
    # Envoy filter — never URI prefix matching.
    enabled: true
    workloadApiSocket: "/run/spire/sockets/api.sock"
  tls:
    # The Envoy edge TLS material is owned exclusively by cert-manager via
    # the Certificate resource in templates/cert-manager/certificate.yaml
    # (gated on certManager.envoyEdge.enabled, see below). The historical
    # in-chart `lookup`-then-keep + `genCA`/`genSignedCert` path was deleted
    # in deploy#124 (envoy-cert-unify A). Setting selfSigned: true is now
    # a hard render-time error (deploy#125 / parent deploy#123). Migration:
    #   selfSigned: false
    #   certManager.envoyEdge.enabled: true
    #   certManager.envoyEdge.issuer: letsencrypt-prod  # or
    #                                  letsencrypt-staging | selfsigned-ca
    selfSigned: false
    secretName: "gibson-envoy-tls"
  resources:  # 512Mi/1Gi: the Coraza WASM VM (V8 + OWASP CRS) needs it — 512Mi OOMKilled Envoy on a live baseline install
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# -----------------------------------------------------------------------------
# Neo4j tenant-mode selector (no shared cluster)
# -----------------------------------------------------------------------------
# The shared in-chart Neo4j subchart was removed in spec graphrag-tenant-scope.
# Per-tenant Neo4j Community StatefulSets are provisioned by the tenant-operator
# (Go-built today — the tenant-neo4j-template ConfigMap it is meant to read is
# not yet rendered by this chart, deploy#1437; see the tenantNeo4j: block below
# for tier sizing). The keys here only select the daemon's Neo4jEndpointResolver
# implementation; nothing in this block describes a shared cluster anymore.
neo4j:
  # tenant_mode — selects the daemon's Neo4jEndpointResolver implementation.
  #   - "instance":  per-tenant StatefulSet, registry lookup (default).
  #   - "multi-db":  shared Enterprise cluster with tenant_<id> databases.
  # Spec: per-tenant-data-plane-completion Tasks 11-15, Req 5.
  tenant_mode: "instance"

  # shared_cluster_uri — Bolt URI for the shared Neo4j Enterprise cluster.
  # Required ONLY when tenant_mode == "multi-db". Ignored for "instance".
  # Example: "neo4j+s://aura-cluster.example.com:7687"
  shared_cluster_uri: ""

# -----------------------------------------------------------------------------
# Entitlements seam (/ deploy#1032).
#
# The entitlements-svc workload has been RE-HOMED to the SaaS overlay
# (helm/saas-overlay/entitlements-svc). The core umbrella carries ZERO
# closed/SaaS image references; the overlay supplies the entitlements-svc
# Deployment + Service + ClusterSPIFFEID + NetworkPolicy.
#
# The only entitlements surface in the core chart is the daemon's seam knob:
#   gibson.entitlementsEndpoint  (defined in the gibson: section above)
#
# Self-hosted profile: leave gibson.entitlementsEndpoint empty (default).
#   Daemon uses the embedded OSS ConfigProvider (no-op, unlimited).
#
# SaaS profile: the gitops SaaS overlay composition (envs/{staging,prod}/
#   saas-overlay-values.yaml) sets gibson.entitlementsEndpoint to point at
#   the in-cluster entitlements-svc Service deployed by the overlay chart.
#
# The no-closed-refs render guard (chart-bats-tests CI) asserts this chart
# rendered with the self-hosted profile contains zero ghcr.io/zeroroot-ai/billing
# references (deploy#1032).
# -----------------------------------------------------------------------------


# mailpit: kind dev-only delivering SMTP sink (signup-email-delivery, the
# deploy companion to gibson#1228 / dashboard#991).
#
# gibson#1228 makes the daemon refuse to serve the self-serve signup RPCs —
# and refuse to BOOT at all when `registration` is open, which it is
# by default — unless global.email.provider=smtp (a transport that actually
# Delivers()). Kind has no SMTP account to hand it, and "log" no longer
# satisfies that requirement (it is a non-delivering stub by design — see
# gibson.email above). mailpit is the dev-only delivering sink that closes
# that gap: it accepts SMTP on port 1025 like a real mail system (so
# mailer.RequireDelivering is satisfied and the daemon boots) and exposes a
# web UI on 8025 so a developer can open the verification link by hand,
# exactly like the old "log" provider let them read it from stdout — except
# the message actually goes somewhere, same as it will in staging/prod.
#
# This is the "dev-profile sink" shape calls for, not a disabled
# required service: mailpit backs signup delivery ONLY on kind (enabled here
# defaults false; values-kind.yaml flips it on alongside
# global.email.provider=smtp pointed at this Service). Staging/prod are wired
# to SES's SMTP endpoint instead (values-aws-prod.yaml) — mailpit is never
# reachable from outside the kind cluster and MUST NOT be enabled in any
# staging/prod overlay.
#
# Upstream: https://github.com/axllent/mailpit
mailpit:
  enabled: false

  image:
    repository: ghcr.io/zeroroot-ai/mirror/mailpit
    tag: "v1.28.3@sha256:27cfb8893806ed676042a00f4db70325a0d57cc5217349d210b6dd903e1a7e67"
    pullPolicy: IfNotPresent

  ports:
    smtp: 1025
    http: 8025

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi







# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
#
# Identity is owned by Zitadel (see the `zitadel:` block above); the dashboard
# is a standard OIDC RP via Auth.js v5. The dashboard's externally-facing URL
# used for OAuth callbacks lives at .Values.dashboard.authUrl. The Auth.js
# HMAC (AUTH_SECRET) is auto-generated into the dashboard Secret by
# templates/dashboard/secret.yaml.

# Dashboard PostgreSQL connection settings used by the daemon for the
# tenant_provisioning table (and by the dashboard pod via DATABASE_URL).
# Dashboard PostgreSQL connection settings are under dashboard.postgres
# in the main dashboard: block above (line ~194). Do NOT add a second
# dashboard: key here — YAML duplicate keys cause silent override.

# =============================================================================
# SDK release artifact pin (Phase H/8.6, Req 4.7)
# =============================================================================
# DEPRECATED (deploy#852). The ext-authz authz registry is no longer pulled
# from a version-pinned OCI artifact at pod startup — ext-authz now fetches it
# from the daemon's mTLS endpoint (gibson.service.authzRegistry +
# spiffe.authzRegistryReaderSVIDs), so the daemon is the single source of truth
# and there is NOTHING to pin or bump. The version-pin lockstep below caused
# the registry to silently drift behind the deployed daemon and default-deny
# newly-added RPCs.
#
# The `sdk.version` / `sdk.registry` / `sdk.imagePullSecret` fields are now
# UNUSED in the default path and retained only so existing overlays that still
# set them render without error. `sdk.allowPublicFallback` is gone: no template
# read it, and a reader took it for a live fallback to a public registry. The
# air-gapped install path still uses `sdk.bypassRegistryValidation` +
# `sdk.embeddedRegistry` (ConfigMap-mounted registry, no daemon dependency).
sdk:
  # Gibson release version. Format: "vX.Y.Z" matching a tagged release at
  # github.com/zeroroot-ai/gibson. The ext-authz init container pulls
  # registry.yaml from the private OCI artifact published at that tag.
  # Bump this in lockstep with the gibson daemon image digest.
  # Spec: private-authz-registry Task 10.
  # Pinned to v0.124.3 — the newest published github.com/zeroroot-ai/gibson
  # tag (deploy#1174). The prior v0.125.0 pin named a tag that was never
  # cut, so any overlay that still exercises the non-default OCI-pull path
  # (or the render-time validateRegistryFromSDK guard) referenced a
  # nonexistent artifact. This field is DEPRECATED (see the block above):
  # the default path fetches the registry from the daemon over mTLS, so this
  # is only load-bearing for the air-gapped `bypassRegistryValidation` path.
  # Bump in lockstep with the gibson daemon image digest.
  # Spec: private-authz-registry Task 10.
  version: "v0.124.3"
  # OCI repo holding the registry.yaml artifact (oras pull source). The
  # package is public, so a pull from ghcr.io needs no credential.
  # For air-gapped installs, set bypassRegistryValidation=true and supply
  # embeddedRegistry instead.
  registry: "ghcr.io/zeroroot-ai/internal-authz-registry"
  # Name of the kubernetes.io/dockerconfigjson Secret that the ext-authz
  # `pull-registry` init container uses to authenticate `oras pull`, for an
  # install that mirrors the registry into a private registry.
  #
  # Pod-level imagePullSecrets only authenticate KUBELET image pulls;
  # they do NOT propagate to runtime tools like `oras` running inside an
  # init container. This Secret is projected as $DOCKER_CONFIG/config.json
  # into the init container so oras finds it via standard docker auth.
  #
  # The chart's registry-credentials ExternalSecret writes this Secret from
  # the ClusterSecretStore (the keyring, OpenBao and ExternalSecret chain,
  # ADR-0084). Nothing creates it by hand.
  imagePullSecret: "ghcr-credentials"
  # Set true to bypass validateRegistryFromSDK — the operator commits to
  # supplying a baked-in registry on a custom ext-authz image. Discouraged
  # outside fully air-gapped installs; drift between the daemon's compiled
  # registry and the ext-authz YAML produces silent fail-closed at runtime.
  bypassRegistryValidation: false
  # Embedded registry YAML (multi-line string). Used ONLY when
  # bypassRegistryValidation=true — replaces the init-container pull with
  # an in-chart copy of registry.yaml rendered into the
  # gibson-extauthz-rpc-registry ConfigMap. The ext-authz Deployment
  # then mounts the ConfigMap directly at /etc/gibson/registry.yaml.
  embeddedRegistry: ""

# =============================================================================
# cert-manager integration (Phase H/8.3)
# =============================================================================
# We DO NOT bundle cert-manager itself; the chart assumes a cluster-wide
# install (helm install cert-manager jetstack/cert-manager). What this
# chart DOES render are the ClusterIssuers Gibson uses to issue the Envoy
# edge cert at api.<global.domain>:
#
#   - letsencrypt-staging — HTTP-01, used during PR/canary testing
#   - letsencrypt-prod    — HTTP-01, public SaaS edge
#   - selfsigned-ca       — root CA + signing CA chain for on-prem / Kind
#                            (no public DNS needed)
#
# Each issuer is gated independently. The Certificate resource for the
# Envoy edge cert is rendered when certManager.envoyEdge.enabled=true and
# uses certManager.envoyEdge.issuer (must point at one of the gated
# issuers above; mismatch fails helm template).
#
# Spec unified-identity-and-authorization Phase H/8.3 (Reqs 3.7).
# -----------------------------------------------------------------------------
# external-secrets-operator integration.
#
# ESO is REQUIRED infrastructure across every environment (one-code-path
# epic, deploy#186, #203). The legacy on/off toggles under this block
# (and the parallel `eso` block below) were deleted — every environment
# that installs gibson-workloads MUST have external-secrets-operator
# running. Only substitution settings remain configurable below.
# -----------------------------------------------------------------------------
externalSecrets:
  # Deterministic cold-bringup ordering (deploy#820). When true, the
  # ClusterSecretStore carries the earliest Argo sync-wave (-10) so the
  # secret-provisioning chain materialises before the chart's pre-install hooks
  # that mount the resulting secrets. The umbrella (single-Application install)
  # sets this true; kind keeps it false (its separate wave-ordered Applications
  # already order secrets first).
  preSyncBringup: false
  # THE ClusterSecretStore. One store, on every profile, backed by the
  # platform's own OpenBao (deploy#1733). There is no provider
  # branch and no `create` toggle: the chart always renders it.
  clusterSecretStore:
    # Name of the ClusterSecretStore the chart-rendered ExternalSecrets
    # reference.
    name: gibson-secrets
    # The ServiceAccount ESO presents to OpenBao's kubernetes auth mount.
    # The external-secrets subchart renders it (deploy#1728); an empty
    # namespace means the release namespace, where the subchart puts it.
    # The openbao-auto-init sidecar binds the eso-reader role to exactly
    # this name and namespace, so the store and the role cannot drift.
    serviceAccount:
      name: "external-secrets"
      namespace: ""
    # The OpenBao coordinates. Defaults match what the sidecar writes; they
    # are here so a store and a seeder can move together, never apart.
    openbao:
      # The kv v2 mount. Every key lives at <kvMount>/data/<key>.
      kvMount: "secret"
      # The kubernetes auth mount path.
      authMount: "kubernetes"
      # The read-only role bound to the ServiceAccount above.
      esoRole: "eso-reader"
  # How often ESO re-reads OpenBao. Default 60s mirrors the
  # eso.refreshInterval setting below.
  refreshInterval: "60s"

certManager:
  # cert-manager is REQUIRED infrastructure — every TLS material in this
  # chart (Envoy edge cert, per-Postgres-alias certs, daemon callback +
  # metrics certs, ext-authz gRPC + health certs) traces back through a
  # cert-manager ClusterIssuer. No legacy "bring-your-own / disable
  # cert-manager" path exists. The deploy#201 deletion of the .enabled
  # toggle is enforced by the chart's preflight validator
  # (gibson.validateCertManagerCRDs).
  #
  # Operators MUST install cert-manager CRDs before installing this chart:
  #   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
  # Spec first-deploy-unblock-and-ha R7.18. Spec one-code-path (deploy#186).

  # Per-issuer toggles. At least one must be true.
  issuers:
    letsencrypt:
      # Render letsencrypt-staging + letsencrypt-prod ClusterIssuers.
      # Solver is configurable via `solver` (default http01 for backward
      # compat with kind/dev nginx). On AWS, HTTP-01 races ALB target-group
      # warmup (~30s) against ACME's per-attempt timeout — set solver to
      # `dns01-route53` in the prod overlay so cert-manager publishes the
      # ACME challenge record via Route53 directly. Tracked at deploy#362.
      enabled: false
      # Email registered with the ACME account. REQUIRED when letsencrypt.enabled.
      email: ""
      # Solver to use for ACME challenges. One of:
      #   - http01         (default) — HTTP-01 via an ingress controller (kind)
      #   - dns01-route53           — DNS-01 via Route53 (AWS prod)
      # Spec first-deploy-unblock-and-ha + deploy#362.
      solver: "http01"
      # IngressClass cert-manager uses to solve HTTP-01 challenges. Must
      # match an installed ingress-nginx (or equivalent) controller. Used
      # only when solver=http01.
      ingressClass: "nginx"
      # DNS-01 Route53 solver config. Used only when solver=dns01-route53.
      # cert-manager publishes the ACME challenge record with the credential
      # in credentialsSecret: an access key pair scoped to the environment's
      # zone (stage 0 mints it as the `dns` IAM user and the bringup writes
      # it into the Secret; a self-hosted operator supplies the same Secret).
      # No IRSA: stage 1 mints no workload role (deploy#1744), and without a
      # named Secret cert-manager falls back to the SDK chain, which on EKS
      # is the node's instance profile — measured on staging 2026-09-10 as
      # "no EC2 IMDS role found", every challenge pending for good.
      # hostedZoneID can be left empty for cert-manager to auto-detect from
      # the Certificate's dnsNames (route53:ListHostedZonesByName).
      dns01Route53:
        region: ""        # e.g. us-east-1 (REQUIRED when solver=dns01-route53)
        hostedZoneID: ""  # optional; empty means auto-detect
        # The Secret holding the Route53 credential, in the release namespace
        # (cert-manager's cluster-resource namespace). Empty means no
        # credential: the solver renders none and cert-manager uses the SDK
        # default chain.
        credentialsSecret:
          name: ""
          accessKeyIDKey: "access-key-id"
          secretAccessKeyKey: "secret-access-key"
    selfsigned:
      # Render the self-signed root + signing CA pair. Used for on-prem /
      # Kind dev clusters with no public DNS. Default false.
      enabled: false
    awspca:
      # Render the AWSPCAClusterIssuer (awspca-issuer) for prod. The
      # awspca-issuer CRDs (https://github.com/cert-manager/aws-privateca-issuer)
      # MUST be installed cluster-wide before enabling this. Spec
      # first-deploy-unblock-and-ha R7.18-R7.23.
      enabled: false
      arn: ""        # ACM-PCA ARN, e.g. arn:aws:acm-pca:...:certificate-authority/<id>
      region: ""     # AWS region, e.g. us-east-1
    vault:
      # Render the OpenBao-backed ClusterIssuer (vault-issuer) for kind/dev.
      # The chart's in-cluster OpenBao PKI engine + approle role + role-id/
      # secret-id materialisation MUST be seeded by the
      # vault-approle-cert-manager-init Job before this issuer is consumed.
      #
      # Auth: cert-manager's `spec.vault.auth.appRole` shape (deploy#351,
      #). The previous shape used the now-forbidden
      # Kubernetes-auth mount, which was never enabled in the in-chart
      # OpenBao, so first cert renewal 404'd. See for the
      # full migration history; that ADR also lists the literal path
      # string in the deny-list so it MUST NOT appear here.
      enabled: false
      path: ""       # OpenBao PKI sign mount path, e.g. pki_int/sign/gibson
      auth:
        appRole:
          # OpenBao approle auth mount path. The bootstrap Job enables
          # auth/approle at this path (idempotent on "already in use").
          path: "approle"
          # approle role_id. Non-secret + chart-templated. REQUIRED when
          # the vault issuer is enabled — chart fails render LOUD if
          # empty. Operators normally set this from the same backend that
          # the K8s Secret in `secretRef.name` is materialised from. For
          # kind dev the bootstrap Job both mints + writes the value to
          # the K8s Secret (Job-direct-write path) so this static field
          # CAN be a stable label-only value while the live role-id lives
          # in the K8s Secret keyed under `roleId`. To consume the live
          # value, operators templating from gitops also point `roleId`
          # at the same backend property.
          roleId: ""
          # K8s Secret holding the approle secret_id (and, by convention,
          # the matching roleId for ESO-managed rotation flows). Default
          # name + key match the gitops ExternalSecret at
          # apps/<env>/manifests/standalone-externalsecrets/
          # cert-manager-approle-externalsecret.yaml.
          secretRef:
            name: "gibson-cert-manager-approle"
            key: "secretId"

  # Certificate for the Envoy edge listener (api.<domain>). The Envoy edge
  # cert is produced exclusively by this Certificate; envoy.tls.selfSigned
  # MUST be false (validateEnvoyTlsNotSelfSigned, deploy#125). Defaults to
  # the production shape (`letsencrypt-prod` issuer). Kind/dev overlays
  # flip `issuer: "selfsigned-ca"` and enable `issuers.selfsigned`.
  envoyEdge:
    enabled: true
    # Issuer to use. Must be one of: letsencrypt-staging, letsencrypt-prod,
    # selfsigned-ca. Mismatch (e.g., selfsigned-ca with selfsigned.enabled=false)
    # fails helm template.
    issuer: "letsencrypt-prod"
    # Output Secret. The Envoy Deployment mounts envoy.tls.secretName, so
    # leave this aligned (default matches envoy.tls.secretName).
    secretName: "gibson-envoy-tls"
    # DNS names on the cert. The first entry is the Common Name. The chart
    # defaults to api.<global.domain> when this is empty.
    dnsNames: []
    # Renew this many hours before expiry (cert-manager default is 30 days
    # for 90-day certs). Override only if you have monitoring tied to a
    # specific renewal window.
    renewBefore: ""
    # Cert duration. cert-manager defaults to the issuer's preferred value
    # (90 days for Let's Encrypt, 1 year for self-signed). Override only
    # for compliance reasons.
    duration: ""

# =============================================================================
# OpenBao — KMS for capability-grant JWT signing (Phase H/8.2)
# =============================================================================
# The daemon's CG-JWT issuance (internal/capabilitygrant/mint.go, Reqs 5.1
# and 13.3) calls OpenBao Transit for the master signing key.
#
# deploy#223 (one-code-path epic): OpenBao is STRUCTURAL — the in-chart
# StatefulSet renders unconditionally on every install. The previous
# `enabled` master switch and `external` substitution escape hatch
# have been DELETED. Customers running on EKS who prefer managed-OpenBao
# become a separate product question, not a chart toggle.
#
# ONE REPLICA. The chart writes `storage "file"`, so each pod holds its own
# data directory. A second replica is a second, separate secret store behind
# the same Service. The template fails the render above one replica. More
# replicas need Raft storage in this chart first.
openbao:
  # The transit key of the platform-operator (platformBootstrap.vaultTransit.keyName
  # in gibson-operators). The OpenBao policy of the platform-operator grants
  # this one key. scripts/check-openbao-policies.py fails when the two differ.
  platformTransitKey: "master-kek"
  image:
    repository: ghcr.io/zeroroot-ai/mirror/openbao
    tag: "2.5.3@sha256:fdc6da21ca6963560c32336fd7feb9cf2d5e52668f1a1647205a4b41171f0806"
    pullPolicy: IfNotPresent

  replicas: 1

  config:
    # No devMode and no devRootToken (deploy#1732): no profile mints a literal
    # root token. The openbao-auto-init sidecar revokes the initial root on
    # every profile and gets back in with its own ServiceAccount (role
    # openbao-seeder). The listener serves only TLS, from the chart CA of
    # templates/auth/openbao-tls.yaml; no value turns TLS off, and the deleted
    # key openbao.config.tlsDisable fails the render (ADR-0027).

    # deploy#1195: OpenBao audit device. `bao audit enable` was never called in
    # any environment, so every secret read — every per-tenant KEK derivation,
    # every data-plane credential fetch — is completely unlogged and an incident
    # cannot be scoped after the fact.
    #
    # DEFAULT OFF, AND THAT IS DELIBERATE. A bad audit device is not a degraded
    # log, it is a total outage: OpenBao runs a write sanity check during
    # post-unseal setup and a failure ABORTS post-unseal, leaving the server
    # INITIALIZED BUT SEALED. This stanza also lands under `checksum/config`, so
    # turning it on rolls the OpenBao pod on the next sync. Enable it per
    # environment, watch the roll, and only then promote — do not ship it on
    # everywhere at once. The readiness probe in this chart now reports NotReady
    # on a sealed server (it used to say Ready), so a failure is visible.
    #
    # filePath MUST be the literal "stdout", NOT "/dev/stdout". The file audit
    # backend special-cases "stdout" and writes to the process's own stdout;
    # "/dev/stdout" needs a real open(2), which fails for the container's uid
    # 100 and bricks the server as described above. Verified against
    # openbao/openbao:2.5.3. A path on the data PVC also works, until the volume
    # fills — at which point OpenBao blocks every request.
    #
    # log_raw stays false: the trail records which path was accessed by which
    # token accessor (HMAC-SHA256), never the secret material.
    audit:
      enabled: false
      filePath: "stdout"

    # THE SEAL (deploy#1731). OpenBao runs the `static` seal on
    # every profile: kind, EKS, a customer cluster. The 32-byte key is one
    # member of the bringup keyring and reaches the pod as a file from the
    # Kubernetes Secret named here, in the release namespace.
    #
    # THE CHART RENDERS NO SECRET FOR IT. The bringup writes it BEFORE the
    # umbrella syncs, from the OPENBAO_SEAL_KEY member of the keyring file
    # stage 0 wrote (`make substrate ENV=kind`, scripts/keyring.sh): through
    # scripts/keyring-to-cluster.sh, run by `make recreate ENV=kind` and by
    # scripts/baseline-up.sh (deploy#1737), and in the backup exit test by the
    # workflow itself. An operator installing without the bringup runs
    # scripts/keyring.sh and scripts/keyring-to-cluster.sh the same way, and
    # keeps the keyring file OUTSIDE the cluster. It is the only thing that
    # opens the archive; without it a restore is ciphertext.
    #
    # Both names are `required` in the template: an empty value fails the
    # render rather than mounting a volume that points at nothing. The
    # secret-plumbing guard allowlists the name because its producer is the
    # bringup, not a chart (same pattern as smtp.passwordSecretName).
    #
    # A pod restart returns unsealed with no human step. A store started
    # under a keyring that is not the one it was sealed with comes up
    # Initialized=true, Sealed=true and stays sealed (measured on 2.5.3).
    # There is no `kubernetes` seal, no `kms` seal and no unseal-keys
    # Secret any more; do not add one back.
    seal:
      keyringSecretName: "bringup-keyring"
      keyringSecretKey: "openbao-seal-key"

  # ServiceAccount annotations: workload identity where the substrate has it.
  # Empty in kind.
  serviceAccount:
    annotations: {}

  # Backup. Velero is the one backup producer for this volume: the hourly
  # Schedule in the gibson-velero chart copies the data directory as files to
  # the durable bucket. A Raft snapshot is not possible on `storage "file"`.


  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # The Service listens on 8200 over TLS only (gibson.openbaoAddr); the port
  # is not a value.
  service:
    type: ClusterIP

  # JWT auth method config used by the tenant-operator (per-tenant role
  # for plugin workloads) and at runtime by the daemon authenticating
  # to OpenBao with a SPIRE JWT-SVID. tenant-operator#132 documents the
  # failure mode when this isn't set; slice 1 (tenant-operator#133) is
  # the vault-jwt-auth-init Job at templates/auth/vault-jwt-auth-init.
  #
  # amendment ("Vault auth/jwt mount is SPIRE-only") makes the
  # mount single-issuer: Vault 1.18.3 has a single string-valued
  # `bound_issuer` per mount (no `bound_issuers` plural). The sole
  # Vault-auth caller at runtime is the daemon, presenting a SPIRE
  # JWT-SVID — plugins receive secret material from the daemon over
  # the broker channel and never speak to Vault directly. The previous
  # Zitadel-flavoured `boundIssuer` was vestigial; it is removed.
  jwtAuth:
    # spireOidcIssuer is the SPIRE OIDC discovery provider's issuer URL
    # (the `issuer` field served at /.well-known/openid-configuration).
    # Both kind and prod overlays set https://oidc-discovery.zeroroot.ai,
    # the upstream SPIRE chart's default jwt_issuer.
    # REQUIRED — chart fails render LOUDLY when empty.
    spireOidcIssuer: ""
    # spireOidcJwksURL is the JWKS URL Vault dials to fetch signing
    # keys. Defaults to `${spireOidcIssuer}/keys`. Set explicitly when
    # the JWKS path differs from the issuer URL + /keys.
    spireOidcJwksURL: ""
    # spireBundleConfigMap is the name of the SPIRE root trust bundle
    # ConfigMap (k8s_configmap BundlePublisher output, JWKS form). The
    # Job converts the bundle to PEM at runtime and passes it to Vault
    # as `jwks_ca_pem` so Vault can validate the SPIRE-issued cert on
    # the OIDC discovery provider's JWKS endpoint.
    spireBundleConfigMap: "spire-bundle"
    # ============================================================
    # audience — the SPIRE→Vault `aud` claim contract.
    # ============================================================
    # The daemon's broker init calls SPIRE Workload API
    # `source.Token(ctx, audience)` for every per-tenant Vault auth
    # refresh. SPIRE mints a JWT-SVID with the requested string as the
    # `aud` claim. Vault's per-tenant role (gibson-plugin-<tenant_id>)
    # rejects the login unless its `bound_audiences` list contains the
    # exact same string.
    #
    # tenant-operator#148 wires the operator's
    # GIBSON_VAULT_JWT_BOUND_AUDIENCE env into every per-tenant role's
    # bound_audiences when writing the role. gibson#187 wires the
    # daemon's GIBSON_DAEMON_VAULT_JWT_AUDIENCE env into the audience
    # requested from SPIRE. The two MUST hold the same string — when
    # they don't, every per-tenant Vault login fails up front and
    # signed-up tenants see 412/500 on data-bearing endpoints (parent
    # PRD gibson#167 amendment docs#34).
    #
    # This single chart value is the source of truth: it is plumbed to
    # both env vars by the templates that own those workloads
    # (helm/gibson-workloads/templates/gibson/statefulset.yaml and
    # helm/gibson-operators/templates/tenant-operator/deployment.yaml).
    # If you change it, you change both — there is no way to drift them.
    #
    # REQUIRED — chart fails render LOUDLY when empty (mirrors the
    # spireOidcIssuer required pattern; see deploy#354).
    audience: ""

# -----------------------------------------------------------------------------
# SPIRE — SPIFFE Runtime Environment for workload identity
# -----------------------------------------------------------------------------
# Deploys SPIRE Server, Agent, Controller Manager, and PostgreSQL.
# When enabled, in-cluster components authenticate via mTLS using X.509-SVIDs
# issued by the SPIRE CA instead of Kubernetes ServiceAccount tokens.
#
# NOTE: The standalone `spiffeJwksExporter` stanza was removed by spec
# service-acting-auth Task 17. The SPIFFE-JWT-SVID provider was the only
# consumer; the platform has consolidated on Zitadel JWTs for service-acting
# auth (Envoy `jwt_authn` + dashboard `verifyZitadelBearer`). SPIRE remains
# for X.509 mTLS transport security (Envoy ↔ daemon).

# fga-init Job — seeds OpenFGA store + model and writes the
# gibson-fga-config ConfigMap that ext-authz / daemon / tenant-operator
# consume at startup. Required infrastructure (one-code-path epic /
# deploy#187); the previous `.enabled` toggle was a degradation surface
# and has been deleted. Overlays that point at a separately-managed
# OpenFGA should override `openfgaService` / `openfgaHttpPort` (the Job
# idempotently upserts the store + model, so re-running against an
# externally-managed FGA is safe).
fgaInit:
  # OpenFGA HTTP service. Sibling Argo Application installs OpenFGA under
  # release `gibson-openfga`; override in overlays that use a different
  # release name.
  openfgaService: gibson-openfga
  openfgaHttpPort: 8080

# -----------------------------------------------------------------------------
# ratelimit — the shared per-client quota service (deploy#1657).
#
# envoyproxy/ratelimit (Apache 2) counting in the structural Redis Stack under
# the `rl:` key prefix, so the quota is exact across Envoy replicas. Core,
# always-on: there is no `.enabled`. Replicas FOLLOW envoy.replicas, so the
# limiter is never the lone single point behind an HA edge.
#
# Envoy reaches it over SPIFFE mTLS. The ratelimit binary can only load static
# certificate files, so an Envoy SIDECAR in this pod terminates mTLS through
# SPIRE SDS (auto-rotating, client SAN pinned to platform/envoy) and forwards
# to the ratelimit gRPC port on loopback. Same image, same SDS pattern as the
# edge — no spiffe-helper, no restart-on-rotation.
# -----------------------------------------------------------------------------
ratelimit:
  image:
    # Docker Hub carries commit-sha tags only. 8fe6ea42 = master 2026-08-24.
    # Mirrored by zeroroot-ai/.github mirror-list.yaml.
    repository: ghcr.io/zeroroot-ai/mirror/ratelimit
    tag: "8fe6ea42@sha256:a61547259607d40aff153050c2a87873ca1676d1d9f5f06937d412000dcc2df1"
    pullPolicy: IfNotPresent
  logLevel: info
  ports:
    # The mTLS port the Envoy sidecar listens on; the Service targets it.
    grpc: 8081
    # ratelimit's own plaintext gRPC, bound to 127.0.0.1 only.
    local: 8082
    # ratelimit's HTTP port: /healthcheck for probes.
    http: 8080
    # ratelimit's own Prometheus endpoint (/metrics): quota hits, over-limit
    # counts, Redis pool health. Also what keeps its stats out of the log.
    metrics: 9090
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
  sidecar:
    # The Envoy mTLS terminator. Reuses envoy.image.
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 96Mi
  serviceAccount:
    create: true
    # A SPIRE attestation attribute (k8s:sa: selector on the ClusterSPIFFEID)
    # and a ValidatingAdmissionPolicy key. Never talks to the API server.
    name: gibson-ratelimit
    annotations: {}

spire:
  # SPIRE is REQUIRED infrastructure — every workload identity (daemon,
  # ext-authz, tenant-operator, dashboard, Envoy) is issued by SPIRE. No "disable SPIRE" path exists. The deploy#201 deletion
  # of the .enabled toggle is enforced by SPIFFE-socket init containers on
  # every consuming pod; pods stay in Init until /run/spire/agent/spire-agent.sock
  # is present.
  #
  # The SPIRE server itself is rendered by the umbrella chart's own `spire`
  # sub-chart dependency (helm/gibson/Chart.yaml) — the old standalone gitops
  # Argo Application (apps/prod/spire.yaml) was retired with the single-main
  # collapse. This chart only wires the agent socket + ClusterSPIFFEIDs (deploy#751).

  # ClusterSPIFFEID controller-manager className. Must match the
  # className configured on the SPIRE controller-manager's
  # ControllerManagerConfig — ClusterSPIFFEIDs with a different className
  # (or none, when watchClassless=false) are silently ignored, so the
  # SPIRE Server never gets registration entries, NewX509Source calls
  # block indefinitely, and SPIFFE-enabled workloads hang at startup.
  #
  # Defaults to the className the SPIRE Helm chart computes when installed
  # under the gibson-spire release (yes, double `gibson-` — the chart
  # composes its className from chart+release in a way that produces this
  # literal). Override in overlays that install SPIRE under a different
  # release name.
  controllerManager:
    className: "gibson-gibson-spire"

  # The SPIRE server is rendered by the umbrella chart's own `spire`
  # sub-chart dependency (helm/gibson/Chart.yaml). This chart's in-chart
  # server, removed in deploy#751 (PRD deploy#750), stays gone. The trust
  # domain is global.spire.trustDomain, which the SPIRE chart and this chart
  # both read (ADR-0164).

  agent:
    # Workload API socket path (the SPIFFE_ENDPOINT_SOCKET env var the SDK +
    # dashboard expect). Spec unified-identity-and-authorization Phase H/8.1
    # standardizes the new path under /run/spire/agent-sockets/api.sock; the
    # legacy /run/spire/sockets/api.sock path remains the rendered default
    # so existing overlays don't break on chart upgrade. Override per-overlay
    # to migrate.
    workloadApiSocket: "/run/spire/sockets/api.sock"

  # Platform identity admission — the ValidatingAdmissionPolicy at
  # templates/spire-server/platform-identity-admission.yaml.
  #
  # The literal `k8s:ns:` / `k8s:sa:` workload selectors on the platform
  # ClusterSPIFFEIDs are enforced by the SPIRE agent against kubelet-derived
  # facts, but every one of them describes the POD — and the pod is
  # described by whoever created it. Kubernetes has no `serviceaccounts/use`
  # verb since PodSecurityPolicy was removed, so a principal with
  # `create pods` in this namespace can simply wear a platform component
  # label and a platform ServiceAccount and have the controller mint it a
  # real platform registration entry. This policy keys on
  # `request.userInfo.username`, the one attribute a pod cannot self-assert,
  # and requires that a pod claiming a platform identity was produced by a
  # built-in workload controller.
  identityAdmission:
    # SHIPS IN DENY. "Audit","Warn" evaluates the policy, records the
    # violation and admits the object anyway — a report, not a control, and
    # a merged artifact containing no enforcement. The legitimate creator
    # set is determined by this chart (every platform pod comes from a
    # Deployment or StatefulSet, and the SVID-fetching helm test now has its
    # own identity rather than the daemon's), the failure is loud, and the
    # rollback is this value.
    #
    # If a control plane turns out to name a creator we did not list — EKS
    # is managed and is not assumed to be a plain cluster — the evidence is the apiserver
    # audit annotation
    # `validation.policy.admission.k8s.io/validation_failure` naming
    # `gibson-platform-identity-{pods,workloads}` over one bringup cycle.
    # Add the principal below; do not widen the protected component/SA
    # lists.
    actions: ["Deny"]
    # Extra principals permitted to create a platform-identity POD directly,
    # appended to the built-in kube-system {replicaset,statefulset,daemon-set,
    # job,cronjob}-controller set. Should stay empty: a platform pod that is
    # not produced by a workload controller is the shape this policy exists
    # to reject. Every entry is a principal that can mint itself a platform
    # SVID — add deliberately, never "to make it work".
    extraAllowedCreators: []
    # Principals permitted to create or update a Deployment / ReplicaSet /
    # StatefulSet / DaemonSet / Job / CronJob whose POD TEMPLATE claims a
    # platform identity. This is the half that closes the two-hop bypass:
    # without it, anyone who can write a Deployment gets their pod created
    # by replicaset-controller, which is allow-listed above.
    #
    # REQUIRED when actions contains Deny — the render fails otherwise,
    # because the legitimate creator differs per install and neither
    # defaulting it nor denying with an empty list is acceptable:
    #   - GitOps clusters: the Argo CD application-controller SA, e.g.
    #     "system:serviceaccount:argocd:argocd-application-controller"
    #   - dev/kind: the identity that runs `helm install`. `kubectl auth
    #     whoami` prints it (kubeadm/kind clusters report
    #     "kubernetes-admin").
    #
    # BE HONEST ABOUT WHAT THIS MEANS. A principal listed here can mint any
    # platform identity, so the platform-identity boundary becomes "who can
    # write to the GitOps repo and who holds the Argo credential". That is
    # an RBAC and code-review boundary. Admission does not move it; it only
    # stops everyone who is NOT that principal.
    #
    # The two intermediate kube-controller-manager SAs
    # (deployment-controller, cronjob-controller) are always appended: they
    # only ever derive an object from one this policy has already checked.
    workloadCreators: []
    # The principal Reloader (stakater, --reload-strategy=annotations) writes
    # with when it rolls a workload for a ConfigMap/Secret change this chart
    # asked for (gibson-fga-config on ext-authz and the daemon). Admitted for
    # restart-only UPDATEs: pod template spec and labels unchanged, only the
    # template annotations moved. Default: the release namespace's "reloader"
    # ServiceAccount. Set "" to disable.
    reloaderPrincipal: ""

  # Tenant-scoped agent SPIFFE IDs — REMOVED, not disabled.
  #
  # This used to render a wildcard ClusterSPIFFEID issuing
  # `spiffe://<td>/tenant/<namespace>/agents/<pod-name>` to any pod wearing
  # `app.kubernetes.io/component: agent` in any `gibson.zeroroot.ai/tenant`
  # labelled namespace. It carried no workloadSelectorTemplates at all, so
  # nothing re-derived the pod's namespace or ServiceAccount from kubelet,
  # and the platform-identity admission policy is scoped to the release
  # namespace and never saw tenant namespaces. Nothing in this workspace
  # parses that SPIFFE ID.
  #
  # Setting this true now fails the render with an explanation rather than
  # rendering the wildcard. The correct shape is one ClusterSPIFFEID per
  # tenant, written by the tenant-operator with the literal tenant id, a
  # namespaceSelector pinned to that tenant's namespace, and literal
  # `k8s:ns:` / `k8s:sa:` workload selectors.
  tenantAgents:
    enabled: false

  # NOTE (deploy#1456): there was a `pemWriter:` block here configuring a
  # spiffe-helper sidecar for the dashboard Pod (image spiffe-helper:0.8.0,
  # resources, securityContext, certDir). It configured nothing: the
  # `dashboard.spiffeHelperContainer` named template it fed was defined in
  # gibson-common and invoked by no template in any chart, and the dashboard
  # Deployment has neither the `spiffe-svids` emptyDir nor the
  # `spiffe-helper-config` volume that template mounts. The helper, its
  # helper.conf ConfigMap and this values block were all deleted together.
  # Dashboard→Envoy is intra-cluster plain HTTP by design (see the
  # gibson_dashboard cluster comment in files/envoy/envoy.yaml); if a future
  # hardening spec wants a SPIFFE-aware sidecar, it is authored fresh against
  # a current spiffe-helper release, not revived from here.


# Tenant Operator (spec: tenant-control-plane-foundation)
# Standalone kubebuilder operator that reconciles Gibson Tenant CRDs and
# child CRDs (TenantMember, AgentEnrollment) across all
# identity and data subsystems.
#
# tenant-operator is structural infrastructure (one-code-path / deploy#188 —
# closed by #303): every tenant CR reconcile depends on it. The previous
# `enabled: true|false` substitution toggle has been deleted; the platform
# cannot run without it. Sub-feature toggles
# (`podDisruptionBudget.enabled`,
# `releaseNamespaceRBAC.enabled`, `rbacBackfill.enabled`,
# `orphanReaper.enabled`, `webhook.enabled`) remain legitimate.
# The connector-operator workload lives in the gibson-operators sub-chart; its
# ServiceAccount name is mirrored here so the ClusterSPIFFEID this chart
# renders (spire-server/clusterspiffeids.yaml) pins the same literal
#.
connectorOperator:
  serviceAccount:
    name: gibson-connector-operator

tenantOperator:




  # ServiceAccount — IRSA annotations injected via serviceAccount.annotations
  # in the prod overlay. The SA name is fixed to "gibson-tenant-operator"
  # (referenced by the ClusterRoleBinding, webhook Deployment, and the
  # OPERATOR_SERVICE_ACCOUNT_NAME env var which tenant_namespace.go reads
  # when constructing per-tenant Secret RoleBindings).
  #
  # name: override only when running multiple operator instances against
  # the same chart (rare). Leave empty to use the chart default.
  serviceAccount:
    name: "gibson-tenant-operator"
    annotations: {}

# =============================================================================
# activeSessionBackfill — one-shot repair Job (SECURITY, deploy#1186)
#
# Spec: instant-session-revocation (gibson#627 Slice 2).
#
# Runs the gibson image's `/usr/local/bin/active-session-backfill` binary as a
# PostSync / post-upgrade hook, AFTER fga-init has seeded the store+model and
# the tenant-operator has provisioned members. For every existing human tenant
# member it writes the FGA `active_session` conditional tuple if missing.
#
# WHY IT MATTERS: `active_session` is a standalone direct relation
# (model.fga:155) with no path into the role hierarchy — an ABSENT tuple DENIES
# every tenant-scoped RPC with a 403. The tuple is normally written by the
# tenant-operator TenantMember controller on membership creation, but that
# write is non-fatal ("backfill will repair"), and several role-grant paths
# (SetTenantRole, AcceptInvitation, TransferOwnership) write NO tuple at all.
# Without this Job a transient operator write failure — or any existing-tenant
# migration — locks users out at cutover, reading as an authz bug.
#
# The binary is IDEMPOTENT and exits zero unconditionally (per-member failures
# are logged as outcome=write_failed and skipped; already-present tuples log
# outcome=already_seeded). Re-running it every sync/upgrade is a safe no-op —
# it is a pure repair net, so there is no enable toggle (one-code-path /
# deploy#187), exactly like fga-init and tenantOwnerBackfill. Renders in ALL
# profiles: active_session gating is authz, not billing, so self-hosted needs
# the repair too.
activeSessionBackfill:
  # OpenFGA HTTP endpoint the backfill writes tuples to. Defaults to the same
  # sibling OpenFGA service fga-init and ext-authz use.
  openfgaService: ""      # empty → falls back to .Values.fgaInit.openfgaService
  openfgaHttpPort: 0      # 0     → falls back to .Values.fgaInit.openfgaHttpPort
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# =============================================================================
# dataPlane — external store overrides for database-per-tenant-data-plane
#
# Spec: database-per-tenant-data-plane Phase I Task 9.4, Requirement 16.2.
#
# When the daemon is deployed (gibson.daemon.enabled=true), all three data-plane
# stores MUST be configured.  The chart accepts either:
#
#   a) An in-chart subchart (neo4j.enabled=true / postgresql.enabled=true;
#      Redis is always in-chart ) — the chart renders the store
#      in-cluster and auto-configures the daemon's connection.
#
#   b) External managed stores via the explicit DSN/URI fields below — set these
#      when customers bring their own RDS, Elasticache, or Neo4j Aura
#      deployments instead of using the bundled in-chart services.
#
# The validateTenantStoresConfigured validator (templates/_validators.tpl) fails
# helm template / install / upgrade if the daemon is enabled and neither (a)
# nor (b) is satisfied for any of the four stores.
#
# Do NOT put credentials here in plaintext — use Kubernetes Secrets or
# ExternalSecrets and reference them via env-var injection in the daemon
# StatefulSet.  The DSN/URI fields here accept ${ENV_VAR} substitution placeholders
# that the daemon's config loader expands at runtime.
# =============================================================================
dataPlane:
  # tenantCredentialsBackfill — pre-upgrade Job that re-runs each
  # provisioner's idempotent Provision step against every Ready Tenant
  # so the per-tenant credentials envelope lands in Vault. Required when
  # crossing the Phase 6.2 cutover (daemon no longer derives the Postgres
  # password locally — it reads PostgresCredentials from Vault).
  #
  # Spec: tenant-provisioning-unification-phase2 Requirement 8.5.
  #
  # Default off — flip to true on the upgrade that ships the Vault-only
  # daemon DSN path. Idempotent on subsequent upgrades.
  tenantCredentialsBackfill:
    enabled: false

  postgres:
    # Discrete fields for the per-tenant admin Postgres instance.
    # The daemon uses this to bootstrap per-tenant databases and roles.
    # Requires a role with CREATEDB privilege.
    # Leave host empty to use the in-chart postgresql subchart (wired via Task 25).
    #
    # D1: discrete fields, NOT a single DSN — matches TenantPostgresConfig struct.
    # Spec: per-tenant-data-plane-completion Req 1, D1.
    #
    # Example (external RDS):
    #   host: rds-cluster.us-east-1.rds.amazonaws.com
    #   port: 5432
    #   admin_database: postgres
    #   admin_password_secret_ref:
    #     name: gibson-tenant-pg-secret
    #     key: TENANT_POSTGRES_ADMIN_PASSWORD
    #   ssl_mode: require
    host: ""
    port: 5432
    admin_database: "postgres"
    # admin_password is NEVER stored here in plaintext.
    # Provide a Kubernetes Secret reference via admin_password_secret_ref.
    # The StatefulSet injects it as TENANT_POSTGRES_ADMIN_PASSWORD env var.
    admin_password_secret_ref:
      name: ""   # defaults to the chart's main db-secrets Secret when empty
      key: "TENANT_POSTGRES_ADMIN_PASSWORD"
    # NOTE: ssl_mode is hardcoded `require` in chart templates (Spec
    # first-deploy-unblock-and-ha R7); no ssl_mode knob here.

  redis:
    # adminURL — Redis URL for the master index DB (db 0) used by the daemon to
    # map tenant IDs to logical DB indices.  Leave empty to use the in-chart redis
    # deployment.
    # Example: "redis://:${REDIS_ADMIN_PASS}@elasticache-cluster.use1.cache.amazonaws.com:6379"
    adminURL: ""

  # openbao — per-tenant credential store config.
  # Spec: tenant-provisioning-unification-phase2 Requirement 8.5.
  # one-code-path (deploy#197): the `.enabled` degradation toggle was
  # deleted. The operator dials OpenBao unconditionally and exits 1 at
  # startup when GIBSON_VAULT_ADDR is missing; the daemon's secrets
  # broker requires Vault per-tenant. The `dataPlane.openbao.*` block
  # under the workloads chart is currently unused by templates here
  # (canonical configuration lives in `helm/gibson-operators/`
  # dataPlane.openbao) and is retained only as a values-shape anchor for
  # future workloads-side bindings.
  openbao:
    # transitKey — name of the transit key the operator uses for
    # per-tenant KEK derivation via HMAC-SHA256. The chart's vault-
    # transit-bootstrap Job creates the key on post-install/upgrade.
    transitKey: "master-kek"

    # edition — "community" (path-prefix model) or "enterprise"
    # (per-tenant OpenBao namespaces). community is the only edition
    # currently exercised end-to-end; enterprise is reserved.
    edition: "community"

    # runBackfill — set to true on a one-time `helm upgrade` to run
    # the tenant-credentials-backfill Job that iterates existing
    # Tenant CRs and populates per-tenant OpenBao credentials. Default
    # off because the operator's reconcile loop covers new tenants
    # organically; only needed at the cutover release.
    runBackfill: false

    # kindRootToken — kind/dev ONLY. When true, the chart renders
    # the `<release>-openbao-keys` Secret with the chart-known
    # dev-mode root token "root", so the operator and the
    # vault-transit-bootstrap Job have a token to authenticate
    # with. Production overlays MUST leave this false and create
    # the Secret out-of-band with a periodic token before
    # `helm install`. The `validateKindRootTokenSafety` chart
    # validator refuses install when this is true and the
    # overlay marks itself production
    # (e.g. `global.environment=prod`).
    #
    # Spec: tenant-operator-saga-capabilities Requirements 2.1.
    kindRootToken: false

# =============================================================================
# tenantNeo4j — per-tenant Neo4j Community StatefulSet sizing & image.
# Spec: per-tenant-data-plane-completion Task 23 / Req 5.7, 6.4 (D7).
#
# INTENDED CONSUMER, NOT YET BUILT (deploy#1437): no template in this
# Tier -> resources mapping lives HERE in the chart, NOT in the operator.
# SREs change sizing by editing values; the operator only resolves which
# tier a tenant is on (from the Tenant CRD) and builds the shape.
#
# These values are delivered by templates/operations/tenant-neo4j-template.yaml,
# which renders the `tenant-neo4j-template` ConfigMap the operator reads.
#
# THEY WERE NOT DELIVERED UNTIL THAT TEMPLATE EXISTED. The operator read the
# ConfigMap and threw its content away, so its own inline table was not a
# fallback — it was the only path, and staging and production ran the
# dev-shaped `team` sizing while this table sat here unread.
#
# THE KEYS ARE THE TIER IDS A Tenant CR CARRIES: team, org, enterprise. They
# used to be small/medium/large, which named the same three things a second
# way and matched nothing the operator resolves.
#
# THE SHAPE IS WHAT THE OPERATOR APPLIES: one storage request, one CPU
# request, and one memory number used for BOTH the request and the limit.
# The JVM heap (memory/4) and page cache (memory/8) are pinned from it, so a
# request and limit that disagreed would size the JVM against memory the
# container may not get. That is why there is no requests/limits split here.
#
# WHICH RUNG GETS WHICH SIZE (ADR-0090). The table below is the floor:
# `team` at the smallest size a non-backed-up Neo4j is measured to run at,
# which is what baseline, developer and CI install. staging and production
# raise `team` to Neo4j's own stated minimum in their environment values,
# where environment sizing belongs.
# =============================================================================
tenantNeo4j:
  image:
    tag: "5.26.0-community"
    pullPolicy: IfNotPresent
  # kindResourceCap — total `limits.memory` cap across all per-tenant Neo4j
  # pods in the release namespace. Renders a ResourceQuota + PriorityClass
  # via templates/operations/tenant-neo4j-resource-quota.yaml.
  # Spec: per-tenant-data-plane-completion Task 33 / Req 10.4.
  #
  # Empty default — production overlays leave this blank (multi-AZ EKS uses
  # cluster-wide LimitRange + Karpenter, not a single ResourceQuota).
  # values-kind.yaml sets this to 8Gi to fence runaway provisioning on a
  # tiny dev node.
  kindResourceCap: ""
  tiers:
    # The measured floor. 100m/1Gi is what every exit test has provisioned a
    # team tenant at, on a single node, with the heap pinned — so it is the
    # smallest size this is known to work at rather than the smallest number
    # someone was willing to write. Neo4j's own chart refuses to render below
    # 500m/2Gi; this runs under that only because the operator pins the heap
    # and page cache instead of letting Neo4j size itself from what it detects.
    team:
      storage: 10Gi
      cpu: 100m
      memory: 1Gi
    # org and enterprise are the chart's existing sizes, which are already at
    # or above Neo4j's stated minimum, so they are the same on every rung.
    org:
      storage: 50Gi
      cpu: 500m
      memory: 4Gi
    enterprise:
      storage: 200Gi
      cpu: "1"
      memory: 8Gi
    # enterprise-deploy is the plan of the first tenant that every self-hosted
    # install seeds (global.firstTenant.tier in the umbrella). It starts at the
    # measured floor, the same as team, so a fresh install fits one small node.
    # Before charts#157 that tenant was team and ran at this size. With no row
    # here the operator fell back to its built-in 1 CPU / 8Gi, the tenant Neo4j
    # pod stayed Pending with "Insufficient cpu", and the tenant never reached
    # Ready. A production install raises this tier in its own values.
    enterprise-deploy:
      storage: 10Gi
      cpu: 100m
      memory: 1Gi

# =============================================================================
# reservedNames — chart-managed denylist consumed by:
#   - the operator's K8s admission webhook (Tenant CR create/update)
#   - the daemon's PlatformOperatorService.GetReservedNames RPC, which the
#     dashboard signup form proxies to validate the tenant slug before submit.
#
# Spec: tenant-provisioning-unification-phase2 Requirement 4.5.
#
# `exact` blocks tenant names that match a value verbatim.
# `prefix` blocks any tenant name starting with the listed string.
#
# Operators MAY extend either list per-environment (gov clouds, regulated
# tenants, etc.) by overriding values; do not patch the ConfigMap directly.
# =============================================================================
reservedNames:
  exact:
    - default
    - kube-system
    - kube-public
    - kube-node-lease
    - gibson
    - argocd
    - vault
    - openfga
    - zitadel
    - velero
    - cert-manager
    - spire
    - spire-system
    - admin
    - administrator
    - root
    - system
    - public
    - api
    - www
  prefix:
    - kube-
    - system-
    - gibson-
    - openshift-
    - kyverno-

# =============================================================================
# Setec sandbox configuration.
#
# Spec: setec-sandbox-prod-default (Tasks 33, 34, 35).
# Design §C2 + §"EKS sandbox-host node-group spec".
#
# Setec is the Firecracker-microVM operator that hosts UNTRUSTED-content
# tool dispatch. The dispatch policy gate (R3) refuses PLUGIN/AGENT for
# UNTRUSTED content; only SANDBOXED dispatch (into Setec) is permitted.
# Production-default tier is real-KVM bare-metal
# (`setec.zeroroot.ai/sandbox-host=true` label / matching NoSchedule taint,
# m5zn.metal / z1d.metal); see eks/gibson/karpenter.tf for
# the Karpenter NodePool + EC2NodeClass that provisions it ON DEMAND
# (scale-to-zero, consolidateAfter=120s — see the cost-guard note below).
#
# The chart's _validators.tpl `fail`s when:
#   - setec.tier == "demo"                        (deprecated; design deviation)
#   - setec.nodeSelector / setec.tolerations non-empty (cost-guard regression —
#     see below; deploy#1080)
#
# The two values that flip behaviour:
#   - setec.enabled  (top-level subchart gate; chart `condition: setec.enabled`)
#   - setec.tier     ("production" only; "demo" is rejected by the validator)
#
# COST GUARD (deploy#1080): setec.nodeSelector / setec.tolerations below flow
# straight through to the Setec subchart's TOP-LEVEL nodeSelector/tolerations
# values (standard Helm subchart passthrough) — which the vendored chart
# (setec's chart templates/deployment.yaml) applies to the OPERATOR
# Deployment's own Pod spec, NOT to dynamically-created Sandbox Pods. Setting
# these to the sandbox-host label/taint (as earlier revisions of this file
# did) pins the operator itself — a permanent, always-desired
# controller-manager replica — onto the tainted, Karpenter scale-to-zero
# metal NodePool. Karpenter provisions nodes to satisfy unschedulable pod
# demand regardless of workload type, so that misconfiguration would boot a
# ~$4/hr metal node on every `helm upgrade`/ArgoCD sync and the node would
# never consolidate (WhenEmptyOrUnderutilized never fires while the operator
# occupies it) — an always-on bill for what is supposed to be an idle-cost
# pool. THEREFORE these MUST stay empty: the operator runs on the general
# workload pool (matching the subchart's own documented default — "The
# operator itself does not need KVM nodes"). Real Sandbox Pod placement onto
# fleet nodes is driven by two mechanisms that are NOT this value:
#   1. Each launcher Pod asks for the device resources setec.zeroroot.ai/kvm
#      and setec.zeroroot.ai/tun of the device plugin (setec#187), so the
#      scheduler places it on a node that exposes /dev/kvm (ADR-0083).
#   2. A SandboxClass (setec.sandboxClasses below) sets `spec.nodeSelector`
#      to additionally require `setec.zeroroot.ai/sandbox-host=true` on the
#      Sandboxes in that class.
#
# KNOWN GAP (tracked in zeroroot-ai/setec): neither
# mechanism above adds a Pod-level `tolerations` entry, and SandboxClassSpec
# has no Tolerations field at all — so today NO Sandbox Pod can actually
# schedule onto a tainted node group (the sandbox-host taint blocks it
# unconditionally). Landing this chart-side fix is necessary but not
# sufficient for an end-to-end Sandbox round-trip on staging until setec adds
# Toleration support.
setec:
  # enabled is the setec seam (ADR-0087). The daemon always dials a setec
  # frontend (ADR-0142), so the seam selects whose fleet runs, never whether
  # one runs. Off means that the setec endpoint names a fleet outside this
  # cluster: set gibson.sandbox.setec.address and spiffeID to its frontend.
  # The render refuses off when the address is empty or names the in-chart
  # frontend, or when spiffeID is empty (validateSetecDispatch). scripts/check-seam-conditions.py holds
  # the list of seams and renders each case.
  enabled: true

  # fullnameOverride pins the Setec subchart's object names to the CANONICAL
  # `setec` prefix (Service `setec-frontend`, operator Deployment `setec`)
  # instead of the release-derived `<release>-setec` (`gibson-setec-…`).
  # The canonical name is baked into every consumer: setec's own dev env +
  # docs (`setec-frontend.setec-system.svc`), gibson's setec round-trip e2e
  # and this repo's setec runbooks (deploy#1084).
  fullnameOverride: "setec"

  # ---------------------------------------------------------------------
  # IMAGES (six). The setec images follow the setec chart version in
  # Chart.yaml, by hand: no version-link fans a setec release into this
  # file. A chart ahead of its operator image hands the operator a flag it
  # does not know and it crash-loops at boot (0.115.0, gibson run
  # 35472500731). Move the chart and the six pins together: setec,
  # setec-launcher, setec-disk-builder, setec-device-plugin,
  # setec-node-agent, setec-frontend. Digests from
  #   gh api orgs/zeroroot-ai/packages/container/<pkg>/versions
  # for the entry tagged v<chart version>.
  #
  # setec has one isolation backend since v0.121.0 (setec#198, ADR-0166):
  # each Sandbox is a Firecracker machine in a launcher Pod that is not
  # privileged. The runtime classes, the node installer, the runtime agent
  # and the keepalive image of the older backends are gone with it.
  # ---------------------------------------------------------------------
  image:
    repository: ghcr.io/zeroroot-ai/setec
    tag: "v0.126.0@sha256:bffd1a4f5228510d0061571179856a864d52d41b6cee86c34ff215c9a15f88c6"

  # launcher is the one runtime. The launcher image holds Firecracker, the
  # guest kernel and the guest agent. The disk builder runs as a Job in the
  # operator namespace before the first launcher Pod of an image digest and
  # pushes the signed disk to diskRepo; each launcher Pod mounts that disk as
  # an image volume (Kubernetes 1.35 or later), so the kubelet pulls it with
  # the image credentials of the node.
  launcher:
    image:
      repository: ghcr.io/zeroroot-ai/setec-launcher
      tag: "v0.126.0@sha256:ce9ec3058354c19b9f4ed5fb6eb39086ede51ceb13d31f97adcebbc334f1da0f"
    # diskRepo is the registry repository of the signed image disks.
    # REQUIRED, and install-specific: the setec chart fails the render when
    # it is empty. The install reads it from substrate.env (SETEC_DISK_REPO,
    # scripts/baseline-up.sh); a hosted environment sets it in its overlay.
    diskRepo: ""
    diskBuilder:
      image:
        repository: ghcr.io/zeroroot-ai/setec-disk-builder
        tag: "v0.126.0@sha256:347e0008fb781d472b030c28d643ced8b2dcdcbbad6dd5f11b0aef1dc4848b02"
      # signingSecret names the Secret in the setec namespace that holds the
      # base64 ed25519 seed (key `seed`) that signs each disk. The seed is
      # the keyring member SETEC_DISK_SIGNING_SEED (scripts/keyring.sh): the
      # bringup writes it into bringup-keyring, the OpenBao seeder stores it
      # at secret/data/setec-disk-signing (files/openbao-seed-keys.txt), and
      # templates/setec/disk-signing-externalsecret.yaml renders it here.
      signingSecret: "setec-disk-signing"
      # publicKeys are the base64 ed25519 public keys of the seed. Each
      # launcher refuses a disk that none of them signed. REQUIRED: the
      # setec chart fails the render when the list is empty. The install
      # derives the key from the keyring seed (scripts/baseline-up.sh) and
      # sets it; list two while the seed rotates.
      publicKeys: []

  # devicePlugin offers /dev/kvm and /dev/net/tun of each fleet node to the
  # launcher Pods as the resources setec.zeroroot.ai/kvm and
  # setec.zeroroot.ai/tun (setec#187), so a launcher Pod is not privileged.
  # Each fleet node must expose /dev/kvm (ADR-0083).
  devicePlugin:
    image:
      repository: ghcr.io/zeroroot-ai/setec-device-plugin
      tag: "v0.126.0@sha256:46d5d2b6393e88e6c2d418c36fa018fdff7f817da1240e3ef5268809151f97c9"

  # nodeAgent — the DaemonSet that snapshots, restores, pauses and resumes
  # the Firecracker machine of each launcher Pod on its node. Ships DISABLED
  # by default (nodeAgent.enabled=false in the subchart) and stays off here:
  # snapshots and the warm pool are opt-in. Digest-pinned regardless so an
  # overlay that flips it on inherits an immutable ref rather than a
  # floating .Chart.AppVersion tag.
  nodeAgent:
    image:
      repository: ghcr.io/zeroroot-ai/setec-node-agent
      tag: "v0.126.0@sha256:931ab4d0927a8f26a01fb42f75b3d05051130e2e964f63f9d052e5acd0333de6"

  # credentials: setec has one credential source, the SPIFFE Workload API
  # (ADR-0142). The frontend serves its X509-SVID from the socket and the
  # daemon dials with its own SVID; no PEM file exists on either end. The
  # socket is the one the SPIRE agent of this chart exposes on each node
  # (spire.agent, hostPath /run/spire/agent-sockets). The trust domain is
  # global.spire.trustDomain, which the subchart reads (ADR-0164).
  credentials:
    spiffe:
      socketPath: /run/spire/agent-sockets/spire-agent.sock

  # systemPolicy is the network policy of the setec namespace, rendered by
  # the subchart (D76): one default deny for every Pod of the namespace and
  # one allow for each component. frontendCallers are the only Pods that
  # reach the frontend gRPC port: the daemon of this release. The entry
  # names the release namespace as a literal, because a subchart value
  # cannot read .Release.Namespace; gibson.validateSetecDispatch fails the
  # render when the entry and the release namespace disagree.
  systemPolicy:
    frontendCallers:
      - namespace: gibson
        podLabels:
          app.kubernetes.io/component: daemon

  # ---------------------------------------------------------------------
  # SANDBOX CONTAINMENT
  #
  # Sandboxes run untrusted code. The keys below decide whether that is
  # confined, and every one of them renders fine when wrong — so
  # gibson.validateSetecContainment in templates/_validators.tpl fails the
  # render rather than letting a quiet flip through.
  # ---------------------------------------------------------------------

  # netpol is the egress posture every generated Sandbox NetworkPolicy is
  # built from. Rendered onto the operator as --reserved-cidrs /
  # --sandbox-resolvers and validated again by the operator at startup.
  netpol:
    # reservedCIDRs is the address space no Sandbox may reach. It is
    # subtracted from every permissive egress rule via ipBlock.except.
    #
    # 10.0.0.0/8 covers this account's VPC (10.40.0.0/16 — see
    # eks/gibson/variables.tf) and 172.16.0.0/12
    # covers the EKS default Service CIDR (172.20.0.0/16). They are listed
    # as the broad parent ranges deliberately: a narrower list would need
    # revisiting on every VPC or Service-CIDR change, and nothing we run
    # needs a Sandbox to reach private address space.
    #
    # 169.254.0.0/16 is the one that matters most on EC2 — it holds the
    # instance-metadata endpoint, and reaching it yields the node role.
    # The IMDS hop limit is pinned to 1 in Terraform as well; these are
    # two independent controls on the same path.
    reservedCIDRs:
      - 10.0.0.0/8  # VPC (10.40.0.0/16) + all other private space
      - 172.16.0.0/12  # EKS Service CIDR (172.20.0.0/16)
      - 192.168.0.0/16
      - 169.254.0.0/16  # link-local, incl. instance metadata
      - 100.64.0.0/10  # CGNAT
      - 127.0.0.0/8
      - 224.0.0.0/4  # multicast
      # IPv6. A reserved prefix subtracts only from a block of its own
      # family, and an allow-list entry can carry an IPv6 block (a literal
      # host, or a resolver answer), so a list with no IPv6 entry leaves
      # every IPv6 destination unrestricted. setec 0.115.0 refuses to render
      # without one. These are setec's own defaults.
      - "::1/128"  # loopback
      - fc00::/7  # unique local
      - fe80::/10  # link-local
      - ff00::/8  # multicast
    # resolvers are the DNS servers Sandbox Pods query. The same list is
    # written into each Pod's dnsConfig with dnsPolicy None, so Sandboxes
    # do not use CoreDNS and cannot enumerate in-cluster Services by name.
    resolvers:
      - 1.1.1.1
      - 8.8.8.8

  # webhook turns on the validating admission webhook. Without it a
  # SandboxClass's allowedNetworkModes and the tenant-label check render
  # but never bind.
  #
  # failurePolicy stays Fail: Ignore admits a Sandbox unchecked exactly
  # when the operator is unreachable, which is when a bypass matters. The
  # subchart runs two operator replicas with leader election and a PDB so
  # fail-closed admission does not block launches during a restart.
  webhook:
    enabled: true
    failurePolicy: Fail
    certManager:
      enabled: true
      issuerRef:
        kind: ClusterIssuer
        # Rendered by templates/setec/webhook-issuer.yaml — a dedicated
        # self-signed issuer rather than one of the shared cluster
        # issuers, which are environment-dependent (awspca in prod, vault,
        # or the selfsigned pair on kind). A webhook serving cert needs no
        # shared trust chain: cert-manager injects the issuing CA into the
        # ValidatingWebhookConfiguration.
        name: setec-webhook-selfsigned

  # sandboxClasses are the classes tenants launch against. A Sandbox that
  # names no class resolves to the one marked default, and a Sandbox that
  # declares no spec.network inherits that class's defaultNetworkMode. No
  # class names a backend: the launcher is the one runtime (ADR-0166).
  sandboxClasses:
    enabled: true
    classes:
      # tool — the scanning posture, and the cluster default. Reaches
      # arbitrary external endpoints on arbitrary ports (that is the
      # product) and nothing inside reservedCIDRs.
      - name: tool
        spec:
          maxResources:
            vcpu: 8
            memory: 16Gi
          defaultNetworkMode: external-only
          allowedNetworkModes:
            - external-only
            - egress-allow-list
            - none
          default: true

      # connector — talks to a small declared destination set and must
      # NOT reach the internet at large, so external-only is deliberately
      # absent. egressExemptCIDRs stays empty: an entry here is reachable
      # by every Sandbox in the class, so it gets added per-endpoint with
      # a stated reason, never as a default.
      - name: connector
        spec:
          maxResources:
            vcpu: 4
            memory: 8Gi
          defaultNetworkMode: none
          allowedNetworkModes:
            - egress-allow-list
            - none
          egressExemptCIDRs: []

      # agent — the coding-agent posture (epic gibson#1593), and the class
      # an always-on bank member runs in (gibson#1706). Runs a coding agent
      # that executes arbitrary tool code. external-only + reservedCIDRs =
      # open web (the model providers, the sign-in flow) but nothing in
      # private space or another tenant.
      #
      # A member stays up for weeks and idles most of that time, so it
      # RESERVES a small slice of a node and bursts to its ceiling:
      #   requests      the reservation (this block). setec 0.113.0+ writes
      #                 min(request, limit) onto the Pod, so the class can
      #                 only lower what the scheduler sets aside. Unset
      #                 keeps requests = limits.
      #   maxResources  the ceiling. The Pod's limits are the Sandbox's
      #                 own spec.resources, sent by the daemon on Launch
      #                 from the claude manifest (gibson#1717, 2 vCPU /
      #                 4Gi). defaultResources is NOT that: setec reads it
      #                 for the warm-pool template only.
      # Two idle members cost 0.5 vCPU / 1.5Gi. The sanctioned profile
      # (helm/gibson/values-baseline.yaml) restates the class list.
      - name: agent
        spec:
          requests:
            cpu: 250m
            memory: 768Mi
          maxResources:
            vcpu: 2
            memory: 4Gi
          defaultNetworkMode: external-only
          allowedNetworkModes:
            - external-only
            - egress-allow-list
            - none
          egressExemptCIDRs: []

  # sandboxNamespaces names the namespaces that hold Sandboxes made by a
  # route other than the frontend. The frontend makes one namespace for each
  # pair of enrolled client and tenant on the first call of the pair
  # (setec#207), with the host guard, the default deny and its two
  # RoleBindings. Naming a namespace here is one decision with two effects,
  # both rendered by the subchart:
  #
  #   1. A namespace-wide default-deny NetworkPolicy — podSelector: {},
  #      every Pod, not only labelled Sandbox Pods. The per-Sandbox
  #      policies select on setec.zeroroot.ai/sandbox, so they confine the
  #      Pods the operator built; a Pod written into the namespace by any
  #      other route carries no such label, is selected by no policy, and
  #      Kubernetes treats an unselected Pod as allow-all. The baseline is
  #      what removes that state.
  #   2. The operator's Pod- and NetworkPolicy-WRITE RBAC is bound here
  #      with a RoleBinding instead of cluster-wide. Cluster-wide
  #      `pods: create` is a cluster-admin path on its own. Reads stay
  #      cluster-wide for the controller-runtime cache.
  #
  # An empty list fails the render (see rbac below), so this is not a
  # value that can be quietly left unset.
  #
  # WHY A DEDICATED NAMESPACE, AND NOT THE GIBSON TENANT NAMESPACE
  #
  # A Sandbox in tenant-<name> would inherit the tenant-operator's
  # `gibson-tenant-default-deny`, which — despite the name — selects every
  # Pod in the namespace and then ALLOWS egress to the whole platform
  # namespace on 8080/50100/50002 and to kube-system on 53 (gibson:
  # operators/tenant/internal/controller/tenant_namespace.go,
  # ensureNetworkPolicy). Policies union, so nothing the setec chart writes
  # can subtract that: untrusted code would get a route to the daemon and
  # to ext-authz. Sandbox placement is also not a tenancy boundary — per
  # setec is deliberately tenancy-unaware, and tenant isolation is
  # gibson's job, not the sandbox namespace's.
  #
  # The namespace itself is rendered by templates/setec/sandbox-namespace.yaml.
  sandboxNamespaces:
    - setec-sandboxes

  # rbac.allowClusterWideSandboxWrite stays false, stated rather than
  # inherited. True would bind the operator's Pod-write verbs with a
  # ClusterRoleBinding, letting it create a Pod in ANY namespace — the exact
  # grant the sandboxNamespaces split exists to remove, and a cluster-admin
  # path if the operator is compromised. gibson.validateSetecContainment
  # fails the render when sandboxNamespaces is empty and this is not
  # explicitly true.
  rbac:
    allowClusterWideSandboxWrite: false

  # multiTenancy stays off (the subchart default is false; stated here for
  # the record). It makes the operator reject a Sandbox whose NAMESPACE does
  # not carry a per-tenant label. The frontend scopes each Sandbox by the
  # pair of client and tenant in its own namespace, so the label check
  # would reject every Sandbox rather than confine anything.
  multiTenancy:
    enabled: false

  # namespace both feeds the subchart (where its Deployment/Service/SA
  # render) and lets THIS chart's templates (templates/setec/) target the
  # same namespace. Matches the subchart default.
  namespace: "setec-system"
  # The umbrella owns the namespace: nothing else creates setec-system in an
  # Argo-managed env (Argo's CreateNamespace only covers the destination
  # namespace, `gibson`), so the subchart's Namespace object must render.
  createNamespace: true

  # tier names the operating mode, read by the daemon as the metrics label
  # GIBSON_SETEC_TIER. Only "production" is supported; "demo" is rejected
  # at render time by gibson.validateSetecTier.
  tier: production

  # nodeSelector / tolerations MUST stay empty. They map onto the Setec
  # operator Deployment's own Pod spec, not onto Sandbox Pods, and pinning
  # the operator to the tainted sandbox-host taint would keep the
  # scale-to-zero metal NodePool permanently alive.
  # gibson.validateSetecTier fails the render if either is set non-empty.
  nodeSelector: {}

  tolerations: []

  # frontendService overrides the in-cluster service name the daemon uses
  # to dial Setec. Defaults match the upstream Setec chart's
  # _helpers.fullname output. Override only if the operator renames the
  # Setec release.
  frontendService:
    # name is the Service name (without namespace). When empty, the chart
    # derives it as `<release>-setec-frontend` per Setec's _helpers.tpl.
    name: ""
    # port is the gRPC mTLS service port. Matches Setec chart's
    # frontend.servicePort default.
    port: 50051

  # frontend is the gRPC SandboxService the daemon dials. It is on: the
  # daemon always dials a frontend (ADR-0142), and
  # gibson.validateSetecDispatch fails a render with it off. Its identity
  # is the SVID that templates/spire-server/clusterspiffeids.yaml registers
  # for it (spiffe://<trust domain>/platform/setec-frontend); the daemon
  # accepts no other server on this leg.
  frontend:
    enabled: true
    replicas: 1
    image:
      repository: ghcr.io/zeroroot-ai/setec-frontend
      tag: "v0.126.0@sha256:17fa719fe3ea696b3337c27d5d391b2ae685297f42614f2360b1cbfbe7b3fa21"
      pullPolicy: IfNotPresent
    # clients enrolls each Gibson cluster that may call the frontend
    # (setec#233). The frontend refuses a caller whose SVID carries no
    # listed SPIFFE ID. spiffePath, not a full ID: the setec chart builds
    # spiffe://<global.spire.trustDomain>/<path>, so the ID follows the trust
    # domain of the install (ADR-0164). It is the ID of the daemon SVID.
    clients:
      - name: gibson
        spiffePath: platform/daemon

# =============================================================================
# First admin (deploy#1631). A self-hosted install has no self-serve signup, so
# nothing creates the initial principal — without this the platform comes up
# and nobody can log in.
#
# No password is EVER generated or written to a Secret (ADR-0093 decision 8,
# hosted#202). The owner is created with no password, and Zitadel's own
# invite-code flow emails them a one-time setup link — the exact mechanism
# the Platform owner uses. On a profile with no mail transport,
# global.firstTenant.offlineSetup writes the link instead to the Secret named
# by global.firstTenant.setupSecretRef. Re-running the install never resends
# a link the owner has already used: an existing owner takes the find path
# and neither the tenant role grant nor the setup link is repeated.
#
# email/tenantId/tenantDisplayName/enabled below are superseded by
# global.firstTenant (the one identity both gibson-operators and
# gibson-workloads read — see gibson-workloads-first-admin.yaml); they stay
# only until every reader of this subchart in isolation is confirmed gone.
firstAdmin:
  # Off by default: SaaS uses self-serve signup and must not seed an owner.
  # values-baseline.yaml turns it on.
  enabled: false
  # The address the operator signs in with. REQUIRED when enabled.
  email: ""
  tenantId: "default"
  tenantDisplayName: "Default Workspace"
  # FQDN, not the short name: the first-admin Job's DNS query for a short name
  # depends on the pod's search-domain list and races CoreDNS under a cold,
  # loaded bring-up. A trailing-dot FQDN is a single deterministic lookup
  # (deploy#1631).
  daemonAddr: "gibson-gibson-workloads.gibson.svc.cluster.local:50051"
  # OpenFGA HTTP API is TLS on :8080; :8081 is gRPC and bootstrap speaks HTTP.
  fgaAddr: "https://gibson-openfga:8080"
  # The tenant-operator has to build a Zitadel org before the owner can be
  # created in it, and that chain runs behind fga-init, the master key and
  # the daemon. Measured 2026-09-02 (deploy#1766): the chain completes at
  # t+15-18m on the CI runner and t+21m on a loaded workstation, while this
  # hook starts at about t+3m. 900s died first on both. 1500s covers the
  # worst measurement with headroom and stays inside the install's 30m helm
  # timeout.
  activeDeadlineSeconds: 1500
  backoffLimit: 10

# bootstrap: the image of the first-admin Job (helm/gibson templates
# jobs/gibson-workloads-first-admin.yaml reads bootstrap.image). The secret
# store is OpenBao on every profile (ADR-0014); no Job of this chart mints
# secrets into a second backend.
bootstrap:

  image:
    # The bootstrap-secrets Job runs bash + jq + kubectl + aws-cli to
    # drive the gibson-bootstrap binary. We can't point at the
    # distroless `gibson-bootstrap` image directly — it has no shell.
    # The `gibson-bootstrap-runner` image (built from
    # core/gibson/tools/gibson-bootstrap/Dockerfile.runner) layers
    # those tools on top of the binary. Spec
    # kind-dashboard-bringup-e2e (D1).
    repository: ghcr.io/zeroroot-ai/gibson-bootstrap-runner
    # deploy#789: digest-pinned for staging/prod immutability.
    # The digest below is the current `latest`. kind keeps a moving :latest tag
    # (bootstrap.image.tag in values-kind.yaml), exempt from the guard.
    # Re-resolve: gh api /orgs/zeroroot-ai/packages/container/gibson-bootstrap-runner/versions
    # sha-c48813c is the v0.138.3 release commit. The package publishes
    # main/latest/sha-* only, so the release commit's sha- tag is the honest
    # provenance, same as the ext-authz pin. The digest MUST be at or past
    # gibson#224 (2026-09-24): before it, bootstrap-tenant-owner's admin
    # client dialed the public issuer host, hostAliases sent it to the Envoy
    # edge, the edge's auth chain rejected the owner creation with 403
    # ("admin client lacks permission: CreateHumanUser"), and the install
    # reached Ready with no first admin (staging, 2026-09-23). Since
    # gibson#224 it dials Zitadel by Service name and claims the host by
    # header (ADR-0092), and it needs ZITADEL_URL and ZITADEL_EXTERNAL_DOMAIN.
    tag: "sha-2f91a7b@sha256:90405ce6d9a3eb79dc3f46605d075f986079850cd1e9d5549055ac07ee3301f2"
    pullPolicy: IfNotPresent

  # activeDeadlineSeconds caps the Job runtime. 10 min covers a fresh
  # mint of every secret + Zitadel OIDC client (slowest step). Tune up
  # only if you've added a generator that is genuinely slow.
  activeDeadlineSeconds: 600

  # Zitadel org / project bootstrap. When set, the bootstrap script runs
  # `gibson-bootstrap zitadel-ensure-org` + `zitadel-ensure-project` BEFORE
  # any zitadel_mint_client generator and exports the resulting IDs as
  # ZITADEL_ORG_ID / ZITADEL_PROJECT_ID env. Both calls are idempotent.
  #
  # Setting `bootstrap.zitadel: null` keeps the legacy behaviour where the
  # operator must pre-populate the IDs via `bootstrap.env`.
  zitadel:
    orgName: gibson
    projectName: gibson

  # Optional extra env passed to the bootstrap container. Useful for
  # injecting ZITADEL_ISSUER / ZITADEL_ADMIN_PAT from existing Secrets
  # without changing the canonical script.
  env: []
  # - name: ZITADEL_ISSUER
  #   value: http://gibson-zitadel.gibson.svc.cluster.local:8080
  # - name: ZITADEL_ADMIN_PAT
  #   valueFrom:
  #     secretKeyRef:
  #       name: gibson-zitadel-admin-pat
  #       key: pat



  # The canonical secret list. Each entry: { key, generator }.
  #
  #   key       Name of the value in the backend (also the .data key in
  #             the materialised Kubernetes Secret).
  #   generator Shell command run if the backend has no value for key.
  #             Must print the secret to stdout, nothing else.
  #
  # Order matters only for Zitadel OIDC mint: org_id + project_id must be
  # populated by other means (or by a prior `gibson-bootstrap zitadel-
  # ensure-org` / `zitadel-ensure-project` step) before
  # zitadel-mint-oidc-client is invoked.
  secrets:
    # Daemon master encryption key. Random 32 bytes.
    - key: gibson_master_key
      generator: "rand32"
    # Per-Postgres-database user passwords.
    - key: platform_postgres_password
      generator: "rand32"
    - key: spire_postgres_password
      generator: "rand32"
    - key: thirdparty_postgres_password
      generator: "rand32"
    - key: redis_password
      generator: "rand32"
    - key: neo4j_password
      generator: "rand32"
    # NOTE: Zitadel OIDC client credentials (gibson_idp_*_oidc_client keys)
    # USED to be minted here via a `zitadel_mint_client` generator inside a
    # `gibson-bootstrap` tool. That tool was never built — the keys were
    # aspirational config. They are removed here (deploy#74; PRD #337
    # Wave 5 default = drop) because the canonical mechanism is the
    # platform-operator's OIDCClient CR reconciler, which renders and
    # maintains the live Secrets gibson-daemon, gibson-dashboard,
    # gibson-dashboard-service, gibson-tenant-operator, gibson-tool-runner
    # directly from the OIDCClient CRs shipped by templates/auth/. See
    # gitops#93 (no-conflicting-oidc-externalsecrets) for the precedent
    # that removed the matching conflicting ExternalSecrets from this
    # chart. The OIDCClient flow is verified live (five
    # OIDCClient CRs all Ready=True on the kind dev cluster 2026-05-18).

    # ---- Per-role postgres passwords (deploy-simplification-bringup W3) ----
    # One entry per role in the shared platform-postgres CNPG Cluster.
    # `platform_postgres_password` (above) is reused for the `gibson_platform`
    # role; `spire_postgres_password` (above) is reused for the `spire` role.
    # Both already-existing entries originally targeted the deleted spire-
    # and platform-postgresql subcharts; the names are kept for backwards
    # compat with prod overlays that already reference them.
    - key: tenant_admin_postgres_password
      generator: "rand32"
    - key: zitadel_postgres_password
      generator: "rand32"
    - key: openfga_postgres_password
      generator: "rand32"


# -----------------------------------------------------------------------------
# helm-test Pod images
# -----------------------------------------------------------------------------
# Pods under templates/tests/*.yaml carry `helm.sh/hook: test` and run on
# `helm test gibson-workloads`. Each pod runs a single post-install assertion
# (service reachability, bootstrap secrets, FGA tuple seed, SPIRE attestation,
# Envoy admin, Zitadel auth, data-plane reachability). Spec deploy#355
# (production-readiness epic 5.10).
#
# All test pods are short-lived and cleaned up automatically on success via
# helm.sh/hook-delete-policy=before-hook-creation,hook-succeeded. On failure
# the pod is left around so operators can `kubectl logs` it.
#
# Override the images in air-gapped overlays — every value supports the
# standard repository + tag dict shape.
tests:
  # Curl-bearing image for HTTP-probe pods. Default = curlimages/curl
  # (alpine + curl, ~6 MB). Override to an internal mirror.
  image:
    repository: "ghcr.io/zeroroot-ai/mirror/curl"
    tag: "8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b"
  # psql-bearing image for the data-plane test pod's Postgres probe.
  # Default = the same Bitnami Postgres mirror the platform-postgres
  # subchart uses, so a `kind load docker-image` already has it cached.
  psqlImage:
    repository: "ghcr.io/zeroroot-ai/mirror/bitnami-postgresql"
    tag: "16.4.0-debian-12-r0@sha256:be51b3aeaacc600f3eb2b596427be538b1bc17284111a1fe147030e8422c3184"
  # redis-cli-bearing image for the data-plane Redis probe.
  redisImage:
    repository: "ghcr.io/zeroroot-ai/mirror/redis"
    tag: "7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275"
  # kubectl-bearing image for Secret / ConfigMap inspection probes. The
  # alpine/k8s image ships curl + jq + openssl + kubectl in a single
  # image, so we reuse it for the FGA/Zitadel/Envoy/bootstrap-secret pods.
  # Unset repository/tag mean the shared tool image (`global.toolImage`,
  # helm/gibson/values.yaml); set both to override in an air-gapped overlay.
  kubectlImage: {}

  # Bootstrap-Secret / ConfigMap names that the helm-test pods assert
  # exist + are non-empty. Defaults match the gibson-operators chart's
  # platformBootstrap.* defaults; only override if an overlay renames
  # the materialized Secrets/ConfigMaps.
  bootstrap:
    masterKeySecret: "gibson-master-key"
    dashboardPatSecret: "gibson-zitadel-dashboard"
    dashboardPatKey: "pat"
    # If unset the chart derives `<release>-fga-model` from gibson.fullname.
    fgaModelConfigMap: ""
    fgaModelKey: "model.json"

  # Data-plane probe targets — match the gibson-operators chart's
  # platformBootstrap.postgresBundle.cluster.{host,port} defaults.
  postgres:
    host: "platform-postgres-rw.gibson.svc.cluster.local"
    port: 5432

  # Zitadel probe knobs.
  zitadel:
    issuer: "http://gibson-zitadel:8080"
    dashboardPatSecret: "gibson-zitadel-dashboard"
    dashboardPatKey: "pat"

