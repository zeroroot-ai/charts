# files/coraza/api.conf — the Edge WAF directives for the API chain (api.):
# the ConnectRPC / gRPC data plane. CONTEXT.md § Edge WAF,
# deploy#1660.
#
# Rendered by templates/_helpers.tpl gibson.envoy.wafDirectives into the JSON
# directives array the Coraza WASM filter takes. Same shape and the same
# ordering rules as browser.conf; read that file's header first.
#
# WHAT IS DIFFERENT HERE, AND WHY
#   - Request bodies are NOT inspected. Every api. body is protobuf (gRPC,
#     Connect) and the Core Rule Set on protobuf is noise, not signal. What a
#     WAF adds on this chain is the layer above the route table: scanner
#     fingerprints, hostile user agents, header injection, encoded traversal
#     in the URI — and one audit line that says "this client is scanning",
#     whether or not it holds a token, because this filter runs AHEAD of
#     jwt_authn.
#   - The content-type allowlist admits the gRPC and Connect types, or
#     rule 920420 rejects every legitimate call.
#   - The paranoia level is envoy.waf.apiParanoiaLevel.
#
# EXCLUSIONS: same contract as browser.conf — every exclusion directive is
# immediately preceded by
#   # exclusion: route=<path or prefix> fixture=<test name in tests/envoy-waf.bats>

# 1. engine baseline.
Include @recommended-conf
SecRuleEngine On
# No body inspection on this chain (see the header).
SecRequestBodyAccess Off
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
# Go RE2, so no lookahead: 5xx, and 4xx except 404.
SecAuditLogRelevantStatus "^(?:5[0-9][0-9]|40[0-35-9]|4[1-9][0-9])$"
SecAuditLogParts ABIJDEFHZ
SecAuditLog /dev/stdout
SecAuditLogFormat JSON

# 2. CRS setup — the rule set's own defaults.
Include @crs-setup-conf

# 3. Our overrides of the setup. id 900951 (900950 is the browser chain's,
#    900990 is crs-setup's). Values with spaces are single-quoted.
SecAction "id:900951,phase:1,pass,t:none,nolog,\
  setvar:tx.blocking_paranoia_level={{ .Values.envoy.waf.apiParanoiaLevel }},\
  setvar:tx.detection_paranoia_level={{ .Values.envoy.waf.apiParanoiaLevel }},\
  setvar:tx.inbound_anomaly_score_threshold={{ .Values.envoy.waf.inboundAnomalyThreshold }},\
  setvar:tx.outbound_anomaly_score_threshold={{ .Values.envoy.waf.outboundAnomalyThreshold }},\
  setvar:tx.early_blocking=1,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE',\
  setvar:'tx.allowed_request_content_type=|application/grpc| |application/grpc+proto| |application/grpc-web| |application/grpc-web+proto| |application/connect+proto| |application/connect+json| |application/proto| |application/json| |application/x-www-form-urlencoded| |multipart/form-data|',\
  setvar:'tx.allowed_request_content_type_charset=|utf-8|iso-8859-1|iso-8859-15|windows-1252|'"

# 4. The OWASP Core Rule Set.
Include @owasp_crs/*.conf

# 5. Exclusions. None yet. The first one arrives with its route and fixture.
