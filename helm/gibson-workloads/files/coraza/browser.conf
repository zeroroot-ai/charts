# files/coraza/browser.conf — the Edge WAF directives for the BROWSER chain
# (app / apex / docs): the pre-auth forms this WAF exists for — signup, OIDC
# login, password reset. CONTEXT.md § Edge WAF, deploy#1658.
#
# Rendered by templates/_helpers.tpl gibson.envoy.wafDirectives into the JSON
# directives array the Coraza WASM filter takes. Comment and blank lines are
# dropped; a trailing backslash continues a directive onto the next line.
# Numbers come from envoy.waf in values.yaml so they live in ONE place.
#
# ORDER MATTERS, as in every CRS deployment:
#   1. the engine's recommended baseline,
#   2. the CRS setup (defaults for paranoia, thresholds, allowed content),
#   3. OUR overrides of that setup (SecAction 900xxx, before the rules load),
#   3b. OUR runtime exclusions (ctl), before the rules so they run first,
#   4. the rules,
#   5. OUR exclusions that name rule ids (after the rules).
#
# EXCLUSIONS: every exclusion directive (SecRuleRemoveById, SecRuleRemoveByTag,
# SecRuleUpdateTargetById, ctl:ruleRemove*, ctl:requestBodyAccess) MUST be
# immediately preceded by a comment line of the form
#   # exclusion: route=<path or prefix> fixture=<case in hosted test/edge/exit-test-waf.sh>
# naming the route it serves and the fixture that showed the false positive.
# The fixture runs the rendered edge (this Envoy, this WASM module, these
# directives) under Docker: `make signoff` in zeroroot-ai/hosted. It carries
# the pass case AND a control that the same payload still blocks elsewhere,
# so an exclusion that reaches past its route fails its own fixture. route=/
# is reserved for input that rides on every route (a cookie), and such an
# exclusion names the exact cookie, never REQUEST_COOKIES as a whole.

# 1. engine baseline: request/response body access and limits, audit engine.
Include @recommended-conf
# Engine ON. Not DetectionOnly, and no value can make it so.
SecRuleEngine On
# Request bodies are inspected on this chain (the forms), up to the CRS
# recommended sizes; the daemon's real upload surfaces are on api., not here.
SecRequestBodyAccess On
# Response bodies are NOT inspected: the dashboard's HTML is ours, and
# inspecting it costs a copy of every page for no signal.
SecResponseBodyAccess Off
# Audit log to stdout (Envoy's log) for blocked and error transactions only.
SecAuditEngine RelevantOnly
# Go RE2, so no lookahead: 5xx, and 4xx except 404.
SecAuditLogRelevantStatus "^(?:5[0-9][0-9]|40[0-35-9]|4[1-9][0-9])$"
SecAuditLogParts ABIJDEFHZ
SecAuditLog /dev/stdout
SecAuditLogFormat JSON

# 2. CRS setup — the rule set's own defaults.
Include @crs-setup-conf

# 3. Our overrides of the setup. One SecAction in the CRS setup id range,
#    evaluated before the rules so the variables are in place when they load.
#    900990 is taken by crs-setup (crs_setup_version); 900950 is ours.
#    Values with spaces are single-quoted, as CRS's own setup does.
#    The content-type allowlist is the browser host's real surface: the forms,
#    JSON, AND gRPC-web, because the edge routes /zitadel.* and /ui/console on
#    app. to Zitadel, whose Console and login UI call the API as gRPC-web
#    (application/grpc-web+proto). Without those types rule 920420 denied
#    every Console call (measured 2026-09-29 on staging, hosted#209). The
#    fixture is grpc_web_on_app in hosted test/edge/exit-test-waf.sh.
SecAction "id:900950,phase:1,pass,t:none,nolog,\
  setvar:tx.blocking_paranoia_level={{ .Values.envoy.waf.browserParanoiaLevel }},\
  setvar:tx.detection_paranoia_level={{ .Values.envoy.waf.browserParanoiaLevel }},\
  setvar:tx.inbound_anomaly_score_threshold={{ .Values.envoy.waf.inboundAnomalyThreshold }},\
  setvar:tx.outbound_anomaly_score_threshold={{ .Values.envoy.waf.outboundAnomalyThreshold }},\
  setvar:tx.early_blocking=1,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE',\
  setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |text/plain| |application/grpc-web| |application/grpc-web+proto| |application/grpc-web-text| |application/grpc-web-text+proto|',\
  setvar:'tx.allowed_request_content_type_charset=|utf-8|iso-8859-1|iso-8859-15|windows-1252|'"

# 3b. Our RUNTIME exclusions, before the rules load. The WASM module evaluates
#     a rule as soon as its inputs exist (Coraza's multiphase evaluation), so a
#     rule over REQUEST_COOKIES runs in phase 1, in load order, and with
#     early_blocking the phase-1 score denies before a later rule can run. A
#     ctl exclusion therefore sits HERE, ahead of the rule set, as CRS's own
#     REQUEST-900-EXCLUSION-RULES-BEFORE-CRS does; only directives that name
#     rule ids (SecRuleRemoveById, SecRuleUpdateTargetById) belong after it.
#     Measured 2026-09-29: the same ctl placed after the include changed
#     nothing on the rendered edge while a single-phase harness passed it.
# Opaque first-party tokens ride on EVERY request as cookies: the dashboard's
# Auth.js session (a JWE, chunked as .0/.1/... past 4 KiB; the name carries the
# __Secure- prefix on https and none on plain http), Zitadel's user-agent cookie
# and the login app's session list. They are base64 text minted by our own
# services and decrypted by them; nothing behind the edge parses them as text.
# The Core Rule Set's keyword matchers read random substrings of that base64
# as attacks: measured 2026-09-29 on staging, rule 933150 (PHP function names)
# found "MkDir" and "RTRiM" inside __Secure-authjs.session-token and denied
# every page for the browser that held it (949110), so the tenant Owner and an
# invited user saw HTTP 403 on app. until the cookie changed. Drop ONLY these
# cookies from every CRS rule's targets, by exact name: Coraza 3.3.3 matches a
# removed target by exact key, and its static SecRuleUpdateTargetByTag edits
# a copy of each rule and changes nothing, so this is a runtime ctl. Every
# other cookie stays inspected, and the same words in a query argument or a
# form field still block (the CONTROL cases of the same fixture).
# exclusion: route=/ (the cookie rides on every route) fixture=opaque_session_cookie
SecRule REQUEST_URI "@unconditionalMatch" "id:900961,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token.0,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token.1,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token.2,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token.3,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token.0,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token.1,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token.2,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token.3"
# exclusion: route=/ (the cookie rides on every route) fixture=opaque_session_cookie
SecRule REQUEST_URI "@unconditionalMatch" "id:900962,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Host-zitadel.useragent,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:sessions"

# The gRPC-web routes on app. (/zitadel.* to Zitadel's API, called by its
# Console and login UI) carry protobuf bodies. The Core Rule Set has no body
# processor for protobuf, and its text rules over a binary body are noise, not
# signal: the same api. rationale (api.conf, body access OFF there). Turn body
# inspection off for THESE routes only; headers, URI, method, content type and
# every other route keep full inspection. Phase 1, so it lands before the body
# is read.
# exclusion: route=/zitadel. fixture=grpc_web_on_app
SecRule REQUEST_URI "@rx ^/zitadel\." "id:900963,phase:1,pass,nolog,t:none,ctl:requestBodyAccess=Off"

# 4. The OWASP Core Rule Set.
Include @owasp_crs/*.conf

# 5. Exclusions.
# Zitadel's hosted login submits every pre-auth form — loginname, password,
# signup, password reset, passkey — as a React/Next.js Server Action: a POST
# whose body is React's own serialization, i.e. JSON arrays carrying $-prefixed
# tokens ($ACTION_ID, $undefined, $K1, ...). CRS reads those $-tokens as NoSQL/
# SQL operators ($type/$where — 942290 et al, attack-sqli), the JSON/array
# punctuation as XSS (941xxx) and as generic/RCE injection — all false positives
# on our own first-party auth UI, and they deny the login submit (949110/949111).
# BOTH login surfaces are covered: the v2 app (/ui/v2/login/, used by the
# dashboard) AND the v1 hosted login (/ui/login/, used by the CLI device flow).
# Drop the injection families for THESE routes only. Protocol enforcement, method
# and size limits, the anomaly engine, and every other route keep full CRS; the
# api. chain is untouched. Phase 1 so it lands before the phase-2 rules evaluate.
# One SecRule on a single line, so the exclusion guard sees one directive with
# its tag immediately above (a line-continued rule would read as several).
# exclusion: route=/ui/(v2/)?login/ fixture=login_react_server_action
SecRule REQUEST_URI "@rx ^/ui/(v2/)?login/" "id:900960,phase:1,pass,nolog,t:none,ctl:ruleRemoveByTag=attack-sqli,ctl:ruleRemoveByTag=attack-xss,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-injection-generic,ctl:ruleRemoveByTag=attack-injection-php,ctl:ruleRemoveByTag=attack-java"
