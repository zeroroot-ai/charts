# files/coraza/browser.conf — the Edge WAF directives for the BROWSER chain
# (app / apex / docs): the pre-auth forms this WAF exists for — signup, OIDC
# login, password reset. CONTEXT.md § Edge WAF, deploy#1658.
#
# Rendered by templates/_helpers.tpl gibson.envoy.wafDirectives into the JSON
# directives array the Coraza WASM filter takes. Comment and blank lines are
# dropped; a trailing backslash continues a directive onto the next line.
# Numbers come from envoy.waf in values.yaml so they live in ONE place.
#
# ORDER MATTERS, as in every CRS deployment:
#   1. the engine's recommended baseline,
#   2. the CRS setup (defaults for paranoia, thresholds, allowed content),
#   3. OUR overrides of that setup (SecAction 900xxx, before the rules load),
#   4. the rules,
#   5. OUR exclusions (after the rules, so they can refer to rule ids).
#
# EXCLUSIONS: every exclusion directive (SecRuleRemoveById, SecRuleRemoveByTag,
# SecRuleUpdateTargetById, ctl:ruleRemove*) MUST be immediately preceded by a
# comment line of the form
#   # exclusion: route=<path or prefix> fixture=<test name in tests/envoy-waf.bats>
# naming the route it serves and the fixture that showed the false positive.
# tests/envoy-waf.bats fails the render otherwise. No wildcard exclusions.

# 1. engine baseline: request/response body access and limits, audit engine.
Include @recommended-conf
# Engine ON. Not DetectionOnly, and no value can make it so.
SecRuleEngine On
# Request bodies are inspected on this chain (the forms), up to the CRS
# recommended sizes; the daemon's real upload surfaces are on api., not here.
SecRequestBodyAccess On
# Response bodies are NOT inspected: the dashboard's HTML is ours, and
# inspecting it costs a copy of every page for no signal.
SecResponseBodyAccess Off
# Audit log to stdout (Envoy's log) for blocked and error transactions only.
SecAuditEngine RelevantOnly
# Go RE2, so no lookahead: 5xx, and 4xx except 404.
SecAuditLogRelevantStatus "^(?:5[0-9][0-9]|40[0-35-9]|4[1-9][0-9])$"
SecAuditLogParts ABIJDEFHZ
SecAuditLog /dev/stdout
SecAuditLogFormat JSON

# 2. CRS setup — the rule set's own defaults.
Include @crs-setup-conf

# 3. Our overrides of the setup. One SecAction in the CRS setup id range,
#    evaluated before the rules so the variables are in place when they load.
#    900990 is taken by crs-setup (crs_setup_version); 900950 is ours.
#    Values with spaces are single-quoted, as CRS's own setup does.
SecAction "id:900950,phase:1,pass,t:none,nolog,\
  setvar:tx.blocking_paranoia_level={{ .Values.envoy.waf.browserParanoiaLevel }},\
  setvar:tx.detection_paranoia_level={{ .Values.envoy.waf.browserParanoiaLevel }},\
  setvar:tx.inbound_anomaly_score_threshold={{ .Values.envoy.waf.inboundAnomalyThreshold }},\
  setvar:tx.outbound_anomaly_score_threshold={{ .Values.envoy.waf.outboundAnomalyThreshold }},\
  setvar:tx.early_blocking=1,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE',\
  setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |text/plain|',\
  setvar:'tx.allowed_request_content_type_charset=|utf-8|iso-8859-1|iso-8859-15|windows-1252|'"

# 4. The OWASP Core Rule Set.
Include @owasp_crs/*.conf

# 5. Exclusions.
# Zitadel's hosted login submits every pre-auth form — loginname, password,
# signup, password reset, passkey — as a React/Next.js Server Action: a POST
# whose body is React's own serialization, i.e. JSON arrays carrying $-prefixed
# tokens ($ACTION_ID, $undefined, $K1, ...). CRS reads those $-tokens as NoSQL/
# SQL operators ($type/$where — 942290 et al, attack-sqli), the JSON/array
# punctuation as XSS (941xxx) and as generic/RCE injection — all false positives
# on our own first-party auth UI, and they deny the login submit (949110/949111).
# BOTH login surfaces are covered: the v2 app (/ui/v2/login/, used by the
# dashboard) AND the v1 hosted login (/ui/login/, used by the CLI device flow).
# Drop the injection families for THESE routes only. Protocol enforcement, method
# and size limits, the anomaly engine, and every other route keep full CRS; the
# api. chain is untouched. Phase 1 so it lands before the phase-2 rules evaluate.
# One SecRule on a single line, so the exclusion guard sees one directive with
# its tag immediately above (a line-continued rule would read as several).
# exclusion: route=/ui/(v2/)?login/ fixture=login_react_server_action
SecRule REQUEST_URI "@rx ^/ui/(v2/)?login/" "id:900960,phase:1,pass,nolog,t:none,ctl:ruleRemoveByTag=attack-sqli,ctl:ruleRemoveByTag=attack-xss,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-injection-generic,ctl:ruleRemoveByTag=attack-injection-php,ctl:ruleRemoveByTag=attack-java"
