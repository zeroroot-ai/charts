{{/*
  NetworkPolicy for the exit-test runner (TEST PROFILES ONLY).

  The namespace is default-deny in both directions
  (namespace-isolation/default-deny.yaml), so a Pod with no policy of its own
  sends nothing and receives nothing. The runner Job the exit-test workflows
  create wears app.kubernetes.io/component=e2e-runner and had no policy: its
  DNS lookups and its dials to the daemon and Redis timed out before any
  assertion ran (gibson exit-test-bank run 34150939428: dial tcp <daemon>:50051
  i/o timeout; exit-test-tool-dispatch run 34150939414: lookup
  gibson-redis-stack...: i/o timeout). The daemon's own policy already admits
  the runner's ingress; this is the egress half, and Redis admits the runner in
  databases/redis-networkpolicy.yaml under the same flag.

  Gated on gibson.e2eRunner.enabled, like the ServiceAccount and the
  ClusterSPIFFEID: no shipped profile sets it.
*/}}
{{- if (.Values.gibson.e2eRunner).enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-e2e-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: e2e-runner
  policyTypes:
    - Ingress
    - Egress
  # No ingress: nothing dials the runner.
  egress:
    {{- include "gibson.netpolEgressDNS" . | nindent 4 }}
    # runner → daemon gRPC (mTLS, the runner's SVID is allow-listed there)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: daemon
      ports:
        - protocol: TCP
          port: {{ .Values.gibson.service.grpc.port | default 50051 }}
    # runner → Redis (the fixture helpers register synthetic targets there)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port | default 6379 }}
{{- end }}
