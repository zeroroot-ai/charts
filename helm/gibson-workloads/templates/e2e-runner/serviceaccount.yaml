{{/*
  ServiceAccount for the exit-test runner (TEST PROFILES ONLY).

  The runner is a Job the exit-test workflows create; SPIRE attests it through
  the ClusterSPIFFEID in templates/spire-server/clusterspiffeids.yaml, which
  pins this ServiceAccount by name. Without a stable SA there is no stable
  workload selector, and the identity would be mintable by anything wearing
  the pod label.

  Gated on gibson.e2eRunner.enabled — no shipped profile sets it.
*/}}
{{- if (.Values.gibson.e2eRunner).enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-e2e-runner" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: e2e-runner
{{- end }}
