{{/*
The ONE ClusterSecretStore (deploy#1733).

The platform's own OpenBao is the only External Secrets backend, on every
substrate: kind, vanilla, staging, prod, saas, eks, gke and aks. This template
renders exactly one store, on every profile, with no provider branch and no
`create` toggle. deploy#1732 deleted the last thing that created a store
outside the chart, so a profile that does not render it has no secret delivery
at all.

AUTH: ESO presents its OWN ServiceAccount token to OpenBao's kubernetes auth
mount and receives a short-lived, policy-scoped token. Nothing is stored. The
openbao-auto-init sidecar writes the matching role from the same values, so
the store and the role cannot drift:

  mount   the kubernetes auth method, mount path `kubernetes`
  role    eso-reader          (policy eso-reader: read secret/data/*)
  subject ServiceAccount `external-secrets` in the release namespace, where
          the external-secrets subchart renders it (deploy#1728)

NOT the `jwt` mount. That one is configured against SPIRE's JWKS and validates
SPIFFE JWT-SVIDs, which a plain ServiceAccount token is not.

KV: one kv v2 mount named `secret`, one path per key at `secret/data/<key>`,
no prefix. The seed table helm/gibson-workloads/files/openbao-seed-keys.txt is
the one definition of what lives there.

The cross-namespace mirror stores (gibson-cross-ns-zitadel,
gibson-cross-ns-setec) are not backends: they copy a Secret another controller
already wrote in this cluster. helm/gibson/tests/one-secret-store.bats holds
that line by content.
*/}}
{{- include "gibson.assertSecretKnobsDeleted" . }}
{{- $eso := .Values.externalSecrets }}
{{- $css := $eso.clusterSecretStore | default dict }}
{{- $sa := $css.serviceAccount | default dict }}
{{- $openbao := $css.openbao | default dict }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $css.name | default "gibson-secrets" | quote }}
  {{- if ($eso.preSyncBringup) }}
  # Deterministic cold-bringup ordering (deploy#820): when a single umbrella
  # Application installs everything in one sync, the store + ExternalSecrets
  # must materialize BEFORE the init Jobs (zitadel-init et al.) that mount the
  # resulting secrets. The store is STANDING infrastructure consumed by every
  # ExternalSecret refresh — it must NOT be an Argo hook: hook lifecycle
  # (BeforeHookCreation deletes, operation-retry cleanup) deleted it mid-sync
  # on staging (2026-06-11), wedging every ExternalSecret in SecretSyncedError.
  # A regular resource at the earliest sync-wave (-10) is durable and still
  # precedes the ExternalSecrets (-8) and the zitadel init chain (-6/-4/-3).
  # Kind (separate wave-ordered Applications) leaves this off.
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  {{- end }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    vault:
      server: {{ printf "http://%s-openbao.%s.svc.cluster.local:8200" .Release.Name .Release.Namespace | quote }}
      path: {{ $openbao.kvMount | default "secret" | quote }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: {{ $openbao.authMount | default "kubernetes" | quote }}
          role: {{ $openbao.esoRole | default "eso-reader" | quote }}
          serviceAccountRef:
            name: {{ $sa.name | default "external-secrets" | quote }}
            namespace: {{ $sa.namespace | default .Release.Namespace | quote }}
