{{- /*
iam-admin-pat, iam-admin, login-client — the three Secrets the Zitadel
setup Job mints on the first instance, materialised from the platform's
OpenBao whenever the store holds them. One template, three ExternalSecrets.

WHY. The Zitadel subchart's setup Job mints this PAT ONCE, on the first
instance (FirstInstance.Org.Machine.Pat), and writes it straight into the
Kubernetes Secret `iam-admin-pat`. Nothing escrowed it. Every platform
secret is excluded from the Velero backup by design (the secret store IS
OpenBao, and its volume is what a preserve backup carries), so after
`make recreate RESTORE_FROM=<name>` the Secret was gone and Zitadel's
setup Job, seeing its instance already in the restored database, did not
mint a new one. Measured 2026-09-07 on the blocker 3 loop: every
OIDCClient read "Admin token Secret not yet materialised",
PlatformBootstrap sat at ZitadelProjectReady=False WaitingForAdminToken,
the tenant-operator could not start (no gibson-zitadel-tenant-operator),
and the restored tenants' Neo4j pods waited on auth Secrets nobody could
mint. The whole platform, held by one Secret the restore had no way to
bring back.

WHAT. The hook Job gibson-workloads-iam-admin-pat-escrow (umbrella,
templates/jobs/) copies each minted Secret into OpenBao:
  iam-admin-pat/pat            -> secret/gibson-zitadel-iam-admin-pat      .pat
  iam-admin/iam-admin.json     -> secret/gibson-zitadel-iam-admin-machinekey .machinekey
  login-client/pat             -> secret/gibson-zitadel-login-client-pat   .pat
These ExternalSecrets read them back. The first fix (2026-09-07) escrowed
the PAT alone; blocker 3 loop #14 (2026-09-08) then stalled on the other
two: PlatformBootstrap SAIdentityMapReady=False "Secret gibson/iam-admin
not yet written by the Zitadel setup Job", and zitadel-login on "secret
login-client not found". On a fresh bootstrap the setup Job writes the Secret first
and this ExternalSecret stays NotReady for the minutes until the escrow
lands, then syncs the same bytes over it. On a restore the OpenBao volume
comes back holding the key, so this ExternalSecret creates the Secret and
every consumer proceeds; the setup Job, seeing its instance, mints nothing.

creationPolicy Orphan, not Owner: on a fresh bootstrap the Secret already
exists, created by the setup Job, and an Owner policy refuses a Secret it
does not own. Orphan writes it and claims nothing.

sync-wave -1: AFTER the escrow hook (wave -2) and BEFORE wave 0. Argo
waits for a wave's resources to be Healthy before it starts the next, and
an ExternalSecret whose remote key does not exist is Degraded ("could not
get secret data from provider"). Two wrong answers were measured:
  - At -8, with the escrow at 0, a fresh bootstrap failed its sync five
    times in four minutes (2026-09-08, blocker 3 loop #6): the key did not
    exist yet and Argo never reached the escrow that would have created it.
  - At 1, with the escrow at 0, a RESTORE deadlocked (hosted run
    34249427078, blocker 3 loop #13): the platform-operator is a wave-0
    workload that waits for this PAT to mint gibson-master-key, so the
    daemon and gibson-workloads-0 could not mount their key volumes, wave 0
    was never Healthy, and Argo never applied this resource.
At -1 the key exists on both paths before this resource is applied: the
escrow at -2 wrote it (fresh), or the restored store holds it (restore).
The guard asserts the order: setup Job < escrow Job < this < 0.

Guard: scripts/check-iam-admin-pat-escrow.sh.
*/ -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
{{- range $e := list
      (dict "secret" "iam-admin-pat" "dataKey" "pat"            "storeKey" "gibson-zitadel-iam-admin-pat"        "property" "pat")
      (dict "secret" "iam-admin"     "dataKey" "iam-admin.json" "storeKey" "gibson-zitadel-iam-admin-machinekey" "property" "machinekey")
      (dict "secret" "login-client"  "dataKey" "pat"            "storeKey" "gibson-zitadel-login-client-pat"     "property" "pat") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $e.secret }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # After the escrow hook (-2), before wave 0; see the header.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "gibson.labels" $ | nindent 4 }}
    app.kubernetes.io/component: zitadel
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ $e.secret }}
    creationPolicy: Orphan
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/component: zitadel
      data:
        {{ $e.dataKey }}: '{{ printf "{{ .%s }}" $e.property }}'
  data:
    - secretKey: {{ $e.property }}
      remoteRef: { key: {{ $e.storeKey }}, property: {{ $e.property }} }
{{- end }}
