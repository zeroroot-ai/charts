{{- /*
iam-admin-pat and login-client: the two Zitadel token Secrets. Each has one
writer, its ExternalSecret, with creationPolicy Owner (charts#407, ADR-0014).
OpenBao holds each token, and no Kubernetes Secret is a source.

  iam-admin-pat  secret/gibson-zitadel-iam-admin-pat     .pat .userId
                 The platform-operator creates the machine user iam-admin,
                 mints its PAT with its System API key and writes both
                 (reconcileAdminToken, gibson#794). userId is the numeric
                 Zitadel subject of the SA identity map, so iam-admin needs
                 no machine key (ADR-0171, gibson#1047).
  login-client   secret/gibson-zitadel-login-client-pat  .pat
                 The Zitadel setup Job mints the first PAT and its container
                 login-client-pat-store writes it straight to OpenBao (values
                 zitadel.setupJob.extraContainers). The platform-operator
                 rotates it in the same entry (ADR-0171).

WHY OPENBAO. Every platform Secret is excluded from the Velero backup by
design. The OpenBao volume is what a preserve backup carries. After `make
recreate RESTORE_FROM=<name>` no Secret exists, and the Zitadel setup Job
sees its instance in the restored database and mints nothing. A token that
lived only in a Kubernetes Secret was lost (2026-09-07, blocker 3 loop: the
whole platform waited on iam-admin-pat). With the token in OpenBao, these
ExternalSecrets write each Secret again from the restored store.

WAVES. Argo waits for a wave to be Healthy before it starts the next, and an
ExternalSecret whose remote key does not exist is Degraded.
  login-client -1: after the setup Job (-3) wrote the key on a fresh
    install, or the restored store holds it. Before wave 0, so that
    zitadel-login and the platform-operator at wave 0 find the Secret.
  iam-admin-pat 0: with the platform-operator that writes the key. At -1
    the key does not exist on a fresh install, and Argo never reaches the
    operator. The operator needs this Secret for its next step
    (reconcileZitadelProject), so a later wave deadlocks the master key.

Guard: scripts/check-zitadel-token-writers.py.
*/ -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
{{- range $e := list
      (dict "secret" "iam-admin-pat" "dataKey" "pat"            "storeKey" "gibson-zitadel-iam-admin-pat"        "property" "pat"        "userId" true "wave" "0")
      (dict "secret" "login-client"  "dataKey" "pat"            "storeKey" "gibson-zitadel-login-client-pat"     "property" "pat"        "wave" "-1") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $e.secret }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    {{- /* The wave of each: see WAVES in the header. */}}
    argocd.argoproj.io/sync-wave: {{ $e.wave | quote }}
  labels:
    {{- include "gibson.labels" $ | nindent 4 }}
    app.kubernetes.io/component: zitadel
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ $e.secret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/component: zitadel
      data:
        {{ $e.dataKey }}: '{{ printf "{{ .%s }}" $e.property }}'
        {{- if $e.userId }}
        {{- /* The user id of the iam-admin machine user, which the
               platform-operator writes next to the token. It is the numeric
               Zitadel subject of the SA identity map, so the user needs no
               machine key (ADR-0171). */}}
        userId: '{{ "{{ .userId }}" }}'
        {{- end }}
  data:
    - secretKey: {{ $e.property }}
      remoteRef: { key: {{ $e.storeKey }}, property: {{ $e.property }} }
    {{- if $e.userId }}
    - secretKey: userId
      remoteRef: { key: {{ $e.storeKey }}, property: userId }
    {{- end }}
{{- end }}
