{{- /*
ExternalSecrets that materialise the runtime Secrets the gibson daemon,
ext-authz, and dashboard reference but no template was producing — they
were lost during the umbrella-chart decomposition. Each pulls from OpenBao
through the one `gibson-secrets` ClusterSecretStore.

ESO is required infrastructure (one-code-path #203) — the chart-wide
ESO on/off gate was deleted, this template renders unconditionally.

Spec: deploy-architecture-refactor follow-up; restores parity with the
old gibson umbrella chart's templates/secrets/*.yaml fan-out.
*/}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
---
# gibson-workloads-redis-stack — Redis auth password. Consumer wiring is
# routed through gibson.redisPasswordSecretName / gibson.redisPasswordSecretKey
# helpers; daemon + dashboard + redis-backup CronJob + the redis-stack
# StatefulSet itself all read from this Secret.
#
# Previously rendered in-chart by templates/databases/redis-stack.yaml via
# the lookup-then-randAlphaNum idiom. That pattern is broken under Argo's
# repo-server (offline `helm template`, lookup always returns nil), so
# every reconcile re-minted the random and ServerSideApply rewrote the
# Secret while running Redis kept its env-frozen-at-boot value — WRONGPASS
# loop and sign-in outage. PRD deploy#255 / deploy. The in-chart
# Secret render was deleted; this ExternalSecret is the sole source.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.redisPasswordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.redisPasswordSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        {{ include "gibson.redisPasswordSecretKey" . }}: "{{ `{{ .redis_password }}` }}"
  data:
    - secretKey: redis_password
      remoteRef: { key: gibson-redis-password, property: password }
# NOTE: `gibson-zitadel-dashboard` and `gibson-zitadel-signup-bot-pat`
# ExternalSecrets are defined in their dedicated templates
# (`dashboard/zitadel-serverside-externalsecret.yaml` and
# `dashboard/signup-bot-pat-externalsecret.yaml` respectively). Duplicate
# definitions previously lived here and tripped Argo's "Resource appeared
# 2 times" validation on multi-source Apps.
---
# gibson-platform-postgres-credentials — the login role of gibson_platform that
# the daemon, the dashboard and the tenant-operator read (keys username and
# password). The OpenBao database engine issues it (ADR-0171, row
# postgres-role-passwords; the generator postgres-login-gibson-platform in
# postgres-logins.yaml). ESO asks for a new login role every 24 hours.
# SOLE producer across both render paths (deploy#960).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # No early sync-wave. The login comes from the OpenBao database engine,
  # which the openbao-auto-init sidecar writes only after the Postgres
  # superuser exists, and the platform operator at wave 0 makes the Postgres
  # cluster. An ExternalSecret at wave -8 gates the operator and waits for a
  # cluster that the operator makes: a from-zero install never ends.
  # scripts/check-postgres-logins-wave.py fails on a wave below 0.
  name: {{ include "gibson.platformPostgres.passwordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
spec:
  refreshInterval: 24h
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: VaultDynamicSecret
        name: postgres-login-gibson-platform
  target:
    name: {{ include "gibson.platformPostgres.passwordSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        {{ include "gibson.platformPostgres.usernameSecretKey" . }}: "{{ `{{ .username }}` }}"
        {{ include "gibson.platformPostgres.passwordSecretKey" . }}: "{{ `{{ .password }}` }}"
# NOTE: gibson-zitadel-system-key is intentionally NOT produced here. It has a
# single canonical producer — the gitops `standalone-externalsecrets` app
# (apps/overlays/{base,kind,prod} zitadel-system-key) — which maps BOTH
# private-key.pem and public-key.pem. A duplicate fallback used to live here
# (epic-447 #730) but it raced the gitops producer and won with an incomplete
# (private-only) definition, wedging zitadel-init on a missing public-key.pem
# (deploy#769/#770). One producer, no race.
