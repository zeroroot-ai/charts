{{- /*
ExternalSecrets that materialise the runtime Secrets the gibson daemon,
ext-authz, and dashboard reference but no template was producing — they
were lost during the umbrella-chart decomposition. Each pulls from OpenBao
through the one `gibson-secrets` ClusterSecretStore.

ESO is required infrastructure (one-code-path #203) — the chart-wide
ESO on/off gate was deleted, this template renders unconditionally.

Spec: deploy-architecture-refactor follow-up; restores parity with the
old gibson umbrella chart's templates/secrets/*.yaml fan-out.
*/}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
---
# ext-authz API keys DB DSN. ExtAuthz reads dashboard's api_keys table to
# resolve gibson API keys → tenant context. Same Postgres cluster as
# dashboard's Auth.js DB.
#
# Host + sslmode track the platform Postgres tier via the helpers so the DSN
# follows the overlay's external toggle: kind → CNPG Service / sslmode=disable;
# EKS → Aurora (RDS) writer endpoint / sslmode=require (deploy#572). The DSN
# always targets the `dashboard` database, where the api_keys table lives.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gibson-db-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: gibson-db-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        EXT_AUTHZ_API_KEYS_DB_DSN: {{ printf "postgres://dashboard:{{ .dashboard_password }}@%s:%s/dashboard?sslmode=%s" (include "gibson.platformPostgres.host" .) (include "gibson.platformPostgres.port" .) (include "gibson.platformPostgres.sslMode" .) | quote }}
  data:
    - secretKey: dashboard_password
      remoteRef:
        key: gibson-dashboard-postgres-password
        property: password
---
# gibson-workloads-db-secrets — referenced by gibson daemon for tenant
# admin DB password, dashboard DB password, neo4j admin password, and the
# SPIRE datastore password (Aurora/RDS spire role; deploy#572).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.fullname" . }}-db-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.fullname" . }}-db-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DASHBOARD_DB_PASSWORD: "{{ `{{ .dashboard_password }}` }}"
        NEO4J_PASSWORD: "{{ `{{ .neo4j_password }}` }}"
        TENANT_POSTGRES_ADMIN_PASSWORD: "{{ `{{ .tenant_admin_password }}` }}"
        SPIRE_DB_PASSWORD: "{{ `{{ .spire_password }}` }}"
  data:
    - secretKey: dashboard_password
      remoteRef: { key: gibson-dashboard-postgres-password, property: password }
    - secretKey: neo4j_password
      remoteRef: { key: gibson-neo4j-password, property: password }
    - secretKey: tenant_admin_password
      remoteRef: { key: gibson-tenant-admin-postgres-password, property: password }
    - secretKey: spire_password
      remoteRef: { key: gibson-spire-postgres-password, property: password }
---
# gibson-workloads-redis-stack — Redis auth password. Consumer wiring is
# routed through gibson.redisPasswordSecretName / gibson.redisPasswordSecretKey
# helpers; daemon + dashboard + redis-backup CronJob + the redis-stack
# StatefulSet itself all read from this Secret.
#
# Previously rendered in-chart by templates/databases/redis-stack.yaml via
# the lookup-then-randAlphaNum idiom. That pattern is broken under Argo's
# repo-server (offline `helm template`, lookup always returns nil), so
# every reconcile re-minted the random and ServerSideApply rewrote the
# Secret while running Redis kept its env-frozen-at-boot value — WRONGPASS
# loop and sign-in outage. PRD deploy#255 / deploy. The in-chart
# Secret render was deleted; this ExternalSecret is the sole source.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.redisPasswordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.redisPasswordSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        {{ include "gibson.redisPasswordSecretKey" . }}: "{{ `{{ .redis_password }}` }}"
  data:
    - secretKey: redis_password
      remoteRef: { key: gibson-redis-password, property: password }
# NOTE: `gibson-zitadel-dashboard` and `gibson-zitadel-signup-bot-pat`
# ExternalSecrets are defined in their dedicated templates
# (`dashboard/zitadel-serverside-externalsecret.yaml` and
# `dashboard/signup-bot-pat-externalsecret.yaml` respectively). Duplicate
# definitions previously lived here and tripped Argo's "Resource appeared
# 2 times" validation on multi-source Apps.
---
# gibson-platform-postgres-credentials — the platform DB password the daemon +
# platform/tenant operators mount (key resolved via
# `gibson.platformPostgres.passwordSecretKey`, which the kind AND aws-prod overlays
# both set to "password") AND the CNPG postgres-setup Job reads from
# `.data.password` to set the gibson_platform role password (epic-447 #729).
# SOLE producer across both render paths: the subchart-direct path (kind) and the
# umbrella path (EKS). The umbrella-only copy (deploy#911/PR#912) was a duplicate
# Owner ExternalSecret (same name+namespace) and was deleted (deploy#960); its EKS
# cold-bringup sync-wave ordering is folded in below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- if .Values.externalSecrets.preSyncBringup }}
  # Deterministic cold-bringup ordering (deploy#820, folded from the deleted
  # umbrella copy in deploy#960): STANDING infrastructure that owns its target
  # Secret (creationPolicy: Owner) — must NOT be an Argo hook (hook lifecycle would
  # cascade-delete the owned Secret), and must sync at wave -8 (after the
  # ClusterSecretStore at -10, before the postgres-setup Jobs at -6) so the
  # Job's `.data.password` wait resolves instead of deadlocking.
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  {{- end }}
  name: {{ include "gibson.platformPostgres.passwordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.platformPostgres.passwordSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        {{ include "gibson.platformPostgres.passwordSecretKey" . }}: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      # NOTE: the doubled gibson- prefix is a known wart. It is the name the
      # seed table carries, so this remoteRef matches it verbatim. Renaming it
      # to gibson-platform-postgres-password means one coordinated change to
      # the seed table, this template and secret-contract.yaml — see deploy#965.
      remoteRef: { key: gibson-gibson-platform-postgres-password, property: password }
# NOTE: gibson-zitadel-system-key is intentionally NOT produced here. It has a
# single canonical producer — the gitops `standalone-externalsecrets` app
# (apps/overlays/{base,kind,prod} zitadel-system-key) — which maps BOTH
# private-key.pem and public-key.pem. A duplicate fallback used to live here
# (epic-447 #730) but it raced the gitops producer and won with an incomplete
# (private-only) definition, wedging zitadel-init on a missing public-key.pem
# (deploy#769/#770). One producer, no race.
