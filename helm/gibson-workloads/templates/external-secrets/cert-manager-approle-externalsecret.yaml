{{/*
deploy#944: declarative materialisation of the cert-manager AppRole credential.

The cert-manager Vault Issuer (templates/cert-manager/openbao-issuer.yaml)
authenticates to the in-cluster OpenBao via the approle auth method.
It needs a K8s Secret holding the AppRole role_id + secret_id. The secret_id is
minted live by OpenBao — there is no static backend to sync it from — so it was
previously written by the openbao-approle-cert-manager-init Job via an
imperative `kubectl patch secret` / `create -f` (an allowlisted Check-28
exception).

This is now declarative via ESO's Vault generator:

  - VaultDynamicSecret "cert-manager-approle-secret-id" POSTs
    auth/<approle>/role/cert-manager/secret-id to mint a fresh secret_id;
  - VaultDynamicSecret "cert-manager-approle-role-id" GETs
    auth/<approle>/role/cert-manager/role-id to read the (stable) role_id;
  - the ExternalSecret merges both generator outputs and templates them into
    `gibson-cert-manager-approle` keyed `roleId` / `secretId` — the exact shape
    the openbao-issuer's secretRef expects.

Auth: both generators use token auth with their own token
(gibson-openbao-approle-reader / VAULT_ADMIN_TOKEN, policy
cert-manager-approle-reader: a fresh secret_id and the role_id of the
cert-manager role, nothing else). openbao-auto-init mints it. This is
deliberately NOT the kubernetes-auth mount, whose literal path deny-lists.

Ordering: the generators' Vault calls only succeed once the approle role
`cert-manager` exists, which the openbao-approle-cert-manager-init Job creates
(Vault HTTP bootstrap, no kubectl). ESO retries on refreshInterval, so on a cold
Phase-0 install the ExternalSecret reconciles to Ready shortly after the Job
finishes the role upsert. ESO thereafter rotates the secret_id on its own
cadence (every refreshInterval), replacing the Job-run-only rotation.

Gated identically to the issuer + bootstrap Job (certManager.issuers.vault.enabled).
*/}}
{{- if (((.Values.certManager).issuers).vault).enabled }}
{{- $vi := .Values.certManager.issuers.vault }}
{{- $auth := $vi.auth | default dict }}
{{- $aAuth := $auth.appRole | default dict }}
{{- $approlePath := $aAuth.path | default "approle" }}
{{- $sref := $aAuth.secretRef | default dict }}
{{- $secretName := $sref.name | default "gibson-cert-manager-approle" }}
{{- $baoAddr := include "gibson.openbaoAddr" . }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: cert-manager-approle-secret-id
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-manager-issuer
spec:
  # Mint a fresh secret_id (POST). The response data carries `secret_id`.
  path: "auth/{{ $approlePath }}/role/cert-manager/secret-id"
  method: "POST"
  parameters: {}
  resultType: "Data"
  provider:
    server: {{ $baoAddr | quote }}
    # OpenBao serves only TLS, from the chart CA (templates/auth/openbao-tls.yaml).
    caProvider:
      type: Secret
      name: {{ include "gibson.openbaoTLSSecret" . | quote }}
      key: ca.crt
    auth:
      # Token auth with the reader token of the two generators — NOT the
      # kubernetes-auth mount (deny-list).
      tokenSecretRef:
        name: gibson-openbao-approle-reader
        key: VAULT_ADMIN_TOKEN
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: cert-manager-approle-role-id
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-manager-issuer
spec:
  # Read the stable role_id (GET). The response data carries `role_id`.
  path: "auth/{{ $approlePath }}/role/cert-manager/role-id"
  method: "GET"
  resultType: "Data"
  provider:
    server: {{ $baoAddr | quote }}
    # OpenBao serves only TLS, from the chart CA (templates/auth/openbao-tls.yaml).
    caProvider:
      type: Secret
      name: {{ include "gibson.openbaoTLSSecret" . | quote }}
      key: ca.crt
    auth:
      tokenSecretRef:
        name: gibson-openbao-approle-reader
        key: VAULT_ADMIN_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-approle
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: cert-manager-issuer
spec:
  # Re-mint the secret_id periodically. AppRole secret_ids are short-TTL
  # (the role binds token_max_ttl=24h); an hourly refresh keeps a fresh,
  # un-expired secret_id materialised ahead of the issuer's next renewal.
  refreshInterval: "1h"
  target:
    name: {{ $secretName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/component: cert-manager-issuer
      data:
        roleId: '{{ "{{" }} .role_id {{ "}}" }}'
        secretId: '{{ "{{" }} .secret_id {{ "}}" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: cert-manager-approle-role-id
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: cert-manager-approle-secret-id
{{- end }}
