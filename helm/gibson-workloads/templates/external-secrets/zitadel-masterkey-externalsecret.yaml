{{- /*
deploy#1348 — the Zitadel masterkey, materialised from the ESO backend.

WHAT WAS WRONG. The umbrella pinned the key inline:

    helm/gibson/values.yaml
      zitadel.zitadel.masterkey: "kindDevZitadelMasterkey32CharsXX"

with a comment claiming "production overlays override via
masterkeySecretName". No overlay did — `grep -c masterkey` over
ci/values-saas.yaml, ci/values-staging.yaml and values-vanilla.yaml
returned 0, 0, 0, and the gitops env overlays set only the unrelated
platform KEK (`masterKey.keyName: master-kek`). Every profile therefore
rendered the IdP's encryption root key as a constant committed to git.
The masterkey is what Zitadel uses to encrypt IdP secrets at rest, so
read access to this repository was read access to those secrets.

`gibson-workloads/values.yaml` did name a Secret —
`zitadel.masterkeySecretName: gibson-zitadel-masterkey` — but that whole
values block is inert (zitadel is a dependency of the UMBRELLA, not of
this chart, and no template here reads it), and the string appeared in
exactly one place in the repo. Nothing created the Secret.

WHAT THIS DOES. Creates `gibson-zitadel-masterkey` from the ESO backend,
the same way every other platform secret arrives (deploy / PRD
deploy#255):

on every profile the openbao-auto-init sidecar seeds `zitadel-masterkey` in
the platform's OpenBao.

The umbrella now sets `zitadel.zitadel.masterkeySecretName` and leaves
`zitadel.zitadel.masterkey` empty. The upstream chart enforces the xor
(secret_zitadel-masterkey.yaml `fail`s when both or neither are set), so
a future re-introduction of an inline literal is a hard render failure,
not a silent downgrade — and scripts/check-chart-secret-plumbing.py
fails the build before that.

EXACTLY 32 CHARACTERS. Zitadel requires a 32-character masterkey. The two
backends do not agree on length:

  - AWS SM stores `base64(32 random bytes)` = 44 characters.
  - the kind backend stores a 32-character random_password.

So the template truncates to 32 and then ASSERTS the result is exactly
32, failing the ExternalSecret loudly (SecretSyncedError, Argo Degraded)
rather than materialising a short key that would only surface as an
opaque Zitadel boot failure. Truncating base64 is safe: 32 base64
characters carry 192 bits, and the value is deterministic, so it is
stable across refreshes — which matters, because rotating this key makes
every previously-encrypted IdP secret undecryptable.

UPGRADING A LIVE CLUSTER — AND WHY IT FREEZES THE WHOLE UMBRELLA.
The upstream chart's own masterkey Secret is `immutable: true`, so on any
cluster whose LAST APPLIED RENDER predates this change (not merely one
"restored from an older release", which is what this note used to claim) the
Secret already exists under this name and ESO can never take it over. The
ExternalSecret then parks in SecretSyncedError, and because it carries
sync-wave -8 its health gates every later wave: the umbrella stops applying
entirely — including the very revision that removes the colliding Secret.
That is a chicken-and-egg, and it is quiet, because the Argo app only reads
"Degraded". Staging sat frozen on it for hours on 2026-08-11 (deploy#1413).

RECOVERY: delete `secret/gibson-zitadel-masterkey` once. ESO materialises a
mutable replacement from the backend within refreshInterval, the wave clears,
and the umbrella applies again.

DO NOT re-seed the backend with the deleted Secret's value when that value is
the old inline literal — it is in this repository's history, so writing it back
into the backend re-creates exactly the leak this change closed. Accept the
rotation instead: a new masterkey means Zitadel cannot decrypt IdP secrets it
encrypted under the old one, so that data must be re-initialised. Preserve the
value ONLY if the live Secret already held a backend-generated key.

The collision itself is now gated: helm/gibson/tests/eso-target-collision.bats
fails the build when any plain Secret in the umbrella render shares a name with
an ExternalSecret target. The gibson-workloads-only assertion in
tests/eso-zitadel-masterkey.bats cannot see it — the colliding producer is the
zitadel sub-chart, which exists only in the umbrella.
*/ -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gibson-zitadel-masterkey
  namespace: {{ .Release.Namespace }}
  {{- if $eso.preSyncBringup }}
  # Cold-bringup ordering (deploy#820). Standing infrastructure that owns
  # its target Secret — must NOT be an Argo hook (hook lifecycle would
  # cascade-delete the owned Secret; that is exactly what happened to the
  # chart-rendered masterkey Secret on staging 2026-06-11). Wave -8 lands
  # after the ClusterSecretStore (-10) and before the zitadel init/setup
  # Jobs (-4/-3) that mount ZITADEL_MASTERKEY.
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  {{- end }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: zitadel
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: gibson-zitadel-masterkey
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          app.kubernetes.io/component: zitadel
      data:
        # Truncate to Zitadel's required 32 characters, then refuse to
        # materialise anything shorter. `fail` aborts the template, so a
        # too-short backend value leaves the Secret absent and the
        # ExternalSecret in SecretSyncedError instead of handing Zitadel a
        # key it will reject at boot.
        masterkey: '{{ `{{ $mk := .masterkey | trunc 32 }}{{ if ne (len $mk) 32 }}{{ fail "zitadel masterkey backend value is shorter than the required 32 characters" }}{{ end }}{{ $mk }}` }}'
  data:
    - secretKey: masterkey
      # NOTE: no `gibson-` infix. The seed table names this key
      # `zitadel-masterkey`, and the remoteRef reads it verbatim: one backend,
      # one key name, no prefix.
      remoteRef: { key: zitadel-masterkey, property: value }
