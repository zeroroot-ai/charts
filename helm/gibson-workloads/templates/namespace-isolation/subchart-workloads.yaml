{{/*
Per-component allow policies for the umbrella's SUBCHART workloads
(deploy#1365). The openfga, zitadel and neo4j charts are third-party
dependencies of the umbrella and ship no NetworkPolicies of their own, so
the namespace default-deny (namespace-isolation/default-deny.yaml) would
sever them. These policies are first-party wrappers that select the
subcharts' rendered pod labels.

Ingress lists each component's real in-namespace callers (enumerated from
the umbrella render — the connection strings and env vars in this chart's
templates are the source of truth). Egress is deliberately allow-all for
every covered first-party workload: the default-deny exists to contain
UNSELECTED pods (the containment ask of deploy#1365), and per-component
egress tightening is tracked separately (deploy#1462). A missed egress rule is a
runtime outage that no render catches; a missed ingress caller fails
loudly at bringup. Enforcement is real as of deploy#1430
(NETWORK_POLICY_ENFORCING_MODE=standard).

Caller sets are label-based ORs; entries whose pods are absent in a given
profile are inert.
*/}}
{{- $devDisabled := false -}}
{{- with .Values.dev -}}{{- with .networkPolicy -}}{{- $devDisabled = .disabled -}}{{- end -}}{{- end -}}
{{- if not $devDisabled -}}
{{/* ---------------------------------------------------------------------
     OpenFGA (subchart `openfga`, Deployment + migrate hook Job).
     :8080 HTTP + :8081 gRPC — the allow/deny decision surface. Callers:
     ext-authz (every Check), daemon, both operators (FGA aggregate root /
     tenant provisioning), fga-init (model bootstrap), the
     active-session-backfill operations Job, the first-admin bootstrap Job. :2112 metrics for scrapers.
     The migrate Job shares these labels and inherits the egress allowance
     (it dials Postgres directly).
--------------------------------------------------------------------- */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-openfga
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: openfga-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openfga
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ext-authz
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: daemon
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: tenant-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: platform-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: fga-init
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: active-session-backfill
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: first-admin
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
        - podSelector:
            matchLabels:
              app: grafana-agent
      ports:
        - protocol: TCP
          port: 2112
  egress:
    - {}
---
{{/* ---------------------------------------------------------------------
     Zitadel (subchart `zitadel`, Deployment + init/setup/cleanup hook
     Jobs — all carry app.kubernetes.io/name: zitadel, so the hook Jobs
     inherit the egress allowance they need to reach Postgres). :8080 is
     the single HTTP/2 listener (OIDC + gRPC APIs). Callers: Envoy (login
     + OIDC routes), zitadel-login (Login V2 UI), ext-authz (JWKS),
     daemon (IdP admin), dashboard (server-action token exchange), both
     operators (OIDC app provisioning), and the umbrella bringup Jobs
     signup-bot-pat-minter / zitadel-login-branding / first-admin.
--------------------------------------------------------------------- */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-zitadel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: zitadel-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: envoy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel-login
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ext-authz
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: daemon
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: dashboard
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: tenant-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: platform-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: signup-bot-pat-minter
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: zitadel-login-branding
        # The first-admin Job creates the founding owner through the
        # Management API, dialing Zitadel by Service name (ADR-0092).
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: first-admin
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}
---
{{/* Zitadel Login V2 UI — reached only through the Envoy edge. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-zitadel-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: zitadel-login-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-login
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: envoy
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - {}
---
{{/* ---------------------------------------------------------------------
     Platform Neo4j (subchart `neo4j`). The subchart's pods carry
     helm.neo4j.com/* labels, NOT app.kubernetes.io/component: neo4j —
     the pre-existing databases/neo4j-networkpolicy.yaml selects the
     latter (per-tenant convention) and does not cover the umbrella
     instance (deploy#1378 notes the same naming divergence). Callers:
     daemon (GraphRAG) and tenant-operator (per-tenant DB provisioning
     inside the shared instance). Bolt :7687 + HTTP :7474.
--------------------------------------------------------------------- */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-platform-neo4j
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-neo4j-isolation
spec:
  podSelector:
    matchLabels:
      helm.neo4j.com/pod_category: neo4j-instance
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: daemon
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: tenant-operator
      ports:
        - protocol: TCP
          port: 7687
        - protocol: TCP
          port: 7474
  egress:
    - {}
---
{{/* CloudNativePG operator isolation lives in the umbrella
     (helm/gibson/templates/networkpolicy-platform-operators.yaml) with the
     other cluster operators the umbrella owns (deploy#1728). */}}
{{/* ---------------------------------------------------------------------
     CNPG bootstrap Jobs (platform-postgres): initdb, full-recovery, join,
     pgbasebackup. The operator creates them at RUNTIME with the labels
     cnpg.io/cluster, cnpg.io/instanceName and cnpg.io/jobRole, and NOT
     cnpg.io/podRole, so the instances policy below never selected them and
     the default-deny did. initdb needs nothing from the network, which is
     why this went unseen; full-recovery downloads the base backup and every
     WAL segment from the durable bucket, and join/pgbasebackup stream from
     the primary. Measured 2026-09-07 on a restore recreate: the
     full-recovery Job died six times in 41 minutes on
       Barman cloud WAL archive check exception: Connect timeout on
       endpoint URL: "http://172.18.255.250:9000/gibson-kind"
     while the previous cluster's instance pods had archived to that same
     endpoint. Postgres never came up, SPIRE (datastore: postgres) crash-
     looped, the SPIFFE CSI driver had no agent socket, and every pod that
     mounts one sat in Init: the whole platform, held by one missing
     selector. Egress allow-all, like every first-party policy here; no
     ingress, a bootstrap Job serves nothing. The guard is
     scripts/check-cnpg-netpol-covers-jobs.sh.
--------------------------------------------------------------------- */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cnpg-jobs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: cnpg-jobs-isolation
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/jobRole
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  egress:
    - {}
---
{{/* ---------------------------------------------------------------------
     CNPG-managed Postgres instances (platform-postgres). These pods are
     created at RUNTIME by the CNPG operator from a Cluster CR, so they
     never appear in a chart render — this policy is written against the
     labels CNPG stamps on every instance pod (cnpg.io/podRole: instance).
     The bootstrap Jobs carry cnpg.io/jobRole instead and have their own
     policy above.
     The Cluster renders on every profile, so this policy is
     live everywhere. :5432 callers: every platform component with
     a database, the CNPG operator itself, and instance-to-instance
     replication. :8000 is the operator's instance-status probe;
     :9187 metrics. The postgres-setup bringup Jobs are NOT listed — they
     reach the primary via `kubectl exec`, not the network.

     THE SEAM FOR EVERYTHING THIS CHART DOES NOT SHIP. A SaaS overlay
     (ADR-0006) is a separate Argo Application that this chart knows nothing
     about, and its pods may legitimately need :5432. The wrong answer is for
     the overlay to write its own NetworkPolicy against these pods: the
     moment any policy selects a pod, that pod's ingress is deny-by-default
     and only the UNION of selecting policies is allowed — so on a cold
     start, where the overlay Application syncs before this one, the overlay
     policy is the only one there and it fences the CNPG operator out of
     :8000. The operator then cannot read the instance status, the Cluster
     never reports ready, and the umbrella sync deadlocks on the wave that
     waits for it. Measured on the 2026-09-14 from-zero staging bringup:
     "Cannot extract Pod status ... dial tcp 10.40.140.223:8000: i/o
     timeout", 106 of 420 resources applied, the sync terminated by Argo's
     30-minute cap three times over.

     So the contract is a LABEL, declared here and opted into there: a pod
     carrying gibson.zeroroot.ai/platform-postgres-client=true may reach
     :5432. Overlays label their own pods and write no policy on ours, which
     leaves this chart the single owner of these pods' ingress and removes
     the ordering dependency between two independent Applications.
--------------------------------------------------------------------- */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cnpg-instances
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: cnpg-instances-isolation
spec:
  podSelector:
    matchLabels:
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # The opt-in seam: see THE SEAM above. Any pod, in this namespace,
        # that declares itself a platform-postgres client.
        - podSelector:
            matchLabels:
              gibson.zeroroot.ai/platform-postgres-client: "true"
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: daemon
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: dashboard
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ext-authz
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: tenant-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: platform-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: active-session-backfill
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openfga
        # SPIRE server datastore.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: server
        # CNPG operator + instance-to-instance replication.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
        - podSelector:
            matchLabels:
              cnpg.io/podRole: instance
        # The operator's OWN Jobs, which are not instances and never carry
        # cnpg.io/podRole. A `join` Job is how every replica after the first
        # is built: it connects to platform-postgres-rw as streaming_replica
        # and runs pg_basebackup. Without this the Job's packets are dropped
        # and it retries for ever on "dial error: timeout", the Cluster sits
        # in "Creating a new replica" at N-1 of N, and NOTHING reports it —
        # CNPG calls the Cluster healthy enough and Argo calls the
        # Application Healthy, so the bringup declares success over a
        # database that is one replica short and will stay that way.
        # Measured on staging 2026-09-14: instance 2 joined in 79 seconds
        # because its Job ran before this policy was programmed; instance 3
        # started after and was still retrying 28 minutes later.
        #
        # `Exists` covers every jobRole the operator has — join, initdb,
        # pgbasebackup, import — so a future one is not a fourth outage.
        - podSelector:
            matchExpressions:
              - key: cnpg.io/jobRole
                operator: Exists
      ports:
        - protocol: TCP
          port: 5432
    # Operator status probe.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
        - podSelector:
            matchLabels:
              app: grafana-agent
      ports:
        - protocol: TCP
          port: 9187
  egress:
    - {}
{{- end }}
