{{- /*
  Redis password rotation controller (deploy#517, deploy#518, ADR-0171).

  A rotation starts with a new value at the OpenBao key gibson-redis-password
  (its lifetime in files/openbao-seed-keys.txt, or the monthly drill). ESO
  writes the Secret. This CronJob then runs the rotation, with no window in
  which a client is refused:

    1. It adds the NEW password to the running redis-stack ACL, with the old
       password as its login. Both passwords now work.
    2. It restarts each client of Redis, one at a time, and waits for each:
       the daemon, the tenant-operator, ext-authz and ratelimit. Each one
       reads the new password at start.
    3. It removes the OLD password from the ACL. The old password is refused.

  redis-stack itself does not restart. Its probes accept NOAUTH, so a probe
  that holds the old password does not make the pod unready. Its init
  container writes the ACL file from the Secret, so a later restart of
  redis-stack starts with the new password only.

  Reloader does NOT restart redis-stack for this Secret: a restart of the
  store with only the new password refuses each client that has not
  restarted yet.

  First run after deployment: no rotation-state Secret exists. The CronJob
  records the current password and does nothing else.

  Components:
    - ServiceAccount  gibson-redis-rotation
    - Role            gibson-redis-rotation  (namespace-scoped, least-privilege)
    - RoleBinding
    - CronJob         {{ .Release.Name }}-redis-rotation  (every minute, Forbid concurrency)
*/}}
{{- $saName := "gibson-redis-rotation" -}}
{{- $stateSecret := printf "%s-redis-rotation-state" .Release.Name -}}
{{- $redisSecret := include "gibson.redisPasswordSecretName" . -}}
{{- $redisKey    := include "gibson.redisPasswordSecretKey"  . -}}
{{- $redisSts    := printf "%s-redis-stack" .Release.Name -}}
{{- $daemonSts   := include "gibson.fullname" . -}}
{{- $tenantOpDep := "gibson-tenant-operator" -}}
{{- $extAuthzDep := "gibson-ext-authz" -}}
{{- $ratelimitDep := "gibson-ratelimit" -}}
{{- $ns          := .Release.Namespace -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-rotation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-rotation
rules:
  # Read the redis password Secret to detect rotation and retrieve passwords.
  # Every read in the script is a named `kubectl get secret`, so the rule
  # names the Secret. A namespace-wide read would also reach the Zitadel
  # owner credentials (scripts/check-owner-credential-readers.py).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $redisSecret | quote }}]
    verbs: ["get"]
  # Manage the rotation-state Secret (stores last-processed version +
  # last-known password for the dual-password ACL window).
  # K8s ignores resourceNames for `create` (no name exists yet at create time),
  # so create is a separate unrestricted rule (deploy#557).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # update/patch/delete are name-restricted to the state Secret only.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $stateSecret | quote }}]
    verbs: ["get", "update", "patch", "delete"]
  # Reads for the rollout-status watch loop (deploy#551) — these stay
  # namespace-wide because `kubectl rollout status` LISTs.
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  # WRITES are name-restricted (deploy#1210). `patch` on .spec.template is a
  # platform-identity grant, not a restart button: Kubernetes has no
  # `serviceaccounts/use` verb, so an unrestricted patch here let this
  # CronJob rewrite ANY workload in the namespace — including its own
  # `serviceAccountName` — and take that workload's SVID. Unlike `create`,
  # `patch` honours resourceNames, so the grant is scoped to exactly the four
  # workloads the script rolls:
  #   kubectl rollout restart statefulset/$DAEMON_STS
  #   kubectl rollout restart deployment/$TENANT_OP
  #   kubectl rollout restart deployment/$EXT_AUTHZ
  #   kubectl rollout restart deployment/$RATELIMIT
  # redis-stack is deliberately absent: it never restarts for a rotation.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ $daemonSts | quote }}]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $tenantOpDep | quote }}, {{ $extAuthzDep | quote }}, {{ $ratelimitDep | quote }}]
    verbs: ["patch"]
  # rollout status needs to watch the status sub-resource.
  - apiGroups: ["apps"]
    resources: ["statefulsets/status", "deployments/status"]
    verbs: ["get", "watch", "list"]
  # kubectl rollout status for Deployments needs to read ReplicaSets.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Execute redis-cli commands inside the redis-stack pod for ACL management.
  # deploy#1363: name-scoped to the single redis-stack StatefulSet pod. `exec`
  # is a subresource of an EXISTING named Pod, so `create` honours resourceNames
  # (unlike Pod `create`, where no name exists yet). redis-stack is a
  # replicas=1 StatefulSet (redis-stack.yaml), so its pod name is deterministic
  # ("<sts>-0") and the script derives it directly — the namespace-wide
  # `pods: get,list` grant this rule used to carry is gone with it. This closes
  # the primitive named in deploy#1363: an UNRESTRICTED pods/exec create in the
  # gibson namespace is the same identity grant as pod-create — exec into any
  # platform pod and you hold that workload's SPIFFE SVID, projected SA token
  # and mounted Secrets, and no admission policy (the platform-identity VAP
  # matches `pods` CREATE, not `pods/exec`) sees it.
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: [{{ printf "%s-0" $redisSts | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-rotation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-redis-rotation
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-rotation
spec:
  # Every minute — finest CronJob granularity. A rotation starts at most 60s
  # after ESO writes the Secret.
  schedule: {{ ((.Values.redis).rotation).schedule | default "* * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No backoff: if the script fails (e.g. redis-stack not yet Ready), the
      # next CronJob tick retries within a minute. Immediate requeue not needed.
      backoffLimit: 0
      # Full rotation = the daemon rollout (900s) + the tenant-operator,
      # ext-authz and ratelimit rollouts (3 x 180s) + the ACL steps and the
      # state write. 1800s is above that sum. The daemon has 6 init
      # containers and can take 7+ minutes on kind (deploy#563). A job that
      # the deadline stops converges on the next tick: the old password
      # still works until step 3.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "gibson.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: redis-rotation
            {{- include "gibson.netLabels" (dict "role" "platform" "clients" (list "redis") "kubeApi" true) | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $saName }}
          {{- include "gibson.imagePullSecrets" . | nindent 10 }}
          # Secure pod (ADR-0165, charts#394): non-root, the RuntimeDefault seccomp
          # profile, a read-only root filesystem and no capabilities. kubectl
          # writes its cache under HOME=/tmp, an emptyDir.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
          containers:
            - name: rotation-controller
              image: "ghcr.io/zeroroot-ai/mirror/kubectl:1.31.4@sha256:64614ef8290f3fb27fed5164b338debeeb79a1e5e26c93eb920770b71abd7c48"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                - name: HOME
                  value: /tmp
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  NS={{ $ns | quote }}
                  REDIS_SECRET={{ $redisSecret | quote }}
                  REDIS_KEY={{ $redisKey | quote }}
                  STATE_SECRET={{ $stateSecret | quote }}
                  REDIS_STS={{ $redisSts | quote }}
                  DAEMON_STS={{ $daemonSts | quote }}
                  TENANT_OP={{ $tenantOpDep | quote }}
                  EXT_AUTHZ={{ $extAuthzDep | quote }}
                  RATELIMIT={{ $ratelimitDep | quote }}

                  # The Secret this rotates is created by the same release that
                  # schedules this CronJob, so on a fresh install the first firing
                  # can land before it exists. That is not an error worth alarming
                  # on: exit 0 and let the next schedule do the work, rather than
                  # leaving an Error pod on every clean bringup and training an
                  # operator to ignore them (charts#3).
                  if ! kubectl get secret -n "$NS" "$REDIS_SECRET" >/dev/null 2>&1; then
                    echo "[rotation] ${REDIS_SECRET} not created yet — install still converging."
                    echo "[rotation] nothing to rotate; the next scheduled run picks it up."
                    exit 0
                  fi

                  # Read current Secret version and password.
                  CURRENT_VERSION=$(kubectl get secret -n "$NS" "$REDIS_SECRET" \
                    -o jsonpath='{.metadata.resourceVersion}')
                  CURRENT_PASSWORD=$(kubectl get secret -n "$NS" "$REDIS_SECRET" \
                    -o jsonpath="{.data.${REDIS_KEY}}" | base64 -d)

                  # Read last-processed version from rotation-state Secret.
                  LAST_VERSION=$(kubectl get secret -n "$NS" "$STATE_SECRET" \
                    -o jsonpath='{.data.lastProcessedVersion}' 2>/dev/null \
                    | base64 -d 2>/dev/null || echo "")

                  # First-boot registration: no rotation-state exists yet.
                  # Record the current version as baseline and exit without
                  # touching any StatefulSets — version <none>→N is not a rotation.
                  if [ -z "$LAST_VERSION" ]; then
                    echo "First boot — recording version ${CURRENT_VERSION} in state; no rotation needed."
                    kubectl create secret generic "$STATE_SECRET" -n "$NS" \
                      --from-literal=lastProcessedVersion="$CURRENT_VERSION" \
                      --from-literal=lastKnownPassword="$CURRENT_PASSWORD" \
                      --save-config --dry-run=client -o yaml \
                      | kubectl apply -f -
                    exit 0
                  fi

                  if [ "$CURRENT_VERSION" = "$LAST_VERSION" ]; then
                    echo "No rotation (version ${CURRENT_VERSION} unchanged). Exiting."
                    exit 0
                  fi

                  # Read previous password from rotation-state Secret for
                  # the dual-password ACL window.
                  PREV_PASSWORD=$(kubectl get secret -n "$NS" "$STATE_SECRET" \
                    -o jsonpath='{.data.lastKnownPassword}' 2>/dev/null \
                    | base64 -d 2>/dev/null || echo "")

                  echo "Rotation detected: version ${LAST_VERSION:-<none>} → ${CURRENT_VERSION}"

                  # redis-stack is a replicas=1 StatefulSet, so its one pod is
                  # always "<sts>-0". Deriving the name lets the Role name-scope
                  # pods/exec to exactly this pod (deploy#1363).
                  REDIS_POD="${REDIS_STS}-0"

                  save_state() {
                    kubectl create secret generic "$STATE_SECRET" -n "$NS" \
                      --from-literal=lastProcessedVersion="$CURRENT_VERSION" \
                      --from-literal=lastKnownPassword="$CURRENT_PASSWORD" \
                      --save-config --dry-run=client -o yaml \
                      | kubectl apply -f -
                  }

                  # A new Secret version with the same password is no rotation.
                  if [ "$PREV_PASSWORD" = "$CURRENT_PASSWORD" ]; then
                    echo "[rotation] the Secret changed and the password did not; recording version ${CURRENT_VERSION}"
                    save_state
                    exit 0
                  fi

                  # redis_acl <login password> <password> [resetpass]: run
                  # ACL SETUSER default [resetpass] ><password> in redis-stack.
                  # Both passwords go on stdin, never on an argv of kubectl
                  # or of redis-cli.
                  redis_acl() {
                    printf '%s\n%s\n' "$1" "$2" | kubectl exec -i -n "$NS" "$REDIS_POD" -- \
                      sh -c 'read -r p; read -r n; REDISCLI_AUTH="$p" exec redis-cli --no-auth-warning ACL SETUSER default "$@" ">$n"' redis-cli ${3:-}
                  }
                  # redis_ping <password>: PONG when redis-stack accepts it.
                  redis_ping() {
                    printf '%s\n' "$1" | kubectl exec -i -n "$NS" "$REDIS_POD" -- \
                      sh -c 'read -r p; REDISCLI_AUTH="$p" exec redis-cli --no-auth-warning PING'
                  }

                  # 1. Both passwords work. The store still runs with the old one.
                  if [ -n "$PREV_PASSWORD" ] && [ "$(redis_ping "$PREV_PASSWORD" 2>&1)" = PONG ]; then
                    out=$(redis_acl "$PREV_PASSWORD" "$CURRENT_PASSWORD" 2>&1)
                    case "$out" in
                      OK) echo "[rotation] added the new password; the old and the new password both work" ;;
                      *) echo "[rotation] FATAL: ACL SETUSER with the old password answered: ${out}" >&2; exit 1 ;;
                    esac
                  elif [ "$(redis_ping "$CURRENT_PASSWORD" 2>&1)" = PONG ]; then
                    # The store already runs with the new password only: it
                    # restarted after ESO wrote the Secret, or an earlier job
                    # stopped after step 3. The clients must restart now.
                    echo "[rotation] redis-stack already accepts only the new password; restarting the clients"
                  else
                    echo "[rotation] FATAL: redis-stack accepts neither the previous nor the current password" >&2
                    exit 1
                  fi

                  # 2. Each client restarts and reads the new password.
                  restart() {
                    echo "[rotation] restarting $1..."
                    kubectl rollout restart "$1" -n "$NS"
                    kubectl rollout status "$1" -n "$NS" --timeout="$2"
                    echo "[rotation] $1 ready"
                  }
                  restart "statefulset/${DAEMON_STS}" 900s
                  restart "deployment/${TENANT_OP}" 180s
                  restart "deployment/${EXT_AUTHZ}" 180s
                  restart "deployment/${RATELIMIT}" 180s

                  # A second change of the Secret during step 2: a client that
                  # restarted late holds a password the store does not know
                  # yet. Keep the old password, and let the next run add the
                  # newest one while the old one still works.
                  NOW_PASSWORD=$(kubectl get secret -n "$NS" "$REDIS_SECRET" \
                    -o jsonpath="{.data.${REDIS_KEY}}" | base64 -d)
                  if [ "$NOW_PASSWORD" != "$CURRENT_PASSWORD" ]; then
                    echo "[rotation] the password changed again during the restarts; the next run completes the rotation"
                    exit 0
                  fi

                  # 3. The old password is refused.
                  out=$(redis_acl "$CURRENT_PASSWORD" "$CURRENT_PASSWORD" resetpass 2>&1)
                  case "$out" in
                    OK) echo "[rotation] removed the old password; only the new password works" ;;
                    *) echo "[rotation] FATAL: ACL SETUSER resetpass answered: ${out}" >&2; exit 1 ;;
                  esac

                  save_state
                  echo "Rotation complete. New version: ${CURRENT_VERSION}"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  # This is a kubectl shell-loop controller that spends most
                  # of its life waiting on `kubectl rollout status`; it does
                  # not need a 200m burst. 100m matches the sibling OpenBao
                  # init jobs and keeps the kind CPU budget in line
                  # (deploy#858).
                  cpu: 100m
                  memory: 64Mi
