{{- /*
The trace collector ServiceAccount (charts#816). A SPIRE attestation
attribute (the k8s:sa: selector of the gibson-platform-trace-collector
ClusterSPIFFEID) and a ValidatingAdmissionPolicy key. The pod never talks to
the Kubernetes API, so the token is not mounted.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gibson.traceCollectorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: trace-collector
automountServiceAccountToken: false
