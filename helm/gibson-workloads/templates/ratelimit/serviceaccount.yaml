{{- /*
ratelimit ServiceAccount (deploy#1657).

Exists solely to be a SPIRE attestation attribute (the `k8s:sa:` workload
selector on the gibson-platform-ratelimit ClusterSPIFFEID) and a
ValidatingAdmissionPolicy key (spire-server/platform-identity-admission.yaml).
The pod never talks to the Kubernetes API — its config is a ConfigMap, its
SPIFFE material comes from the Workload API socket — so the projected token
is not mounted. Without a dedicated SA the selector would degrade to
`k8s:sa:default`, shared with docs-svc, grafana, jaeger, loki and redis-stack.
*/}}
{{- if .Values.ratelimit.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gibson.ratelimitServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: ratelimit
  {{- with .Values.ratelimit.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
