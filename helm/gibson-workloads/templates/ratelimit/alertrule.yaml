{{- /*
Per-client quota degradation alerts (deploy#1657, D92).

Two filters call the quota service, and each one has its own alert.

The stage 0 filter envoy.filters.http.ratelimit is fail-open: when the quota
service is unreachable, traffic passes under the local fuse and Envoy increments
cluster.<upstream>.ratelimit.<stat_prefix>.failure_mode_allowed for every
request it could not check (Prometheus:
envoy_cluster_ratelimit_public_per_client_failure_mode_allowed, measured on
the edge harness). EdgePerClientQuotaFailingOpen pages on it.

The stage 1 filter envoy.filters.http.ratelimit.signup judges only POST
/signup and is fail-closed (D92): it refuses the signup with 503 and increments
envoy_cluster_ratelimit_public_signup_error. EdgeSignupQuotaFailingClosed
pages on it.

That is the observable-degradation rule of the seam convention: a silently
degraded SaaS edge must be detectable.

Renders only where prometheus-operator CRDs exist, like the Redis rules.
*/}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-ratelimit-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: ratelimit
spec:
  groups:
    - name: ratelimit-degradation
      rules:
        # One Envoy pod emits both counters with the same labels. A name
        # regex selector loses the name in increase(), so the two series
        # collide and the rule fails to evaluate (charts#736). Each counter
        # is summed alone, and a missing counter counts as zero.
        - alert: EdgePerClientQuotaFailingOpen
          expr: |
            (sum(increase(envoy_cluster_ratelimit_public_per_client_failure_mode_allowed[5m])) or vector(0))
              + (sum(increase(envoy_cluster_ratelimit_api_per_client_failure_mode_allowed[5m])) or vector(0)) > 0
          for: 2m
          labels:
            severity: page
            component: ratelimit
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/ratelimit.md#edgeperclientquotafailingopen"
            summary: "Edge per-client quota is failing open — requests pass unchecked"
            description: |
              The edge Envoy could not reach the ratelimit service for at least
              one request in the last 5 minutes and let it through under the
              per-pod fuse only. The per-client quotas of login and the other
              fail-open routes are NOT enforced. POST /signup fails closed
              instead and raises EdgeSignupQuotaFailingClosed (D92). Check
              gibson-ratelimit pods, the SPIFFE mTLS sidecar, and
              gibson-redis-stack.
        # D92: POST /signup fails closed. When the quota service does not
        # answer, the stage 1 filter refuses the signup with 503 and counts
        # envoy_cluster_ratelimit_public_signup_error. It never counts
        # failure_mode_allowed, so the rule above cannot see it.
        - alert: EdgeSignupQuotaFailingClosed
          expr: |
            sum(increase(envoy_cluster_ratelimit_public_signup_error[5m])) > 0
          for: 2m
          labels:
            severity: page
            component: ratelimit
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/ratelimit.md#edgesignupquotafailingclosed"
            summary: "Edge signup quota got no answer — signups are refused with 503"
            description: |
              The edge Envoy got no quota answer for at least one POST /signup
              in the last 5 minutes and refused it with 503 (D92: signup fails
              closed). New signups fail while this lasts. Check gibson-ratelimit
              pods, the SPIFFE mTLS sidecar, and gibson-redis-stack.
{{- end }}
