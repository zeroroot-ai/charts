{{- /*
  sandbox-eviction-handler — node-local sidecar (zeroroot-ai/gibson#211,
 §6: node-local sidecars). One DaemonSet that runs on every
  sandbox-host node, watches /var/run/aws/spot-interruption-notice, and
  cordons its own node via the Kubernetes API on appearance. The gibson
  daemon never imports this binary's code; the two share an image
  (the gibson Dockerfile bundles both binaries) but nothing else.

  Why a separate ServiceAccount from the gibson daemon's:

  - The daemon's ServiceAccount intentionally has NO `nodes:patch` RBAC
    (deploy#408 shrunk it as part of the K8s-API rip). Giving
    nodes:patch back to the daemon SA would defeat the whole point.
  - The eviction handler runs only on sandbox-host nodes, so its
    permissions can be scoped tighter than the daemon's.
  - Auditing "who can cordon nodes" stays cluster-scope explicit.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gibson.fullname" . }}-sandbox-eviction-handler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-eviction-handler
