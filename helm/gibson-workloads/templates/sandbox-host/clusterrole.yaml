{{- /*
  sandbox-eviction-handler — ClusterRole. The handler patches the Node
  resource it runs on (Spec.Unschedulable=true) — the wire shape of
  `kubectl cordon`. Kubernetes RBAC for `nodes` is cluster-scope, so a
  ClusterRole is the minimum-viable binding shape.

  Verbs are restricted to the union of what `kubectl cordon` actually
  sends (`get` + `patch`). No `list/watch/create/delete/update`.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gibson.fullname" . }}-sandbox-eviction-handler
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-eviction-handler
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
