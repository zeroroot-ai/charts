{{/*
The setec disk signing seed (ADR-0166), delivered to the SETEC namespace.

The disk builder of the setec subchart signs each image disk with an ed25519
seed, read from the Secret that setec.launcher.diskBuilder.signingSecret
names, key `seed`, as base64 of 32 bytes. Each launcher checks the signature
with setec.launcher.diskBuilder.publicKeys. The seed is the bringup keyring
member SETEC_DISK_SIGNING_SEED (scripts/keyring.sh): the bringup writes it
into bringup-keyring, the OpenBao seeder stores it at
secret/data/setec-disk-signing (files/openbao-seed-keys.txt), and this
ExternalSecret renders it here. One seed, one owner, one copy in the cluster
store (ADR-0083). The install derives the public key from the same keyring
member (scripts/baseline-up.sh), so the two never disagree.
*/}}
{{- if .Values.setec.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.setec.launcher.diskBuilder.signingSecret | quote }}
  namespace: {{ include "gibson.setecNamespace" . }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-disk-builder
spec:
  refreshInterval: 60s
  secretStoreRef:
    kind: ClusterSecretStore
    name: gibson-secrets
  target:
    name: {{ .Values.setec.launcher.diskBuilder.signingSecret | quote }}
    creationPolicy: Owner
  data:
    - secretKey: seed
      remoteRef:
        key: setec-disk-signing
        property: seed
{{- end }}
