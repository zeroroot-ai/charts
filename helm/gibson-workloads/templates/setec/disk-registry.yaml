{{/*
The push credential of the setec disk builder (D85, charts#574).

Each AWS environment keeps its signed sandbox disks in one private ECR
repository (setec.launcher.diskRepo, made by stage 0 of hosted). The disk
builder Job of the setec subchart pushes there with the Docker config that
setec.launcher.diskBuilder.registrySecret names. An ECR password is a token
of GetAuthorizationToken that lives 12 hours, so no static Secret can hold it.

The chain, in the setec namespace:

  1. ExternalSecret setec-disk-push-key: the access key pair of the
     stage 0 IAM user <prefix>-<env>-setec-disk-builder (push on the disk
     repository only). The bringup writes the pair from the keyring members
     SETEC_DISK_PUSH_ACCESS_KEY and SETEC_DISK_PUSH_SECRET_KEY into the
     Secret setec-disk-push-credential of the release namespace (hosted
     scripts/keyring-to-cluster.sh). The OpenBao seeder stores it at
     secret/data/setec-disk-push-credential (files/openbao-seed-keys.txt).
     No key sits in a values file.
  2. ECRAuthorizationToken setec-disk-registry: the External Secrets
     generator that calls GetAuthorizationToken with that pair, in the region
     of the repository.
  3. ExternalSecret setec-disk-registry: a kubernetes.io/dockerconfigjson
     Secret for the registry host of diskRepo, refreshed every 6 hours, half
     the life of the token.

The chain renders when registrySecret is setec-disk-registry, the default, so
no install sets a value for it (charts#574). It has two shapes:

  - diskRepo on ECR (<account>.dkr.ecr.<region>.amazonaws.com/<name>): the
    three objects above.
  - any other registry (the plain HTTP registry of kind): a Fake generator
    gives the Docker config {"auths":{}}, so the disk builder pushes with no
    credential, as before.

Another value of registrySecret names a Secret that the operator of the
install writes. The chart then renders nothing here.

When the ECR push key pair is missing (the keyring members
SETEC_DISK_PUSH_ACCESS_KEY and SETEC_DISK_PUSH_SECRET_KEY are empty), the
generator cannot call ECR. The env owner then sees the ExternalSecret
setec-system/setec-disk-registry not synced (Ready False, SecretSyncedError),
the hosted alert ExternalSecretNotReady for it, and each disk build fails at
the push.
*/}}
{{- if .Values.setec.enabled }}
{{- $ecr := include "gibson.ecrRepo" .Values.setec.launcher.diskRepo | fromJson }}
{{- if eq .Values.setec.launcher.diskBuilder.registrySecret "setec-disk-registry" }}
{{- $ns := include "gibson.setecNamespace" . }}
{{- if $ecr.host }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: setec-disk-push-key
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-disk-builder
spec:
  refreshInterval: 60s
  secretStoreRef:
    kind: ClusterSecretStore
    name: gibson-secrets
  target:
    # Not the name of the bringup Secret of the release namespace: one
    # name, one writer (D40).
    name: setec-disk-push-key
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: setec-disk-push-credential
        property: access_key_id
    - secretKey: secret-access-key
      remoteRef:
        key: setec-disk-push-credential
        property: secret_access_key
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: setec-disk-registry
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-disk-builder
spec:
  region: {{ $ecr.region | quote }}
  auth:
    secretRef:
      accessKeyIDSecretRef:
        name: setec-disk-push-key
        key: access-key-id
      secretAccessKeySecretRef:
        name: setec-disk-push-key
        key: secret-access-key
{{- else }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Fake
metadata:
  name: setec-disk-registry
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-disk-builder
spec:
  # A registry that is not ECR takes no credential from the chart.
  data:
    config: '{"auths":{}}'
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: setec-disk-registry
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-disk-builder
spec:
  # Half the 12-hour life of an ECR token.
  refreshInterval: 6h
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: {{ if $ecr.host }}ECRAuthorizationToken{{ else }}Fake{{ end }}
          name: setec-disk-registry
  target:
    name: setec-disk-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        {{- if $ecr.host }}
        .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"{{ .username }}\",\"password\":\"{{ .password }}\"}}}" $ecr.host | quote }}
        {{- else }}
        .dockerconfigjson: "{{ `{{ .config }}` }}"
        {{- end }}
{{- end }}
{{- end }}
