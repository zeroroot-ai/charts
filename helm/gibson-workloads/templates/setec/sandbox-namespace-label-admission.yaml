{{- /*
Who may set the sandbox label on a Namespace (charts#815, in the style of
charts#527).

The setec host guard binds to each sandbox namespace by the label
setec.zeroroot.ai/sandbox-namespace=true (setec chart README). It refuses a
host namespace, a hostPath volume and a privileged container there. A
principal that removes the label from a sandbox namespace removes that
guard. Two principals write the label: the setec frontend, when it makes
the namespace of a client and tenant pair, and the principal that applies
this chart, for the namespaces of setec.sandboxNamespaces
(sandbox-namespace.yaml). No network rule of this chart selects the label:
a sandbox reaches the gateway only through the Edge.

This policy refuses a CREATE or UPDATE of a Namespace that adds, changes or
removes the label, from any other principal. An UPDATE that keeps the label
as it was passes, so the namespace controller and the garbage collector are
not affected.
*/ -}}
{{- $key := "setec.zeroroot.ai/sandbox-namespace" }}
{{- $ia := (.Values.spire.identityAdmission | default dict) }}
{{- $frontend := printf "system:serviceaccount:%s:%s-frontend" (include "gibson.setecNamespace" .) (include "gibson.setecFullname" .) }}
{{- $writers := concat (list $frontend) ($ia.workloadCreators | default (list)) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gibson-sandbox-namespace-label
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    - name: newValue
      expression: >-
        has(object.metadata.labels) && {{ $key | quote }} in object.metadata.labels
          ? object.metadata.labels[{{ $key | quote }}] : ''
    - name: oldValue
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.labels)
          && {{ $key | quote }} in oldObject.metadata.labels
          ? oldObject.metadata.labels[{{ $key | quote }}] : ''
  validations:
    - expression: >-
        variables.newValue == variables.oldValue
          || request.userInfo.username in {{ $writers | toJson }}
      reason: Forbidden
      messageExpression: >-
        'only the setec frontend and the installer set the label {{ $key }} on a Namespace; ' +
        request.userInfo.username + ' may not change it on ' + object.metadata.name + ' (charts#815)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gibson-sandbox-namespace-label
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  policyName: gibson-sandbox-namespace-label
  validationActions: ["Deny"]
