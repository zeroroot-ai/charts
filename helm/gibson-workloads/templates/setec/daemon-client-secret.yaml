{{/*
Setec client mTLS material, delivered to the DAEMON's namespace (deploy#1106).

THE PROBLEM THIS SOLVES

cert-manager writes a Certificate's Secret into the Certificate's own
namespace, and a namespaced Issuer signs only within its namespace. The setec
frontend lives in setec-system and its serving cert must be there, so the CA
that signs it is there too (templates/setec/frontend-tls.yaml bootstraps
`setec-frontend-ca` from the cluster-scoped selfsigned-bootstrap for exactly
that reason). The daemon lives in the release namespace and can only mount a
Secret from its own. One CA, two namespaces, and no cert-manager primitive
that spans them.

THE THREE WAYS OUT, AND WHY THIS ONE

  (a) Promote the setec CA to a ClusterIssuer. Its signing Secret would have
      to live in cert-manager's --cluster-resource-namespace, which this chart
      does not own and cannot verify, and it re-roots the frontend's existing
      serving cert — a live TLS server that would keep presenting the old
      chain until something restarted it. A cert-rotation hazard for a
      namespace problem.
  (b) trust-manager Bundles. A new cluster-wide dependency for one Secret.
  (c) ESO with the kubernetes provider — this file. Secrets in this repo are
      ESO-only by policy (deploy#255), and the exact pattern is
      already proven in gibson-operators/templates/cross-namespace-eso-rbac.yaml,
      which reads the Zitadel admin PAT out of the zitadel namespace the same
      way. Nothing about the frontend's PKI moves.

WHAT IT COSTS: the mirror refreshes on the ExternalSecret's interval rather
than instantly. The cert is 90d with renewBefore 15d, so a one-hour lag on a
renewal is fifteen days inside the margin.

SCOPE OF THE GRANT: the Role names setec-daemon-client-tls and nothing else,
so the ServiceAccount this store authenticates as cannot read the frontend's
SERVER key (setec-frontend-tls, which is also the CA-bearing Secret) or the
e2e round-trip's credential.

NO argocd sync-wave, deliberately. The source Secret is minted by a
cert-manager Certificate rendered in the same wave as this ExternalSecret, so
pinning the mirror to an earlier wave would order it BEFORE the thing it
mirrors. The race it would be trying to fix is not a deadlock either: a daemon
Pod whose Secret volume does not exist yet stays in ContainerCreating and
kubelet retries the mount until it appears. Compare
external-secrets/missing-secrets.yaml, which does carry a wave — that one
gates a Job that waits on a key and would genuinely deadlock.
*/}}
{{- if .Values.gibson.sandbox.enabled }}
{{- $setecNamespace := include "gibson.setecNamespace" . }}
{{- $readerSA := "gibson-setec-cert-reader" }}
{{- $storeName := "gibson-cross-ns-setec" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $readerSA }}
  namespace: {{ $setecNamespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-cert-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $readerSA }}
  namespace: {{ $setecNamespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-cert-bridge
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - setec-daemon-client-tls
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $readerSA }}
  namespace: {{ $setecNamespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-cert-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $readerSA }}
subjects:
  - kind: ServiceAccount
    name: {{ $readerSA }}
    namespace: {{ $setecNamespace }}
---
# ESO's kubernetes provider talks to the API server as $readerSA, so the
# Role above is the whole of what this store can see. caProvider reads the
# kube-root-ca.crt ConfigMap that every namespace carries.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $storeName }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-cert-bridge
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $setecNamespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Release.Namespace }}
      auth:
        serviceAccount:
          name: {{ $readerSA }}
          namespace: {{ $setecNamespace }}
---
# The mirror. Key names are preserved verbatim (tls.crt / tls.key / ca.crt)
# because the daemon's config points at <mountPath>/<key> and the
# StatefulSet projects the Secret with no subPath — see
# gibson.setecMtlsMountPath.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.setecClientSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: setec-cert-bridge
spec:
  refreshInterval: {{ (.Values.gibson.sandbox.setec).certRefreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.setecClientSecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: setec-daemon-client-tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: setec-daemon-client-tls
        property: tls.key
    # ca.crt is the setec frontend CA. cert-manager writes it into every
    # Secret its CA-backed issuers produce, which is what lets the daemon
    # verify the frontend's server cert from the same Secret it presents
    # its own client cert out of.
    - secretKey: ca.crt
      remoteRef:
        key: setec-daemon-client-tls
        property: ca.crt
{{- end }}
