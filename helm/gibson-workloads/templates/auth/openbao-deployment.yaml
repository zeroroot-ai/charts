apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-openbao
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
  {{- $saAnn := .Values.openbao.serviceAccount.annotations | default dict }}
  {{- if (.Values.externalSecrets).preSyncBringup }}
  {{- /* The cold-bringup wave (see the ConfigMap above), merged with the
         workload-identity annotations so the two conditional blocks cannot
         render a duplicate annotations key. */}}
  {{- $saAnn = merge (dict "argocd.argoproj.io/sync-wave" "-12") $saAnn }}
  {{- end }}
  {{- with $saAnn }}
  # Workload-identity annotations, when the substrate has them. Empty in kind.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# openbao-auto-init RBAC. The sidecar manages one Secret for each consumer,
# the renewable service token of that consumer (deploy#454):
#   gibson-platform-operator-vault — policy platform-operator
#   gibson-tenant-operator-vault   — policy tenant-operator
#   gibson-openbao-iam-admin-escrow, gibson-openbao-jwt-auth-init,
#   gibson-openbao-approle-init, gibson-openbao-approle-reader — the Jobs
# A non-renewable root token in either would cause VaultTransitReady=False,
# because vaulttoken.Renewer calls renew-self and OpenBao rejects it with
# 400 "lease is not renewable".
#
# The unseal-keys Secret and the delete verb that went with it are gone
# (deploy#1731): under the static seal nothing is minted into a Secret, so
# the sidecar needs no delete. The unscoped `create` verb is required because
# POST /secrets does not allow resourceName pinning (Kubernetes RBAC has no
# create + resourceNames).
#
# No verb on Deployments. The sidecar used to roll both operators after a
# re-mint, which needed `patch` on their Deployments, and a patch of a pod
# template can change the image and the ServiceAccount. Reloader rolls each
# operator when its token Secret changes instead (the reload annotation on
# each Deployment).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-openbao-auto-init
  namespace: {{ .Release.Namespace }}
  {{- if (.Values.externalSecrets).preSyncBringup }}
  # Cold-bringup ordering under Argo (deploy#1737). OpenBao is the
  # ONE External Secrets backend and it lives in this chart, so on a cold
  # sync the producer must be Ready before the ClusterSecretStore (-10) and
  # the ExternalSecrets (-8) that the wave graph gates on. Wave -12 puts the
  # whole OpenBao family (this object and its siblings in this file) ahead
  # of them; everything the pod itself needs either sits in this wave or is
  # written by the bringup before the sync (the bringup-keyring Secret).
  # Without this, the store reports InvalidProviderConfig at -10, Argo fails
  # the wave, and the first cold recreate deadlocks (measured, kind
  # 2026-09-02). Helm ignores these annotations and applies in one phase.
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
  {{- end }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames:
      - gibson-platform-operator-vault
      - gibson-tenant-operator-vault
      - gibson-openbao-iam-admin-escrow
      - gibson-openbao-jwt-auth-init
      {{- if $cmVault }}
      - gibson-openbao-approle-init
      - gibson-openbao-approle-reader
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-openbao-auto-init
  namespace: {{ .Release.Namespace }}
  {{- if (.Values.externalSecrets).preSyncBringup }}
  # Cold-bringup ordering under Argo (deploy#1737). OpenBao is the
  # ONE External Secrets backend and it lives in this chart, so on a cold
  # sync the producer must be Ready before the ClusterSecretStore (-10) and
  # the ExternalSecrets (-8) that the wave graph gates on. Wave -12 puts the
  # whole OpenBao family (this object and its siblings in this file) ahead
  # of them; everything the pod itself needs either sits in this wave or is
  # written by the bringup before the sync (the bringup-keyring Secret).
  # Without this, the store reports InvalidProviderConfig at -10, Argo fails
  # the wave, and the first cold recreate deadlocks (measured, kind
  # 2026-09-02). Helm ignores these annotations and applies in one phase.
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
  {{- end }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-openbao-auto-init
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-openbao
    namespace: {{ .Release.Namespace }}
---
# deploy#1627 / deploy#1732: OpenBao's kubernetes auth method validates a
# presented ServiceAccount token by calling TokenReview, and it does so as ITS
# OWN ServiceAccount. Without system:auth-delegator every login fails with a
# 403 from the apiserver: for ESO that surfaces as a SecretSyncedError that
# looks like a secrets problem, and for the sidecar's own openbao-seeder role
# it means the store has no path back in once root is revoked. Bound on
# every profile: OpenBao is the one ESO backend on every substrate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-openbao-auth-delegator
  {{- if (.Values.externalSecrets).preSyncBringup }}
  # Cold-bringup ordering under Argo (deploy#1737). OpenBao is the
  # ONE External Secrets backend and it lives in this chart, so on a cold
  # sync the producer must be Ready before the ClusterSecretStore (-10) and
  # the ExternalSecrets (-8) that the wave graph gates on. Wave -12 puts the
  # whole OpenBao family (this object and its siblings in this file) ahead
  # of them; everything the pod itself needs either sits in this wave or is
  # written by the bringup before the sync (the bringup-keyring Secret).
  # Without this, the store reports InvalidProviderConfig at -10, Argo fails
  # the wave, and the first cold recreate deadlocks (measured, kind
  # 2026-09-02). Helm ignores these annotations and applies in one phase.
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
  {{- end }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-openbao
    namespace: {{ .Release.Namespace }}
