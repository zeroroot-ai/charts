{{- /* Stripe credentials — ESO-managed (deploy / PRD deploy#255 / deploy#272, #288).

Materialises the `gibson-stripe-credentials` Secret in the gibson namespace
with keys STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET. Consumed by:

  - dashboard Deployment env (STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET
    secretKeyRef, see templates/dashboard/deployment.yaml)
  - dashboard Deployment wait-for-stripe-secrets init container, which
    blocks pod start until both keys are non-empty in this Secret

Sourced from OpenBao through the one `gibson-secrets` ClusterSecretStore on
every profile. The openbao-auto-init sidecar seeds the key
`gibson-stripe-credentials` with test-mode placeholders, and an operator
replaces them with `scripts/vanilla-set-secret.sh`.

The earlier "create it once by hand via kubectl create secret" workaround
(documented in values-kind.yaml prior to this slice) was the silent-
degradation pattern deploy rules out: it left every dashboard
rollout stuck in Init:Error 60s after the wait-for-stripe-secrets init
container started polling. deploy#272 + deploy#288 track that.

Per deploy, inline `kind: Secret` `data:` / `stringData:` blocks
in chart templates are forbidden outside the kind-bootstrap backing-store
fixture — kind dev gets stub values via that fixture (key names
`dashboard_stripe_secret_key`, `dashboard_stripe_webhook_secret`).

Skip entirely if `.Values.secrets.stripe.existingSecret` is set —
operator-owned Secret takes precedence (e.g. customer-deployed
environments wiring their own Stripe Secret out-of-band). */ -}}
{{- if not .Values.secrets.stripe.existingSecret -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.stripeSecrets.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.stripeSecrets.name" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        STRIPE_SECRET_KEY: "{{ `{{ .dashboard_stripe_secret_key }}` }}"
        STRIPE_WEBHOOK_SECRET: "{{ `{{ .dashboard_stripe_webhook_secret }}` }}"
        # Publishable key (pk_test_/pk_live_): NOT secret, but per-env (test vs
        # live mode) so it must be runtime-injected — the signup page server
        # component reads it and passes it to the inline Payment Element. The
        # shared :main image can't bake a build-time NEXT_PUBLIC key (dashboard#783).
        STRIPE_PUBLISHABLE_KEY: "{{ `{{ .dashboard_stripe_publishable_key }}` }}"
  data:
    - secretKey: dashboard_stripe_secret_key
      remoteRef: { key: gibson-stripe-credentials, property: secret_key }
    - secretKey: dashboard_stripe_webhook_secret
      remoteRef: { key: gibson-stripe-credentials, property: webhook_secret }
    - secretKey: dashboard_stripe_publishable_key
      remoteRef: { key: gibson-stripe-credentials, property: publishable_key }
{{- end }}
