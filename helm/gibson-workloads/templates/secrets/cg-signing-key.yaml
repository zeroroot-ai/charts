{{/*
Capability-Grant JWT signing key — ESO-managed (deploy / PRD
deploy#255).

GHSA-3957. Without this Secret the daemon derives its CG signing key from the
master KEK (internal/platform/capabilitygrant/mint.go). That key cannot be
rotated without rotating the KEK itself, which re-keys every tenant secret in
the platform — so in practice it is never rotated, and a single key signs every
Capability-Grant JWT for the life of the install. gibson#1288 added a dedicated
mount so the CG key has its own lifecycle; this template is what fills it.

Materialises `gibson-cg-signing-key` with the file layout
LoadSigningKeySetFromDir expects at /etc/gibson/cg-signing-key:

  - current.kid    the kid minted tokens are stamped with      (required)
  - current.key    its ed25519 seed, 32 bytes                  (required)
  - previous.kid   the kid still accepted for verification     (rotation only)
  - previous.key   its ed25519 seed                            (rotation only)

The seed is accepted raw, base64 (std / raw-std / raw-URL) or hex, and must
decode to exactly 32 bytes. Terraform seeds 32 random ASCII characters, which
the loader takes raw.

THE PREVIOUS SLOT IS NOT PROJECTED IN STEADY STATE, and that is deliberate.
The daemon's loader treats a `previous.kid` file that exists but is EMPTY as a
broken mount, not an absent one — readMountedString returns "previous.kid is
empty", which is not os.ErrNotExist, so the Minter constructor errors and the
whole capability-grant subsystem is disabled (register endpoint and key
endpoint both gone). The ext-authz grant-key Secret next door CAN project empty
previous.* because its Go loader tolerates them; this one cannot. Projecting
the pair only while a rotation window is open is what keeps a steady-state
install from tripping that.

Rotation (docs/runbooks/cg-signing-key-rotation.md):
  1. copy current.{kid,key} to gibson-cg-signing-key-previous in the backend
  2. write a NEW kid + seed to gibson-cg-signing-key
  3. set gibson.cgSigningKey.rotationWindow: true and roll out
  4. once every outstanding grant has expired, clear the flag and the backend
     previous entry
The kid and the seed live in the SAME backend secret so ESO swaps them
atomically — a kid that refreshes independently of its key material is a
verification outage with a confusing signature.

FALLBACK IS NON-FATAL, BY DESIGN. The volume in the daemon StatefulSet is
`optional: true`, so an install whose backend has no such secret yet mounts an
empty dir; `current.kid` is then os.ErrNotExist, the loader returns
ErrSigningKeyNotProvisioned, and the Minter falls back to the KEK derivation
and logs a warning naming GIBSON_CGJWT_SIGNING_KEY_DIR. An upgrade that gets
the chart before the secret degrades to the old behaviour instead of breaking
capability grants.

Sourced from OpenBao through the one `gibson-secrets` ClusterSecretStore on
every profile. The openbao-auto-init sidecar seeds the key
`gibson-cg-signing-key` from the seed table.

Related: templates/gibson/statefulset.yaml mounts this at
/etc/gibson/cg-signing-key and sets GIBSON_CGJWT_SIGNING_KEY_DIR.
*/}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
{{- $cg := .Values.gibson.cgSigningKey | default dict }}
{{- $rotating := eq ($cg.rotationWindow | toString) "true" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.cgSigningKeySecret.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.cgSigningKeySecret.name" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        current.kid: "{{ `{{ .current_kid }}` }}"
        current.key: "{{ `{{ .current_key }}` }}"
        {{- if $rotating }}
        # Rotation window OPEN (gibson.cgSigningKey.rotationWindow). Both files
        # must carry real values — an empty previous.kid disables capability
        # grants outright, it does not degrade.
        previous.kid: "{{ `{{ .previous_kid }}` }}"
        previous.key: "{{ `{{ .previous_key }}` }}"
        {{- end }}
  data:
    - secretKey: current_kid
      remoteRef: { key: gibson-cg-signing-key, property: kid }
    - secretKey: current_key
      remoteRef: { key: gibson-cg-signing-key, property: key }
    {{- if $rotating }}
    - secretKey: previous_kid
      remoteRef: { key: gibson-cg-signing-key-previous, property: kid }
    - secretKey: previous_key
      remoteRef: { key: gibson-cg-signing-key-previous, property: key }
    {{- end }}
