{{- /* The relay credential of the one mail transport (hosted#223).

With global.email.provider smtp and global.email.smtp.credentials.source
secretStore, this ExternalSecret writes <release>-email-smtp, keys username
and password, from the secret store key credentials.remoteKey (properties
username and password; staging and prod use ses-smtp-credentials, seeded by
openbao-auto-init from the keyring, ADR-0014). The daemon, the
tenant-operator and Zitadel read that one Secret. With source secret the
operator creates the Secret, and with source none the relay takes no
credential, so nothing renders here. */ -}}
{{- $mail := include "gibson.email" . | fromJson }}
{{- if and (eq $mail.provider "smtp") (eq $mail.credentialsSource "secretStore") }}
{{- $store := .Values.externalSecrets.clusterSecretStore.name | default "gibson-secrets" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $mail.credentialsSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ $mail.credentialsSecret }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef: { key: {{ $mail.remoteKey }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ $mail.remoteKey }}, property: password }
{{- end }}
