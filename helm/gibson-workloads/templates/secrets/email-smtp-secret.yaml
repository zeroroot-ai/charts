{{- /* Daemon SMTP credentials — ESO-managed (deploy / PRD deploy#255).

Materialises GIBSON_SMTP_USERNAME / GIBSON_SMTP_PASSWORD for the daemon's
delivering mail transport (gibson.email.provider=smtp), sourced from ONE
backend secret carrying both a username and a password property — the
natural shape of an IAM-style SMTP credential pair (staging/prod point this
at the platform's existing `ses-smtp-credentials` AWS Secrets Manager
secret; see secret-contract.yaml and eks/<workspace>/modules/ses). Not SES-specific:
any provider whose credentials are seeded that way fits.

Required for self-serve signup (gibson#1228 companion, deploy
signup-email-delivery): gibson.signupSelfServe defaults true, and the
daemon's mailer.RequireDelivering gate refuses to start without a
delivering transport. This is credentials path B — see gibson.email.smtp in
values.yaml for path A (inline username + a Secret holding just the
password), used where the operator does not want ExternalSecret machinery.

Gated on gibson.email.smtp.externalSecret.enabled (default false — path A
plain values are the default; kind uses neither, it points at mailpit with
no auth). */ -}}
{{- if and .Values.gibson.email.smtp.externalSecret.enabled (eq (((.Values.gibson).email).provider | default "log") "smtp") -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $es := .Values.gibson.email.smtp.externalSecret }}
{{- $refresh := $es.refreshInterval | default "60s" }}
{{- $remoteKey := $es.remoteKey | default "ses-smtp-credentials" }}
{{- $userProp := $es.usernameProperty | default "username" }}
{{- $passProp := $es.passwordProperty | default "password" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.emailSmtpSecret.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.emailSmtpSecret.name" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ `{{ .username }}` }}"
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef: { key: {{ $remoteKey }}, property: {{ $userProp }} }
    - secretKey: password
      remoteRef: { key: {{ $remoteKey }}, property: {{ $passProp }} }
{{- end }}
