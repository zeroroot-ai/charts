{{- /* Billing-webhook shared secret — ESO-managed (deploy / PRD deploy#255, deploy#1314).

Materialises the `gibson-billing-webhook-secret` Secret in the gibson namespace
with the single key GIBSON_BILLING_WEBHOOK_SECRET.

Consumed by:
  - the gibson daemon StatefulSet (GIBSON_BILLING_WEBHOOK_SECRET env,
    templates/gibson/statefulset.yaml) — the daemon authenticates every
    TenantProvisioningService.SetTenantBillingActive call against this HMAC
    secret and FAILS CLOSED when it is empty (internal/server/daemon/api/
    billing_webhook_auth.go), so with no secret the billing-active column can
    never leave DEFAULT FALSE and paid signups queue forever at status='pending'
    in any entitlements-required environment (deploy#1314);
  - once dashboard#1016 decides the caller, that workload reads the SAME value
    and signs the assertion with it.

Sourced from OpenBao through the one `gibson-secrets` ClusterSecretStore on
every profile. The openbao-auto-init sidecar generates the value
once and keeps it. It is internal platform material, never operator-seeded.

Structural like the Stripe Secret: one shape, no enable toggle. Skip entirely
if `.Values.secrets.billingWebhook.existingSecret` is set — an operator-owned
Secret takes precedence (e.g. an install wiring its own shared secret
out-of-band). Per deploy, inline `kind: Secret` data blocks are
forbidden outside the kind-bootstrap backing-store fixture. */ -}}
{{- if not .Values.secrets.billingWebhook.existingSecret -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.billingWebhookSecret.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.billingWebhookSecret.name" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        GIBSON_BILLING_WEBHOOK_SECRET: "{{ `{{ .billing_webhook_secret }}` }}"
  data:
    - secretKey: billing_webhook_secret
      remoteRef: { key: gibson-billing-webhook-secret, property: secret }
{{- end }}
