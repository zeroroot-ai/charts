{{- /* LLM API keys — ESO-managed (deploy / PRD deploy#255).

Materialises ANTHROPIC_API_KEY / OPENAI_API_KEY / GOOGLE_API_KEY env vars
consumed by the daemon's LLM client. Sourced from OpenBao through the one
`gibson-secrets` ClusterSecretStore on every profile. The key
`gibson-llm-keys` is seeded from the bringup keyring member LLM_KEYS_JSON.

The earlier inline-Secret fallback (toggled via
`.Values.secrets.llm.externalSecret.enabled: false`) was deleted in this
slice deploy forbids inline `kind: Secret` `data:` / `stringData:`
blocks in chart templates outside the kind-bootstrap backing-store fixture.

Skip entirely if `.Values.secrets.llm.existingSecret` is set — operator-owned
Secret takes precedence (e.g. customer-deployed environments wiring their
own LLM-key Secret out-of-band). */ -}}
{{- if not .Values.secrets.llm.existingSecret -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.llmSecrets.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.llmSecrets.name" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        ANTHROPIC_API_KEY: "{{ `{{ .anthropic_api_key }}` }}"
        OPENAI_API_KEY: "{{ `{{ .openai_api_key }}` }}"
        GOOGLE_API_KEY: "{{ `{{ .google_api_key }}` }}"
  data:
    - secretKey: anthropic_api_key
      remoteRef: { key: gibson-llm-keys, property: anthropic_api_key }
    - secretKey: openai_api_key
      remoteRef: { key: gibson-llm-keys, property: openai_api_key }
    - secretKey: google_api_key
      remoteRef: { key: gibson-llm-keys, property: google_api_key }
{{- end }}
