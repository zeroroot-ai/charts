{{- /*
gibson-openbao-keys — VAULT_ADMIN_TOKEN consumed by the tenant-operator at
pod start to dial Vault for data-plane KEK derivation, per-tenant master
key generation, and transit encrypt/decrypt of per-tenant secret material.

ESO-managed (deploy / PRD deploy#255). Sourced from key
`gibson-vault-admin-token`, property `token`, in the platform's OpenBao. The earlier inline-Secret
fallback (toggled via `.Values.secrets.vaultKeys.externalSecret.enabled:
false`) was deleted in this slice deploy forbids inline `kind:
Secret` `data:` / `stringData:` blocks in chart templates outside the
kind-bootstrap backing-store fixture.

On every profile the openbao-auto-init sidecar seeds `gibson-vault-admin-token`
in the platform's OpenBao with the platform service token it mints (policy
platform-admin, never root) and keeps it current across a re-mint
(deploy#1732). There is no literal root token on any profile.

Skip entirely if `.Values.secrets.vaultKeys.existingSecret` is set —
operator-owned Secret takes precedence.

Spec: D1-A of polyrepo zero-dot-x reset (deploy#244 / PRD .github#25).
*/ -}}
{{- if not .Values.secrets.vaultKeys.existingSecret -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gibson-openbao-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: gibson-openbao-keys
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        VAULT_ADMIN_TOKEN: "{{ `{{ .vault_admin_token }}` }}"
  data:
    - secretKey: vault_admin_token
      remoteRef: { key: gibson-vault-admin-token, property: token }
{{- end }}
