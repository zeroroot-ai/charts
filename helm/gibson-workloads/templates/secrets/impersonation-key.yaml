{{- /* Impersonation signing key — ESO-managed (deploy / PRD
deploy#255). Materialises a Secret with a single key
`GIBSON_IMPERSONATION_KEY` consumed by the daemon's impersonation token
issuer (`internal/impersonation/issuer.go`).

The daemon fails to start when the env is missing — there is no
random-key fallback. Before this template existed the daemon minted a
fresh in-process key on every restart, invalidating every previously-
issued token and silently diverging across HA replicas (gibson#103).

Sourced from OpenBao through the one `gibson-secrets` ClusterSecretStore
on every profile. The openbao-auto-init sidecar seeds the key
`gibson-impersonation-key` from the seed table.

The key MUST be at least 32 bytes (HS256 minimum per RFC 7518 §3.2);
the daemon enforces the same minimum at startup. */ -}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.impersonationSecret.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.impersonationSecret.name" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        GIBSON_IMPERSONATION_KEY: "{{ `{{ .impersonation_key }}` }}"
        # Previous-key slot for zero-downtime rotation. Empty in steady
        # state; populated during rotation so Verify accepts tokens signed
        # under the prior current key until they expire naturally (≤ 1h).
        # Operators clear this slot once maxTTL has elapsed.
        GIBSON_IMPERSONATION_KEY_PREVIOUS: "{{ `{{ .impersonation_key_previous }}` }}"
  data:
    - secretKey: impersonation_key
      remoteRef: { key: gibson-impersonation-key, property: value }
    - secretKey: impersonation_key_previous
      remoteRef: { key: gibson-impersonation-key-previous, property: value }
