{{/* Envoy HorizontalPodAutoscaler (Week 2 §3 R10).
     Envoy is required infrastructure — deploy#200. The HPA still gates on
     autoscaling.enabled (an HPA without autoscaling is meaningless). */}}
{{- if (default false ((.Values.envoy.autoscaling).enabled)) }}
{{- $hpa := .Values.envoy.autoscaling }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-envoy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-envoy
  minReplicas: {{ $hpa.minReplicas | default 3 }}
  maxReplicas: {{ $hpa.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilization | default 70 }}
{{- end }}
