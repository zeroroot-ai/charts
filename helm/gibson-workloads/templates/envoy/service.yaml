{{/*
Envoy Service.

Sole external surface for the platform. Single TLS port (443) carries the
api/app.<domain> hosts via SNI dispatch in the listener filter chain (the
auth.<domain> host was retired in the single-host consolidation — docs./
apex are served as virtual hosts on the app. chain; www is off-cluster).

Defaults to NodePort so the Kind dev cluster's extra-port-mappings (created
by `make kind-create`) can route external 443 → NodePort 30443. Flip to
LoadBalancer in production overlays (values-saas.yaml / values-production.yaml).

Spec: zitadel-envoy-gateway-migration, task 10.

Envoy is required infrastructure (deploy#200); this Service renders
unconditionally — there is no `envoy.enabled` opt-out.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: gibson-envoy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
  {{- /* external-dns hostname annotation is config-derived (deploy#683):
         on a LoadBalancer Service (prod) emit the apex/app/docs/api host list
         from gibson.externalDnsHosts. Overlay-set annotations win on conflict
         (override hatch). The retired auth. host is no longer published. */}}
  {{- $ann := .Values.envoy.service.annotations | default dict }}
  {{- /* One record per host, exactly one edge: every public
         hostname the chart claims resolves to THIS Service. */}}
  {{- if eq (.Values.envoy.service.type | default "NodePort") "LoadBalancer" }}
  {{- $ann = merge (deepCopy $ann) (dict "external-dns.alpha.kubernetes.io/hostname" (include "gibson.externalDnsHosts" .)) }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.envoy.service.type | default "NodePort" }}
  # Client-IP contract. Local stops kube-proxy from SNATing the
  # client address on the NodePort / passthrough-LB path (kind, k3d, k3s, a plain
  # cluster), so Envoy's socket peer is the client. On AWS with nlb-target-type=ip
  # the controller dials pod IPs directly and ignores this field; there the
  # contract is met by preserve_client_ip.enabled=true on the target group.
  # Structural, not an overlay knob: an edge that cannot see its clients has
  # no per-client limit and no WAF worth the name.
  externalTrafficPolicy: Local
  # No pinned ClusterIP (charts#163, ADR-0092). An in-cluster caller reaches
  # Envoy by the Service name, or by api.<domain> through the CoreDNS record
  # that each bringup writes (scripts/baseline-up.sh). The render fails when
  # a values file sets envoy.service.clusterIP.
  {{- include "gibson.assertKeysDeleted" (dict "ctx" . "keys" (list "envoy.service.clusterIP" "dashboard.envoy.service.clusterIP" "envoy.internalChain") "use" "the Envoy Service name, or api.<domain> through the CoreDNS record of the bringup (ADR-0092, charts#163)") }}
  selector:
    {{- include "gibson.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
  ports:
    - name: https
      # Same port number on ClusterIP and NodePort, so pods inside the
      # cluster and the browser outside can both use ":30443" — making the
      # OIDC issuer URL (which is host:port-derived) identical from both
      # sides and removing the issuer-mismatch class of bug.
      port: {{ .Values.envoy.service.httpsPort | default 443 }}
      targetPort: https
      protocol: TCP
      {{- if and (eq (.Values.envoy.service.type | default "NodePort") "NodePort") .Values.envoy.service.nodePort }}
      nodePort: {{ .Values.envoy.service.nodePort }}
      {{- end }}
