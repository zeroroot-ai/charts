{{- /*
Envoy ServiceAccount.

Envoy holds the highest-trust SVID in the platform: `platform/envoy` is in
`.Values.spiffe.callbackPeerSVIDs`, so the daemon accepts identity headers
from any peer presenting it. Until this template existed the Envoy pod ran
under the namespace `default` ServiceAccount, which it shared with docs-svc,
grafana, jaeger, loki, redis-stack, stripe-mock and the reachability helm
test. A `k8s:sa:` workload selector on the Envoy ClusterSPIFFEID would
therefore have degraded to `k8s:sa:default` and matched all of them.

This SA exists solely to be a SPIRE attestation attribute and a
ValidatingAdmissionPolicy key (see spire-server/platform-identity-admission.yaml).
Envoy never talks to the Kubernetes API — its bootstrap comes from a
ConfigMap, its edge cert from a mounted Secret, and its SPIFFE material from
the Workload API socket — so the projected token is not mounted.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gibson.envoyServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
  {{- with .Values.envoy.serviceAccount.annotations }}
  annotations:
    {{- include "gibson.irsaAnnotations" . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
