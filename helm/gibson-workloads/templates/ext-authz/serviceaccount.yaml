{{- /* ext-authz is structural infrastructure (deploy#188) — the
       extAuthz.enabled toggle was deleted; this template renders whenever
       its own serviceAccount.create sub-feature toggle is true. */}}
{{- if .Values.extAuthz.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.extAuthz.serviceAccount.name | default "gibson-ext-authz" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: ext-authz
  {{- with .Values.extAuthz.serviceAccount.annotations }}
  annotations:
    {{- include "gibson.irsaAnnotations" . | nindent 4 }}
  {{- end }}
{{- end }}
