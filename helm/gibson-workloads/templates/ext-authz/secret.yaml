{{/*
ext-authz Capability Grant ES256 signing key — ESO-managed
(deploy / PRD deploy#255 / slice S4, deploy#260).

Materialises `gibson-extauthz-grant-key` with four keys consumed by the
ext_authz pod to sign Capability Grant JWTs (per design §"Capability
Grant JWT"). ext-authz publishes no key document of its own: since
verifiers resolve the corresponding public material per-kid from the daemon
(GET /capabilitygrant/v1/keys/{kid}), and gibson#1306 retired the JWKS-wide
document.

  - current.pem   PEM-encoded EC P-256 private key (active signer)
  - current.kid   16-char key id for the active signer
  - previous.pem  prior signer (empty when no rotation has happened)
  - previous.kid  prior signer's kid (empty when no rotation has happened)

The daemon never holds a copy. Rotation is an operator action: generate a
new EC P-256 key, move `current.*` into `previous.*` in OpenBao, the one
backing store on every profile, and write the new key as
`current.*`. ESO syncs within refreshInterval; ext-authz
re-reads the mounted material; both current and previous kids resolve via the
daemon's per-kid endpoint so in-flight grants validate during the rotation
window.

The earlier in-chart `lookup`-then-`genPrivateKey "ecdsa"` /
`randAlphaNum 16` idiom was deleted in this slice. The pattern was broken
under Argo's offline `helm template` render the same way every other
`lookup`-then-keep pattern was — every reconcile re-minted a fresh EC key
and ServerSideApply rewrote the Secret, silently invalidating every
outstanding Capability Grant and forcing full agent re-issuance.
deploy codifies the rule.

ext-authz is structural infrastructure (deploy#188) — renders
unconditionally; the `extAuthz.enabled` toggle is gone.

Related: `templates/ext-authz/deployment.yaml` mounts the Secret at
`/etc/ext-authz/grant-key/`.
*/}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gibson-extauthz-grant-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: ext-authz
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: gibson-extauthz-grant-key
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        current.pem: "{{ `{{ .current_pem }}` }}"
        current.kid: "{{ `{{ .current_kid }}` }}"
        previous.pem: "{{ `{{ .previous_pem }}` }}"
        previous.kid: "{{ `{{ .previous_kid }}` }}"
  data:
    - secretKey: current_pem
      remoteRef: { key: gibson-extauthz-grant-current, property: pem }
    - secretKey: current_kid
      remoteRef: { key: gibson-extauthz-grant-current, property: kid }
    - secretKey: previous_pem
      remoteRef: { key: gibson-extauthz-grant-previous, property: pem }
    - secretKey: previous_kid
      remoteRef: { key: gibson-extauthz-grant-previous, property: kid }
