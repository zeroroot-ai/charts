{{/*
helm-test pod: bootstrap-configmaps

Asserts every ConfigMap that PlatformBootstrap consumers depend on exists
and carries non-empty values on its documented keys.

ConfigMaps checked:

  gibson-fga-config       keys: store_id, model_id — written by fga-init.
                          ext-authz / daemon / tenant-operator block on this.
                          The single most operationally-fragile bootstrap step
                          (image pull race + Job retry loop), so it gets its
                          own assertion.

  gibson-extauthz-rpc-registry
                          key: registry.json — generated by `make authz-registry`
                          in gibson; ext-authz reads it at boot.

Reuses the RBAC from 02-bootstrap-secrets.yaml (test SA already has CM
get/list).

Provenance: deploy#355 (slice 5.10 of production-readiness epic).
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gibson.fullname" . }}-test-bootstrap-configmaps"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson-workloads.tests.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    {{- include "gibson-workloads.tests.annotations" . | nindent 4 }}
    "helm.sh/hook-weight": "1"
spec:
  restartPolicy: Never
  serviceAccountName: "{{ include "gibson.fullname" . }}-test-bootstrap-reader"
  containers:
    - name: probe
      image: "{{ include "gibson-workloads.tests.kubectlImage" . }}"
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='{{ include "gibson-workloads.tests.errorPrefix" . }}'
          NS='{{ .Release.Namespace }}'

          # cm_has_key NS NAME KEY [MIN_LEN]
          # Asserts the ConfigMap exists and the named key holds a non-empty
          # value. Optional MIN_LEN bounds: fail if the value is suspiciously
          # short (e.g. an empty store_id).
          cm_has_key() {
            local ns="$1" name="$2" key="$3" min_len="${4:-1}"
            if ! kubectl -n "$ns" get configmap "$name" >/dev/null 2>&1 ; then
              echo "$ERR ConfigMap missing: $ns/$name"
              return 1
            fi
            val=$(kubectl -n "$ns" get configmap "$name" -o "jsonpath={.data.${key}}" 2>/dev/null || echo "")
            if [ -z "$val" ]; then
              echo "$ERR ConfigMap $ns/$name has no value for key '$key'"
              return 1
            fi
            actual_len=$(printf '%s' "$val" | wc -c | tr -d ' ')
            if [ "$actual_len" -lt "$min_len" ]; then
              echo "$ERR ConfigMap $ns/$name key '$key' too short ($actual_len < $min_len)"
              return 1
            fi
            echo "[bootstrap-cm] OK $ns/$name key=$key (len=$actual_len)"
          }

          # --- structural ConfigMaps ------------------------------------

          # OpenFGA store_id + model_id (fga-init Job writes these post-sync).
          # A 26-char ULID is OpenFGA's store_id format; require at least 20
          # to reject empty/sentinel values.
          cm_has_key "$NS" "gibson-fga-config" "store_id" 20
          cm_has_key "$NS" "gibson-fga-config" "model_id" 20

          # FGA authorization model, PUBLISHED AT RUNTIME by fga-init from the
          # daemon image (`gibson dump-fga-model`), not chart-shipped any more.
          # The platform-operator loads the model from this ConfigMap, so an
          # absent or truncated one leaves its FGAModelLoaded condition False.
          # Require >=512 bytes (a real model is tens of KB).
          {{- $modelCM := (.Values.tests.bootstrap).fgaModelConfigMap | default (printf "%s-fga-model" (include "gibson.fullname" .)) -}}
          {{- $modelKey := (.Values.tests.bootstrap).fgaModelKey | default "model.json" -}}
          cm_has_key "$NS" '{{ $modelCM }}' '{{ $modelKey }}' 512

          # ext-authz RPC registry (generated by `make authz-registry` in gibson;
          # ext-authz reads it at boot to translate RPC method -> FGA relation).
          cm_has_key "$NS" "gibson-extauthz-rpc-registry" "registry.json" 256

          # Reserved-names ConfigMap (denies tenant slugs like "admin",
          # "platform", "api"). Owned by gibson chart.
          cm_has_key "$NS" "gibson-reserved-names" "names.txt" 8

          # SA → identity map (auth/sa-identity-map.yaml). Used by ext-authz
          # to translate ServiceAccount to caller-identity.
          cm_has_key "$NS" "gibson-sa-identity-map" "map.yaml" 8

          echo ""
          echo "[bootstrap-cm] all structural ConfigMaps present and populated"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
