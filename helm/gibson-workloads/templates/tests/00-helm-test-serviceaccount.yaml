{{- /*
ServiceAccount for the SVID-fetching helm test.

It is a regular chart resource, not a hook, because the ClusterSPIFFEID that
names it (spire-server/clusterspiffeids.yaml, `gibson-platform-helm-test`) is
also a regular resource: SPIRE must be able to resolve the identity whenever
`helm test` is run, not only during one hook window.

The test asserts that SPIRE issues an SVID to a correctly-attested pod. It
does not need — and must not have — any privilege to do that, so this SA is
bound to nothing and mounts no token. `platform/helm-test` is absent from
`spiffe.callbackPeerSVIDs` and `spiffe.allowedPeerIDs`, so the SVID it
receives opens no door.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gibson.helmTestServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
automountServiceAccountToken: false
