{{/*
helm-test pod: bootstrap-secrets

Asserts every Secret that PlatformBootstrap depends on (and that the
platform-operator either mints OR expects from ESO) exists in the release
namespace AND carries non-empty values on its documented keys.

Secrets checked (canonical names from the gibson chart + ESO model):

  gibson-openbao-keys              key: token, OPENBAO_ADMIN_TOKEN — wired from
                                 openbao-keys template; the platform-operator
                                 mints master-kek + transit using this token.

  gibson-fga-config              keys: store_id, model_id — populated by the
                                 fga-init Job; ext-authz / daemon /
                                 tenant-operator block on this configmap.
                                 NOTE: this is a ConfigMap, asserted in the
                                 sibling 03-bootstrap-configmaps.yaml.

  gibson-master-key              key: master_key — minted by platform-operator
                                 during PlatformBootstrap reconcile; tenant
                                 secrets derive from this.

  gibson-dashboard-oidc          keys: client_id, client_secret — minted by the
                                 OIDCClient reconcile inside the operator.

  gibson-zitadel-dashboard       MACHINE_USER PAT for dashboard S2S; minted by
                                 platform-operator zitadel.serviceUsers loop.

  external-secrets-backend/*     ESO kubernetes-provider source-of-truth namespace
                                 in dev: per-credential individual Secrets (deploy#567
                                 S4); in prod ESO reads AWS Secrets Manager.

Each absent or empty-keyed Secret prints `::error file=helm-test::` and exits 1.

Permission model: the test pod runs as the chart's per-release SA which
has the namespaced Role gibson-workloads bound (templates/gibson/role.yaml).
That Role grants Secret get/list/watch. The previous tenant-reader
ClusterRole was deleted by S12 (gibson#202): the daemon no
longer enumerates Tenant CRDs so the broader Cluster-scope grant is gone.

Provenance: deploy#355 (slice 5.10 of production-readiness epic).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "gibson.fullname" . }}-test-bootstrap-reader"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson-workloads.tests.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "gibson.fullname" . }}-test-bootstrap-reader"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson-workloads.tests.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-10"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "gibson.fullname" . }}-test-bootstrap-reader"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson-workloads.tests.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "gibson.fullname" . }}-test-bootstrap-reader"
subjects:
  - kind: ServiceAccount
    name: "{{ include "gibson.fullname" . }}-test-bootstrap-reader"
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gibson.fullname" . }}-test-bootstrap-secrets"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson-workloads.tests.labels" . | nindent 4 }}
  annotations:
    {{- include "gibson-workloads.tests.annotations" . | nindent 4 }}
    "helm.sh/hook-weight": "0"
spec:
  restartPolicy: Never
  serviceAccountName: "{{ include "gibson.fullname" . }}-test-bootstrap-reader"
  containers:
    - name: probe
      image: "{{ include "gibson-workloads.tests.kubectlImage" . }}"
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='{{ include "gibson-workloads.tests.errorPrefix" . }}'
          NS='{{ .Release.Namespace }}'

          # secret_has_key NAMESPACE NAME KEY
          # Returns 0 if the secret exists, the key is set, and the
          # decoded value is non-empty. Logs a clear `::error::` line and
          # returns 1 on any failure.
          secret_has_key() {
            local ns="$1" name="$2" key="$3"
            if ! kubectl -n "$ns" get secret "$name" >/dev/null 2>&1 ; then
              echo "$ERR Secret missing: $ns/$name"
              return 1
            fi
            # kubectl -o jsonpath strips quotes; base64 -d on an absent key
            # would still exit 0 with empty output, so we use a templated
            # jsonpath that prints "MISSING" when the key isn't present.
            val=$(kubectl -n "$ns" get secret "$name" -o "jsonpath={.data.${key}}" 2>/dev/null || echo "")
            if [ -z "$val" ]; then
              echo "$ERR Secret $ns/$name has no value for key '$key'"
              return 1
            fi
            decoded=$(printf '%s' "$val" | base64 -d 2>/dev/null || echo "")
            if [ -z "$decoded" ]; then
              echo "$ERR Secret $ns/$name key '$key' decoded to empty string"
              return 1
            fi
            echo "[bootstrap-secrets] OK $ns/$name key=$key (len=$(printf '%s' "$decoded" | wc -c))"
          }

          # --- structural Secrets (always expected in every overlay) ----

          secret_has_key "$NS" "gibson-openbao-keys"     "OPENBAO_ADMIN_TOKEN"

          # Master-KEK Secret is platform-operator-owned. The chart names it via
          # tests.bootstrap.masterKeySecret; defaults to gibson-master-key
          # which matches the gibson-operators chart's default
          # platformBootstrap.masterKey.secretName. Overlays that rename
          # the Secret should set .tests.bootstrap.masterKeySecret too.
          MASTER_KEY_SECRET='{{ (.Values.tests.bootstrap).masterKeySecret | default "gibson-master-key" }}'
          secret_has_key "$NS" "$MASTER_KEY_SECRET" "master-kek-id"

          # Dashboard OIDC Secret materialized by the OIDCClient reconcile.
          secret_has_key "$NS" "gibson-dashboard-oidc" "client_id"
          secret_has_key "$NS" "gibson-dashboard-oidc" "client_secret"

          # Zitadel admin PAT — Secret referenced by PlatformBootstrap.zitadel.adminTokenRef.
          # Default name `iam-admin-pat` matches the gibson-operators default;
          # overlays can override via .tests.bootstrap.zitadelAdminPatSecret.
          ADMIN_PAT_SECRET='{{ (.Values.tests.bootstrap).zitadelAdminPatSecret | default "iam-admin-pat" }}'
          ADMIN_PAT_KEY='{{ (.Values.tests.bootstrap).zitadelAdminPatKey | default "pat" }}'
          secret_has_key "$NS" "$ADMIN_PAT_SECRET" "$ADMIN_PAT_KEY"

          # Dashboard MACHINE_USER PAT.
          # Default `gibson-zitadel-dashboard` matches gibson-operators
          # values; overlays may override via .tests.bootstrap.dashboardPatSecret.
          DASH_PAT_SECRET='{{ (.Values.tests.bootstrap).dashboardPatSecret | default "gibson-zitadel-dashboard" }}'
          DASH_PAT_KEY='{{ (.Values.tests.bootstrap).dashboardPatKey | default "pat" }}'
          # If the dashboard PAT Secret doesn't exist (overlay without
          # serviceUsers), skip with a SKIPPED log line rather than fail.
          if kubectl -n "$NS" get secret "$DASH_PAT_SECRET" >/dev/null 2>&1 ; then
            secret_has_key "$NS" "$DASH_PAT_SECRET" "$DASH_PAT_KEY"
          else
            echo "[bootstrap-secrets] SKIP $DASH_PAT_SECRET (no dashboard MACHINE_USER configured in overlay)"
          fi

          # ESO credential backend Secrets (deploy#567 S4: per-credential
          # individual Secrets replaced the deleted flat gibson-secrets-backend
          # Secret). Verify one representative credential from each logical group.
          ESO_NS="external-secrets-backend"
          if kubectl get namespace "$ESO_NS" >/dev/null 2>&1 ; then
            secret_has_key "$ESO_NS" "gibson-dashboard-postgres-password" "password"
            secret_has_key "$ESO_NS" "gibson-impersonation-key"           "value"
            secret_has_key "$ESO_NS" "gibson-vault-admin-token"           "token"
            # Capability-Grant signing key (GHSA-3957). Both keys checked, not
            # one: with the seed present and the kid missing the daemon errors
            # out of the Minter and disables capability grants; with neither it
            # silently falls back to deriving from the master KEK, which is the
            # unrotatable posture this secret exists to end. The fallback is
            # non-fatal by design, so nothing else in a bringup goes red.
            secret_has_key "$ESO_NS" "gibson-cg-signing-key"              "kid"
            secret_has_key "$ESO_NS" "gibson-cg-signing-key"              "key"
          else
            echo "[bootstrap-secrets] SKIP ESO backend namespace missing (external SecretStore overlay)"
          fi

          echo ""
          echo "[bootstrap-secrets] all structural Secret keys present and non-empty"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
