{{- /*
  ConnectorInstance write access for the gibson daemon.

  The ConnectorService (ListCatalog / EnableConnector / ListConnectors /
  DisableConnector) writes a ConnectorInstance custom resource into the caller's
  tenant namespace (tenant-<id>). The connector-operator then reconciles it into
  a ToolHive MCPServer or MCPRemoteProxy. The daemon writes only the declarative
  ConnectorInstance; it never writes the ToolHive resources or the pods.

  ConnectorInstance is namespaced and lives in every tenant namespace, so the
  grant is a ClusterRole. It is scoped to exactly one resource — connectorinstances
  — and nothing else, so the daemon cannot reach other tenant primitives.
*/}}
{{- if .Values.gibson.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gibson.fullname" . }}-connectorinstances
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["connectorinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["connectorinstances/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gibson.fullname" . }}-connectorinstances
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gibson.fullname" . }}-connectorinstances
subjects:
  - kind: ServiceAccount
    name: {{ include "gibson.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# #1562: the daemon materializes the connector credential Secret
# (<connector>-connector-cred, a "Bearer <token>" the ToolHive proxy forwards)
# into each tenant namespace from its connector-token loop. The Secret is
# namespaced and lives in every tenant namespace.
#
# This ClusterRole carries the rules only. There is no ClusterRoleBinding:
# the tenant-operator binds it into each tenant namespace with a RoleBinding
# when it provisions the namespace (gibson#137, operator v0.137.0), so the
# daemon reads and writes Secrets in tenant namespaces and nowhere else. The
# name is fixed because the operator binds it by name; its own ClusterRole
# may `bind` exactly this name (gibson-operators tenant-operator/cluster-role).
# The operator learns the daemon's ServiceAccount from
# DAEMON_SERVICE_ACCOUNT_NAME, and scripts/check-daemon-sa-binding.py keeps
# that value equal to the ServiceAccount the daemon StatefulSet runs as.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gibson-connector-creds
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
