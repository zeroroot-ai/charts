{{- /*
  The Secret rules of the connector operator in each tenant namespace.

  The daemon holds no Kubernetes client (ADR-0023, gibson#664), so it has no
  grant here: no Tenant read, no ConnectorInstance write and no Secret. The
  connector operator writes the credential Secret of each connector
  (<connector>-connector-cred) and the ConnectorInstances (gibson#662,
  gibson#663). make connector-creds-binding fails on a grant to the daemon.
*/}}
# The connector operator materializes the connector credential Secret
# (<connector>-connector-cred, a "Bearer <token>" the ToolHive proxy forwards)
# into each tenant namespace (gibson#663). The Secret is namespaced and lives
# in every tenant namespace.
#
# This ClusterRole carries the rules only. There is no ClusterRoleBinding:
# the tenant-operator binds it into each tenant namespace with a RoleBinding
# when it provisions the namespace (gibson#137), so the connector operator
# reads and writes Secrets in tenant namespaces and nowhere else. The
# name is fixed because the operator binds it by name; its own ClusterRole
# may `bind` exactly this name (gibson-operators tenant-operator/cluster-role).
# The tenant operator learns the connector operator's ServiceAccount from
# CONNECTOR_OPERATOR_SERVICE_ACCOUNT_NAME, and
# scripts/check-connector-creds-binding.py keeps that value equal to the
# ServiceAccount the connector operator runs as.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gibson-connector-creds
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
