{{- include "gibson.validateSpire" . }}
{{- /*
  gibson daemon is structural infrastructure (one-code-path /
  deploy#188). The previous outer `.Values.gibson.enabled` gate has
  been deleted — the daemon ConfigMap renders unconditionally.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gibson.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
data:
  gibson.yaml: |
    # Gibson Framework Configuration
    # Generated by Helm chart

    core:
      # Spec 3 R3 — daemon runs as nonroot uid 65532; HOME is /var/lib/gibson.
      home_dir: /var/lib/gibson/.gibson
      data_dir: /var/lib/gibson/.gibson/data
      cache_dir: /var/lib/gibson/.gibson/cache
      # Nil-safe access: .Values.gibson.config.core may be unset when an
      # overlay only contributes other gibson.config.* subkeys (e.g.,
      # values-kind.yaml only sets gibson.config.identity). Parenthesized
      # paths return nil instead of erroring on missing intermediates.
      parallel_limit: {{ ((.Values.gibson.config).core).parallelLimit | default 10 }}
      timeout: {{ ((.Values.gibson.config).core).timeout | default "5m" }}
      debug: {{ ((.Values.gibson.config).core).debug | default false }}

    security:
      {{- /* Spec first-deploy-unblock-and-ha R6.2: render the security block
             from .Values.gibson.config.security so prod overlays can pick
             aws_kms (with role_arn + kms_key_id) without hand-patching the
             ConfigMap. The default kind/dev path keeps `kubernetes` and
             materializes a master-key Secret. The daemon's checkpoint
             validator at core/gibson/internal/config/checkpoint.go accepts
             { kubernetes, vault, aws_kms, azure, gcp } — `aws_kms` is the
             canonical underscore form (NOT `aws`). */ -}}
      {{- $sec := ((.Values.gibson).config).security | default dict }}
      encryption_algorithm: {{ $sec.encryption_algo | default $sec.encryption_algorithm | default "aes-256-gcm" | quote }}
      key_derivation: {{ $sec.key_derivation | default "scrypt" | quote }}
      {{- /* deploy#1220: `| default true` swallowed an explicit `false`
             on both of these — TLS verification and audit logging were
             knobs that could not be turned off, which also means they
             were knobs nobody could trust. */}}
      ssl_validation: {{ include "gibson.trueUnlessSet" $sec.ssl_validation }}
      audit_logging: {{ include "gibson.trueUnlessSet" $sec.audit_logging }}
      {{- $kp := $sec.key_provider | default dict }}
      {{- $kpType := "" }}
      {{- if kindIs "map" $kp }}{{- $kpType = required "gibson.config.security.key_provider.type is required (one of: file, vault, aws_kms, azure, gcp). See +." $kp.type }}
      {{- else if kindIs "string" $kp }}{{- $kpType = $kp }}
      {{- else }}{{- fail "gibson.config.security.key_provider is required (map or string). See +." }}
      {{- end }}
      key_provider:
        type: {{ $kpType | quote }}
        {{- if eq $kpType "file" }}
        file:
          {{- /*: the daemon reads the master KEK from a
                 chart-mounted file rather than via the K8s API. The
                 chart's StatefulSet projects the gibson-master-key
                 Secret as a volume; the daemon reads from disk. */}}
          {{- $fk := (kindIs "map" $kp) | ternary ($kp.file | default dict) dict }}
          path: {{ $fk.path | default "/etc/gibson-kek/master-key" | quote }}
        {{- else if eq $kpType "kubernetes" }}
        {{- fail "gibson.config.security.key_provider.type=\"kubernetes\" was removed by design (gibson#212/S10). Use type: file with a chart-mounted Secret volume instead — see values.yaml comment." }}
        {{- else if eq $kpType "aws_kms" }}
        aws_kms:
          {{- $aws := default ($sec.aws | default dict) $sec.aws_kms }}
          kms_key_id: {{ (coalesce $aws.kms_key_id $aws.secret_arn) | required "gibson.config.security.aws_kms.kms_key_id (or .secret_arn) is required when key_provider.type=aws_kms. See." | quote }}
          {{- if $aws.role_arn }}
          role_arn: {{ $aws.role_arn | quote }}
          {{- end }}
          {{- if $aws.region }}
          region: {{ $aws.region | quote }}
          {{- end }}
        {{- else if eq $kpType "vault" }}
        vault:
          {{- $vk := $sec.vault | default dict }}
          address: {{ (coalesce $vk.address ((.Values.openbao).external).address) | required "gibson.config.security.vault.address is required when key_provider.type=vault. See." | quote }}
          {{- if $vk.path }}
          path: {{ $vk.path | quote }}
          {{- end }}
          {{- if $vk.role }}
          role: {{ $vk.role | quote }}
          {{- end }}
        {{- end }}

    # Authentication and Authorization Configuration
    # Mode determines the authentication strategy
    auth:
      # Mode: dev (static tokens), enterprise (customer IdP), saas (multi-tenant)
      mode: {{ .Values.gibson.auth.mode | default "dev" | quote }}

      # Tenant claim extraction for multi-tenant deployments
      tenant_claim: {{ .Values.gibson.auth.tenantClaim | default "tenant_id" | quote }}

      {{- if .Values.gibson.auth.defaultTenant }}
      # Default tenant for single-tenant or dev deployments
      default_tenant: {{ .Values.gibson.auth.defaultTenant | quote }}
      {{- end }}

      # Clock skew tolerance for token expiry validation
      clock_skew: {{ .Values.gibson.auth.clockSkew | default "30s" | quote }}

      # Trust localhost connections without authentication (dev only)
      trust_localhost: {{ .Values.gibson.auth.trustLocalhost | default false }}

      {{- if .Values.gibson.auth.oidc }}
      # OIDC providers configuration
      oidc:
        {{- range .Values.gibson.auth.oidc }}
        - issuer: {{ .issuer | quote }}
          {{- if .audience }}
          audience: {{ .audience | quote }}
          {{- end }}
          {{- if .jwksEndpoint }}
          jwks_endpoint: {{ .jwksEndpoint | quote }}
          {{- end }}
          jwks_ttl: {{ .jwksTtl | default "1h" | quote }}
          {{- if .claimsMapping }}
          claims_mapping:
            {{- range $key, $value := .claimsMapping }}
            {{ $key }}: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .roleBindings }}
          role_bindings:
            {{- range $key, $value := .roleBindings }}
            {{ $key | quote }}:
              {{- range $value }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- if and .Values.gibson.auth.spiffe (not (.Values.dev).disableSPIFFE) }}
      # SPIFFE/SPIRE workload identity configuration
      spiffe:
        trust_domain: {{ .Values.gibson.auth.spiffe.trustDomain | default "zeroroot.ai" | quote }}
        workload_api_socket: {{ .Values.gibson.auth.spiffe.workloadAPISocket | default "/run/spire/sockets/api.sock" | quote }}
        {{- if .Values.gibson.auth.spiffe.infrastructureIDs }}
        infrastructure_ids:
          {{- range .Values.gibson.auth.spiffe.infrastructureIDs }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- if .Values.gibson.auth.roleBindings }}
      # Role bindings map OIDC groups to Gibson roles
      role_bindings:
        {{- range $key, $value := .Values.gibson.auth.roleBindings }}
        {{ $key | quote }}:
          {{- range $value }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- if and (eq (.Values.gibson.auth.mode | default "dev") "dev") .Values.gibson.auth.local }}
      # Local tokens are for dev mode only (no K8s, no SSO).
      local:
        users:
          {{- range .Values.gibson.auth.local.users }}
          - name: {{ .name | quote }}
            token: {{ .token | quote }}
            {{- if .tenant }}
            tenant: {{ .tenant | quote }}
            {{- end }}
            roles:
              {{- range .roles }}
              - {{ . | quote }}
              {{- end }}
          {{- end }}
      {{- end }}

    logging:
      level: {{ ((.Values.gibson.config).logging).level | default "info" }}
      format: {{ ((.Values.gibson.config).logging).format | default "json" }}

    registry:
      type: platform
      namespace: gibson
      ttl: 30s

    daemon:
      grpc_address: 0.0.0.0:{{ include "gibson.grpc.port" . }}

    callback:
      # Spec 3 §1 R1 — callback listener moves to 127.0.0.1:50001. The R1
      # SPIFFE-mTLS wrapper binds the externally-reachable cert-bound listener
      # in core/gibson/internal/callback (daemon-Go agent owns the wiring); the
      # in-process plain listener here is loopback-only and used by the
      # in-process registration path. Override via gibson.config.callback.listenAddress
      # for legacy overlays that need the old 0.0.0.0 bind.
      enabled: true
      listen_address: {{ ((.Values.gibson.config).callback).listenAddress | default "127.0.0.1:50001" | quote }}
      # The address handed to agents as their callback endpoint. It must be
      # the PUBLIC edge, not the in-cluster Service name: a sandboxed agent
      # runs under setec's containment, which resolves names through public
      # resolvers only and denies the operator's reserved ranges, so a
      # .svc.cluster.local name is neither resolvable nor reachable from
      # there. An agent running off-cluster (the Claude Code plugin on a
      # laptop) has never been able to use the internal name either. Envoy
      # already routes gibson.harness.v1.HarnessCallbackService for exactly
      # these callers, so both reach the daemon by the same path.
      advertise_address: {{ (((.Values.gibson.config).callback).advertiseAddress) | default (include "gibson.apiEndpoint" .) | quote }}

    registration:
      enabled: true
      port: 50100
      heartbeat_timeout: 30s

    redis:
      url: {{ include "gibson.redis.url" . }}
      # Spec 3 R11 — password is injected at runtime via REDIS_PASSWORD env
      # var (sourced from gibson.redisPasswordSecretName/Key) so the literal
      # never appears in this ConfigMap.
      password: ${REDIS_PASSWORD}
      database: 0
      pool_size: 10
      connect_timeout: 5s
      read_timeout: 30s
      write_timeout: 30s

    {{- /* Spec helm-eks-readiness-and-pg-split Phase 2 — switched from
           per-alias dashboard.postgres.* values to the gibson.platformPostgres
           helper family. Defaults route at the existing dashboard-postgresql
           alias; prod overlays flip platformPostgres.external.enabled to point
           at RDS. */ -}}
    {{- if .Values.dashboard.postgres.enabled }}
    dashboard_postgres:
      host: {{ include "gibson.platformPostgres.host" . }}
      port: {{ include "gibson.platformPostgres.port" . }}
      database: {{ include "gibson.platformPostgres.database" . | quote }}
      username: {{ include "gibson.platformPostgres.username" . | quote }}
      # Password injected from DASHBOARD_DB_PASSWORD env var at runtime
      password: ${DASHBOARD_DB_PASSWORD}
      ssl_mode: {{ include "gibson.platformPostgres.sslMode" . | quote }}
      max_conns: {{ .Values.dashboard.postgres.maxConns | default 10 }}
    {{- end }}

    {{- $tenantPgHost := include "gibson.tenant.dbHost" . }}
    {{- if $tenantPgHost }}
    # Per-tenant admin Postgres — used by the daemon to bootstrap tenant databases
    # and roles. Requires a role with CREATEDB privilege. The admin_password field
    # is NOT rendered here; it is injected at runtime via the
    # TENANT_POSTGRES_ADMIN_PASSWORD env var (set via secretKeyRef on the
    # StatefulSet), which the daemon's loader env-interpolation block expands.
    # Spec: per-tenant-data-plane-completion Req 1, D1, D5; Tasks 6, 25.
    #
    # Host resolution order (gibson.tenant.dbHost):
    #   1. dataPlane.postgres.host (explicit override — RDS, Aurora, etc.)
    #   2. {{ .Release.Name }}-tenant-postgresql Service (in-chart subchart)
    tenant_postgres:
      host: {{ $tenantPgHost | quote }}
      port: {{ .Values.dataPlane.postgres.port | default 5432 }}
      admin_database: {{ .Values.dataPlane.postgres.admin_database | default "postgres" | quote }}
      admin_username: {{ .Values.dataPlane.postgres.admin_username | default "gibson_admin" | quote }}
      # admin_password injected from TENANT_POSTGRES_ADMIN_PASSWORD env var at runtime
      admin_password: ${TENANT_POSTGRES_ADMIN_PASSWORD}
      {{- /* sslmode=require is hardcoded — Spec first-deploy-unblock-and-ha R7. */}}
      ssl_mode: "require"
    {{- end }}

    graphrag:
      neo4j:
        tenant_mode: {{ .Values.neo4j.tenant_mode | default "instance" | quote }}
        {{- if eq (.Values.neo4j.tenant_mode | default "instance") "multi-db" }}
        shared_cluster_uri: {{ .Values.neo4j.shared_cluster_uri | quote }}
        {{- end }}

    # Trace export is disabled: the former OTLP trace backend was retired
    # (gibson#755). The daemon's OTel mission tracer installs a no-op
    # exporter; LLM-call provenance now lives in the brain World, read via
    # WorldService. Re-point endpoint + set enabled:true to ship spans to a
    # generic OTLP collector if one is ever wired.
    otel_observability:
      enabled: false
      metrics:
        enabled: false

    tracing:
      enabled: {{ (((.Values.gibson).tracing).enabled) | default false }}
      sample_rate: 1
      service_name: gibson

    # Prometheus metrics listener (Spec security-hardening R20).
    # Daemon-owned :9090 mTLS endpoint; cert material mounted from the
    # `gibson-daemon-metrics-tls` Secret (templates/cert-manager/component-
    # certificates.yaml + the StatefulSet volumeMount below). All three
    # paths must resolve to readable files at startup; the daemon refuses
    # to start otherwise.
    metrics:
      enabled: {{ include "gibson.trueUnlessSet" (((.Values.gibson.config).metrics).enabled) }}
      port: {{ .Values.gibson.ports.metrics | default 9090 }}
      {{- $metricsListen := ((.Values.gibson.config).metrics).listenAddress | default (printf ":%d" (int (.Values.gibson.ports.metrics | default 9090))) }}
      listen_address: {{ $metricsListen | quote }}
      {{- $metricsTLS := (((.Values.gibson.config).metrics).tls) | default dict }}
      tls:
        cert_path: {{ $metricsTLS.certPath | default "/etc/gibson/tls/metrics/tls.crt" | quote }}
        key_path: {{ $metricsTLS.keyPath | default "/etc/gibson/tls/metrics/tls.key" | quote }}
        client_ca_path: {{ $metricsTLS.clientCAPath | default "/etc/gibson/tls/metrics/ca.crt" | quote }}

    authz:
      # One-code-path slice deploy#195: FGA is always required.
      # The daemon no longer accepts `enabled: false` or
      # `require_ready: false`; both fields were silent-allow surfaces and
      # have been deleted from the binary. The chart still emits `enabled: true`
      # for backwards compatibility with older daemon images.
      enabled: true
      provider: openfga
      enforcement_source: "fga"
      fga:
{{- /* deploy#1382: explicit https:// — the OpenFGA HTTP listener serves
            TLS; the daemon's FGA client honours the scheme and the pod
            trusts the issuing CA via SSL_CERT_DIR (statefulset.yaml). */}}
        endpoint: {{ ((.Values.gibson.authz).fga).endpoint | default (printf "https://gibson-openfga:%d" (int (.Values.openfga.service.httpPort | default 8080))) | required "gibson.authz.fga.endpoint must resolve to the in-cluster OpenFGA HTTP endpoint — one-code-path slice deploy#195 requires FGA at daemon startup" }}
        store_id: ""
        model_id: ""
        {{- /*
          deploy#452 + deploy#1203 — this MUST stay strictly less than the
          Envoy ext_authz filter timeout, which is the outer budget for the
          whole authz decision. Both track the platform contract constant
          authz.EnvoyExtAuthzBudgetDefault = 5s (gibson
          internal/infra/authz/authz.go); the daemon enforces the "strictly
          less" half at startup (internal/server/daemon/authz_init.go refuses
          to boot when this value is >= 5000).

          The Envoy side lives in files/envoy/envoy.yaml, ext_authz
          grpc_service.timeout. It read 2s until deploy#1203 — smaller than
          both this value and the 2 x 1500ms worst-case FGA per-call floor —
          so the chart contradicted itself. It is now 5s. If you change either
          number, change both.
        */}}
        timeout_ms: {{ ((.Values.gibson.authz).fga).timeoutMs | default 4000 }}
        tls:
          enabled: false


    {{- if .Values.gibson.sandbox.enabled }}
    {{- $sbx := .Values.gibson.sandbox }}
    {{- $mtlsDir := include "gibson.setecMtlsMountPath" . }}
    # sandbox: the Setec connection details, and the ONLY surface the daemon
    # reads them from (config.SandboxConfig, gibson
    # internal/infra/config/sandbox.go). Per-tool registration (the old
    # sandbox.tools.* block) was removed under the executor-catalog spec.
    # Tools are kind:tool catalog manifests inside the daemon image;
    # each names the shared gibson-executor image and selects a parser by
    # GIBSON_TOOL_NAME. The runtime catalog refresher was removed (gibson#1641).
    #
    # address / server_name / the three mTLS paths are DERIVED, not restated
    # (deploy#1106): they have to agree with where the setec subchart puts
    # the frontend, what SANs its certificate carries, and where the
    # StatefulSet mounts the keypair, and a disagreement produces no render
    # error — just a dial timeout or a handshake failure at the first
    # sandboxed tool call. An overlay sets enabled + tenant.
    sandbox:
      enabled: true
      setec:
        address: {{ $sbx.setec.address | default (include "gibson.setecFrontendAddress" .) | quote }}
        tenant: {{ $sbx.setec.tenant | quote }}
        call_timeout: {{ $sbx.setec.callTimeout | default "5m" | quote }}
        {{- with $sbx.setec.sandboxClass }}
        sandbox_class: {{ . | quote }}
        {{- end }}
        {{- with $sbx.setec.agentSandboxClass }}
        # agent_sandbox_class: the class an ephemeral platform-agent launch
        # names. Named explicitly, never inherited from the cluster
        # default — the daemon's agent launcher refuses an empty
        # class. Separate from sandbox_class (tool/catalog dispatch) so the
        # agent workload can carry a different isolation posture.
        agent_sandbox_class: {{ . | quote }}
        {{- end }}
        # File-based mTLS is what the daemon adapter implements — it builds a
        # component.TLSConfig and hands it to credentials.NewTLS. It does not
        # speak the SPIFFE Workload API on this leg, and the frontend does not
        # serve an SVID, so the cert-manager chain that already signs the
        # frontend's server cert is the trust root for both directions.
        mtls:
          enabled: true
          cert_file: {{ $sbx.setec.mtls.certFile | default (printf "%s/tls.crt" $mtlsDir) | quote }}
          key_file: {{ $sbx.setec.mtls.keyFile | default (printf "%s/tls.key" $mtlsDir) | quote }}
          ca_file: {{ $sbx.setec.mtls.caFile | default (printf "%s/ca.crt" $mtlsDir) | quote }}
          server_name: {{ $sbx.setec.mtls.serverName | default (include "gibson.setecFrontendServerName" .) | quote }}
    {{- end }}
