{{/* Gibson daemon ServiceMonitor (Week 2 §3 R21). The chart ships no
     monitoring stack. It renders only where the cluster serves
     monitoring.coreos.com/v1 (ADR-0087). */}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gibson.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  selector:
    matchLabels:
      {{- include "gibson.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      # spec security-hardening R20: daemon :9090 is TLS-only, served with
      # the gibson-daemon-metrics-tls Secret that cert-manager issues from
      # the component issuer. cert-manager writes the issuing CA into that
      # Secret's ca.crt, so Prometheus verifies the daemon against it and
      # checks the certificate's service name. A scrape that skipped
      # verification would speak to any responder on the port.
      # scripts/check-servicemonitor-tls.py fails a ServiceMonitor that
      # sets insecureSkipVerify.
      scheme: https
      tlsConfig:
        serverName: {{ printf "%s.%s.svc" (include "gibson.fullname" .) .Release.Namespace | quote }}
        ca:
          secret:
            name: gibson-daemon-metrics-tls
            key: ca.crt

{{- end }}