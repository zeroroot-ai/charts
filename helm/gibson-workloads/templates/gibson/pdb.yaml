{{/*
PodDisruptionBudget for the gibson daemon StatefulSet (Week 2 §3 R9).

Gated on .Values.gibson.podDisruptionBudget.enabled (defaults true when
replicas > 1). For 1-replica overlays the PDB is omitted because
minAvailable: 1 with replicas: 1 blocks node drains entirely.

gibson daemon is structural infrastructure (one-code-path /
deploy#188). The previous outer `.Values.gibson.enabled` gate has
been deleted; the inner `podDisruptionBudget.enabled` sub-feature
flag is preserved (legitimate sub-feature toggle).
*/}}
{{- $replicas := int (.Values.gibson.replicas) }}
{{- $pdb := .Values.gibson.podDisruptionBudget | default dict }}
{{- $pdbEnabled := $pdb.enabled }}
{{- if and (kindIs "invalid" $pdbEnabled) (gt $replicas 1) }}
{{- $pdbEnabled = true }}
{{- end }}
{{- if $pdbEnabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gibson.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  {{- if $pdb.maxUnavailable }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $pdb.minAvailable | default (ternary "50%" 1 (gt $replicas 2)) }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gibson.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
{{- end }}
