{{- /*
  dashboard is structural infrastructure (one-code-path /
  deploy#188). The previous outer `.Values.dashboard.enabled`
  gate has been deleted; the inner `serviceAccount.create`
  sub-feature flag is preserved (legitimate sub-feature toggle —
  IRSA / external SA setups may want to provide the ServiceAccount
  out-of-band).
*/}}
{{- if .Values.dashboard.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.dashboard.serviceAccount.name | default "gibson-dashboard" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- with .Values.dashboard.serviceAccount.annotations }}
  annotations:
    {{- include "gibson.irsaAnnotations" . | nindent 4 }}
  {{- end }}
{{- end }}
