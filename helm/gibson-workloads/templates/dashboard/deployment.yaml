{{- include "gibson.assertKeysDeleted" (dict "ctx" . "keys" (list "dashboard.zitadel.audience" "dashboard.auth.metrics") "use" "nothing: the dashboard serves its metrics on the metrics-only port 9464 and verifies no inbound service token (charts#515)") }}
{{- /*
  dashboard is structural infrastructure (one-code-path /
  deploy#188). The previous outer `.Values.dashboard.enabled`
  gate has been deleted — the dashboard is the customer-facing
  surface (sign-up, sign-in, agent / tool / plugin management,
  billing) and the platform has no other way for an end-user to
  reach the daemon.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "gibson.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "gibson.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
        {{- include "gibson.netLabels" (dict "role" "platform" "clients" (list "postgres" "redis") "kubeApi" true "metricsPort" 9464) | nindent 8 }}
      annotations:
        # Velero fs-backup (defaultVolumesToFsBackup on the shipped Schedule)
        # snapshots every pod volume it is not told to skip. These hold a
        # socket, a scratch dir or an init-rendered file: nothing to keep,
        # and on restore each one becomes a PodVolumeRestore that can only
        # finish once this pod is running. Measured 2026-09-07: 9 of 22
        # PodVolumeRestores in a preserve backup were volumes like these.
        # scripts/check-velero-volume-excludes.sh keeps this list equal to
        # the pod's emptyDir and CSI-ephemeral volumes.
        backup.velero.io/backup-volumes-excludes: "spire-agent-socket,shared-identity,next-cache,tmp"
        checksum/config: {{ include (print $.Template.BasePath "/dashboard/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/dashboard/secret.yaml") . | sha256sum }}
        # Pod-roll-on-Secret-change is delegated to Stakater Reloader (deploy / PRD deploy#255 / slice S7, deploy#263). The prior pattern
        # (a checksum annotation computing sha256sum over a lookup-loaded
        # Secret) was broken under Argo's offline `helm template` render —
        # lookup returned nil, the checksum was always the same, the
        # annotation never changed, and pods never rolled when the Secret
        # rotated. Reloader runs cluster-wide and watches the explicitly-
        # named Secrets below; when any of them changes, Reloader triggers
        # a rolling restart of this Deployment.
        secret.reloader.stakater.com/reload: "gibson-dashboard-oidc,{{ include "gibson.dashboardSecrets.name" . }}"
    spec:
      {{- include "gibson.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ .Values.dashboard.serviceAccount.name | default "gibson-dashboard" }}
      # Secure pod (ADR-0165, charts#394): every container runs non-root with
      # the RuntimeDefault seccomp profile, a read-only root filesystem and no
      # capabilities.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- /* Spec 2 R18: priorityClassName via shared helper. */}}
      {{- $pcn := include "gibson.priorityClassName" (dict "component" "dashboard") }}
      {{- if $pcn }}
      priorityClassName: {{ $pcn }}
      {{- end }}
      {{- /* Spec 3 §3 R8 — HA topology spread + anti-affinity. */}}
      {{- include "gibson.spread" (dict "ctx" . "component" "dashboard") | nindent 6 }}
      {{- /*
        Per epic one-code-path (deploy#186), slices deploy#196 + #201 +
        #203: the `.Values.zitadel.enabled` and `.Values.spire.enabled`
        gates have been deleted (Zitadel + SPIRE are structurally
        required), and wait-for-db-secrets is unconditional (the
        dashboard always consumes NEO4J_PASSWORD). initContainers always
        renders — wait-for-spire-socket, wait-for-zitadel-client +
        secret, resolve-sa-identity-map are mandatory. Per-feature waits
        (e.g. waitForGibson) remain gated on their feature flags. The
        dashboard pod must not boot before the bootstrap Job has
        populated gibson-dashboard-oidc.
      */}}
      initContainers:
        {{- /* deploy#201: SPIRE is REQUIRED infrastructure — block pod start
               until the agent socket is reachable on the node. Renders
               unconditionally. NOTE: on THIS pod the gate currently guards a
               capability no container gets — the `dashboard` container mounts
               neither the socket nor SPIFFE_ENDPOINT_SOCKET, unlike the daemon,
               ext-authz and both operators. Tracked as deploy#1532; not
               resolved here. */}}
        {{- include "gibson.waitForSpireSocket" . | nindent 8 }}
        {{- if .Values.dashboard.initContainers.waitForGibson }}
        - name: wait-for-gibson
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              # Dashboard reaches the daemon through Envoy (NetworkPolicy
              # blocks direct dashboard→daemon traffic). Wait for Envoy's
              # listener to be reachable instead of poking gibson:50051,
              # which would always fail by design.
              # Envoy is required infrastructure — deploy#200.
              echo "Waiting for Envoy gateway (timeout: 300s)..."
              SECONDS=0
              until nc -z gibson-envoy {{ .Values.envoy.service.httpsPort | default 443 }}; do
                if [ $SECONDS -ge 300 ]; then
                  echo "ERROR: Envoy not ready after 300s, giving up"
                  exit 1
                fi
                echo "Envoy not ready, waiting... (${SECONDS}s elapsed)"
                sleep 2
              done
              echo "Envoy is ready!"
        {{- end }}
        # Block dashboard startup until the post-install zitadel-bootstrap
        # Job has written the OIDC client_id AND client_secret into
        # gibson-dashboard-oidc. Both keys are env-bound via
        # secretKeyRef (resolved ONCE at pod start) — without this gate,
        # on a fresh `helm install` the pod boots before the bootstrap
        # Job runs, captures empty values, and Auth.js ships
        # `?client_id=` empty on the OIDC authorize URL. The
        # checksum/zitadel-client annotation above only protects re-deploys.
        #
        # The Secret volume is mounted with optional: true so the pod can
        # schedule before the Secret exists; kubelet propagates the
        # populated keys to the mount once the bootstrap Job creates them.
        #
        # one-code-path #203: previously waited only on client_id;
        # extended to wait on client_secret as well, since the env entry
        # for ZITADEL_CLIENT_SECRET was flipped from `optional: true` to
        # required.
        - name: wait-for-zitadel-client
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              echo "Waiting for Zitadel OIDC client_id + client_secret (timeout: 600s)..."
              SECONDS=0
              until [ -s /var/run/zitadel-client/client_id ] && [ -s /var/run/zitadel-client/client_secret ]; do
                if [ $SECONDS -ge 600 ]; then
                  echo "ERROR: gibson-dashboard-oidc.client_id / client_secret not populated after 600s — bootstrap Job failed?"
                  exit 1
                fi
                echo "client_id / client_secret not yet populated by zitadel-bootstrap Job, waiting... (${SECONDS}s elapsed)"
                sleep 2
              done
              echo "Zitadel OIDC client_id + client_secret are populated"
          volumeMounts:
            - name: zitadel-client
              mountPath: /var/run/zitadel-client
              readOnly: true
        # one-code-path #203: wait-for-db-secrets blocks pod start until
        # the Secret backing NEO4J_PASSWORD has been materialised. The
        # NEO4J_PASSWORD env entry was flipped from `optional: true` to
        # required.
        - name: wait-for-db-secrets
          image: ghcr.io/zeroroot-ai/mirror/kubectl:1.31.4@sha256:64614ef8290f3fb27fed5164b338debeeb79a1e5e26c93eb920770b71abd7c48
          command: ['/bin/bash', '-c']
          args:
            - |
              set -eu
              name={{ .Values.secrets.databases.existingSecret | default (include "gibson.dbSecrets.name" .) | quote }}
              ns={{ .Release.Namespace | quote }}
              echo "[wait-for-db-secrets] waiting for Secret ${ns}/${name} key=NEO4J_PASSWORD..."
              for i in $(seq 1 30); do
                if kubectl get secret -n "${ns}" "${name}" \
                    -o jsonpath='{.data.NEO4J_PASSWORD}' 2>/dev/null \
                    | base64 -d 2>/dev/null | grep -q .; then
                  echo "[wait-for-db-secrets] ok"
                  exit 0
                fi
                sleep 2
              done
              echo "[wait-for-db-secrets] timed out after 60s -- the dashboard DB-secrets Secret was not materialised. Check: kubectl get externalsecret,secret -n ${ns}" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        # Spec: canonical-service-identity Req 5 — resolve the readable SA
        # names in serviceAccounts.required against the gibson-sa-identity-map
        # ConfigMap (populated by the post-install Zitadel Job) into:
        #   /shared/sa-identity-map.json       — full readable→numeric map
        #                                        consumed by identity-resolver
        #                                        for log enrichment
        # Fail-fast on any "<unset>" value so the kubelet retries until the
        # post-install Job has populated the map.
        - name: resolve-sa-identity-map
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -e
              REQUIRED='{{- range $i, $sa := (default (list) ((.Values.serviceAccounts | default dict).required)) }}{{- if $i }} {{ end }}{{ $sa }}{{- end }}'
              # jq is not actually USED below — the loop just cats files
              # and concatenates strings. Skip the apk-add entirely; kind
              # has no outbound network to alpine repos.
              echo "Resolving SA identity map (required: ${REQUIRED})..."
              if [ -z "$REQUIRED" ]; then
                printf '{}' > /shared/sa-identity-map.json
                echo "Resolved: (no SAs required)"
                exit 0
              fi
              SECONDS_=0
              while :; do
                ALL_SET="true"
                JSON="{"
                FIRST=true
                for sa in $REQUIRED; do
                  if [ -r "/var/run/sa-identity-map/${sa}" ]; then
                    val=$(cat "/var/run/sa-identity-map/${sa}")
                  else
                    val=""
                  fi
                  if [ -z "$val" ] || [ "$val" = "<unset>" ]; then
                    ALL_SET="false"
                    break
                  fi
                  if [ "$FIRST" = "true" ]; then
                    FIRST=false
                    JSON="${JSON}\"${sa}\":\"${val}\""
                  else
                    JSON="${JSON},\"${sa}\":\"${val}\""
                  fi
                done
                if [ "$ALL_SET" = "true" ]; then
                  JSON="${JSON}}"
                  printf '%s' "$JSON" > /shared/sa-identity-map.json
                  echo "Resolved: $JSON"
                  exit 0
                fi
                if [ $SECONDS_ -ge 600 ]; then
                  echo "ERROR: gibson-sa-identity-map not fully populated after 600s — post-install Zitadel Job has not completed."
                  exit 1
                fi
                echo "sa-identity-map not yet populated for $sa, waiting..."
                SECONDS_=$((SECONDS_+4))
                sleep 4
              done
          volumeMounts:
            - name: sa-identity-map
              mountPath: /var/run/sa-identity-map
              readOnly: true
            - name: shared-identity
              mountPath: /shared
      containers:
        - name: dashboard
          image: {{ include "gibson.image" (dict "registry" (($.Values.global).registry) "repo" .Values.dashboard.image.repository "tag" .Values.dashboard.image.tag "digest" .Values.dashboard.image.digest "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            # The metrics-only listener (charts#515): GET /metrics, plain HTTP.
            # The network rule admits only the cluster scraper to it.
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            # NODE_OPTIONS — the V8 heap ceiling tracks this container's memory
            # limit. Node reads the HOST's memory, so without this the ceiling
            # is wrong by the ratio between the node and the container, and a
            # render that outgrows the cgroup dies with nothing naming memory
            # (dashboard#150). See gibson.nodeHeapMiB for the arithmetic.
            - name: NODE_OPTIONS
              value: {{ printf "--max-old-space-size=%s" (include "gibson.nodeHeapMiB" .Values.dashboard.resources.limits.memory) | quote }}
            # NO GIBSON_API_URL. It was retained for next.config.ts's dev-proxy
            # rewrite, and that rewrite is gone: the only occurrence of the name
            # in the dashboard at v0.127.2 is inside the comment explaining why
            # the `/api/grpc/:path*` rewrite was deleted, plus one test. The
            # dashboard reaches the daemon through ADMIN_ENVOY_BASE_URL below,
            # which is the path Envoy and ext_authz actually police.
            # Admin RPCs from the dashboard go through Envoy's api.<domain>
            # edge — same URL any external SDK caller would hit. Envoy
            # terminates TLS, validates the SPIFFE JWT-SVID the dashboard
            # mints, and forwards to the daemon. Spec: dashboard-admin-via-envoy.
            - name: ADMIN_ENVOY_BASE_URL
              value: {{ printf "https://api.%s:%v" (.Values.global.domain | default "zeroroot.ai") (.Values.envoy.service.httpsPort | default 443) | quote }}
            # SPIFFE Workload API socket (deploy#1532). The dashboard IS a
            # SPIFFE consumer: src/lib/gibson-client/transport.ts calls
            # spiffeNodeOptions() on every outbound admin RPC to Envoy and
            # lazy-loads src/lib/spiffe-mtls/svid.ts. Until this env var and
            # the matching mount below existed, isSpiffeAvailable() returned
            # false on every call and the transport silently fell back to
            # plain HTTPS behind a single console.warn — the Pod paid the
            # wait-for-spire-socket startup gate for a capability it never got.
            #
            # The mounted directory carries three equivalent names — the
            # agent's real socket plus two compatibility symlinks:
            #   api.sock -> spire-agent.sock
            #   socket   -> spire-agent.sock
            # so this value, the peers' /run/spire/sockets/api.sock, and the
            # daemon ConfigMap's workload_api_socket all resolve to the same
            # endpoint. deploy#1562 claimed the api.sock spelling was broken;
            # that was WRONG (closed as invalid — the symlink is right there
            # in the mount, and the agents have signed thousands of SVIDs for
            # every platform workload). Nothing here needs to match a peer.
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/spire/sockets/spire-agent.sock"
            # Auth.js (next-auth v5) — spec zitadel-envoy-gateway-migration
            # AUTH_URL is the externally-reachable URL of the dashboard so
            # callbackUrl is built correctly (default 0.0.0.0:3000 from the
            # in-pod listen address breaks browser-side redirects).
            - name: AUTH_URL
              value: {{ .Values.dashboard.authUrl | default (include "gibson.externalOrigin" .) | quote }}
            # Marketing host origin (deploy#630 S11, deploy#1061 / dashboard#920).
            # The dashboard middleware host-split serves marketing on www.<domain>
            # and the product on app.<domain> (AUTH_URL).
            #
            # Deployment profile contract (/ deploy#1061):
            #   SaaS: dashboard.wwwUrl is explicitly set to the marketing origin
            #         (e.g. "https://www.zeroroot.ai"). WWW_URL is emitted; the
            #         middleware redirects marketing paths off-cluster.
            #   Self-hosted: dashboard.wwwUrl is left empty (the default "").
            #         WWW_URL is NOT emitted; the dashboard handles absence
            #         gracefully — no redirect, no dead links to a non-existent
            #         marketing site (dashboard#918 / dashboard#920).
            #
            # Never use the config-derived gibson.wwwOrigin as a self-hosted
            # fallback: that would set WWW_URL to www.<self-hosted-domain> which
            # is unreachable and breaks the coherence guard (signup-seam.bats).
            {{- if .Values.dashboard.wwwUrl }}
            - name: WWW_URL
              value: {{ .Values.dashboard.wwwUrl | quote }}
            {{- end }}
            # Signup seam gate (deploy#1055, dashboard#917).
            # SIGNUP_SELF_SERVE present → /signup page is accessible.
            # Absent → /signup redirects to /login (closed front door).
            # The value comes from `registration`, the same one value the
            # daemon reads (gibson.registrationKnob), so the two cannot
            # disagree. Read server-side only; not exposed to the browser.
            {{- with include "gibson.registrationKnob" . }}
            - name: SIGNUP_SELF_SERVE
              value: {{ . | quote }}
            {{- end }}
            # Docs URL — points to the in-cluster docs-svc when enabled (core
            # optional-by-toggle, deploy#1034 /). When docs.enabled=false
            # (no in-cluster docs-svc), falls back to publicFallbackUrl so the
            # dashboard can still link operators to the canonical public docs.
            {{- $docsEnabled := ne ((.Values.docs).enabled | toString) "false" }}
            - name: DOCS_URL
              {{- if $docsEnabled }}
              value: {{ include "gibson.docsOrigin" . | quote }}
              {{- else }}
              value: {{ required "docs.publicFallbackUrl is REQUIRED when docs.enabled is false: the URL the console links to for documentation when no in-cluster docs service runs" (.Values.docs).publicFallbackUrl | quote }}
              {{- end }}
            # RP-initiated logout sends this exact URI to Zitadel's
            # /oidc/v1/end_session as post_logout_redirect_uri. The
            # dashboard does NOT synthesize the URI from request origin
            # (which appended a trailing slash and silently drifted from
            # the Zitadel registration). The chart projects the first
            # entry of dashboard.auth.postLogoutRedirectURIs verbatim;
            # the same list value MUST be registered on the
            # gibson-dashboard OIDC client via the gibson-operators
            # chart for Zitadel to accept the logout request.
            {{- with (first (.Values.dashboard.auth.postLogoutRedirectURIs | default (list (include "gibson.externalOrigin" .)))) }}
            - name: POST_LOGOUT_REDIRECT_URI
              value: {{ . | quote }}
            {{- end }}
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gibson.dashboardSecrets.name" . }}
                  key: auth-secret
            # Stable encryption key for Next.js Server Action IDs — see
            # dashboard/secret.yaml + next.config.ts. Without this, every
            # dashboard rebuild rotates action IDs and any browser tab that
            # was loaded BEFORE the rebuild fails its next form submit with
            # "Failed to find Server Action". Mounted from the dashboard
            # secret so it survives upgrades.
            - name: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gibson.dashboardSecrets.name" . }}
                  key: next-server-actions-encryption-key
            # Per epic one-code-path (deploy#186), slice deploy#196:
            # dashboard.zitadel.issuer is required (chart render fails if
            # empty). The previous `| default "http://localhost:30080"`
            # silent fallback has been deleted — it was a workstation-only
            # URL that production overlays could inherit by accident.
            - name: ZITADEL_ISSUER
              value: {{ ((.Values.dashboard.zitadel).issuer) | default (include "gibson.oidcIssuer" .) | quote }}
            # ZITADEL_ISSUER above is a STRING: the dashboard compares it with
            # the `iss` claim, and the browser follows it. No server code dials
            # it. Since dashboard v0.128.0 the server side reaches Zitadel the
            # one way ADR-0092 names: it connects to the Zitadel Service
            # (ZITADEL_URL) and claims the public host in the instance header
            # (ZITADEL_EXTERNAL_DOMAIN, never with a port). The dashboard
            # refuses to boot without both. ZITADEL_INTERNAL_ISSUER is gone
            # with the second authority it stood for (dashboard#88).
            {{- include "gibson.zitadel.env" . | nindent 12 }}
            # The Zitadel-generated OIDC clientId is written by the
            # zitadel-bootstrap Job into this Secret after Zitadel creates
            # the app. If the Job re-runs (e.g. after a DB wipe), it
            # overwrites the value AND bumps the deployment via the
            # checksum/zitadel-client annotation below so pods pick up the
            # new id without a manual rollout.
            # one-code-path #203: was `optional: true`; the
            # wait-for-zitadel-client init container above blocks pod
            # start until kubelet observes the Secret, so this entry is
            # now strictly required.
            - name: ZITADEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gibson-dashboard-oidc
                  key: client_id
            # Service-account client_credentials for the dashboard's
            # server-side service-acting calls (e.g. daemon entitlements
            # RPCs invoked from the entitlements-provisioning route).
            # Materialized by templates/auth/zitadel-service-accounts-secret.yaml
            # with REPLACE_ME_* placeholders; the post-install bootstrap Job
            # mints real Zitadel client_credentials and patches them in.
            # Read by src/lib/auth/service-token.ts.
            # Dashboard server-side service-acting calls use OAuth2
            # client_credentials, which Zitadel ONLY supports for
            # MACHINE_USER entities. The gibson-dashboard OIDC app
            # above is OIDC_APP / authorization_code only, so a
            # separate MACHINE_USER (gibson-dashboard-service) is
            # minted by the platform-operator and lands its client
            # credentials in gibson-zitadel-dashboard.
            - name: ZITADEL_DASHBOARD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gibson-zitadel-dashboard
                  key: ZITADEL_CLIENT_ID
            - name: ZITADEL_DASHBOARD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gibson-zitadel-dashboard
                  key: ZITADEL_CLIENT_SECRET
            # OIDC client secret for the dashboard's browser-side
            # authorization_code flow against Zitadel. Paired with
            # ZITADEL_CLIENT_ID above; both MUST point at the same
            # platform-operator-managed Secret so that a Zitadel reseed
            # (Job re-run, secret rotation) writes both halves of the
            # credential atomically. Previously this env was wired to a
            # Helm value (.Values.dashboard.zitadel.clientSecret) that no
            # values file ever sets — Auth.js v5 then sent
            # `Basic base64(client_id:undefined)` on the token-exchange
            # POST and Zitadel rejected it with `invalid_client / invalid
            # secret` on every sign-in (zeroroot-ai/dashboard#40).
            #
            # The `gibson-dashboard-oidc` Secret already exposes both the
            # snake_case `client_secret` (the canonical key the
            # platform-operator's OIDCClient reconciler writes per
            # spec.secretRef.key) and the screaming-snake alias
            # `ZITADEL_CLIENT_SECRET` (added in platform-operator#22 for
            # this exact reason). Reading the snake_case form matches the
            # client_id wiring above and is stable across operator alias
            # changes.
            # one-code-path #203: was `optional: true`; same as
            # ZITADEL_CLIENT_ID above, the wait-for-zitadel-client init
            # container blocks pod start until both keys are populated.
            - name: ZITADEL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gibson-dashboard-oidc
                  key: client_secret
            {{- if eq (include "gibson.envoyEdge.caRequired" .) "true" }}
            # Trust Envoy's edge TLS cert when its CA is NOT in the system
            # trust bundle (kind selfsigned-ca, vault-issuer). Auth.js's
            # server-side calls to Zitadel go through Envoy at
            # https://app.<domain>:30443; Node rejects unknown CAs by
            # default. NODE_EXTRA_CA_CERTS appends the mounted PEM to Node's
            # trust store. Letsencrypt / awspca issuers chain to roots
            # already in the system bundle — no mount needed (deploy#126).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/envoy-ca/ca.crt
            {{- end }}

            # Gibson Platform Public URL (spec: naming-and-config-standardization).
            # Required by the dashboard to render user-facing links to the platform
            # API. Points to the Envoy ingress URL operators use from browsers.
            - name: GIBSON_PLATFORM_PUBLIC_URL
              value: {{ .Values.dashboard.gibsonPlatformPublicUrl | default (printf "https://api.%s" .Values.global.domain) | quote }}

            # GIBSON_PUBLIC_URL — required by the dashboard's env-validator
            # (src/lib/env-validator.ts). Surfaced to agents/tools/plugins via
            # /api/config/public; matches GIBSON_PLATFORM_PUBLIC_URL in
            # practice. Kept as a distinct env name for the wizard's mental
            # model.
            - name: GIBSON_PUBLIC_URL
              value: {{ .Values.dashboard.gibsonPlatformPublicUrl | default (include "gibson.apiOrigin" .) | quote }}

            # Neo4j connection URI for the dashboard knowledge-graph client.
            # Required — the dashboard Neo4j driver uses this at startup.
            - name: NEO4J_URI
              value: {{ .Values.dashboard.neo4j.uri | default (printf "bolt://%s-neo4j:7687" .Release.Name) | quote }}
            - name: NEO4J_USER
              value: {{ .Values.dashboard.neo4j.user | default "neo4j" | quote }}
            # one-code-path #203: was `optional: true`. The
            # wait-for-db-secrets init container above blocks pod start
            # until the Secret is materialised by ESO.
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databases.existingSecret | default (include "gibson.dbSecrets.name" .) }}
                  key: NEO4J_PASSWORD

            # Database URL for the dashboard (Auth.js adapter + tenant
            # provisioning state, rate-limit / lockout counters via
            # daemon's gibson_platform schema). Wired through the
            # gibson.platformPostgres helper family — Phase 2 of spec
            # helm-eks-readiness-and-pg-split. In dev the helper resolves
            # to the existing dashboard-postgresql alias; in prod it points
            # at RDS via platformPostgres.external.host.
            {{- if .Values.dashboard.postgres.enabled }}
            - name: DASHBOARD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gibson.platformPostgres.passwordSecretName" . }}
                  key: {{ include "gibson.platformPostgres.passwordSecretKey" . }}
            - name: DATABASE_URL
              value: {{ printf "postgres://%s:$(DASHBOARD_DB_PASSWORD)@%s:%v/%s?sslmode=%s"
                (include "gibson.platformPostgres.username" .)
                (include "gibson.platformPostgres.host" .)
                (include "gibson.platformPostgres.port" .)
                (include "gibson.platformPostgres.database" .)
                (include "gibson.platformPostgres.sslMode" .) }}
            {{- end }}

            # NO REDIS_URL and NO REDIS_PASSWORD. The dashboard does not speak to
            # Redis: at v0.127.2 it carries no redis client dependency of any
            # kind, imports none, and the only occurrence of REDIS_URL in the
            # whole repository is the FORBIDDEN-name list in
            # scripts/check-no-secrets-in-client.mjs, which is a prohibition and
            # not a reader.
            #
            # The comment here used to describe onboarding state, rate-limiter
            # keys, account-lockout counters and the Stripe webhook idempotency
            # table, and claimed the pod "fails boot when REDIS_URL is
            # unreachable". That is the daemon's Redis, not the dashboard's.
            # REDIS_PASSWORD existed only so kubelet could expand it inside
            # REDIS_URL, so it goes with it — and with it goes a Secret read this
            # pod had no use for.

            # Optional: Observability
            {{- if .Values.dashboard.observability.enabled }}
            - name: LOG_LEVEL
              value: {{ .Values.dashboard.logLevel | default "info" }}
            {{- end }}

            # Debug mode: surfaces full error stacks in API responses, raises
            # Auth.js log level, and powers the /api/debug/recent-errors
            # ring buffer + the in-page DebugErrorPanel.
            {{- if .Values.dashboard.debug }}
            - name: DASHBOARD_DEBUG
              value: "1"
            - name: NEXT_PUBLIC_DASHBOARD_DEBUG
              value: "1"
            {{- end }}

            # SA_IDENTITY_MAP_PATH points the in-process identity-resolver
            # helper at the JSON map for log enrichment ONLY — never an auth
            # decision (vitest visibility test pins the importer paths).
            - name: SA_IDENTITY_MAP_PATH
              value: "/shared/sa-identity-map.json"

            # -----------------------------------------------------------------
            # Dashboard auth-hardening controls (spec: auth-flow-hardening).
            # Populated from .Values.dashboard.auth.*.  Sensitive values
            # (captcha secret, email credentials) are pulled from the
            # gibson-dashboard-secrets Secret; public values ride as plain
            # env so the browser bundle can read NEXT_PUBLIC_* at runtime.
            # -----------------------------------------------------------------
            {{- with .Values.dashboard.auth }}
            - name: DASHBOARD_HIBP_ENABLED
              value: {{ .hibp.enabled | default false | quote }}

            - name: DASHBOARD_CAPTCHA_PROVIDER
              value: {{ .captcha.provider | default "disabled" | quote }}
            - name: DASHBOARD_CAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gibson.dashboardSecrets.name" $ }}
                  key: captcha-secret-key

            {{- /*
              THE DASHBOARD SENDS NO MAIL, so it takes no mail configuration
              (dashboard#181). src/lib/email is deleted, along with nodemailer,
              resend and @aws-sdk/client-ses. Nine env vars and three Secret
              keys came out with it: DASHBOARD_EMAIL_PROVIDER, _FROM,
              _RESEND_API_KEY, _SMTP_FROM, _SMTP_HOST, _SMTP_PORT, _SMTP_USER,
              _SMTP_PASS and CONTACT_SALES_INBOX.

              Who does send mail: the daemon sends signup verification and
              invitations, and Zitadel owns password reset and its own address
              verification. One mail transport per install, and the dashboard
              was never on it — the chart carried a provider knob, an SMTP host,
              a port and two credentials for a sender that did not exist.
            */}}
            {{- end }}

            {{- /*
              HSTS is a real-cert concern. Behind a self-signed edge (kind /
              self-hosted before a trusted cert), emitting Strict-Transport-Security
              pins *.<domain> in the browser and then bricks it (the self-signed
              cert is refused with no bypass). Disable HSTS whenever the edge is
              self-signed; real-cert deployments (prod, or self-hosted with a
              trusted cert) leave hstsDisabled false and keep HSTS strict.
            */}}
            {{- if .Values.dashboard.hstsDisabled }}
            - name: DASHBOARD_HSTS_DISABLED
              value: "1"
            {{- end }}
            {{- /* The account link of the billing component (ADR-0060,
                   charts#375). Both keys or neither: the dashboard stops at
                   boot on half a pair, so the render fails first. The
                   dashboard reads no Stripe value and no PUBLIC_URL
                   (dashboard#256). */}}
            {{- with .Values.dashboard.accountLink }}
            {{- if or .url .label }}
            {{- if not (and .url .label) }}
            {{- fail "dashboard.accountLink.url and dashboard.accountLink.label are set together or not at all (charts#375)" }}
            {{- end }}
            - name: DASHBOARD_ACCOUNT_URL
              value: {{ .url | quote }}
            - name: DASHBOARD_ACCOUNT_LINK_LABEL
              value: {{ .label | quote }}
            {{- end }}
            {{- end }}
            {{- /* The texts of the signup step of the billing component
                   (ADR-0060, charts#375). All six or none: the dashboard
                   stops at boot on a partial group. */}}
            {{- $st := .Values.dashboard.signupStep | default dict }}
            {{- $stKeys := list "title" "text" "buttonLabel" "waitingText" "failureText" "retryLabel" }}
            {{- $stSet := 0 }}
            {{- range $k := $stKeys }}{{- if get $st $k }}{{- $stSet = add1 $stSet }}{{- end }}{{- end }}
            {{- if and (gt $stSet 0) (lt $stSet 6) }}
            {{- fail "dashboard.signupStep: set all six texts or none (title, text, buttonLabel, waitingText, failureText, retryLabel) (charts#375)" }}
            {{- end }}
            {{- if eq $stSet 6 }}
            - name: DASHBOARD_SIGNUP_STEP_TITLE
              value: {{ $st.title | quote }}
            - name: DASHBOARD_SIGNUP_STEP_TEXT
              value: {{ $st.text | quote }}
            - name: DASHBOARD_SIGNUP_STEP_BUTTON_LABEL
              value: {{ $st.buttonLabel | quote }}
            - name: DASHBOARD_SIGNUP_STEP_WAITING_TEXT
              value: {{ $st.waitingText | quote }}
            - name: DASHBOARD_SIGNUP_STEP_FAILURE_TEXT
              value: {{ $st.failureText | quote }}
            - name: DASHBOARD_SIGNUP_STEP_RETRY_LABEL
              value: {{ $st.retryLabel | quote }}
            {{- end }}

          # one-code-path #203: was `optional: true`. The chart renders
          # the dashboard-config ConfigMap unconditionally, so the
          # ConfigMap is always present at install time; no init
          # container is needed.
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-dashboard-config
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            # Next.js writes only its image cache (/app/.next/cache) and /tmp,
            # both emptyDir volumes. Measured with docker on the image: no
            # write to the root at start or on a request.
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001  # nextjs user from Dockerfile
            capabilities:
              drop:
                - ALL
          # Per epic one-code-path (deploy#186), slice deploy#196 + #200:
          # the shared-identity + envoy-ca mounts are unconditional —
          # Zitadel + Envoy are structurally required, so the
          # resolve-sa-identity-map init container always runs and the
          # dashboard reads /shared/sa-identity-map.json for log enrichment.
          volumeMounts:
            {{- if eq (include "gibson.envoyEdge.caRequired" .) "true" }}
            - name: envoy-ca
              mountPath: /etc/ssl/envoy-ca
              readOnly: true
            {{- end }}
            # SPIRE agent socket — matches SPIFFE_ENDPOINT_SOCKET above.
            # Without this the wait-for-spire-socket init container gated the
            # Pod on a socket the dashboard container could not then reach
            # (deploy#1532). Same mountPath as every other SPIFFE consumer in
            # the chart (daemon, ext-authz, envoy, both operators).
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # Spec: canonical-service-identity Req 5 — populated by
            # resolve-sa-identity-map init container.
            - name: shared-identity
              mountPath: /shared
              readOnly: true
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- /* deploy#201: SPIRE is REQUIRED — the wait-for-spire-socket init
               container above is this volume's ONLY mounter. The `dashboard`
               container does not mount it, and the spiffe-helper sidecar that
               was to have been the second mounter never rendered (its template
               was defined and never invoked; deleted by deploy#1456). Keep the
               volume: without it the deploy#201 node-readiness gate cannot
               run. */}}
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        {{- if eq (include "gibson.envoyEdge.caRequired" .) "true" }}
        - name: envoy-ca
          secret:
            secretName: {{ required "envoy.tls.secretName is REQUIRED — see deploy#200." .Values.envoy.tls.secretName }}
            # Mount the CA cert (signed by cert-manager in envoy-cert-unify)
            # AND the leaf for completeness. Node trusts NODE_EXTRA_CA_CERTS
            # pointed at ca.crt; the leaf is harmless and lets in-pod
            # debugging inspect the chain. Key (tls.key) is NOT projected —
            # only envoy holds it. Volume renders only when the Envoy edge
            # CA is NOT in the system trust bundle (deploy#126).
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
            defaultMode: 0444
        {{- end }}
        # Per epic one-code-path (deploy#186), slice deploy#196: Zitadel
        # volumes are unconditional. The OIDC client Secret + SA identity
        # ConfigMap retain `optional: true` ONLY as the kubelet's
        # projection contract during the bootstrap-Job window — the
        # init containers above block dashboard startup until the files
        # populate, so a never-running bootstrap Job surfaces as a stuck
        # init container with a clear error, not as a "client_id is empty"
        # silent OIDC failure. TODO(deploy#203): drop `optional: true`
        # once bootstrap-Job sequencing is a hard pre-install dependency.
        - name: zitadel-client
          secret:
            secretName: gibson-dashboard-oidc
            # allowlist (one-code-path #203): VOLUME-level optional, not
            # env-level. Slice #203 scope is env `valueFrom.*Ref` only;
            # the wait-for-zitadel-client init container above blocks pod
            # start until kubelet populates client_id + client_secret in
            # this mount, so the pod never runs main containers with an
            # unmaterialised mount.
            optional: true
            defaultMode: 0444
        # Spec: canonical-service-identity Req 5.
        # gibson-sa-identity-map projection: kubelet writes one file per
        # ConfigMap key (readable SA name) with the value (numeric sub) as
        # the file content. The resolve-sa-identity-map init container
        # iterates these files and produces the consumed outputs in
        # /shared/.
        - name: sa-identity-map
          configMap:
            name: gibson-sa-identity-map
            # allowlist (one-code-path #203): VOLUME-level optional, not
            # env-level. Slice #203 scope is env `valueFrom.*Ref` only;
            # the resolve-sa-identity-map init container above handles
            # the not-yet-populated case (Spec canonical-service-identity
            # Req 5).
            optional: true
            defaultMode: 0444
        - name: shared-identity
          emptyDir: {}
{{/*
  ClusterSPIFFEID for the dashboard pod is rendered centrally in
  templates/spire-server/clusterspiffeids.yaml (Phase H/8.1) — one source of
  truth for every Gibson workload identity. Do not re-add gibson.spiffeID
  here.
*/}}
