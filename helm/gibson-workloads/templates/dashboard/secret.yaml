{{- /*
Dashboard runtime secrets — ESO-managed (deploy / PRD deploy#255).

Materialises five keys consumed by the dashboard Pod's env:
  - auth-secret                          Auth.js HMAC (48-char random)
  - next-server-actions-encryption-key   Next.js Server Actions encryption (32-char random)
  - captcha-secret-key                   captcha provider secret (empty when captcha.provider=disabled)
  - email-resend-api-key                 Resend SMTP key (empty when email.provider=log)
  - email-smtp-password                  generic SMTP password (empty when email.provider=log)

Previously rendered in-chart with a `lookup`-then-`randAlphaNum` idiom for
the first two keys. That pattern is broken under Argo's repo-server (offline
`helm template`, `lookup` always returns nil), so every reconcile re-minted
the random and ServerSideApply rewrote the Secret — Auth.js sessions stopped
decoding and pending Server Action POSTs returned "Failed to find Server
Action" until clients hard-refreshed. deploy codifies the rule:
chart templates declare ExternalSecrets, not Secrets.

The five keys are sourced from OpenBao through the one `gibson-secrets`
ClusterSecretStore, on every profile. Operators rotate with
`scripts/vanilla-set-secret.sh`; ESO syncs within refreshInterval; consumer Pods roll
via Stakater Reloader (slice S7, deploy#263).

dashboard is structural infrastructure (one-code-path / deploy#188).
The previous outer `.Values.dashboard.enabled` gate has been deleted —
the dashboard's ExternalSecret renders unconditionally.
*/}}
{{- $eso := .Values.externalSecrets }}
{{- $store := $eso.clusterSecretStore.name | default "gibson-secrets" }}
{{- $refresh := $eso.refreshInterval | default "60s" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gibson.dashboardSecrets.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gibson.dashboardSecrets.name" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        auth-secret: "{{ `{{ .auth_secret }}` }}"
        next-server-actions-encryption-key: "{{ `{{ .server_actions_key }}` }}"
        captcha-secret-key: "{{ `{{ .captcha_secret_key }}` }}"
        email-resend-api-key: "{{ `{{ .email_resend_api_key }}` }}"
        email-smtp-password: "{{ `{{ .email_smtp_password }}` }}"
  data:
    - secretKey: auth_secret
      remoteRef: { key: gibson-dashboard-session-secrets, property: auth_secret }
    - secretKey: server_actions_key
      remoteRef: { key: gibson-dashboard-session-secrets, property: server_actions_key }
    - secretKey: captcha_secret_key
      remoteRef: { key: gibson-dashboard-auth-hardening, property: captcha_secret_key }
    - secretKey: email_resend_api_key
      remoteRef: { key: gibson-dashboard-auth-hardening, property: email_resend_api_key }
    - secretKey: email_smtp_password
      remoteRef: { key: gibson-dashboard-auth-hardening, property: email_smtp_password }
