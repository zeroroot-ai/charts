{{/* Dashboard HorizontalPodAutoscaler (Week 2 §3 R10).

     dashboard is structural infrastructure (one-code-path / deploy#188).
     The previous outer `.Values.dashboard.enabled` gate has been deleted;
     the inner `autoscaling.enabled` sub-feature flag is preserved
     (legitimate sub-feature toggle). */}}
{{- if (default false ((.Values.dashboard.autoscaling).enabled)) }}
{{- $hpa := .Values.dashboard.autoscaling }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-dashboard
  minReplicas: {{ $hpa.minReplicas | default 2 }}
  maxReplicas: {{ $hpa.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilization | default 70 }}
    {{- if $hpa.targetMemoryUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetMemoryUtilization }}
    {{- end }}
{{- end }}
