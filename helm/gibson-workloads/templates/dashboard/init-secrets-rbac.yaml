{{- /*
  The dashboard's init containers read three Secrets through the API before
  the app starts: wait-for-db-secrets (the DB credentials Secret) and
  wait-for-stripe-secrets
  (the two Stripe refs, only when billing names them). Each runs `kubectl get
  secret` under the dashboard ServiceAccount and exits 1 after 60 s without
  the read, so the pod sits Init:CrashLoopBackOff and the platform never
  converges.

  charts#116 removed the cluster-wide `get` on every Secret that used to
  carry this, on the reading that nothing in the dashboard reads a Secret
  through the API. The init containers do. This Role grants `get` on exactly
  those Secrets, by name, in the release namespace, and nothing else: no
  list, no watch, no other name. #116's intent stands. check-workload-rbac.py
  keys the grant by a digest over these rules, resourceNames included, so
  adding a name or a verb is a reviewed edit to helm/gibson/rbac-allowlist.yaml.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gibson-dashboard-init-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gibson-dashboard
    app.kubernetes.io/part-of: gibson
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - {{ .Values.secrets.databases.existingSecret | default (include "gibson.dbSecrets.name" .) | quote }}
      {{- with .Values.dashboard.billing }}
      {{- if .stripeSecretKeySecretRef }}
      - {{ .stripeSecretKeySecretRef | quote }}
      {{- end }}
      {{- if and .stripeWebhookSecretSecretRef (ne .stripeWebhookSecretSecretRef .stripeSecretKeySecretRef) }}
      - {{ .stripeWebhookSecretSecretRef | quote }}
      {{- end }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gibson-dashboard-init-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gibson-dashboard
    app.kubernetes.io/part-of: gibson
subjects:
  - kind: ServiceAccount
    name: {{ .Values.dashboard.serviceAccount.name | default "gibson-dashboard" }}
    namespace: {{ .Values.dashboard.namespace | default "gibson" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gibson-dashboard-init-secrets
