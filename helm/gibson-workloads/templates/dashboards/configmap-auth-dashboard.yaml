{{- /*
Grafana dashboard ConfigMap for the auth surface.

The dashboard JSON lives at `dashboards/auth.json` at the chart root and is
loaded via `.Files.Get` so it can be edited with a JSON-aware editor (linting,
schema validation) without embedding the payload inline in YAML.

The `grafana_dashboard: "1"` label is Grafana's sidecar-discovery convention
(kiwigrid/k8s-sidecar, used by kube-prometheus-stack and the Grafana Helm
chart). This makes the ConfigMap pick-up-able by a Grafana sidecar when one is
added without needing to wire the JSON into the existing volume-mounted
`-dashboards` ConfigMap.

See: https://grafana.com/docs/grafana/latest/setup-grafana/installation/kubernetes/#sidecar-for-dashboards
*/ -}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gibson.grafana.host" . }}-auth-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "/var/lib/grafana/dashboards/gibson"
data:
  auth.json: |-
{{ .Files.Get "dashboards/auth.json" | indent 4 }}
{{- end }}
