{{- /*
Who may write a belief trainer pod in a tenant namespace (gibson#1170).

The tenant-operator registers the trainer identity of tenant <t>
(spiffe://<td>/trainer/<t>) for the pods of tenant-<t> with the label
app.kubernetes.io/component=belief-trainer and the ServiceAccount
gibson-belief-trainer (gibson#1164). Each of those facts comes from the pod
object, so a principal that can write a pod or a workload in tenant-<t> could
claim that identity, and with it read the training data of the tenant and
store a belief version. This policy closes each hop of the one legitimate
path, CronJob, then Job, then Pod:

  CronJob      only the tenant-operator writes one that claims the trainer.
  Job          only cronjob-controller, or a cluster admin (system:masters,
               for a manual run with `kubectl create job --from`), creates one
               that claims the trainer.
  Pod          only job-controller creates one that claims the trainer.
  Deployment, ReplicaSet, StatefulSet, DaemonSet
               nobody writes one that claims the trainer.

An object claims the trainer when its pod (or pod template) has the trainer
component label or the trainer ServiceAccount. Any other object passes. The
garbage collector may UPDATE an object. A pod UPDATE is not matched. An
UPDATE can add the trainer label to a pod, but it cannot change the
serviceAccountName, and the registration also selects the trainer
ServiceAccount. So a relabeled pod still gets no trainer identity. A plugin
namespace
(tenant-<t>-plugins) has its own policy, gibson-tenant-plugin-workloads.
*/ -}}
{{- $ns := .Values.tenantOperator.namespace | default "gibson" }}
{{- $operator := printf "system:serviceaccount:%s:gibson-tenant-operator" $ns }}
{{- $gc := "system:serviceaccount:kube-system:generic-garbage-collector" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gibson-tenant-trainer-workloads
  labels:
    app.kubernetes.io/name: gibson-tenant-operator
    app.kubernetes.io/part-of: gibson
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: tenant-namespace
      expression: >-
        request.namespace.startsWith('tenant-') && !request.namespace.endsWith('-plugins')
  variables:
    - name: user
      expression: request.userInfo.username
    - name: resource
      expression: request.resource.resource
    - name: gcUpdate
      expression: >-
        request.operation == 'UPDATE' && variables.user == {{ $gc | quote }}
    # The pod spec and its labels: the object itself for a pod, the job
    # template for a CronJob, the pod template for each other kind.
    - name: podMeta
      expression: >-
        variables.resource == 'pods' ? object.metadata :
        variables.resource == 'cronjobs'
          ? (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template)
              && has(object.spec.jobTemplate.spec.template.metadata) ? object.spec.jobTemplate.spec.template.metadata : {})
          : (has(object.spec.template) && has(object.spec.template.metadata) ? object.spec.template.metadata : {})
    - name: podSpec
      expression: >-
        variables.resource == 'pods' ? object.spec :
        variables.resource == 'cronjobs'
          ? (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template)
              && has(object.spec.jobTemplate.spec.template.spec) ? object.spec.jobTemplate.spec.template.spec : {})
          : (has(object.spec.template) && has(object.spec.template.spec) ? object.spec.template.spec : {})
    - name: claims
      expression: >-
        (has(variables.podMeta.labels) && 'app.kubernetes.io/component' in variables.podMeta.labels
          && variables.podMeta.labels['app.kubernetes.io/component'] == 'belief-trainer')
        || (has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName == 'gibson-belief-trainer')
  validations:
    - expression: >-
        !variables.claims || variables.gcUpdate
          || (variables.resource == 'cronjobs' && variables.user == {{ $operator | quote }})
          || (variables.resource == 'jobs' && (variables.user == 'system:serviceaccount:kube-system:cronjob-controller'
                || 'system:masters' in request.userInfo.groups))
          || (variables.resource == 'pods' && variables.user == 'system:serviceaccount:kube-system:job-controller')
      reason: Forbidden
      messageExpression: >-
        'in a tenant namespace only the tenant-operator writes the belief trainer CronJob, and only the' +
        ' built-in controllers derive its Job and pods; ' + variables.user + ' may not write a ' +
        variables.resource + ' that claims the trainer identity in ' + request.namespace + ' (gibson#1170)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gibson-tenant-trainer-workloads
  labels:
    app.kubernetes.io/name: gibson-tenant-operator
    app.kubernetes.io/part-of: gibson
spec:
  policyName: gibson-tenant-trainer-workloads
  validationActions: ["Deny"]
