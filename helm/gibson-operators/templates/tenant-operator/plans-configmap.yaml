{{- /*
  tenant-operator is structural infrastructure (one-code-path). The
  previous outer `.Values.tenantOperator.enabled` gate has been deleted —
  the plans ConfigMap renders unconditionally.
*/}}
# gibson-tenant-operator-plans — the plan registry, rendered from the
# chart-local files/plans.yaml at chart render time via `.Files.Get`. No gibson
# component reads it (gibson#1525). Its one reader in a cluster is the billing
# webhook of the private billing component (hosted
# gitops/saas-overlay/billing-webhook), which reads the Stripe lookup key and
# the trial days of a plan. It goes with the card step (gibson#1527). The www
# and dashboard generators read files/plans.yaml from this repository.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.tenantOperator.plans.configMapName | default "gibson-tenant-operator-plans" }}
  namespace: {{ .Values.tenantOperator.namespace | default "gibson" }}
  labels:
    app.kubernetes.io/name: gibson-tenant-operator
    app.kubernetes.io/part-of: gibson
    app.kubernetes.io/component: tenant-operator
data:
  plans.yaml: |-
{{ .Files.Get (.Values.tenantOperator.plans.sourcePath | default "files/plans.yaml") | indent 4 }}
