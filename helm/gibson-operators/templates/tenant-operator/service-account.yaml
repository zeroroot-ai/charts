{{- /*
  tenant-operator is structural infrastructure (one-code-path /
  deploy#188). The previous outer `.Values.tenantOperator.enabled`
  gate has been deleted — the operator's ServiceAccount renders
  unconditionally.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gibson-tenant-operator
  namespace: {{ .Values.tenantOperator.namespace | default "gibson" }}
  labels:
    app.kubernetes.io/name: gibson-tenant-operator
    app.kubernetes.io/part-of: gibson
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.tenantOperator.serviceAccount.annotations }}
  annotations:
    {{- include "gibson.irsaAnnotations" . | nindent 4 }}
  {{- end }}
