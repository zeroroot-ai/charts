{{/* platform-operator NetworkPolicy (deploy#1365). Unlike the
     tenant-operator, the platform-operator serves NO admission webhook —
     its only listeners are metrics (:8080) and health probes (:8081;
     kubelet probes are always permitted by the CNI's node-local
     allowance). Ingress is therefore scrapers-only. Egress names each peer
     (charts#396, ADR-0165 rule 4): cluster DNS, the API server, Zitadel on
     its Service port (ZITADEL_URL, ADR-0092) and OpenBao (VAULT_ADDR). The
     operator reaches no host outside the cluster.

     platform-operator is structural infrastructure (one-code-path /
     deploy#188); the inner `networkPolicy.enabled` sub-feature flag
     matches the tenant-operator policy's shape. */}}
{{- if ne (include "gibson.trueUnlessSet" (((.Values.platformOperator).networkPolicy).enabled)) "false" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-20"  # every NetworkPolicy applies before any hook Job (check-netpol-before-hooks.py)
  name: {{ .Release.Name }}-platform-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: platform-operator
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- include "gibson.netpolEgressDNS" . | nindent 4 }}
    {{- include "gibson.netpolEgressAPIServer" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
              app.kubernetes.io/component: start
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: openbao
      ports:
        - protocol: TCP
          port: 8200
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
        - podSelector:
            matchLabels:
              app: grafana-agent
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
