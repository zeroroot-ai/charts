{{/* Reloader NetworkPolicy (deploy#1365). Reloader is a pure
     kube-apiserver client (watches Secrets/ConfigMaps, patches
     workloads); it accepts nothing but metrics scrapes on :9090.
     Egress names its two peers (charts#396, ADR-0165 rule 4): cluster DNS
     and the API server addresses of global.networkPolicy.apiServerCIDRs.
     It reaches no host outside the cluster. */}}
{{- if ne (include "gibson.trueUnlessSet" (((.Values.reloader).networkPolicy).enabled)) "false" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-20"  # every NetworkPolicy applies before any hook Job (check-netpol-before-hooks.py)
  name: {{ .Release.Name }}-reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: reloader
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reloader
      app.kubernetes.io/component: reloader
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- include "gibson.netpolEgressDNS" . | nindent 4 }}
    {{- include "gibson.netpolEgressAPIServer" . | nindent 4 }}
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
        - podSelector:
            matchLabels:
              app: grafana-agent
      ports:
        - protocol: TCP
          port: 9090
{{- end }}
