{{- /*
  connector-operator is structural infrastructure (one-code-path /
  deploy#188). It reconciles ConnectorInstance CRs into ToolHive
  resources + ExternalSecrets; without it no connector
  can reconcile. There is deliberately NO `.enabled` toggle — the SA renders
  unconditionally.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.connectorOperator.serviceAccount.name | default "gibson-connector-operator" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gibson-connector-operator
    app.kubernetes.io/part-of: gibson
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.connectorOperator.serviceAccount.annotations }}
  annotations:
    {{- include "gibson.irsaAnnotations" . | nindent 4 }}
  {{- end }}
