# The plan of the hosted service. There is one plan, and it sets no limit on a
# tenant (gibson#1525).
#
# Readers:
#   - the billing webhook of the private billing component, through the
#     ConfigMap gibson-tenant-operator-plans. The signup step reads the Stripe
#     lookup key and the trial days of the plan that a signup names.
#   - the gen-plans generators of www and dashboard, which render the price.
#
# Fields:
#   - id              : the plan id. Billing resolves a signup by this id.
#   - displayName     : the name on the price page
#   - tagline         : short text on the price page
#   - pricing         : { monthlyUSD?, annualUSD?, annualSavingsPct?, contactSales? }
#   - stripeProductId : the Stripe product id
#   - lookupKey       : the Stripe price lookup key. It is the same in every
#                       Stripe account and in test and live mode.
#   - trialDays       : the trial length of the card step at signup
version: v1
plans:
  - id: team
    displayName: Gibson
    tagline: One plan with no limits. Fix flaws at the speed AI finds them, and break nothing.
    pricing:
      monthlyUSD: 799
    stripeProductId: prod_UUghrBirQfk8sn
    lookupKey: gibson_team_monthly_usd
    trialDays: 14
