# =============================================================================
# secret-contract.yaml: the one secret contract of the chart (charts#433).
#
# It maps each secret to its keys, its producer and its consumers. It moved
# here from zeroroot-ai/hosted, because it describes the chart. hosted vendors
# this file at the pinned chart version. It ships in each release of the
# umbrella chart at gibson/secret-contract.yaml.
#
# It is also the one list of the Secrets and ConfigMaps that a runtime actor
# writes and no chart object renders: `producers`, `sharedWriters` and
# `configMapProducers` at the end. That list was helm/gibson/
# secret-producers.yaml.
#
# Three guards read it:
#
#   make secret-contract   scripts/check-secret-contract.py. Every backend key
#                          an ExternalSecret reads is declared, every seeded
#                          key is declared, each entry has a real producer and
#                          a real consumer, both directions.
#   make secret-plumbing   scripts/check-secret-plumbing.py. Every Secret a
#                          workload names is rendered or listed under
#                          operator_produced.
#   make reloader-names    scripts/check-reloader-names.py. Every name a
#                          Reloader annotation watches is rendered or listed.
#
# Backend secret names are flat, on every profile. The platform's own OpenBao
# is the one External Secrets backend (ADR-0083): every key lives at
# `secret/data/<key>` in the kv v2 mount `secret`, with no prefix. The seed
# contract is helm/gibson-workloads/files/openbao-seed-keys.txt.
#
# Producers:
#   openbao-seeder     a key in openbao-seed-keys.txt, reconciled into OpenBao
#                      by the openbao-auto-init sidecar on every start.
#   operator-supplied  a key an operator writes into the platform OpenBao KV
#                      (scripts/baseline-set-secret.sh); nothing seeds it.
#   operator           minted at runtime by an operator reconcile, ours or a
#                      vendored one (NOT an ExternalSecret).
#   bringup            written by the bringup before the chart installs.
#   bringup-job        minted at runtime by a chart bringup Job.
#   cert-manager       issued at runtime by a chart-rendered Certificate.
#
# Consumers: `chart:<chart>/<purpose>` for a chart ExternalSecret or mount,
# `runtime:<component>` for a direct runtime read, `chart-gate:<make target>`
# for an object that renders only under a values condition (the target must
# exist in the Makefile), and `gitops:<app>` or `staging:<app>` for a consumer
# in zeroroot-ai/hosted. This repo cannot read hosted, so a hosted consumer is
# checked there, by the vendored copy of this file.
# =============================================================================

secrets:
  # --- openbao-seeder (openbao-seed-keys.txt, one entry per key) ------------
  #
  # The six per-DB Postgres passwords. CNPG platform-postgres serves every
  # database (ADR-0083, deploy#1730); the chart's db-bootstrap creates the
  # roles with these passwords and ESO projects them to the workloads.
  #
  # NOTE: the doubled gibson- prefix on the platform password is a known wart
  # matching what the seed table mints, so every profile behaves the same.
  # Unifying to single-prefix (gibson-platform-postgres-password) is a
  # coordinated reseed across the seed table + chart template + this entry —
  # tracked in deploy#965.
  - name: gibson-gibson-platform-postgres-password
    keys: [password]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/platform-postgres-credentials]
  - name: gibson-dashboard-postgres-password
    keys: [password]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/db-secrets]
  - name: gibson-tenant-admin-postgres-password
    keys: [password]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/db-secrets]
  - name: gibson-zitadel-postgres-password
    keys: [password]
    producer: openbao-seeder
    consumers: [chart:gibson/zitadel-postgres-credentials]
  - name: gibson-openfga-postgres-password
    keys: [password]
    producer: openbao-seeder
    consumers: [chart:gibson/openfga-postgres-credentials]
  - name: gibson-spire-postgres-password
    keys: [password]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/db-secrets, chart:gibson/spire-postgres-credentials]
  - name: gibson-neo4j-password
    keys: [password]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/db-secrets, chart:gibson/gibson-neo4j-auth]
  - name: gibson-redis-password
    keys: [password]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/redis-stack]
  # Zitadel's symmetric encryption root key — it encrypts every IdP secret at
  # rest, so it must never change once an environment holds data. The seeder
  # writes it once and never overwrites (deploy#1732), which is the property
  # that protects it. LENGTH: Zitadel requires exactly 32 characters; the
  # binding ExternalSecret
  # (gibson-workloads/templates/external-secrets/zitadel-masterkey-externalsecret.yaml)
  # materialises K8s Secret `gibson-zitadel-masterkey` (key `masterkey`)
  # referenced by the umbrella's `zitadel.zitadel.masterkeySecretName`.
  - name: zitadel-masterkey
    keys: [value]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/zitadel-masterkey]
  # Shared HMAC secret gating TenantProvisioningService.SetTenantBillingActive
  # (gibson#1230 / gibson#1270, deploy#1314). The daemon reads it from
  # GIBSON_BILLING_WEBHOOK_SECRET and FAILS CLOSED with no secret. Both ends
  # of the hop (the daemon AND whichever workload calls the RPC — see
  # dashboard#1016) MUST hold the SAME value. DISTINCT from
  # gibson-stripe-credentials.webhook_secret (the Stripe whsec_ signing
  # secret): internal platform material with no external source of truth, so
  # the seeder mints it and there is nothing to paste in.
  - name: gibson-billing-webhook-secret
    keys: [secret]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/billing-webhook-secret]
  - name: gibson-dashboard-session-secrets
    keys: [auth_secret, server_actions_key]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/dashboard-secrets]
  # Capability-Grant JWT signing key (GHSA-3957, gibson#1288). Its own key,
  # with its own lifecycle. `key` must decode to exactly 32 bytes; `kid` and
  # `key` live in ONE secret so ESO swaps them atomically — a kid that
  # refreshes independently of its material is a verification outage.
  - name: gibson-cg-signing-key
    keys: [kid, key]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/cg-signing-key]
  - name: gibson-extauthz-grant-current
    keys: [pem, kid]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/extauthz-grant-key]
  - name: gibson-extauthz-grant-previous
    keys: [pem, kid]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/extauthz-grant-key]
  - name: gibson-zitadel-system-bot-key
    keys: [private_key, public_key]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/zitadel-system-key]
  # Minted once by the Zitadel setup Job, then escrowed into the platform
  # OpenBao KV by the iam-admin-pat-escrow Job
  # (charts helm/gibson/templates/jobs/gibson-workloads-iam-admin-pat-escrow.yaml,
  # guarded by charts scripts/check-iam-admin-pat-escrow.sh). The chart reads
  # all three back as Orphan ExternalSecrets, so each is a real consumer even
  # though nothing seeds the key. Declared here because the forward assertion
  # found them undeclared: three ExternalSecrets depended on backend keys the
  # contract did not own (hosted#350).
  - name: gibson-zitadel-iam-admin-pat
    keys: [pat]
    producer: bringup-job
    consumers: [chart:gibson-workloads/iam-admin-pat]
  - name: gibson-zitadel-iam-admin-machinekey
    keys: [machinekey]
    producer: bringup-job
    consumers: [chart:gibson-workloads/iam-admin]
  - name: gibson-zitadel-login-client-pat
    keys: [pat]
    producer: bringup-job
    consumers: [chart:gibson-workloads/login-client]
  # Seeded from the bringup keyring member GHCR_PULL_TOKEN (seed kind
  # `input`). OpenBao holds {"pat": …}; the chart's ghcr-credentials
  # ExternalSecret reads property `pat` and renders the .dockerconfigjson K8s
  # Secret from it. Hinting .dockerconfigjson here once produced a hand-seeded
  # secret ESO could not resolve -> 401 image-pull loop.
  - name: ghcr-pull-secret
    keys: [pat]
    producer: openbao-seeder
    consumers: [chart:gibson/ghcr-credentials, gitops:image-pull]
  # All three values are feature-gated (captcha.provider defaults to
  # "disabled"; email provider selects which credential is read), so the
  # seeded empty strings are a legitimate deployable state. An operator fills
  # a value in with scripts/baseline-set-secret.sh when the feature turns on.
  - name: gibson-dashboard-auth-hardening
    keys: [captcha_secret_key, email_resend_api_key, email_smtp_password]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/dashboard-secrets]
  # Seeded as pk_test/sk_test/whsec_ placeholders; the operator supplies real
  # material per environment (scripts/stripe-webhook-preflight.sh names the
  # property).
  - name: gibson-stripe-credentials
    keys: [secret_key, webhook_secret, publishable_key]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/stripe-credentials]
  # The SMTP relay credential. Stage 0 mints it (substrate/gibson-bootstrap on AWS,
  # the SES SMTP IAM user) and it reaches OpenBao as an operator-supplied
  # value over the seeded empty strings; the chart's email-smtp
  # ExternalSecret projects it to the daemon (signup verification mail).
  - name: ses-smtp-credentials
    keys: [username, password]
    producer: openbao-seeder
    # chart-gate, not chart:. The ExternalSecret that reads this key renders only
    # when gibson.email.smtp.externalSecret.enabled is true AND
    # gibson.email.provider is smtp, and no committed golden sets either, so this
    # gate cannot see it. Until charts#329 the assertion was passing on the
    # DASHBOARD's ExternalSecret, which read the same key for a mailer the
    # dashboard did not have: the real consumer was never visible and the
    # declaration was satisfied by accident. `make email-smtp-external-secret` in
    # zeroroot-ai/charts renders all three states and asserts them.
    consumers: [chart-gate:email-smtp-external-secret]
  # The RENEWABLE SERVICE TOKEN (policies=["root"], period=1h,
  # no_parent=true) the openbao-auto-init sidecar mints; the initial root is
  # revoked at the end of bootstrap on every profile (deploy#1731). Seed kind
  # `svctoken` — the sidecar keeps this key in lockstep with the token it
  # holds.
  - name: gibson-vault-admin-token
    keys: [token]
    producer: openbao-seeder
    consumers: [chart:gibson-workloads/openbao-keys]

  # --- operator-supplied (a key written by hand into the OpenBao KV) --------
  #
  # Rotation slot for the CG signing key. EMPTY in steady state, and NOT
  # projected into the cluster unless gibson.cgSigningKey.rotationWindow is
  # true — the daemon treats a previous.kid file that exists but is empty as
  # a broken mount and disables capability grants entirely. The slot is
  # filled by the rotation runbook from the outgoing current key
  # (docs/runbooks/cg-signing-key-rotation.md) and emptied again when the
  # window closes. A previous key that was never a current key is
  # meaningless, so nothing seeds this.
  - name: gibson-cg-signing-key-previous
    keys: [kid, key]
    producer: operator-supplied
    # chart-gate, not chart: the ExternalSecret reads this key only while
    # gibson.cgSigningKey.rotationWindow is true, so no committed golden shows
    # it and this repository cannot see the consumer. `make cg-rotation-window`
    # in zeroroot-ai/charts renders both states and asserts both (charts#316).
    consumers: [chart-gate:cg-rotation-window]
  # PAT mode (deploy#1110): a classic PAT with admin:org scope, written into
  # the platform OpenBao KV as {"github_token": …}. ARC's githubConfigSecret
  # accepts this as an alternative to the GitHub App triple
  # (github_app_id/installation_id/private_key); switch the keys back if a
  # GitHub App is ever provisioned.
  #
  # staging-only: the arc-runners-zeroroot Application exists only in gitops
  # envs/staging.
  - name: arc-github-app
    keys: [github_token]
    producer: operator-supplied
    consumers: [staging:arc-runners-zeroroot]

# Operator-minted / bringup-job secrets. These are NOT produced by an
# ExternalSecret — they materialise at runtime. Listed so they are explicit
# (acceptance: operator-minted secrets are represented, not silently missing).
operator_produced:
  # The Zitadel service-user PAT the signup path authenticates with. Minted
  # in-cluster by the signup-bot-pat-minter bringup Job
  # (helm/gibson/templates/jobs/gibson-workloads-signup-bot-pat-minter.yaml),
  # which self-waits for Zitadel and re-validates an existing PAT.
  - name: gibson-zitadel-signup-bot-pat
    keys: [token]
    producer: bringup-job
    consumers: [runtime:zitadel-signup]
  # The dashboard's OIDC client credentials, minted by the platform-operator
  # OIDCClient reconcile against Zitadel.
  - name: gibson-zitadel-dashboard-credentials
    keys: [client_id, client_secret]
    producer: operator
    consumers: [runtime:dashboard-oidc]
  # Setec frontend mTLS (deploy#1084). Both live in the SETEC namespace
  # (setec.namespace, default setec-system), issued by the cert-manager
  # Certificates in helm/gibson-workloads/templates/setec/frontend-tls.yaml
  # (rendered only when setec.enabled && setec.frontend.enabled).
  - name: setec-frontend-tls
    keys: [tls.crt, tls.key, ca.crt]
    producer: cert-manager   # server cert; ca.crt doubles as the frontend's
                             # client-verification CA (tlsClientCASecretName
                             # points at this same Secret)
    consumers: [chart:gibson-workloads/setec-frontend]
  - name: setec-frontend-client-tls
    keys: [tls.crt, tls.key, ca.crt]
    producer: cert-manager   # client cert for frontend callers
    consumers: [staging:arc-runner-setec-driver]   # gibson e2e-setec-roundtrip.yml
  # Daemon→frontend mTLS (deploy#1106). A THIRD cert off the same CA, kept
  # separate from setec-frontend-client-tls above: that one is the e2e
  # round-trip's credential and its read grant is written by name in gitops
  # envs/staging/manifests/arc-runners/rbac.yaml, so sharing a keypair would
  # put the daemon's client identity in the CI runner's blast radius.
  # Rendered only when gibson.sandbox.enabled.
  - name: setec-daemon-client-tls
    keys: [tls.crt, tls.key, ca.crt]
    producer: cert-manager   # client cert for the gibson daemon (CN gibson-daemon)
    consumers: [chart:gibson-workloads/setec-cert-bridge]
  # The release-namespace mirror of the above. cert-manager cannot write a
  # Secret across namespaces and a namespaced Issuer cannot sign across them,
  # so ESO's kubernetes provider copies it into the daemon's namespace
  # (templates/setec/daemon-client-secret.yaml). The "backend" here is the
  # Kubernetes API, not a cloud store.
  - name: gibson-setec-client-tls
    keys: [tls.crt, tls.key, ca.crt]
    producer: cert-manager   # via the ESO kubernetes-provider mirror
    consumers: [chart:gibson-workloads/daemon]

# ---------------------------------------------------------------------------
# Runtime writers (charts#17, charts#368). This part was
# helm/gibson/secret-producers.yaml. It names each Secret a workload reads that
# no chart object renders, and its one writer. make secret-plumbing and make
# reloader-names read it. make secret-contract counts its names as declared.
# ---------------------------------------------------------------------------
# A Secret has exactly one writer (owner decision 2026-10-05, ADR-0014). When
# the value comes from OpenBao or from outside the cluster, that writer is an
# ExternalSecret, and this list does not name the Secret. When a controller
# generates the value inside the cluster, that controller is the writer, and
# the entry names it (writer) and says why the exception is permanent (reason).
# check-secret-plumbing.py fails on a Secret with two writers, and on a writer
# that this list does not name.
#
# Keyed by content: the Secret name, never a line number.
producers:
  bringup-keyring:
    writer: the bringup (scripts/keyring-to-cluster.sh in hosted), before the umbrella syncs (ADR-0083)
    reason: "permanent: the keyring opens the archive and seeds OpenBao, so it exists before OpenBao and cannot come from it."
  cnpg-webhook-cert:
    writer: the CloudNativePG operator, at start
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."
  gibson-dashboard-oidc:
    writer: the platform-operator (OIDCClient reconcile)
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."
  gibson-master-key:
    writer: the platform-operator (PlatformBootstrap)
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."
  gibson-native-login-oidc:
    writer: the platform-operator (OIDCClient reconcile)
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."
  gibson-redis-rotation-state:
    writer: the CronJob gibson-redis-rotation (kubectl create secret, charts#367)
    reason: "permanent: the rotation controller records its own state; nothing outside the cluster holds it."
  gibson-tenant-operator-vault:
    writer: the openbao-auto-init sidecar, which keeps the tenant-operator's OpenBao token renewed
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."
  gibson-zitadel-dashboard:
    writer: the platform-operator (OIDCClient reconcile)
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."
  gibson-zitadel-tenant-operator:
    writer: the platform-operator (OIDCClient reconcile)
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."
  idp-admin-credentials:
    writer: the platform-operator (PlatformBootstrap), for the first-admin Job
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."
  platform-postgres-superuser:
    writer: the CloudNativePG operator (enableSuperuserAccess, no spec.superuserSecret)
    reason: "permanent: a controller generates the value inside the cluster, so that controller is its one writer (ADR-0014)."

# Secrets with two writers today. A Secret has exactly one writer (owner
# decision 2026-10-05, ADR-0014). Each entry names both writers and the issue
# that removes the second; the guard fails when the Secret no longer has two
# writers, so the entry cannot outlive its fix.
sharedWriters:
  iam-admin:
    writers: the Zitadel setup Job, and the ExternalSecret iam-admin (creationPolicy Orphan)
    reason: "charts#407 moves the Zitadel admin credentials to one ExternalSecret writer and deletes the escrow hook."
  iam-admin-pat:
    writers: the Zitadel setup Job, and the ExternalSecret iam-admin-pat (creationPolicy Orphan)
    reason: "charts#407 moves the Zitadel admin token to one ExternalSecret writer and deletes the escrow hook."
  login-client:
    writers: the Zitadel setup Job, and the ExternalSecret login-client (creationPolicy Orphan)
    reason: "charts#407 moves the Zitadel login-client token to one ExternalSecret writer and deletes the escrow hook."

# ConfigMaps a Reloader annotation names that no chart object renders, and who
# writes each one at runtime. check-reloader-names.py reads this map.
configMapProducers:
  gibson-fga-config: the fga-init hook Job writes the OpenFGA store id and model id after it loads the model
