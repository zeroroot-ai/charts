# rbac-allowlist.yaml — every grant to a ServiceAccount the baseline render
# makes, with a digest of the role's rules (charts#17, check-workload-rbac.py).
#
# A grant not listed here, or whose rules changed (the digest moved), fails
# `make check`. Widening any workload's authority is therefore a reviewed edit
# to this file, never a side effect of a template change; a line the render
# no longer produces fails too, so the file cannot go stale. The guard prints
# the line to add or change. Keyed by content: subject, role and rules.
#
# Line shape: '<subject ns>/<sa> -> <Role|ClusterRole>/<name> <in <ns>|cluster-wide>': <rules digest>
# "external" means the role is not in this render (a vendored operator's own).
