{{- /*
postgres-setup: the ServiceAccount of the four postgres-setup Jobs
(templates/jobs/*-postgres-setup-job.yaml, pod in _postgres-setup.tpl).

It holds no RBAC and mounts no token. The Jobs are plain Postgres clients:
the kubelet hands them their passwords through secretKeyRef, and they reach
the database over the network. Nothing about them needs the API server.

A pre-install hook, like the Jobs' earlier identity, so it exists before the
wave -6 Jobs that name it (deploy#908). before-hook-creation keeps it from
one install or upgrade to the next, which is harmless: it grants nothing.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-setup
  namespace: gibson
  labels:
    app.kubernetes.io/component: postgres-setup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-7"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-7'
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
