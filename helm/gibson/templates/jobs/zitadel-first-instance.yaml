{{/*
zitadel-first-instance: what the Zitadel setup Job needs to mint the first
login-client PAT and write it straight to OpenBao (charts#407, ADR-0014).

  ConfigMap gibson-zitadel-first-instance
      The steps file that creates the login-client machine user and its
      first PAT. values zitadel.setupJob.additionalArgs passes it to
      `zitadel setup`. It is not in zitadel.configmapConfig, because there
      the upstream chart starts a kubectl container that writes the PAT to
      a Kubernetes Secret: a second writer of the Secret login-client.
  Role and RoleBinding gibson-zitadel-setup
      get on Pods, for the ServiceAccount of the Zitadel chart. The container
      login-client-pat-store (values zitadel.setupJob.extraContainers) reads
      the state of its own pod to learn when the setup container stopped.
      The ServiceAccount gets no verb on Secrets.

Wave -6, with the Zitadel config map: both exist before the init Job (-4)
and the setup Job (-3).

Guard: scripts/check-zitadel-token-writers.py.
*/}}
{{- $sa := printf "%s-zitadel" .Release.Name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-zitadel-first-instance
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: zitadel-first-instance
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
data:
  steps.yaml: |
    FirstInstance:
      Org:
        # The machine user of zitadel-login (role IAM_LOGIN_CLIENT). The
        # platform-operator rotates its PAT after the first one (ADR-0171).
        LoginClient:
          Machine:
            Username: login-client
            Name: Automatically Initialized IAM Login Client
          Pat:
            ExpirationDate: "2029-01-01T00:00:00Z"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-zitadel-setup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: zitadel-first-instance
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-zitadel-setup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: zitadel-first-instance
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-zitadel-setup
