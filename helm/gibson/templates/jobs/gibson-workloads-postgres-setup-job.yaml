{{- /* Postgres setup Job (templates/jobs/_postgres-setup.tpl). Renders on every profile: the umbrella's own Cluster is the platform Postgres everywhere (deploy#1730). */ -}}
{{/* deploy#788: bringup Jobs folded from gitops apps/manifests. Each Job waits for platform-postgres-rw to accept connections, and the kubelet holds its pod until the credential Secrets exist. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: gibson-workloads-postgres-setup
  namespace: gibson
  annotations:
    # gitops#297: this role-creating job (gibson_platform/tenant_admin
    # roles + DBs, pg_trgm seed, tenant_neo4j_endpoints registry) MUST run
    # BEFORE anything that logs in with those roles — the zitadel-init Sync hook
    # at wave -4 and every DB-consuming service. As a post-install/PostSync hook
    # it deadlocked: consumers (Sync) waited for roles this job had not yet
    # created, so the Sync phase never completed and the PostSync phase (this
    # job) never ran. Run it as a Sync hook at wave -6 instead — after the ESO
    # credential Secrets (Sync-phase, wave -8; PreSync would deadlock waiting on
    # a Secret its own phase hasn't created yet) and before zitadel-init (-4).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Helm-native (non-Argo) installs keep an early hook so role creation still
    # precedes the consumers; ArgoCD honours the argocd.* annotations above.
    # post-install, NOT pre-install (deploy#1627). This Job blocks on two
    # MAIN-PHASE resources: Cluster.status.currentPrimary for platform-postgres,
    # and the ESO-materialised credentials Secret. Helm runs pre-install hooks
    # to completion BEFORE it applies any main-phase manifest, so as a
    # pre-install hook this waited for resources the same release had not
    # created yet and hung until --timeout, reporting only "failed pre-install:
    # timed out waiting for the condition".
    #
    # Argo is unaffected: the argocd.argoproj.io/hook annotation above is what
    # Argo honours, and sync-waves order hooks and ordinary resources on one
    # axis, which is why this was only ever wrong on the Helm-native path.
    # The hook-weight is unchanged, so the order among these Jobs is preserved.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '-6'
    helm.sh/hook-delete-policy: before-hook-creation
{{- /*
Two roles. tenant_admin also gets CREATEROLE (gitops#99): the
tenant-operator's per-tenant Postgres provisioner creates both the
per-tenant database and a per-tenant `<tenant>_app` role inside it.
*/}}
{{- $entries := list
  (dict "role" "gibson_platform" "db" "gibson_platform" "opts" "LOGIN" "secret" "gibson-platform-postgres-credentials")
  (dict "role" "tenant_admin" "db" "tenant_admin" "opts" "LOGIN CREATEDB CREATEROLE" "secret" "tenant-admin-postgres-credentials") }}
{{- $extra := `# gitops#101: per-tenant databases need pg_trgm for the
# missions_name_trgm_idx GIN index in migration 003. CREATE DATABASE copies
# template1, so the extension goes there for every NEW tenant database, and
# every existing tenant_* database gets it in place.
echo "[pg_trgm] template1 and existing tenant databases..."
"${PSQL[@]}" -d template1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
for tdb in $("${PSQL[@]}" -d postgres -tAc "SELECT datname FROM pg_catalog.pg_database WHERE datname LIKE 'tenant\_%' AND datname <> 'tenant_admin'"); do
  echo "  [pg_trgm] $tdb"
  "${PSQL[@]}" -d "$tdb" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
done

# D1-G (deploy#256): the tenant-operator's DATAPLANE_PG_ADMIN_DSN connects as
# tenant_admin to the built-in postgres database, where PostgreSQL 15 and
# later own the public schema as pg_database_owner and grant no CREATE to
# others. Its platform-db migrations create tables there.
echo "[postgres-db] tenant_admin may create in the public schema of postgres..."
"${PSQL[@]}" -d postgres -c "GRANT CREATE, USAGE ON SCHEMA public TO tenant_admin;"

# tenant-operator#69: the Neo4j data-plane step writes one row per tenant
# into tenant_neo4j_endpoints, in the postgres database tenant_admin
# connects to. The operator does not run that migration at startup, so the
# table is created here.
echo "[neo4j-registry] tenant_neo4j_endpoints..."
"${PSQL[@]}" -d postgres <<'SQL'
CREATE TABLE IF NOT EXISTS tenant_neo4j_endpoints (
    tenant_id   TEXT        PRIMARY KEY,
    bolt_uri    TEXT        NOT NULL,
    secret_name TEXT        NOT NULL,
    tier        TEXT        NOT NULL,
    created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    ready_at    TIMESTAMPTZ,
    version     INT         NOT NULL DEFAULT 1
);
GRANT SELECT, INSERT, UPDATE, DELETE ON tenant_neo4j_endpoints TO tenant_admin;
SQL` }}
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    {{- include "gibson.postgresSetup.podTemplate" (dict "root" $ "entries" $entries "extra" $extra) | nindent 4 }}
