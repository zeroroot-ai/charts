{{/*
iam-admin-pat-escrow — copy what the Zitadel setup Job minted into OpenBao.

The Zitadel setup Job mints THREE Secrets on the first instance and writes
only the Kubernetes objects: iam-admin (the IAM_OWNER machine key,
iam-admin.json), iam-admin-pat (its PAT) and login-client (the login
client's PAT). A restore brings back the OpenBao volume and no Secret, so
all three must live in OpenBao to survive one. This Job waits for each
minted Secret, compares it with its key in the store, and writes it when
absent or different. The ExternalSecrets in gibson-workloads
templates/external-secrets/iam-admin-pat-externalsecret.yaml read them
back. On a restore the ExternalSecrets create the Secrets from the restored
store first, and this Job finds each pair equal and exits.

Same hook shape as signup-bot-pat-minter: post-install/post-upgrade, Argo
Sync hook, weight 3, self-waiting. See the ExternalSecret's header for the
measurement (2026-09-07, blocker 3 loop).

Sync wave -2, not 0. The setup Job that mints the PAT is wave -3, and the
store this Job writes to is readable from wave -8 (every other
ExternalSecret syncs there). Nothing this Job needs arrives later than -3.
It has to be BEFORE wave 0 because the ExternalSecret that reads the PAT
back must be too: the platform-operator, a wave-0 workload, waits for the
PAT to mint gibson-master-key, and until then the daemon and the
gibson-workloads StatefulSet cannot mount their key volumes. With the escrow
at 0 and the ExternalSecret at 1, a restore deadlocked: Argo waited for
wave 0 to be Healthy before applying the ExternalSecret, and wave 0 could
not be Healthy without it (hosted run 34249427078 and blocker 3 loop #13,
2026-09-08: the built-ins Restore sat InProgress for 40 minutes on the
gibson-workloads-0 volume, its pod at Init:0/6 on "secret gibson-master-key
not found").
*/}}
{{- $baoAddr := printf "http://%s-openbao:%v" .Release.Name ((index .Values "gibson-workloads" "openbao" "service").port | default 8200) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-admin-pat-escrow
  namespace: gibson
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '3'
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iam-admin-pat-escrow
  namespace: gibson
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '3'
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups: ['']
  resources: [secrets]
  verbs: [get]
  # Every Secret the escrow loop reads (ENTRIES in the Job below). A name
  # missing here reads as "not there yet" to kubectl and the loop waits its
  # whole window: hosted run 34271811189 (2026-09-08) sat 20 minutes on
  # "waiting for iam-admin" with the Secret present and this list naming
  # the PAT alone. The Job now refuses to wait on a Secret it may not read.
  resourceNames: [iam-admin-pat, iam-admin, login-client]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iam-admin-pat-escrow
  namespace: gibson
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '3'
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
subjects:
- kind: ServiceAccount
  name: iam-admin-pat-escrow
  namespace: gibson
roleRef:
  kind: Role
  name: iam-admin-pat-escrow
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: iam-admin-pat-escrow
  namespace: gibson
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '3'
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        # networkpolicy-bringup-jobs.yaml selects this label; without it the
        # namespace default-deny severs the pod from CoreDNS and OpenBao.
        app.kubernetes.io/component: iam-admin-pat-escrow
    spec:
      restartPolicy: OnFailure
      serviceAccountName: iam-admin-pat-escrow
      containers:
      - name: escrow
        image: {{ include "gibson.toolImage" . | quote }}
        env:
        - name: BAO_ADDR
          value: {{ $baoAddr | quote }}
        - name: VAULT_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: gibson-openbao-keys
              key: VAULT_ADMIN_TOKEN
        command: [bash, -ec]
        args:
        - |
          set -euo pipefail
          NS=gibson
          # Every Secret the Zitadel setup Job mints on the first instance
          # (its zitadel-machinekey, zitadel-machine-pat and
          # zitadel-login-client-pat containers), as
          #   <Secret>:<data key>:<store key>:<store property>
          # The platform-operator reads iam-admin (the machine key, for the
          # SA identity map) and iam-admin-pat; zitadel-login mounts
          # login-client. A restore brings back none of them (blocker 3 loop
          # #14, 2026-09-08: PlatformBootstrap SAIdentityMapReady=False
          # "Secret gibson/iam-admin not yet written", zitadel-login on
          # "secret login-client not found").
          ENTRIES="iam-admin-pat:pat:gibson-zitadel-iam-admin-pat:pat iam-admin:iam-admin.json:gibson-zitadel-iam-admin-machinekey:machinekey login-client:pat:gibson-zitadel-login-client-pat:pat"
          for entry in $ENTRIES; do
            SECRET=${entry%%:*}; rest=${entry#*:}
            DATAKEY=${rest%%:*}; rest=${rest#*:}
            KEY=${rest%%:*}; PROP=${rest#*:}
            # The store first. On a restore the store already holds the value
            # and the Secret does not exist yet (the ExternalSecret that writes
            # it applies at wave -1, after this hook), so waiting for the
            # Secret here would deadlock the sync. A key in the store and no
            # Secret is the restore path: nothing to do.
            code=$(curl -sS -o /tmp/kv.json -w '%{http_code}' \
              -H "X-Vault-Token: $VAULT_ADMIN_TOKEN" "$BAO_ADDR/v1/secret/data/$KEY")
            case "$code" in
              200) have=$(jq -r --arg p "$PROP" '.data.data[$p] // empty' /tmp/kv.json) ;;
              404) have="" ;;
              *) echo "ERROR: read secret/$KEY returned HTTP $code: $(cat /tmp/kv.json)"; exit 1 ;;
            esac
            if [ -n "$have" ] && ! kubectl -n "$NS" get secret "$SECRET" >/dev/null 2>&1; then
              echo "ESCROWED already: secret/$KEY is in the store and Secret $SECRET is not yet materialised (restore path)"
              continue
            fi
            # A Secret this ServiceAccount may not read looks exactly like one
            # that is not there yet. Refuse to wait on it.
            if [ "$(kubectl -n "$NS" auth can-i get "secret/$SECRET")" != yes ]; then
              echo "ERROR: the escrow ServiceAccount may not get secret/$SECRET: add it to the Role's resourceNames"; exit 1
            fi
            # The minted Secret (fresh bootstrap: the Zitadel setup Job writes it,
            # up to ~9 min into a cold bringup). 180 x 5 s, the minter's window.
            for i in $(seq 1 180); do
              if kubectl -n "$NS" get secret "$SECRET" >/dev/null 2>&1; then break; fi
              echo "  waiting for $SECRET ($i/180)"; sleep 5
            done
            VALUE=$(kubectl -n "$NS" get secret "$SECRET" -o json | jq -r --arg k "$DATAKEY" '.data[$k] // empty' | base64 -d)
            [ -n "$VALUE" ] || { echo "ERROR: $SECRET never appeared or its $DATAKEY is empty"; exit 1; }
            if [ "$have" = "$VALUE" ]; then
              echo "ESCROWED already: secret/$KEY matches Secret $SECRET"
              continue
            fi
            code=$(curl -sS -o /tmp/kv.json -w '%{http_code}' -X POST \
              -H "X-Vault-Token: $VAULT_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg p "$PROP" --arg v "$VALUE" '{data: {($p): $v}}')" "$BAO_ADDR/v1/secret/data/$KEY")
            case "$code" in
              200|204) echo "ESCROWED: wrote secret/$KEY from Secret $SECRET/$DATAKEY (len=${#VALUE})" ;;
              *) echo "ERROR: write secret/$KEY returned HTTP $code: $(cat /tmp/kv.json)"; exit 1 ;;
            esac
          done
