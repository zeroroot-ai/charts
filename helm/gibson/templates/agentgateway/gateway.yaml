{{/*
The one agentgateway Gateway (gibson#1366, charts#815).

The Gateway carries two route sets. The Model gateway is the routes from
Gibson to each LLM provider, on the listener `model`. The Agent gateway is
the MCP and A2A routes between components in the cluster, on the listener
`agent`. The chart renders no route. The tenant-operator renders the routes
and the backends of each tenant (gibson#1387).

Each listener serves TLS with a certificate of the component issuer, the
issuer of the OpenFGA certificate. The daemon trusts that CA already
(SSL_CERT_DIR /etc/ssl/fga-ca).

The Gateway is cluster-internal. The AgentgatewayParameters set the proxy
Service to ClusterIP, the Gateway names no address, and the Edge has no
route to it. scripts/check-agentgateway.py fails the render on a public
listener.

The controller of the agentgateway subchart reads the Gateway and starts the
proxy Deployment, Service and ServiceAccount, each named after the Gateway
(gibson.agentgatewayName). The proxy pods get the labels of
spec.infrastructure.labels.
*/}}
{{- $name := include "gibson.agentgatewayName" . }}
{{- $ctrl := include "gibson.agentgatewayControllerName" . }}
{{- if ne .Values.agentgateway.fullnameOverride $ctrl }}
{{- fail (printf "agentgateway.fullnameOverride must be %q, the name gibson.agentgatewayControllerName gives the admission policy and the network policy" $ctrl) }}
{{- end }}
{{- $gwNs := include "gibson.gatewayNamespace" . }}
{{- if ne (toJson .Values.agentgateway.rbac.gatewayNamespaces) (toJson (list $gwNs)) }}
{{- fail (printf "agentgateway.rbac.gatewayNamespaces must be [%q], the gateway namespace (gibson.gatewayNamespace). Any other list gives the controller a write grant outside it, or none where the proxy lives" $gwNs) }}
{{- end }}
{{- $gw := .Values.gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  namespace: {{ include "gibson.gatewayNamespace" . }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
spec:
  gatewayClassName: agentgateway
  infrastructure:
    # The labels of the proxy pods. The component label selects them in the
    # network policy and in the ClusterSPIFFEID. The proxy calls each LLM
    # provider, so it has the egress-internet label.
    labels:
      app.kubernetes.io/component: agentgateway-proxy
      gibson.zeroroot.ai/egress-internet: "true"
    annotations:
      # Velero fs-backup skips these: a socket, a token and a ConfigMap.
      backup.velero.io/backup-volumes-excludes: "spiffe-workload-api,xds-token,config-volume"
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ $name }}
  listeners:
    {{- range $l := list "model" "agent" }}
    - name: {{ $l }}
      # TLS on each listener: a caller token never crosses the pod network
      # in clear text. The certificate comes from the component issuer
      # (gibson-workloads cert-manager/component-certificates.yaml).
      protocol: HTTPS
      port: {{ index (include "gibson.gatewayPorts" $ | fromYaml) $l }}
      tls:
        mode: Terminate
        # The Certificate lives in the release namespace, where its issuer
        # is (an Issuer is namespaced). The ReferenceGrant below lets this
        # Gateway name the Secret there.
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ include "gibson.agentgatewayTLSSecretName" $ }}
            namespace: {{ $.Release.Namespace }}
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        # The tenant-operator writes the route of each ModelProvider in the
        # gateway namespace (gibson#1387), so only that namespace attaches.
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ $name }}
  namespace: {{ include "gibson.gatewayNamespace" . }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
spec:
  image:
    {{- toYaml $gw.proxy.image | nindent 4 }}
  resources:
    {{- toYaml $gw.proxy.resources | nindent 4 }}
  logging:
    format: json
  # The OpenTelemetry batch span processor of the proxy (agentgateway
  # v1.7.0 crates/agentgateway/src/telemetry/trc.rs, new_trace_processor)
  # sends up to 512 spans in one OTLP export by default. A span holds the
  # whole request and response body, so a batch can pass the 40 MiB that the
  # trace collector accepts, and the collector refuses the whole batch. One
  # span in each export keeps each message below that limit. The in-memory
  # span queue of the proxy is small, because each span can hold 32 MiB.
  env:
    - name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE
      value: "1"
    - name: OTEL_BSP_MAX_QUEUE_SIZE
      value: {{ $gw.proxy.spanQueueSize | quote }}
  # The proxy gets its X.509-SVID from the SPIRE agent through the CSI
  # driver, the same socket as the other platform pods. It presents the
  # SVID to ext-authz (policies.yaml, the backend TLS policy).
  spiffe:
    source:
      csi:
        driver: csi.spiffe.io
      mountPath: /run/spire/sockets
      socketName: api.sock
  # No public listener: the Service of the proxy is ClusterIP. The upstream
  # default is LoadBalancer.
  service:
    spec:
      type: ClusterIP
  deployment:
    spec:
      replicas: {{ $gw.proxy.replicas }}
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # The proxy container of the controller (strategic merge by the
          # container name). The proxy binds no listener and answers 500 on
          # /healthz/ready until its first xDS config arrives
          # (crates/agentgateway/src/app.rs: gw.run() waits for
          # xds_rx.changed(), and the "state manager" readiness task drops
          # only then). The upstream startup probe gives 60 x 1 s, so a
          # controller that starts slowly restarts the proxy. This budget is
          # gateway.proxy.startupSeconds. The proxy has no liveness probe,
          # so after its start the kubelet never restarts it for a lost
          # controller. The readiness probe gets a stated timeout.
          containers:
            - name: agentgateway
              startupProbe:
                httpGet:
                  path: /healthz/ready
                  port: 15021
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: {{ div $gw.proxy.startupSeconds 5 }}
              readinessProbe:
                httpGet:
                  path: /healthz/ready
                  port: 15021
                periodSeconds: 10
                timeoutSeconds: 3
{{- /* The cross-namespace references of the gateway namespace into the
       release namespace. One ReferenceGrant for each kind that refers, so
       each kind can name only what it uses:
         Gateway             the listener certificate Secret
         AgentgatewayPolicy  the ext-authz and trace collector Services
         HTTPRoute           the daemon Service (the A2A listener, the
                             backend of the agent route, a2a-route.yaml) */}}
{{- $from := include "gibson.gatewayNamespace" . }}
{{- $daemonSvc := include "gibson.daemonAddress" . | splitList "." | first }}
{{- $grants := list
      (dict "suffix" "gateway" "group" "gateway.networking.k8s.io" "kind" "Gateway"
            "to" (list (dict "kind" "Secret" "name" (include "gibson.agentgatewayTLSSecretName" .))))
      (dict "suffix" "policy" "group" "agentgateway.dev" "kind" "AgentgatewayPolicy"
            "to" (list (dict "kind" "Service" "name" (include "gibson.extAuthzServiceName" .))
                       (dict "kind" "Service" "name" (include "gibson.traceCollectorName" .))))
      (dict "suffix" "route" "group" "gateway.networking.k8s.io" "kind" "HTTPRoute"
            "to" (list (dict "kind" "Service" "name" $daemonSvc))) }}
{{- range $g := $grants }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: {{ $name }}-{{ $g.suffix }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gibson.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agentgateway
spec:
  from:
    - group: {{ $g.group }}
      kind: {{ $g.kind }}
      namespace: {{ $from }}
  to:
    {{- range $t := $g.to }}
    - group: ""
      kind: {{ $t.kind }}
      name: {{ $t.name }}
    {{- end }}
{{- end }}
