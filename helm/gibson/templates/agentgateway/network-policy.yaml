{{/*
The network policy of the agentgateway proxy and its controller (charts#815),
in the style of templates/network-policies.yaml (ADR-0165 rule 4, D76).

The proxy pods carry no net-role label, so the platform policy does not
admit them, and no platform pod reaches them by that policy. Each flow is
named here, and Cilium allows a flow only when both sides allow it:

  in   the daemon, the dashboard backend and the pods of each sandbox
       namespace reach the two listeners (model, agent).
  out  the proxy reaches ext-authz on its gRPC port and the controller on
       its xDS port. It reaches each LLM provider through the
       egress-internet label (network-policies.yaml). It reaches the trace
       collector through the trace data store rule (network-policies.yaml,
       the client-trace label).

The trace collector (charts#816) reaches the daemon on its gRPC port, and
the daemon accepts it there. No other pod reaches the collector.

A sandbox namespace denies each flow by default (setec). The egress rule of
a sandbox to the gateway is the business of setec, not of this chart.
*/}}
{{- $ns := .Release.Namespace }}
{{- $rel := .Release.Name }}
{{- $role := "gibson.zeroroot.ai/net-role" }}
{{- $gw := .Values.gateway }}
{{- $extAuthzPort := ((((index .Values "gibson-workloads") | default dict).extAuthz | default dict).ports | default dict).grpc | default 9001 }}
{{- $xdsPort := ((((.Values.agentgateway.controller | default dict).service | default dict).ports | default dict).agwGrpc) | default 9978 }}
{{- $listeners := list $gw.ports.model $gw.ports.agent }}
{{- $daemonGrpc := include "gibson.daemonAddress" . | splitList ":" | last }}
{{- $collector := dict "app.kubernetes.io/component" "trace-collector" "gibson.zeroroot.ai/datastore" "trace" }}
{{- $proxy := dict "app.kubernetes.io/component" "agentgateway-proxy" }}
{{- /* The namespace label that setec sets on each sandbox namespace.
       sandbox-namespace-label-admission.yaml (gibson-workloads) limits who
       may set it. */}}
{{- $sandboxNs := printf "k8s:io.cilium.k8s.namespace.labels.%s" "setec.zeroroot.ai/sandbox-namespace" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $rel }}-agentgateway
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-agentgateway
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
specs:
  - description: "The daemon, the dashboard backend and the sandboxes reach the listeners of the agentgateway proxy. The proxy reaches ext-authz, its controller and the trace collector."
    endpointSelector:
      matchLabels:
        {{- toYaml $proxy | nindent 8 }}
    ingress:
      - fromEndpoints:
          {{- range $c := list "daemon" "dashboard" }}
          - matchLabels:
              app.kubernetes.io/component: {{ $c }}
              {{ $role }}: platform
          {{- end }}
          - matchLabels:
              {{ $sandboxNs }}: "true"
            matchExpressions:
              - key: k8s:io.kubernetes.pod.namespace
                operator: Exists
        toPorts:
          - ports:
              {{- range $p := $listeners }}
              - port: {{ $p | quote }}
                protocol: TCP
              {{- end }}
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/component: ext-authz
              {{ $role }}: platform
        toPorts:
          - ports:
              - port: {{ $extAuthzPort | quote }}
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/component: agentgateway-controller
              {{ $role }}: platform
        toPorts:
          - ports:
              - port: {{ $xdsPort | quote }}
                protocol: TCP
  - description: "The daemon and the dashboard backend reach the listeners of the agentgateway proxy."
    endpointSelector:
      matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values: [daemon, dashboard]
        - key: {{ $role }}
          operator: In
          values: [platform]
    egress:
      - toEndpoints:
          - matchLabels:
              {{- toYaml $proxy | nindent 14 }}
        toPorts:
          - ports:
              {{- range $p := $listeners }}
              - port: {{ $p | quote }}
                protocol: TCP
              {{- end }}
  - description: "ext-authz accepts the agentgateway proxy on its gRPC port."
    endpointSelector:
      matchLabels:
        app.kubernetes.io/component: ext-authz
        {{ $role }}: platform
    ingress:
      - fromEndpoints:
          - matchLabels:
              {{- toYaml $proxy | nindent 14 }}
        toPorts:
          - ports:
              - port: {{ $extAuthzPort | quote }}
                protocol: TCP
  - description: "The agentgateway controller serves xDS to the proxy."
    endpointSelector:
      matchLabels:
        app.kubernetes.io/component: agentgateway-controller
        {{ $role }}: platform
    ingress:
      - fromEndpoints:
          - matchLabels:
              {{- toYaml $proxy | nindent 14 }}
        toPorts:
          - ports:
              - port: {{ $xdsPort | quote }}
                protocol: TCP
  - description: "The trace collector reaches the daemon on its gRPC port."
    endpointSelector:
      matchLabels:
        {{- toYaml $collector | nindent 8 }}
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/component: daemon
              {{ $role }}: platform
        toPorts:
          - ports:
              - port: {{ $daemonGrpc | quote }}
                protocol: TCP
  - description: "The daemon accepts the trace collector on its gRPC port."
    endpointSelector:
      matchLabels:
        app.kubernetes.io/component: daemon
        {{ $role }}: platform
    ingress:
      - fromEndpoints:
          - matchLabels:
              {{- toYaml $collector | nindent 14 }}
        toPorts:
          - ports:
              - port: {{ $daemonGrpc | quote }}
                protocol: TCP
