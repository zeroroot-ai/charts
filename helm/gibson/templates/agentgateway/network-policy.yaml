{{/*
The network policy of the agentgateway proxy, its controller and the trace
collector (charts#815, charts#816), in the style of
templates/network-policies.yaml (ADR-0165 rule 4, D76).

The proxy runs in the gateway namespace (gibson.gatewayNamespace), which has
its own default deny. Every flow below crosses that namespace, so each peer
names its namespace. Cilium allows a flow only when both sides allow it, so
each flow has an egress rule and an ingress rule:

  proxy in    the daemon, the dashboard backend, the Edge (the gateway
              forward routes for a sandbox, charts#815) and the pods of each
              sandbox namespace reach the two listeners (model, agent).
  proxy out   the proxy reaches ext-authz on its gRPC port, the controller
              on its xDS port and the trace collector on its OTLP port, all
              in the release namespace. It reaches each LLM provider outside
              the cluster, and it resolves each name.
  collector   the trace collector reaches the trace listener of the daemon
              (gibson.daemonTracePort). The TLS layer of that listener
              accepts the collector SVID and no other peer. Only the proxy
              reaches the collector.

A sandbox namespace denies each flow by default (setec). The egress rule of
a sandbox to the gateway is the business of setec, not of this chart.
*/}}
{{- $ns := .Release.Namespace }}
{{- $gwNs := include "gibson.gatewayNamespace" . }}
{{- $rel := .Release.Name }}
{{- $role := "gibson.zeroroot.ai/net-role" }}
{{- $podNs := "k8s:io.kubernetes.pod.namespace" }}
{{- $extAuthzPort := ((((index .Values "gibson-workloads") | default dict).extAuthz | default dict).ports | default dict).grpc | default 9001 }}
{{- $xdsPort := ((((.Values.agentgateway.controller | default dict).service | default dict).ports | default dict).agwGrpc) | default 9978 }}
{{- $otlpPort := (index .Values "gibson-workloads").traceCollector.ports.otlp }}
{{- $ports := include "gibson.gatewayPorts" . | fromYaml }}
{{- $listeners := list $ports.model $ports.agent }}
{{- $daemonTrace := include "gibson.daemonTracePort" . }}
{{- $collector := dict "app.kubernetes.io/component" "trace-collector" "gibson.zeroroot.ai/datastore" "trace" }}
{{- $proxy := dict "app.kubernetes.io/component" "agentgateway-proxy" $podNs $gwNs }}
{{- /* The namespace label that setec sets on each sandbox namespace.
       sandbox-namespace-label-admission.yaml (gibson-workloads) limits who
       may set it. */}}
{{- $sandboxNs := printf "k8s:io.cilium.k8s.namespace.labels.%s" "setec.zeroroot.ai/sandbox-namespace" }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $rel }}-agentgateway
  namespace: {{ $gwNs }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-agentgateway
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: "The daemon, the dashboard backend, the Edge and the sandboxes reach the listeners of the agentgateway proxy. The proxy reaches ext-authz, its controller, the trace collector and the LLM providers."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: agentgateway-proxy
  ingress:
    - fromEndpoints:
        {{- range $c := list "daemon" "dashboard" "envoy" }}
        - matchLabels:
            {{ $podNs }}: {{ $ns }}
            app.kubernetes.io/component: {{ $c }}
            {{ $role }}: platform
        {{- end }}
        - matchLabels:
            {{ $sandboxNs }}: "true"
          matchExpressions:
            - key: {{ $podNs }}
              operator: Exists
      toPorts:
        - ports:
            {{- range $p := $listeners }}
            - port: {{ $p | quote }}
              protocol: TCP
            {{- end }}
  egress:
    - toEndpoints:
        - matchLabels:
            {{ $podNs }}: {{ $ns }}
            app.kubernetes.io/component: ext-authz
            {{ $role }}: platform
      toPorts:
        - ports:
            - port: {{ $extAuthzPort | quote }}
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            {{ $podNs }}: {{ $ns }}
            app.kubernetes.io/component: agentgateway-controller
            {{ $role }}: platform
      toPorts:
        - ports:
            - port: {{ $xdsPort | quote }}
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            {{ $podNs }}: {{ $ns }}
            {{- toYaml $collector | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ $otlpPort | quote }}
              protocol: TCP
    # The LLM providers, outside the cluster.
    - toEntities:
        - world
    {{- include "gibson.dnsRule" (list (dict "matchPattern" "*")) | nindent 4 }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $rel }}-agentgateway
  namespace: {{ $ns }}
  labels:
    {{- include "gibson.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-agentgateway
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
specs:
  - description: "The daemon, the dashboard backend and the Edge reach the listeners of the agentgateway proxy."
    endpointSelector:
      matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values: [daemon, dashboard, envoy]
        - key: {{ $role }}
          operator: In
          values: [platform]
    egress:
      - toEndpoints:
          - matchLabels:
              {{- toYaml $proxy | nindent 14 }}
        toPorts:
          - ports:
              {{- range $p := $listeners }}
              - port: {{ $p | quote }}
                protocol: TCP
              {{- end }}
  - description: "ext-authz accepts the agentgateway proxy on its gRPC port."
    endpointSelector:
      matchLabels:
        app.kubernetes.io/component: ext-authz
        {{ $role }}: platform
    ingress:
      - fromEndpoints:
          - matchLabels:
              {{- toYaml $proxy | nindent 14 }}
        toPorts:
          - ports:
              - port: {{ $extAuthzPort | quote }}
                protocol: TCP
  - description: "The agentgateway controller serves xDS to the proxy."
    endpointSelector:
      matchLabels:
        app.kubernetes.io/component: agentgateway-controller
        {{ $role }}: platform
    ingress:
      - fromEndpoints:
          - matchLabels:
              {{- toYaml $proxy | nindent 14 }}
        toPorts:
          - ports:
              - port: {{ $xdsPort | quote }}
                protocol: TCP
  - description: "The trace collector accepts the agentgateway proxy on its OTLP port, and reaches the trace listener of the daemon."
    endpointSelector:
      matchLabels:
        {{- toYaml $collector | nindent 8 }}
    ingress:
      - fromEndpoints:
          - matchLabels:
              {{- toYaml $proxy | nindent 14 }}
        toPorts:
          - ports:
              - port: {{ $otlpPort | quote }}
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/component: daemon
              {{ $role }}: platform
        toPorts:
          - ports:
              - port: {{ $daemonTrace | quote }}
                protocol: TCP
  - description: "The trace listener of the daemon accepts the trace collector."
    endpointSelector:
      matchLabels:
        app.kubernetes.io/component: daemon
        {{ $role }}: platform
    ingress:
      - fromEndpoints:
          - matchLabels:
              {{- toYaml $collector | nindent 14 }}
        toPorts:
          - ports:
              - port: {{ $daemonTrace | quote }}
                protocol: TCP
