{{/*
Egress allowance for the umbrella's bringup hook Jobs (deploy#1365).

The gibson-workloads subchart ships a namespace-wide default-deny
NetworkPolicy (podSelector: {}, Ingress+Egress). The bringup Jobs in
templates/jobs/ live in THIS chart, so their allowance lives here too.
They are pure clients: the postgres-setup family connects to
platform-postgres-rw on :5432 (the instances policy admits it through the
gibson.zeroroot.ai/platform-postgres-client label). None of them accepts connections, so
there are no ingress rules — selecting them with policyTypes Ingress and an
empty rule list IS the per-pod ingress deny.

Every Job pod template (templates/jobs/ AND templates/operations/) MUST carry
one of the component labels below; scripts/check-secure-pod.py fails the
render when a workload in the namespace is selected by no policy.

The Jobs hard-code `namespace: gibson`, so this policy does the same.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gibson-bringup-jobs
  namespace: gibson
  annotations:
    # Argo runs the bringup Jobs as Sync hooks in early waves (postgres-setup
    # at -6). A resource with no wave is wave 0, so on an upgrade the Jobs
    # ran under the OLD version of this policy and could not reach Postgres
    # (staging, 2026-09-27: the postgres-setup rename waited forever). This
    # policy applies first. scripts/check-netpol-before-hooks.py enforces it.
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    app.kubernetes.io/component: bringup-jobs-isolation
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - postgres-setup
          # deploy#1631: the first-admin Job. Under the namespace default-deny,
          # a component label absent from THIS list means the pod cannot even
          # reach CoreDNS — seed-first-admin then fails with an i/o timeout to
          # :53 that reads like a DNS bug, not a policy one. The Job lives in
          # templates/operations/ rather than templates/jobs/, which is why
          # check-secure-pod.py did not force it into this list.
          - first-admin
          # deploy#1761: the admission-webhook readiness gate. It posts an
          # AdmissionReview to every webhook endpoint the umbrella installs,
          # including setec-webhook in setec-system, so it needs egress and
          # CoreDNS like the rest of this list.
          - webhook-gate
          # The Zitadel IAM_OWNER PAT escrow (templates/jobs/): reads the minted
          # Secret through the API server and writes it to OpenBao, so a
          # restore can bring the PAT back (2026-09-07, blocker 3 loop).
          - iam-admin-pat-escrow
  policyTypes:
    - Ingress
    - Egress
  egress:
    - {}
