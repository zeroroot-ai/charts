{{- /*
Zitadel SMTP provider install-value guard (hosted#189).

Zitadel has no mail server of its own. Every Zitadel-sent email — the
Platform owner's setup link, a tenant Owner's setup link, invitations, an
MFA reset routed through Zitadel — depends on the platform-operator's
PlatformBootstrap CR carrying spec.zitadel.smtp: without it, Zitadel's own
invite-code call still succeeds and logs as sent, but nothing is ever
delivered.

This is the same "mail or an explicit offline opt-out" contract
platform-owner-guard.yaml already enforces for the two humans an install
creates; this guard enforces it for the underlying transport those two
humans' setup links use. Whenever the daemon's own mail is configured
(gibson-workloads.gibson.email.provider: "smtp" — the signal
platform-owner-guard.yaml already reads), the SAME install MUST also point
Zitadel's SMTP provider at real settings, so there is one mail transport per
install, never a daemon that can send mail while Zitadel cannot.

This template renders no resource: it exists to run this check on every
`helm template` / `helm install` / `helm upgrade`, unconditionally.
*/ -}}
{{- /*
Checks only that SOMETHING is declared — never re-validates the block's
internal completeness (port/fromAddress/fromName), which
helm-operators/templates/platform-operator/platformbootstrap.yaml's own
`required` calls already enforce, with their own messages, the moment
smtp.host is set. Two guards racing to fail first on the same field with
different text is worse than one; this one owns exactly the cross-chart
question those `required` calls cannot see: does the OTHER chart's mail
setting agree that mail should work at all.
*/ -}}
{{- $wl := index .Values "gibson-workloads" | default dict -}}
{{- $mailConfigured := eq ((($wl.gibson | default dict).email | default dict).provider | default "log") "smtp" -}}
{{- if $mailConfigured -}}
{{- $ops := index .Values "gibson-operators" | default dict -}}
{{- $smtp := (($ops.platformBootstrap | default dict).zitadel | default dict).smtp | default dict -}}
{{- if not $smtp.host -}}
{{- fail "gibson-workloads.gibson.email.provider is \"smtp\" but gibson-operators.platformBootstrap.zitadel.smtp.host is empty: the daemon can send mail but Zitadel cannot, so every Zitadel-sent setup link and invitation is silently undeliverable (hosted#189). Point gibson-operators.platformBootstrap.zitadel.smtp at the same host/port/credentials as gibson-workloads.gibson.email.smtp." -}}
{{- end -}}
{{- end -}}
