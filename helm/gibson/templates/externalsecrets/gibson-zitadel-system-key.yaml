{{/* deploy#787: folded from gitops apps/overlays; ESO {{`{{`}} placeholders escaped; the remoteRef key is the flat OpenBao path secret/data/<key> (deploy#1733) */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- if (.Values.externalSecrets.preSyncBringup) }}
  # Deterministic cold-bringup ordering (deploy#820): this ExternalSecret is
  # STANDING infrastructure — it owns its target Secret for the life of the
  # install (creationPolicy: Owner), so it must NOT be an Argo hook: hook
  # lifecycle (BeforeHookCreation deletes, operation-retry cleanup) deletes the
  # ExternalSecret and cascade-deletes the owned Secret out from under running
  # workloads (observed live on staging, 2026-06-11). A regular resource at an
  # early sync-wave (-8, after the store at -10, before the zitadel init chain
  # at -6/-4/-3) gives the same cold-sync ordering with a durable object.
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  {{- end }}
  name: gibson-zitadel-system-key
  namespace: gibson
# The System API key has two slots, each with its own System API user
# (ADR-0171, row platform-generated-secrets). Zitadel trusts the public key of
# both users. The platform-operator gets the private key and the user of the
# active slot only. A slot value that is not a or b renders both empty, and
# the operator refuses to start: there is no default slot.
spec:
  data:
  - remoteRef:
      key: gibson-zitadel-system-bot-key
      property: private_key
    secretKey: a_private
  - remoteRef:
      key: gibson-zitadel-system-bot-key
      property: public_key
    secretKey: a_public
  - remoteRef:
      key: gibson-zitadel-system-bot-key-b
      property: private_key
    secretKey: b_private
  - remoteRef:
      key: gibson-zitadel-system-bot-key-b
      property: public_key
    secretKey: b_public
  - remoteRef:
      key: gibson-zitadel-system-active
      property: slot
    secretKey: slot
  refreshInterval: 60s
  secretStoreRef:
    kind: ClusterSecretStore
    name: gibson-secrets
  target:
    creationPolicy: Owner
    name: gibson-zitadel-system-key
    template:
      engineVersion: v2
      type: Opaque
      data:
        private-key.pem: '{{ `{{ if eq .slot "a" }}{{ .a_private }}{{ else if eq .slot "b" }}{{ .b_private }}{{ end }}` }}'
        user: '{{ `{{ if eq .slot "a" }}gibson-system-bot{{ else if eq .slot "b" }}gibson-system-bot-b{{ end }}` }}'
        public-key.pem: '{{ `{{ .a_public }}` }}'
        public-key-b.pem: '{{ `{{ .b_public }}` }}'
