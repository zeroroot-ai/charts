{{/*
Image pull credential — provider-neutral, single path per install.

ONE credential path renders per install (deploy#1732). imageCredentials.source
selects which upstream feeds the one dockerconfigjson Secret:

  secretStore (default): the credential is read from the ClusterSecretStore. On
    the zeroroot estate the keyring member lands in Secret/bringup-keyring, the
    openbao-auto-init sidecar copies it into OpenBao, and this ExternalSecret
    materialises the dockerconfigjson. A customer mirroring the images into
    their own registry sets registry/username/remoteKey and provides that
    credential in the store.

  generator: the token is minted and refreshed by an ESO generator the operator
    supplies (generatorRef). The chart names no provider; the concrete generator
    object lives with the operator's estate. The generator must yield a `token`
    key, used here as the registry password. This is how the zeroroot estate
    mints short-lived GHCR tokens, but the chart neither knows nor cares which
    generator it is.

Host, username and secret name are values, so an install that repoints the
images repoints the credential with them. This is config, not a second code
path — exactly one ExternalSecret renders.
*/}}
{{- $ic := .Values.imageCredentials | default dict -}}
{{- $source := $ic.source | default "secretStore" -}}
{{- $registry := $ic.registry | default ((.Values.global).registry) | default "ghcr.io" -}}
{{- $username := $ic.username | default "x-access-token" -}}
{{- $secretName := $ic.secretName | default "ghcr-credentials" -}}
{{- $store := ((.Values.externalSecrets).clusterSecretStore).name | default "gibson-secrets" -}}
{{- $gen := $ic.generatorRef | default dict -}}
{{- if eq $source "generator" }}
  {{- if or (not $gen.kind) (not $gen.name) }}
    {{- fail "imageCredentials.generatorRef.kind and .name are required when imageCredentials.source is \"generator\"" }}
  {{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- if (.Values.externalSecrets.preSyncBringup) }}
  # Deterministic cold-bringup ordering (deploy#820): this ExternalSecret is
  # STANDING infrastructure — it owns its target Secret for the life of the
  # install (creationPolicy: Owner), so it must NOT be an Argo hook: hook
  # lifecycle (BeforeHookCreation deletes, operation-retry cleanup) deletes the
  # ExternalSecret and cascade-deletes the owned Secret out from under running
  # workloads (observed live on staging, 2026-06-11). A regular resource at an
  # early sync-wave (-8, after the store at -10, before the zitadel init chain
  # at -6/-4/-3) gives the same cold-sync ordering with a durable object.
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  {{- end }}
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
spec:
{{- if eq $source "generator" }}
  # Re-mint before the generator's token expires, so the pull secret never
  # holds a stale token.
  refreshInterval: {{ printf "%dm" (int ($ic.refreshMinutes | default 45)) }}
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: {{ $gen.apiVersion | default "generators.external-secrets.io/v1alpha1" }}
        kind: {{ $gen.kind }}
        name: {{ $gen.name }}
  target:
    creationPolicy: Owner
    name: {{ $secretName }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # The generator emits `token`; the registry accepts it as the password.
        .dockerconfigjson: |
          {"auths":{"{{ $registry }}":{"username":"{{ $username }}","password":"{{ "{{" }} .token {{ "}}" }}","auth":"{{ "{{" }} printf "{{ $username }}:%s" .token | b64enc {{ "}}" }}"}}}
{{- else }}
  data:
  - remoteRef:
      key: {{ $ic.remoteKey | default "ghcr-pull-secret" }}
      property: {{ $ic.remoteProperty | default "pat" }}
    secretKey: pat
  refreshInterval: 60s
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    creationPolicy: Owner
    name: {{ $secretName }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # The registry accepts the stored value as the password. ghcr.io takes a
        # PAT with any non-empty username; a registry that wants a real login
        # sets imageCredentials.username.
        .dockerconfigjson: |
          {"auths":{"{{ $registry }}":{"username":"{{ $username }}","password":"{{ "{{" }} .pat {{ "}}" }}","auth":"{{ "{{" }} printf "{{ $username }}:%s" .pat | b64enc {{ "}}" }}"}}}
{{- end }}
