{{/* ADR-0171, row postgres-role-passwords: the login role of spire
is issued by the OpenBao database engine (templates/external-secrets/
postgres-logins.yaml in gibson-workloads). The Secret holds username and
password; every 24 hours ESO asks for a new login role. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- if (.Values.externalSecrets.preSyncBringup) }}
  # Standing infrastructure at an early sync-wave (deploy#820), never a hook.
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  {{- end }}
  name: spire-postgres-credentials
  namespace: gibson
spec:
  refreshInterval: 24h
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: VaultDynamicSecret
        name: postgres-login-spire
  target:
    creationPolicy: Owner
    name: spire-postgres-credentials
    template:
      type: Opaque
      data:
        username: '{{ "{{" }} .username {{ "}}" }}'
        password: '{{ "{{" }} .password {{ "}}" }}'
