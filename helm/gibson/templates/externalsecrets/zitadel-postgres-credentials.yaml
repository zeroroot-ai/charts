{{/* ADR-0171, row postgres-role-passwords: the login role of zitadel
is issued by the OpenBao database engine (templates/external-secrets/
postgres-logins.yaml in gibson-workloads). The Secret holds username and
password; every 24 hours ESO asks for a new login role. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # No early sync-wave. The login comes from the OpenBao database engine,
  # which the openbao-auto-init sidecar writes only after the Postgres
  # superuser exists, and the platform operator at wave 0 makes the Postgres
  # cluster. An ExternalSecret at wave -8 gates the operator and waits for a
  # cluster that the operator makes: a from-zero install never ends.
  # scripts/check-postgres-logins-wave.py fails on a wave below 0.
  name: zitadel-postgres-credentials
  namespace: gibson
spec:
  refreshInterval: 24h
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: VaultDynamicSecret
        name: postgres-login-zitadel
  target:
    creationPolicy: Owner
    name: zitadel-postgres-credentials
    template:
      type: Opaque
      data:
        username: '{{ "{{" }} .username {{ "}}" }}'
        password: '{{ "{{" }} .password {{ "}}" }}'
