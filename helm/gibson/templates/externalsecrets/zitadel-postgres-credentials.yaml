{{/* ADR-0171, row postgres-role-passwords: the login role of zitadel
is issued by the OpenBao database engine (templates/external-secrets/
postgres-logins.yaml in gibson-workloads). The Secret holds username and
password; every 24 hours ESO asks for a new login role. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- if (.Values.externalSecrets.preSyncBringup) }}
  # Wave -5: after the Postgres cluster (-7) and the setup Jobs (-6) that make
  # the owner role, and before zitadel-init (-4) and every consumer. The login
  # comes from the OpenBao database engine. The openbao-auto-init sidecar
  # writes the engine once the CNPG superuser Secret exists, and a login is a
  # member of its owner role. Earlier than -6 the role does not exist. Later
  # than -4 the Jobs that mount this Secret wait for it for ever.
  # scripts/check-postgres-logins-wave.py holds the order.
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  {{- end }}
  name: zitadel-postgres-credentials
  namespace: gibson
spec:
  refreshInterval: 24h
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: VaultDynamicSecret
        name: postgres-login-zitadel
  target:
    creationPolicy: Owner
    name: zitadel-postgres-credentials
    template:
      type: Opaque
      data:
        username: '{{ "{{" }} .username {{ "}}" }}'
        password: '{{ "{{" }} .password {{ "}}" }}'
