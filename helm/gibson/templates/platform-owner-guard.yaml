{{- /*
Platform owner and first-tenant-Owner install-value guard
(ADR-0093 decisions 6/8, hosted#201/#202).

Two required values name the two humans this install creates on day one:
global.platformOwner.email (the one Zitadel administrator every install has,
no exceptions) and global.firstTenant.ownerEmail (the seeded first tenant's
Owner, required only when global.firstTenant.enabled is true — SaaS/staging/
prod create their first tenant through self-serve signup instead and leave
that value empty on purpose). `required` fails the render with a clear
message when a value that must be set is empty; the checks below cover what
`required` cannot: two DIFFERENT addresses, and a working way to reach each
of them.

MAIL. Zitadel emails the setup link through its own invite-code flow, for
BOTH the Platform owner and the seeded first tenant's Owner — the same
mechanism, reused rather than a second one (ADR-0027). A profile that ships
no delivering transport (gibson-workloads.gibson.email.provider != "smtp")
must say so on purpose with offlineSetup: true on whichever of the two is in
play, or the operator/first-admin Job would try to send a link nothing can
deliver and that person could never sign in. Offline mode instead writes a
one-time, expiring link to a Secret (readable only by cluster
administrators) named by setupSecretRef — see operators/platform (Platform
owner) and cmd/bootstrap-tenant-owner (first tenant's Owner) in
zeroroot-ai/gibson. No password is ever written to a Secret, for either.

This template renders no resource: it exists to run these checks on every
`helm template` / `helm install` / `helm upgrade`, unconditionally.
*/ -}}
{{- $po := .Values.global.platformOwner | default dict -}}
{{- $ft := .Values.global.firstTenant | default dict -}}
{{- $ownerEmail := required "global.platformOwner.email is REQUIRED — it is the address that becomes the one Zitadel administrator this install creates (ADR-0093 decision 6, hosted#201)." $po.email -}}
{{- if $ft.enabled -}}
{{- $tenantOwnerEmail := required "global.firstTenant.ownerEmail is REQUIRED when global.firstTenant.enabled is true — it is the address of the seeded first tenant's Owner (ADR-0093)." $ft.ownerEmail -}}
{{- if eq (lower $ownerEmail) (lower $tenantOwnerEmail) -}}
{{- fail (printf "global.platformOwner.email and global.firstTenant.ownerEmail are both %q. They must be different addresses: the Platform owner administers Zitadel and belongs to no tenant, and the first tenant's Owner is a tenant user with no Zitadel administrator role (ADR-0093 decision 6)." $ownerEmail) -}}
{{- end -}}
{{- end -}}
{{- $wl := index .Values "gibson-workloads" | default dict -}}
{{- $mailConfigured := eq ((($wl.gibson | default dict).email | default dict).provider | default "log") "smtp" -}}
{{- if and (not $mailConfigured) (not $po.offlineSetup) -}}
{{- fail "global.platformOwner.email has no way to reach its owner: gibson-workloads.gibson.email.provider is not \"smtp\" (no delivering mail transport) and global.platformOwner.offlineSetup is not true. Configure real mail, or set global.platformOwner.offlineSetup: true so the platform-operator writes a one-time setup link to global.platformOwner.setupSecretRef instead (ADR-0093 decision 8)." -}}
{{- end -}}
{{- if $po.offlineSetup -}}
{{- if not (($po.setupSecretRef | default dict).name) -}}
{{- fail "global.platformOwner.offlineSetup is true but global.platformOwner.setupSecretRef.name is empty — the platform-operator needs a Secret name to write the one-time setup link into." -}}
{{- end -}}
{{- if not (($po.setupSecretRef | default dict).key) -}}
{{- fail "global.platformOwner.offlineSetup is true but global.platformOwner.setupSecretRef.key is empty — the CRD's SecretKeyRef type requires it (e.g. \"setup-link\")." -}}
{{- end -}}
{{- end -}}
{{- if $ft.enabled -}}
{{- if and (not $mailConfigured) (not $ft.offlineSetup) -}}
{{- fail "global.firstTenant.ownerEmail has no way to reach its Owner: gibson-workloads.gibson.email.provider is not \"smtp\" (no delivering mail transport) and global.firstTenant.offlineSetup is not true. Configure real mail, or set global.firstTenant.offlineSetup: true so the first-admin Job writes a one-time setup link to global.firstTenant.setupSecretRef instead (ADR-0093 decision 8, hosted#202)." -}}
{{- end -}}
{{- if $ft.offlineSetup -}}
{{- if not (($ft.setupSecretRef | default dict).name) -}}
{{- fail "global.firstTenant.offlineSetup is true but global.firstTenant.setupSecretRef.name is empty — the first-admin Job needs a Secret name to write the one-time setup link into." -}}
{{- end -}}
{{- if not (($ft.setupSecretRef | default dict).key) -}}
{{- fail "global.firstTenant.offlineSetup is true but global.firstTenant.setupSecretRef.key is empty — the CRD's SecretKeyRef type requires it (e.g. \"setup-link\")." -}}
{{- end -}}
{{- end -}}
{{- end -}}
