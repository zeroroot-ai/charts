{{- /*
The one token the External Secrets controller mints in this namespace.

The upstream ClusterRole grants `create serviceaccounts/token` on every
ServiceAccount in the cluster. scripts/vendor-operator-rbac.py removes that
rule (REMOVED_RULES) because a token for a ServiceAccount lets its holder act
as that workload. The controller mints a token only for the ServiceAccount a
store names for its own login:

  gibson-secrets (gibson-workloads templates/external-secrets/
  cluster-secret-store.yaml) logs in to OpenBao with the controller's own
  ServiceAccount, `external-secrets` in the release namespace.

This Role grants that one name. It is the only store: the setec disk
signing seed reaches the setec namespace through the same OpenBao store
(gibson-workloads templates/setec/disk-signing-externalsecret.yaml).

Gated on the externalSecrets seam, like the vendored RBAC: a cluster that
brings its own External Secrets brings its own grants.
*/ -}}
{{- if (.Values.externalSecrets).enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-store-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # The wave of the rest of the controller's RBAC (external-secrets-rbac.yaml).
    argocd.argoproj.io/sync-wave: '-20'
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["external-secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-store-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-store-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: {{ .Release.Namespace }}
{{- end }}
