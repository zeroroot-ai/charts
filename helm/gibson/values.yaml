          tag: "sha256:ef209fd7d231ead12bf24287db24991bdd979669f4df2e037698f94545816d3e"
      toolkit:
        # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
        image:
          registry: "ghcr.io"
          repository: "zeroroot-ai/mirror/chainguard-min-toolkit-debug"
          tag: "sha256:6ba4fb1b19bb35fa0b7e6bf08b308379a5b865727e50b7b3068efb824b39ebba"

cert-manager:
  # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
  image:
    repository: "ghcr.io/zeroroot-ai/mirror/cert-manager-controller"
    tag: "v1.21.1"
    digest: "sha256:416a2d76870d996460e62bd7f521bf14fa017be9e3e904aab92163a331fcb61a"
  # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
  # egress-fqdn cert-manager: the ACME directory of Let's Encrypt, and the
  # hosts of the solver (the self-check, or Route53 and its name servers).
  podLabels:
    gibson.zeroroot.ai/net-role: system
    gibson.zeroroot.ai/metrics-port: "9402"
    gibson.zeroroot.ai/kube-api: "true"
    gibson.zeroroot.ai/egress-fqdn: cert-manager
  # Canonical names (cert-manager, cert-manager-webhook, cert-manager-cainjector)
  # rather than gibson-cert-manager-*: the vendored RBAC in templates/operators/
  # names these ServiceAccounts, and the admission inventory pins the webhook
  # configuration names.
  fullnameOverride: cert-manager
  crds:
    # CRDs come from gibson-crds. See the header above.
    enabled: false
  global:
    rbac:
      # Rendered by templates/operators/cert-manager-rbac.yaml with the sync-wave
      # the upstream chart cannot set. Never flip this on: two owners of one
      # ClusterRole is a permanent Argo diff.
      create: false
  # The install-time API check is a Helm hook Job that waits for the webhook.
  # Under Argo it becomes a PostSync hook that adds nothing the waves do not
  # already guarantee, and on the Helm-native path the chart's CRs are created
  # before the webhook configuration exists (see the header). Off.
  startupapicheck:
    enabled: false
  deploymentAnnotations:
    argocd.argoproj.io/sync-wave: "-20"
  serviceAnnotations:
    argocd.argoproj.io/sync-wave: "-20"
  serviceAccount:
    annotations:
      argocd.argoproj.io/sync-wave: "-20"
  webhook:
    # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
    image:
      repository: "ghcr.io/zeroroot-ai/mirror/cert-manager-webhook"
