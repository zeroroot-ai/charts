# Gibson umbrella chart values.
#
# Each sub-chart is configured under its own key. With no overrides the
# umbrella renders exactly what installing the three sub-charts with their
# own defaults produces; per-environment shape (replicas, resources, DNS,
# image digests) is supplied by an env overlay
# (gitops envs/<env>/values.yaml — slice #787/#790/gitops#250), not here.
#
# Sub-chart defaults live in each sub-chart's own values.yaml and are NOT
# duplicated here; only cross-cutting umbrella-level overrides belong in this
# file.

# Helm propagates `global` into every sub-chart, so the platform external
# domain is set ONCE here and read by gibson-common's `gibson.domain` helper
# (deploy#630 — single source of truth, no hardcoded hostname fallback). The
# env overlay sets the real value (e.g. staging.zeroroot.ai); the default is
# the prod apex so an un-overlaid render is prod-shaped. (deploy#805)
# =============================================================================
# Operator-substitution seams.
#
# Each selects WHOSE operator runs, never WHETHER one runs. Every install runs
# exactly one cert-manager, one External Secrets Operator, one ExternalDNS and
# one CloudNativePG. Default true: a greenfield cluster needs to set nothing.
#
# Set false when the cluster already owns that operator — OpenShift,
# or any brownfield estate. The platform then uses theirs, and this chart
# installs neither the operator nor its CRDs.
#
# NOT an optional service and NOT a feature flag. One code path, two possible
# owners. A cluster with zero of any of these does not boot, and nothing here
# makes that shape reachable.
#
# The CRDs follow the same switch: shipping a subset of
# certificates.cert-manager.io would overwrite a customer's copy underneath
# their running controller.
# =============================================================================
# =============================================================================
# Image registry.
#
# Every first-party image resolves to `global.registry` unless its own
# `repository` names a host. Repointing a whole install at a mirror is one
# value; repointing a single image — which a rebuild under different naming
# needs — is still that image's own `repository` key.
#
# The pull credential follows the same host by default, so an install that
# moves the images moves the credential with them.
# =============================================================================
imageCredentials:
  # One chain on every install (ADR-0084): the keyring, OpenBao, and this
  # ExternalSecret from the ClusterSecretStore. A customer mirroring the
  # images into their own registry sets registry/username/remoteKey to match.
  # Host the credential is scoped to. Defaults to global.registry.
  registry: ""
  # Username presented at that registry. ghcr.io accepts any non-empty value
  # alongside a token; a registry that wants a real login sets it here.
  username: "x-access-token"
  # Where the credential lands, and where it is read from in the store.
  secretName: "ghcr-credentials"
  remoteKey: "ghcr-pull-secret"
  remoteProperty: "pat"

certManager:
  enabled: true

externalDns:
  enabled: true


global:
  spire:
    # The SPIFFE trust domain of this install (ADR-0164). It is the one value
    # that names the domain. The vendored SPIRE chart reads this key, and the
    # chart builds each SPIFFE ID from it and a path (gibson.spiffeID). Each
    # install sets its own: the SaaS uses zeroroot.ai, and a second cluster or
    # an on-prem install uses a different name. The render fails when it is
    # empty. A trust domain cannot change on a running install: every SVID and
    # every agent belongs to it.
    trustDomain: ""
  # Host every first-party image resolves against, unless its own
  # `repository` names one. The pull credential follows this by default.
  registry: ghcr.io
  # The one alpine-k8s tool image (kubectl + sh) every first-party Job, init
  # container and gate runs, rendered by the `gibson.toolImage` helper. This
  # is the source of the `alpine-k8s` version link in zeroroot-ai/.github
  # version-links.yaml; the zitadel subchart's own tool image follows it
  # through the fan-out, every first-party template reads it. The tag tracks the
  # cluster's Kubernetes minor, not the newest release. Add a new tag to the
  # org mirror list before moving it.
  toolImage:
    repository: ghcr.io/zeroroot-ai/mirror/alpine-k8s
    tag: "1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
  # No default domain. Every profile (values-baseline.yaml and the overlays
  # in hosted/gitops) sets it, and gibson.domain fails the render when it is
  # empty. An install with no serving domain of its own must not claim
  # zeroroot.ai in its OIDC issuer, TLS SANs and app hosts.
  domain: ""
  networkPolicy:
    # CIDRs the kube-apiserver answers from, for the few policies that
    # narrow egress (OpenBao).
    #
    # Empty means NO RULE, and that is a trap rather than a default. It was
    # written as "kind does not police node-bound traffic", which is true and
    # is not a reason: kind's CNI does not implement NetworkPolicy at all, so
    # every policy this chart ships is inert there and an omission is
    # invisible. k3s enforces them. On k3d, OpenBao's first Kubernetes-auth
    # login died with
    #
    #   Post ".../tokenreviews": dial tcp 10.43.0.1:443: connect: connection
    #   refused
    #
    # which the login reports as a bare "permission denied", and from there
    # the secret store is InvalidProviderConfig, every ExternalSecret is
    # SecretSyncedError, and the platform never finishes. Measured 2026-09-14
    # (charts#80).
    #
    # scripts/baseline-up.sh now passes the cluster's own `kubernetes` Service
    # ClusterIP here on every substrate, which is the address a pod reaches
    # the apiserver through. A manual `helm install` must pass it too:
    #
    #   --set-json "global.networkPolicy.apiServerCIDRs=[\"$(kubectl get svc \
    #     kubernetes -o jsonpath='{.spec.clusterIP}')/32\"]"
    #
    # An EKS estate lists TWO things here: its VPC CIDR
    # (the control-plane ENIs) and the `kubernetes` Service ClusterIP (the
    # first address of the cluster's service CIDR). The AWS VPC CNI network
    # policy agent judges egress against the destination before kube-proxy
    # rewrites it, so a pod that dials kubernetes.default.svc is matched on
    # the ClusterIP. Measured on staging 2026-09-10: with only the VPC CIDR
    # allowed, the ENI addresses answered and the ClusterIP timed out, and
    # OpenBao's Kubernetes-auth TokenReview died with it.
    apiServerCIDRs: []
    # The namespace of the CloudNativePG operator of the cluster, on a guest
    # profile (cnpg.enabled false). The Postgres rule admits that operator on
    # the instance manager port from this namespace only. Empty is refused
    # when cnpg.enabled is false. With cnpg.enabled true the operator of this
    # chart carries the Postgres client label and no rule reads this value.
    cnpgOperatorNamespace: ""
    # Egress host groups of the install, for a pod that another chart of the
    # install deploys (D76). Each key is a group name, and each entry is a
    # URL, a host:port or a host outside the cluster. A pod with the label
    # gibson.zeroroot.ai/egress-fqdn: <group> reaches only these hosts, each
    # on its own port (443 when the entry names no port). The chart renders
    # one policy for each group (templates/network-policies.yaml). A name of
    # a group of the chart (zitadel, tenant-operator, cert-manager,
    # external-dns, object-store) and a host in the cluster fail the render.
    # Example:
    #   egressHostGroups:
    #     payments:
    #       - https://api.payments.example
    #       - app.example.com:443
    egressHostGroups: {}
    # The cluster scraper that reads the metrics ports (the metrics policy of
    # templates/network-policies.yaml). The policy admits only a pod in this
    # namespace with these labels, and only to the metrics port of each pod
    # (gibson.metricsPorts). A pod label alone is not proof: the person who
    # creates a pod chooses its labels, so the namespace is pinned too.
    # The default is the kube-prometheus-stack Prometheus of the hosted estate.
    metricsScraper:
      namespace: monitoring
      matchLabels:
        app.kubernetes.io/name: prometheus
  # (deploy#1733): OpenBao is the one External Secrets backend on
  # every substrate, so there is no backend selector and no key prefix.
  # `global.secretBackend` and `global.secretPrefix` are DELETED. A values
  # file that still sets either one fails the render and names the key
  # (gibson.assertSecretKnobsDeleted).

  # First-tenant seed (gibson#1496) — headless first-admin bring-up for a
  # self-hosted install that has no self-serve signup. `global` so BOTH
  # subcharts read ONE identity: the tenant-operator (gibson-operators) enqueues
  # the tenant over its SPIFFE identity — bypassing the session gate that denies
  # a headless AdminProvisionTenant — and the first-admin Job (gibson-workloads)
  # creates the owner user once that tenant's Zitadel org exists. Split values
  # would hang the Job waiting on a tenant id the operator never seeded.
  # Disabled by default: SaaS/staging/prod create the first tenant via signup.
  firstTenant:
    enabled: false
    tenantId: ""
    displayName: ""
    # Required whenever firstTenant.enabled is true (ADR-0093 decision 8,
    # hosted#201): the render fails, naming the missing value, if it is
    # empty. Must differ from global.platformOwner.email — see that value's
    # comment. Ignored, and left empty on purpose, on every profile that
    # creates its first tenant through self-serve signup instead
    # (firstTenant.enabled: false — SaaS/staging/prod).
    ownerEmail: ""
    # offlineSetup: true skips emailing the seeded Owner's setup link and
    # instead writes a one-time, expiring link to a Secret readable only by
    # cluster administrators (ADR-0093 decision 8, hosted#202) — the exact
    # same mechanism global.platformOwner.offlineSetup uses, reused here
    # rather than a second one (ADR-0027). Set this explicitly on a profile
    # with no delivering mail transport
    # (global.email.provider != "smtp") — the render fails
    # otherwise, naming both keys. Ignored when firstTenant.enabled is false.
    offlineSetup: false
    # setupSecretRef names the Secret (and the key within it) the
    # first-admin Job writes the offline setup link into. Required when
    # offlineSetup is true; ignored otherwise.
    setupSecretRef:
      name: ""
      key: "setup-link"
    # The plan the seeded tenant lands on. It must be a canonical plan id
    # (internal/platform/plans), and on any cluster that enforces billing it
    # must be an UNPAID one: the daemon withholds a paid tier with no active
    # billing record from the provisioning drain, for ever, with
    #   pending tenant withheld from provisioning drain
    #   tier=team reason="paid plan without an active billing record"
    # Measured on staging 2026-09-23: the chart rendered no FIRST_TENANT_TIER,
    # the seed enqueued an empty tier, the daemon defaulted it to `team`, and
    # the tenant never left the queue. The first-admin Job then waited for a
    # tenant that could never arrive, and the Argo sync never finished its
    # hook. No canonical plan is both self-serve and unpaid, so the seed uses
    # enterprise-deploy: the administrator-provisioned on-prem plan, which is
    # exactly what a headless first-admin seed is.
    tier: "enterprise-deploy"

  # Platform owner (ADR-0093 decision 6/8, hosted#201): the ONE human
  # Zitadel administrator this install creates. No password is ever
  # generated — Zitadel emails a one-time setup link built on its own
  # invite-code flow, and the person sets a password and enrolls MFA in
  # that same flow. Required on EVERY profile, with no exceptions: unlike
  # firstTenant, there is no self-serve path that creates this account —
  # every install, SaaS included, needs exactly one Zitadel administrator.
  platformOwner:
    # Required (ADR-0093 decision 8): the render fails, naming this key,
    # if it is empty. Must differ from global.firstTenant.ownerEmail
    # (case-insensitively) — the Platform owner administers Zitadel and
    # belongs to no tenant; the first tenant's Owner is a tenant user with
    # no Zitadel administrator role. The two can never be the same person
    # on the same install.
    email: ""
    # offlineSetup: true skips emailing the setup link and instead writes a
    # one-time, expiring link to a Secret readable only by cluster
    # administrators (ADR-0093 decision 8). Set this explicitly on a
    # profile with no delivering mail transport
    # (global.email.provider != "smtp") — the render fails
    # otherwise, naming both keys, so a cluster can never be left unable to
    # reach the one person who can sign in and set everything else up.
    offlineSetup: false
    # setupSecretRef names the Secret (and the key within it, required by
    # the CRD's shared SecretKeyRef type) the operator writes the offline
    # link into. Required when offlineSetup is true; ignored otherwise.
    setupSecretRef:
      name: "gibson-platform-owner-setup"
      key: "setup-link"
    # setupGeneration is the Platform owner's reset (ADR-0093 decision 12):
    # raising this integer clears every second factor on file and sends a
    # new setup link. A reviewed change to this value, committed and
    # rolled out like any other — never a live-cluster action.
    setupGeneration: 1
  # The one mail value of the install (hosted#223, ADR-0027). The daemon, the
  # tenant-operator's welcome mail and Zitadel's SMTP provider (the
  # PlatformBootstrap) all read it, so the three cannot drift apart. The old
  # blocks gibson-workloads.gibson.email, gibson-operators.tenantOperator.smtp
  # and gibson-operators.platformBootstrap.zitadel.smtp were deleted, and
  # setting one fails the render.
  #
  # provider: log   the daemon logs each mail and sends none. The
  #                 tenant-operator sends its welcome mail to the in-cluster
  #                 mailpit sink. Zitadel gets no SMTP provider, so set
  #                 global.platformOwner.offlineSetup (and
  #                 global.firstTenant.offlineSetup when it is enabled).
  # provider: smtp  all three send through smtp.host.
  #
  # Worked example, an SES relay whose credential is seeded in the secret
  # store under ses-smtp-credentials (properties username and password):
  #
  #   global:
  #     email:
  #       provider: smtp
  #       from: "no-reply@example.com"
  #       fromName: "Example"
  #       smtp:
  #         host: "email-smtp.us-east-1.amazonaws.com"
  #         port: 587
  #         tlsMode: starttls        # starttls (587) | implicit (465) | plaintext
  #         configurationSet: ""     # SES only; empty for other relays
  #         credentials:
  #           source: secretStore    # secretStore | secret | none
  #           remoteKey: "ses-smtp-credentials"
  #           secretName: ""         # source secret: a Secret with keys username, password
  #
  # source secretStore renders the ExternalSecret <release>-email-smtp from
  # remoteKey. source secret names a Secret the operator creates. source none
  # is a relay that takes no credential, and it is the only source allowed
  # with tlsMode plaintext.
  email:
    provider: "log"
    from: ""
    fromName: ""
    smtp:
      host: ""
      port: 587
      tlsMode: "starttls"
      configurationSet: ""
      credentials:
        source: "secretStore"
        remoteKey: "ses-smtp-credentials"
        secretName: ""

# In-cluster CNPG `Cluster` shape (deploy#1389), rendered by
# templates/postgres/platform-postgres-cluster.yaml on EVERY profile
# (deploy#1730). The `externalPostgres` knob that used to select a
# managed Postgres is gone; a values file that still sets it fails the
# render.
#
# THE REDUNDANCY POSTURE (deploy#1729). Aurora leaves the platform
# only because this Cluster carries the same durability, so the defaults
# below ARE the staging and prod shape. Every install that does not override
# them gets three instances, synchronous replication (a commit is on a second
# copy before it returns), one instance per zone, a WAL volume of its own, a
# switchover on every primary roll, and the operator's PodDisruptionBudgets.
# kind sets `instances: 1` as a PROFILE value
# (test/baseline/ci-2core-resources.values.yaml in CI, gitops envs/dev for the
# dev cluster). That count is the only difference between kind and prod: no
# flag gates any setting below. The primary-kill step of
# zeroroot-ai/hosted .github/workflows/exit-test-backup-restore.yml proves the
# posture live.
platformPostgres:
  # 3 = one primary and two replicas. 1 = kind. The synchronous block renders
  # only above one instance, because a single instance has no standby to wait
  # for and CNPG rejects synchronous.number >= instances. Nothing else changes
  # with the count.
  instances: 3
  storage:
    size: 10Gi
    # Empty → the cluster's default StorageClass. Overlays set an explicit
    # class where the default is unsuitable.
    storageClass: ""
  # WAL on its own volume: a full data volume never stops WAL, and a WAL burst
  # never fills the data volume. Same StorageClass rule as storage.
  walStorage:
    size: 5Gi
    storageClass: ""
  # A commit returns only after ANY 1 standby has the WAL on disk. `required`
  # keeps that true when a standby is down: writes then wait rather than land
  # on one copy. Durability over availability, on purpose.
  synchronous:
    method: any
    number: 1
    dataDurability: required
  # One instance per zone, enforced. A node with no zone label matches no
  # rule, so kind and a single-node self-host schedule every instance anyway.
  # A cluster whose nodes carry zone labels but sit in ONE zone must set
  # topologyKey to kubernetes.io/hostname, or two of three instances stay
  # Pending.
  affinity:
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
  # A primary roll promotes a replica first (switchover), then restarts the
  # old primary as a replica. `restart` takes the primary down first.
  primaryUpdateMethod: switchover
  # The operator performs the switchover on its own. `supervised` waits for a
  # human to promote, which no recreate has.
  primaryUpdateStrategy: unsupervised
  # The operator's PodDisruptionBudgets: a drain cannot evict the primary and
  # cannot take the last replica.
  enablePDB: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi

  # postgresql.conf. archive_timeout is the recovery point objective for
  # unplanned loss: a WAL segment is
  # shipped to the durable bucket at least every 300 s, so at most five
  # minutes of commits are lost when every instance dies at once.
  parameters:
    archive_timeout: "300s"

  # Restore-on-bringup (deploy#1739). EMPTY on every profile and
  # in every values file: with no id the Cluster renders `bootstrap.initdb`
  # and the database is empty, always, even when the barman catalog in the
  # durable bucket is full. `make recreate ENV=<env> RESTORE_FROM=<name>`
  # is the ONLY producer of a value here: it reads the CNPG base backup id
  # out of the named Velero backup and passes it as a Helm parameter, so
  # Postgres recovers from the backup that was named and never from the
  # newest one in the catalog. There is no `latest` and no auto-detect.
  #
  # Setting this by hand in a values file is a mistake: the id would then
  # survive into every later sync and the Cluster would try to recover on a
  # bringup that asked for an empty database.
  recovery:
    backupID: ""
    # The archive the named backup was written under: <destinationPath>/
    # <serverName>/. REQUIRED with backupID. `make recreate RESTORE_FROM=`
    # reads it out of the same CNPG Backup record as the id
    # (status.serverName) and passes both. It must differ from
    # backup.serverName below: a cluster cannot recover from the archive it
    # is about to write into, and the render refuses the pair.
    serverName: ""

  # Continuous backup to the DURABLE BUCKET (deploy#1730), on every
  # profile. The bucket is a substrate input: stage 0 creates it (MinIO on
  # kind, S3 on AWS, the operator's own store on-prem) and preflight proves
  # it live before stage 1 starts, so the chart never asks whether it exists.
  #
  # What the platform writes: every completed WAL segment (continuous, and at
  # least every archive_timeout), plus one base backup a day. What restores
  # it: `bootstrap.recovery` from the same prefix on a recreate that names a
  # backup. Retention is the bucket's lifecycle rule on backups/
  # and nothing else: the platform credential cannot delete an object, and
  # the render carries no retentionPolicy for exactly that reason.
  #
  # Three keys are the seam `make recreate` fills from substrate.env
  # (deploy#1737): destinationPath (BUCKET_NAME), endpointURL
  # (BUCKET_ENDPOINT) and the two credential Secret refs below, which the
  # bringup writes into the release namespace from the keyring.
  #
  # THERE IS NO DEFAULT BUCKET. The defaults used to be kind's stage 0
  # (s3://gibson-kind on the kind MinIO address), so the supported
  # self-hosted profile archived a customer's WAL to the vendor's own dev
  # bucket address, the documented restore path recovered nothing, and the
  # `required` guard in the Cluster template could never fire. The kind
  # values now live in the developer and CI rungs, which are kind's.
  backup:
    # s3://<durable-bucket>/backups/postgres/. REQUIRED: the render fails
    # without it, and fails unless the path sits under backups/, the prefix
    # the lifecycle rule covers.
    destinationPath: ""

    # The S3 API endpoint. Empty means AWS S3 for the bucket's region. A
    # MinIO or other S3-compatible store sets its address here.
    endpointURL: ""

    # Which instance serves the base backup. `prefer-standby` keeps the load
    # off the primary on the three-instance profiles and degrades to the
    # primary on its own at instances: 1 (kind), so one value is correct for
    # every profile.
    target: prefer-standby

    # The name this cluster archives under: <destinationPath>/<serverName>/.
    # Empty means the Cluster's own name, CNPG's default, which is right for
    # the FIRST bootstrap into an empty archive and wrong for every later
    # one. The durable bucket outlives the cluster by design (ADR-0083), and
    # barman-cloud-check-wal-archive refuses a fresh cluster whose archive
    # directory already holds WAL: measured 2026-09-07 on a workstation
    # whose bucket held 38 segments from earlier bringups, ContinuousArchiving
    # went False on the first archive_command and every base backup sat in
    # walArchivingFailing. `make recreate` stamps a unique name on every
    # bringup (platform-postgres-<UTC stamp>); an operator installing by hand
    # into a used bucket must do the same. It never changes on an upgrade:
    # the name is the archive, and renaming it orphans the WAL.
    serverName: ""

    # The bucket credential: the BUCKET_ACCESS_KEY and BUCKET_SECRET_KEY
    # members of the bringup keyring, written by the bringup as the
    # `bringup-keyring` Secret in the release namespace BEFORE the chart
    # syncs (the same Secret the OpenBao static seal reads its key from,
    # deploy#1731). Both names are REQUIRED at render time. The chart renders
    # no Secret for them: the keyring never comes from the chart.
    s3Credentials:
      accessKeyIdSecret:
        name: "bringup-keyring"
        key: "bucket-access-key"
      secretAccessKeySecret:
        name: "bringup-keyring"
        key: "bucket-secret-key"

    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip
      jobs: 2

    # The ScheduledBackup CR, the base-backup half. Without it the
    # barmanObjectStore config gives WAL archiving and nothing else.
    scheduledBackup:
      # CNPG cron is SIX fields (leading seconds), not five. A five-field
      # expression is rejected by the operator's webhook. One a day.
      schedule: "0 30 2 * * *"
      # Take one immediately on creation, so a fresh install has a base backup
      # without waiting up to a day for the first tick.
      immediate: true
      # `self` ties the Backup objects' lifetime to the ScheduledBackup, so
      # removing the schedule cleans up its Backup CRs (the bucket objects are
      # untouched — those are the lifecycle rule's business).
      backupOwnerReference: self


# Under the umbrella (release `gibson`), the daemon Service rendered by the
# gibson-workloads sub-chart is gibson.fullname = "gibson-gibson-workloads" —
# chart+release name composition, the same divergence as the spire className
# knob below. The gibson-operators BASE default ("gibson-workloads:50051")
# was computed for the standalone gitops/kind shape where the workloads chart
# is its own release named gibson-workloads; under the umbrella no Service by
# that name exists, so the tenant-operator's operator→daemon dial
# fails on the first tenant reconcile (deploy#879, found during the staging
# signup outage 2026-06-12).
# The postgres-setup Jobs (templates/jobs/_postgres-setup.tpl) run psql
# against platform-postgres-rw. The image is the psql client the chart's
# data-plane helm test already uses (gibson-workloads tests.psqlImage), so it
# is on the org mirror and in the air-gap image list.
postgresSetup:
  image:
    repository: ghcr.io/zeroroot-ai/mirror/bitnami-postgresql
    tag: "16.4.0-debian-12-r0@sha256:be51b3aeaacc600f3eb2b596427be538b1bc17284111a1fe147030e8422c3184"

gibson-operators:
  tenantOperator:
    # The className of the SPIRE controller-manager, for the ClusterSPIFFEID
    # of each plugin instance (gibson#815). The anchor keeps it equal to
    # gibson-workloads.spire.controllerManager.className below, which takes
    # its value from this anchor.
    plugins:
      spireClassName: &spireClassName "gibson-gibson"
  # The login brand. templates/zitadel-login-branding.yaml renders this
  # ConfigMap from files/branding, and the platform-operator applies it to
  # the Zitadel instance label policy (a bootstrap step, LoginBrandingReady).
  platformBootstrap:
    zitadel:
      loginBranding:
        configMap: zitadel-login-branding

# The umbrella installs everything in ONE Argo Application/sync, so the
# secret-provisioning chain (ClusterSecretStore + ExternalSecrets) must be
# ordered before the init Jobs that mount the resulting secrets — otherwise a
# cold sync deadlocks (deploy#820). The chain is ordered with NEGATIVE
# SYNC-WAVES on regular resources (store -10 → ExternalSecrets -8 → zitadel
# config/SA/masterkey -6 → init/setup Sync hooks -4/-3 → everything at 0),
# NOT with PreSync hooks: hook lifecycle deletes hook objects between sync
# attempts, which cascade-deleted the store, the ExternalSecrets and their
# owned Secrets mid-sync on staging (2026-06-11). Kind keeps this off (its
# separate wave-ordered Applications already order secrets first).
gibson-workloads:
  externalSecrets:
    preSyncBringup: true
  # Match the kind-proven contract (values-kind.yaml): the sa-identity-map is
  # populated by PlatformBootstrap from the platformBootstrap CR's OIDCClients
  # (gibson-daemon, gibson-dashboard-service, gibson-iam-admin,
  # gibson-tenant-operator). The gibson-workloads BASE default still lists the
  # stale gibson-dashboard-sa / gibson-tool-runner-sa names, which never appear
  # in the map — the dashboard's resolve-sa-identity-map init waited forever on
  # staging (deploy#826, 2026-06-11).
  serviceAccounts:
    required:
      - gibson-iam-admin
      - gibson-tenant-operator
  spire:
    controllerManager:
      # MUST equal the className the umbrella's spire sub-chart computes for
      # its controller-manager (chart+release composition under release
      # `gibson` → "gibson-gibson"). The gibson-workloads default
      # ("gibson-gibson-spire") was computed for the old standalone
      # gibson-spire release; under the umbrella every gibson-platform-*
      # ClusterSPIFFEID was silently ignored → zero registration entries →
      # NewX509Source blocked forever → daemon/ext-authz/dashboard/
      # tenant-operator all hung at startup with no log line (observed live
      # on staging 2026-06-11; the failure mode is documented at the knob in
      # gibson-workloads/values.yaml).
      className: *spireClassName

# Cross-cutting platform secrets folded from gitops (deploy#787).
externalSecrets:
  # Operator-substitution seam; see the block at the top of this file.
  enabled: true
  # Render the folded ExternalSecrets at sync-wave -8 (regular resources, not
  # hooks — see the ordering note above). Umbrella-only.
  preSyncBringup: true
  # The `gibson-secrets` ClusterSecretStore these reference is rendered by
  # the gibson-workloads sub-chart (externalSecrets.clusterSecretStore), not
  # here, so there is exactly one store for both. It reads OpenBao and there
  # is no other backend.

# Third-party app values folded from gitops apps/*.yaml (deploy#787).

openfga:
  # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
  commonLabels:
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/client-postgres: "true"
    gibson.zeroroot.ai/kube-api: "true"
  # deploy#1170 — the openfga subchart defaults to `openfga/openfga` on Docker
  # Hub with an empty tag (so the tag falls out of the subchart's appVersion
  # and moves silently on every dependency bump). Pin it to the ghcr mirror
  # with an explicit tag. This is the ONLY place OpenFGA's image is set:
  # gibson-workloads' `openfga:` block carries service ports only.
  image:
    repository: ghcr.io/zeroroot-ai/mirror/openfga
    tag: "v1.21.0@sha256:2113c664a486b5da8d7a2cdab479e0d4e30639c80fd2c000540f645c1dbc1e55"
  # The SA is a plain main-sync resource on purpose. It was briefly a PreSync
  # hook (deploy#825) to outrun the migrate Job, but the SA is STANDING
  # infrastructure used by the running Deployment's pods — hook lifecycle
  # deletes it between sync attempts (observed live on staging 2026-06-11).
  # With the migrate Job pinned to sync-wave 0 (below), SA + datastore Secret
  # + Job all land in the same wave-0 batch, and kind-ordering applies the SA
  # before the Job. No hook needed.
  # Dev sizing — the openfga chart defaults to replicaCount=3
  # (HA prod default). On a single-tenant kind dev cluster
  # there's no HA requirement; three replicas are pure cluster
  # overhead. Drop to 1 to free runtime CPU + memory + 2 pod
  # slots. Prod overlay lives on gitops main branch and keeps
  # chart defaults. Refs deploy#331 cost-reduction.
  replicaCount: 1
  podAnnotations:
    # Restart OpenFGA when ESO rotates openfga-postgres-credentials
    # so the pod picks up the new password from env (deploy#559), and
    # when cert-manager renews the HTTP-listener keypair (deploy#1382) —
    # OpenFGA reads the cert files at startup only.
    secret.reloader.stakater.com/reload: "openfga-postgres-credentials,gibson-openfga-http-tls"
  # ---------------------------------------------------------------------------
  # Server-side TLS on the HTTP listener (deploy#1382). The Check response on
  # this listener is the allow/deny answer for every authenticated request the
  # platform serves; plaintext let any pod that joined the Service's endpoints
  # answer Checks. The keypair comes from the cert-manager Certificate
  # `gibson-openfga-http-tls` (gibson-workloads
  # templates/cert-manager/component-certificates.yaml), whose ca.crt every
  # FGA client mounts. NOTE: the subchart's `http.tls` has NO `ca` field
  # (unlike `grpc.tls`) — this is server authentication only; client identity
  # on this hop would need `authn.method: preshared` (follow-up, see #1382).
  # The gRPC listener (:8081) stays as-is: no first-party client dials it
  # (ext-authz is HTTP/JSON — deploy#140 — and its render guard rejects
  # gRPC-port overrides).
  # ---------------------------------------------------------------------------
  http:
    tls:
      enabled: true
      cert: /etc/openfga/tls/http/tls.crt
      key: /etc/openfga/tls/http/tls.key
  # The openfga image is distroless-nonroot (USER 65532); the subchart sets
  # no fsGroup by default, so a root-owned 0400 Secret mount would be
  # unreadable. fsGroup + group-readable mode make the keypair readable by
  # the server without making it world-readable.
  podSecurityContext:
    fsGroup: 65532
  # The restricted Pod Security Standard and a read-only root (ADR-0165,
  # charts#394). The server and the migrate Job run the same distroless
  # image as USER 65532 and write nothing to the root filesystem.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  extraVolumes:
    - name: http-tls
      secret:
        secretName: gibson-openfga-http-tls
        defaultMode: 0440
  extraVolumeMounts:
    - name: http-tls
      mountPath: /etc/openfga/tls/http
      readOnly: true
  datastore:
    engine: postgres
    # Shared platform-postgres-rw, role openfga, db openfga.
    uri: "postgres://placeholder@platform-postgres-rw.gibson.svc.cluster.local:5432/openfga?sslmode=disable"
    existingSecret: openfga-postgres-credentials
    secretKeys:
      usernameKey: username
      passwordKey: password
    waitForMigrations: false
  migrate:
    # Run the migration as a normal main-sync Job (NOT a PreSync hook). In the
    # single-Application umbrella, a PreSync migrate deadlocks: it needs the
    # ServiceAccount + datastore-secret, which the openfga sub-chart only
    # creates in the main Sync phase (deploy#826). As a main-sync Job those
    # prereqs apply in the same phase, and openfga runs waitForMigrations=false
    # so the Deployment self-heals once the schema lands. The openfga chart
    # HARDCODES helm.sh/hook: post-install (→ Argo PostSync), which deadlocks in
    # a single Application: PostSync only fires after the app is Healthy, but
    # openfga crashloops until migrated (gitops#140). Override to a Sync-PHASE
    # hook at wave 0 so it runs CONCURRENTLY with the Deployment (not before/
    # after) — neither waits on the other; the migrate completes and openfga
    # self-heals. (A later wave, e.g. the old wave-5 attempt, re-introduces the
    # deadlock.) Replace=true makes the immutable Job re-appliable each sync.
    #
    # sync-wave "0" is LOAD-BEARING: the upstream chart also hardcodes
    # helm.sh/hook-weight: "-5", and ArgoCD falls back to helm.sh/hook-weight
    # as the sync wave when argocd.argoproj.io/sync-wave is absent. Without the
    # explicit wave the Job runs alone at wave -5, BEFORE the wave-0 batch that
    # creates gibson-openfga-datastore-secret → CreateContainerConfigError →
    # the sync wedges on the hook forever (deploy#826, observed live on
    # staging). Pinning wave 0 batches the Job with the Secret/Deployment.
    annotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      argocd.argoproj.io/sync-options: Replace=true
      argocd.argoproj.io/sync-wave: "0"
  playground:
    enabled: false
  telemetry:
    metrics:
      enabled: false

zitadel:
  # The restricted Pod Security Standard (ADR-0165, charts#394). Helm merges
  # these keys into the chart-wide container securityContext, which already
  # runs as user 1000 with a read-only root. Each ZITADEL container reads it:
  # the server, the login UI and its wait init, and the init, setup and
  # cleanup Jobs.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
  # egress-fqdn zitadel: ZITADEL sends mail through the SMTP relay of
  # platformBootstrap.zitadel.smtp. External identity providers are off
  # (AllowExternalIDP: false). The chart gives the login UI these labels too.
  podAdditionalLabels:
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/client-postgres: "true"
    gibson.zeroroot.ai/kube-api: "true"
    gibson.zeroroot.ai/egress-fqdn: zitadel
  cleanupJob:
    # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
    podAdditionalLabels:
      gibson.zeroroot.ai/net-role: platform
      gibson.zeroroot.ai/client-postgres: "true"
      gibson.zeroroot.ai/kube-api: "true"
  # Identity provider — sole canonical IdP for the gibson stack.
  # Postgres: shared platform-postgres-rw, role/db zitadel.

  # deploy#888: the login UI now ships from the PRIVATE first-party
  # ghcr.io/zeroroot-ai/zitadel-login fork (see zitadel.login.image below), so
  # the zitadel subchart pods need the ghcr pull secret. The zitadel chart's
  # login Deployment reads only this chart-top-level `imagePullSecrets` (its
  # `login.imagePullSecrets` value is not referenced by deployment_login.yaml
  # in 9.34.1). `ghcr-credentials` is chart-owned — rendered by
  # templates/externalsecrets/ghcr-credentials.yaml into the gibson namespace
  # in every env (kind included; the login image is pulled from ghcr
  # everywhere, never kind-loaded) — so this default is env-agnostic. Extra
  # pull secrets on the public core-zitadel image are a no-op.
  imagePullSecrets:
    - name: ghcr-credentials

  # deploy#1170 — the zitadel chart composes its two HELPER images (not the
  # core/login app images, which carry a full repository each) as
  # `{{ imageRegistry | default "docker.io" }}/{{ tools.<t>.image.repository }}`.
  # Left alone that is two unauthenticated Docker Hub pulls: alpine/k8s for the
  # setup + cleanup Jobs and wait4x for the login Deployment's init container.
  # Point the prefix at ghcr and the repositories at the mirror.
  #
  # tools.kubectl.image.tag MUST be set explicitly. Empty means "derive from
  # the live cluster's kubeVersion", so the tag changes with the control-plane
  # minor and can name an alpine/k8s tag that was never mirrored (and, on
  # Docker Hub, may not exist at all). Pin it, and add the new tag to
  # zeroroot-ai/.github :: mirror-list.yaml before moving it.
  imageRegistry: ghcr.io
  tools:
    kubectl:
      image:
        repository: zeroroot-ai/mirror/alpine-k8s
        tag: "1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
    wait4x:
      image:
        repository: zeroroot-ai/mirror/wait4x
        tag: "3.7.2@sha256:2337e64637e1aa9d5d638de6d877914806be6c5156a7221ea40f11911ea4071a"

  zitadel:
    # deploy#1348 — the masterkey is ESO-materialised, never a literal.
    #
    # This key used to be `masterkey: "kindDevZitadelMasterkey32CharsXX"`,
    # with a comment promising that production overlays override it via
    # masterkeySecretName. None did (ci/values-{saas,staging,self-hosted}.yaml
    # all had zero masterkey lines, and the gitops overlays set only the
    # unrelated platform KEK `masterKey.keyName: master-kek`), so every
    # profile shipped the IdP's encryption root key as a constant committed
    # to this repository.
    #
    # `gibson-zitadel-masterkey` is now produced by gibson-workloads'
    # templates/external-secrets/zitadel-masterkey-externalsecret.yaml from
    # OpenBao, the one ESO backend, at the flat key `zitadel-masterkey`
    #. The upstream chart requires
    # exactly one of masterkey / masterkeySecretName and `fail`s otherwise
    # (secret_zitadel-masterkey.yaml), so re-adding a literal here is a hard
    # render failure; scripts/check-secret-plumbing.py catches it first.
    #
    # There is deliberately no kind-only literal either — kind reads the same
    # backend as every other profile (one code path).
    masterkey: ""
    masterkeySecretName: "gibson-zitadel-masterkey"

    # The masterkey guard (ADR-0171, row platform-generated-secrets). The
    # rotation CronJob rewraps the Zitadel keys before the Secret holds the
    # new masterkey. A Zitadel process that starts in that window would
    # decrypt its keys to garbage with no error. This init container runs
    # before each Zitadel workload (Deployment, init and setup Jobs) and
    # refuses a masterkey that does not open the marker. Its script is the
    # ConfigMap gibson-zitadel-masterkey-guard (templates/jobs). The image
    # is postgresSetup.image (psql and openssl): tests/zitadel-masterkey-rotation.bats
    # fails when the two pins differ.
    initContainers:
      - name: masterkey-guard
        image: ghcr.io/zeroroot-ai/mirror/bitnami-postgresql:16.4.0-debian-12-r0@sha256:be51b3aeaacc600f3eb2b596427be538b1bc17284111a1fe147030e8422c3184
        command: [bash, /guard/guard.sh]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        env:
          - name: ZITADEL_MASTERKEY
            valueFrom:
              secretKeyRef:
                name: gibson-zitadel-masterkey
                key: masterkey
          - name: PGHOST
            value: platform-postgres-rw.gibson.svc.cluster.local
          - name: PGPORT
            value: "5432"
          - name: PGDATABASE
            value: zitadel
          - name: PGSSLMODE
            value: require
          - name: PGCONNECT_TIMEOUT
            value: "5"
          - name: PGUSER
            value: zitadel
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: zitadel-postgres-credentials
                key: password
        volumeMounts:
          - name: zitadel-masterkey-guard
            mountPath: /guard
            readOnly: true

    # NOTE: `masterkeyAnnotations` was deleted with the literal. It only ever
    # annotated the Secret the upstream chart renders from an inline
    # `masterkey:` (secret_zitadel-masterkey.yaml is gated on that value), and
    # existed to strip the chart's helm.sh/hook: pre-install — as a hook the
    # Secret was deleted by hook lifecycle mid-sync on staging 2026-06-11 and
    # any zitadel pod restart would then crashloop. The chart no longer renders
    # that Secret at all; the equivalent ordering now lives on the
    # ExternalSecret (sync-wave -8, ahead of the init Jobs at -4/-3).

    configmapConfig:
      # Empty = derive from global.domain (app.<global.domain>) at render
      # time, the same contract gibson-workloads uses (values.yaml
      # `ExternalDomain: ""` + template `default app.<domain>`). A hardcoded
      # literal here is drift that silently diverges from global.domain and
      # trips the hostname-guard (deploy#630/#938). Per-env overlays
      # (ci/values-staging.yaml) still pin the env-specific host explicitly.
      ExternalDomain: ""
      # The setup Job mints no IAM admin PAT (charts#407). The upstream
      # default creates iam-admin-pat next to the machine key; null deletes
      # that block. The platform-operator mints the PAT with its System API
      # key and writes it to OpenBao, and the ExternalSecret iam-admin-pat is
      # the one writer of the Secret (gibson#794, ADR-0014).
      # The setup Job mints no machine key of iam-admin either (ADR-0171,
      # row zitadel-bringup-tokens). The upstream default mints one that
      # lives until 2029 and writes it to the Secret iam-admin. No code
      # authenticates with it, and the platform-operator reads the user id
      # of iam-admin from iam-admin-pat (gibson#1047). The machine user
      # itself stays: the platform-operator mints its PAT.
      FirstInstance:
        Org:
          Machine:
            MachineKey: null
            Pat: null
      ExternalPort: 30443
      ExternalSecure: true
      TLS:
        Enabled: false
      # Disable Zitadel self-service registration. The hosted Login-V2 app
      # exposes /ui/v2/login/register (and a "Register" link on the sign-in
      # page) whenever the instance login policy allows it — Zitadel's
      # default is allowRegister=true. That lets anyone create an account
      # OUTSIDE the controlled signup (no plan / Stripe / Tenant CR / FGA
      # owner tuple), so registration must be off (deploy#886).
      #
      # NOTE: DefaultInstance.* is applied ONLY at FIRST-INSTANCE creation,
      # so this closes the hole for fresh standups only. Already-running
      # instances (staging/prod) are enforced idempotently by the
      # platform-operator's bootstrap reconcile via the Admin login-policy
      # API — that reconcile, not this value, is the authoritative guard.
      # The controlled signup creates users via the admin API
      # (POST /v2/users/human), which does NOT consult allowRegister, so
      # this does not affect /signup.
      #
      # The same first-instance window also carries the sign-in policy: MFA for
      # every account (passkey or authenticator app, no SMS or email codes), no
      # external identity providers, and usernames unique across the install.
      # The platform-operator reconciles the same policy on every install.
      DefaultInstance:
        LoginPolicy:
          AllowUsernamePassword: true
          AllowExternalIDP: false
          AllowRegister: false
          ForceMFA: true
          ForceMFALocalOnly: false
          PasswordlessType: 1
          AllowDomainDiscovery: false
          MfaInitSkipLifetime: 0s
        DomainPolicy:
          UserLoginMustBeDomain: false
      Database:
        Postgres:
          Host: platform-postgres-rw.gibson.svc.cluster.local
          Port: 5432
          Database: zitadel
          MaxOpenConns: 20
          MaxConnLifetime: 30m
          MaxConnIdleTime: 5m
          User:
            Username: zitadel
            SSL:
              Mode: disable
          Admin:
            Username: zitadel
            SSL:
              Mode: disable

      # SystemAPIUsers (platform-operator#28).
      # Provisions a SYSTEM_OWNER machine user `gibson-system-bot`
      # whose public key Zitadel verifies on every JWT submitted
      # against /system/v1/*. The matching private key is mounted
      # on the platform-operator pod (deploy#321), which signs
      # JWTs to call AddInstanceTrustedDomain — registering the
      # cluster-internal Zitadel Service name so every Gibson pod
      # can dial Zitadel by Service name without the per-pod
      # hostAliases workaround.
      #
      # Path points at the mounted Secret (see extraVolumeMounts below).
      # There is NO KeyType field: v4.14's SystemAPIUser struct is exactly
      # {Path, KeyData, Memberships} (internal/api/authz/system_token.go) and
      # the previous `KeyType: 1` here was silently ignored — with a comment
      # asserting Zitadel behaviour nobody had verified. PEM is detected from
      # the bytes.
      SystemAPIUsers:
        - gibson-system-bot:
            Memberships:
              - MemberType: System
                Roles:
                  - SYSTEM_OWNER
                  # The platform-operator mints the first IAM admin PAT with
                  # this key (charts#407, gibson#794), which needs IAM_OWNER.
                  - IAM_OWNER
            Path: /etc/zitadel-system-keys/system-bot-pub.pem
        # Slot b of the System API key (ADR-0171). The same roles as
        # gibson-system-bot. A rotation moves the platform-operator to the
        # other user, then gives the old user a new key.
        - gibson-system-bot-b:
            Memberships:
              - MemberType: System
                Roles:
                  - SYSTEM_OWNER
                  - IAM_OWNER
            Path: /etc/zitadel-system-keys/system-bot-b-pub.pem

  # deploy#1631: DO NOT LET ZITADEL BOOT WITHOUT ITS SYSTEM KEY.
  #
  # SystemAPIUsers.Path is read from disk ONCE, at boot. Measured on two
  # separate baseline installs, ESO materialises gibson-zitadel-system-key about
  # two minutes AFTER Zitadel starts:
  #
  #   zitadel started 21:41:25 / secret created 21:43:34
  #
  # A Zitadel that booted without the file registers no system-bot key, so it
  # verifies the operator's self-signed assertion as an ordinary OIDC access
  # token and rejects it:
  #
  #   issuer does not match: Expected: https://<domain>, got: gibson-system-bot
  #
  # which stalls the platform-operator at AdminTokenReady, so it never
  # reaches the master-key step, so gibson-master-key is never created, so the
  # daemon never leaves init, and nobody can log in.
  #
  # The Reloader annotation below is NOT sufficient on its own: Reloader reacts
  # to updates of Secrets it is already tracking, and here the Secret is
  # CREATED after the pod exists — observed doing nothing on a fresh install.
  # This init container closes the hole deterministically: the pod cannot start
  # until the key is on disk and non-empty.
  initContainers:
    - name: wait-for-system-key
      image: ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc
      command:
        - sh
        - -c
        - |
          set -eu
          KEY=/etc/zitadel-system-keys/system-bot-pub.pem
          KEY_B=/etc/zitadel-system-keys/system-bot-b-pub.pem
          echo "waiting for ${KEY} and ${KEY_B} (SystemAPIUsers is read once, at boot)"
          for _ in $(seq 1 180); do
            if [ -s "$KEY" ] && [ -s "$KEY_B" ]; then
              echo "system keys present ($(wc -c < "$KEY") and $(wc -c < "$KEY_B") bytes)"
              exit 0
            fi
            sleep 2
          done
          echo "FATAL: ${KEY} or ${KEY_B} never appeared. Zitadel would boot trusting no" >&2
          echo "system-bot key and reject every System API call, stalling the" >&2
          echo "platform-operator at AdminTokenReady (deploy#1631)." >&2
          exit 1
      volumeMounts:
        - name: zitadel-system-key
          mountPath: /etc/zitadel-system-keys
          readOnly: true

  # Belt and braces: if the key is ever ROTATED, Reloader restarts the pod so
  # the new public key is loaded. It does not cover first creation (above).
  #
  # SystemAPIUsers.Path is read from disk at boot. On a fresh install Zitadel
  # starts before ESO has materialised gibson-zitadel-system-key, so it comes
  # up trusting no system-bot key and answers every System API call with
  #
  #   zitadel system 401: Errors.Token.Invalid (AUTH-7fs1e)
  #
  # which stalls the platform-operator at AdminTokenReady, so it never
  # reaches the master-key step, so gibson-master-key is never created, so the
  # daemon never leaves init and nobody can log in. Measured on a baseline
  # install: Zitadel started at 20:48:20, the Secret was created at 20:50:27.
  #
  # Reloader is already deployed; it just was not told to watch this Secret.
  annotations:
    secret.reloader.stakater.com/reload: "gibson-zitadel-system-key,gibson-zitadel-masterkey"

  # Mount the public-key half of gibson-zitadel-system-key on
  # the Zitadel pods so the SystemAPIUsers Path: above resolves.
  # The Secret is materialised by ESO (see standalone-
  # externalsecrets/zitadel-system-key-externalsecret.yaml).
  extraVolumes:
    - name: zitadel-masterkey-guard
      configMap:
        name: gibson-zitadel-masterkey-guard
    - name: zitadel-system-key
      secret:
        secretName: gibson-zitadel-system-key
        items:
          - key: public-key.pem
            path: system-bot-pub.pem
          - key: public-key-b.pem
            path: system-bot-b-pub.pem
  extraVolumeMounts:
    - name: zitadel-system-key
      mountPath: /etc/zitadel-system-keys
      readOnly: true

  env:
    - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: zitadel-postgres-credentials
          key: password
    - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: zitadel-postgres-credentials
          key: password

  podAnnotations:
    # Restart Zitadel when ESO rotates gibson-zitadel-system-key so
    # the pod reloads the SystemAPIUsers public key from disk (#192).
    # Without this, Zitadel keeps the old in-memory key and rejects
    # platform-operator System API JWTs signed with the new private key.
    secret.reloader.stakater.com/reload: "gibson-zitadel-system-key,gibson-zitadel-masterkey"
  replicaCount: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false

  # Pin ZITADEL to v4.19.4. The chart's appVersion is v4.13.1; we run
  # app-minors ahead (forward-compatible, migrations auto-apply on
  # start — verified on kind). The full chart bump to 10.x (which ships
  # v4.14.0 natively) is deferred: chart 10.0.0 replaces the login
  # client's PAT auth with X.509 cert auth (breaking, needs migration).
  # Both core and the Login-V2 container must move together.
  image:
    repository: "ghcr.io/zeroroot-ai/mirror/zitadel"
    tag: "v4.19.4@sha256:90a3045b80a2b5b395e1e770302076906af3a5911225af7c464b4f3bd00d0a1b"

  # ---- Hook-lifecycle correction (deploy#820, observed live 2026-06-11) ----
  # The zitadel chart defaults its ConfigMaps / ServiceAccounts (+ the RBAC
  # rendered off serviceAccount.annotations) to helm.sh/hook pre-install.
  # Argo maps those to PreSync hooks, and hook lifecycle (operation-retry
  # cleanup / BeforeHookCreation) DELETES them between sync attempts — on
  # staging the SA, both ConfigMaps and the masterkey vanished while the
  # Deployment was running. Standing infrastructure must be regular resources:
  # null the chart-default helm hooks and order with sync-wave -6 (after the
  # ExternalSecrets at -8, before the init chain at -4/-3).
  #
  # The init/setup Jobs stay hooks (genuinely run-once) but move from PreSync
  # to Sync-phase at waves -4/-3: in PreSync they ran before the ExternalSecret
  # chain existed (the original #820 deadlock); as Sync hooks at negative waves
  # they run after the secret layer (-10/-8/-6) and before the wave-0
  # workloads. helm.sh hooks are kept on the Jobs so a plain `helm install`
  # still orders them; argocd.argoproj.io/* takes precedence under Argo, and
  # the explicit sync-wave overrides Argo's helm.sh/hook-weight fallback
  # (the #828 lesson).
  configMap:
    annotations:
      helm.sh/hook: null
      helm.sh/hook-delete-policy: null
      helm.sh/hook-weight: null
      argocd.argoproj.io/sync-wave: "-6"
  serviceAccount:
    annotations:
      helm.sh/hook: null
      helm.sh/hook-delete-policy: null
      helm.sh/hook-weight: null
      argocd.argoproj.io/sync-wave: "-6"
  # `zitadel init` and `zitadel setup` both connect to Postgres and need their
  # credentials Secret. The zitadel chart's own values annotate them
  # `helm.sh/hook: pre-install,pre-upgrade` (weights 1 and 2), and these
  # annotation maps MERGE with the chart's, so the phase has to be overridden
  # here or the vendor default stands.
  #
  # Under Helm that default cannot work: pre-install hooks run to completion
  # before any main-phase manifest is applied, so both Jobs waited on the
  # platform-postgres Cluster and an ESO Secret that the same release had not
  # created yet, and the install hung to its timeout (deploy#1627). Moving them
  # to post-install puts them after the Cluster and the Secrets exist, and after
  # the -6 postgres-setup Jobs that create their roles.
  #
  # The vendor's weights 1 and 2 are kept, so init still precedes setup. Argo is
  # unaffected — it honours the argocd.* annotations below, and sync-waves order
  # hooks and ordinary resources on a single axis.
  initJob:
    # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
    podAdditionalLabels:
      gibson.zeroroot.ai/net-role: platform
      gibson.zeroroot.ai/client-postgres: "true"
      gibson.zeroroot.ai/kube-api: "true"
    annotations:
      helm.sh/hook: post-install,post-upgrade
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      argocd.argoproj.io/sync-wave: "-4"
  setupJob:
    # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
    podAdditionalLabels:
      gibson.zeroroot.ai/net-role: platform
      gibson.zeroroot.ai/client-postgres: "true"
      gibson.zeroroot.ai/kube-api: "true"
    # The upstream default is 300s, and a COLD bringup does not fit in it.
    # MEASURED (kind, deploy#1737, 2026-09-02): 8m27s. The pod SUCCEEDED —
    # "setup completed", iam-admin, iam-admin-pat and login-client all
    # created — and the Job was still marked Failed/DeadlineExceeded,
    # because the deadline counts the whole run and this one ran the full
    # Zitadel migration and projection prefill against a freshly initialised
    # Postgres. A hook Job that reports Failed fails the Argo sync, and with
    # `hook-delete-policy: BeforeHookCreation` every retry re-runs the same
    # 8 minutes into the same 300s wall, so the retries exhaust and the
    # umbrella never converges.
    #
    # 1200s is the same sizing deploy#1772 gave fga-init,
    # openbao-jwt-auth-init, openbao-approle-cert-manager-init and
    # active-session-backfill for the same reason. Those four are in
    # gibson-workloads; this Job comes from the zitadel subchart, which is
    # why it was outside that sweep.
    activeDeadlineSeconds: 1200
    annotations:
      helm.sh/hook: post-install,post-upgrade
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      argocd.argoproj.io/sync-wave: "-3"
  login:
    # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
    podAdditionalLabels:
      gibson.zeroroot.ai/net-role: platform
    image:
      # deploy#888: self-hosted Login V2 image — a THIN fork of the upstream
      # Zitadel login app (zeroroot-ai/zitadel-login) that adds the logo
      # click-through link + repointed loginname back button, which Zitadel's
      # branding/label-policy API cannot express. Drop-in compatible: same env
      # contract / port / entrypoint as upstream ghcr.io/zitadel/zitadel-login,
      # so the Reloader branding cache-bust below is unaffected. CORE Zitadel
      # image is UNCHANGED. The tag tracks the upstream Zitadel version and MUST
      # move in lockstep with core on every bump (the fork is rebased onto the
      # matching upstream login tag first — see the zitadel-login README).
      #
      # Digest-pinned (deploy#789 digest-pin-check): zitadel-login is a
      # first-party ghcr.io/zeroroot-ai image, so the staging/prod surface
      # requires this immutable `v<upstream>@sha256:<digest>` pin. The fork
      # publishes `v<upstream>` on every push to its main, and `make check`
      # (scripts/check-zitadel-lockstep.py) fails when the tag here and
      # zitadel.image.tag name different releases (charts#13). The digest is
      # re-resolved from the tag at chart publish (bump-image-digest.py).
      repository: "ghcr.io/zeroroot-ai/zitadel-login"
      tag: "v4.19.4@sha256:56b1d6a039156a4dd486c095d3a6d604780d08890af83388e7425ee654ef80d3"
    # The login UI is a Next.js server, so it needs a memory bound and a heap
    # ceiling inside that bound. It shipped with neither: measured on staging
    # 2026-10-01 the container had `resources: {}` — no request, no limit — so
    # one runaway render could take the whole node, and Node sized its heap from
    # the node's 32GiB rather than from any bound (the same root cause as
    # dashboard#150).
    #
    # 1Gi against a 108MiB idle working set, so a render has room without the
    # container being able to starve its neighbours. NODE_OPTIONS must stay at
    # 75% of the limit; `make node-heap-tracks-limit` fails when the two drift.
    # The dashboard derives its own value from its limit, but this subchart's
    # values are data and cannot call a template, so here both are written and
    # the guard holds them together.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    env:
      - name: NODE_OPTIONS
        value: "--max-old-space-size=768"
    # deploy#943: declarative, Reloader-driven cache-bust. The login UI caches
    # the Zitadel label policy in process memory, so a rebrand needs a pod
    # restart. The login Deployment opts into Stakater Reloader keyed on the
    # zitadel-login-branding ConfigMap, the brand source the platform-operator
    # applies. Reloader rolls this Deployment when the brand changes and
    # leaves it alone otherwise.
    #
    # The login-client Secret holds the token of the login-client machine
    # user. The platform-operator rotates it (ADR-0171): a new token reaches
    # the Secret through ESO, Reloader restarts the login UI, and the operator
    # removes the old token 10 minutes later.
    annotations:
      configmap.reloader.stakater.com/reload: "zitadel-login-branding"
      secret.reloader.stakater.com/reload: "login-client"
    configMap:
      annotations:
        helm.sh/hook: null
        helm.sh/hook-delete-policy: null
        helm.sh/hook-weight: null
        argocd.argoproj.io/sync-wave: "-6"
    serviceAccount:
      annotations:
        helm.sh/hook: null
        helm.sh/hook-delete-policy: null
        helm.sh/hook-weight: null
        argocd.argoproj.io/sync-wave: "-6"

# NOTE (deploy#1343): the top-level `redis:` block that used to sit here
# configured the Bitnami redis subchart, which has been removed from
# Chart.yaml. It had no consumer: the platform dials the redis-stack
# Deployment in gibson-workloads at `gibson-redis-stack:6379`. Do not
# reintroduce a top-level `redis:` key — under the umbrella it addresses the
# (now absent) subchart alias, NOT redis-stack. redis-stack is tuned through
# `gibson-workloads.redis.*`, which is a different tree.

spire:
  spiffe-csi-driver:
    # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
    image:
      registry: "ghcr.io"
      repository: "zeroroot-ai/mirror/spiffe-csi-driver"
      tag: "0.2.7@sha256:9dfe4f0caff096164fd921aa7f15319804df2fc0325f1d90bc793ef3256ab1cd"
    # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
    podLabels:
      gibson.zeroroot.ai/net-role: system
    nodeDriverRegistrar:
      # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
      image:
        registry: "ghcr.io"
        repository: "zeroroot-ai/mirror/csi-node-driver-registrar"
        tag: "v2.9.4@sha256:ab6c4603d8da43d9f33361a5716552080e3f72badfad099d76fcf4b59e547d80"
  global:
    spire:
      # No trustDomain here: Helm gives the SPIRE chart the top-level
      # global.spire.trustDomain, the one value (ADR-0164).
      # Override upstream chart's default jwtIssuer
      # (https://oidc-discovery.$trustDomain) with the cluster-internal
      # OIDC discovery provider Service hostname. This is the value
      # SPIRE stamps as `iss` on every JWT-SVID; it MUST match Vault's
      # `auth/jwt/config.bound_issuer` (overlay vault.jwtAuth.spireOidcIssuer)
      # AND must RESOLVE in-cluster: OpenBao dials ${issuer}/keys to fetch
      # the JWKS. Under the umbrella release naming the Service renders as
      # gibson-spiffe-oidc-discovery-provider (no "spire-" segment — that
      # was the kind-era standalone-app name, which resolves to nothing
      # here and wedged jwt-auth-init with "error checking jwks URL").
      # Without this override, Vault rejects every per-tenant
      # `auth/jwt/login` with "invalid issuer (iss) claim", taking
      # down the entire per-tenant data plane (Findings, LLM
      # settings, agent registry, mission listing). See deploy#426.
      jwtIssuer: https://gibson-spiffe-oidc-discovery-provider
    # Argo applies via `helm template` semantics, not `helm
    # install/upgrade`. The chart's installAndUpgradeHooks +
    # deleteHooks (PreSync Jobs running `kubectl` against the
    # SPIRE server) assume a live Helm lifecycle and fail on
    # every Argo sync — `gibson-spire-server-pre-upgrade-*`
    # pods hit BackoffLimitExceeded after 7 retries because
    # they try to query a SPIRE server that doesn't exist yet
    # (first sync) or whose pod just rolled (every other sync).
    # The chart itself documents this exact case:
    #   "Enable Helm hooks to autofix common install/upgrade
    #    issues (should be disabled when using `helm template`)"
    # Surfaced by an Argo sync review. It is the same family as
    # every other Helm lifecycle hook that misbehaves under Argo.
    installAndUpgradeHooks:
      enabled: false
    deleteHooks:
      enabled: false
  spire-server:
    # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
    image:
      registry: "ghcr.io"
      repository: "zeroroot-ai/mirror/spire-server"
      tag: "1.14.5@sha256:295af37293ffef6530ba0cafce055c41fd4d26dbabaca24944c029bbc8291214"
    # The restricted Pod Security Standard and a read-only root (ADR-0165,
    # charts#394). These are the values of the SPIRE chart recommendations,
    # set here for this chart only: the SPIRE agent and the CSI driver are
    # node components and keep their own settings.
    # fsGroup 1000 owns the server volume, so the root chown init container
    # leaves (it renders only when runAsUser is unset).
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
    # No egress label: the server uses the disk KeyManager, no
    # UpstreamAuthority and no federation. It calls only the API server and
    # Postgres.
    podLabels:
      gibson.zeroroot.ai/net-role: platform
      gibson.zeroroot.ai/client-postgres: "true"
      gibson.zeroroot.ai/kube-api: "true"
      gibson.zeroroot.ai/ingress-control-plane: "true"
    # Velero fs-backup skips these: sockets and scratch. spire-data (the
    # datastore volume) stays in the backup. scripts/check-velero-volume-excludes.sh.
    podAnnotations:
      backup.velero.io/backup-volumes-excludes: "server-tmp,spire-server-socket,spire-controller-manager-tmp"
    # Datastore: shared platform-postgres-rw, role spire, database spire.
    dataStore:
      sql:
        databaseType: postgres
        databaseName: spire
        host: platform-postgres-rw.gibson.svc.cluster.local
        port: 5432
        username: spire
        externalSecret:
          enabled: true
          name: spire-postgres-credentials
          key: password
    controllerManager:
      # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
      image:
        registry: "ghcr.io"
        repository: "zeroroot-ai/mirror/spire-controller-manager"
        tag: "0.6.4@sha256:f8fd8e6637f4d4fa21a46fb6a285a5166f5adc812dbe1f9f6ebe48c09dfda9bf"
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      enabled: true
      # The spire chart registers four identities for SPIKE by default. This
      # chart deploys no SPIKE workload, and a registration with no workload
      # is an identity that waits for any pod with the right label
      # (clusterspiffeids.yaml states the rule). All four are off.
      # scripts/check-identity-admission-covers.py fails if one returns.
      identities:
        clusterSPIFFEIDs:
          spike-keeper:
            enabled: false
          spike-nexus:
            enabled: false
          spike-bootstrap:
            enabled: false
          spike-pilot:
            enabled: false
    telemetry:
      prometheus:
        enabled: false
    tests:
      bash:
        # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
        image:
          registry: "ghcr.io"
          repository: "zeroroot-ai/mirror/chainguard-bash"
          tag: "sha256:ef209fd7d231ead12bf24287db24991bdd979669f4df2e037698f94545816d3e"

# =============================================================================
# The cluster operators (deploy#1728). The umbrella owns
# cert-manager, external-secrets, external-dns and the CloudNativePG
# operator on every substrate. Stage 1 (Terraform) installs Argo CD only.
#
# ORDERING UNDER ARGO. The umbrella is one Application, and Argo applies it
# in sync-waves. The ClusterSecretStore syncs at -10, the ExternalSecrets at
# -8, the platform-postgres Cluster at -7 and the postgres-setup hooks at -6.
# Argo waits for each wave to be Healthy, and a ClusterSecretStore or a
# Cluster CR is only Healthy once its operator reconciles it. So every
# resource of external-secrets, cert-manager and the CNPG operator carries
# sync-wave -20, ahead of the first CR that needs it. external-dns has no CR
# in this chart and no consumer that waits on it, so it syncs at wave 0.
#
# cert-manager and external-secrets expose an annotation seam for their
# Deployments, ServiceAccounts, Services and webhook configurations, but not
# for their RBAC. The subcharts therefore render with RBAC off, and the
# umbrella ships a vendored, wave-annotated copy of exactly that RBAC in
# templates/operators/ (regenerated by scripts/vendor-operator-rbac.py, whose
# --check fails CI on drift from the pinned chart version).
#
# CRDs. None of these subcharts installs CRDs here: the umbrella renders CRs
# of every one of them, and Helm refuses a CRD and a CR of it in one release
# (deploy#1627). gibson-crds carries the CRDs, vendored from these chart
# versions by scripts/vendor-operator-crds.py.
#
# The Helm-native path needs no waves: Helm applies unknown kinds in
# alphabetical order, so Certificate, Cluster, ClusterSecretStore,
# ExternalSecret and Issuer land before Mutating/ValidatingWebhookConfiguration
# and are never refused by a webhook whose pod is not up yet.
# =============================================================================
  spire-agent:
    # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
    image:
      registry: "ghcr.io"
      repository: "zeroroot-ai/mirror/spire-agent"
      tag: "1.14.5@sha256:efb8d29ace803852c8f3d0001c3d183102bfda2c6ff52e4a93a067269a2caa5e"
    # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
    podLabels:
      gibson.zeroroot.ai/net-role: system
    # The agent's SVID cache: it re-attests on start, a restored copy is
    # stale. Velero fs-backup skips it.
    podAnnotations:
      backup.velero.io/backup-volumes-excludes: "spire-agent-admin-socket-dir,spire-agent-persistence"
    socketAlternate:
      # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
      image:
        registry: "ghcr.io"
        repository: "zeroroot-ai/mirror/chainguard-bash"
        tag: "sha256:ef209fd7d231ead12bf24287db24991bdd979669f4df2e037698f94545816d3e"
    fsGroupFix:
      # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
      image:
        registry: "ghcr.io"
        repository: "zeroroot-ai/mirror/chainguard-bash"
        tag: "sha256:ef209fd7d231ead12bf24287db24991bdd979669f4df2e037698f94545816d3e"
    hostCert:
      # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
      image:
        registry: "ghcr.io"
        repository: "zeroroot-ai/mirror/chainguard-min-toolkit-debug"
        tag: "sha256:6ba4fb1b19bb35fa0b7e6bf08b308379a5b865727e50b7b3068efb824b39ebba"
  spiffe-oidc-discovery-provider:
    # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
    image:
      registry: "ghcr.io"
      repository: "zeroroot-ai/mirror/oidc-discovery-provider"
      tag: "1.14.5@sha256:553704280654f49ba58bf52d5e84d8deca8daf5d91ff8b34dbd47dd3cc325eca"
    # The restricted Pod Security Standard and a read-only root (ADR-0165,
    # charts#394). These are the values of the SPIRE chart recommendations,
    # set here for this chart only: the SPIRE agent and the CSI driver are
    # node components and keep their own settings.
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    # The network labels of the pod (ADR-0165 rule 4, D76; gibson.netLabels).
    podLabels:
      gibson.zeroroot.ai/net-role: platform
    # Sockets and a cert scratch dir. Velero fs-backup skips them.
    podAnnotations:
      backup.velero.io/backup-volumes-excludes: "certdir,nginx-tmp,spiffe-workload-api,spire-oidc-sockets"
    spiffeHelper:
      # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
      image:
        registry: "ghcr.io"
        repository: "zeroroot-ai/mirror/spiffe-helper"
        tag: "0.11.0@sha256:1c92e5998ad3621e3323f25aabe40f5a88ba730ee0edb248aa8c943ca504e8a2"
    tests:
      step:
        # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
        image:
          registry: "ghcr.io"
          repository: "zeroroot-ai/mirror/step-cli"
          tag: "0.30.2@sha256:c75414251d4d8234945fb01e1374707dcc6a7adced88679bae4f0fd526331e74"
      busybox:
        # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
        image:
          registry: "ghcr.io"
          repository: "zeroroot-ai/mirror/busybox"
          tag: "1.37.0-uclibc@sha256:31b72538c3019a20336b04c4cebcd47c36511d0b45aa76666804c2845055bbd3"
      agent:
        # The install registry mirror, pinned by digest (ADR-0165 rule 5, charts#400).
        image:
