# secret-producers.yaml — the Secrets the umbrella's workloads reference that
# no chart object renders, and who produces each one at runtime.
#
# check-secret-plumbing.py (charts#17) reads the baseline render and matches
# every secretKeyRef / secretRef / secretName a workload names against the
# Secrets, ExternalSecret targets and Certificate secretNames the chart
# renders. A reference nothing produces is a CreateContainerConfigError at
# runtime, or a mounted-empty file, which is how a mistyped *SecretName in
# values used to reach a cluster. The names below are the ones a runtime
# actor produces instead; each names its producer, and the guard fails if a
# listed name IS rendered (a stale entry) or if a workload references a
# name that is neither rendered nor listed. A Secret that a script of a
# rendered workload writes must be listed too, and its entry must name that
# workload.
#
# Keyed by content: the Secret name, never a line number.
producers:
  bringup-keyring: the bringup writes the keyring into the release namespace (scripts/keyring-to-cluster.sh in hosted, ADR-0083)
  cnpg-webhook-cert: the CloudNativePG operator mints its own webhook certificate at start
  gibson-dashboard-oidc: the platform-operator mints the dashboard OIDC client (OIDCClient reconcile)
  gibson-native-login-oidc: the platform-operator mints the native-login OIDC client (OIDCClient reconcile)
  gibson-master-key: the platform-operator mints the master KEK during PlatformBootstrap
  gibson-tenant-operator-vault: the openbao-auto-init sidecar mints the tenant-operator's OpenBao token (policy tenant-operator) and keeps it renewed
  gibson-zitadel-dashboard: the platform-operator mints the dashboard machine-user client credentials (OIDCClient reconcile)
  gibson-zitadel-tenant-operator: the platform-operator mints the tenant-operator machine-user client credentials (OIDCClient reconcile)
  idp-admin-credentials: PlatformBootstrap writes the IAM admin credential for the first-admin Job
  gibson-redis-rotation-state: the CronJob gibson-redis-rotation writes the last rotated password version and the previous password (kubectl create secret, charts#367)
  platform-postgres-superuser: the CloudNativePG operator writes the platform-postgres superuser credential (enableSuperuserAccess, no spec.superuserSecret)

# ConfigMaps a Reloader annotation names that no chart object renders, and who
# writes each one at runtime. check-reloader-names.py reads this map.
configMapProducers:
  gibson-fga-config: the fga-init hook Job writes the OpenFGA store id and model id after it loads the model
