# owner-credential-readers.yaml: every workload that may read a Zitadel owner
# credential, and why.
#
# The owner credentials can do anything to the identity provider. Only
# bootstrap may read them. scripts/check-owner-credential-readers.py renders
# the chart and fails when a workload mounts one (volume, projected volume,
# env or envFrom) or a ServiceAccount can get, list or watch one, and the
# reader is not listed here. It also fails on an entry that no render
# produces, so this list cannot go stale.
#
# Keyed by content, never by line number:
#   mounts:  "<Kind>/<name> <secret>[<keys>]"   ("*" = the whole Secret)
#   readers: "<namespace>/<serviceaccount>"
#
# Classes:
#   bootstrap          creates or restores the Zitadel instance and the
#                      identities under it (ADR-0093 decision 7).
#   identity-provider  Zitadel itself. Its setup Job writes these Secrets.
#   infrastructure     a cluster controller whose job is to read every
#                      Secret it serves. Kubernetes RBAC cannot remove one
#                      Secret from such a controller, and the upstream
#                      Zitadel chart writes these Secrets to its release
#                      namespace only.
#   pending            a reader that must go. `removed-by` names the change
#                      that removes it. Adding a pending entry needs a review.
#
# Adding a line here widens who can administer the identity provider.
owner_secrets:
  - iam-admin-pat
  - iam-admin
  - gibson-zitadel-system-key

mounts:
  "Deployment/gibson-platform-operator gibson-zitadel-system-key[private-key.pem]":
    class: bootstrap
    why: >-
      The platform-operator signs System API JWTs with this key to register
      the in-cluster Zitadel host as a trusted domain.
  "Deployment/gibson-zitadel gibson-zitadel-system-key[public-key.pem]":
    class: identity-provider
    why: >-
      Zitadel reads the public half to verify the platform-operator's System
      API JWTs (SystemAPIUsers). The public key is not a credential. The
      volume names this one item, so the private key never reaches the pod.
  "Job/gibson-zitadel-init gibson-zitadel-system-key[public-key.pem]":
    class: identity-provider
    why: The upstream chart gives the init Job the Deployment's volumes. Public half only.
  "Job/gibson-zitadel-setup gibson-zitadel-system-key[public-key.pem]":
    class: identity-provider
    why: The upstream chart gives the setup Job the Deployment's volumes. Public half only.
  "Deployment/gibson-tenant-operator iam-admin-pat[pat]":
    class: pending
    removed-by: the tenant-operator pin that authenticates to Zitadel with its own machine user
    why: >-
      The tenant-operator calls the Zitadel API with the owner PAT. It moves
      to its own gibson-tenant-operator machine user (client credentials
      from gibson-zitadel-tenant-operator). The chart drops this mount when
      the tenant-operator pin moves to a release that no longer reads it.

readers:
  gibson/gibson-platform-operator:
    class: bootstrap
    why: >-
      PlatformBootstrap reads iam-admin-pat (adminTokenRef) and iam-admin
      (the sa-identity-map) to create the Zitadel project and every
      OIDCClient machine user with its exact roles.
  gibson/iam-admin-pat-escrow:
    class: bootstrap
    why: >-
      Copies iam-admin-pat and iam-admin into OpenBao, so a restore brings
      them back. get on those two names only.
  gibson/gibson-zitadel:
    class: identity-provider
    why: >-
      The upstream Zitadel chart's Role. The setup Job writes iam-admin and
      iam-admin-pat, and the chart grants get and list on Secrets in its
      namespace to do it.
  gibson/external-secrets:
    class: infrastructure
    why: ESO writes iam-admin-pat, iam-admin and the System API key from OpenBao.
  gibson/external-secrets-cert-controller:
    class: infrastructure
    why: The ESO subchart's webhook certificate controller. Upstream ClusterRole.
  gibson/cert-manager:
    class: infrastructure
    why: cert-manager reads Secrets for every Certificate and Issuer. Upstream ClusterRoles.
  gibson/cert-manager-cainjector:
    class: infrastructure
    why: cert-manager's CA injector. Upstream ClusterRole.
  gibson/gibson-cloudnative-pg:
    class: infrastructure
    why: The CNPG operator reads and writes the database Secrets. Upstream ClusterRole.
  gibson/reloader:
    class: infrastructure
    why: >-
      Reloader watches Secrets in the release namespace to restart the pods
      that name them (Zitadel restarts on a new gibson-zitadel-system-key).
      A watch cannot be limited by name.
  gibson/zitadel-login-branding:
    class: pending
    removed-by: the platform-operator pin that applies the login branding
    why: >-
      The login-branding Job writes the instance label policy with the owner
      PAT. No Zitadel role below IAM_OWNER has iam.policy.write, so a narrow
      credential cannot exist. The platform-operator applies the branding as
      bootstrap work (ADR-0093 decisions 7 and 9), and this Job is deleted.

# --live only: ServiceAccounts outside the chart that a cluster brings with
# it. The render never contains them.
live_namespaces:
  kube-system: >-
    The Kubernetes control plane (namespace, garbage-collector and
    ServiceAccount controllers, and on k3s the helm and local-path
    controllers). They read every Secret by design.
  toolhive-system: >-
    The ToolHive operator, installed by baseline-up.sh from its upstream
    chart. It resolves the Secrets that MCPRemoteProxy headers name.
