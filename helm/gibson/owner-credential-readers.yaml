# owner-credential-readers.yaml: every workload that may read a Zitadel owner
# credential, and why.
#
# The owner credentials can do anything to the identity provider. Only
# bootstrap may read them. scripts/check-owner-credential-readers.py renders
# the chart and fails when a workload mounts one (volume, projected volume,
# env or envFrom) or a ServiceAccount can get, list or watch one, and the
# reader is not listed here. It fails too when a ServiceAccount can take a
# reader over (exec into it, patch it, create a pod beside it, mint a token
# for it, impersonate it, or bind a role over it) and the grant is not in
# `takeovers`. It also fails on an entry that no render produces, so this
# list cannot go stale.
#
# Keyed by content, never by line number:
#   mounts:    "<Kind>/<name> <secret>[<keys>]"   ("*" = the whole Secret)
#   readers:   "<namespace>/<serviceaccount>"
#   takeovers: "<namespace>/<serviceaccount> <power>"
#
# Classes:
#   bootstrap          creates or restores the Zitadel instance and the
#                      identities under it (ADR-0093 decision 7).
#   identity-provider  Zitadel itself. Its setup Job writes these Secrets.
#   infrastructure     a cluster controller whose job is to read every
#                      Secret it serves. Kubernetes RBAC cannot remove one
#                      Secret from such a controller, and the upstream
#                      Zitadel chart writes these Secrets to its release
#                      namespace only.
#   secret-store       OpenBao, which holds the escrowed owner credentials,
#                      and the Jobs that configure it with its admin token.
#   admission-fenced   (takeovers only) a grant RBAC cannot narrow, which a
#                      ValidatingAdmissionPolicy refuses where it would
#                      matter. The entry names the policy (guarded-by).
#   pending            a reader that must go. `removed-by` names the change
#                      that removes it. Adding a pending entry needs a review.
#
# Adding a line here widens who can administer the identity provider.
owner_secrets:
  - iam-admin-pat
  - iam-admin
  - gibson-zitadel-system-key
  # The OpenBao tokens whose policy reads an escrowed owner credential.
  # OpenBao holds the escrowed iam-admin-pat and iam-admin
  # (templates/jobs/gibson-workloads-iam-admin-pat-escrow.yaml).
  #   gibson-platform-operator-vault and its ESO copy gibson-openbao-keys:
  #     policy platform-operator reads the KV key of the Zitadel admin token.
  #   gibson-openbao-iam-admin-escrow: policy iam-admin-escrow reads and
  #     writes the three escrowed keys.
  # The other tokens read no owner credential and are not listed: the
  # tenant-operator token (no path in the root kv store), and the tokens of
  # the jwt and approle init Jobs and of the approle generators
  # (_openbao-policies.tpl).
  - gibson-openbao-keys
  - gibson-platform-operator-vault
  - gibson-openbao-iam-admin-escrow

mounts:
  "Deployment/gibson-platform-operator gibson-zitadel-system-key[private-key.pem]":
    class: bootstrap
    why: >-
      The platform-operator signs System API JWTs with this key to mint the
      Zitadel admin token (gibson#794).
  "Deployment/gibson-zitadel gibson-zitadel-system-key[public-key.pem]":
    class: identity-provider
    why: >-
      Zitadel reads the public half to verify the platform-operator's System
      API JWTs (SystemAPIUsers). The public key is not a credential. The
      volume names this one item, so the private key never reaches the pod.
  "Job/gibson-zitadel-init gibson-zitadel-system-key[public-key.pem]":
    class: identity-provider
    why: The upstream chart gives the init Job the Deployment's volumes. Public half only.
  "Job/gibson-zitadel-setup gibson-zitadel-system-key[public-key.pem]":
    class: identity-provider
    why: The upstream chart gives the setup Job the Deployment's volumes. Public half only.
  "Deployment/gibson-platform-operator gibson-openbao-keys[VAULT_ADMIN_TOKEN]":
    class: bootstrap
    why: >-
      The platform-operator's OpenBao token (VAULT_TOKEN_PATH). PlatformBootstrap
      creates the transit key master-kek and the master key with it, and
      re-reads the file when renewal fails, so a re-minted token needs no
      restart.
  "Job/iam-admin-pat-escrow gibson-openbao-iam-admin-escrow[VAULT_ADMIN_TOKEN]":
    class: bootstrap
    why: >-
      Writes iam-admin-pat, iam-admin and login-client into OpenBao, so a
      restore brings them back. Its token reaches those three KV keys only
      (policy iam-admin-escrow).

readers:
  gibson/gibson-platform-operator:
    class: bootstrap
    why: >-
      PlatformBootstrap reads iam-admin-pat (adminTokenRef) and iam-admin
      (the sa-identity-map) to create the Zitadel project and every
      OIDCClient machine user with its exact roles, and to apply the login
      branding (the instance label policy needs IAM_OWNER).
  gibson/iam-admin-pat-escrow:
    class: bootstrap
    why: >-
      Copies iam-admin-pat and iam-admin into OpenBao, so a restore brings
      them back. get on those two names only.
  gibson/gibson-zitadel:
    class: identity-provider
    why: >-
      The upstream Zitadel chart's Role. The setup Job writes iam-admin and
      iam-admin-pat, and the chart grants get and list on Secrets in its
      namespace to do it.
  gibson/external-secrets:
    class: infrastructure
    why: ESO writes iam-admin-pat, iam-admin and the System API key from OpenBao.
  gibson/external-secrets-cert-controller:
    class: infrastructure
    why: The ESO subchart's webhook certificate controller. Upstream ClusterRole.
  gibson/cert-manager:
    class: infrastructure
    why: cert-manager reads Secrets for every Certificate and Issuer. Upstream ClusterRoles.
  gibson/cert-manager-cainjector:
    class: infrastructure
    why: cert-manager's CA injector. Upstream ClusterRole.
  gibson/gibson-cloudnative-pg:
    class: infrastructure
    why: The CNPG operator reads and writes the database Secrets. Upstream ClusterRole.
  gibson/gibson-openbao:
    class: secret-store
    why: >-
      OpenBao's own ServiceAccount. Its openbao-auto-init sidecar mints one
      token for each consumer and writes it to the Secret of that consumer
      (get, update and patch on those names only).
      OpenBao holds the escrowed owner credentials in any case.
  gibson/reloader:
    class: infrastructure
    why: >-
      Reloader watches Secrets in the release namespace to restart the pods
      that name them (Zitadel restarts on a new gibson-zitadel-system-key).
      A watch cannot be limited by name.

# Takeover grants: a ServiceAccount that can exec into, patch, create a pod
# beside, mint a token for, impersonate, or bind a role over a reader above.
# Keyed "<namespace>/<serviceaccount> <power>". `targets` names the readers
# the grant may reach, or `all` for a rule that cannot name them. A grant that
# reaches one more target fails, and so does a named target no render
# reaches. `guarded-by` names the ValidatingAdmissionPolicy that refuses what
# RBAC cannot narrow; the render must carry it with a Deny binding.
takeovers:
  gibson/reloader patch:
    class: infrastructure
    targets: [Deployment/gibson-zitadel]
    why: >-
      Reloader rolls the workloads that carry a reload annotation, by name
      (reloader.rollouts in gibson-operators values). Zitadel restarts when
      gibson-zitadel-system-key rotates. Reloader already watches every
      Secret in the namespace (its readers entry), so this patch gives it
      nothing it cannot already read.
  gibson/gibson-tenant-operator bind:
    class: admission-fenced
    targets: [ClusterRole/gibson-connector-creds, ClusterRole/gibson-tenant-operator-tenant-namespace]
    guarded-by: ValidatingAdmissionPolicy/gibson-tenant-operator-rolebinding-scope
    why: >-
      The operator binds these two ClusterRoles into every tenant namespace
      it creates, so RBAC cannot name the namespaces. Both read Secrets. The
      admission policy refuses a RoleBinding write by the operator outside
      tenant-* namespaces, so it cannot bind either one where the owner
      credentials live.
  gibson/gibson-cloudnative-pg exec:
    class: infrastructure
    targets: all
    why: >-
      The upstream CNPG operator's ClusterRole. It execs into the instance
      pods it runs (status, backup, promote), and RBAC cannot tell those
      from other pods by name: instance pod names are not known in advance.
      The operator already reads every Secret (its readers entry).
  gibson/gibson-cloudnative-pg patch:
    class: infrastructure
    targets: all
    why: >-
      The upstream CNPG operator's ClusterRole. It patches the pods and
      Deployments it owns (instances, poolers). The operator already reads
      every Secret (its readers entry).
  gibson/gibson-cloudnative-pg create-pod:
    class: infrastructure
    targets: all
    why: >-
      The upstream CNPG operator creates the instance pods and the
      bootstrap Jobs of every Cluster. The operator already reads every
      Secret (its readers entry).
  gibson/cert-manager create-pod:
    class: infrastructure
    targets: all
    why: >-
      The upstream cert-manager ClusterRole for ACME HTTP-01 challenge
      solver pods. cert-manager already reads every Secret (its readers
      entry).
  gibson/gibson-agent exec:
    class: infrastructure
    targets: all
    why: >-
      The upstream SPIRE agent's ClusterRole grants get on nodes/proxy. Its
      k8s workload attestor asks the kubelet for the pods on its node
      (GET /pods), and the kubelet authorizes every such request as
      nodes/proxy, /exec included. The agent runs on every node with
      hostPID and hostNetwork, and issues the SVID of every workload there,
      so it already holds node-level reach.
  velero/velero-server create-pod:
    class: infrastructure
    targets: all
    why: >-
      A restore recreates every workload in the namespace, and RBAC cannot
      tell a restored pod from a new one. The Velero role holds no verb on
      Secrets, and the backup carries no Secret (gibson-velero
      templates/rbac.yaml, templates/schedule.yaml), so no owner credential
      travels through Velero.
  velero/velero-server patch:
    class: infrastructure
    targets: all
    why: >-
      A restore patches the workloads it finds already present. Same bound
      as its create-pod entry.
  velero/velero-server exec:
    class: infrastructure
    targets: all
    why: >-
      The pre-backup Neo4j checkpoint hooks exec into the Neo4j pods, which
      are selected by label, so the rule cannot name them. The Velero
      schedule runs hooks only on those labels.

# --live only: ServiceAccounts outside the chart that a cluster brings with
# it. The render never contains them.
live_namespaces:
  kube-system: >-
    The Kubernetes control plane (namespace, garbage-collector and
    ServiceAccount controllers, and on k3s the helm and local-path
    controllers). They read every Secret by design.
  argocd: >-
    The deployer. The hosted bringup installs Argo CD, and its
    application-controller applies this chart: it creates every object the
    chart renders, including the Roles that decide who reads the owner
    credentials. Whoever controls the deployer already controls that list,
    so a narrower grant for it would not change who can read them. Its
    hardening belongs to the bringup that installs it.
  toolhive-system: >-
    The ToolHive operator, installed by baseline-up.sh from its upstream
    chart. It resolves the Secrets that MCPRemoteProxy headers name.
