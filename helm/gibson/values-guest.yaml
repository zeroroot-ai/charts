# Guest profile: install onto a cluster that already owns the platform
# operators. OpenShift, or any brownfield estate.
#
# Layered ON TOP of values-baseline.yaml, like the substrate overlays:
#   helm install gibson helm/gibson \
#     -f helm/gibson/values-baseline.yaml -f helm/gibson/values-guest.yaml
#
# It turns off the four operator-substitution seams and nothing else. The
# cluster supplies cert-manager, External Secrets, ExternalDNS and
# CloudNativePG, along with their CRDs. Gibson still runs exactly one of each;
# this only selects the owner.
#
# The CRDs matter as much as the operators. A chart that ships a subset of
# certificates.cert-manager.io overwrites the customer's copy underneath their
# running controller, so the CRD chart follows the same switch.
certManager:
  enabled: false
externalSecrets:
  enabled: false
externalDns:
  enabled: false
cnpg:
  enabled: false

# The cluster's External Secrets runs in its own namespace, with its own
# ServiceAccount. The store logs in to OpenBao as that ServiceAccount, the
# OpenBao role binds the same one, and the OpenBao NetworkPolicy admits that
# namespace (charts#369; the first guest exit test failed on "unable to create
# client"). Set it to the namespace of your External Secrets install.
gibson-workloads:
  externalSecrets:
    clusterSecretStore:
      serviceAccount:
        name: external-secrets
        namespace: external-secrets
