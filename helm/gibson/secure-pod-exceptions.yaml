# secure-pod-exceptions.yaml: each pod that does not meet the secure pod rule
# (ADR-0165), with the reason. scripts/check-secure-pod.py reads this file.
#
# pods: one entry for each workload and rule.
#   Key:    '<Kind>/<namespace>/<name> <rule>'
#   digest: a digest of the findings of that workload for that rule, over each
#           rendered profile. A new finding moves the digest and fails the
#           guard. The guard prints the new digest.
#   reason: why the pod has the exception.
# An entry with no finding in any render fails the guard, so this file cannot
# go stale. To see the findings behind a digest, run:
#   python3 scripts/check-secure-pod.py --print
#
# Rules: restricted (Pod Security Standard "restricted"), read-only (root
# filesystem), token (ServiceAccount token mount), network (the Cilium label
# policy of D76), image (install registry and digest), namespace-label.
#
# runtime: one entry for each pod that an operator creates at run time. The
# chart renders no such pod. `created_by` names the rendered workload that
# creates it. The guard fails when no render has that workload.
runtime:
  setec-launcher-net-admin:
    rule: restricted
    created_by: Deployment/setec-system/setec
    reason: >-
      Each sandbox is a Firecracker machine in a launcher Pod that the setec
      operator creates at run time (ADR-0166). The launcher holds the one
      capability NET_ADMIN for the tap device of the machine and asks for
      /dev/kvm and /dev/net/tun as device resources, so it is not privileged
      and mounts no host path (D46, ADR-0165 rule 1). The entry covers rule 1
      only.
  catalog-connector-image:
    rule: image
    created_by: Deployment/gibson/gibson-connector-operator
    reason: >-
      The image of a catalog connector is a vendor image in the vendor
      registry, with a digest (ADR-0114). The platform owner approves the
      image when the catalog entry merges. The entry covers rule 5 only.
pods:
  'Namespace/gibson namespace-label':
    digest: c00f8736a37861fe
    reason: "The SPIRE agent and the SPIFFE CSI driver run in the release namespace and mount host paths (expected exception of ADR-0165). The namespace cannot enforce the restricted level while they run there."
  'Namespace/setec-system namespace-label':
    digest: c00f8736a37861fe
    reason: "Expected exception of ADR-0165: the setec node agent mounts host paths, so its namespace cannot enforce the restricted level."
  'Deployment/setec-system/setec network':
    digest: 8e5fbbdfc80276c6
    reason: "The setec chart renders this pod in its own namespace and owns the policies of that namespace. The default deny of the release covers the release namespace only."
  'Deployment/setec-system/setec-frontend network':
    digest: 8e5fbbdfc80276c6
    reason: "The setec chart renders this pod in its own namespace and owns the policies of that namespace (D76): the frontend takes gRPC from the daemon of the release only."
  'DaemonSet/setec-system/setec-device-plugin network':
    digest: 8e5fbbdfc80276c6
    reason: "The setec chart renders this pod in its own namespace and owns the policies of that namespace (D76): the device plugin talks to the kubelet over a unix socket and gets no network allow."
  'DaemonSet/setec-system/setec-device-plugin restricted':
    digest: 911a247752dfc384
    reason: "Expected exception of ADR-0165: the KVM device plugin registers with the kubelet over the host device-plugins socket and opens /dev/kvm and /dev/net/tun of the node, so it runs as root with two host paths. It drops every capability and is not privileged; the launcher Pods it serves are not privileged (ADR-0166)."
  'Deployment/setec-system/setec-frontend restricted':
    digest: 1d5154f773b7fa50
    reason: "Expected exception of ADR-0165: the frontend reads its X509-SVID from the SPIRE agent socket on the node (ADR-0142), a host path, the same way the SPIRE CSI driver of the release namespace does."
  'Pod/gibson/gibson-server-test-connection network':
    digest: 8e5fbbdfc80276c6
    reason: "An upstream SPIRE helm test pod. The upstream chart takes no pod labels for it, so the default deny of the release isolates it."
  'Pod/gibson/gibson-spiffe-oidc-discovery-provider-test-connection network':
    digest: 8e5fbbdfc80276c6
    reason: "An upstream SPIRE helm test pod. The upstream chart takes no pod labels for it, so the default deny of the release isolates it."
  'Pod/gibson/gibson-spiffe-oidc-discovery-provider-test-keys network':
    digest: 8e5fbbdfc80276c6
    reason: "An upstream SPIRE helm test pod. The upstream chart takes no pod labels for it, so the default deny of the release isolates it."
  'DaemonSet/gibson/gibson-agent read-only':
    digest: eb9676462f099991
    reason: "Expected exception of ADR-0165: the SPIRE agent and the SPIFFE CSI driver are node agents and mount host paths."
  'DaemonSet/gibson/gibson-spiffe-csi-driver read-only':
    digest: 11ea229adb46b8e3
    reason: "Expected exception of ADR-0165: the SPIRE agent and the SPIFFE CSI driver are node agents and mount host paths."
  'DaemonSet/gibson/node-agent read-only':
    digest: 3b74e134c6bcaaad
    reason: "Expected exception of ADR-0165: a vendored operator. Its upstream chart sets the pod."
  'Deployment/gibson/gibson-docs-svc read-only':
    digest: f645e1e6ef183e3d
    reason: "The image rewrites its own index.html at start, so its root cannot be read-only. docs-site#79 changes the image."
  'Pod/gibson/gibson-openfga-test-connection read-only':
    digest: 1eb6b295da1171fb
    reason: "An upstream OpenFGA helm test pod. The chart sets no security context for it and has no value for one."
  'DaemonSet/gibson/gibson-agent restricted':
    digest: 58a63912eaf1ea86
    reason: "Expected exception of ADR-0165: the SPIRE agent and the SPIFFE CSI driver are node agents and mount host paths."
  'DaemonSet/gibson/gibson-spiffe-csi-driver restricted':
    digest: b925d3d195bb22d0
    reason: "Expected exception of ADR-0165: the SPIRE agent and the SPIFFE CSI driver are node agents and mount host paths."
  'DaemonSet/gibson/node-agent restricted':
    digest: d6fc811bbe059e20
    reason: "Expected exception of ADR-0165: a vendored operator. Its upstream chart sets the pod."
  'Pod/gibson/gibson-openfga-test-connection restricted':
    digest: 964949eb904251bb
    reason: "An upstream OpenFGA helm test pod. The chart sets no security context for it and has no value for one."
  'DaemonSet/gibson/gibson-spiffe-csi-driver token':
    digest: 24ae7871ca615480
    reason: "The SPIFFE CSI driver chart gives the pod a ServiceAccount with no grant. The chart has no value that turns the token mount off."
  'DaemonSet/gibson/node-agent token':
    digest: b91d468512d5e74a
    reason: "Expected exception of ADR-0165: a vendored operator. Its upstream chart sets the pod."
  'Deployment/gibson/external-secrets-webhook token':
    digest: 5401b028ab76cfef
    reason: "Expected exception of ADR-0165: a vendored operator. Its upstream chart sets the pod."
  'Deployment/gibson/gibson-spiffe-oidc-discovery-provider token':
    digest: e89690d6cef81447
    reason: "The SPIRE OIDC provider chart gives the pod a ServiceAccount with no grant. The chart has no value that turns the token mount off."
  'Deployment/gibson/gibson-zitadel-login token':
    digest: 4bf5b735032c4641
    reason: "The ZITADEL chart has no value that turns the token mount of the login pod off."
  'Deployment/gibson/velero token':
    digest: b91d468512d5e74a
    reason: "Expected exception of ADR-0165: a vendored operator. Its upstream chart sets the pod."
  'Pod/gibson/gibson-openfga-test-connection token':
    digest: f905b201ea835d99
    reason: "An upstream OpenFGA helm test pod on the default ServiceAccount. The chart has no value that turns the token mount off."
  'Pod/gibson/gibson-server-test-connection token':
    digest: f905b201ea835d99
    reason: "An upstream SPIRE helm test pod on the default ServiceAccount. The chart has no value for its ServiceAccount."
  'Pod/gibson/gibson-spiffe-oidc-discovery-provider-test-connection token':
