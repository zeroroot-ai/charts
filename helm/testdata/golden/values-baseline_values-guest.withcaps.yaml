                            # (GHSA-88fg, GHSA-9q4v, gibson#648).
                            #
                            # The per-kid endpoint answers GET .../keys/{agentID}
                            # with that component's daemon-asserted principal_ref
                            # and tenant_id. Published here it was unauthenticated
                            # — ext_authz disabled, jwt_authn allow_missing — so
                            # anyone on the internet could resolve a component's
                            # tenant and principal from its agent id, and use the
                            # 404-vs-200 split as an oracle to enumerate valid
