# Source: gibson/charts/gibson-workloads/templates/envoy/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibson-envoy
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: envoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gibson-workloads
      app.kubernetes.io/instance: gibson
      app.kubernetes.io/component: envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-workloads
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: envoy
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/ingress-edge: "true"
      annotations:
        # Velero fs-backup (defaultVolumesToFsBackup on the shipped Schedule)
        # snapshots every pod volume it is not told to skip. These hold a
        # socket, a scratch dir or an init-rendered file: nothing to keep,
        # and on restore each one becomes a PodVolumeRestore that can only
        # finish once this pod is running. Measured 2026-09-07: 9 of 22
        # PodVolumeRestores in a preserve backup were volumes like these.
        # scripts/check-velero-volume-excludes.sh keeps this list equal to
        # the pod's emptyDir and CSI-ephemeral volumes.
        backup.velero.io/backup-volumes-excludes: "config-rendered,spire-agent-socket,tmp,wasm"
        checksum/config: 3e7dbe99648568fc9ea37407f211ad0b981be4bcc2b530b6c2a7aad24187310e
        # Pod-roll-on-Secret-change delegated to Stakater Reloader (deploy#127,
        # parent deploy#123 — envoy-cert-unify slice D).
        #
        # 1. `gibson-envoy-tls` — Envoy reads the edge cert at process start
        #    (no SDS for the edge listener); when cert-manager renews the leaf
        #    and rewrites the Secret, Reloader restarts this Deployment so the
        #    pods serve the new cert.
        # 2. `gibson-dashboard-oidc` — the dashboard OAuth client_id is
        #    substituted into envoy.yaml at pod startup (see initContainer
        #    `render-envoy-config` below) and accepted by the
        #    `zitadel_dashboard` jwt_authn provider as a JWT `aud` value.
        #    Zitadel mints a new client_id on every reset, platform-operator
        #    rewrites this Secret, Reloader rolls Envoy so the new client_id
        #    is read by the next pod. Without this annotation, the old
        #    client_id stays in the live envoy.yaml and every dashboard JWT
        #    fails with `Audiences in Jwt are not allowed`.
        secret.reloader.stakater.com/reload: "gibson-envoy-tls,gibson-dashboard-oidc,gibson-native-login-oidc"
    spec:
      
      imagePullSecrets:
        - name: ghcr-credentials
      serviceAccountName: gibson-envoy
      automountServiceAccountToken: false
      priorityClassName: gibson-platform-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gibson-workloads
              app.kubernetes.io/instance: gibson
              app.kubernetes.io/component: envoy
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gibson-workloads
                    app.kubernetes.io/instance: gibson
                    app.kubernetes.io/component: envoy
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # render-envoy-config
        # ------------------
        # Substitutes the literal placeholder `${DASHBOARD_CLIENT_ID}` in the
        # mounted bootstrap template with the LIVE OAuth client_id from
        # Secret `gibson-dashboard-oidc` (key `client_id`, written by
        # platform-operator on every Zitadel reset / OIDC re-mint).
        #
        # The chart no longer hardcodes the client_id in env overlays
        # (values-kind.yaml, values-aws-prod.yaml etc.) because Zitadel
        # mints a fresh numeric id on every reset, and the chart-time
        # value drifts STALE — Envoy's jwt_authn rejects every dashboard
        # JWT with `Audiences in Jwt are not allowed`. Argo's repo-server
        # cannot `lookup` cluster Secrets at chart-render time, so
        # resolution moved to pod startup.
        #
        # The render uses `sed` (no template engine, no envsubst dependency)
        # against an alpine/k8s base — same image the chart already uses
        # for kubectl-bearing probes (values.yaml kubectlImage). The
        # rendered file is written to a shared emptyDir at /etc/envoy/
        # which the main envoy container reads with `-c
        # /etc/envoy/envoy.yaml`. The original ConfigMap remains mounted
        # read-only at /etc/envoy-template/ for transparency / debug.
        #
        # Failure modes (all fail loud so the pod CrashLoops, surfacing
        # the problem instead of producing a half-broken Envoy):
        #   - Secret missing / not yet projected → cat fails → exit 1
        #   - client_id key absent or empty       → fail loud, exit 2
        #   - sed substitution leaves a literal placeholder still present
        #     → fail loud, exit 3
        # copy-coraza-wasm (/ deploy#1658)
        # ---------------------------------------
        # The Edge WAF module. The mirrored coraza-proxy-wasm image carries
        # the compiled Coraza + Core Rule Set at /plugin.wasm; copy it into an
        # emptyDir the envoy container loads as a local file. No network at
        # pod start, so air-gapped installs work, and the CRS version is the
        # image tag. Fails loud on a missing or empty module.
        - name: copy-coraza-wasm
          image: "ghcr.io/zeroroot-ai/mirror/coraza-proxy-wasm:0.6.0-busybox@sha256:6ac95e71ef11c3ae55d094e7e2da65c75d4539e233ea5e55a4bedc7b4e6a7acd"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              [ -s /plugin.wasm ] || { echo "FATAL: /plugin.wasm missing or empty in the coraza-proxy-wasm image" >&2; exit 2; }
              cp /plugin.wasm /wasm/coraza.wasm
              echo "[copy-coraza-wasm] $(wc -c < /wasm/coraza.wasm) bytes"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: wasm
              mountPath: /wasm
        - name: render-envoy-config
          image: "ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              CLIENT_ID=$(cat /etc/dashboard-oidc/client_id)
              if [ -z "$CLIENT_ID" ]; then
                echo "FATAL: gibson-dashboard-oidc Secret has empty client_id key" >&2
                echo "platform-operator must populate it before Envoy can start." >&2
                exit 2
              fi
              # gibson#693 — the native-login (gibson login / device-grant) OAuth
              # client_id. CLI user tokens carry this audience; jwt_authn must
              # accept it so they flow through ext_authz like dashboard tokens.
              # OPTIONAL (unlike the dashboard client_id which gates sign-in):
              # the gibson-native-login-oidc Secret is provisioned asynchronously
              # by the gibson-native-login OIDCClient CR. Envoy MUST start without
              # it — substitute a non-matching sentinel so the audience entry is
              # valid-but-inert until the Secret lands (Reloader then rolls Envoy).
              # A hard exit here previously risked taking the edge down on a
              # not-yet-provisioned CLI-login secret.
              NATIVE_LOGIN_CLIENT_ID=$(cat /etc/native-login-oidc/client_id 2>/dev/null || true)
              if [ -z "$NATIVE_LOGIN_CLIENT_ID" ]; then
                echo "render-envoy-config: gibson-native-login-oidc not yet provisioned; CLI login disabled until it lands" >&2
                NATIVE_LOGIN_CLIENT_ID="native-login-unconfigured"
              fi
              echo "render-envoy-config: substituting DASHBOARD_CLIENT_ID=$CLIENT_ID NATIVE_LOGIN_CLIENT_ID=$NATIVE_LOGIN_CLIENT_ID"
              # Use a non-/ delimiter so numeric client_ids never collide
              # with regex metacharacters (they're all digits today, but
              # this hedges against future opaque ids).
              sed -e "s|\${DASHBOARD_CLIENT_ID}|$CLIENT_ID|g" \
                  -e "s|\${NATIVE_LOGIN_CLIENT_ID}|$NATIVE_LOGIN_CLIENT_ID|g" \
                /etc/envoy-template/envoy.yaml > /etc/envoy/envoy.yaml
              if grep -F '${DASHBOARD_CLIENT_ID}' /etc/envoy/envoy.yaml >/dev/null; then
                echo "FATAL: placeholder \${DASHBOARD_CLIENT_ID} still present after sed" >&2
                exit 3
              fi
              if grep -F '${NATIVE_LOGIN_CLIENT_ID}' /etc/envoy/envoy.yaml >/dev/null; then
                echo "FATAL: placeholder \${NATIVE_LOGIN_CLIENT_ID} still present after sed" >&2
                exit 3
              fi
              echo "render-envoy-config: ok"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config-template
              mountPath: /etc/envoy-template
              readOnly: true
            - name: config-rendered
              mountPath: /etc/envoy
            - name: dashboard-oidc
              mountPath: /etc/dashboard-oidc
              readOnly: true
            - name: native-login-oidc
              mountPath: /etc/native-login-oidc
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: envoy
          image: "ghcr.io/zeroroot-ai/mirror/envoy:v1.34.0@sha256:45d37d848802f98a5647cb7522b4c1c42e0e0e775913d8e253ef3a5856bef986"
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--service-cluster"
            - "gibson-envoy"
            - "--service-node"
            - "gibson-envoy"
            - "--log-level"
            - "info"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: https
              containerPort: 10000
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
          volumeMounts:
            # The main envoy container reads its bootstrap from the
            # post-init emptyDir, NOT directly from the ConfigMap. The
            # `render-envoy-config` initContainer writes
            # /etc/envoy/envoy.yaml here after substituting the live
            # dashboard client_id from the gibson-dashboard-oidc Secret.
            # `readOnly: false` is intentional: the kubelet bind-mounts
            # the TLS Secret onto `/etc/envoy/tls` below, which requires
            # the parent directory to be writable enough to mkdir the
            # sub-mount. The rendered envoy.yaml itself is treated as
            # read-only by the envoy process (no writes happen inside
            # the container — readOnlyRootFilesystem stays true).
            - name: config-rendered
              mountPath: /etc/envoy
            - name: tls
              mountPath: /etc/envoy/tls
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: wasm
              mountPath: /etc/envoy/wasm
              readOnly: true
          # Envoy /ready returns 200 only when all listeners + clusters are
          # warm. With async_fetch.fast_listener: true the listener IS up
          # quickly, but JWKS upstreams (Zitadel + ext_authz JWKS) may take
          # tens of seconds on a fresh deploy. Generous startupProbe gives
          # Envoy room to recover before liveness can kill it.
          startupProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60   # 5min total grace for cold-start
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
      volumes:
        # Read-only bootstrap TEMPLATE from the ConfigMap. The literal
        # placeholder `${DASHBOARD_CLIENT_ID}` in this file is replaced by
        # the `render-envoy-config` initContainer at pod startup.
        - name: config-template
          configMap:
            name: gibson-envoy
        # Rendered config the main envoy container actually reads. Written
        # to by the initContainer; treated read-only by the envoy process.
        - name: config-rendered
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Live OAuth client_id of the gibson-dashboard OIDC app. Owned
        # by platform-operator; rewritten on every Zitadel reset.
        # Stakater Reloader (annotation on this Deployment) rolls the
        # pod when this Secret changes.
        - name: dashboard-oidc
          secret:
            secretName: gibson-dashboard-oidc
            defaultMode: 0400
            items:
              - key: client_id
                path: client_id
        # gibson#693 — native-login (gibson login) client_id, minted by the
        # gibson-native-login OIDCClient CR. Substituted into the jwt_authn
        # audience list so CLI user tokens are accepted + flow through ext_authz.
        - name: native-login-oidc
          secret:
            secretName: gibson-native-login-oidc
            defaultMode: 0400
            # optional: the gibson-native-login OIDCClient provisions this
            # asynchronously; Envoy must start without it (the initContainer
            # substitutes a non-matching sentinel). Required-mount previously
            # risked CreateContainerConfigError on the edge.
            optional: true
            items:
              - key: client_id
                path: client_id
        - name: tls
          secret:
            secretName: gibson-envoy-tls
            defaultMode: 0400
        # SPIRE Workload API socket — exposed by the spire-agent DaemonSet
        # via the csi.spiffe.io CSI driver. The hostPath /run/spire/sockets
        # we previously declared doesn't exist on the host: the SPIRE chart
        # puts its socket at /run/spire/agent-sockets/ and only the CSI
        # driver exposes it to pods. See spec kind-dashboard-bringup-e2e (D2).
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: tmp
          emptyDir: {}
        # The Edge WAF module, filled by copy-coraza-wasm. ~18MiB.
        - name: wasm
          emptyDir:
            sizeLimit: 64Mi
