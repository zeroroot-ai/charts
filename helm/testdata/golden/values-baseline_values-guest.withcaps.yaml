            description: |
              The orphan-reaper is stripping more than 5 finalizers/hour. A
              single strip is expected after test teardown or an operator
              restart mid-saga; a sustained rate indicates an upstream
              problem (saga-path failures, or clients creating child CRs
              without owner references and deleting parents quickly).
              First step: read the reaper's logs for the resource kinds it
              stripped, then find the controller that created them without an
              owner reference.
        - alert: TenantOperatorStuckTerminatingNamespaces
          expr: gibson_tenant_operator_stuck_terminating_namespaces > 0
          for: 15m
          labels:
            severity: warning
            component: tenant-operator
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/tenant-operator.md#tenantoperatorstuckterminatingnamespaces"
            summary: "Tenant namespace(s) stuck in Terminating past reaper grace period"
            description: |
              At least one tenant-* namespace has been Terminating longer
              than the reaper grace period. The reaper should be clearing
              orphan finalizers; if this alert fires, either the reaper is
              disabled or the stuck resources have unknown finalizers that
              require operator intervention.
              First step: `kubectl get ns <ns> -o jsonpath='{.spec.finalizers}'`
              and the namespace's remaining resources. A finalizer the reaper
              does not know is removed by fixing its controller, never by
              editing the namespace.
    - name: tenant-operator.final-backup
      rules:
        - alert: TenantOperatorFinalBackupFailed
          # Owner decision of 2026-10-05 (charts#405): a tenant delete takes
          # a last backup first, and the flow fails when the backup fails
          # (gibson#677). The counter grows once per delete pass that stopped
          # because the backup did not complete, by reason: read_namespace,
          # audit, create, read, backup_failed, timeout. One such pass pages:
          # the tenant is not deleted and nothing else says so.
          # The producer creates a label set at its first failure, so the
          # series starts at 1 and increase() sees no rise. The second term
          # fires on a series that did not exist one window ago (charts#507).
          expr: |
            sum(increase(gibson_tenant_operator_final_backup_failures_total[15m])) > 0
              or
            sum(gibson_tenant_operator_final_backup_failures_total
              unless gibson_tenant_operator_final_backup_failures_total offset 15m) > 0
          for: 0m
          labels:
            severity: page
            component: tenant-operator
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/tenant-operator.md#tenantoperatorfinalbackupfailed"
            summary: "The last backup of a tenant delete failed"
            description: |
              A tenant delete stopped in the last 15 minutes because the last
              backup of the tenant did not complete. The delete removed
              nothing and retries on the next pass. Read the reason label of
              gibson_tenant_operator_final_backup_failures_total: backup_failed
              and timeout name the Velero Backup, create and read name the
              Velero API, read_namespace names the tenant namespace, and
              audit names the daemon.
    - name: tenant-operator.daemon-calls
      rules:
        - alert: TenantOperatorDaemonCallsFailing
          expr: increase(gibson_tenant_operator_daemon_call_errors_total[10m]) > 3
          for: 5m
          labels:
            severity: critical
            component: tenant-operator
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/tenant-operator.md#tenantoperatordaemoncallsfailing"
            summary: "tenant-operator -> daemon gRPC calls failing repeatedly"
            description: |
              The tenant-operator's daemon client (SPIFFE-mTLS gRPC,
              gibson.daemon.operator.v1.DaemonOperatorService) has returned
              errors repeatedly over the last 10m. The admin-ops drain calls
              the daemon every ~15s, so a sustained failure means tenant
              admin CRUD / pending-provisioning is stalled and new signups
              can hang in the "no access to workspace" loop.
              Check the {method,outcome} labels: outcome="permission_denied"
              or "unauthenticated" is an authz/SPIFFE-allowlist regression
              (the gibson#1043 class); outcome="unavailable" /
              "deadline_exceeded" is a daemon reachability problem.
        - alert: TenantOperatorDaemonCallsDenied
          expr: increase(gibson_tenant_operator_daemon_call_errors_total{outcome=~"permission_denied|unauthenticated"}[10m]) > 0
          for: 5m
          labels:
            severity: critical
            component: tenant-operator
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/tenant-operator.md#tenantoperatordaemoncallsdenied"
            summary: "daemon is DENYING tenant-operator calls (authz/SPIFFE regression)"
            description: |
              The daemon returned permission_denied/unauthenticated to the
              tenant-operator. This is the gibson#1043 signature: a
              SPIFFE-allowlist or FGA-tuple omission silently blocking the
              operator->daemon path. It will not self-heal — the deny is
              deterministic. Inspect the daemon's spiffePlatformBypass
              allow-list and the platform_operator FGA tuples for the
              operator service account.
---
# Source: gibson/charts/gibson-workloads/templates/dashboard/auth-prometheusrule.yaml
# Spec auth-resolution-hardening (R3, R8) — SLO recording rules + alert
# rules for the dashboard auth path. Surfaces sign-in error rate, FGA
# unreachability, and sign-in latency budget burn.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gibson-dashboard-auth-rules
  namespace: gibson
  labels:
    app.kubernetes.io/name: gibson-dashboard
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/component: dashboard-auth
spec:
  groups:
    # --------------------------------------------------------------------
    # SLO recording rules — referenced by alerts below + the Grafana
    # dashboard. Objectives (annotation-only):
    #   p95(dashboard_signin_duration_seconds) < 1.5s
    #   p99(dashboard_signin_duration_seconds) < 3.0s
    # --------------------------------------------------------------------
    - name: dashboard-auth-slos
      interval: 30s
      rules:
        - record: slo:dashboard_signin_p95_seconds
          expr: |
            histogram_quantile(0.95, sum(rate(dashboard_signin_duration_seconds_bucket[5m])) by (le))
        - record: slo:dashboard_signin_p99_seconds
          expr: |
            histogram_quantile(0.99, sum(rate(dashboard_signin_duration_seconds_bucket[5m])) by (le))

    # --------------------------------------------------------------------
    # Alerts — page on sign-in error rate, FGA unreachability, and SLO
    # latency-budget burn.
    # --------------------------------------------------------------------
    - name: dashboard-auth-alerts
      rules:
        - alert: DashboardSignInErrorRateHigh
          expr: |
            (sum(rate(dashboard_signin_total{outcome="error"}[5m]))
              /
             sum(rate(dashboard_signin_total[5m]))) > 0.01
          for: 5m
          labels:
            severity: page
            component: dashboard-auth
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/dashboard-auth.md#dashboardsigninerrorratehigh"
            summary: "Dashboard sign-in error rate >1% over 5m"
            description: |
              More than 1% of dashboard sign-in attempts have failed over
              the last 5 minutes. Check
              dashboard_login_error_total{reason} for the dominant
              reason.
        - alert: DashboardSignInDaemonUnreachable
          # Owner decision of 2026-10-05 (charts#405): a sign-in that fails
          # because the dashboard cannot reach the daemon pages. The jwt
          # callback of the dashboard records each failed sign-in with the
          # reason of its membership resolution (auth.ts, membership.ts):
          # daemon_unavailable is a transport failure, Unavailable or
          # DeadlineExceeded from ListMyMemberships. One such sign-in
          # fires the rule.
          # The producer creates a label set at its first failure, so the
          # series starts at 1 and increase() sees no rise. The second term
          # fires on a series that did not exist one window ago (charts#507).
          expr: |
            sum(increase(dashboard_signin_total{outcome="error", error_reason="daemon_unavailable"}[5m])) > 0
              or
            sum(dashboard_signin_total{outcome="error", error_reason="daemon_unavailable"}
              unless dashboard_signin_total{outcome="error", error_reason="daemon_unavailable"} offset 5m) > 0
          for: 0m
          labels:
            severity: page
            component: dashboard-auth
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/dashboard-auth.md#dashboardsignindaemonunreachable"
            summary: "A sign-in failed because the dashboard cannot reach the daemon"
            description: |
              A sign-in callback of the dashboard failed in the last 5
              minutes because ListMyMemberships did not reach the daemon
              (Unavailable, DeadlineExceeded, or a transport failure). The
              person saw /login/error?reason=daemon_unavailable. Check the
              daemon pods, Envoy, and the network policy between the
              dashboard and the daemon.
        - alert: DashboardFGAUnreachable
          expr: |
            increase(dashboard_membership_resolution_total{outcome="fga_error"}[1m]) > 0
          for: 30s
          labels:
            severity: page
            component: dashboard-auth
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/dashboard-auth.md#dashboardfgaunreachable"
            summary: "Dashboard cannot reach FGA — membership resolution failing"
            description: |
              The dashboard's getMyMemberships() RPC is failing with FGA
              unreachable. Sign-in routes users to /login/error. Check
              gibson-fga health and the daemon's ListMyMemberships handler
              logs.
        - alert: DashboardSignInLatencyBudgetBurn
          # Multi-window burn-rate: page if p95 latency exceeds the SLO
          # objective sustained over both a 5m and 1h window.
          expr: |
            (slo:dashboard_signin_p95_seconds > 1.5)
              and
            (avg_over_time(slo:dashboard_signin_p95_seconds[1h]) > 1.5)
          for: 10m
          labels:
            severity: page
            component: dashboard-auth
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/dashboard-auth.md#dashboardsigninlatencybudgetburn"
            summary: "Dashboard sign-in p95 latency budget burning at >2x"
            description: |
              p95 sign-in latency has been above the 1.5s SLO objective
              for >10m sustained. Investigate Zitadel JWKS cache,
              membership-resolution latency, and Envoy upstream health.
        - alert: DashboardWorkloadSvidFallback
          # Spec dashboard-fga-user-identity R8 — degraded-mode detector.
          #
          # RENAMED WITH THE SERIES (dashboard#165, charts#311). The old name,
          # dashboard_user_token_forwarding_disabled_total, described a soak
          # backout flag that no longer exists: the env var and the values key
          # were both deleted in charts#294 and nothing read the flag. Worse, the
          # series was DECLARED and incremented nowhere, so this alert could not
          # fire at all — a permanently silent rule reading as coverage.
          #
          # The condition is real and now has a producer: spiffeNodeOptions()
          # returns undefined when the SPIFFE Workload API socket is absent or
          # the SVID cache is cold, and the RPC then reaches Envoy with only its
          # Bearer token. The counter is emitted by src/lib/metrics/auth.ts and
          # asserted by its own test since v0.127.2, so this expr has a writer
          # that cannot quietly disappear. It is deliberately NOT written against
          # a release: a comment that says "as of vX" goes stale at the next pin
          # and reads as doubt about whether the rule still fires.
          expr: |
            increase(dashboard_workload_svid_fallback_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
            component: dashboard-auth
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/dashboard-auth.md#dashboardworkloadsvidfallback"
            summary: "Dashboard falling back to a workload SVID for user RPCs"
            description: |
              The dashboard is making daemon RPCs via the SPIFFE
              workload-JWT fallback. Per-user FGA is disabled and audit
              attribution is wrong — that consequence is unchanged and is why
              this is a warning rather than info.
              There is no backout flag to check: USE_USER_TOKEN_FORWARDING and
              dashboard.userTokenForwarding were both deleted in charts#294, so
              a non-zero rate here is a transport fault. The cold-SVID-cache
              branch increments once per pod start, which `for: 10m` absorbs;
              a missing Workload API socket sustains it. Read the dashboard
              logs for the fallback reason.
---
