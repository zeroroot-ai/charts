apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibson-connector-operator
  namespace: gibson
  labels:
    app.kubernetes.io/name: gibson-connector-operator
    app.kubernetes.io/part-of: gibson
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gibson-connector-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-connector-operator
        app.kubernetes.io/part-of: gibson
        app.kubernetes.io/component: connector-operator
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/kube-api: "true"
        gibson.zeroroot.ai/egress-namespaces: "true"
        gibson.zeroroot.ai/ingress-control-plane: "true"
      annotations:
        # Velero fs-backup (defaultVolumesToFsBackup on the shipped Schedule)
        # snapshots every pod volume it is not told to skip. These hold a
        # socket, a scratch dir or an init-rendered file: nothing to keep,
        # and on restore each one becomes a PodVolumeRestore that can only
        # finish once this pod is running. Measured 2026-09-07: 9 of 22
        # PodVolumeRestores in a preserve backup were volumes like these.
        # scripts/check-velero-volume-excludes.sh keeps this list equal to
        # the pod's emptyDir and CSI-ephemeral volumes.
        backup.velero.io/backup-volumes-excludes: "spire-agent-socket"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      
      imagePullSecrets:
        - name: ghcr-credentials
      serviceAccountName: gibson-connector-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # the finalizer dials the daemon over SPIFFE mTLS; without a
      # SPIRE agent socket the dial hangs silently, so the pod does not start
      # until the socket is present (deploy#201).
      initContainers:
        - name: wait-for-spire-socket
          image: ghcr.io/zeroroot-ai/mirror/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c']
          args:
            - |
              # deploy#201: SPIRE is required infrastructure. Fail-fast (60s) if the
              # Workload API socket is not present on this node — a missing socket
              # means the SPIRE agent DaemonSet is unhealthy and SPIFFE-consuming
              # workloads MUST NOT proceed (their mTLS / JWT-SVID minting would
              # silently hang otherwise).
              SOCK="/run/spire/agent/spire-agent.sock"
              DEADLINE=$(( $(date +%s) + 60 ))
              echo "[wait-for-spire-socket] waiting for ${SOCK} (timeout: 60s)..."
              until [ -S "${SOCK}" ]; do
                if [ $(date +%s) -ge ${DEADLINE} ]; then
                  echo "[wait-for-spire-socket] ERROR: ${SOCK} not present after 60s; SPIRE agent DaemonSet is not healthy on this node. Fix the SPIRE control plane before this pod can start." >&2
                  exit 1
                fi
                sleep 1
              done
              echo "[wait-for-spire-socket] ok"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent
              readOnly: true
      containers:
        - name: manager
          image: "ghcr.io/zeroroot-ai/connector-operator:v0.154.0@sha256:cdbc2d083e9573ec281a28bed4f90085cf8a28876a34fa834703a45b81b454a8"
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            # The daemon the finalizer revokes connector grants through
            #. gibson-common's gibson.daemonAddress is the single
            # source of truth for the dialing address (deploy#179). REQUIRED by
            # cmd/main.go: an operator that cannot reach the daemon fails at
            # boot rather than leaving grants alive after every delete.
            - name: GIBSON_DAEMON_GRPC_ADDRESS
              value: "gibson-gibson-workloads:50051"
            # the daemon SVID pinned at the mTLS handshake.
            - name: GIBSON_DAEMON_SPIFFE_ID
              value: "spiffe://zeroroot.ai/platform/daemon"
            # The caller check of each connector proxy (MCPServer and
            # MCPRemoteProxy). The operator writes an inline oidcConfig (this
            # SPIRE OIDC issuer and its JWKS, audience gibson-connector-proxy)
            # and one Cedar policy that admits only GIBSON_DAEMON_SPIFFE_ID.
            # The operator refuses to start without both values. The issuer
            # and the JWKS are the ones the OpenBao JWT auth uses
            # (vault.jwtAuth.*).
            - name: CONNECTOR_PROXY_OIDC_ISSUER
              value: "https://gibson-spiffe-oidc-discovery-provider"
            - name: CONNECTOR_PROXY_JWKS_URL
              value: "https://gibson-spiffe-oidc-discovery-provider.gibson.svc.cluster.local/keys"
            # SPIRE Workload API socket the X509Source streams SVIDs from.
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/spire/sockets/api.sock"
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: probes
              protocol: TCP
          # Both probes declare timeoutSeconds. The default is 1, and on a
          # loaded 2-core runner controller-runtime's own handler has missed it
          # (charts#306, the OpenBao case in auth/openbao-deployment.yaml).
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        # SPIRE Workload API socket via the csi.spiffe.io CSI driver — SPIRE is
        # structural infrastructure (deploy#201); no gate.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
      terminationGracePeriodSeconds: 30
