apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: "gibson-secrets"
  # Deterministic cold-bringup ordering (deploy#820): when a single umbrella
  # Application installs everything in one sync, the store + ExternalSecrets
  # must materialize BEFORE the init Jobs (zitadel-init et al.) that mount the
  # resulting secrets. The store is STANDING infrastructure consumed by every
  # ExternalSecret refresh — it must NOT be an Argo hook: hook lifecycle
  # (BeforeHookCreation deletes, operation-retry cleanup) deleted it mid-sync
  # on staging (2026-06-11), wedging every ExternalSecret in SecretSyncedError.
  # A regular resource at the earliest sync-wave (-10) is durable and still
  # precedes the ExternalSecrets (-8) and the zitadel init chain (-6/-4/-3).
  # Kind (separate wave-ordered Applications) leaves this off.
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: external-secrets
spec:
  conditions:
    - namespaces:
        - "gibson"
  provider:
    vault:
      server: "http://gibson-openbao.gibson.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-reader"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
