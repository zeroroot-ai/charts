            # config block (gitops apps/zitadel.yaml).
            - name: ZITADEL_SYSTEM_KEY_PATH
              value: "/etc/zitadel-system/private-key.pem"
            - name: VAULT_ADDR
              value: "http://gibson-openbao.gibson.svc:8200"
            # Vault/OpenBao admin token via an OPTIONAL projected-Secret FILE,
            # NOT a fixed env var (deploy#971 / gibson#1000). On a from-zero
            # bringup OpenBao mints/writes this Secret later (it lives in
            # gibson-workloads, a later sync-wave), so the operator must start
            # WITHOUT it. A fixed env is read once at pod start and can never
            # refresh; a mounted projected Secret is refreshed by the kubelet
            # when the Secret appears. vaulttoken.New polls VAULT_TOKEN_PATH and
            # the PlatformBootstrap reconciler requeues until the token exists —
            # so the pod becomes Ready immediately, gibson-operators goes
            # Healthy, and Argo advances to the wave that brings OpenBao up.
            - name: VAULT_TOKEN_PATH
              value: /etc/gibson/vault-token/VAULT_ADMIN_TOKEN
          volumeMounts:
            # CA for the OpenFGA HTTP-listener cert (deploy#1382).
            - name: fga-http-ca
              mountPath: /etc/ssl/fga-ca
              readOnly: true
            - name: envoy-ca
              mountPath: /etc/ssl/envoy-ca
              readOnly: true
            - name: vault-admin-token
              mountPath: /etc/gibson/vault-token
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: zitadel-system-key
              mountPath: /etc/zitadel-system
              readOnly: true
      volumes:
        # Only ca.crt is projected — the operator must never hold the
        # OpenFGA listener's private key (deploy#1382).
        - name: fga-http-ca
          secret:
            secretName: gibson-openfga-http-tls
            items:
              - key: ca.crt
