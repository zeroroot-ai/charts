        app.kubernetes.io/managed-by=gibson-tenant-operator, and changes or
        deletes only its own (gibson#815)
    - expression: >-
        variables.v.matches('^[a-z][a-z0-9-]{2,40}$')
          && variables.t.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') && size(variables.t) <= 48
          && variables.obj.metadata.name == 'gibson-plugin-' + variables.v + '-' + variables.t
      reason: Forbidden
      message: >-
        a plugin ClusterSPIFFEID is named gibson-plugin-<plugin>-<tenant>, from
        its labels gibson.zeroroot.ai/plugin and gibson.zeroroot.ai/tenant
    - expression: >-
        request.operation == 'DELETE' || (
          has(object.spec)
          && has(object.spec.className) && object.spec.className == "gibson-gibson"
          && has(object.spec.spiffeIDTemplate)
          && object.spec.spiffeIDTemplate == "spiffe://zeroroot.ai/plugin/" + variables.v + '/' + variables.t
