                        # Misdirected request (RFC 9113 section 9.1.2). Every
                        # public hostname on this edge shares one certificate and
                        # one address, so a browser reuses (coalesces) the HTTP/2
                        # connection it opened to app.<domain> for a request to
                        # api.<domain>, and the other way round. Envoy picks the
                        # filter chain by the connection's SNI, so that request
                        # lands on a chain with an :authority the chain does not
                        # serve. Measured 2026-09-29 on staging: the GitLab
                        # connector's OAuth redirect to
                        # api.<domain>/connectors/oauth/callback rode the browser's
                        # app.<domain> connection and got the public chain's 404.
                        # The answer is 421: a browser retries the request on a new
                        # connection with the right SNI, and every other client
