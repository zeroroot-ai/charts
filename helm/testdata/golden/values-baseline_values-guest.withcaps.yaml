# Source: gibson/charts/gibson-workloads/templates/ratelimit/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gibson-ratelimit-config
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ratelimit
data:
  config.yaml: |
    domain: gibson-edge
    descriptors:
      # POST /signup on the app vhost, by client address.
      # Envoy action: generic_key route=app_signup_submit + masked_remote_address.
      - key: route
        value: app_signup_submit
        descriptors:
          - key: masked_remote_address
            rate_limit:
              unit: minute
              requests_per_unit: 5
      # OIDC login routes on the app vhost, by client address.
      - key: route
        value: app_login
        descriptors:
          - key: masked_remote_address
            rate_limit:
              unit: minute
              requests_per_unit: 30
      # Everything else on app., by client address.
      - key: route
        value: app_catch_all
        descriptors:
          - key: masked_remote_address
            rate_limit:
              unit: minute
              requests_per_unit: 600
      # api. pre-auth discovery documents, by client address.
      - key: route
        value: api_discovery
        descriptors:
          - key: masked_remote_address
            rate_limit:
              unit: minute
              requests_per_unit: 120
      # api. registration, by client address.
      - key: route
        value: api_register
        descriptors:
          - key: masked_remote_address
            rate_limit:
              unit: minute
              requests_per_unit: 10
      # Authenticated api. RPCs, by (tenant, subject) as ext-authz asserted.
      - key: route
        value: api_authenticated
        descriptors:
          - key: tenant
            descriptors:
              - key: subject
                rate_limit:
                  unit: second
                  requests_per_unit: 50
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9902 }
    static_resources:
      listeners:
        - name: mtls_ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8081 }
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    alpn_protocols: ["h2"]
                    tls_certificate_sds_secret_configs:
                      - name: "default"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    combined_validation_context:
                      default_validation_context:
                        # Only the edge Envoy may ask for a quota decision.
                        match_typed_subject_alt_names:
                          - san_type: URI
                            matcher:
                              exact: "spiffe://zeroroot.ai/platform/envoy"
                      validation_context_sds_secret_config:
                        name: "ROOTCA"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
              filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: ratelimit_local
                    cluster: ratelimit_local
      clusters:
        - name: spire_agent
          type: STATIC
          connect_timeout: 0.25s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe:
                          path: /run/spire/sockets/api.sock
        - name: ratelimit_local
          type: STATIC
          connect_timeout: 0.25s
          load_assignment:
            cluster_name: ratelimit_local
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 8082 }
---
