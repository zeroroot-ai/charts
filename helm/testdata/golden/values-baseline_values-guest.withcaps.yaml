                                # neither jwt_authn nor ext_authz, so this is the only
                                # thing standing between the internet and the daemon's
                                # :8085 pre-auth listener. Its own bucket instance —
                                # identical numbers, one per route — so a flood on one
                                # discovery path cannot starve the others.
