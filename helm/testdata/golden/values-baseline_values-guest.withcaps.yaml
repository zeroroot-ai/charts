  # umbrella copy in deploy#960): STANDING infrastructure that owns its target
  # Secret (creationPolicy: Owner) — must NOT be an Argo hook (hook lifecycle would
  # cascade-delete the owned Secret), and must sync at wave -8 (after the
  # ClusterSecretStore at -10, before the postgres-setup Jobs at -6) so the
  # Job's `.data.password` wait resolves instead of deadlocking.
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
  name: gibson-platform-postgres-credentials
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: "gibson-secrets"
    kind: ClusterSecretStore
  target:
    name: gibson-platform-postgres-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
