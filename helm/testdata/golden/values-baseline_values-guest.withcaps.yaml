      # seed table carries, so this remoteRef matches it verbatim. Renaming it
      # to gibson-platform-postgres-password means one coordinated change to
      # the seed table, this template and secret-contract.yaml — see deploy#965.
      remoteRef: { key: gibson-gibson-platform-postgres-password, property: password }
