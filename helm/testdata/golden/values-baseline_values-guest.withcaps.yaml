# Source: gibson/charts/gibson-workloads/templates/tests/07-zitadel-auth-probe.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "gibson-gibson-workloads-test-zitadel-auth-probe"
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    helm-test/keep: "false"
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/kube-api: "true"
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "5"
spec:
  restartPolicy: Never
  serviceAccountName: "gibson-gibson-workloads-test-bootstrap-reader"
  containers:
    - name: probe
      image: "ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='::error file=helm-test::'
          NS='gibson'

          # Resolve the Zitadel issuer.
          # platformBootstrap.* lives in the sibling gibson-operators chart;
          # this workload chart's tests block carries an override knob.
          # Default `http://gibson-zitadel:8080` matches the kind-dev Service.
          ISSUER='http://gibson-zitadel:8080'

          # 1. .well-known/openid-configuration reachable.
          code=$(curl -ksS -o /tmp/wk -w '%{http_code}' --max-time 10 \
            "${ISSUER}/.well-known/openid-configuration" || echo "000")
          if [ "$code" != "200" ]; then
            echo "$ERR zitadel-auth-probe: discovery endpoint returned HTTP $code"
            [ -s /tmp/wk ] && echo "[zitadel-auth-probe] body: $(head -c 400 /tmp/wk)"
            exit 1
          fi
          echo "[zitadel-auth-probe] discovery OK"

          # 2. Find the dashboard MACHINE_USER PAT secret.
          # Default `gibson-zitadel-dashboard` matches gibson-operators
          # values; override via .tests.zitadel.dashboardPatSecret.
          PAT_SECRET='gibson-zitadel-dashboard'
          PAT_KEY='pat'

          if ! kubectl -n "$NS" get secret "$PAT_SECRET" >/dev/null 2>&1 ; then
            echo "[zitadel-auth-probe] SKIPPED: MACHINE_USER PAT secret $PAT_SECRET not found"
            echo "[zitadel-auth-probe] (operator may not have minted it yet; this is non-fatal during initial bringup)"
            exit 0
          fi

          PAT=$(kubectl -n "$NS" get secret "$PAT_SECRET" \
            -o "jsonpath={.data.${PAT_KEY}}" 2>/dev/null | base64 -d 2>/dev/null || echo "")
          if [ -z "$PAT" ]; then
            echo "$ERR zitadel-auth-probe: PAT Secret $PAT_SECRET key '$PAT_KEY' is empty"
            exit 1
          fi

          # 3. Probe /management/v1/info with the PAT. A 200 OK proves Zitadel
          # accepts the token + can route the management API. If we get 401
          # the PAT is wrong; 403 means missing role grants.
          code=$(curl -ksS -o /tmp/info -w '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer ${PAT}" \
            "${ISSUER}/management/v1/info" || echo "000")
          case "$code" in
            200)
              echo "[zitadel-auth-probe] MACHINE_USER PAT verified against /management/v1/info (HTTP 200)"
              ;;
            401)
