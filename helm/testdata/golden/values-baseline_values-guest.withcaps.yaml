# Source: gibson/charts/gibson-workloads/templates/fga-init/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: gibson-gibson-workloads-fga-init-1aefec50
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: fga-init
  annotations:
    # Argo Sync hook: Argo runs this Job during the Sync phase and deletes
    # it on success. Previously declared as a regular Helm resource with
    # ttlSecondsAfterFinished: 30, which caused Argo to perpetually see the
    # Job as OutOfSync/Missing after self-deletion (deploy#494).
    # BeforeHookCreation clears a prior FAILED run before the next sync
    # recreates it — without it, a single DeadlineExceeded failure leaves the
    # Job behind and wedges every subsequent sync indefinitely (deploy#645).
    # NO HookSucceeded: that policy makes Argo add an
    # `argocd.argoproj.io/hook-finalizer` and defer deletion until after the
    # sync. If the controller restarts or the op is interrupted, the finalizer
    # is never removed, the Job sticks in Terminating, and the sync wedges for
    # hours ("waiting for deletion of hooks") — deploy#673. BeforeHookCreation
    # alone cleans BOTH succeeded and failed prior runs at the next sync with
    # no finalizer; the succeeded Job lingers as a hook, and hooks are excluded
    # from drift detection so there is no OutOfSync (cf. deploy#494).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/resource-policy: keep
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-workloads
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: fga-init
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/kube-api: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gibson-fga-init
      # Secure pod (ADR-0165, charts#394): non-root, the RuntimeDefault seccomp
      # profile, a read-only root filesystem and no capabilities. The scripts
      # write only to /tmp and /model, both emptyDir volumes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        # The authorization model comes OUT OF THE DAEMON IMAGE. The daemon
        # embeds model.fga (//go:embed, internal/platform/authz) and prints it
        # as OpenFGA JSON via `gibson dump-fga-model` (gibson#1544).
        #
        # This replaced a vendored files/fga-model.json regenerated by hand
        # through `make sync-fga-model`. That copy could drift from the model
        # the daemon actually enforces, so it needed a CI gate to compare them,
        # and that gate jammed the deploy queue on every authz change. Seeding
        # from the image makes seeded == enforced by construction: there is no
        # second copy, so there is nothing to drift and nothing to gate.
        #
        # The entrypoint is the gibson binary, so command overrides it to get a
        # shell for the redirect. The runtime image is alpine-based and has one.
        - name: dump-model
          image: "ghcr.io/zeroroot-ai/gibson:v0.154.0@sha256:560d708bc9814dfb272643baa8afe14d1869b98f1833518a2f1c4048dbdccc23"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          imagePullPolicy: Always
          command: ['/bin/sh', '-c']
          args:
            - |
              set -e
              gibson dump-fga-model > /model/model.json
              # A truncated or empty dump would POST an empty model and leave
              # every consumer authorizing against nothing. Fail here instead.
              [ -s /model/model.json ] || { echo "FATAL: dump-fga-model produced an empty model"; exit 1; }
              echo "dumped $(wc -c < /model/model.json) bytes of authorization model"
          volumeMounts:
            - name: model
              mountPath: /model
        - name: wait-for-fga
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ['sh', '-c']
          args:
            - |
              set -e
              # deploy#1382: the listener serves TLS. busybox wget has no
              # --ca-certificate flag, so this READINESS probe (and only
              # the probe) skips verification — every real API call below
              # runs in the main container with curl + CURL_CA_BUNDLE.
              FGA="https://gibson-openfga:8080"
              echo "Waiting for OpenFGA at ${FGA}/healthz ..."
              i=0
              while [ $i -lt 90 ]; do
                if wget --no-check-certificate -qO /dev/null "${FGA}/healthz" 2>/dev/null; then
                  echo "OpenFGA is ready."
                  exit 0
                fi
                i=$((i+1))
                echo "  not ready (${i}/90), retrying in 2s ..."
                sleep 2
              done
              echo "ERROR: OpenFGA did not become ready in 180s"
              exit 1
      containers:
        # Image needs curl AND jq baked in. The alpine:3.21 image ships
        # neither and apk-add fails in any cluster without outbound
        # network to dl-cdn.alpinelinux.org (kind dev, air-gapped prod).
        # alpine/k8s:1.31.0 bakes curl + jq + kubectl and is the same
        # image our sibling Jobs (postgres-setup, sa-identity-map-populator,
        # signup-bot-pat-minter) use; one pull serves every dependent Job.
        # Override via .Values.gibson.config.security.fgaInit.image
        # for air-gapped operators with a different mirror. deploy#322
        # finding 4 (previous mirror image 404ed on first install).
        - name: fga-init
          image: "ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c']
          args:
            - |
              set -e
              # jq + curl are baked into the image; apk-add not needed.
              command -v curl >/dev/null 2>&1 || { echo "FATAL: curl missing from fga-init image"; exit 1; }
              command -v jq   >/dev/null 2>&1 || { echo "FATAL: jq missing from fga-init image";   exit 1; }

              # deploy#1382: https — server TLS from gibson-openfga-http-tls;
              # curl trusts it via CURL_CA_BUNDLE (env below). The k8s API
              # calls pass --cacert explicitly, which outranks the env var.
              FGA="https://gibson-openfga:8080"
              K8S="https://kubernetes.default.svc"
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              NS="gibson"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

              json_val() { echo "$1" | sed -n "s/.*\"$2\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p" | head -1; }

              echo "=== FGA Init: ${FGA} ==="

              echo "--- Step 1: ensure store 'gibson' ---"
              RESP=$(curl -sS "${FGA}/stores") || { echo "FATAL: cannot list stores"; exit 1; }
              STORE_ID=$(echo "$RESP" | jq -r '.stores[] | select(.name=="gibson") | .id' | head -1)

              if [ -z "$STORE_ID" ]; then
                echo "  creating store ..."
                RESP=$(curl -sS -H 'Content-Type: application/json' -d '{"name":"gibson"}' "${FGA}/stores") \
                  || { echo "FATAL: create store failed"; exit 1; }
                STORE_ID=$(echo "$RESP" | jq -r '.id')
              fi

              if [ -z "$STORE_ID" ] || [ "$STORE_ID" = "null" ]; then
                echo "FATAL: could not obtain store ID"; echo "Response: ${RESP}"; exit 1
              fi
              echo "  store_id=${STORE_ID}"

              echo "--- Step 2: write authorization model ---"
              MODEL_JSON=$(cat /model/model.json)
              RESP=$(curl -sS -H 'Content-Type: application/json' --data-binary "$MODEL_JSON" \
                "${FGA}/stores/${STORE_ID}/authorization-models") \
                || { echo "FATAL: write model failed"; echo "$RESP"; exit 1; }
              MODEL_ID=$(echo "$RESP" | jq -r '.authorization_model_id')

              if [ -z "$MODEL_ID" ] || [ "$MODEL_ID" = "null" ]; then
                echo "FATAL: could not parse model ID"; echo "Response: ${RESP}"; exit 1
              fi
              echo "  model_id=${MODEL_ID}"

              # --- Step 2b: publish the model so the platform-operator sees it ---
              # The platform-operator ALSO loads the FGA model, from the
              # ConfigMap named by PlatformBootstrap.spec.fgaModel.modelConfigMapRef
              # (its FGAModelLoaded condition and its own WriteAuthorizationModel
              # call). That ConfigMap used to be chart-shipped from the vendored
              # files/fga-model.json, which made two sources for one model.
              #
              # Publishing the dumped model here removes the second source: the
              # operator and this Job now converge on the same bytes, out of the
              # same daemon image, and neither can drift from what the daemon
              # enforces.
              #
              # Written through the k8s API with curl, the same way Step 3 writes
              # gibson-fga-config, rather than with kubectl: one mechanism per
              # file, and Check 28 bans executed mutating kubectl in chart
              # templates (deploy#925). jq --rawfile does the JSON escaping, so
              # tens of KB of model never passes through shell quoting by hand.
              MODEL_CM="gibson-fga-model"
              echo "--- Step 2b: publish ${MODEL_CM} from the dumped model ---"
              jq -n \
                --arg ns "${NS}" \
                --arg name "${MODEL_CM}" \
                --rawfile model /model/model.json \
                '{apiVersion:"v1",kind:"ConfigMap",
                  metadata:{name:$name,namespace:$ns,
                            labels:{"app.kubernetes.io/managed-by":"gibson-fga-init"}},
                  data:{"model.json":$model}}' > /tmp/model-cm.json

              MCM_GET_HTTP=$(curl -sS -o /tmp/mcm-get.json -w '%{http_code}' \
                --cacert "${CACERT}" \
                -H "Authorization: Bearer ${TOKEN}" \
                "${K8S}/api/v1/namespaces/${NS}/configmaps/${MODEL_CM}")
              if [ "${MCM_GET_HTTP}" = "200" ]; then
                MRV=$(jq -r '.metadata.resourceVersion' /tmp/mcm-get.json)
                jq --arg rv "${MRV}" '.metadata.resourceVersion = $rv' /tmp/model-cm.json > /tmp/model-cm-put.json
                MCM_PUT_HTTP=$(curl -sS -o /tmp/mcm-put.json -w '%{http_code}' \
                  --cacert "${CACERT}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -X PUT --data-binary @/tmp/model-cm-put.json \
                  "${K8S}/api/v1/namespaces/${NS}/configmaps/${MODEL_CM}")
                case "${MCM_PUT_HTTP}" in
                  20*) echo "  replaced ${MODEL_CM}" ;;
                  *) echo "FATAL: PUT ${MODEL_CM} returned ${MCM_PUT_HTTP}"; cat /tmp/mcm-put.json; exit 1 ;;
                esac
              elif [ "${MCM_GET_HTTP}" = "404" ]; then
                MCM_POST_HTTP=$(curl -sS -o /tmp/mcm-post.json -w '%{http_code}' \
                  --cacert "${CACERT}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -X POST --data-binary @/tmp/model-cm.json \
                  "${K8S}/api/v1/namespaces/${NS}/configmaps")
                case "${MCM_POST_HTTP}" in
                  20*) echo "  created ${MODEL_CM}" ;;
                  *) echo "FATAL: POST ${MODEL_CM} returned ${MCM_POST_HTTP}"; cat /tmp/mcm-post.json; exit 1 ;;
                esac
              else
                echo "FATAL: GET ${MODEL_CM} returned ${MCM_GET_HTTP}"
                cat /tmp/mcm-get.json
                exit 1
              fi
              echo "  published ${MODEL_CM} ($(wc -c < /model/model.json) bytes)"

              echo "--- Step 3: write gibson-fga-config ConfigMap ---"
              CM_BODY="{
                \"apiVersion\": \"v1\",
                \"kind\": \"ConfigMap\",
                \"metadata\": {
                  \"name\": \"gibson-fga-config\",
                  \"namespace\": \"${NS}\",
                  \"labels\": { \"app.kubernetes.io/managed-by\": \"gibson-fga-init\" }
                },
                \"data\": {
                  \"store_id\": \"${STORE_ID}\",
                  \"model_id\": \"${MODEL_ID}\"
                }
              }"

              CM_GET_HTTP=$(curl -sS -o /tmp/cm-get.json -w '%{http_code}' \
                --cacert "${CACERT}" \
                -H "Authorization: Bearer ${TOKEN}" \
                "${K8S}/api/v1/namespaces/${NS}/configmaps/gibson-fga-config")
              if [ "${CM_GET_HTTP}" = "200" ]; then
                RV=$(jq -r '.metadata.resourceVersion' /tmp/cm-get.json)
                CM_BODY_REPLACE=$(echo "$CM_BODY" | sed "s|\"namespace\": \"${NS}\"|\"namespace\": \"${NS}\", \"resourceVersion\": \"${RV}\"|")
                CM_PUT_HTTP=$(curl -sS -o /tmp/cm-put.json -w '%{http_code}' \
                  --cacert "${CACERT}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -X PUT --data "$CM_BODY_REPLACE" \
                  "${K8S}/api/v1/namespaces/${NS}/configmaps/gibson-fga-config")
                case "${CM_PUT_HTTP}" in
                  20*) echo "  replaced gibson-fga-config" ;;
                  *) echo "FATAL: PUT gibson-fga-config returned ${CM_PUT_HTTP}"; cat /tmp/cm-put.json; exit 1 ;;
                esac
              elif [ "${CM_GET_HTTP}" = "404" ]; then
                CM_POST_HTTP=$(curl -sS -o /tmp/cm-post.json -w '%{http_code}' \
                  --cacert "${CACERT}" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  -X POST --data "$CM_BODY" \
                  "${K8S}/api/v1/namespaces/${NS}/configmaps")
                case "${CM_POST_HTTP}" in
                  20*) echo "  created gibson-fga-config" ;;
                  *) echo "FATAL: POST gibson-fga-config returned ${CM_POST_HTTP}"; cat /tmp/cm-post.json; exit 1 ;;
                esac
              else
                echo "FATAL: GET gibson-fga-config returned ${CM_GET_HTTP}"
                cat /tmp/cm-get.json
                exit 1
              fi

              # --- Tuple seeding on system_tenant:_system ---
              # Two relations are seeded, each with its own holder list:
              #
              #   platform_operator — REQUIRED (gibson-iam-admin and
              #     gibson-tenant-operator). Only two gRPC services check
              #     this relation: DaemonOperatorService (called by the
              #     operators and the daemon itself, never by the dashboard)
              #     and AdminTenantService (whose admin RPCs the dashboard
              #     always calls with the SIGNED-IN HUMAN's own forwarded
              #     session, never with its own service identity).
              #     gibson-dashboard-service is deliberately NOT in this
              #     list (hosted#191): it is internet-facing, and a
              #     cross-tenant relation it never uses was pure exposure.
              #
              #   signup_service — SIGNUP_SERVICE_SA (gibson-dashboard-service)
              #     and no other caller (D11, gibson#761, charts#485). It
              #     gates UserService.GetSignupProgress and
              #     SetSignupProgress, which run before any tenant exists.
              #     gibson v0.154.0 requires it: without the tuple the
              #     daemon refuses signup progress with PermissionDenied.
              #
              # Each holder is named by its gibson-sa-identity-map key, which
              # is the name of its MACHINE_USER OIDCClient child. The
              # platform-operator writes that map from the children it
              # minted, so the dashboard's service identity is the
              # gibson-dashboard-service entry (its browser-login client
              # gibson-dashboard is an OIDC app, not a subject).
              #
              # Each list is the whole list, not a floor (ADR-0093,
              # hosted#207): prune_relation deletes every other holder, so an
              # upgrade from a chart that seeded more SAs leaves no tuple
              # behind. One delete per request: OpenFGA fails a whole write
              # batch when one key in it is wrong.
              #
              # NOTE: gibson-tool-runner-sa was REMOVED — its MACHINE_USER
              # OIDCClient no longer exists, so it never appears in the
              # sa-identity-map. Listing it here previously wedged the
              # all-or-nothing wait below and silently skipped EVERY tuple.
              REQUIRED='gibson-iam-admin gibson-tenant-operator'
              SIGNUP_SERVICE_SA='gibson-dashboard-service'
              SEEDED=0
              SKIPPED=0
              MISSING=0
              PRUNED=0

              # resolve_sub SA — prints the numeric sub of SA from the
              # sa-identity-map, or nothing when the entry is absent or
              # "<unset>".
              resolve_sub() {
                echo "$MAP_JSON" | jq -r --arg k "$1" '.data[$k] // empty' 2>/dev/null | grep -v '^<unset>$' || true
              }

              # seed_tuple RELATION SA — writes user:<sub> RELATION
              # system_tenant:_system for SA and appends the user to KEEP.
              # An absent SA warns and counts in REL_MISSING; the other
              # holders of the relation are still seeded.
              seed_tuple() {
                relation="$1"
                sa="$2"
                numeric=$(resolve_sub "$sa")
                if [ -z "$numeric" ]; then
                  echo "  WARNING: ${sa} absent from sa-identity-map — ${relation} tuple NOT seeded for it."
                  REL_MISSING=$((REL_MISSING+1))
                  MISSING=$((MISSING+1))
                  return 0
                fi
                KEEP="${KEEP} user:${numeric}"
                TUPLE_BODY=$(jq -cn --arg u "user:${numeric}" --arg r "$relation" '{writes:{tuple_keys:[{user:$u,relation:$r,object:"system_tenant:_system"}]}}')
                TUPLE_HTTP=$(curl -sS -o /tmp/tuple.json -w '%{http_code}' \
                  -H 'Content-Type: application/json' \
                  -X POST --data "$TUPLE_BODY" \
                  "${FGA}/stores/${STORE_ID}/write")
                RESP=$(cat /tmp/tuple.json)
                case "$RESP" in
                  *"already exists"*|*"already existed"*|*cannot_allow_duplicate_tuple*)
                    echo "  ${sa} (user:${numeric}) ${relation} tuple exists (idempotent)"
                    SKIPPED=$((SKIPPED+1))
                    ;;
                  "{}"|"")
                    echo "  seeded ${sa} (user:${numeric}) → ${relation} on system_tenant:_system"
                    SEEDED=$((SEEDED+1))
                    ;;
                  *)
                    echo "  WARNING: ${relation} tuple write failed for ${sa} (HTTP ${TUPLE_HTTP}): ${RESP}"
                    ;;
                esac
              }

              # prune_relation RELATION — deletes every RELATION holder on
              # system_tenant:_system that is not in KEEP. Only when every
              # holder of the relation resolved (REL_MISSING is 0): otherwise
              # KEEP is short and a valid tuple would go.
              prune_relation() {
                relation="$1"
                if [ "$REL_MISSING" -ne 0 ]; then
                  echo "  WARNING: ${REL_MISSING} ${relation} SA(s) unresolved — prune skipped."
                  return 0
                fi
                HOLDERS=""
                CONT=""
                while :; do
                  READ_BODY=$(jq -cn --arg r "$relation" --arg c "$CONT" '{tuple_key:{relation:$r,object:"system_tenant:_system"},page_size:100} + (if $c == "" then {} else {continuation_token:$c} end)')
                  READ_HTTP=$(curl -sS -o /tmp/read.json -w '%{http_code}' \
                    -H 'Content-Type: application/json' \
                    -X POST --data "$READ_BODY" \
                    "${FGA}/stores/${STORE_ID}/read")
                  if [ "$READ_HTTP" != "200" ]; then
                    echo "FATAL: read ${relation} tuples returned ${READ_HTTP}"
                    cat /tmp/read.json
                    exit 1
                  fi
                  HOLDERS="${HOLDERS} $(jq -r '[.tuples[]?.key.user] | join(" ")' /tmp/read.json)"
                  CONT=$(jq -r '.continuation_token // empty' /tmp/read.json)
                  [ -n "$CONT" ] || break
                done
                for holder in $HOLDERS; do
                  case " ${KEEP} " in *" ${holder} "*) continue ;; esac
                  DEL_BODY=$(jq -cn --arg u "$holder" --arg r "$relation" '{deletes:{tuple_keys:[{user:$u,relation:$r,object:"system_tenant:_system"}]}}')
                  DEL_HTTP=$(curl -sS -o /tmp/del.json -w '%{http_code}' \
                    -H 'Content-Type: application/json' \
                    -X POST --data "$DEL_BODY" \
                    "${FGA}/stores/${STORE_ID}/write")
                  if [ "$DEL_HTTP" != "200" ]; then
                    echo "FATAL: delete ${relation} tuple for ${holder} returned ${DEL_HTTP}"
                    cat /tmp/del.json
                    exit 1
                  fi
                  echo "  pruned ${holder} → ${relation} on system_tenant:_system (not a listed SA)"
                  PRUNED=$((PRUNED+1))
                done
              }

              echo "--- Step 4: wait for the sa-identity-map ---"
              # Wait for sa-identity-map population; on Kind it may not be
              # populated synchronously, so allow a bounded soft-fail (60s)
              # rather than the 360s hard-fail of the legacy chart. The
              # daemon serves the unauthenticated / health paths that render
              # the sign-in screen without these tuples.
              MAP_JSON=""
              ALL_SET="false"
              i=0
              while [ $i -lt 30 ]; do
                MAP_JSON=$(curl -sS --cacert "$CACERT" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  "${K8S}/api/v1/namespaces/${NS}/configmaps/gibson-sa-identity-map" 2>/dev/null)
                ALL_SET="true"
                for sa in $REQUIRED $SIGNUP_SERVICE_SA; do
                  if [ -z "$(resolve_sub "$sa")" ]; then
                    ALL_SET="false"
                    break
                  fi
                done
                if [ "$ALL_SET" = "true" ]; then
                  echo "  sa-identity-map fully populated"
                  break
                fi
                i=$((i+1))
                sleep 2
              done

              if [ "$ALL_SET" != "true" ]; then
                # Do NOT skip everything: one missing SA (e.g. a removed
                # MACHINE_USER) must not silently disable every OTHER
                # tuple. The bounded wait above already gave the
                # platform-operator time to populate the map; now seed
                # whatever IS present and warn (not skip) on whatever is not.
                echo "  WARNING: sa-identity-map not fully populated after 60s — seeding present SAs, warning on absent ones."
              fi

              echo "--- Step 5: seed platform_operator tuples ---"
              KEEP=""
              REL_MISSING=0
              for sa in $REQUIRED; do
                seed_tuple platform_operator "$sa"
              done

              echo "--- Step 6: prune platform_operator tuples outside REQUIRED ---"
              prune_relation platform_operator

              echo "--- Step 7: seed the signup_service tuple ---"
              KEEP=""
              REL_MISSING=0
              seed_tuple signup_service "$SIGNUP_SERVICE_SA"

              echo "--- Step 8: prune signup_service tuples outside SIGNUP_SERVICE_SA ---"
              prune_relation signup_service

              echo "=== FGA Init Complete: store=${STORE_ID} model=${MODEL_ID} seeded=${SEEDED} skipped=${SKIPPED} missing=${MISSING} pruned=${PRUNED} ==="
          env:
            # CA for the OpenFGA HTTP-listener cert (deploy#1382); curl
            # reads CURL_CA_BUNDLE for every call that has no --cacert.
            - name: CURL_CA_BUNDLE
              value: /etc/gibson/tls/fga-ca/ca.crt
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model
              mountPath: /model
              readOnly: true
            - name: fga-http-ca
              mountPath: /etc/gibson/tls/fga-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Written by the dump-model init container, read by fga-init. Not a
        # ConfigMap any more: nothing vendored to mount.
        - name: model
          emptyDir: {}
        - name: fga-http-ca
          secret:
            secretName: gibson-openfga-http-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
---
# Source: gibson/charts/gibson-workloads/templates/operations/active-session-backfill/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: gibson-gibson-workloads-active-session-backfill-1aefec50
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: active-session-backfill
  annotations:
    # Modelled on fga-init's annotation set (templates/fga-init/job.yaml), one
    # phase later. Argo runs this during PostSync — AFTER fga-init (a Sync hook)
    # has written gibson-fga-config and the tenant-operator has provisioned
    # members — and re-runs it every sync, so the repair net fires on each
    # deploy. BeforeHookCreation clears both succeeded and failed prior runs at
    # the next sync with NO finalizer wedge (fga-init rationale:
    # deploy#494/#645/#673); NO HookSucceeded, for the same reason.
    #
    # Deliberately NOT a helm.sh/hook: this Job's only network peer is the
    # OpenFGA sibling Argo app, which carries no in-chart NetworkPolicy for a
    # hook to be allow-listed against (scripts/check-hook-jobs-sh.py). Under plain
    # Helm (kind) it is therefore a normal resource that runs once at install —
    # exactly how fga-init behaves off-Argo — and the wait-for-fga-config init
    # container below handles ordering. resource-policy:keep stops uninstall
    # racing the running Job.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/resource-policy: keep
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-workloads
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: active-session-backfill
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/client-postgres: "true"
        gibson.zeroroot.ai/kube-api: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gibson-gibson-workloads-active-session-backfill
      
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-fga-config
          image: ghcr.io/zeroroot-ai/mirror/kubectl:1.31.4@sha256:64614ef8290f3fb27fed5164b338debeeb79a1e5e26c93eb920770b71abd7c48
          command: ['/bin/bash', '-c']
          args:
            - |
              set -eu
              ns="gibson"
              echo "[wait-for-fga-config] waiting for ConfigMap ${ns}/gibson-fga-config (store_id key, timeout: 300s)..."
              for i in $(seq 1 150); do
                val=$(kubectl get configmap -n "${ns}" gibson-fga-config \
                      -o jsonpath='{.data.store_id}' 2>/dev/null || true)
                if [ -n "${val}" ]; then
                  echo "[wait-for-fga-config] ok (store_id=${val})"
                  exit 0
                fi
                echo "[wait-for-fga-config] not ready (attempt ${i}/150), retrying in 2s..."
                sleep 2
              done
              echo "[wait-for-fga-config] ERROR: gibson-fga-config not populated after 300s." \
                   "Check: kubectl logs -n ${ns} -l app.kubernetes.io/component=fga-init" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: active-session-backfill
          image: "ghcr.io/zeroroot-ai/gibson:v0.154.0@sha256:560d708bc9814dfb272643baa8afe14d1869b98f1833518a2f1c4048dbdccc23"
          imagePullPolicy: Always
          # allowlist-bringup-job-idempotency (deploy#928): the command is a
          # single Go binary, not a shell script — there is no multi-step shell
          # to make fail-loud. The binary is itself fail-loud (exit 1 on fatal
          # config/FGA errors) and idempotent by design (already-present tuples
          # → outcome=already_seeded, exits 0), and the Job carries
          # restartPolicy: OnFailure + a bounded backoffLimit below.
          command: ["/usr/local/bin/active-session-backfill"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          env:
            # deploy#1382: explicit https:// — the OpenFGA HTTP listener
            # serves TLS (cert-manager keypair gibson-openfga-http-tls).
            # authz.NewFgaAuthorizer honours the scheme; SSL_CERT_DIR below
            # adds the issuing CA without displacing the system bundle.
            - name: EXT_AUTHZ_FGA_ADDR
              value: "https://gibson-openfga:8080"
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/gibson/tls/fga-ca"
            # store_id / model_id are guaranteed non-empty by the
            # wait-for-fga-config init container above.
            - name: EXT_AUTHZ_FGA_STORE_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: store_id
            - name: EXT_AUTHZ_FGA_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: model_id
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # CA for the OpenFGA HTTP-listener cert (deploy#1382).
            - name: fga-http-ca
              mountPath: /etc/gibson/tls/fga-ca
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: fga-http-ca
          secret:
            secretName: gibson-openfga-http-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
