        app.kubernetes.io/name: reloader
        app.kubernetes.io/component: reloader
        gibson.zeroroot.ai/net-role: system
        gibson.zeroroot.ai/kube-api: "true"
    spec:
      serviceAccountName: reloader
      
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reloader
          image: "ghcr.io/zeroroot-ai/mirror/reloader:v1.4.6@sha256:fa2d03a1b36738e7c7420fd0fbfe601339875a38d24e8a27f5f1883139055c2b"
          imagePullPolicy: IfNotPresent
          env:
            # Scopes every informer to this namespace. Unset, Reloader
            # watches every namespace and needs a ClusterRole to do it.
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            # Reloader's actual namespace-scope flag is `--namespace-selector`
            # (key:value label selector), not `--namespaces`. v1.4.6 rejects
            # `--namespaces=foo` with a parse error → prints --help → exits 0
            # → Deployment CrashLoopBackOff. Same failure mode that prompted
            # the prior `--namespaces-to-ignore=` ripout (deploy#339 / #346).
            #
            # Namespace scope is already enforced via Reloader's Role +
            # RoleBinding above (namespace-scoped RBAC, not cluster-scoped),
            # so the controller can only watch + patch workloads in $ns
            # regardless of args. The CLI flag would be belt-and-suspenders;
            # the RBAC alone is sufficient.
            #
            # Roll strategy: annotations only (explicit opt-in). Workloads
            # opt in via `secret.reloader.stakater.com/reload: "<csv>"`.
            - "--reload-strategy=annotations"
            # Log JSON for parity with the rest of the platform's
            # observability surface.
            - "--log-format=json"
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Source: gibson/charts/gibson-operators/templates/tenant-operator/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibson-tenant-operator
  namespace: gibson
  labels:
    app.kubernetes.io/name: gibson-tenant-operator
    app.kubernetes.io/part-of: gibson
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gibson-tenant-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-tenant-operator
        app.kubernetes.io/part-of: gibson
        app.kubernetes.io/component: tenant-operator
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/client-postgres: "true"
        gibson.zeroroot.ai/client-redis: "true"
        gibson.zeroroot.ai/client-openbao: "true"
        gibson.zeroroot.ai/client-neo4j: "true"
        gibson.zeroroot.ai/kube-api: "true"
        gibson.zeroroot.ai/egress-fqdn: tenant-operator
        gibson.zeroroot.ai/egress-namespaces: "true"
        gibson.zeroroot.ai/ingress-control-plane: "true"
      annotations:
        # Velero fs-backup (defaultVolumesToFsBackup on the shipped Schedule)
        # snapshots every pod volume it is not told to skip. These hold a
        # socket, a scratch dir or an init-rendered file: nothing to keep,
        # and on restore each one becomes a PodVolumeRestore that can only
        # finish once this pod is running. Measured 2026-09-07: 9 of 22
        # PodVolumeRestores in a preserve backup were volumes like these.
        # scripts/check-velero-volume-excludes.sh keeps this list equal to
        # the pod's emptyDir and CSI-ephemeral volumes.
        backup.velero.io/backup-volumes-excludes: "spire-agent-socket"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        secret.reloader.stakater.com/reload: "gibson-tenant-operator-vault"
    spec:
      
      imagePullSecrets:
        - name: ghcr-credentials
      serviceAccountName: gibson-tenant-operator
      priorityClassName: gibson-platform
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gibson-operators
              app.kubernetes.io/instance: gibson
              app.kubernetes.io/component: tenantOperator
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gibson-operators
                    app.kubernetes.io/instance: gibson
                    app.kubernetes.io/component: tenantOperator
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # one-code-path #201 + #202 + #203: init containers block pod start
      # until (a) the SPIRE agent socket is reachable (- the
      # operator dials daemon over SPIFFE mTLS and mints JWT-SVIDs to call
      # the dashboard admin API; both fail closed without an agent), and
      # (b) ESO has materialised every required Secret. The operator's
      # release-namespace RBAC already grants `secrets: get,list`, so no
      # additional RBAC is needed for the ESO polls.
      #
      # Each ESO wait runs up to 5 minutes; fails fast with a structured
      # log line if the Secret isn't observable so a missing prerequisite
      # surfaces as `kubectl describe pod`, not a silent boot.
      initContainers:
        - name: wait-for-spire-socket
          image: ghcr.io/zeroroot-ai/mirror/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c']
          args:
            - |
              # deploy#201: SPIRE is required infrastructure. Fail-fast (60s) if the
              # Workload API socket is not present on this node — a missing socket
              # means the SPIRE agent DaemonSet is unhealthy and SPIFFE-consuming
              # workloads MUST NOT proceed (their mTLS / JWT-SVID minting would
              # silently hang otherwise).
              SOCK="/run/spire/agent/spire-agent.sock"
              DEADLINE=$(( $(date +%s) + 60 ))
              echo "[wait-for-spire-socket] waiting for ${SOCK} (timeout: 60s)..."
              until [ -S "${SOCK}" ]; do
                if [ $(date +%s) -ge ${DEADLINE} ]; then
                  echo "[wait-for-spire-socket] ERROR: ${SOCK} not present after 60s; SPIRE agent DaemonSet is not healthy on this node. Fix the SPIRE control plane before this pod can start." >&2
                  exit 1
                fi
                sleep 1
              done
              echo "[wait-for-spire-socket] ok"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent
              readOnly: true
        - name: wait-for-fga-config
          image: ghcr.io/zeroroot-ai/mirror/kubectl:1.31.4@sha256:64614ef8290f3fb27fed5164b338debeeb79a1e5e26c93eb920770b71abd7c48
          command: ['/bin/bash', '-c']
          args:
            - |
              set -eu
              ns="gibson"
              echo "[wait-for-fga-config] waiting for ConfigMap ${ns}/gibson-fga-config (store_id key, timeout: 300s)..."
              for i in $(seq 1 150); do
                val=$(kubectl get configmap -n "${ns}" gibson-fga-config \
                      -o jsonpath='{.data.store_id}' 2>/dev/null || true)
                if [ -n "${val}" ]; then
                  echo "[wait-for-fga-config] ok (store_id=${val})"
                  exit 0
                fi
                echo "[wait-for-fga-config] not ready (attempt ${i}/150), retrying in 2s..."
                sleep 2
              done
              echo "[wait-for-fga-config] ERROR: gibson-fga-config not populated after 300s." \
                   "Check: kubectl logs -n ${ns} -l app.kubernetes.io/component=fga-init" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-redis-secret
          image: ghcr.io/zeroroot-ai/mirror/kubectl:1.31.4@sha256:64614ef8290f3fb27fed5164b338debeeb79a1e5e26c93eb920770b71abd7c48
          command: ['/bin/bash', '-c']
          args:
            - |
              set -eu
              name="gibson-redis-stack"
              key="redis-password"
              ns="gibson"
              echo "[wait-for-redis-secret] waiting for Secret ${ns}/${name} key=${key}..."
              for i in $(seq 1 30); do
                if kubectl get secret -n "${ns}" "${name}" \
                    -o jsonpath="{.data.${key}}" 2>/dev/null \
                    | base64 -d 2>/dev/null | grep -q .; then
                  echo "[wait-for-redis-secret] ok"
                  exit 0
                fi
                sleep 2
              done
              echo "[wait-for-redis-secret] timed out after 60s -- the chart-managed Redis password Secret (or ESO ExternalSecret) is not present. Check: kubectl get externalsecret,secret -n ${ns}" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: manager
          image: "ghcr.io/zeroroot-ai/tenant-operator:v0.154.0@sha256:4c56cea8cd6d1c3be746d15f406a85ed11ea97f2961ec98962de8f80ece4943e"
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --leader-election-namespace=gibson
            - --leader-election-id=gibson-tenant-operator
            - --lease-duration=15s
            - --renew-deadline=10s
            - --retry-period=2s
            - --metrics-bind-address=:8080
            - --metrics-secure=false
            - --health-probe-bind-address=:8081
            # --dev-mode flag deleted in deploy#205 (one-code-path epic):
            # the operator binary boots identically in every environment.
            # --plans-file removed: the consolidated monorepo operator
            # (operators/tenant) generates its valid-tier set from
            # plans.yaml at BUILD time (validTiers constant / generated enum),
            # so the binary no longer defines a -plans-file flag. The chart was
            # still passing it, so every operator pod exited 2 ("flag provided
            # but not defined: -plans-file") and stalled the daemon's prereq
            # wait. Tiers are baked in; no runtime plans file is read.
            - --webhook-cert-path=/var/run/webhook-serving-certs
            - --webhook-cert-name=tls.crt
            - --webhook-cert-key=tls.key
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: probes
              protocol: TCP
            - containerPort: 9443
              name: webhook
              protocol: TCP
          # Both probes declare timeoutSeconds. The default is 1, and on a
          # loaded 2-core runner controller-runtime's own handler has missed it
          # (charts#306, the OpenBao case in auth/openbao-deployment.yaml).
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Operator ServiceAccount identity — used by tenant_namespace.go
            # when constructing per-tenant Secret RoleBindings so the
            # operator-side reconciler can read+patch tenant Secrets.
            #
            # The operator's hardcoded defaults (tenant-operator /
            # gibson-platform) DO NOT match the chart's actual SA
            # (gibson-tenant-operator in tenantOperator.namespace), so
            # these env vars MUST be set. Without them every per-tenant
            # RoleBinding references a non-existent SA and the operator
            # gets 403 on tenant Secret reads.
            - name: OPERATOR_SERVICE_ACCOUNT_NAME
              value: "gibson-tenant-operator"
            - name: OPERATOR_SERVICE_ACCOUNT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The connector operator's ServiceAccount, the subject of the
            # per-tenant RoleBinding to ClusterRole gibson-connector-creds
            # (gibson#664). It is the name the connector-operator Deployment
            # runs as; scripts/check-connector-creds-binding.py fails the render
            # when the two disagree, because a wrong name is a 403 on every
            # connector credential write.
            - name: CONNECTOR_OPERATOR_SERVICE_ACCOUNT_NAME
              value: "gibson-connector-operator"
            # The namespace of the gibson-velero release (ADR-0075, charts#424).
            # A tenant delete first takes a last Velero Backup there, and the
            # operator exits at start when this is empty. gibson-velero renders
            # the Role that lets this ServiceAccount get and create Backups in
            # that namespace (templates/tenant-operator-rbac.yaml).
            - name: VELERO_NAMESPACE
              value: "velero"
            # GIBSON_APP_URL — the PRODUCT-surface origin (app.<domain>) the
            # tenant-operator reads to build the two human-facing links it
            # emails: the tenant-member invitation accept-link and the new
            # tenant's welcome-email link. Same pattern as the daemon's
            # GIBSON_APP_URL (gibson-workloads/templates/gibson/
            # statefulset.yaml): an explicit override, defaulting to the
            # product-surface origin via gibson.externalOrigin, so a link a
            # human's browser must open never resolves to nothing.
            #
            # Replaces the former DASHBOARD_URL var, an in-cluster Service
            # address (http://gibson-dashboard:3000) that the same two links
            # were wrongly built from: a human's browser cannot reach it.
            - name: GIBSON_APP_URL
              value: "https://app.localhost.zeroroot.ai"
            # Phase 5.1 of spec tenant-provisioning-unification-phase2: the
            # operator calls the daemon's PlatformOperatorService over
            # Connect-RPC at this address.
            - name: GIBSON_DAEMON_GRPC_ADDRESS
              # gibson-common library helper (deploy#179): single source
              # of truth for the daemon dialing address. The default
              # (gibson-workloads:50051) was fixed in tenant-operator#70.
              value: "gibson-gibson-workloads:50051"
            # the operator dials the daemon over SPIFFE mTLS and
            # authorises the daemon's SVID at the TLS handshake. The ID is the
            # trust domain of the install (global.spire.trustDomain) and the
            # fixed path platform/daemon.
            - name: GIBSON_DAEMON_SPIFFE_ID
              value: "spiffe://zeroroot.ai/platform/daemon"
            # Per-tenant plugins (gibson#815). The operator deploys one
            # instance of a catalog plugin for each tenant that enables it, in
            # the namespace tenant-<t>-plugins, and writes its ClusterSPIFFEID
            # spiffe://<td>/plugin/<vendor>/<tenant>. The operator exits when
            # one of the four required values is empty.
            #   PLUGIN_SPIRE_CLASS_NAME     the className of the SPIRE
            #                               controller-manager, or SPIRE
            #                               ignores the ClusterSPIFFEID.
            #   PLUGIN_TRUST_DOMAIN         the trust domain of the install.
            #   PLUGIN_GIBSON_URL           the edge origin; the plugin dials
            #                               the daemon only through Envoy.
            #   PLUGIN_WAIT_FOR_SPIRE_IMAGE the image of the init container
            #                               that waits for the SPIRE socket.
            #   PLUGIN_ENVOY_CA_FILE        the edge CA that the operator
            #                               copies into each plugin namespace.
            #                               Empty when the operator mounts no
            #                               edge CA: the edge has a public cert.
            - name: PLUGIN_SPIRE_CLASS_NAME
              value: "gibson-gibson"
            - name: PLUGIN_TRUST_DOMAIN
              value: "zeroroot.ai"
            - name: PLUGIN_GIBSON_URL
              value: "https://api.localhost.zeroroot.ai"
            - name: PLUGIN_WAIT_FOR_SPIRE_IMAGE
              value: "ghcr.io/zeroroot-ai/mirror/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
            - name: PLUGIN_ENVOY_CA_FILE
              value: "/etc/ssl/envoy-ca/envoy-ca.crt"
            # First-tenant seed (gibson#1496): on a self-hosted install with no
            # signup, the operator enqueues the first tenant over its SPIFFE
            # identity via EnqueueTenantProvisioning — the session-less path,
            # because the interactive AdminProvisionTenant RPC is gated by a
            # session-revocation check no headless caller satisfies. Identity is
            # global.firstTenant so the first-admin Job (gibson-workloads) that
            # creates the owner reads the SAME tenant id. Disabled (unset) on
            # SaaS, where signup creates the first tenant.
            - name: FIRST_TENANT_ENABLED
              value: "true"
            - name: FIRST_TENANT_ID
              value: "primary"
            - name: FIRST_TENANT_DISPLAY_NAME
              value: "Primary Workspace"
            - name: FIRST_TENANT_OWNER_EMAIL
              value: "admin@localhost.zeroroot.ai"
            # The operator has always read FIRST_TENANT_TIER; the chart never
            # rendered it, so every seed enqueued an empty tier and the daemon
            # defaulted it to a PAID plan. On a cluster that enforces billing
            # the daemon then withheld the tenant from the provisioning drain
            # for ever, and the first-admin Job waited on a tenant that could
            # never arrive. See global.firstTenant.tier in values.yaml.
            - name: FIRST_TENANT_TIER
              value: "enterprise-deploy"
            # One-code-path slice deploy#195: FGA is a hard dependency.
            # FGA_URL must be set in the chart values; render fails loud when empty.
            # FGA_STORE_ID / FGA_MODEL_ID are mounted from gibson-fga-config.
            # We keep `optional: true` here so the operator pod can schedule
            # BEFORE the gibson-fga-init Job has populated the ConfigMap —
            # without it, the kubelet refuses to start the pod and we get
            # FailedMount instead of an actionable CrashLoopBackOff. With it,
            # FGA_STORE_ID is briefly empty and the operator's main.go exits 1
            # with a clear "FGA env not configured" message; the kubelet
            # retries until the Job has seeded the ConfigMap.
            - name: FGA_URL
              value: "https://gibson-openfga:8080"
            # deploy#190 M4: `optional: true` removed. The wait-for-fga-config
            # init container (above) blocks until gibson-fga-config exists with
            # a non-empty store_id, so kubelet resolves these env vars against
            # the populated ConfigMap at manager container start time.
            - name: FGA_STORE_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: store_id
            - name: FGA_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: model_id
            - name: REDIS_ADDR
              value: "gibson-redis-stack:6379"
            # one-code-path #203: REDIS_PASSWORD was `optional: true`. The
            # wait-for-redis-secret init container above blocks pod start
            # until kubelet observes the Secret.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibson-redis-stack
                  key: redis-password
            # NEO4J_URI / NEO4J_USER / NEO4J_PASSWORD intentionally omitted.
            # The shared Neo4j cluster is gone (spec graphrag-tenant-scope).
            # The operator provisions per-tenant Neo4j StatefulSets from its
            # Go-built resources (the tenant-neo4j-template ConfigMap read
            # falls back to NotFound until Task 22 renders it — deploy#1437);
            # per-tenant credentials are written to the per-tenant Vault
            # namespace at provisioning time (see internal/dataplane/neo4j.go).
            # SPIFFE workload API — the operator authenticates to the dashboard
            # admin API by minting short-lived JWT-SVIDs per request. No shared
            # secret, no long-lived key.
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/spire/sockets/api.sock"
            - name: ORPHAN_REAPER_ENABLED
              value: "true"
            - name: ORPHAN_REAPER_GRACE_SECONDS
              value: "300"
            - name: SMTP_HOST
              value: "gibson-mailpit"
            - name: SMTP_PORT
              value: "1025"
            - name: SMTP_USERNAME
              value: "" 
            - name: SMTP_PASSWORD
              value: "" 
            - name: SMTP_TLS_MODE
              value: "plaintext"
            - name: SMTP_FROM
              value: "no-reply@localhost.zeroroot.ai"
            # Zitadel Management API — the EnsureZitadelOrg + TenantMember
            # saga steps call this as the operator's own machine user
            # (gibson-tenant-operator, client credentials). It holds only
            # the Zitadel roles its OIDCClient declares; it never reads the
            # owner credentials (hosted#192).
            # Zitadel addressing (ADR-0092, gibson#222): the operator connects
            # to the Zitadel Service (ZITADEL_URL) and claims the public host
            # in the x-zitadel-instance-host header (ZITADEL_EXTERNAL_DOMAIN,
            # a bare host with no port). Both come from the one helper. The
            # operator no longer reads ZITADEL_ISSUER, so the pod needs no
            # hostAliases.
            - name: ZITADEL_URL
              value: "http://gibson-zitadel.gibson.svc.cluster.local:8080"
            - name: ZITADEL_EXTERNAL_DOMAIN
              value: "app.localhost.zeroroot.ai"
            # OAuth2 client_credentials of the operator's own machine user
            # (the gibson-tenant-operator OIDCClient). The operator uses them
            # for the daemon's admin endpoints and for the Zitadel API. It
            # never mounts the Zitadel owner PAT.
            # Secret is materialized by templates/auth/zitadel-service-accounts-secret.yaml
            # and populated with real Zitadel-minted creds by the
            # post-install bootstrap Job (replacing REPLACE_ME_* placeholders).
            - name: ZITADEL_TENANT_OPERATOR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gibson-zitadel-tenant-operator
                  key: ZITADEL_CLIENT_ID
            - name: ZITADEL_TENANT_OPERATOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gibson-zitadel-tenant-operator
                  key: ZITADEL_CLIENT_SECRET
            # SSL_CERT_DIR is colon-separated; Go skips missing dirs and
            # /etc/ssl/certs keeps the system bundle. envoy-ca trusts the
            # Envoy edge cert (deploy#200); fga-ca trusts the OpenFGA
            # HTTP-listener cert (deploy#1382) — FGA_URL is https now and
            # the component-cert issuer is a private CA in every profile,
            # so the env is unconditional.
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/ssl/envoy-ca:/etc/ssl/fga-ca"
            # ADR-0093 decision 2: the gibson project each tenant org is
            # granted and whose four tenant roles the role sync reads. The
            # operator refuses to start without it. The platform-operator
            # writes project_id into this machine user's Secret.
            - name: ZITADEL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: gibson-zitadel-tenant-operator
                  key: project_id
            # ---------------------------------------------------------------
            # Data-plane provisioning env vars. Operator's cmd/main.go reads
            # these to construct the per-store admin clients used by the
            # ProvisionPostgres / ProvisionNeo4j / ProvisionRedis /
            # KEKInit saga steps. Without these env vars set, the operator
            # boots in degraded mode and silently no-ops the entire data
            # plane while logging "step success" — that bug is what spec
            # tenant-provisioning-unification fixes.
            #
            # The password component of DATAPLANE_PG_ADMIN_DSN is injected
            # via $(TENANT_POSTGRES_ADMIN_PASSWORD) Pod env-var substitution;
            # the env var must be defined before the DSN entry below for the
            # substitution to resolve at Pod startup.
            # ---------------------------------------------------------------
            # Spec helm-eks-readiness-and-pg-split Phase 3 — data-plane
            # admin pool now points at the consolidated platformPostgres
            # tier. Same physical instance hosts gibson_platform AND the
            # per-tenant DBs the daemon CREATEDBs as siblings.
            # deploy#159: the tenant-operator must use the `tenant_admin`
            # role (CREATEDB-privileged) for per-tenant database
            # provisioning. The previous wiring used `gibson_platform`,
            # which lacks CREATEDB — every Tenant CR's saga step
            # "ProvisionDataPlane.Postgres" permanently failed with
            # SQLSTATE 42501. The dedicated `gibson.tenantPostgres.*`
            # helpers route to the tenant_admin role's credentials and
            # fail-render if anyone re-introduces `gibson_platform` here.
            - name: TENANT_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-admin-postgres-credentials
                  key: password
            - name: DATAPLANE_PG_ADMIN_DSN
              value: "postgres://tenant_admin:$(TENANT_POSTGRES_ADMIN_PASSWORD)@platform-postgres-rw.gibson.svc.cluster.local:5432/postgres?sslmode=disable"
            - name: DATAPLANE_REDIS_ADDR
              value: "gibson-redis-stack:6379"
            # one-code-path #203: DATAPLANE_REDIS_PASSWORD was `optional: true`.
            # Same Secret as REDIS_PASSWORD above; the wait-for-redis-secret
            # init container guards both env entries.
            - name: DATAPLANE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibson-redis-stack
                  key: redis-password
            # Vault admin + transit wiring — Spec
            # tenant-operator-saga-capabilities Requirements 2.2 + 2.3.
            #
            # Vault is non-negotiable (one-code-path: deploy#197). The
            # `.enabled` gate was deleted: the operator exits 1 at
            # startup when GIBSON_VAULT_ADDR / GIBSON_VAULT_ADMIN_TOKEN
            # are missing, so the chart MUST emit them.
            # `dataPlane.vault.addr` is required at chart render and the
            # admin token Secret must exist before the operator pod
            # starts.
            #
            # GIBSON_VAULT_ADDR points at the Vault Service — in-chart in
            # kind (set via values-kind.yaml) or an external Vault in
            # prod (set per-environment overlay).
            # GIBSON_VAULT_AUTH_TOKEN (transit KEK derivation) and
            # GIBSON_VAULT_ADMIN_TOKEN (tenant namespaces) are the operator's
            # own periodic OpenBao token, policy `tenant-operator`. The
            # openbao-auto-init sidecar mints it into
            # gibson-tenant-operator-vault and keeps it renewed
            # (gibson-workloads templates/auth/openbao-deployment.yaml). The
            # policy reaches tenant-<id> namespaces, sys/namespaces/tenant-*,
            # transit/hmac and the root jwt mount's config, and nothing in
            # the root kv store, where the escrowed Zitadel owner
            # credentials live. The platform-operator token stays with the
            # platform-operator.
            # GIBSON_VAULT_TRANSIT_KEY names the transit key the
            # operator uses for HMAC-SHA256 KEK derivation.
            - name: GIBSON_VAULT_ADDR
              value: "http://gibson-openbao.gibson.svc:8200"
            - name: GIBSON_VAULT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gibson-tenant-operator-vault
                  key: VAULT_ADMIN_TOKEN
            - name: GIBSON_VAULT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gibson-tenant-operator-vault
                  key: VAULT_ADMIN_TOKEN
            - name: GIBSON_VAULT_TRANSIT_KEY
              value: "master-kek"
            # ---------------------------------------------------------------
            # WriteTenantBrokerConfig saga step (tenant-operator#45 →
            # one-code-path deploy#194). The 11th provisioning step writes
            # a row to the platform tenant_secrets_broker_config table so
            # the gibson daemon's secrets broker can route per-tenant
            # credential lookups. The step is non-negotiable — without the
            # row, every authenticated daemon call returns FailedPrecondition
            # (412) and every dashboard panel renders "Failed to load".
            #
            #   PLATFORM_PG_DSN                  — connection string to the
            #     operator-shared (dashboard) Postgres database. Same
            #     instance as DATAPLANE_PG_ADMIN_DSN above; the database
            #     name differs (gibson_platform vs the per-tenant DBs).
            #
            #   GIBSON_SYSTEM_TENANT_KEK_PATH    — file path to the system-
            #     tenant KEK Secret (mounted below). MUST match the daemon's
            #     KEK exactly so the row the operator encrypts can be
            #     decrypted by the daemon. Sourced from the same Secret the
            #     daemon's key_provider points at (default: gibson-master-key,
            #     shared across the operators + workloads charts in the
            #     gibson namespace). File-mount delivery (not env injection)
            #     because raw 32-byte values crash env-var injection with
            #     nul bytes.
            #
            #   GIBSON_VAULT_NAMESPACE_TEMPLATE / GIBSON_VAULT_AUTH_METHOD /
            #   GIBSON_VAULT_MOUNT_PATH          — vault-broker config fields
            #     the operator writes per tenant. The operator already gets
            #     GIBSON_VAULT_ADDR + GIBSON_VAULT_TRANSIT_KEY from the
            #     dataPlane.vault block above and reuses them here.
            # WriteTenantBrokerConfig step (one-code-path: deploy#194).
            # Always emitted — broker config row is required for the
            # daemon to resolve per-tenant credentials. Missing
            # platformPg.host or KEK Secret fails chart render.
            - name: PLATFORM_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "gibson-platform-postgres-credentials"
                  key: "password"
            - name: PLATFORM_PG_DSN
              value: "postgres://gibson_platform:$(PLATFORM_PG_PASSWORD)@platform-postgres-rw.gibson.svc.cluster.local:5432/gibson_platform?sslmode=require"
            # System-tenant KEK delivered ONLY as a file mount. The legacy
            # env-injection path was removed in deploy#194 because raw
            # 32-byte KEKs commonly contain nul bytes which crash env-var
            # injection ("value contains nul byte"). File mount is
            # symmetric with the daemon's k8s key_provider.
            - name: GIBSON_SYSTEM_TENANT_KEK_PATH
              value: "/etc/gibson/master-key/master-key"
            - name: GIBSON_VAULT_NAMESPACE_TEMPLATE
              value: "tenant-{tenant_id}"
            - name: GIBSON_VAULT_AUTH_METHOD
              value: "jwt"
            - name: GIBSON_VAULT_MOUNT_PATH
              value: "secret"
            # SPIRE→Vault audience contract (gibson#167 / deploy#360).
            # tenant-operator#148 writes this value into every per-tenant
            # Vault role's bound_audiences. The daemon's broker init
            # requests a SPIRE JWT-SVID with the SAME audience (env
            # GIBSON_DAEMON_VAULT_JWT_AUDIENCE on the gibson
            # statefulset) — Vault rejects the login otherwise, and
            # signed-up tenants see 412/500 on data-bearing endpoints.
            # vault.jwtAuth.audience in gibson-workloads values is the
            # single source of truth; this template reads through to it
            # via the parent release's values (operators chart consumes
            # workloads values when installed together). REQUIRED —
            # chart fails render LOUDLY when empty.
            - name: GIBSON_VAULT_JWT_BOUND_AUDIENCE
              value: "gibson-saas"
            # ConfigureSecretsJWTAuth saga step (tenant-operator#189).
            # Writes the per-tenant `auth/jwt/config` document inside
            # each tenant's Vault namespace, mirroring the root
            # namespace's config set by the chart's openbao-jwt-auth-init
            # Job (gibson-workloads). Without this step, the daemon's
            # per-tenant auth/jwt/login returns 400 "could not load
            # configuration" and the dashboard 412s on every API call.
            #
            # GIBSON_VAULT_JWT_BOUND_ISSUER is REQUIRED — the operator
            # refuses to write a degraded config and fails the saga
            # loudly per feedback_no_skippable_steps_for_required_artifacts.
            - name: GIBSON_VAULT_JWT_BOUND_ISSUER
              value: "https://gibson-spiffe-oidc-discovery-provider"
            - name: GIBSON_VAULT_JWKS_URL
              value: "https://gibson-spiffe-oidc-discovery-provider.gibson.svc.cluster.local/keys"
            # spire-bundle ConfigMap (published by SPIRE Server's
            # k8s_configmap BundlePublisher) is mounted at
            # /etc/spire-bundle below. The operator reads bundle.spiffe
            # at saga time and converts JWKS x5c → PEM for Vault's
            # jwks_ca_pem field.
            - name: GIBSON_VAULT_JWKS_CA_PEM_PATH
              value: "/etc/spire-bundle/bundle.spiffe"
          volumeMounts:
            # plans mount removed alongside the --plans-file arg above: the
            # monorepo operator bakes tiers in at build time.
            # System-tenant KEK mount (one-code-path: deploy#194 —
            # file mount only; legacy env injection removed).
            - name: system-tenant-kek
              mountPath: /etc/gibson/master-key
              readOnly: true
            # SPIRE is structural infrastructure per deploy#201 — the
            # .Values.spire.enabled toggle was removed (values now uses
            # `spire: {}`) but this gate was left behind, causing
            # `spec.template.spec.initContainers[0].volumeMounts[0].name:
            # Not found: "spire-agent-socket"` on every Argo sync because
            # the gibson.waitForSpireSocket helper unconditionally
            # references the mount. D1-H of polyrepo zero-dot-x reset
            # (deploy#267).
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # spire-bundle ConfigMap — read by the ConfigureSecretsJWTAuth
            # saga step (tenant-operator#189) to derive jwks_ca_pem for
            # every per-tenant auth/jwt/config write. Same ConfigMap the
            # gibson-workloads openbao-jwt-auth-init Job reads for the
            # root namespace. Read-only.
            - name: spire-bundle
              mountPath: /etc/spire-bundle
              readOnly: true
            - name: webhook-serving-certs
              mountPath: /var/run/webhook-serving-certs
              readOnly: true
            # CA for the OpenFGA HTTP-listener cert (deploy#1382).
            - name: fga-http-ca
              mountPath: /etc/ssl/fga-ca
              readOnly: true
            - name: envoy-ca
              mountPath: /etc/ssl/envoy-ca
              readOnly: true
      volumes:
        # Only ca.crt is projected — the operator must never hold the
        # OpenFGA listener's private key (deploy#1382).
        - name: fga-http-ca
          secret:
            secretName: gibson-openfga-http-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
        # plans ConfigMap volume removed: the operator binary no longer reads a
        # runtime plans file (tiers generated at build time). The
        # gibson-tenant-operator-plans ConfigMap is still rendered for the plans
        # migration Job; orphan-audit tracked separately.
        # System-tenant KEK Secret as a file mount (one-code-path:
        # deploy#194). Always present; same Secret the daemon's k8s
        # key_provider reads via the Kubernetes API. Raw 32-byte
        # contents are safe via file (env-injection was the broken path).
        - name: system-tenant-kek
          secret:
            secretName: "gibson-master-key"
            defaultMode: 0400
            # optional (deploy#971 / gibson#1000-family): gibson-master-key is
            # produced by PlatformBootstrap later in the bringup, so this mount
            # must tolerate the Secret being absent at pod start — otherwise the
            # FailedMount blocks the pod (Init 0/3), gibson-operators never goes
            # Healthy, and Argo never reaches the wave that runs PlatformBootstrap
            # (deadlock). The operator reads the KEK lazily at reconcile time and
            # requeues until the kubelet projects the file (the WriteTenantBroker-
            # Config step), so no restart is needed once the Secret appears.
            optional: true
        - name: envoy-ca
          secret:
            # Trust anchor = the self-signed ROOT CA (gitops wave -12), NOT the
            # Envoy leaf secret (gibson-envoy-tls, wave 10) — see deploy#971 and
            # envoy.tls.caSecretName in values.yaml. Project ONLY the cert
            # (tls.crt IS the CA cert for a self-signed CA), never the CA key.
            secretName: "gibson-selfsigned-ca"
            items:
              - key: tls.crt
                path: envoy-ca.crt
            defaultMode: 0444
        # SPIRE Workload API socket via csi.spiffe.io CSI driver — see spec
        # kind-dashboard-bringup-e2e (D2). SPIRE is structural
        # infrastructure per deploy#201; the .Values.spire.enabled gate
        # was removed (values now uses `spire: {}`) but this volume's
        # gate was left behind, causing every Argo sync to fail with
        # `spec.template.spec.initContainers[*].volumeMounts[*].name:
        # Not found: "spire-agent-socket"`. D1-H (deploy#267).
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # spire-bundle ConfigMap — JWKS form (k8s_configmap BundlePublisher
        # output). The ConfigureSecretsJWTAuth saga step reads this at
        # saga time and converts x509-svid x5c entries to PEM for Vault's
        # auth/jwt/config.jwks_ca_pem. tenant-operator#189.
        - name: spire-bundle
          configMap:
            name: "spire-bundle"
            defaultMode: 0o444
        - name: webhook-serving-certs
          secret:
            secretName: gibson-tenant-operator-webhook-certs
            defaultMode: 0440
      terminationGracePeriodSeconds: 30
---
