# Source: gibson/charts/gibson-workloads/templates/databases/redis-stack.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gibson-redis-stack-config
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: redis
data:
  redis-stack.conf: |
    # Redis Stack Configuration
    bind 0.0.0.0
    port 6379

    # Authentication via ACL file (deploy#518). The init-acl init container
    # writes /etc/redis-acl/users.acl at pod start from the current Secret.
    # During password rotation the rotation CronJob (deploy#517) temporarily
    # adds the previous password to the in-memory ACL so existing clients keep
    # authenticating while they are being rolled.
    aclfile /etc/redis-acl/users.acl

    # Data directory
    dir /data

    # Persistence
    appendonly yes
    appendfsync everysec
    appenddirname appendonlydir

    # Memory management
    maxmemory-policy noeviction

    # Modules are loaded automatically by redis-stack image
