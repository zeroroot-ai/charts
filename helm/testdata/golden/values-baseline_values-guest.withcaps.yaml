                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: api_discovery
                                      - masked_remote_address:
                                          v4_prefix_mask_len: 32
                                          v6_prefix_mask_len: 64
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                                # Pre-auth discovery bucket (deploy#1189). This route carries
                                # neither jwt_authn nor ext_authz, so this is the only
                                # thing standing between the internet and the daemon's
                                # :8085 pre-auth listener. Its own bucket instance —
                                # identical numbers, one per route — so a flood on one
                                # discovery path cannot starve the others.
