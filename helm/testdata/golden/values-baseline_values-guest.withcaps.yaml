# Source: gibson/templates/postgres/platform-postgres-cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-postgres-scheduled
  namespace: gibson
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
    # deploy#1761. This kind is applied AFTER gibson-webhook-gate has proved
    # the webhook that admits it answers. Helm sorts manifest kinds it does not
    # know alphabetically, so this one lands after the webhook configurations
    # and is refused on a fresh install unless it is ordered behind the gate.
    # Both axes: hook weight for a plain `helm install`, which has no barrier
    # inside its main phase, and sync-wave for Argo, which orders hooks and
    # ordinary resources together. scripts/check-webhooks.py computes
    # which kinds need this from Helm's own install order and fails the build
    # on one that is missing it, or one that carries it without needing it.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "20"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    #
    # It used to sync at wave -7 with the Cluster it points at. That is too
    # early: `mscheduledbackup.cnpg.io` is failurePolicy: Fail, and on a fresh
    # install the CNPG operator is still starting when wave -7 applies, so the
    # write was refused (deploy#1761, four errors on one `make vanilla-fresh`).
    # The Cluster itself stays at -7 because `Cluster` sorts BEFORE
    # `MutatingWebhookConfiguration` in Helm's install order, so it lands while
    # no CNPG webhook exists and is never refused.
    #
    # On a plain `helm upgrade` Helm deletes and recreates a hook resource.
    # With backupOwnerReference: self that discards this schedule's Backup CRs
    # and takes one fresh base backup. Neither is a loss: the backups
    # themselves live in the durable bucket, which outlives the cluster
    #, and a teardown discards those CRs anyway. Under Argo the
    # Sync hook above is applied, not recreated, so nothing is discarded there.
spec:
  # SIX fields — CNPG's cron parser takes a leading seconds field, unlike a
  # Kubernetes CronJob. A five-field expression is rejected by the webhook.
  schedule: "0 30 2 * * *"
  # Take one immediately, so a fresh install is restorable now rather than
  # after the first tick. NO `| default true` here (deploy#1220): sprig treats
  # `false` as empty, so a truthy fallback would swallow an explicit
  # `immediate: false` and the knob could never be turned off. values.yaml
  # always supplies it, and Helm's values merge keeps it supplied.
  immediate: true
  backupOwnerReference: "self"
  target: "prefer-standby"
  cluster:
    name: platform-postgres
