    - name: "gibson-tenant-operator"
      applicationType: "MACHINE_USER"
      roles:
        - "IAM_ORG_MANAGER"
      secretRef:
        name: "gibson-zitadel-tenant-operator"
        key: "ZITADEL_CLIENT_SECRET"
    - name: "gibson-dashboard"
      roles: []
      redirectURIs:
        - "https://app.localhost.zeroroot.ai/api/auth/callback/zitadel"
      postLogoutRedirectURIs:
        - "https://app.localhost.zeroroot.ai"
      secretRef:
        name: "gibson-dashboard-oidc"
        key: "client_secret"
    - name: "gibson-dashboard-service"
      applicationType: "MACHINE_USER"
      roles: []
      secretRef:
        name: "gibson-zitadel-dashboard"
        key: "ZITADEL_CLIENT_SECRET"
    - name: "gibson-native-login"
      displayName: "Gibson CLI"
      applicationType: "NATIVE"
