# Source: gibson/charts/gibson-operators/templates/tenant-operator/cluster-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gibson-tenant-operator
  labels:
    app.kubernetes.io/name: gibson-tenant-operator
    app.kubernetes.io/part-of: gibson
rules:
  # Tenant CRDs are cluster-scoped — must stay cluster-wide. The four
  # tenant child CRDs (TenantDataPlane / TenantSecretsBackend /
  # TenantIdentity / TenantGrants) are the open-core decomposition of the
  # monolithic Tenant reconcile into per-concern controllers (gibson
  # #801–805). The operator owns their full lifecycle plus status +
  # finalizers, exactly as for the top-level Tenant CRDs.
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["tenants", "tenantmembers", "agentenrollments", "tenantdataplanes", "tenantsecretsbackends", "tenantidentities", "tenantgrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["tenants/status", "tenantmembers/status", "agentenrollments/status", "tenantdataplanes/status", "tenantsecretsbackends/status", "tenantidentities/status", "tenantgrants/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["tenants/finalizers", "tenantmembers/finalizers", "agentenrollments/finalizers", "tenantdataplanes/finalizers", "tenantsecretsbackends/finalizers", "tenantidentities/finalizers", "tenantgrants/finalizers"]
    verbs: ["update"]

  # OIDCClient and PlatformBootstrap belong to the platform-operator. Since
  # gibson v0.153.0 the TenantIdentity controller owns the OIDCClients of a
  # tenant: it creates one for each client the TenantIdentity declares, and
  # it reads the PlatformBootstrap for the Zitadel connect address. Both
  # kinds are watched at cluster scope. Without these two rules the informer
  # never syncs, the controller never starts, and a new tenant never gets
  # its Zitadel org: the first-admin hook then fails on its deadline
  # (charts 0.136.5, exit-test-published-install on kind and k3d).
  # scripts/check-operator-rbac-covers.py holds this role to the operator's
  # own role at the pinned tag.
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["oidcclients"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["platformbootstraps"]
    verbs: ["get", "list", "watch"]

  # ConnectorInstance is the connector-operator's CRD. The tenant-operator
  # watches it to converge the connector's FGA component tuples and holds its
  # own finalizer for tuple removal (gibson#1548). Read + update
  # only — the connector-operator owns create/delete and the runtime.
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["connectorinstances"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["gibson.zeroroot.ai"]
    resources: ["connectorinstances/finalizers"]
    verbs: ["update"]

  # Namespace is inherently cluster-scoped — operator creates per-tenant namespaces.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Events: operator emits about Tenant reconciles (release ns) and per-tenant
  # provisioning steps (tenant ns). Cluster-scope avoids picking the right
  # RoleBinding at every event-emit site. Events are low-sensitivity.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Newer client-go (used by controller-runtime in the operator) emits
  # Events via the events.k8s.io API in addition to the legacy core/events
  # one. Without this parallel grant, every Event the operator records is
  # rejected by the apiserver with "events.events.k8s.io is forbidden".
  # Mirror of tenant-operator#142 (kubebuilder marker on the same controllers).
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  # ClusterSPIFFEIDs of plugin instances (gibson#815). The operator writes
  # one for each (plugin, tenant): gibson-plugin-<vendor>-<tenant>, with the
  # ID spiffe://<td>/plugin/<vendor>/<tenant>. A ClusterSPIFFEID maps a pod
  # selector to a SPIFFE ID, so this grant alone could mint any platform
  # identity. The admission policy gibson-tenant-operator-clusterspiffeid-scope
  # (clusterspiffeid-scope-admission.yaml) holds each write of this operator
  # to the plugin shape, and refuses a change to any other ClusterSPIFFEID.
  # scripts/check-owner-credential-readers.py does not cover this kind; the
  # policy and its Deny binding render unconditionally next to this rule.
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterspiffeids"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]

  # Per-tenant RoleBindings. The operator creates a RoleBinding in each
  # tenant namespace at provision time, scoped to the chart-defined
  # `gibson-tenant-operator-tenant-namespace` ClusterRole. This is the
  # narrow alternative to giving the operator `roles/create + escalate`
  # cluster-wide (which would let it mint Roles with any rules — a wider
  # blast radius than the spec intends). The operator cannot define the
  # rule set; it can only bind the chart-owned ClusterRole into a ns.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # `bind` is RBAC's privilege-escalation guard: holding it lets the
  # operator reference the named ClusterRole from a RoleBinding even
  # though the operator itself doesn't hold every verb in that
  # ClusterRole's rules. Scoped via resourceNames so the operator can
  # bind ONLY these three ClusterRoles — not arbitrary cluster-admin etc.
  # gibson-connector-creds is the daemon's Secret grant (gibson-workloads
  # connector-rbac.yaml); the operator binds it into each tenant namespace
  # so the daemon's Secret access is bounded to tenant namespaces.
  # gibson-tenant-operator-plugin-namespace holds the rules of the operator
  # in each tenant-<t>-plugins namespace (gibson#815).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["gibson-tenant-operator-tenant-namespace", "gibson-connector-creds", "gibson-tenant-operator-plugin-namespace"]
    verbs: ["bind"]
---
