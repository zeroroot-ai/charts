# Root CA cert. Signed by selfsigned-bootstrap; lives in the Secret
# `gibson-selfsigned-ca` for selfsigned-ca to use as its signing material.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gibson-selfsigned-ca
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cert-manager-issuer
spec:
  isCA: true
  commonName: "Gibson Self-Signed Root CA"
  secretName: gibson-selfsigned-ca
  duration: 87600h   # 10 years
  renewBefore: 8760h # 1 year
  # The root keeps its key when cert-manager renews it (ADR-0171, row
  # component-tls). Each client loads this CA one time at start. With the
  # same key, a leaf signed after the renewal still chains to the CA that a
  # running client holds, so a renewal of the root restarts nothing.
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
