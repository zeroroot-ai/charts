kind: Pod
metadata:
  name: "gibson-spiffe-oidc-discovery-provider-test-keys"
  namespace: gibson
  labels:
    helm.sh/chart: spiffe-oidc-discovery-provider-0.1.0
    app.kubernetes.io/name: spiffe-oidc-discovery-provider
