            # The daemon that receives the audit record of each change
            # (DaemonOperatorService.EmitAuditEvent, gibson#583). The operator
            # does not start without both. It dials on first use, never at
            # boot, so the daemon is not a start dependency: the records wait
            # in the status of each resource until the daemon answers.
            - name: GIBSON_DAEMON_GRPC_ADDRESS
              value: "gibson-gibson-workloads:50051"
            - name: GIBSON_DAEMON_SPIFFE_ID
              value: "spiffe://zeroroot.ai/platform/daemon"
            # Zitadel System API user private key path (platform-operator#28).
            # The AdminTokenReady step signs JWTs with this key to call
            # /system/v1/* and mint the Zitadel admin token (gibson#794).
