        'gibson.zeroroot.ai/plugin' in variables.labels ? variables.labels['gibson.zeroroot.ai/plugin'] : ''
    - name: t
      expression: >-
        'gibson.zeroroot.ai/tenant' in variables.labels ? variables.labels['gibson.zeroroot.ai/tenant'] : ''
    - name: pluginNs
      expression: "'tenant-' + variables.t + '-plugins'"
