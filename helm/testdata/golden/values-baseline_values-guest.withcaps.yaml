apiVersion: v1
kind: Pod
metadata:
  name: "gibson-gibson-workloads-test-data-plane"
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    helm-test/keep: "false"
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/kube-api: "true"
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "6"
spec:
  restartPolicy: Never
  serviceAccountName: "gibson-gibson-workloads-test-bootstrap-reader"
  containers:
    - name: postgres-probe
      image: "ghcr.io/zeroroot-ai/mirror/bitnami-postgresql:16.4.0-debian-12-r0@sha256:be51b3aeaacc600f3eb2b596427be538b1bc17284111a1fe147030e8422c3184"
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='::error file=helm-test::'

          # CNPG -rw Service host — overridable via .Values.tests.postgres.{host,port}.
          # We DON'T read platformBootstrap.* here because that block lives in the
          # sibling gibson-operators chart (the CR template is over there); this
          # workload chart only owns the test pods. Operators that want to point
          # this test at a different DB host should override `.tests.postgres.host`.
          PG_HOST='platform-postgres-rw.gibson.svc.cluster.local'
          PG_PORT='5432'

          # Bitnami image puts psql on PATH but not /opt/bitnami/postgresql/bin
          # by default; alias it.
          if ! command -v psql >/dev/null 2>&1 ; then
            for d in /opt/bitnami/postgresql/bin /usr/lib/postgresql/16/bin /usr/bin ; do
              [ -x "$d/psql" ] && PATH="$d:$PATH" && break
            done
          fi
          if ! command -v psql >/dev/null 2>&1 ; then
            echo "$ERR postgres-probe: psql binary not found in image"
            exit 1
          fi

          # Without creds inside the test pod, we can't authenticate. The
          # bitnami image runs as non-root with no access to mount Secrets
          # safely here. Use a tcp probe + a no-auth `SELECT version()`
          # query via the trust connection: CNPG's -rw Service is admin-only,
          # so we instead probe via TCP and rely on the existence + listener
          # response.
          echo "[postgres-probe] TCP-probing ${PG_HOST}:${PG_PORT}"
          if ! (echo > "/dev/tcp/${PG_HOST}/${PG_PORT}") 2>/dev/null ; then
            echo "$ERR postgres-probe: ${PG_HOST}:${PG_PORT} not reachable"
            exit 1
          fi
          echo "[postgres-probe] PASS"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
    - name: redis-probe
      image: "ghcr.io/zeroroot-ai/mirror/redis:7.4.1-alpine@sha256:c1e88455c85225310bbea54816e9c3f4b5295815e6dbf80c34d40afc6df28275"
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='::error file=helm-test::'

          REDIS_HOST='gibson-redis-stack'
          REDIS_PORT='6379'

          # Authentication: gibson-redis-password Secret carries the password.
          # We can't kubectl from this image; for portability we just verify
          # a TCP-level handshake.
          # The dedicated redis-stack readiness probe in the StatefulSet
          # validates auth; this pod only ensures the listener is up.
          echo "[redis-probe] TCP-probing ${REDIS_HOST}:${REDIS_PORT}"
          if ! (echo > "/dev/tcp/${REDIS_HOST}/${REDIS_PORT}") 2>/dev/null ; then
            echo "$ERR redis-probe: ${REDIS_HOST}:${REDIS_PORT} not reachable"
            exit 1
          fi

          # PING via redis-cli — if auth is on (it should be per one-code-path/199),
          # PING without -a returns NOAUTH which still proves the server is up.
          out=$(redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" --no-auth-warning -t 5 PING 2>&1 || true)
          case "$out" in
            PONG)
              echo "[redis-probe] PONG (auth disabled or default)"
              ;;
            *NOAUTH*|*WRONGPASS*)
              echo "[redis-probe] OK Redis up + auth-on (got: $out)"
              ;;
            *)
              echo "$ERR redis-probe: unexpected response from PING: $out"
              exit 1
              ;;
          esac
          echo "[redis-probe] PASS"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
    - name: neo4j-probe
      image: "ghcr.io/zeroroot-ai/mirror/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b"
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='::error file=helm-test::'
          NEO4J_HOST='gibson-neo4j'
          NEO4J_BOLT_PORT='7687'

          echo "[neo4j-probe] TCP-probing ${NEO4J_HOST}:${NEO4J_BOLT_PORT}"
          if ! (echo > "/dev/tcp/${NEO4J_HOST}/${NEO4J_BOLT_PORT}") 2>/dev/null ; then
            echo "$ERR neo4j-probe: ${NEO4J_HOST}:${NEO4J_BOLT_PORT} not reachable"
            exit 1
          fi
          echo "[neo4j-probe] PASS"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
  imagePullSecrets:
    - name: ghcr-credentials
