                                allow_missing: {}
                            # Native-login bootstrap (gibson#623) — pre-auth, no bearer.
                            - match: { prefix: "/.well-known/gibson-login" }
                              requires:
                                allow_missing: {}
                            # Capability-Grant registration (gibson#648) — pre-auth:
                            # a component holds no daemon JWT at first registration,
                            # the bootstrap credential authenticates it at the daemon.
                            - match: { prefix: "/.well-known/agent-configuration" }
                              requires:
                                allow_missing: {}
                            # The register POST carries a daemon-signed CG bootstrap
                            # token in Authorization: Bearer — NOT a Zitadel JWT. It
                            # is verified by the daemon, not jwt_authn. allow_missing
                            # only passes when no JWT is present; a present-but-non-
                            # Zitadel token would otherwise fail jwt_authn ("Jwt
                            # issuer is not configured"). allow_missing_or_failed lets
                            # it through so the daemon does the bootstrap check.
                            - match: { prefix: "/capabilitygrant/v1/register" }
                              requires:
                                allow_missing_or_failed: {}
                            # Connector OAuth callback — the vendor redirect
                            # carries no bearer; the daemon authenticates via the state
                            # (CSRF binding) + daemon-held PKCE. Pre-auth, no JWT.
                            - match: { prefix: "/connectors/oauth/callback" }
                              requires:
                                allow_missing: {}
                            # No jwt_authn rule for /capabilitygrant/v1/keys/ —
                            # the route itself is gone (GHSA-88fg / GHSA-9q4v; see
                            # the api_routes comment above). Re-adding a rule here
                            # without a route is harmless but misleading; re-adding
                            # both republishes the tenant/principal oracle.
                            # Spec 3 R8 — dashboard SPAs and Auth.js callbacks pin
                            # the dashboard provider (audience: gibson-dashboard).
                            - match: { prefix: "/dashboard/" }
                              requires:
                                provider_name: zitadel_dashboard
                            - match: { prefix: "/api/auth/" }
                              requires:
                                provider_name: zitadel_dashboard
                            # All gRPC paths accept EITHER a user-flow Zitadel JWT
                            # (audience: dashboard client_id, issued by the OIDC
                            # code flow Auth.js drives) OR an S2S Zitadel JWT
                            # (audience: gibson-platform, issued by the
                            # client_credentials grant for machine users like
                            # gibson-dashboard-service / signup-bot).
                            # ext_authz + FGA do the actual authorization based
                            # on the JWT's `sub` claim — the per-method registry
                            # decides whether a given subject can call a given
                            # RPC. Restricting the audience here would just
                            # double-gate, and the previous "S2S only" rule was
                            # actively wrong: dashboard-side server actions
                            # (e.g. ListMyMemberships) forward the user's access
                            # token, which has the dashboard audience, not S2S.
                            # DaemonOperatorService — ZD-internal operator RPCs.
                            # Accepts the same provider set as the user-RPC route
                            # (FGA in ext_authz enforces member-vs-operator
                            # separation per method). Listed explicitly so the
                            # more-specific match wins over the /gibson. catch-all
                            # below; this also gives ops a clear seam for tightening
                            # the required provider set later without touching the
                            # member-facing route.
                            - match: { prefix: "/gibson.daemon.operator.v1.DaemonOperatorService/" }
                              requires:
                                requires_any:
                                  requirements:
                                    - provider_name: zitadel_dashboard
                                    - provider_name: zitadel_s2s
                            # Component-callable RPCs (ext-authz#103) —
                            # scoped loosening (decision A). A component (agent/tool/
                            # plugin) presents its self-signed CG-JWT in
                            # x-capability-grant with NO Authorization, so a Zitadel
                            # JWT is absent: allow_missing_or_failed lets the request
                            # reach ext_authz, which verifies the component token by
                            # kid + runs the per-method FGA check (FGA is the
                            # boundary). Humans calling the same RPC still send a
                            # valid Zitadel JWT (validated when present). Listed
                            # before the /gibson. catch-all so this scoped rule wins;
                            # the rest of /gibson. keeps the hard Zitadel requirement.
                            # Expand this prefix set as more client RPCs move onto the
                            # CG-JWT (gibson#647); start with inspect (WhoAmI).
                            #
                            # A person also calls WhoAmI (`gibson inspect` after
                            # `gibson login`). A bare allow_missing_or_failed checks
                            # no provider, so jwt_authn never writes x-jwt-payload
                            # and ext_authz answers Unauthenticated for every person.
                            # Trying both Zitadel providers first verifies a present
                            # JWT and forwards its payload; allow_missing_or_failed
                            # still lets a component with only a CG-JWT through.
                            - match: { prefix: "/gibson.identity.v1.IdentityService/" }
                              requires:
                                requires_any:
                                  requirements:
                                    - provider_name: zitadel_dashboard
                                    - provider_name: zitadel_s2s
                                    - allow_missing_or_failed: {}
                            # Component (plugin / tool / agent / connector) runtime
                            # channel: a CG component registers via ComponentService
                            # and polls work + resolves credentials + searches tools
                            # via HarnessCallbackService, all authenticated by its
                            # CG-JWT in x-capability-grant (NOT a Zitadel JWT). Without
                            # allow_missing_or_failed here the /gibson. catch-all
                            # rejects these with "Jwt is missing" before ext_authz can
                            # verify the CG-JWT, breaking external/process-mode bridge
                            # registration + GetCredential (deploy#778).
                            - match: { prefix: "/gibson.component.v1.ComponentService/" }
                              requires:
                                allow_missing_or_failed: {}
                            - match: { prefix: "/gibson.harness.v1.HarnessCallbackService/" }
                              requires:
                                allow_missing_or_failed: {}
                            # A dispatched component renews its own task grant with
                            # that grant as its only credential (gibson#1605). It has
                            # no Zitadel JWT, so the /gibson. catch-all would reject
                            # it with "Jwt is missing" before ext_authz can verify the
                            # grant, and a long-running bank member could not keep
                            # its grant alive (deploy#1756). An exact path match, not
                            # a prefix: only this one RPC loosens. ext_authz still
                            # verifies the grant against the daemon's key and refuses
                            # one that does not list the method.
                            - match: { path: "/gibson.daemon.v1.DaemonService/RenewCapabilityGrant" }
                              requires:
                                allow_missing_or_failed: {}
                            - match: { prefix: "/gibson." }
                              requires:
                                requires_any:
                                  requirements:
                                    - provider_name: zitadel_dashboard
                                    - provider_name: zitadel_s2s
                            - match: { prefix: "/api/admin/" }
                              requires:
                                provider_name: zitadel_s2s
                            # Default catch-all — service-acting audience.
                            - match: { prefix: "/" }
                              requires:
                                provider_name: zitadel_s2s
    
                      # 2. External Authorization — FGA decision via ext_authz.
                      # Fails CLOSED. ExtAuthz reads the per-method registry
                      # entry, calls FGA, and on ALLOW injects the trusted
                      # x-gibson-identity-* headers via headers_to_add. CG-JWT
                      # validation (X-Capability-Grant header) is also done
                      # here — ext_authz fetches the daemon's JWKS and
                      # short-circuits FGA when the requested method is in
                      # the CG's allowed_rpcs.
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ext_authz_grpc
                            # deploy#1203 — this is the WHOLE budget ext-authz gets
                            # to reach a decision, and it must exceed the FGA work it
                            # funds. One request runs up to TWO SEQUENTIAL FGA Check
                            # calls:
                            #
                            #   • OIDC user  : per-RPC registry Check + the
                            #                  deliberately-uncached active_session
                            #                  gate (gibson internal/server/extauthz/
                            #                  fga/check.go CheckActiveSession).
                            #   • Service acct: CheckPlatformOperator (cross-tenant
                            #                  gate) + the per-RPC registry Check.
                            #
                            # Each call carries its own floor —
                            # EXT_AUTHZ_FGA_PER_CALL_TIMEOUT, default 1500ms
                            # (gibson cmd/ext-authz/main.go, authz.DefaultPerCallTimeout)
                            # — so the worst-case serial floor is 2 × 1500ms = 3000ms.
                            # At the old 2s this filter timed out BEFORE the per-call
                            # floors expired, and with failure_mode_allow:false that
                            # converts any FGA latency blip into a cluster-wide 403
                            # storm instead of a bounded per-call failure.
                            #
                            # 5s is not a round number picked here: it is the
                            # platform-wide contract constant
                            # authz.EnvoyExtAuthzBudgetDefault (gibson
                            # internal/infra/authz/authz.go), which the daemon
                            # ENFORCES — internal/server/daemon/authz_init.go refuses
                            # to start when authz.fga.timeout_ms >= 5000. The chart's
                            # own daemon config comment (templates/gibson/configmap.yaml,
                            # authz.fga.timeout_ms) already asserted that 5000ms budget
                            # while this filter contradicted it at 2s. Keep all three in
                            # lockstep: per-call floor < daemon fga.timeout_ms < this.
                            timeout: 5s
                          include_peer_certificate: true
    
                      # deploy#1659 — the per-client layer on api.
                      # AFTER ext_authz, because the authenticated routes key on
                      # the x-gibson-identity-subject / -tenant headers ext-authz
                      # sets (headers_to_set: a client-supplied copy is
                      # overwritten —), and the pre-auth routes key on
                      # the client address. FAIL-OPEN under the fuse, like the
                      # browser chain's; the same ratelimit service answers.
                      - name: envoy.filters.http.ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                          domain: gibson-edge
                          stage: 0
                          request_type: external
                          timeout: 0.05s
                          failure_mode_deny: false
                          enable_x_ratelimit_headers: DRAFT_VERSION_03
                          stat_prefix: api_per_client
                          rate_limit_service:
                            transport_api_version: V3
                            grpc_service:
                              envoy_grpc:
                                cluster_name: ratelimit_grpc
    
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    
    
            # =====================================================================
            # app / apex / docs — the browser chain, on the one edge listener.
            #
            # Matched by SNI, on every substrate. The chain body lives
            # in files/envoy/public-chain.yaml and is rendered once by
            # configmap.yaml, so it is one definition wherever it is read.
            # =====================================================================
            - filter_chain_match:
                server_names:
                  - "app.localhost.zeroroot.ai"
                  - "localhost.zeroroot.ai"
                  - "docs.localhost.zeroroot.ai"
    # =====================================================================
            # app.<domain> — dashboard. Pure TLS termination + HTTP proxy. The
            # dashboard runs its own OIDC flow against Zitadel via Auth.js;
            # Envoy does not validate the user session here. The dashboard's
            # SERVER-SIDE calls back into the daemon go through api.<domain>, on
            # the edge_tls listener, which is where Zitadel JWT validation happens.
            # =====================================================================
            # =====================================================================
            # Merged public filter chain: app + apex + docs (deploy#865; www is
            # off-cluster ).
            #
            # These hostnames share ONE TLS cert and resolve to the same edge
            # IPs, so browsers HTTP/2-COALESCE requests across them onto a single
            # connection. Envoy selects the filter chain by the *connection's SNI*,
            # not the per-request :authority — so a coalesced `app.<domain>/login`
            # request riding a connection opened to one hostname landed on a
            # chain scoped to another, matched no virtual_host, and returned 404. (Plain
            # curl opens a fresh connection with the correct SNI every time, which
            # is why it never reproduced.) Serving all three authorities from ONE
            # filter chain, matched by :authority (the virtual_host `domains`),
            # makes the SNI irrelevant and eliminates the coalescing 404.
            #
            # SAFE to merge: none of these carry auth filters — ext_authz /
            # jwt_authn live ONLY on the api.<domain> chain, on the edge_tls
            # listener. That chain cannot merge in here, so a browser that
            # coalesces across api.<domain> and one of these hosts still lands
            # on the wrong chain. Both chains answer that case with 421
            # (the `misdirected` virtual host below, and its twin on the api
            # chain), and the browser retries on a connection with the right SNI.
            #
            # Where this chain is MOUNTED varies by environment (deploy#1196) and
            # nothing below depends on it: routing is by :authority throughout.
            # =====================================================================
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: /etc/envoy/tls/tls.crt }
                        private_key:       { filename: /etc/envoy/tls/tls.key }
                    alpn_protocols: ["h2", "http/1.1"]
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: public_ingress
                    codec_type: AUTO
                    # Client-IP contract. The L4 load balancer preserves
                    # the client IP, so the socket peer IS the client. Trust it and
                    # nothing else: never a client-supplied x-forwarded-for, and no
                    # trusted-hop count, which is only correct behind an ALB.
                    use_remote_address: true
                    xff_num_trusted_hops: 0
                    # Route on the path the upstream will see. Envoy resolves dot
                    # segments and merges repeated slashes before it matches a
                    # route, so /auth/v1/users/me//email or a /../ detour
                    # cannot pass the 403 and 404 routes below.
                    normalize_path: true
                    merge_slashes: true
                    route_config:
                      name: public_routes
                      # The edge owns the headers that select a Zitadel instance
                      # (ADR-0092, charts#161). Zitadel trusts them, so a client on
                      # the internet must never supply them. This runs in the router,
                      # after ext_authz, which adds none of these four.
                      request_headers_to_remove:
                        - x-zitadel-instance-host
                        - x-zitadel-public-host
                        - x-forwarded-host
                        - forwarded
                      virtual_hosts:
                        - name: app
                          domains: ["app.localhost.zeroroot.ai", "app.localhost.zeroroot.ai:443"]
                          routes:
                            # -------------------------------------------------------
                            # Single-host consolidation (deploy#630): the whole
                            # platform is served at app.<domain>. Reserved Zitadel
                            # protocol prefixes route to Zitadel (login + OIDC),
                            # everything else to the dashboard. The OIDC issuer
                            # stays a clean origin (https://app.<domain>) because
                            # these endpoints live at the host root — the dashboard
                            # owns /, /dashboard, /api/auth (Auth.js BFF).
                            # -------------------------------------------------------
                            # OAuth 2.0 Device Authorization verification page
                            # (deploy#715). The device_authorization response
                            # advertises verification_uri = {issuer}/device. Zitadel
                            # core answers that path with a 302 to its embedded v1
                            # login at /ui/login/device. The v1 login cannot verify a
                            # passkey or security key that Login V2 registered: it
                            # starts WebAuthn with an empty relying-party ID, so it
                            # drops every key that carries one, and the second
                            # factor fails with Errors.User.WebAuthN.BeginLoginFailed
                            # (Zitadel v4.18.0, upstream zitadel#8282). Login V2
                            # ships its own device page, so the edge sends the
                            # browser there. The redirect keeps the query string,
                            # so ?user_code= reaches the page. A 302, not a 301, so
                            # no browser caches it. This route MUST
                            # precede the broad /ui/ rule below.
                            - match: { path: "/device" }
                              redirect: { path_redirect: "/ui/v2/login/device", response_code: FOUND }
                            - match: { prefix: "/ui/login/" }
                              route:
                                cluster: zitadel_upstream
                                timeout: 60s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.appLogin, by address.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: app_login
                                      - masked_remote_address:
                                          v4_prefix_mask_len: 32
                                          v6_prefix_mask_len: 64
                            # The admin surface of Zitadel has no public route
                            # (ADR-0093): the console, the admin API, the management
                            # API and the gRPC services. The edge answers 404 for
                            # each of them. The Platform owner opens the console
                            # through a private path, and each in-cluster client
                            # dials the Zitadel Service by name (ADR-0092). This
                            # route MUST precede the broad /ui/ rule below, or
                            # /ui/console reaches the login container. The guard is
                            # scripts/check-edge-zitadel-routes.py.
                            - match:
                                safe_regex: { regex: "^/(?:ui/console|management/v1/|admin/v1/|zitadel\\.).*$" }
                              direct_response: { status: 404, body: { inline_string: "not found\n" } }
                            # Zitadel v4 Login V2 UI (separate Next.js app,
                            # gibson-zitadel-login). /oauth/v2/authorize 302s the
                            # browser here.
                            - match: { prefix: "/ui/" }
                              route: { cluster: zitadel_login, timeout: 60s }
                            # OIDC discovery + OAuth/OIDC protocol + external-IdP
                            # and SAML callbacks → Zitadel core.
                            - match: { prefix: "/.well-known/openid-configuration" }
                              route: { cluster: zitadel_upstream, timeout: 30s }
                            - match: { prefix: "/oauth/" }
                              route:
                                cluster: zitadel_upstream
                                timeout: 30s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.appLogin, by address.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: app_login
                                      - masked_remote_address:
                                          v4_prefix_mask_len: 32
                                          v6_prefix_mask_len: 64
                            - match: { prefix: "/oidc/" }
                              route:
                                cluster: zitadel_upstream
                                timeout: 30s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.appLogin, by address.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: app_login
                                      - masked_remote_address:
                                          v4_prefix_mask_len: 32
                                          v6_prefix_mask_len: 64
                            - match: { prefix: "/idps/" }
                              route: { cluster: zitadel_upstream, timeout: 30s }
                            - match: { prefix: "/saml/" }
                              route: { cluster: zitadel_upstream, timeout: 30s }
                            # -------------------------------------------------------
                            # A user's email address and username do not change
                            # through the public edge. One email address belongs to
                            # one account in the whole install (ADR-0093 decision
                            # 1), and a rename would free the old address for a
                            # second account. Zitadel lets a user change their own
                            # email and username through the auth API (/users/me)
                            # and the v2 user API (self-management is allowed
                            # for the caller's own user ID), and it has no setting
                            # that turns this off. So the edge answers 403 for
                            # these calls, for every caller: the v2 calls take a
                            # user ID, and the edge does not read a body to tell
                            # "self" from "other". The gRPC form of each call has
                            # no public route at all (the 404 route above).
                            #
                            # These routes MUST precede the Zitadel API routes
                            # below. The guard is scripts/check-edge-zitadel-routes.py,
                            # which plays each request against the rendered
                            # routes and fails when one reaches Zitadel.
                            #
                            # 1. A percent sign in a Zitadel API path. Zitadel's
                            #    router matches on the decoded path, so
                            #    /auth/v1/users/me/e%6Dail would miss the matches
                            #    below and still reach the email change. No Zitadel
                            #    API path that a client sends carries one.
                            - match:
                                safe_regex: { regex: "^/(?:auth/v1/|v2/|v2beta/).*%.*$" }
                              direct_response: { status: 403, body: { inline_string: "forbidden\n" } }
                            # 2. A method override header. grpc-gateway turns a form
                            #    POST with X-HTTP-Method-Override into that method,
                            #    which would slip a PATCH past the method matches
                            #    below.
                            - match:
                                safe_regex: { regex: "^/(?:auth/v1/|v2/|v2beta/).*$" }
                                headers:
                                  - name: x-http-method-override
                                    present_match: true
                              direct_response: { status: 403, body: { inline_string: "forbidden\n" } }
                            # 3. REST. The GET on /auth/v1/users/me/email (read your
                            #    own email) still routes.
                            - match:
                                safe_regex: { regex: "^/auth/v1/users/me/(?:username|email)/?$" }
                                headers:
                                  - name: ":method"
                                    string_match: { exact: "GET" }
                                    invert_match: true
                              direct_response: { status: 403, body: { inline_string: "forbidden\n" } }
                            - match:
                                safe_regex: { regex: "^/(?:v2|v2beta)/users/[^/]+/email/?$" }
                              direct_response: { status: 403, body: { inline_string: "forbidden\n" } }
                            - match:
                                safe_regex: { regex: "^/v2/users/human/[^/]+/?$" }
                              direct_response: { status: 403, body: { inline_string: "forbidden\n" } }
                            # PATCH /v2/users/{id} is UpdateUser and PUT
                            # /v2beta/users/{id} is the v2beta UpdateHumanUser. GET
                            # and DELETE on the same paths, and POST
                            # /v2/users/human (create a user, used by signup),
                            # still route.
                            - match:
                                safe_regex: { regex: "^/(?:v2|v2beta)/users/[^/]+/?$" }
                                headers:
                                  - name: ":method"
                                    string_match: { safe_regex: { regex: "(?i)^(?:PATCH|PUT)$" } }
                              direct_response: { status: 403, body: { inline_string: "forbidden\n" } }
                            # The Zitadel auth API for the signed-in user (password
                            # policy, own user), and further down the v2 REST API
                            # (/v2/users/human, /v2/users/:id/password, /v2beta/...).
                            # The management API, the admin API and the gRPC
                            # services have no route here (ADR-0093).
                            # NOTE: /auth/v1/ is Zitadel; the dashboard's Auth.js BFF
                            # lives under /api/auth/ and is unaffected.
                            - match: { prefix: "/auth/v1/" }
                              route: { cluster: zitadel_upstream, timeout: 30s }
                            # NO /system/v1/ ROUTE. DO NOT ADD ONE (GHSA-534c,
                            # gibson#1275).
                            #
                            # /system/v1/* is Zitadel's INSTANCE-SUPERUSER surface:
                            # it creates and deletes instances, registers trusted
                            # domains, and mints instance-scoped tokens. It sits
                            # above the org boundary, so it is above every tenant
                            # boundary Gibson has. Publishing it at the edge put
                            # the whole control plane one SystemAPIUsers key
                            # compromise away from total instance takeover, and
                            # the route carried no ext_authz and no FGA check —
                            # Zitadel's own JWT-assertion auth was the only gate.
                            #
                            # Its ONE caller is the platform-operator's
                            # AdminTokenReady step (gibson#794), which dials Zitadel by
                            # Service DNS inside the cluster
                            # (PlatformBootstrap spec.zitadel.systemClient.apiURL,
                            # emitted by helm/gibson-operators) and forges the
                            # public Host header so Zitadel still routes it. No
                            # dashboard, CLI, SDK or operator outside the pod
                            # network ever reads it.
                            #
                            # Guarded by scripts/check-edge-zitadel-routes.py: a
                            # route to Zitadel that its allowlist does not name
                            # fails the build.
                            - match: { prefix: "/v2/" }
                              route: { cluster: zitadel_upstream, timeout: 30s }
                            - match: { prefix: "/v2beta/" }
                              route: { cluster: zitadel_upstream, timeout: 30s }
                            # Zitadel asset delivery (label-policy logo/icon/font
                            # uploads, deploy#867). The hosted login references
                            # logoUrlDark = {host}/assets/v1/<instance>/policy/
                            # label/logo-dark-<id>; without this route the image
                            # request falls through to the dashboard catch-all and
                            # 404s — empty logo on the signin page (deploy#877).
                            # The dashboard serves nothing under /assets.
                            - match: { prefix: "/assets/" }
                              route: { cluster: zitadel_upstream, timeout: 30s }
                            # envoy.extraRoutes (charts#375): one route for each
                            # entry, an exact path, with its rate-limit class. A
                            # component outside the core chart (the private
                            # billing component) comes in only through this list.
                            # -------------------------------------------------------
                            # Signup submission bucket (deploy#1242). The signup
                            # Server Action POSTs to its page URL (/signup — Next.js
                            # Server Actions always target the current route), so
                            # this is the ONE unauthenticated, captcha-less route on
                            # the public chain that mints a tenant, creates a Stripe
                            # customer and drives an SES verification email per
                            # accepted request. POST-only on purpose: GET page loads
                            # and RSC prefetches fall through to the catch-all below
                            # (same cluster, publicBaseline ceiling), so a crowd
                            # reading the signup page cannot drain the submission
                            # bucket. Same cluster and same 300s timeout as the
                            # catch-all — the signup action blocks synchronously on
                            # waitForTenantReady up to ~255s; see the catch-all's
                            # comment for the full timeout derivation. MUST stay
                            # above the catch-all or it is shadowed and the bucket
                            # never fires. Sizing rationale: values.yaml
                            # envoy.rateLimit.appSignupSubmit. The per-client quota
                            # is the rate_limits descriptor below
                            # (envoy.rateLimit.perClient.appSignupSubmit).
                            - match:
                                prefix: "/signup"
                                headers:
                                  - name: ":method"
                                    string_match: { exact: "POST" }
                              route:
                                cluster: gibson_dashboard
                                timeout: 300s
                                # Per-client quota: descriptor
                                # (route=app_signup_submit, masked_remote_address)
                                # → envoy.rateLimit.perClient.appSignupSubmit in the
                                # ratelimit service config. The address is the
                                # socket peer (Client-IP contract), never a header.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: app_signup_submit
                                      - masked_remote_address:
                                          v4_prefix_mask_len: 32
                                          v6_prefix_mask_len: 64
                              typed_per_filter_config:
                                envoy.filters.http.local_ratelimit:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                                  stat_prefix: app_signup_submit
                                  token_bucket:
                                    max_tokens: 20
                                    tokens_per_fill: 10
                                    fill_interval: 1s
                                  # Both REQUIRED: each defaults to 0% when omitted,
                                  # which renders a limiter that enforces nothing.
                                  filter_enabled:
                                    default_value: { numerator: 100, denominator: HUNDRED }
                                  filter_enforced:
                                    default_value: { numerator: 100, denominator: HUNDRED }
                                  response_headers_to_add:
                                    - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                      header: { key: retry-after, value: "1" }
                            # Everything else → dashboard.
                            # 300s (NOT 60s): the signup server action blocks
                            # synchronously on waitForTenantReady up to
                            # TENANT_READY_TIMEOUT_MS=240s (dashboard#962: a second
                            # back-to-back tenant provision was observed at 2m25s
                            # CR→Ready on floor-sized staging, plus ≤15s operator
                            # queue pickup; the signup smoke's own saga budget is
                            # 180s) before returning its graceful
                            # PROVISIONING_TIMEOUT ("we'll email you") response.
                            # Worst-case action duration ≈ 240s wait + ~15s of
                            # Stripe/owner-provisioning preamble, so the gateway
                            # timeout MUST exceed ~255s or Envoy 504s the browser —
                            # turning the graceful path into a hard "Something went
                            # wrong" while the backend provisions the tenant anyway
                            # (deploy: signup-504-timeout-mismatch / deploy#1020,
                            # recurred as dashboard#962). Ceiling: the staging NLB's
                            # fixed 350s TCP idle timeout — this value must stay
                            # below it, and TENANT_READY_TIMEOUT_MS below this.
                            - match: { prefix: "/" }
                              route:
                                cluster: gibson_dashboard
                                timeout: 300s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.appCatchAll, by address.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: app_catch_all
                                      - masked_remote_address:
                                          v4_prefix_mask_len: 32
                                          v6_prefix_mask_len: 64
                        # docs.<domain> — core optional-by-toggle docs surface
                        # (/ deploy#1034). Served by gibson-docs-svc
                        # (ghcr.io/zeroroot-ai/docs-site, Apache-2.0, nginx).
                        # Core component — present in self-hosted AND SaaS.
                        # Default-on, operator may disable via .Values.docs.enabled=false.
                        # When disabled (no docs-svc Deployment/Service), STRICT_DNS
                        # yields no endpoints → 503. The fail-safe (public docs link)
                        # is surfaced by the dashboard's DOCS_URL env var.
                        - name: docs
                          domains: ["docs.localhost.zeroroot.ai", "docs.localhost.zeroroot.ai:443"]
                          routes:
                            - match: { prefix: "/" }
                              route:
                                cluster: gibson_docs_svc
                                timeout: 30s
                        # apex (e.g. zeroroot.ai) — permanent 301 → app.<domain>.
                        - name: apex
                          domains: ["localhost.zeroroot.ai", "localhost.zeroroot.ai:443"]
                          routes:
                            - match: { prefix: "/" }
                              redirect:
                                # www is off-cluster, so this cannot
                                # send a self-hosted visitor to a marketing site
                                # that does not exist there. The apex goes to the
                                # product front door, which is the login page.
                                host_redirect: "app.localhost.zeroroot.ai"
                                response_code: MOVED_PERMANENTLY
                                https_redirect: true
                        # Misdirected request (RFC 9113 section 9.1.2): a browser
                        # that coalesced its app./apex/docs connection onto a
                        # request for api.<domain> lands here with an :authority
                        # this chain does not serve (the certificate covers every
                        # public host). 421 makes it retry on a new connection with
                        # the right SNI. The api chain answers the reverse case the
                        # same way. Nothing routes from here (deploy#1204).
                        - name: misdirected
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              direct_response:
                                status: 421
                                body:
                                  inline_string: "misdirected request: this connection does not serve the requested host. Retry on a new connection.\n"
                    http_filters:
                      # 0. Edge rate limiting (deploy#1242). Until this filter
                      # existed, the merged public chain's http_filters was JUST
                      # the router — no limiter of any kind on the vhost carrying
                      # every dashboard page load and Server Action, the Zitadel
                      # login/OIDC surface, docs, AND the in-cluster
                      # dashboard-to-Zitadel admin traffic. The api chain has had
                      # api_baseline since deploy#1189; this is the same floor for
                      # the public chain, declared at filter level (NOT per vhost)
                      # for the same reason: a virtual host added to public_routes
                      # later inherits it WITHOUT having to remember to ask. The
                      # POST /signup route above overrides it with a tighter
                      # bucket; an override REPLACES this one rather than
                      # stacking, so a signup flood drains only the signup bucket
                      # and the rest of the vhost keeps serving.
                      #
                      # filter_enabled / filter_enforced are set explicitly and
                      # MUST stay at 100%: BOTH DEFAULT TO 0% WHEN OMITTED — a
                      # limiter that omits them renders fine and enforces nothing.
                      # scripts/check-edge-rate-limits.py asserts 100/HUNDRED on
                      # every HTTP local_ratelimit in the rendered file.
                      #
                      # No descriptors — see envoy.rateLimit in values.yaml for
                      # why this edge has no trustworthy client address to key on.
                      - name: envoy.filters.http.local_ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: public_baseline
                          token_bucket:
                            max_tokens: 8000
                            tokens_per_fill: 4000
                            fill_interval: 1s
                          filter_enabled:
                            default_value: { numerator: 100, denominator: HUNDRED }
                          filter_enforced:
                            default_value: { numerator: 100, denominator: HUNDRED }
                          response_headers_to_add:
                            - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                              header: { key: retry-after, value: "1" }
                      # deploy#1657 — the per-client layer. Calls the
                      # shared ratelimit service (Redis-backed, exact across
                      # replicas) for every route that carries `rate_limits`
                      # actions. FAIL-OPEN, and there is no value that changes it:
                      # an unreachable quota service degrades to the local fuse
                      # above, and envoy_ratelimit_failure_mode_allowed counts the
                      # requests that passed unchecked. Deny-on-error would turn a
                      # quota-service blip into an edge-wide 429 storm, which is
                      # the outage this layer exists to prevent.
                      - name: envoy.filters.http.ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                          domain: gibson-edge
                          stage: 0
                          request_type: external
                          # google.protobuf.Duration: seconds only, so ms/1000.
                          timeout: 0.05s
                          failure_mode_deny: false
                          enable_x_ratelimit_headers: DRAFT_VERSION_03
                          stat_prefix: public_per_client
                          rate_limit_service:
                            transport_api_version: V3
                            grpc_service:
                              envoy_grpc:
                                cluster_name: ratelimit_grpc
                      # deploy#1658 — the Edge WAF. Coraza running the
                      # OWASP Core Rule Set, request bodies inspected, on every
                      # substrate. Sits AFTER both limiters so a flood pays the
                      # cheap fuse and the quota before it pays CRS inspection,
                      # and a scanner's blocked requests still burn its quota.
                      # The directives come from files/coraza/browser.conf; the
                      # module from the mirrored coraza-proxy-wasm image via the
                      # copy-coraza-wasm init container. SecRuleEngine is On and
                      # nothing here can turn it to DetectionOnly.
                      - name: envoy.filters.http.wasm
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                          config:
                            name: coraza-browser
                            root_id: ""
                            fail_open: false
                            configuration:
                              "@type": type.googleapis.com/google.protobuf.StringValue
                              value: |
                                {
                                  "directives_map": { "browser": ["Include @recommended-conf","SecRuleEngine On","SecRequestBodyAccess On","SecResponseBodyAccess Off","SecAuditEngine RelevantOnly","SecAuditLogRelevantStatus \"^(?:5[0-9][0-9]|40[0-35-9]|4[1-9][0-9])$\"","SecAuditLogParts ABIJDEFHZ","SecAuditLog /dev/stdout","SecAuditLogFormat JSON","Include @crs-setup-conf","SecAction \"id:900950,phase:1,pass,t:none,nolog, setvar:tx.blocking_paranoia_level=1, setvar:tx.detection_paranoia_level=1, setvar:tx.inbound_anomaly_score_threshold=5, setvar:tx.outbound_anomaly_score_threshold=4, setvar:tx.early_blocking=1, setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE', setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |text/plain|', setvar:'tx.allowed_request_content_type_charset=|utf-8|iso-8859-1|iso-8859-15|windows-1252|'\"","SecRule REQUEST_URI \"@unconditionalMatch\" \"id:900961,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token.0,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token.1,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token.2,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Secure-authjs.session-token.3,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token.0,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token.1,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token.2,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:authjs.session-token.3\"","SecRule REQUEST_URI \"@unconditionalMatch\" \"id:900962,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:__Host-zitadel.useragent,ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:sessions\"","Include @owasp_crs/*.conf","SecRule REQUEST_URI \"@rx ^/ui/(v2/)?login/\" \"id:900960,phase:1,pass,nolog,t:none,ctl:ruleRemoveByTag=attack-sqli,ctl:ruleRemoveByTag=attack-xss,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-injection-generic,ctl:ruleRemoveByTag=attack-injection-php,ctl:ruleRemoveByTag=attack-java\""] },
                                  "default_directives": "browser",
                                  "metric_labels": { "chain": "browser" }
                                }
                            vm_config:
                              runtime: envoy.wasm.runtime.v8
                              vm_id: coraza
                              code:
                                local:
                                  filename: /etc/envoy/wasm/coraza.wasm
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    
    
            # =====================================================================
            # (apex filter chain removed — apex is now served by the merged public
            # filter chain's apex virtual_host, so HTTP/2 coalescing across app/apex
            # can no longer misroute to a chain that lacks the request's :authority.
            # deploy#865. www is off-cluster .)
            # =====================================================================
            # auth.<domain> RETIRED (deploy#630 single-host consolidation): Zitadel
            # is now served under the app.<domain> vhost (reserved /ui/, /oauth/,
            # /oidc/, /.well-known/openid-configuration, /idps/, /saml/ prefixes).
            # No separate auth. vhost, no dual-serving.
            # =====================================================================
    
      # ===========================================================================
      # Upstream clusters.
      # ===========================================================================
    
        # -------------------------------------------------------------------------
        # admin_probe on :9901 — the only pod-IP surface of the admin interface.
        # Two routes, both to the loopback admin cluster: /ready for the kubelet
        # probes and /stats/prometheus for the scraper. Every other path is 404,
        # so /config_dump, /runtime_modify and /quitquitquit stay on loopback.
        # -------------------------------------------------------------------------
        - name: admin_probe
          address:
            socket_address: { address: 0.0.0.0, port_value: 9901 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: admin_probe
                    codec_type: AUTO
                    route_config:
                      name: admin_probe
                      # The edge owns the headers that select a Zitadel instance
                      # (ADR-0092, charts#161). Zitadel trusts them, so a client on
                      # the internet must never supply them. This runs in the router,
                      # after ext_authz, which adds none of these four.
                      request_headers_to_remove:
                        - x-zitadel-instance-host
                        - x-zitadel-public-host
                        - x-forwarded-host
                        - forwarded
                      virtual_hosts:
                        - name: admin_probe
                          domains: ["*"]
                          routes:
                            - match: { path: "/ready" }
                              route: { cluster: envoy_admin_loopback }
                            - match: { path: "/stats/prometheus" }
                              route: { cluster: envoy_admin_loopback }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    
      clusters:
        # SPIRE Workload API over the agent UDS — Envoy uses SDS against this
        # cluster to fetch its own SVID (name: "default") and the trust bundle
        # (name: "ROOTCA"). Required for the SPIFFE-validated upstream TLS on
        # gibson_daemon_grpc and gibson_dashboard below.
        - name: spire_agent
          type: STATIC
          connect_timeout: 0.25s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe:
                          path: /run/spire/sockets/api.sock
    
        - name: gibson_daemon_grpc
          type: STRICT_DNS
          connect_timeout: 5s
          # deploy#864: re-resolve the daemon Service quickly so a rolled pod's
          # new endpoint is picked up promptly.
          dns_refresh_rate: 5s
          respect_dns_ttl: false
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              # deploy#864: drain idle connections so a long-lived HTTP/2 connection
              # cannot outlive the daemon pod it was pinned to.
              common_http_protocol_options:
                idle_timeout: 30s
              explicit_http_config:
                http2_protocol_options:
                  # deploy#864: PING-based liveness. When the daemon StatefulSet
                  # rolls (nightly standup / image bump), its pod is replaced and
                  # the existing HTTP/2 connection (pinned to the old pod via
                  # conntrack on the Service ClusterIP) goes dead silently — new
                  # streams blackhole with UF until something forces a reconnect,
                  # which previously needed a manual `kubectl rollout restart
                  # deploy/gibson-envoy`. Keepalive PINGs detect the dead
                  # connection within ~interval+timeout and recycle it to the new
                  # pod automatically. (outlier_detection is NOT used: this cluster
                  # has a single ClusterIP endpoint, so ejecting it would drop the
                  # only host instead of recycling the connection.)
                  connection_keepalive:
                    interval: 10s
                    timeout: 5s
          # Envoy → daemon mTLS via SPIRE SDS. Spec Reqs 2.3, 3.7.
          #
          # Envoy presents its own SPIFFE SVID `spiffe://<td>/platform/envoy`
          # (sds_secret_configs entry with name "default" — go-spiffe SDS server
          # convention) and validates the daemon's serving cert against the SPIRE
          # trust bundle (validation_context_sds_secret_config name "ROOTCA").
          # match_typed_subject_alt_names locks acceptance to the daemon's SPIFFE
          # ID only.
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              # SNI must match what the daemon's serving cert SAN expects. The
              # daemon's SPIFFE serving cert has only a URI SAN
              # (URI:spiffe://<td>/platform/daemon) and no DNS SAN, so SNI is
              # informational here; match_typed_subject_alt_names below is what
              # actually enforces identity.
              sni: "gibson-gibson-workloads"
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://zeroroot.ai/platform/daemon"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: gibson_daemon_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          # Daemon Service name comes from the same gibson.fullname
                          # helper that names templates/gibson/service.yaml, so it
                          # tracks the Service in every install shape:
                          # "gibson-workloads" when the chart is its own release
                          # (gitops/kind), "gibson-gibson-workloads" under the
                          # umbrella release "gibson". The bare release name is NOT
                          # the daemon there — it's the neo4j subchart's Service,
                          # and dialing it blackholed all daemon traffic
                          # (deploy#879, staging signup outage 2026-06-12).
                          address: "gibson-gibson-workloads"
                          port_value: 50051
    
        # -------------------------------------------------------------------------
        # gibson_daemon_callback — the daemon's HARNESS CALLBACK listener
        # (gibson.service.callback.port, 50001), NOT the main gRPC port.
        #
        # gibson#1450: HarnessCallbackService is registered on that listener only
        # (gibson internal/engine/harness/callback_server.go). Routing its prefix to
        # gibson_daemon_grpc reached a listener with no such service registered and
        # no UnknownServiceHandler, so every off-cluster component call returned
        # codes.Unimplemented AFTER passing jwt_authn, ext_authz and FGA — the
        # service had no working ingress for the components it exists to serve.
        #
        # Same pod, same Service, same SPIFFE identity as gibson_daemon_grpc; only
        # the port differs. It is a separate cluster rather than a second endpoint
        # on the existing one because the two ports serve disjoint service sets and
        # an endpoint list would load-balance across them at random.
        #
        # The callback listener is wrapped in SPIFFE mTLS with
        # AuthorizeOneOf(GIBSON_CALLBACK_PEER_SVIDS...) and admits Envoy by its
        # SVID, then applies a per-peer METHOD policy on top of the ext_authz/FGA
        # decision made at this edge. That second gate is why the fix fronts this
        # listener instead of registering the service on :50051: RPCs the daemon has
        # no handler for (DevboxExec, GetPlanContext, ReportStepHints) stay denied
        # at the listener even though the route above forwards their prefix.
        # -------------------------------------------------------------------------
        - name: gibson_daemon_callback
          type: STRICT_DNS
          connect_timeout: 5s
          # Matches gibson_daemon_grpc: re-resolve quickly so a rolled daemon pod's
          # new endpoint is picked up (deploy#864).
          dns_refresh_rate: 5s
          respect_dns_ttl: false
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              common_http_protocol_options:
                idle_timeout: 30s
              explicit_http_config:
                http2_protocol_options:
                  # Same PING-based liveness as gibson_daemon_grpc — this cluster
                  # is pinned to the same StatefulSet pod and goes dead the same way
                  # when it rolls (deploy#864).
                  connection_keepalive:
                    interval: 10s
                    timeout: 5s
          # Envoy → daemon mTLS via SPIRE SDS, identical to gibson_daemon_grpc:
          # Envoy presents spiffe://<td>/platform/envoy (which is what the callback
          # listener's AuthorizeOneOf allowlist admits) and pins the daemon's SVID.
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: "gibson-gibson-workloads"
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://zeroroot.ai/platform/daemon"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: gibson_daemon_callback
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          # Same Service as gibson_daemon_grpc (see the naming note
                          # there — the bare release name is the neo4j subchart's
                          # Service, not the daemon's).
                          address: "gibson-gibson-workloads"
                          port_value: 50001
    
        - name: gibson_dashboard
          type: STRICT_DNS
          connect_timeout: 5s
          # Plain HTTP/1.1 upstream to the dashboard. The Next.js standalone
          # server runs Node http (HTTP/1.1, no h2c) and has no SPIFFE TLS
          # terminating sidecar in the dashboard pod, so an SDS-mediated mTLS
          # handshake fails with WRONG_VERSION_NUMBER. Browser→Envoy at
          # app.<domain>:30443 still terminates TLS at the edge with the
          # cert-manager-issued cert; Envoy→dashboard is intra-cluster plain
          # HTTP (NetworkPolicy + the cluster network plane gate access).
          #
          # If a future hardening spec adds a SPIFFE-aware sidecar (envoy
          # sidecar or spiffe-helper) to the dashboard pod, restore the
          # transport_socket + http2 explicit_http_config blocks here.
          load_assignment:
            cluster_name: gibson_dashboard
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: "gibson-dashboard"
                          port_value: 3000
    
        # deploy#1034 — docs site (core optional-by-toggle docs-svc).
        # ghcr.io/zeroroot-ai/docs-site (Apache-2.0). Core component: present in
        # self-hosted AND SaaS. When docs is toggled off (.Values.docs.enabled=false),
        # no docs-svc Service exists → STRICT_DNS yields no endpoints → 503.
        # The dashboard's DOCS_URL env var provides the fail-safe public link.
        - name: gibson_docs_svc
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: gibson_docs_svc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: "gibson-docs-svc"
                          port_value: 8080
    
        # gibson#623 — daemon's dedicated native-login bootstrap listener (:8085).
        # Plaintext HTTP/1.1: the endpoint is unauthenticated by design and serves
        # only non-secret data (issuer, public client id, scopes), so unlike the
        # gRPC and metrics listeners it carries no SPIFFE mTLS. Edge TLS still
        # terminates at Envoy; Envoy→daemon:8085 is intra-cluster plain HTTP.
        - name: gibson_native_login
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: gibson_native_login
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          # Same daemon Service as gibson_daemon_grpc (deploy#879).
                          address: "gibson-gibson-workloads"
                          port_value: 8085
    
        - name: zitadel_upstream
          type: STRICT_DNS
          connect_timeout: 5s
          dns_refresh_rate: 5s
          respect_dns_ttl: false
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              common_http_protocol_options:
                idle_timeout: 30s
              explicit_http_config:
                # deploy#864: HTTP/2 keepalive so a Zitadel pod roll doesn't leave
                # Envoy pinned to a dead connection (would break the whole auth
                # flow). Same rationale as gibson_daemon_grpc above.
                http2_protocol_options:
                  connection_keepalive:
                    interval: 10s
                    timeout: 5s
          load_assignment:
            cluster_name: zitadel_upstream
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: "gibson-zitadel"
                          port_value: 8080
    
        # Zitadel v4 login UI — a Next.js app serving /ui/v2/login/*.
        # HTTP/1.1 (NOT h2c) unlike the Zitadel API pod.
        - name: zitadel_login
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: zitadel_login
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: "gibson-zitadel-login"
                          port_value: 3000
    
        - name: zitadel_jwks
          type: STRICT_DNS
          connect_timeout: 5s
          # Spec kind-dashboard-bringup-e2e (D3) — JWKS fetched directly from
          # the in-cluster Zitadel Service. Decoupling the JWKS endpoint from
          # the public issuer URL removes the previous loopback-through-Envoy
          # dance that depended on auth.<domain> resolving inside the cluster.
          # Envoy validates the JWT's `iss` claim as a literal string against
          # the configured public issuer, independent of where it fetches
          # JWKS from — so this is safe.
          #
          # Per-environment overrides live on .Values.envoy.zitadel.jwks
          # (rendered into .domains.zitadelJwksHost / port / scheme / uri at
          # template time). Default targets gibson-zitadel:8080 (plain HTTP),
          # which is appropriate in both Kind and EKS where the Zitadel
          # service is namespace-scoped behind NetworkPolicy.
          load_assignment:
            cluster_name: zitadel_jwks
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: "gibson-zitadel.gibson.svc.cluster.local"
                          port_value: 8080
    
        # deploy#1657 — the shared per-client quota service. Envoy →
        # ratelimit pod over SPIFFE mTLS via SPIRE SDS, exactly like ext_authz_grpc
        # below; the pod's own Envoy sidecar terminates it and pins OUR SAN to
        # platform/envoy. The filter that calls this cluster is fail-open
        # (failure_mode_deny: false): an unreachable quota service degrades to the
        # per-pod local_ratelimit fuse, and envoy_ratelimit_failure_mode_allowed
        # counts every request that passed unchecked.
        - name: ratelimit_grpc
          type: STRICT_DNS
          connect_timeout: 1s
          dns_refresh_rate: 5s
          respect_dns_ttl: false
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: "gibson-ratelimit"
              common_tls_context:
                alpn_protocols: ["h2"]
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://zeroroot.ai/platform/ratelimit"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: ratelimit_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: gibson-ratelimit
                          port_value: 8081
    
        - name: ext_authz_grpc
          type: STRICT_DNS
          connect_timeout: 2s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          # Envoy → ext-authz SPIFFE mTLS via SPIRE SDS. ext-authz's gRPC
          # listener is RequireAndVerifyClientCert (ext-authz takes its server
          # cert and the client trust bundle from SPIRE);
          # without a transport_socket here Envoy connects plain TCP, the
          # TLS handshake EOFs, every ext_authz check errors, and Envoy's
          # failure_mode_allow:false returns grpc-status:7 (permission_denied)
          # with an empty body to the caller. Mirrors the gibson_daemon_grpc
          # cluster's SDS setup directly above — only the SAN matcher differs.
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: "gibson-ext-authz"
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: "default"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:
                      - san_type: URI
                        matcher:
                          exact: "spiffe://zeroroot.ai/platform/ext-authz"
                  validation_context_sds_secret_config:
                    name: "ROOTCA"
                    sds_config:
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services:
                          - envoy_grpc:
                              cluster_name: spire_agent
          load_assignment:
            cluster_name: ext_authz_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          # The ext-authz Service template hardcodes
                          # `name: gibson-ext-authz` (no release prefix). The
                          # chart's mix of release-prefixed and non-prefixed
                          # names predates the gibson-workloads split; the
                          # Service name is the load-bearing identity here, so
                          # this dial address matches it directly. Previously
                          # this read `gibson-ext-authz` (= e.g.
                          # gibson-workloads-ext-authz), which has no Service
                          # → Envoy's ext_authz cluster had zero healthy
                          # endpoints → every authenticated daemon RPC failed
                          # with empty grpc-status 7 (permission_denied) from
                          # the ext_authz failure_mode_allow:false path.
                          address: "gibson-ext-authz"
                          port_value: 9001
    
        # The admin interface on loopback, for the admin_probe listener only.
        - name: envoy_admin_loopback
          type: STATIC
          connect_timeout: 0.25s
          load_assignment:
            cluster_name: envoy_admin_loopback
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 9902 }
---
# Source: gibson/charts/gibson-workloads/templates/ext-authz/configmap-registry.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gibson-extauthz-rpc-registry
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ext-authz
  annotations:
    gibson.zeroroot.ai/sdk-version: "v0.124.3"
    gibson.zeroroot.ai/sdk-registry: "ghcr.io/zeroroot-ai/internal-authz-registry"
    gibson.zeroroot.ai/registry-source: "init-container-pull"
data:
  README.md: |
    This ConfigMap intentionally carries no rpc_registry.yaml data when
    sdk.bypassRegistryValidation=false. The ext-authz Deployment's init
    container pulls registry.yaml from the SDK OCI artifact at
    oci://ghcr.io/zeroroot-ai/internal-authz-registry:v0.124.3 into a
    shared emptyDir at /etc/gibson/registry.yaml. The main container
    reads from the same path.

    This ConfigMap exists for two reasons:
      1. The sdk-version annotation lets validateRegistryFromSDK detect
         a real SDK pin.
      2. Hashing this ConfigMap into the Deployment's
         checksum/registry annotation forces a rolling restart on
         sdk.version bumps, which re-runs the init container with the
         new pin.

    For the air-gapped path (sdk.bypassRegistryValidation=true with
    sdk.embeddedRegistry set), this ConfigMap's data carries the
    rpc_registry.yaml content directly and the init container is
    skipped.
---
# Source: gibson/charts/gibson-workloads/templates/gibson/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gibson-gibson-workloads-config
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: daemon
data:
  gibson.yaml: |
    # Gibson Framework Configuration
    # Generated by Helm chart

    core:
      # Spec 3 R3 — daemon runs as nonroot uid 65532; HOME is /var/lib/gibson.
      home_dir: /var/lib/gibson/.gibson

    security:
      key_provider:
        type: "file"
        file:
          path: "/etc/gibson-kek/master-key"

    # Authentication and Authorization Configuration
    # Mode determines the authentication strategy
    auth:
      # Mode: dev (static tokens), enterprise (customer IdP), saas (multi-tenant)
      mode: "dev"

      # Tenant claim extraction for multi-tenant deployments
      tenant_claim: "tenant_id"
      # Default tenant for single-tenant or dev deployments

      # Clock skew tolerance for token expiry validation
      clock_skew: "30s"

      # Trust localhost connections without authentication (dev only)
      # SPIFFE/SPIRE workload identity configuration
      spiffe:
        trust_domain: "zeroroot.ai"
        workload_api_socket: "/run/spire/sockets/api.sock"
      # Local tokens are for dev mode only (no K8s, no SSO).
      local:
        users:

    logging:
      level: info

    registry:
      type: platform
      namespace: gibson

    daemon:
      grpc_address: 0.0.0.0:50051

    callback:
      # Spec 3 §1 R1 — callback listener moves to 127.0.0.1:50001. The R1
      # SPIFFE-mTLS wrapper binds the externally-reachable cert-bound listener
      # in core/gibson/internal/callback (daemon-Go agent owns the wiring); the
      # in-process plain listener here is loopback-only and used by the
      # in-process registration path. Override via gibson.config.callback.listenAddress
      # for legacy overlays that need the old 0.0.0.0 bind.
      enabled: true
      listen_address: "127.0.0.1:50001"
      # The address handed to agents as their callback endpoint. It must be
      # the PUBLIC edge, not the in-cluster Service name: a sandboxed agent
      # runs under setec's containment, which resolves names through public
      # resolvers only and denies the operator's reserved ranges, so a
      # .svc.cluster.local name is neither resolvable nor reachable from
      # there. An agent running off-cluster (the Claude Code plugin on a
      # laptop) has never been able to use the internal name either. Envoy
      # already routes gibson.harness.v1.HarnessCallbackService for exactly
      # these callers, so both reach the daemon by the same path.
      advertise_address: "api.localhost.zeroroot.ai:443"

    registration:
      enabled: true
      port: 50100

    redis:
      url: redis://:${REDIS_PASSWORD}@gibson-redis-stack:6379
      # Spec 3 R11 — password is injected at runtime via REDIS_PASSWORD env
      # var (sourced from gibson.redisPasswordSecretName/Key) so the literal
      # never appears in this ConfigMap.
      password: ${REDIS_PASSWORD}
      database: 0
      pool_size: 10
      connect_timeout: 5s
      read_timeout: 30s
      write_timeout: 30s
    dashboard_postgres:
      host: platform-postgres-rw.gibson.svc.cluster.local
      port: 5432
      database: "gibson_platform"
      username: "gibson_platform"
      # Password injected from DASHBOARD_DB_PASSWORD env var at runtime
      password: ${DASHBOARD_DB_PASSWORD}
      ssl_mode: "require"
      max_conns: 10
    # Per-tenant admin Postgres — host, port and ssl_mode, which are the keys
    # the daemon still binds. admin_username, admin_password and admin_database
    # are NOT rendered: gibson#599 and D78 unbound them, so viper dropped them in
    # silence, and the bootstrap credential reaches the tenant-operator instead.
    # Spec: per-tenant-data-plane-completion Req 1, D1, D5; Tasks 6, 25.
    #
    # Host: dataPlane.postgres.host (gibson.tenant.dbHost).
    tenant_postgres:
      host: "platform-postgres-rw.gibson.svc.cluster.local"
      port: 5432
      ssl_mode: "require"

    graphrag:
      neo4j:
        tenant_mode: "instance"

    # Trace export is disabled: the former OTLP trace backend was retired
    # (gibson#755). The daemon's OTel mission tracer installs a no-op
    # exporter; LLM-call provenance now lives in the brain World, read via
    # WorldService. Re-point endpoint + set enabled:true to ship spans to a
    # generic OTLP collector if one is ever wired.
    otel_observability:
      enabled: false
      metrics:
        enabled: false

    # Prometheus metrics listener (Spec security-hardening R20).
    # Daemon-owned :9090 mTLS endpoint; cert material mounted from the
    # `gibson-daemon-metrics-tls` Secret (templates/cert-manager/component-
    # certificates.yaml + the StatefulSet volumeMount below). All three
    # paths must resolve to readable files at startup; the daemon refuses
    # to start otherwise.
    metrics:
      enabled: true
      port: 9090
      listen_address: ":9090"
      tls:
        cert_path: "/etc/gibson/tls/metrics/tls.crt"
        key_path: "/etc/gibson/tls/metrics/tls.key"
        client_ca_path: "/etc/gibson/tls/metrics/ca.crt"

    authz:
      # One-code-path slice deploy#195: FGA is always required.
      # The daemon no longer accepts `enabled: false` or
      # `require_ready: false`; both fields were silent-allow surfaces and
      # have been deleted from the binary. The chart still emits `enabled: true`
      # for backwards compatibility with older daemon images.
      enabled: true
      provider: openfga
      fga:
        endpoint: https://gibson-openfga:8080
        store_id: ""
        model_id: ""
        timeout_ms: 4000
        tls:
          enabled: true
          ca_file: "/etc/ssl/fga-ca/ca.crt"
    # sandbox: the Setec connection details, and the ONLY surface the daemon
    # reads them from (config.SandboxConfig, gibson
    # internal/infra/config/sandbox.go). Per-tool registration (the old
    # sandbox.tools.* block) was removed under the executor-catalog spec.
    # Tools are kind:tool catalog manifests inside the daemon image;
    # each names the shared gibson-executor image and selects a parser by
    # GIBSON_TOOL_NAME. The runtime catalog refresher was removed (gibson#1641).
    #
    # address and spiffe_id are DERIVED, not restated (deploy#1106,
    # ADR-0142): they have to agree with where the setec subchart puts the
    # frontend and with the SPIFFE ID this chart registers for it, and a
    # disagreement produces no render error — just a dial timeout or a
    # handshake failure at the first sandboxed tool call. The daemon always
    # dials setec (D5, gibson#756): there is no enabled switch, and the
    # daemon sends the tenant in each request, so no fixed tenant is
    # configured.
    sandbox:
      setec:
        address: "setec-frontend.setec-system.svc.cluster.local:50051"
        # spiffe_id: the fleet frontend is the one server the daemon accepts.
        # The daemon dials with its own SVID from the Workload API (gibson
        # internal/server/daemon/sandboxed_setec_adapter.go).
        spiffe_id: "spiffe://zeroroot.ai/platform/setec-frontend"
        call_timeout: "5m"
        sandbox_class: "tool"
        # agent_sandbox_class: the class an ephemeral platform-agent launch
        # names. Named explicitly, never inherited from the cluster
        # default — the daemon's agent launcher refuses an empty
        # class. Separate from sandbox_class (tool/catalog dispatch) so the
        # agent workload can carry a different isolation posture.
        agent_sandbox_class: "agent"
---
