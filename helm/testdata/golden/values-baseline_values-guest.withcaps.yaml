# Source: gibson/charts/gibson-workloads/templates/tests/01-service-reachability.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "gibson-gibson-workloads-test-service-reachability"
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    helm-test/keep: "false"
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/kube-api: "true"
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  # The probe does not call the Kubernetes API, so the pod mounts no
  # ServiceAccount token (ADR-0165, charts#394).
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: "ghcr.io/zeroroot-ai/mirror/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b"
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          # set -e: any probe failure aborts.
          # set -u: typo in a service name surfaces as "unbound variable", not a silent skip.

          ERR='::error file=helm-test::'

          DAEMON_SVC='gibson-gibson-workloads'
          DAEMON_GRPC_PORT='50051'
          DAEMON_METRICS_PORT='9090'

          DASHBOARD_SVC='gibson-dashboard'
          DASHBOARD_PORT='3000'

          EXT_AUTHZ_HTTP_PORT='9002'

          OPENBAO_PORT='8200'
          OPENBAO_SVC='gibson-openbao'

          REDIS_SVC='gibson-redis-stack'
          REDIS_PORT='6379'

          ENVOY_PORT='443'

          probe_http() {
            local label="$1" url="$2" want="${3:-200}"
            echo "[svc-probe] $label  $url"
            # -k: dev kind uses self-signed envoy cert; this probe is a
            #     reachability test, not a cert-chain test.
            # --max-time: bound failure latency so a hung Service doesn't
            #              swallow the rest of the run.
            code=$(curl -ksS -o /tmp/body -w '%{http_code}' --max-time 10 "$url" || echo "000")
            if [ "$code" != "$want" ]; then
              echo "$ERR $label probe failed: $url returned HTTP $code (want $want)"
              [ -s /tmp/body ] && echo "[svc-probe] body: $(head -c 200 /tmp/body)"
              return 1
            fi
            echo "[svc-probe] $label OK ($code)"
          }

          probe_tcp() {
            local label="$1" host="$2" port="$3"
            echo "[svc-probe] $label  ${host}:${port} (TCP)"
            # curl --connect-timeout drives this — we only care that the
            # TCP handshake completes; the Service is bound and routing.
            # telnet/nc are not in curlimages/curl, but curl's -v on
            # an explicit `tcp://` URL tries the connection.
            if curl -ksS --connect-timeout 10 -o /dev/null "telnet://${host}:${port}" 2>/dev/null ; then
              echo "[svc-probe] $label OK"
              return 0
            fi
            # Fallback: try /dev/tcp via sh — curl's telnet support may
            # be off in the image.
            if (echo > "/dev/tcp/${host}/${port}") 2>/dev/null ; then
              echo "[svc-probe] $label OK (via /dev/tcp)"
              return 0
            fi
            echo "$ERR $label TCP probe failed: ${host}:${port} not reachable"
            return 1
          }

          probe_tls() {
            local label="$1" host="$2" port="$3"
            echo "[svc-probe] $label  https://${host}:${port}/  (TLS handshake)"
            # Just want a TLS handshake; don't validate the chain (Envoy edge
            # cert chain is tested elsewhere). 4xx/5xx after handshake is OK
            # — Envoy will return 404 with no Host SNI match, and we only
            # care that the listener is up.
            code=$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 "https://${host}:${port}/" || echo "000")
            if [ "$code" = "000" ]; then
              echo "$ERR $label TLS handshake failed: https://${host}:${port}/"
              return 1
            fi
            echo "[svc-probe] $label OK (TLS up; HTTP code=$code)"
          }

          # --- probes ---------------------------------------------------

          probe_tcp  "daemon-grpc"   "$DAEMON_SVC" "$DAEMON_GRPC_PORT"
          probe_http "daemon-metrics" "http://${DAEMON_SVC}:${DAEMON_METRICS_PORT}/metrics" "200"

          probe_http "dashboard"     "http://${DASHBOARD_SVC}:${DASHBOARD_PORT}/api/health" "200"

          # ext-authz HTTP exposes /healthz on extAuthz.ports.http.
          probe_http "ext-authz"     "http://gibson-ext-authz:${EXT_AUTHZ_HTTP_PORT}/healthz" "200"

          probe_tls  "envoy"         "gibson-envoy" "$ENVOY_PORT"

          probe_tcp  "redis"         "$REDIS_SVC" "$REDIS_PORT"

          # Vault: standby + sealed-but-up returns 204 (livenessProbe pattern in
          # the Vault Deployment).  Accept either 200 or 204.
          code=$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 10 \
            "http://${OPENBAO_SVC}:${OPENBAO_PORT}/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204" || echo "000")
          case "$code" in
            200|204|429|473)
              echo "[svc-probe] openbao OK ($code; openbao returns 429=standby, 473=DR-standby, 204=sealed, 200=ready)"
              ;;
            *)
              echo "$ERR openbao probe failed: HTTP $code"
              exit 1
              ;;
          esac

          # Sibling-application services: OpenFGA, Zitadel, Neo4j. They are
          # structural on every profile (ADR-0083), so an unreachable one is a
          # failed install, not a soft warning. These three used to end in
          # `|| true`, which made this test unable to fail on them. Deep
          # contract checks live in their dedicated test pods.
          probe_http "openfga"       "https://gibson-openfga:8080/healthz" "200"
          probe_http "zitadel"       "http://gibson-zitadel:8080/debug/ready" "200"
          probe_tcp  "neo4j-bolt"    "gibson-neo4j" "7687"

          echo ""
          echo "[svc-probe] all first-party probes PASSED"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
  imagePullSecrets:
    - name: ghcr-credentials
---
# Source: gibson/charts/gibson-workloads/templates/tests/02-bootstrap-secrets.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "gibson-gibson-workloads-test-bootstrap-secrets"
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    helm-test/keep: "false"
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/kube-api: "true"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "0"
spec:
  restartPolicy: Never
  serviceAccountName: "gibson-gibson-workloads-test-bootstrap-reader"
  containers:
    - name: probe
      image: "ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='::error file=helm-test::'
          NS='gibson'

          # secret_has_key NAMESPACE NAME KEY
          # Returns 0 if the secret exists, the key is set, and the
          # decoded value is non-empty. Logs a clear `::error::` line and
          # returns 1 on any failure.
          secret_has_key() {
            local ns="$1" name="$2" key="$3"
            if ! kubectl -n "$ns" get secret "$name" >/dev/null 2>&1 ; then
              echo "$ERR Secret missing: $ns/$name"
              return 1
            fi
            # kubectl -o jsonpath strips quotes; base64 -d on an absent key
            # would still exit 0 with empty output, so we use a templated
            # jsonpath that prints "MISSING" when the key isn't present.
            val=$(kubectl -n "$ns" get secret "$name" -o "jsonpath={.data.${key}}" 2>/dev/null || echo "")
            if [ -z "$val" ]; then
              echo "$ERR Secret $ns/$name has no value for key '$key'"
              return 1
            fi
            decoded=$(printf '%s' "$val" | base64 -d 2>/dev/null || echo "")
            if [ -z "$decoded" ]; then
              echo "$ERR Secret $ns/$name key '$key' decoded to empty string"
              return 1
            fi
            echo "[bootstrap-secrets] OK $ns/$name key=$key (len=$(printf '%s' "$decoded" | wc -c))"
          }

          # --- structural Secrets (always expected in every overlay) ----

          # Master-KEK Secret is platform-operator-owned. The chart names it via
          # tests.bootstrap.masterKeySecret; defaults to gibson-master-key
          # which matches the gibson-operators chart's default
          # platformBootstrap.masterKey.secretName. Overlays that rename
          # the Secret should set .tests.bootstrap.masterKeySecret too.
          MASTER_KEY_SECRET='gibson-master-key'
          secret_has_key "$NS" "$MASTER_KEY_SECRET" "master-kek-id"

          # Dashboard OIDC Secret materialized by the OIDCClient reconcile.
          secret_has_key "$NS" "gibson-dashboard-oidc" "client_id"
          secret_has_key "$NS" "gibson-dashboard-oidc" "client_secret"

          # The Zitadel owner credentials (iam-admin-pat, iam-admin, the System
          # API key) and the OpenBao platform-operator token (gibson-openbao-keys,
          # which can read the escrowed copies) are not checked here. Only
          # bootstrap may read them (scripts/check-owner-credential-readers.py),
          # and a test that reads them would be one more reader. The
          # platform-operator's PlatformBootstrap conditions prove both work.

          # Dashboard MACHINE_USER PAT.
          # Default `gibson-zitadel-dashboard` matches gibson-operators
          # values; overlays may override via .tests.bootstrap.dashboardPatSecret.
          DASH_PAT_SECRET='gibson-zitadel-dashboard'
          DASH_PAT_KEY='pat'
          # If the dashboard PAT Secret doesn't exist (overlay without
          # serviceUsers), skip with a SKIPPED log line rather than fail.
          if kubectl -n "$NS" get secret "$DASH_PAT_SECRET" >/dev/null 2>&1 ; then
            secret_has_key "$NS" "$DASH_PAT_SECRET" "$DASH_PAT_KEY"
          else
            echo "[bootstrap-secrets] SKIP $DASH_PAT_SECRET (no dashboard MACHINE_USER configured in overlay)"
          fi

          echo ""
          echo "[bootstrap-secrets] all structural Secret keys present and non-empty"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
  imagePullSecrets:
    - name: ghcr-credentials
