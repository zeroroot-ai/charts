# Source: gibson/charts/gibson-operators/templates/reloader/reloader.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reloader
  namespace: gibson
  labels:
    app.kubernetes.io/name: reloader
    app.kubernetes.io/component: reloader
rules:
  # patch on a workload's pod template is a platform-identity grant, not a
  # restart button: Kubernetes has no `serviceaccounts/use` verb, so whoever
  # can rewrite `.spec.template` can set the image, the command and
  # `serviceAccountName`, and so become that workload (deploy#1210). RBAC
  # cannot restrict a patch to one field path, so the narrowing available is
  # the object name. The write rule names exactly the workloads that carry a
  # `*.reloader.stakater.com/reload` annotation (values.yaml
  # reloader.rollouts), and scripts/check-reloader-namespaced.py fails the
  # build when the two lists differ, in either direction.
  #
  # `patch` only. Reloader v1.4.6 rolls a Deployment or StatefulSet with a
  # strategic-merge patch of the pod template annotation
  # (internal/pkg/handler/upgrade.go: SupportsPatch is true for both), so
  # `update` is never used. get, list and watch cannot be limited by name:
  # the informers list every Deployment and StatefulSet to find the
  # annotated ones.
  #
  # `daemonsets` is NOT here. No DaemonSet in any of the three charts carries
  # a reload annotation. Re-add it only together with the DaemonSet that
  # needs it.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list", "get", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["gibson-dashboard","gibson-envoy","gibson-ext-authz","gibson-openfga","gibson-tenant-operator","gibson-zitadel","gibson-zitadel-login"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["gibson-gibson-workloads","gibson-redis-stack"]
    verbs: ["patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
