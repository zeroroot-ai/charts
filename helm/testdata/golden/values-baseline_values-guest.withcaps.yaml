# Source: gibson/templates/postgres/platform-postgres-cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  namespace: gibson
  labels:
    # Desired state, excluded from the Velero backup (deploy#1735, CONTEXT.md
    # § Velero backup). The chart renders this CR on every sync, and Postgres
    # data travels through its own barman archive. A restore that carried
    # this CR, or a file-system copy of its volumes restored over a
    # `bootstrap.recovery`, would re-initialize the database over the
    # recovered one. `inheritedMetadata` below puts the same label on every
    # pod and PVC the operator derives from this CR, which is what keeps
    # those volumes out of the file-system backup.
    velero.io/exclude-from-backup: "true"
  annotations:
    # Regular resource (never a hook — a hook-delete-policy would delete the
    # database cluster) at wave -7: with the postgres-setup ServiceAccount (-7), after
    # the folded ExternalSecrets (-8), and BEFORE the -6 Sync-hook setup Jobs
    # that poll this CR's .status.currentPrimary. See the wave ordering note
    # in values.yaml (deploy#820).
    argocd.argoproj.io/sync-wave: "-7"
    # The CNPG CRD ships in the same sync (cnpg dependency alias, wave 0), so
    # the first dry-run can land before the CRD is registered. Tolerate it and
    # let the Application's retry converge — same belt-and-suspenders the old
    # gitops postgres-clusters Application carried. ServerSideApply matches
    # how that Application applied this CR.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
spec:
  # Every object the CNPG operator derives from this CR (the instance pods,
  # the data and WAL PVCs) is desired state with its data in the barman
  # archive, so it carries the same Velero exclude label the CR itself does.
  # Without this, `defaultVolumesToFsBackup` copies the live Postgres volumes
  # into the backup, and a restore lays them over a `bootstrap.recovery`
  # (deploy#1735).
  inheritedMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
      # The network labels of each instance and each CNPG Job (ADR-0165 rule
      # 4, D76): the Postgres data store, a client of its own replicas, the
      # API server for the instance manager, and the archive bucket. The
      # bucket is the object-store egress group: AWS S3 or backup.endpointURL.
      gibson.zeroroot.ai/net-role: datastore
      gibson.zeroroot.ai/datastore: postgres
      gibson.zeroroot.ai/client-postgres: "true"
      gibson.zeroroot.ai/kube-api: "true"
      gibson.zeroroot.ai/egress-fqdn: object-store
  instances: 3
  # A primary roll promotes a replica first, then restarts the old primary as
  # a replica. `restart` would take the primary down before anything else.
  primaryUpdateMethod: switchover
  # The operator performs that switchover on its own. `supervised` waits for
  # a human, which no recreate has.
  primaryUpdateStrategy: unsupervised
  # The operator's PodDisruptionBudgets: a drain cannot evict the primary and
  # cannot take the last replica.
  enablePDB: true
  storage:
    size: 10Gi
  # WAL on its own volume: a full data volume never stops WAL, and a WAL burst
  # never fills the data volume.
  walStorage:
    size: 5Gi
  # One instance per topology domain, enforced, not preferred. A node with no
  # label for the key matches no rule, so kind and a single-node self-host
  # schedule every instance anyway.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
  postgresql:
    # postgresql.conf. archive_timeout is the recovery point objective for
    # unplanned loss: a WAL segment is shipped to
    # the durable bucket at least every 300 s, even when the platform writes
    # too little to fill one. Rendered on every profile, including one
    # instance on kind.
    parameters:
      archive_timeout: 300s
    # A commit returns only after `number` standbys have the WAL on disk, and
    # `required` keeps that true when a standby is down: writes then wait
    # rather than land on one copy. Rendered only above one instance, because
    # a single instance has no standby to wait for and CNPG rejects
    # number >= instances.
    synchronous:
      method: any
      number: 1
      dataDurability: required
  # CNPG-owned superuser secret (deploy#652) — see the header note.
  enableSuperuserAccess: true
  resources:
    limits:
      cpu: 2
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      # The owner is `postgres`, so its Secret is the superuser Secret (see
      # ONE SECRET FOR THE ROLE `postgres` in the header).
      secret:
        name: platform-postgres-superuser
  # Continuous backup to the durable bucket (deploy#1496,
  # deploy#1730). Setting barmanObjectStore is what turns on WAL archiving:
  # CNPG rewrites archive_command to ship every completed segment here. A
  # base backup without its WAL restores only to the instant it was taken,
  # and WAL without a base backup restores nothing, so the ScheduledBackup
  # below is the other half. An UNREACHABLE destination fills the WAL volume
  # and eventually stops Postgres accepting writes, which is why the
  # destination and both credential Secrets are required at render time.
  #
  # No retentionPolicy, on purpose. Barman prunes the object store FROM THE
  # INSTANCE PODS, which needs a credential that can delete. The platform
  # credential cannot (preflight proves it): a compromised primary must not
  # be able to destroy the copies that would have recovered it. Retention is
  # the durable bucket's lifecycle rule on backups/ and nothing else.
  backup:
    # prefer-standby takes the base backup from a replica, so the primary
    # never carries it. It falls back to the primary on its own at
    # instances: 1 (kind), so one value is correct for every profile.
    target: "prefer-standby"
    barmanObjectStore:
      destinationPath: "s3://example-durable-bucket/backups/postgres/"
      # No `encryption:` key. Server-side encryption is the bucket's default
      # and naming an algorithm here would override it with a weaker one.
      # The credential is the bucket member of the bringup keyring, written
      # into this namespace by the bringup BEFORE the chart syncs. The chart
      # renders no Secret for it.
      s3Credentials:
        accessKeyId:
          name: "bringup-keyring"
          key: "bucket-access-key"
        secretAccessKey:
          name: "bringup-keyring"
          key: "bucket-secret-key"
      wal:
        compression: "gzip"
        maxParallel: 4
      data:
        compression: "gzip"
        jobs: 2
