# Source: gibson/charts/gibson-workloads/templates/ext-authz/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibson-ext-authz
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ext-authz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gibson-workloads
      app.kubernetes.io/instance: gibson
      app.kubernetes.io/component: ext-authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-workloads
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: ext-authz
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/client-postgres: "true"
        gibson.zeroroot.ai/client-redis: "true"
        gibson.zeroroot.ai/client-openbao: "true"
        gibson.zeroroot.ai/kube-api: "true"
      annotations:
        # Velero fs-backup (defaultVolumesToFsBackup on the shipped Schedule)
        # snapshots every pod volume it is not told to skip. These hold a
        # socket, a scratch dir or an init-rendered file: nothing to keep,
        # and on restore each one becomes a PodVolumeRestore that can only
        # finish once this pod is running. Measured 2026-09-07: 9 of 22
        # PodVolumeRestores in a preserve backup were volumes like these.
        # scripts/check-velero-volume-excludes.sh keeps this list equal to
        # the pod's emptyDir and CSI-ephemeral volumes.
        backup.velero.io/backup-volumes-excludes: "spire-agent-socket,tmp"
        checksum/registry: c1c29512582a893a867405ae14499183f952c17ed756544d689ca1b5877c2c5c
        checksum/daemon-registry: 1aefec506e4e855d4c7619472786376435758fa29be3234389f9c42a93036671
        configmap.reloader.stakater.com/reload: "gibson-fga-config"
        secret.reloader.stakater.com/reload: "gibson-dashboard-oidc,gibson-native-login-oidc,gibson-ext-authz-health-tls"
    spec:
      
      imagePullSecrets:
        - name: ghcr-credentials
      serviceAccountName: gibson-ext-authz
      priorityClassName: gibson-platform-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gibson-workloads
              app.kubernetes.io/instance: gibson
              app.kubernetes.io/component: extAuthz
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gibson-workloads
                    app.kubernetes.io/instance: gibson
                    app.kubernetes.io/component: extAuthz
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-spire-socket
          image: ghcr.io/zeroroot-ai/mirror/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c']
          args:
            - |
              # deploy#201: SPIRE is required infrastructure. Fail-fast (60s) if the
              # Workload API socket is not present on this node — a missing socket
              # means the SPIRE agent DaemonSet is unhealthy and SPIFFE-consuming
              # workloads MUST NOT proceed (their mTLS / JWT-SVID minting would
              # silently hang otherwise).
              SOCK="/run/spire/agent/spire-agent.sock"
              DEADLINE=$(( $(date +%s) + 60 ))
              echo "[wait-for-spire-socket] waiting for ${SOCK} (timeout: 60s)..."
              until [ -S "${SOCK}" ]; do
                if [ $(date +%s) -ge ${DEADLINE} ]; then
                  echo "[wait-for-spire-socket] ERROR: ${SOCK} not present after 60s; SPIRE agent DaemonSet is not healthy on this node. Fix the SPIRE control plane before this pod can start." >&2
                  exit 1
                fi
                sleep 1
              done
              echo "[wait-for-spire-socket] ok"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent
              readOnly: true
        - name: wait-for-fga-config
          image: ghcr.io/zeroroot-ai/mirror/kubectl:1.31.4@sha256:64614ef8290f3fb27fed5164b338debeeb79a1e5e26c93eb920770b71abd7c48
          command: ['/bin/bash', '-c']
          args:
            - |
              set -eu
              ns="gibson"
              echo "[wait-for-fga-config] waiting for ConfigMap ${ns}/gibson-fga-config (store_id key, timeout: 300s)..."
              for i in $(seq 1 150); do
                val=$(kubectl get configmap -n "${ns}" gibson-fga-config \
                      -o jsonpath='{.data.store_id}' 2>/dev/null || true)
                if [ -n "${val}" ]; then
                  echo "[wait-for-fga-config] ok (store_id=${val})"
                  exit 0
                fi
                echo "[wait-for-fga-config] not ready (attempt ${i}/150), retrying in 2s..."
                sleep 2
              done
              echo "[wait-for-fga-config] ERROR: gibson-fga-config not populated after 300s." \
                   "Check: kubectl logs -n ${ns} -l app.kubernetes.io/component=fga-init" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-redis
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          command: ['sh', '-c']
          args:
            - |
              until nc -z gibson-redis-stack 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: ext-authz
          image: "ghcr.io/zeroroot-ai/ext-authz:v0.154.0@sha256:394bfc66f423cf706a72b0abd1a8dddfd741662831eaa950b094d326ef31f738"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: 9001
              protocol: TCP
            - name: http
              containerPort: 9002
              protocol: TCP
          env:
            - name: EXT_AUTHZ_LOG_LEVEL
              value: "info"
            - name: EXT_AUTHZ_GRPC_ADDR
              value: ":9001"
            - name: EXT_AUTHZ_HTTP_ADDR
              value: ":9002"
            - name: EXT_AUTHZ_FGA_ADDR
              value: "https://gibson-openfga:8080"
            # Redis is required (ADR-0045, charts#397). ext-authz does not start
            # without EXT_AUTHZ_REDIS_URL or when Redis does not answer, and a
            # component call fails closed (Unavailable) when Redis goes down at
            # request time. Redis holds the replay state of component tokens,
            # shared by every replica, and carries the FGA write events
            # (hosted#204) on the channel gibson:fga.write. Same Redis and the
            # same password Secret as the daemon. make extauthz-redis fails a
            # profile whose ext-authz pod lacks either variable.
            - name: EXT_AUTHZ_REDIS_URL
              value: "redis://:${REDIS_PASSWORD}@gibson-redis-stack:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibson-redis-stack
                  key: redis-password
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/extauthz/tls/fga-ca"
            # deploy#190 M4: `optional: true` removed. The wait-for-fga-config
            # init container (above) blocks until gibson-fga-config exists with
            # a non-empty store_id, so kubelet resolves these env vars against
            # the populated ConfigMap at main-container start time.
            - name: EXT_AUTHZ_FGA_STORE_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: store_id
            - name: EXT_AUTHZ_FGA_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: model_id
            - name: EXT_AUTHZ_CGJWT_ISSUER
              value: "https://api.localhost.zeroroot.ai"
            # Default (deploy#852): fetch the registry from the daemon's mTLS
            # authz-registry endpoint, pinning the daemon's SVID so a
            # poisoned/impersonated source can never feed ext-authz a forged
            # enforcement policy. Single source of truth — no version pin, no
            # drift.
            - name: EXT_AUTHZ_REGISTRY_URL
              value: "https://gibson-gibson-workloads:8086/authz/registry.yaml"
            - name: EXT_AUTHZ_DAEMON_SVID
              value: "spiffe://zeroroot.ai/platform/daemon"
            - name: EXT_AUTHZ_REGISTRY_FETCH_TIMEOUT
              value: "600s"
            # Per-kid Capability-Grant key descriptor endpoint (ext-authz#103). ext-authz fetches GET {KEYS_URL}/{kid} to verify a
            # component's self-signed agent+jwt and resolve its daemon-asserted
            # principal + tenant. Reached DIRECTLY on the pod network — the
            # platform network policy lets ext-authz reach daemon:8086 —
            # never through the Envoy edge, which no longer publishes the
            # route at all (GHSA-88fg / GHSA-9q4v).
            # Unset ⇒ component CG-JWT auth disabled.
            #
            # SVID-PINNED mTLS ON :8086 (deploy#1386, closing deploy#1187).
            # This was `http://…:8085` — the daemon's plaintext bootstrap
            # listener — for as long as ext-authz's descriptor fetcher was a
            # bare `&http.Client{Timeout: 5s}` with no TLSClientConfig and no
            # SPIFFE source in scope. gibson#1401 threaded the X509Source that
            # the registry fetch already uses into that client, so the fetch now
            # meets the same standard as EXT_AUTHZ_REGISTRY_URL two blocks up
            # (tlsconfig.MTLSClientConfig pinned to EXT_AUTHZ_DAEMON_SVID).
            #
            # WHY IT HAD TO MOVE. The response is not a key set but an identity
            # assertion — {keys, principal, tenant, status} — and ext-authz uses
            # `principal` verbatim as the OpenFGA user, cached 5 minutes per
            # pod. Substituting the document substitutes both the trust anchor
            # and the identity bound to it. NetworkPolicy confined the hop but
            # was never the integrity control: the exposure was never an
            # off-cluster eavesdropper, it was a pod carrying the daemon's
            # selector labels that joins the Service endpoints and answers a
            # share of these requests — a legitimate endpoint as far as the
            # policy is concerned. Only peer authentication closes that.
            #
            # SCHEME IS LOAD-BEARING, NOT COSMETIC. gibson#1401 makes ext-authz
            # REFUSE TO START unless this is https (forbids a flag
            # gating a cutover, and http.Transport applies TLSClientConfig only
            # to https:// URLs, so a scheme-conditional path sits one edit away
            # from silently fetching in the clear). So this value and the
            # ext-authz image pin move TOGETHER: an older image cannot speak
            # mTLS here, and a post-#1401 image will not boot against http.
            # scripts/check-extauthz-transport.py enforces the pairing
            # from the other side — it fails if this becomes https while a
            # waiver line for it survives in
            # scripts/.extauthz-transport-waivers.txt, and vice versa.
            - name: EXT_AUTHZ_CGJWT_KEYS_URL
              value: "https://gibson-gibson-workloads:8086/capabilitygrant/v1/keys"
            # ADR-0093 decision 4: a person's tenant comes from the Zitadel org
            # in their verified token. ext-authz maps the org to the tenant
            # through the daemon's mTLS authz-registry listener. The value must
            # be https and end with a slash (the org id is appended). ext-authz
            # refuses to start without it.
            - name: EXT_AUTHZ_ORG_TENANT_URL
              value: "https://gibson-gibson-workloads:8086/identity/v1/org-tenant/"
            # gibson#133: the OIDC client ids of the human sign-in flows. A
            # token issued to any other client is a machine credential and
            # skips the session gate; without this every machine user's
            # client_credentials token (client_id = its name, sub = its
            # numeric id) read as a person and was denied. The human clients
            # are the dashboard application and the native-login (device
            # grant) client that `gibson login` uses (charts#148: with only
            # the dashboard named, the CLI's token was classed SERVICE and
            # denied every USER-only RPC). The platform-operator mints both
            # ids at runtime, so each is read optionally into its own var and
            # the list is built by $(VAR) expansion, which Kubernetes
            # resolves from env entries defined earlier in this container.
            # A Secret not yet minted leaves its $(VAR) literal, which never
            # matches a client id; the reload annotation restarts ext-authz
            # when either Secret lands.
            - name: EXT_AUTHZ_DASHBOARD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gibson-dashboard-oidc
                  key: client_id
                  optional: true
            - name: EXT_AUTHZ_NATIVE_LOGIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gibson-native-login-oidc
                  key: client_id
                  optional: true
            - name: EXT_AUTHZ_HUMAN_CLIENT_IDS
              value: "$(EXT_AUTHZ_DASHBOARD_CLIENT_ID),$(EXT_AUTHZ_NATIVE_LOGIN_CLIENT_ID)"
            - name: EXT_AUTHZ_ZITADEL_ISSUER
              # MUST equal the `iss` claim Zitadel writes into JWTs. Zitadel
              # constructs iss from {ExternalScheme}://{ExternalDomain}[:{ExternalPort}],
              # so this default mirrors Zitadel's own ExternalDomain — NOT
              # the daemon's api.<domain> host (which is the bug this default
              # once had).
              # Misalignment surfaces as `extauthz.issuer_mismatch` warnings
              # and HTTP 403 "permission denied" on every authenticated
              # daemon RPC. Environment overlays SHOULD override
              # extAuthz.issuer explicitly only for an off-domain Zitadel edge;
              # by default it derives from global.domain (gibson.oidcIssuer =
              # the external origin app.<domain>[:port]), which already folds in
              # the kind :30443 port. The old default hardcoded the retired
              # `auth.<domain>` host (deploy#630 single-host; deploy#642).
              #
              # deploy#1187: this is not only a claim pin — ext-authz resolves
              # the issuer's OIDC discovery document and fetches the JWKS from
              # it, and that key set is what EVERY user JWT is verified
              # against. So the scheme is a trust property, and it is asserted
              # here rather than left to `global.scheme` defaulting to https.
              # An overlay that pointed this at http:// would put the
              # verification keys for every user session on an unauthenticated
              # hop. scripts/check-extauthz-transport.py cannot read the
              # resolved value out of the template (it is one Helm expression),
              # so this render-time check is the control it defers to.
              value: "https://app.localhost.zeroroot.ai"
            # SPIFFE Workload API socket the binary connects to in order to
            # mint/verify identities. Mounted from the host path the SPIRE
            # agent DaemonSet writes to. Required by main.go.
            - name: SPIFFE_ENDPOINT_SOCKET
              value: "unix:///run/spire/sockets/api.sock"
            # Envoy peer SPIFFE ID: pin the gRPC peer (Envoy) to this SVID. It
            # is the ID of the Envoy ClusterSPIFFEID
            # (templates/spire-server/clusterspiffeids.yaml): the trust domain
            # of the install and the fixed path platform/envoy.
            - name: EXT_AUTHZ_ENVOY_SVID
              value: "spiffe://zeroroot.ai/platform/envoy"
          volumeMounts:
            - name: grant-key
              mountPath: /etc/ext-authz/grant-key
              readOnly: true
            # NOTE: sa-identity-map ConfigMap is NOT mounted on ext-authz.
            # The ext-authz binary does not consume it — only the daemon
            # (core/gibson identityresolver) does, for log enrichment.
            # Nesting a separate ConfigMap mount inside the readonly
            # /etc/gibson registry mount fails OCI runtime create with
            # "read-only file system" because the parent mount masks the
            # image-baked /etc/gibson/sa-identity-map directory.
            # SPIRE agent socket — matches SPIFFE_ENDPOINT_SOCKET above.
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # cert-manager-issued TLS of the health listener. The mount path
            # is the binary's default (EXT_AUTHZ_HEALTH_CERT_DIR, gibson
            # cmd/ext-authz/main.go). The gRPC listener uses a SPIRE SVID.
            - name: health-tls
              mountPath: /etc/extauthz/tls/health
              readOnly: true
            # CA that signs the OpenFGA HTTP-listener cert (deploy#1382);
            # picked up via SSL_CERT_DIR above.
            - name: fga-http-ca
              mountPath: /etc/extauthz/tls/fga-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # The /healthz endpoint is served over HTTPS with mandatory client
          # mTLS (RequireAndVerifyClientCert) — the kubelet has no SVID to
          # present, so httpGet probes fail at the TLS handshake. tcpSocket
          # checks the port is bound, which is sufficient given the binary
          # exits on any startup error.
          #
          # startupProbe disables liveness/readiness until the container has
          # had time to: (1) wait for SPIRE Agent to register and issue an
          # SVID, (2) fetch the authz registry from the daemon over mTLS
          # (deploy#852; retries while the daemon comes up), (3) bind port
          # 9002. On a cold kind
          # node or after a host reboot, the SPIFFE CSI mount can take 30-60s
          # to attach because the CSI driver registers only after
          # gibson-spire-agent is Ready. Without the startupProbe, the 5s
          # initialDelaySeconds + 3×10s failureThreshold gave only ~35s total
          # grace — too tight, causing 2-3 restarts per cluster bringup. See
          # deploy#142: `Liveness probe failed: dial tcp ...:9002: connect:
          # connection refused`. With 30×5s=150s of startup budget, kubelet
          # holds off liveness/readiness until the port is bound, then the
          # tighter steady-state probes take over.
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: grant-key
          secret:
            secretName: gibson-extauthz-grant-key
            defaultMode: 0400
        # sa-identity-map volume removed from ext-authz: the binary does
        # not read it, and mounting it inside /etc/gibson collides with the
        # registry mount (OCI runtime: read-only file system). The daemon
        # still mounts it (see gibson/statefulset.yaml) for log enrichment.
        # SPIRE Workload API socket via csi.spiffe.io CSI driver — see spec
        # kind-dashboard-bringup-e2e (D2). hostPath /run/spire/sockets is
        # not exposed by the SPIRE chart; only CSI driver inline volumes
        # reach the workload API.
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # cert-manager-issued Secrets via templates/cert-manager/component-
        # certificates.yaml. tls.crt + tls.key + ca.crt are projected as
        # files at the mount path the binary expects.
        - name: health-tls
          secret:
            secretName: gibson-ext-authz-health-tls
            defaultMode: 0400
        # CA for the OpenFGA HTTP-listener cert (deploy#1382). Only ca.crt
        # is projected — ext-authz must never hold the listener's private
        # key. Sourced from the same cert-manager Secret the server mounts.
        - name: fga-http-ca
          secret:
            secretName: gibson-openfga-http-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
---
# Source: gibson/charts/gibson-workloads/templates/ratelimit/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibson-ratelimit
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
