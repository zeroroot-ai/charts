    metadata:
      labels:
        app.kubernetes.io/name: setec
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: setec-frontend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "ghcr.io/zeroroot-ai/setec-frontend:v0.126.0@sha256:17fa719fe3ea696b3337c27d5d391b2ae685297f42614f2360b1cbfbe7b3fa21"
          imagePullPolicy: IfNotPresent
          args:
