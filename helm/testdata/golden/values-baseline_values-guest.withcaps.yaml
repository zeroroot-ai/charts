# platform/tenant operators mount (key resolved via
# `gibson.platformPostgres.passwordSecretKey`, which the kind AND aws-prod overlays
# both set to "password") AND the CNPG postgres-setup Job reads from
# `.data.password` to set the gibson_platform role password (epic-447 #729).
# SOLE producer across both render paths: the subchart-direct path (kind) and the
# umbrella path (EKS). The umbrella-only copy (deploy#911/PR#912) was a duplicate
# Owner ExternalSecret (same name+namespace) and was deleted (deploy#960); its EKS
# cold-bringup sync-wave ordering is folded in below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
