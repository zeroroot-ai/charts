# Source: gibson/templates/jobs/zitadel-postgres-setup-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-postgres-setup
  namespace: gibson
  annotations:
    # gitops#297: this role-creating job MUST run BEFORE anything that logs in
    # with those roles — notably the zitadel-init Sync hook at wave -4 and every
    # DB-consuming service. As a post-install/PostSync hook it deadlocked:
    # zitadel-init (Sync -4) waited for a `zitadel` role this job had not yet
    # created, so the Sync phase never completed and the PostSync phase (this
    # job) never ran. Run it as a Sync hook at wave -6 instead — after the ESO
    # credential Secrets (Sync-phase, wave -8; PreSync would deadlock waiting on
    # a Secret its own phase hasn't created yet) and before zitadel-init (-4).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Helm-native (non-Argo) installs keep an early hook so role creation still
    # precedes the consumers; ArgoCD honours the argocd.* annotations above.
    # post-install, NOT pre-install (deploy#1627). This Job blocks on two
    # MAIN-PHASE resources: Cluster.status.currentPrimary for platform-postgres,
    # and the ESO-materialised credentials Secret. Helm runs pre-install hooks
    # to completion BEFORE it applies any main-phase manifest, so as a
    # pre-install hook this waited for resources the same release had not
    # created yet and hung until --timeout, reporting only "failed pre-install:
    # timed out waiting for the condition".
    #
    # Argo is unaffected: the argocd.argoproj.io/hook annotation above is what
    # Argo honours, and sync-waves order hooks and ordinary resources on one
    # axis, which is why this was only ever wrong on the Helm-native path.
    # The hook-weight is unchanged, so the order among these Jobs is preserved.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '-6'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres-setup
        # The Postgres data store admits its clients on :5432 (templates/network-policies.yaml).
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/client-postgres: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: postgres-setup
      automountServiceAccountToken: false
      # Secure pod (ADR-0165, charts#394): non-root, the RuntimeDefault seccomp
      # profile, a read-only root filesystem and no capabilities. The script
      # writes only to /tmp, an emptyDir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: setup
        image: "ghcr.io/zeroroot-ai/mirror/bitnami-postgresql:16.4.0-debian-12-r0@sha256:be51b3aeaacc600f3eb2b596427be538b1bc17284111a1fe147030e8422c3184"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: PGHOST
          value: platform-postgres-rw.gibson.svc
        - name: PGPORT
          value: "5432"
        - name: PGSSLMODE
          value: require
        - name: PGCONNECT_TIMEOUT
          value: "5"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: platform-postgres-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-postgres-superuser
              key: password
        - name: PGSETUP_PW_ZITADEL
          valueFrom:
            secretKeyRef:
              name: zitadel-postgres-credentials
              key: password
        command: [bash, -ec]
        args:
        - |
          set -euo pipefail
          # Bitnami puts the client under /opt/bitnami/postgresql/bin.
          export PATH="/opt/bitnami/postgresql/bin:$PATH"
          echo "[postgres-setup] waiting for platform-postgres-rw to accept connections..."
          i=0
          until pg_isready -q -d postgres; do
            i=$((i + 1))
            if [ "$i" -ge 90 ]; then
              echo "[postgres-setup] ERROR: platform-postgres-rw did not accept connections in 180s; the Job retries"
              exit 1
            fi
            sleep 2
          done
          PSQL=(psql -X -q -v ON_ERROR_STOP=1)
    
          # setup <role> <database> <role options> <env var that holds the password>
          setup() {
            echo "[$1] role, database and schema..."
            if [ -z "${!4:-}" ]; then
              echo "[$1] ERROR: the password in $4 is empty"
              exit 1
            fi
            "${PSQL[@]}" -d postgres -v role="$1" -v db="$2" -v opts="$3" -v pwenv="$4" <<'SQL'
          \getenv pw :pwenv
          SELECT format('CREATE ROLE %I', :'role')
            WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = :'role') \gexec
          SELECT format('ALTER ROLE %I WITH %s PASSWORD %L', :'role', :'opts', :'pw') \gexec
          SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'role')
            WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_database WHERE datname = :'db') \gexec
          SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'role') \gexec
          SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'db', :'role') \gexec
          \connect :db
          SELECT format('ALTER SCHEMA public OWNER TO %I', :'role') \gexec
          SELECT format('GRANT ALL ON SCHEMA public TO %I', :'role') \gexec
          SQL
            echo "[$1] setup complete"
          }
          setup "zitadel" "zitadel" "LOGIN CREATEDB" PGSETUP_PW_ZITADEL
          echo "[postgres-setup] ALL_ROLES_SETUP_OK"
