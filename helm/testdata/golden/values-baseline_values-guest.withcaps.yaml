                      # purpose: a refused request must cost a JWKS verification, an
                      # ext_authz RPC and two FGA Checks LESS than an accepted one.
                      # Putting the limiter after jwt_authn/ext_authz would let a
                      # flood pay for exactly the work it is meant to protect. It is
                      # also why the limiter cannot be the thing that consumes
                      # budget on already-refused requests: nothing upstream of it
                      # has refused anything yet.
                      #
                      # This entry carries the BASELINE bucket for the whole api
                      # chain, deliberately NOT a vhost-level config: Envoy resolves
                      # per-filter config most-specific-first, so a filter-level
                      # bucket is the floor that any virtual host added to
                      # api_routes later inherits WITHOUT having to remember to ask.
