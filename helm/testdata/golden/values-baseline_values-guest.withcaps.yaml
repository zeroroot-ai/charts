          && !has(object.spec.namespaceSelector.matchExpressions)
          && object.spec.namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': variables.pluginNs}
          && has(object.spec.podSelector) && has(object.spec.podSelector.matchLabels)
