apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: setec-device-plugin
  namespace: setec-system
  labels:
    helm.sh/chart: setec-0.126.0
    app.kubernetes.io/name: setec
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "v0.126.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: setec
    app.kubernetes.io/component: device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: setec
      app.kubernetes.io/instance: gibson
      app.kubernetes.io/component: device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: setec
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: device-plugin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      containers:
        - name: device-plugin
          image: "ghcr.io/zeroroot-ai/setec-device-plugin:v0.126.0@sha256:46d5d2b6393e88e6c2d418c36fa018fdff7f817da1240e3ef5268809151f97c9"
          imagePullPolicy: IfNotPresent
          args:
            - --count=110
          securityContext:
            # Root, to write its socket into the kubelet directory, which
            # root owns. No capability and no privilege.
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            # Not at /dev: the container runtime mounts the termination log
            # into /dev of the container, which fails on a read-only /dev.
            - name: dev
              mountPath: /host/dev
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
