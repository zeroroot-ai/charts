                            # path reads it — the discovery document advertises
                            # only `register` and `jwks_uri`, and a registering
                            # component already holds its own private key, so it
                            # has nothing to read back. The key fetch is strictly
                            # the verifier's half of the handshake and the verifier
                            # is always in-cluster.
                            #
                            # Guarded by tools/envoy-header-trust (the route is out of the
                            # reviewed ext_authz-disable allowlist).
                            # ---------------------------------------------------
                            # deploy#1205: the tenant-operator → dashboard
                            # provisioning callback route
                            # (`/api/admin/provisioning/` → gibson_dashboard) is
                            # DELETED. It was dead three times over:
                            #
                            #   1. It ran through ext_authz, which resolves authz
                            #      by per-RPC registry key (/pkg.Service/Method).
                            #      An HTTP path never matches, so the route
                            #      default-denied every request — it could not
                            #      succeed.
                            #   2. The dashboard serves no handler under
                            #      /api/admin/provisioning/ any more (the
                            #      entitlements endpoints were retired).
                            #   3. Its only caller, the tenant operator's
                            #      EntitlementsHTTPClient, posted straight at the
                            #      dashboard Service (formerly DASHBOARD_URL,
                            #      http://gibson-dashboard:3000, in helm/
                            #      gibson-operators/templates/tenant-operator/
                            #      deployment.yaml — that env var has since been
                            #      replaced by GIBSON_APP_URL, which the
                            #      tenant-operator now uses only for its
                            #      human-facing email links). It never traversed
                            #      this edge.
