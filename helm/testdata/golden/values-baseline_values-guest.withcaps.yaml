            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent
              readOnly: true
      containers:
        - name: ratelimit
          image: "ghcr.io/zeroroot-ai/mirror/ratelimit:8fe6ea42@sha256:a61547259607d40aff153050c2a87873ca1676d1d9f5f06937d412000dcc2df1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            # Stats to Prometheus, not statsd and not the log sink (which
            # would flush every counter into stdout at debug level).
            - name: USE_STATSD
              value: "false"
            - name: USE_PROMETHEUS
              value: "true"
            - name: PROMETHEUS_ADDR
              value: ":9090"
            - name: PROMETHEUS_PATH
              value: "/metrics"
            # HTTP (/healthcheck) on all interfaces for the probes and the
            # NetworkPolicy-gated scrapers; gRPC on loopback ONLY. The sidecar
            # is the sole path to the gRPC port, and it requires a client
            # certificate.
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: GRPC_HOST
              value: "127.0.0.1"
            - name: GRPC_PORT
              value: "8082"
            - name: RUNTIME_ROOT
              value: "/data"
            - name: RUNTIME_SUBDIRECTORY
              value: "ratelimit"
            - name: RUNTIME_IGNOREDOTFILES
              value: "true"
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            # Unhealthy until the descriptor config has loaded, so a pod with
            # no quotas never receives traffic and fails open at the edge.
            - name: HEALTHY_WITH_AT_LEAST_ONE_CONFIG_LOADED
              value: "true"
            - name: REDIS_SOCKET_TYPE
              value: "tcp"
            - name: REDIS_URL
              value: "gibson-redis-stack:6379"
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: gibson-redis-stack
                  key: redis-password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          # Both declare timeoutSeconds, because the default is 1
          # (charts#306). /healthcheck answers from process memory.
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 150m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: quota-config
              mountPath: /data/ratelimit/config
              readOnly: true
        - name: envoy
          image: "ghcr.io/zeroroot-ai/mirror/envoy:v1.34.0@sha256:45d37d848802f98a5647cb7522b4c1c42e0e0e775913d8e253ef3a5856bef986"
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--service-cluster"
            - "gibson-ratelimit"
            - "--service-node"
            - "gibson-ratelimit"
            - "--log-level"
            - "info"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: 8081
              protocol: TCP
          # A tcpSocket probe needs the kernel to accept, nothing more, so 2
          # is generous. It is declared because the default is 1 (charts#306).
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 100m
              memory: 96Mi
            requests:
              cpu: 25m
              memory: 48Mi
          volumeMounts:
            - name: envoy-bootstrap
              mountPath: /etc/envoy
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: quota-config
          configMap:
            name: gibson-ratelimit-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: envoy-bootstrap
          configMap:
            name: gibson-ratelimit-config
            items:
              - key: envoy.yaml
                path: envoy.yaml
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: tmp
          emptyDir: {}
