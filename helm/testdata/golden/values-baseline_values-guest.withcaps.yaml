apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gibson-redis-alerts
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: redis
spec:
  groups:
    - name: redis-health-alerts
      rules:

        # Fires when the redis-stack StatefulSet has 0 ready replicas for >2m.
        # Does not require the redis-exporter — uses kube-state-metrics if present.
        # Relies on kube_statefulset_status_replicas_ready; omitted gracefully if
        # kube-state-metrics is not installed (the expression simply returns no series).
        - alert: RedisStackUnhealthy
          expr: |
            kube_statefulset_status_replicas_ready{
              namespace="gibson",
              statefulset="gibson-redis-stack"
            } == 0
          for: 2m
          labels:
            severity: page
            component: redis
          annotations:
            runbook_url: "https://github.com/zeroroot-ai/charts/blob/main/docs/runbooks/alerts/redis.md#redisstackunhealthy"
            summary: "redis-stack StatefulSet has 0 ready replicas"
            description: |
              redis-stack in gibson has had 0 ready replicas for
              >2 minutes. All Redis-dependent operations (daemon, tenant-operator)
              will be failing.

              Check: kubectl describe statefulset/gibson-redis-stack -n gibson
