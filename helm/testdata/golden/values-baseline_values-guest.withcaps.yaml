# Source: gibson/charts/gibson-workloads/templates/tests/09-go-toolchain.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "gibson-gibson-workloads-test-go-toolchain"
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    helm-test/keep: "false"
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/kube-api: "true"
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  # The probe does not call the Kubernetes API, so the pod mounts no
  # ServiceAccount token (ADR-0165, charts#394).
  automountServiceAccountToken: false
  containers:
    - name: assert-toolchain
      # The daemon image itself — same repo@digest the StatefulSet runs — so
      # `gibson --version` reports the toolchain the DEPLOYED binary was built
      # with, not some proxy. The runtime image is alpine-based (has /bin/sh).
      image: "ghcr.io/zeroroot-ai/gibson:v0.154.0@sha256:560d708bc9814dfb272643baa8afe14d1869b98f1833518a2f1c4048dbdccc23"
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='::error file=helm-test::'
          WANT='go1.26.5'

          OUT="$(/usr/local/bin/gibson --version 2>&1)"
          echo "[go-toolchain] gibson --version -> $OUT"

          # Extract the `go: goX.Y.Z` token emitted by pkg/version.String().
          GOT="$(printf '%s\n' "$OUT" | sed -n 's/.*go: \(go[0-9][0-9.]*\).*/\1/p')"
          if [ -z "$GOT" ]; then
            echo "$ERR could not parse a 'go:' toolchain token from gibson --version output above"
            exit 1
          fi

          if [ "$GOT" != "$WANT" ]; then
            echo "$ERR deployed daemon Go toolchain $GOT != pinned gibson.expectedGoToolchain $WANT"
            echo "$ERR bump gibson.expectedGoToolchain in lock-step with zeroroot-ai/gibson go.mod (or roll the daemon image)"
            exit 1
          fi

          echo "[go-toolchain] OK: daemon built with $GOT (matches the pin)"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
  imagePullSecrets:
    - name: ghcr-credentials
