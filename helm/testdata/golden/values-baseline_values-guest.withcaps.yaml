apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gibson-server
  namespace: gibson
  labels:
    helm.sh/chart: spire-server-0.1.0
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "1.14.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
spec:
  replicas: 1
  serviceName: gibson-server
  selector:
    matchLabels:
