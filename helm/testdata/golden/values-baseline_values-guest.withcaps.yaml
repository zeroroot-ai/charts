apiVersion: batch/v1
kind: Job
metadata:
  name: gibson-webhook-gate
  namespace: gibson
  labels:
    app.kubernetes.io/component: webhook-gate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: webhook-gate
        # The gibson namespace is default-deny. A platform pod reaches the
        # webhook ports (templates/network-policies.yaml). Without the label
        # each probe reads as a dead webhook (deploy#1631).
        gibson.zeroroot.ai/net-role: platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # Secure pod (ADR-0165, charts#394): non-root, the RuntimeDefault seccomp
      # profile, a read-only root filesystem and no capabilities. The script
      # writes only to /tmp, an emptyDir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: gate
        image: "ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # busybox ash: no `set -o pipefail` (deploy#603-605). `set -e` only.
        command:
        - sh
        - -ec
        args:
        - |
          DEADLINE=900
          INTERVAL=5

          # config|webhook|namespace|service|port|path, one per line.
          cat >/tmp/probes <<'PROBES'
          gibson-tenant-operator-owner-ref|ownerref.gibson.zeroroot.ai|gibson|gibson-tenant-operator-webhook|443|/mutate-owner-ref
          gibson-tenant-operator-tenant-validator|tenant.gibson.zeroroot.ai|gibson|gibson-tenant-operator-webhook|443|/validate-tenant
          setec-mutating-sandboxclass|msandboxclass.setec.zeroroot.ai|setec-system|setec-webhook|443|/mutate-setec-zeroroot-ai-v1alpha1-sandboxclass
          setec-validating-sandboxclass|vsandboxclass.setec.zeroroot.ai|setec-system|setec-webhook|443|/validate-setec-zeroroot-ai-v1alpha1-sandboxclass
          setec-validating-webhook|vsandbox.setec.zeroroot.ai|setec-system|setec-webhook|443|/validate-setec-zeroroot-ai-v1alpha1-sandbox
          PROBES

          # A syntactically valid AdmissionReview with no request. Every
          # admission server answers it: controller-runtime replies 200 with
          # an AdmissionResponse, cert-manager's server replies 400. Both
          # prove the path is served. Anything else does not.
          REVIEW='{"apiVersion":"admission.k8s.io/v1","kind":"AdmissionReview"}'

          probe() {
            # $1 url. Echoes the outcome, returns 0 only when the path answers.
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 \
                     -X POST -H 'Content-Type: application/json' \
                     --data "$REVIEW" "$1" 2>/dev/null) || {
              echo "no answer (connection or TLS failure)"
              return 1
            }
            case "$code" in
              200|400) echo "HTTP $code"; return 0 ;;
              404)     echo "HTTP 404 (the service answers but does not serve this path)"; return 1 ;;
              *)       echo "HTTP $code"; return 1 ;;
            esac
          }

          pending=/tmp/pending
          cp /tmp/probes "$pending"
          : >/tmp/last
          start=0
          while [ "$start" -lt "$DEADLINE" ]; do
            : >/tmp/next
            while IFS='|' read -r cfg wh ns svc port path; do
              [ -n "$cfg" ] || continue
              url="https://${svc}.${ns}.svc:${port}${path}"
              if result=$(probe "$url"); then
                echo "[webhook-gate] ok      ${wh} (${cfg}) ${url} -> ${result}"
              else
                echo "${cfg}|${wh}|${ns}|${svc}|${port}|${path}" >>/tmp/next
                echo "${cfg}|${wh}|${url}|${result}" >>/tmp/last
              fi
            done <"$pending"
            mv /tmp/next "$pending"
            [ -s "$pending" ] || break
            echo "[webhook-gate] $(wc -l <"$pending") webhook(s) not serving yet; ${start}s of ${DEADLINE}s used"
            sleep "$INTERVAL"
            start=$((start + INTERVAL))
          done

          if [ -s "$pending" ]; then
            echo ""
            echo "ERROR: the following admission webhooks never answered within ${DEADLINE}s."
            echo "       The install stops here rather than applying resources these would"
            echo "       refuse. Fix the operator behind each one, then rerun the install."
            while IFS='|' read -r cfg wh ns svc port path; do
              [ -n "$cfg" ] || continue
              last=$(grep "^${cfg}|${wh}|" /tmp/last | tail -n1 | cut -d'|' -f4)
              echo "  - ${wh}"
              echo "      configuration: ${cfg}"
              echo "      endpoint:      https://${svc}.${ns}.svc:${port}${path}"
              echo "      last result:   ${last}"
            done <"$pending"
            exit 1
          fi

          echo "WEBHOOK_GATE_OK $(wc -l </tmp/probes) endpoint(s) answered"
---
