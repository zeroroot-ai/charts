apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibson-docs-svc
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: docs-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs-svc
      app.kubernetes.io/instance: gibson
  template:
    metadata:
      annotations:
        # Velero fs-backup (defaultVolumesToFsBackup on the shipped Schedule)
        # snapshots every pod volume it is not told to skip. These hold a
        # socket, a scratch dir or an init-rendered file: nothing to keep,
        # and on restore each one becomes a PodVolumeRestore that can only
        # finish once this pod is running. Measured 2026-09-07: 9 of 22
        # PodVolumeRestores in a preserve backup were volumes like these.
        # scripts/check-velero-volume-excludes.sh keeps this list equal to
        # the pod's emptyDir and CSI-ephemeral volumes.
        backup.velero.io/backup-volumes-excludes: "nginx-cache,nginx-run"
      labels:
        app.kubernetes.io/name: docs-svc
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: docs-svc
        gibson.zeroroot.ai/net-role: platform
    spec:
      
      imagePullSecrets:
        - name: ghcr-credentials
      # nginx serves static files and never calls the Kubernetes API, so the
      # pod mounts no ServiceAccount token (ADR-0165, charts#394).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs-svc
          image: "ghcr.io/zeroroot-ai/docs-site:v0.6.14@sha256:e1d62016f19c485df8749fb0e65faf8b6f5f6f791739eb0ea6208c957c553a7c"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only yet: the image rewrites its own index.html at
            # start. docs-site#79 changes the image (ADR-0165, charts#394).
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              # 8080, not 80: this pod runs as uid 101 with ALL capabilities
              # dropped (above), so it cannot bind a privileged port. The
              # image is nginx-unprivileged, which listens on 8080
              # (docs-site#10). Declaring 80 here described a container that
              # could never start — nginx died with EACCES on bind and the
              # docs vhost served 503.
              containerPort: 8080
              protocol: TCP
          env:
            # Cross-surface origins for the static docs image's start-time
            # link substitution (docs-site#19, epic env-derived-links).
            # Derived from global.domain like every other external hostname
            # (deploy#630). Old images ignore them; new images default to the
            # prod origins when absent, so chart and image roll independently.
            - name: APP_ORIGIN
              value: "https://app.localhost.zeroroot.ai"
            - name: WWW_ORIGIN
              value: "https://www.localhost.zeroroot.ai"
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
