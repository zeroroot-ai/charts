  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: iam-admin-pat-escrow
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/client-openbao: "true"
        gibson.zeroroot.ai/kube-api: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: iam-admin-pat-escrow
      # Secure pod (ADR-0165, charts#394): non-root, the RuntimeDefault seccomp
      # profile, a read-only root filesystem and no capabilities. The script
      # writes only to /tmp, an emptyDir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: escrow
        image: "ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        # kubectl writes its discovery cache under $HOME; /tmp is the one
        # writable path.
        - name: HOME
          value: /tmp
        - name: BAO_ADDR
          value: "http://gibson-openbao:8200"
        # The token of this Job alone, policy iam-admin-escrow: the three KV
        # keys below and nothing else. openbao-auto-init mints it.
        - name: VAULT_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: gibson-openbao-iam-admin-escrow
              key: VAULT_ADMIN_TOKEN
        command: [bash, -ec]
        args:
        - |
          set -euo pipefail
          NS=gibson
          # Every Secret the Zitadel setup Job mints on the first instance
          # (its zitadel-machinekey, zitadel-machine-pat and
          # zitadel-login-client-pat containers), as
          #   <Secret>:<data key>:<store key>:<store property>
          # The platform-operator reads iam-admin (the machine key, for the
          # SA identity map) and iam-admin-pat; zitadel-login mounts
          # login-client. A restore brings back none of them (blocker 3 loop
          # #14, 2026-09-08: PlatformBootstrap SAIdentityMapReady=False
          # "Secret gibson/iam-admin not yet written", zitadel-login on
          # "secret login-client not found").
          ENTRIES="iam-admin:iam-admin.json:gibson-zitadel-iam-admin-machinekey:machinekey login-client:pat:gibson-zitadel-login-client-pat:pat"
          for entry in $ENTRIES; do
            SECRET=${entry%%:*}; rest=${entry#*:}
            DATAKEY=${rest%%:*}; rest=${rest#*:}
            KEY=${rest%%:*}; PROP=${rest#*:}
            # The store first. On a restore the store already holds the value
            # and the Secret does not exist yet (the ExternalSecret that writes
            # it applies at wave -1, after this hook), so waiting for the
            # Secret here would deadlock the sync. A key in the store and no
            # Secret is the restore path: nothing to do.
            code=$(curl -sS -o /tmp/kv.json -w '%{http_code}' \
              -H "X-Vault-Token: $VAULT_ADMIN_TOKEN" "$BAO_ADDR/v1/secret/data/$KEY")
            case "$code" in
              200) have=$(jq -r --arg p "$PROP" '.data.data[$p] // empty' /tmp/kv.json) ;;
              404) have="" ;;
              *) echo "ERROR: read secret/$KEY returned HTTP $code: $(cat /tmp/kv.json)"; exit 1 ;;
            esac
            if [ -n "$have" ] && ! kubectl -n "$NS" get secret "$SECRET" >/dev/null 2>&1; then
              echo "ESCROWED already: secret/$KEY is in the store and Secret $SECRET is not yet materialised (restore path)"
              continue
            fi
            # A Secret this ServiceAccount may not read looks exactly like one
            # that is not there yet. Refuse to wait on it.
            if [ "$(kubectl -n "$NS" auth can-i get "secret/$SECRET")" != yes ]; then
              echo "ERROR: the escrow ServiceAccount may not get secret/$SECRET: add it to the Role's resourceNames"; exit 1
            fi
            # The minted Secret (fresh bootstrap: the Zitadel setup Job writes it,
            # up to ~9 min into a cold bringup). 180 x 5 s, the minter's window.
            for i in $(seq 1 180); do
              if kubectl -n "$NS" get secret "$SECRET" >/dev/null 2>&1; then break; fi
              echo "  waiting for $SECRET ($i/180)"; sleep 5
            done
            VALUE=$(kubectl -n "$NS" get secret "$SECRET" -o json | jq -r --arg k "$DATAKEY" '.data[$k] // empty' | base64 -d)
            [ -n "$VALUE" ] || { echo "ERROR: $SECRET never appeared or its $DATAKEY is empty"; exit 1; }
            if [ "$have" = "$VALUE" ]; then
              echo "ESCROWED already: secret/$KEY matches Secret $SECRET"
              continue
            fi
            code=$(curl -sS -o /tmp/kv.json -w '%{http_code}' -X POST \
              -H "X-Vault-Token: $VAULT_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg p "$PROP" --arg v "$VALUE" '{data: {($p): $v}}')" "$BAO_ADDR/v1/secret/data/$KEY")
            case "$code" in
              200|204) echo "ESCROWED: wrote secret/$KEY from Secret $SECRET/$DATAKEY (len=${#VALUE})" ;;
              *) echo "ERROR: write secret/$KEY returned HTTP $code: $(cat /tmp/kv.json)"; exit 1 ;;
            esac
          done
---
# Source: gibson/templates/jobs/gibson-workloads-postgres-setup-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: gibson-workloads-postgres-setup
  namespace: gibson
  annotations:
    # gitops#297: this role-creating job (gibson_platform/dashboard/tenant_admin
    # roles + DBs, pg_trgm seed, tenant_neo4j_endpoints registry) MUST run
    # BEFORE anything that logs in with those roles — the zitadel-init Sync hook
    # at wave -4 and every DB-consuming service. As a post-install/PostSync hook
    # it deadlocked: consumers (Sync) waited for roles this job had not yet
    # created, so the Sync phase never completed and the PostSync phase (this
    # job) never ran. Run it as a Sync hook at wave -6 instead — after the ESO
    # credential Secrets (Sync-phase, wave -8; PreSync would deadlock waiting on
    # a Secret its own phase hasn't created yet) and before zitadel-init (-4).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Helm-native (non-Argo) installs keep an early hook so role creation still
    # precedes the consumers; ArgoCD honours the argocd.* annotations above.
    # post-install, NOT pre-install (deploy#1627). This Job blocks on two
    # MAIN-PHASE resources: Cluster.status.currentPrimary for platform-postgres,
    # and the ESO-materialised credentials Secret. Helm runs pre-install hooks
    # to completion BEFORE it applies any main-phase manifest, so as a
    # pre-install hook this waited for resources the same release had not
    # created yet and hung until --timeout, reporting only "failed pre-install:
    # timed out waiting for the condition".
    #
    # Argo is unaffected: the argocd.argoproj.io/hook annotation above is what
    # Argo honours, and sync-waves order hooks and ordinary resources on one
    # axis, which is why this was only ever wrong on the Helm-native path.
    # The hook-weight is unchanged, so the order among these Jobs is preserved.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: '-6'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres-setup
        # The Postgres data store admits its clients on :5432 (templates/network-policies.yaml).
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/client-postgres: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: postgres-setup
      automountServiceAccountToken: false
      # Secure pod (ADR-0165, charts#394): non-root, the RuntimeDefault seccomp
      # profile, a read-only root filesystem and no capabilities. The script
      # writes only to /tmp, an emptyDir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
      containers:
      - name: setup
        image: "ghcr.io/zeroroot-ai/mirror/bitnami-postgresql:16.4.0-debian-12-r0@sha256:be51b3aeaacc600f3eb2b596427be538b1bc17284111a1fe147030e8422c3184"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        env:
        - name: PGHOST
          value: platform-postgres-rw.gibson.svc
        - name: PGPORT
          value: "5432"
        - name: PGSSLMODE
          value: require
        - name: PGCONNECT_TIMEOUT
          value: "5"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: platform-postgres-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-postgres-superuser
              key: password
        - name: PGSETUP_PW_GIBSON_PLATFORM
          valueFrom:
            secretKeyRef:
              name: gibson-platform-postgres-credentials
              key: password
        - name: PGSETUP_PW_DASHBOARD
          valueFrom:
            secretKeyRef:
              name: dashboard-postgres-credentials
              key: password
        - name: PGSETUP_PW_TENANT_ADMIN
          valueFrom:
            secretKeyRef:
              name: tenant-admin-postgres-credentials
              key: password
        command: [bash, -ec]
        args:
        - |
          set -euo pipefail
          # Bitnami puts the client under /opt/bitnami/postgresql/bin.
          export PATH="/opt/bitnami/postgresql/bin:$PATH"
          echo "[postgres-setup] waiting for platform-postgres-rw to accept connections..."
          i=0
          until pg_isready -q -d postgres; do
            i=$((i + 1))
            if [ "$i" -ge 90 ]; then
              echo "[postgres-setup] ERROR: platform-postgres-rw did not accept connections in 180s; the Job retries"
              exit 1
            fi
            sleep 2
          done
          PSQL=(psql -X -q -v ON_ERROR_STOP=1)
    
          # setup <role> <database> <role options> <env var that holds the password>
          setup() {
            echo "[$1] role, database and schema..."
            if [ -z "${!4:-}" ]; then
              echo "[$1] ERROR: the password in $4 is empty"
              exit 1
            fi
            "${PSQL[@]}" -d postgres -v role="$1" -v db="$2" -v opts="$3" -v pwenv="$4" <<'SQL'
          \getenv pw :pwenv
          SELECT format('CREATE ROLE %I', :'role')
            WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = :'role') \gexec
          SELECT format('ALTER ROLE %I WITH %s PASSWORD %L', :'role', :'opts', :'pw') \gexec
          SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'role')
            WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_database WHERE datname = :'db') \gexec
          SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'role') \gexec
          SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'db', :'role') \gexec
          \connect :db
          SELECT format('ALTER SCHEMA public OWNER TO %I', :'role') \gexec
          SELECT format('GRANT ALL ON SCHEMA public TO %I', :'role') \gexec
          SQL
            echo "[$1] setup complete"
          }
          setup "gibson_platform" "gibson_platform" "LOGIN" PGSETUP_PW_GIBSON_PLATFORM
          setup "dashboard" "dashboard" "LOGIN" PGSETUP_PW_DASHBOARD
          setup "tenant_admin" "tenant_admin" "LOGIN CREATEDB CREATEROLE" PGSETUP_PW_TENANT_ADMIN
          # gitops#101: per-tenant databases need pg_trgm for the
          # missions_name_trgm_idx GIN index in migration 003. CREATE DATABASE copies
          # template1, so the extension goes there for every NEW tenant database, and
          # every existing tenant_* database gets it in place.
          echo "[pg_trgm] template1 and existing tenant databases..."
          "${PSQL[@]}" -d template1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          for tdb in $("${PSQL[@]}" -d postgres -tAc "SELECT datname FROM pg_catalog.pg_database WHERE datname LIKE 'tenant\_%' AND datname <> 'tenant_admin'"); do
            echo "  [pg_trgm] $tdb"
            "${PSQL[@]}" -d "$tdb" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          done
          
          # D1-G (deploy#256): the tenant-operator's DATAPLANE_PG_ADMIN_DSN connects as
          # tenant_admin to the built-in postgres database, where PostgreSQL 15 and
          # later own the public schema as pg_database_owner and grant no CREATE to
          # others. Its platform-db migrations create tables there.
          echo "[postgres-db] tenant_admin may create in the public schema of postgres..."
          "${PSQL[@]}" -d postgres -c "GRANT CREATE, USAGE ON SCHEMA public TO tenant_admin;"
          
          # tenant-operator#69: the Neo4j data-plane step writes one row per tenant
          # into tenant_neo4j_endpoints, in the postgres database tenant_admin
          # connects to. The operator does not run that migration at startup, so the
          # table is created here.
          echo "[neo4j-registry] tenant_neo4j_endpoints..."
          "${PSQL[@]}" -d postgres <<'SQL'
          CREATE TABLE IF NOT EXISTS tenant_neo4j_endpoints (
              tenant_id   TEXT        PRIMARY KEY,
              bolt_uri    TEXT        NOT NULL,
              secret_name TEXT        NOT NULL,
              tier        TEXT        NOT NULL,
              created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              ready_at    TIMESTAMPTZ,
              version     INT         NOT NULL DEFAULT 1
          );
          GRANT SELECT, INSERT, UPDATE, DELETE ON tenant_neo4j_endpoints TO tenant_admin;
          SQL
          echo "[postgres-setup] ALL_ROLES_SETUP_OK"
---
