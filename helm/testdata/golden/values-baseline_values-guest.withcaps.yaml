# Source: gibson/templates/jobs/gibson-workloads-first-admin.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: gibson-gibson-workloads-first-admin
  namespace: gibson
  labels:
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: first-admin
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-workloads
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: first-admin
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/kube-api: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gibson-gibson-workloads-first-admin
      
      imagePullSecrets:
        - name: ghcr-credentials
      # Secure pod (ADR-0165, charts#394): non-root, the RuntimeDefault
      # seccomp profile, a read-only root filesystem and no capabilities.
      # kubectl writes its cache under HOME=/tmp, an emptyDir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: first-admin
          image: "ghcr.io/zeroroot-ai/gibson-bootstrap-runner:sha-2f91a7b@sha256:90405ce6d9a3eb79dc3f46605d075f986079850cd1e9d5549055ac07ee3301f2"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: "admin@localhost.zeroroot.ai"
            - name: BOOTSTRAP_TENANT_ID
              value: "primary"
            - name: BOOTSTRAP_TENANT_DISPLAY_NAME
              value: "Primary Workspace"
            - name: GIBSON_IDP_ADMIN_ISSUER
              value: "https://app.localhost.zeroroot.ai"
            - name: ZITADEL_URL
              value: "http://gibson-zitadel.gibson.svc.cluster.local:8080"
            - name: ZITADEL_EXTERNAL_DOMAIN
              value: "app.localhost.zeroroot.ai"
            - name: GIBSON_IDP_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "idp-admin-credentials"
                  key: client_id
            - name: GIBSON_IDP_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "idp-admin-credentials"
                  key: client_secret
            - name: GIBSON_IDP_ZITADEL_ORG_ID
              valueFrom:
                secretKeyRef:
                  name: "idp-admin-credentials"
                  key: org_id
            # ADR-0093 decision 2: the Owner's role is a grant on this
            # project. The Job fails without it.
            - name: GIBSON_IDP_ZITADEL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: "idp-admin-credentials"
                  key: project_id
            - name: EXT_AUTHZ_FGA_ADDR
              # OpenFGA's HTTP API is https on :8080 (:8081 is gRPC). bootstrap
              # speaks HTTP, so :8081 hangs. Same value ext-authz uses.
              value: "https://gibson-openfga:8080"
            # bootstrap-tenant-owner writes the owner's FGA tuple, so it needs
            # the store + model ids the fga-init Job seeded into gibson-fga-config
            # (same source ext-authz reads).
            - name: EXT_AUTHZ_FGA_STORE_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: store_id
            - name: EXT_AUTHZ_FGA_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: model_id
            # OpenFGA's HTTP API serves TLS signed by the in-cluster CA.
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/ssl/fga-ca"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              TENANT="${BOOTSTRAP_TENANT_ID}"
              NS="gibson"

              echo "[first-admin] waiting for tenant ${TENANT} (operator-seeded) to report a Zitadel org"
              ORG=""
              for _ in $(seq 1 120); do
                ORG=$(kubectl -n "${NS}" get tenant "${TENANT}" \
                        -o jsonpath='{.status.zitadelOrgID}' 2>/dev/null || true)
                if [ -n "${ORG}" ]; then break; fi
                sleep 5
              done
              if [ -z "${ORG}" ]; then
                echo "[first-admin] FATAL: tenant ${TENANT} never reported status.zitadelOrgID." >&2
                echo "  The operator seed was enqueued but the tenant-operator did not converge." >&2
                exit 1
              fi
              echo "[first-admin] tenant org ${ORG} is ready"

              echo "[first-admin] creating the owner with no password - a one-time setup link will be written to a Secret"
              bootstrap-tenant-owner \
                -tenant "${TENANT}" \
                -owner-email "${BOOTSTRAP_ADMIN_EMAIL}" \
                -setup-secret-namespace "${NS}" \
                -offline-setup \
                -setup-secret "gibson-first-tenant-owner-setup" \
                -setup-secret-key "setup-link"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: fga-ca
              mountPath: /etc/ssl/fga-ca
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        # OpenFGA's HTTP API serves TLS; bootstrap's FGA client must trust its CA.
        - name: fga-ca
          secret:
            secretName: gibson-openfga-http-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0o444
---
