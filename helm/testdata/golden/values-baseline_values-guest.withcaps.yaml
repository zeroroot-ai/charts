        helm.neo4j.com/clustering: "false"
        helm.neo4j.com/pod_category: "neo4j-instance" # used for anti affinity rules
        helm.neo4j.com/neo4j.loadbalancer: "include"
        helm.neo4j.com/instance: "gibson"        
        "gibson.zeroroot.ai/datastore": "neo4j"
        "gibson.zeroroot.ai/net-role": "datastore"
      annotations:
        "checksum/gibson-config": dcec5328509e05856676b83c7b2d67fe1ba5d3c7468d017ee386cd35d658739d
        "checksum/gibson-env": 0195f00c71a87b9cc7e7aca6850ee6f76fcb14a72549c7790e4f867890f038d4        
        "backup.velero.io/backup-volumes-excludes": "neo4j-plugins"
    spec:      
      affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: "gibson-neo4j"
                    helm.neo4j.com/pod_category: "neo4j-instance"
                topologyKey: kubernetes.io/hostname
      dnsPolicy: ClusterFirst
      securityContext: 
        fsGroup: 7474
        fsGroupChangePolicy: Always
        runAsGroup: 7474
        runAsNonRoot: true
        runAsUser: 7474
        seccompProfile:
          type: RuntimeDefault            
      
      terminationGracePeriodSeconds: 3600
      initContainers:
        - command:
          - bash
          - -c
          - cp /var/lib/neo4j/labs/apoc-*-core.jar /plugins/apoc.jar
          name: install-apoc-core
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 7474
            runAsNonRoot: true
            runAsUser: 7474
          volumeMounts:
          - mountPath: /plugins
            name: neo4j-plugins
          image: "ghcr.io/zeroroot-ai/mirror/neo4j:5.26.0-community@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5"            
      containers:
        - name: "neo4j"
          image: "ghcr.io/zeroroot-ai/mirror/neo4j:5.26.0-community@sha256:5a015e53de1895e7eee1574ae0325cf8c4b89587222778108c594bdd45a474b5"
          imagePullPolicy: "IfNotPresent"
          envFrom:
            - configMapRef:
                name: "gibson-env"
          env:
            - name: HELM_NEO4J_VERSION
              value: "2026.04.0"
            - name: HELM_CHART_VERSION
              value: "2026.4.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVICE_NEO4J_ADMIN
              value: "gibson-admin.gibson.svc.cluster.local"
            - name: SERVICE_NEO4J_INTERNALS
              value: "gibson-internals.gibson.svc.cluster.local"
            - name: SERVICE_NEO4J
              value: "gibson.gibson.svc.cluster.local"
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          resources:
            limits:
              cpu: 1000m
              memory: 3Gi
            requests:
              cpu: 500m
              memory: 2Gi
          securityContext: 
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              runAsGroup: 7474
              runAsNonRoot: true
              runAsUser: 7474
          volumeMounts:
            - mountPath: "/config/neo4j.conf"
              name: neo4j-conf
            - mountPath: "/config/server-logs.xml"
              name: neo4j-server-logs
            - mountPath: "/config/user-logs.xml"
              name: neo4j-user-logs
            - mountPath: "/config/neo4j-auth"
              name: neo4j-auth
            - mountPath: /plugins
              name: neo4j-plugins            
            - mountPath: "/config/"
              name: "apoc-conf"                                    
            - mountPath: "/backups"
              name: "data"
              subPathExpr: "backups"
            - mountPath: "/data"
              name: "data"
              subPathExpr: "data"
            - mountPath: "/import"
              name: "data"
              subPathExpr: "import"
            - mountPath: "/licenses"
              name: "data"
              subPathExpr: "licenses"
            - mountPath: "/logs"
              name: "data"
              subPathExpr: "logs/$(POD_NAME)"
            - mountPath: "/metrics"
              name: "data"
              subPathExpr: "metrics/$(POD_NAME)"                        
          # Allow user to override the readinessProbe settings for advanced use cases
          # See: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.30/#probe-v1-core
          readinessProbe:
            # Allow overriding the probe action
            tcpSocket:
              port: 7687
            # If no probe action is set, default to using tcpSocket probe to check port 7687 to check if bolt connections can be made
            failureThreshold: 20
            timeoutSeconds: 10
            periodSeconds: 5
          # Allow user to override the livenessProbe settings for advanced use cases
          # See: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.30/#probe-v1-core
          livenessProbe:
            # Allow overriding the probe action
            tcpSocket:
              port: 7687
            # If no probe action is set, default to using tcpSocket probe to check port 7687 to check if bolt connections can be made
            failureThreshold: 40
            timeoutSeconds: 10
            periodSeconds: 5
          # Allow user to override the startupProbe settings for advanced use cases
          # See: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.30/#probe-v1-core
          startupProbe:
            # Allow overriding the probe action
            tcpSocket:
              port: 7687
            timeoutSeconds: 10
            failureThreshold: 1000
            periodSeconds: 5
      volumes:
        - name: neo4j-conf
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: "gibson-default-config"
              - configMap:
                  name: "gibson-user-config"
              - configMap:
                  name: "gibson-k8s-config"
        - name: neo4j-server-logs
          configMap:
            name: "gibson-server-logs-config"
        - name: neo4j-user-logs
          configMap:
            name: "gibson-user-logs-config"
        - name: "neo4j-auth"
          secret:
            secretName: "gibson-neo4j-auth"        
        - emptyDir: {}
          name: neo4j-plugins        
        - name: apoc-conf
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: "gibson-apoc-config"                        
  volumeClaimTemplates: 
    - metadata:
        name: "data"
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
