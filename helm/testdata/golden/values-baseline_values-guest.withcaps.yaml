      volumes:
      - name: zitadel-config-yaml
        configMap:
          name: gibson-zitadel-config-yaml
      - name: zitadel-system-key
        secret:
          items:
          - key: public-key.pem
            path: system-bot-pub.pem
          secretName: gibson-zitadel-system-key
---
# Source: gibson/charts/gibson-workloads/templates/auth/openbao-deployment.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gibson-openbao
  namespace: gibson
  # Cold-bringup ordering under Argo (deploy#1737). OpenBao is the
  # ONE External Secrets backend and it lives in this chart, so on a cold
  # sync the producer must be Ready before the ClusterSecretStore (-10) and
  # the ExternalSecrets (-8) that the wave graph gates on. Wave -12 puts the
  # whole OpenBao family (this object and its siblings in this file) ahead
  # of them; everything the pod itself needs either sits in this wave or is
  # written by the bringup before the sync (the bringup-keyring Secret).
  # Without this, the store reports InvalidProviderConfig at -10, Argo fails
  # the wave, and the first cold recreate deadlocks (measured, kind
  # 2026-09-02). Helm ignores these annotations and applies in one phase.
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: openbao
spec:
  serviceName: gibson-openbao
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gibson-workloads
      app.kubernetes.io/instance: gibson
      app.kubernetes.io/component: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-workloads
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: openbao
        gibson.zeroroot.ai/net-role: datastore
        gibson.zeroroot.ai/datastore: openbao
        gibson.zeroroot.ai/kube-api: "true"
      annotations:
        checksum/config: f8be2b221e62422b4f93c4481fd3d5e8f8b5a2230848ea135daca0ccf2d04f95
        # Velero fs-backup skips the scratch volumes. scripts/check-velero-volume-excludes.sh.
        backup.velero.io/backup-volumes-excludes: "tmp,auto-init-tmp"
    spec:
      serviceAccountName: gibson-openbao
      # The restricted Pod Security Standard (ADR-0165, charts#394). The
      # image runs as the openbao user (uid 100). SKIP_CHOWN and SKIP_SETCAP
      # keep the entrypoint from the root-only steps.
      securityContext:
        fsGroup: 1000
        runAsUser: 100
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: "ghcr.io/zeroroot-ai/mirror/openbao:2.5.3@sha256:fdc6da21ca6963560c32336fd7feb9cf2d5e52668f1a1647205a4b41171f0806"
          imagePullPolicy: IfNotPresent
          command:
            - bao
            - server
            - -config=/etc/openbao/config/openbao.hcl
          ports:
            - name: http
              containerPort: 8200
              protocol: TCP
            - name: cluster
              containerPort: 8201
              protocol: TCP
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
            - name: BAO_API_ADDR
              value: "http://gibson-openbao:8200"
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/openbao/config
              readOnly: true
            - name: data
              mountPath: /etc/openbao/data
            # The bringup keyring member the static seal reads (deploy#1731).
            # Read-only, openbao container only: the sidecar never sees it.
            - name: seal-key
              mountPath: /etc/openbao/seal
              readOnly: true
            # The root filesystem is read-only. The server writes scratch here.
            - name: tmp
              mountPath: /tmp
          # LIVENESS keeps sealedcode=204 deliberately. Restarting a sealed
          # OpenBao does not unseal it — it destroys the sidecar's in-progress
          # recovery and, in a CrashLoopBackOff, prevents recovery entirely.
          # A sealed server is unhealthy, not dead.
          #
          # READINESS does NOT. It used to carry sealedcode=204 as well, so a
          # sealed pod reported Ready and kept receiving Service traffic: a
          # complete secret-store outage with no health signal anywhere. The
          # comment justified it with "the StatefulSet would never go Ready on
          # first boot of a fresh PVC" — which is what uninitcode=204 is for,
          # and it is a separate parameter. Measured against
          # openbao/openbao:2.5.3 running as uid 100:
          #
          #   state                    ?standbyok=true&uninitcode=204
          #   uninitialized (fresh)    HTTP 204   <- first boot still goes Ready
          #   initialized + sealed     HTTP 503   <- now correctly NOT Ready
          #   initialized + unsealed   HTTP 200
          #
          # So dropping sealedcode costs nothing on first boot and buys a real
          # signal for the failure mode a bad audit device produces.
          #
          # BOTH PROBES DECLARE timeoutSeconds, because the default is 1 and 1 is
          # not enough here. Measured on gibson exit-test-bank run 36922487157
          # (2026-10-01): every probe failed with
          #
          #   Get "http://10.244.0.28:8200/v1/sys/health?...": context deadline
          #   exceeded (Client.Timeout exceeded while awaiting headers)
          #
          # A deadline, not a refusal: the socket accepted and no header came
          # back in time. The pod read 2/2 Running throughout, which is why
          # every look at the pod list said nothing was wrong.
          #
          # What that cost: ESO's ClusterSecretStore is a sync hook, it could not
          # build a client against an OpenBao that would not answer, Argo spent
          # its five retries on that one task, and every resource behind it —
          # the daemon included — was never created. Three gibson exit tests
          # failed at "Stand up the setec cluster" for three days with no
          # further detail.
          #
          # The whole bringup waits on this one endpoint, so it gets the longest
          # timeout in the chart rather than the shortest.
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&uninitcode=204
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            # A sealed server is not a blip: the static seal could not open
            # the store (wrong keyring) or the audit-device sanity check
            # failed. Fail readiness reasonably fast, but not so fast that a
            # slow start flaps it.
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # openbao-auto-init — sidecar that drives OpenBao from a fresh PVC to
        # initialized, seeded and root-free, and stays running so the platform
        # service token is kept renewed (deploy#1732).
        #
        # 1. On first start of a fresh PVC: POSTs /v1/sys/init with
        #    recovery_shares=1, recovery_threshold=1. The static seal has
        #    already unwrapped the store, so there is no unseal step. The
        #    initial root token is held in memory for this one pass. It
        #    mounts kv v2 and transit, writes the two policies and the two
        #    kubernetes-auth roles, proves that this sidecar can log in with
        #    its OWN ServiceAccount, mints the two operator tokens, seeds
        #    every key in files/openbao-seed-keys.txt, and is then REVOKED.
        #    The recovery keys in the init response are discarded unread
        #    (see vault_init).
        # 2. On every later pod start the static seal unseals the store
        #    itself. The sidecar logs in with the `openbao-seeder` role
        #    (kubernetes auth, bound to this pod's ServiceAccount), re-runs
        #    the same idempotent pass, renews or re-mints the service token,
        #    and revokes its own login token. No token is ever stored for it.
        # 3. Loops every 10s. A store that reports sealed under the static
        #    seal is running under the wrong keyring; the sidecar says so
        #    and never attempts an unseal, because there is nothing to
        #    unseal with.
        #
        # THE SEED CONTRACT is helm/gibson-workloads/files/openbao-seed-keys.txt,
        # inlined below. One kv v2 mount, `secret`, one path per key,
        # `secret/data/<key>`, properties as the table lists them.
        # Idempotent by property: a present value is never overwritten,
        # except the two keyring inputs (they follow the keyring) and the
        # service token (it follows the Secret this sidecar writes).
        #
        # (helm.sh/hook policy): this is a sidecar container, not a
        # helm hook. The init Jobs in templates/auth/openbao-*-init/ depend
        # on the bootstrap this sidecar performs.
        #
        # Image choice: `alpine/k8s:1.31.0` is the same image the
        # openbao-jwt-auth-init / openbao-approle-cert-manager-init Jobs
        # use. It ships curl, jq and a sane CA bundle so the K8s apiserver
        # TLS handshake works for the gibson-platform-operator-vault write.
        - name: openbao-auto-init
          image: "ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -u
              # Every scratch file lives in a per-process directory. A fixed
              # /tmp path is a shared-file race the moment two copies of this
              # script run on one host, which is exactly what the chart's
              # parallel test suites do (deploy#1732).
              TMPD="$(mktemp -d)"
              seed_checked=0; seed_written=0; seed_failed=0
              BAO_ADDR_LOCAL="http://127.0.0.1:8200"
              NAMESPACE="gibson"
              # The bringup keyring Secret and key, for log messages only. The
              # sidecar never reads the seal key: the openbao container mounts
              # it and the static seal consumes it (deploy#1731).
              KEYRING_SECRET="bringup-keyring"
              KEYRING_KEY="openbao-seal-key"
              # This pod's ServiceAccount, the one the openbao-seeder role binds.
              OWN_SA="gibson-openbao"
              # The auth mount, the two roles and the two policies. #1733 codes
              # the ClusterSecretStore against AUTH_MOUNT and ESO_ROLE.
              AUTH_MOUNT="kubernetes"
              SEEDER_ROLE="openbao-seeder"
              SEEDER_POLICY="openbao-seeder"
              PLATFORM_POLICY="platform-operator"
              # The policy every token carried before each consumer got its
              # own. The reconcile pass deletes it after the re-mint.
              LEGACY_POLICY="platform-admin"
              # The two operator tokens, each in its own Secret (vault_mint_token).
              PLATFORM_TOKEN_SECRET="gibson-platform-operator-vault"
              TENANT_OP_TOKEN_SECRET="gibson-tenant-operator-vault"
              TENANT_OP_POLICY="tenant-operator"
              # The token of each Job that configures the store, as
              # <Secret>:<policy>. Each Job mounts its own Secret and nothing else.
              JOB_TOKENS="gibson-openbao-iam-admin-escrow:iam-admin-escrow gibson-openbao-jwt-auth-init:jwt-auth-init"
              ESO_ROLE="eso-reader"
              ESO_POLICY="eso-reader"
              ESO_SA_NAME="external-secrets"
              ESO_SA_NS="external-secrets"
              # The two keyring inputs the bringup projects into this container
              # (volume bringup-inputs). Absent files mean "nothing supplied".
              INPUTS_DIR=/etc/openbao/inputs
              KUBE_TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
              KUBE_CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              KUBE_API="https://kubernetes.default.svc"
              # The seed contract, verbatim from files/openbao-seed-keys.txt.
              SEED_TABLE='
              # The OpenBao seed contract (deploy#1732). ONE definition.
              #
              # The openbao-auto-init sidecar reads this table and makes sure every key
              # exists in the kv v2 mount `secret` at `secret/data/<key>` with every
              # property listed. Nothing in this repository cross-checks the table against
              # the ExternalSecrets that read it. zeroroot-ai/hosted secret-contract.yaml is
              # the cross-repo record of which key each consumer reads, and
              # zeroroot-ai/hosted scripts/check-secret-contract.py gates it.
              #
              # Format: one key per line, `<key> <property>:<kind>[:<arg>] ...`.
              # Comment lines start with `#`.
              #
              # Kinds, and what the sidecar does when the property is ABSENT:
              #   rand           32 random bytes, URL-safe base64, no padding (43 chars)
              #   randb64        32 random bytes, standard base64 (44 chars)
              #   rand8          8 random bytes, URL-safe base64, no padding (11 chars)
              #   pw             43 random letters and digits (256 bits): a PASSWORD, the
              #                  kind for every value a program may receive as an argument.
              #                  rand starts with '-' one draw in 64, and `neo4j-admin dbms
              #                  set-initial-password -Xyz` reads that as an option (exit
              #                  64, blocker 3 loops #16/#18). scripts/check-seed-passwords.sh
              #                  refuses password:rand.
              #   ecpem:<name>   the private key of transit key <name> (ecdsa-p256), PEM
              #   rsapem:<name>  the private key of transit key <name> (rsa-2048), PEM
              #   rsapub:<name>  the public key of transit key <name> (rsa-2048), PEM
              #   literal:<v>    the literal value <v>
              #   empty          the empty string. The operator fills it in later with
              #                  scripts/baseline-set-secret.sh
              #   input:<file>   the bringup keyring input mounted at /etc/openbao/inputs/<file>
              #   inputjson:<f>  the property of the same name in the JSON object mounted at
              #                  /etc/openbao/inputs/<f>
              #   inputor:<f>:<v> the keyring input <f> when the bringup supplied one, else
              #                  the literal <v> (charts#486). A test-mode placeholder stays
              #                  only while the keyring member is empty.
              #   svctoken       the platform service token the sidecar minted
              #
              # A property that is PRESENT is never overwritten, with two exceptions:
              # `input`, `inputjson` and `inputor` follow the keyring (a non-empty keyring value that
              # differs from the stored one is written, at sidecar start and on every
              # five-minute pass after it, so a member set after the bringup lands without
              # a pod restart), and `svctoken` follows the token in the
              # gibson-platform-operator-vault Secret. Everything else is generated once
              # and kept, so an upgrade never rotates a credential under a workload.
              gibson-gibson-platform-postgres-password password:pw
              gibson-dashboard-postgres-password password:pw
              gibson-tenant-admin-postgres-password password:pw
              gibson-zitadel-postgres-password password:pw
              gibson-openfga-postgres-password password:pw
              gibson-spire-postgres-password password:pw
              gibson-neo4j-password password:pw
              gibson-redis-password password:pw
              zitadel-masterkey value:rand
              gibson-billing-webhook-secret secret:rand
              gibson-dashboard-session-secrets auth_secret:rand server_actions_key:randb64
              gibson-cg-signing-key key:rand kid:rand8
              gibson-extauthz-grant-current pem:ecpem:extauthz-grant-current kid:rand8
              gibson-extauthz-grant-previous pem:ecpem:extauthz-grant-previous kid:rand8
              gibson-zitadel-system-bot-key private_key:rsapem:zitadel-system-bot public_key:rsapub:zitadel-system-bot
              ghcr-pull-secret pat:input:ghcr-pull-token
              gibson-dashboard-auth-hardening captcha_secret_key:empty email_resend_api_key:empty
              gibson-stripe-credentials publishable_key:inputor:stripe-publishable-key:pk_test_placeholder secret_key:inputor:stripe-secret-key:sk_test_placeholder webhook_secret:inputor:stripe-webhook-secret:whsec_placeholder
              ses-smtp-credentials username:input:smtp-username password:input:smtp-password
              gibson-vault-admin-token token:svctoken
              setec-disk-signing seed:input:setec-disk-signing-seed
              
              '
              # Token rotates; re-read at use time.
              kube_curl() {
                tok=$(cat "$KUBE_TOKEN_FILE")
                curl -sS --cacert "$KUBE_CACERT" -H "Authorization: Bearer ${tok}" "$@"
              }

              vault_status() {
                curl -sS "${BAO_ADDR_LOCAL}/v1/sys/seal-status"
              }

              json_get() {
                # Tiny JSON value extractor (sh + grep + sed).
                # Args: <json> <key>. Handles "key":"value" and "key":bool.
                printf '%s' "$1" | grep -o "\"$2\":[^,}]*" | head -1 | sed "s/^\"$2\"://" | sed 's/^"//; s/"$//'
              }

              vault_init() {
                # Initialize under the static seal. An auto-unseal seal takes
                # recovery shares, not secret shares, and the store is already
                # unwrapped when the call returns: there is no unseal step.
                #
                # THE RECOVERY KEYS ARE DISCARDED, DELIBERATELY (deploy#1731).
                # The init response carries recovery_keys, root_token and
                # nothing else this sidecar needs. A recovery key is a path to
                # root (/sys/generate-root) and would have to be stored
                # somewhere to be of use; deploy#1195 removed exactly such a
                # stored credential from this namespace. The recovery path for
                # this store is the archive plus the bringup keyring, not a
                # key in a Secret. So:
                #   - the response is held in one shell variable, never
                #     written to a file (the previous code wrote it to a file);
                #   - only root_token is parsed out of it;
                #   - nothing from it is logged;
                #   - the variable is cleared before this function returns.
                # Prints the root token on stdout and nothing else.
                resp=$(curl -sS -w '\n%{http_code}' \
                  -X POST -H "Content-Type: application/json" \
                  -d '{"recovery_shares":1,"recovery_threshold":1}' \
                  "${BAO_ADDR_LOCAL}/v1/sys/init")
                code=$(printf '%s' "$resp" | tail -n 1)
                if [ "$code" != "200" ]; then
                  # A failed init returns an error body with no key material.
                  echo "[openbao-auto-init] FATAL: /v1/sys/init returned HTTP $code: $(printf '%s' "$resp" | sed '$d')" >&2
                  resp=""
                  return 1
                fi
                # `[^"]*` stops before the closing quote, so nothing has to be
                # stripped afterwards (deploy#447).
                root=$(printf '%s' "$resp" | sed '$d' | tr -d '\n' | grep -o '"root_token":"[^"]*"' | head -1 | cut -d'"' -f4)
                resp=""
                if [ -z "$root" ]; then
                  echo "[openbao-auto-init] FATAL: /v1/sys/init returned no root_token" >&2
                  return 1
                fi
                printf '%s' "$root"
              }

              vault_revoke_initial_root() {
                # deploy#1195 / deploy#1731: the initial root token returned by
                # /sys/init is non-expiring and root-policy, and it guards
                # transit/derive/master-kek, the derivation root for every
                # per-tenant KEK. It is revoked at the end of bootstrap on
                # EVERY profile. No profile mints a literal root token any
                # more (deploy#1732 deleted the kind devMode fixture): after
                # this call no root-policy token exists anywhere.
                #
                # Preconditions, all verified in this same pass before the
                # call: the openbao-seeder role answers a login from this
                # pod's ServiceAccount (the standing re-auth path); the
                # platform service token was minted, written to
                # gibson-platform-operator-vault and answers lookup-self (it
                # is a no_parent orphan, so it survives this call); the kv v2
                # mount exists. A failed precondition skips this call and
                # leaves the initial root in memory only. Failing to revoke is
                # a security regression; revoking with no working replacement
                # is an outage. We choose the regression.
                #
                # Idempotent: revoke-self on an already-revoked token returns
                # 403, which is treated as success.
                root="$1"
                code=$(curl -sS -o ${TMPD}/revoke.json -w '%{http_code}' \
                  -X POST -H "X-Vault-Token: ${root}" \
                  "${BAO_ADDR_LOCAL}/v1/auth/token/revoke-self")
                if [ "$code" = "204" ] || [ "$code" = "200" ] || [ "$code" = "403" ]; then
                  echo "[openbao-auto-init] initial root token REVOKED (HTTP $code). No recovery key exists; the archive plus the bringup keyring is the recovery path. There is nothing else to keep"
                  return 0
                fi
                echo "[openbao-auto-init] WARN: revoke-self returned HTTP $code: $(cat ${TMPD}/revoke.json) — initial root token is STILL LIVE (deploy#1195)" >&2
                return 1
              }

              vault_revoke_self() {
                # Revoke a short-lived login token at the end of a pass so the
                # sidecar leaves nothing live behind it. Best effort.
                curl -sS -o /dev/null -X POST -H "X-Vault-Token: $1" \
                  "${BAO_ADDR_LOCAL}/v1/auth/token/revoke-self" || true
              }

              vault_token_usable() {
                # lookup-self answers 200 for a live token and nothing else.
                tok="$1"
                [ -n "$tok" ] || return 1
                code=$(curl -sS -o /dev/null -w '%{http_code}' \
                  -H "X-Vault-Token: ${tok}" \
                  "${BAO_ADDR_LOCAL}/v1/auth/token/lookup-self")
                [ "$code" = "200" ]
              }

              vault_service_token_usable() {
                # Confirm the freshly minted service token actually authenticates
                # BEFORE the initial root is revoked. Without this, a subtly
                # malformed mint would be discovered only after the only other
                # credential had been destroyed.
                vault_token_usable "$1"
              }

              b64url_decode() {
                # One JWT segment to JSON. base64url is base64 with two
                # characters swapped and the padding dropped, and busybox
                # base64 accepts neither, so both are put back.
                s=$(printf '%s' "$1" | tr '_-' '/+')
                case $(( ${#s} % 4 )) in 2) s="${s}==" ;; 3) s="${s}=" ;; esac
                printf '%s' "$s" | base64 -d 2>/dev/null
              }

              bao_login_diagnose() {
                # Runs ONLY after a kubernetes-auth login failed.
                #
                # OpenBao answers every login failure with the same bare 403
                # "permission denied" — a missing token, a token the apiserver
                # will not review, a review it refuses, and a subject the role
                # does not bind all look identical from the outside. charts#80
                # lost two days to that body, and gibson's exit-test-bank lost
                # five (2026-09-28 .. 2026-10-02, 44 runs) to the same three
                # words. Each line below separates one step. None prints a
                # token, and the review body carries no secret.
                echo "[openbao-auto-init] --- why the login failed ---" >&2

                # STEP 1. The credential this pod presents. An absent
                # projected token reaches OpenBao as jwt:"" and comes back as
                # permission denied, indistinguishable from a rejected one.
                if [ ! -s "$KUBE_TOKEN_FILE" ]; then
                  echo "[openbao-auto-init]   token: $KUBE_TOKEN_FILE is MISSING OR EMPTY. This pod mounts no ServiceAccount token, so no login can succeed. Check automountServiceAccountToken on the StatefulSet and on ServiceAccount ${OWN_SA}." >&2
                  return 0
                fi
                echo "[openbao-auto-init]   token: $(wc -c < "$KUBE_TOKEN_FILE" | tr -d ' ') bytes present" >&2

                # STEP 2. What the token claims, unverified. `sub` is the
                # identity the apiserver reports and the role's
                # bound_service_account_names must equal it. `aud` must hold an
                # audience the apiserver accepts, or the review fails before
                # the subject is ever considered.
                claims=$(b64url_decode "$(cut -d. -f2 < "$KUBE_TOKEN_FILE")")
                got_sub=$(printf '%s' "$claims" | jq -r '.sub // "<unparsable>"' 2>/dev/null || echo "<unparsable>")
                want_sub="system:serviceaccount:${NAMESPACE}:${OWN_SA}"
                echo "[openbao-auto-init]   token sub=${got_sub} aud=$(printf '%s' "$claims" | jq -c '.aud // "<none>"' 2>/dev/null || echo '<unparsable>')" >&2
                if [ "$got_sub" = "$want_sub" ]; then
                  echo "[openbao-auto-init]   subject matches what role ${SEEDER_ROLE} binds (${want_sub}), so the role is not the fault" >&2
                else
                  echo "[openbao-auto-init]   SUBJECT MISMATCH: role ${SEEDER_ROLE} binds ${want_sub}. A login with any other subject is refused as permission denied." >&2
                fi

                # STEP 3. The review OpenBao makes on its own behalf, run from
                # here with the same ServiceAccount OpenBao reviews as. This is
                # the step the bare 403 hides, and it splits the two halves:
                # refused or unreachable here means the fault is outside
                # OpenBao; authenticated=true means OpenBao saw a good answer
                # and refused anyway.
                rv=$(kube_curl -o "${TMPD}/tr.json" -w '%{http_code}' -X POST \
                      -H 'Content-Type: application/json' \
                      -d "$(jq -nc --rawfile j "$KUBE_TOKEN_FILE" \
                            '{apiVersion:"authentication.k8s.io/v1",kind:"TokenReview",spec:{token:($j|rtrimstr("\n"))}}')" \
                      "${KUBE_API}/apis/authentication.k8s.io/v1/tokenreviews" 2>/dev/null) || rv="000"
                case "$rv" in
                  200|201)
                    echo "[openbao-auto-init]   TokenReview HTTP ${rv}: authenticated=$(jq -r '.status.authenticated // false' "${TMPD}/tr.json") username=$(jq -r '.status.user.username // "<none>"' "${TMPD}/tr.json") error=$(jq -r '.status.error // ""' "${TMPD}/tr.json")" >&2
                    echo "[openbao-auto-init]   The apiserver accepts this review, so the refusal is OpenBao's own: compare the role above against auth/${AUTH_MOUNT}/role/${SEEDER_ROLE} and check the login used that same mount." >&2
                    ;;
                  401|403)
                    echo "[openbao-auto-init]   TokenReview HTTP ${rv}: the apiserver REFUSES this pod's review — $(jq -r '.message // ""' "${TMPD}/tr.json")" >&2
                    echo "[openbao-auto-init]   OpenBao reviews as ServiceAccount ${OWN_SA} and needs system:auth-delegator for it. The ClusterRoleBinding gibson-openbao-auth-delegator is that grant." >&2
                    ;;
                  000)
                    echo "[openbao-auto-init]   TokenReview did not complete: no answer from ${KUBE_API}. Egress to the kube-apiserver is the first thing to check — a narrowing NetworkPolicy must name the API CIDRs (global.networkPolicy.apiServerCIDRs), and an empty list renders no rule at all." >&2
                    ;;
                  *)
                    echo "[openbao-auto-init]   TokenReview HTTP ${rv}: $(head -c 300 "${TMPD}/tr.json")" >&2
                    ;;
                esac
                rm -f "${TMPD}/tr.json"
              }
              bao_login_seeder() {
                # Log in with THIS pod's ServiceAccount through the kubernetes
                # auth mount, role openbao-seeder. The projected token is
                # short-lived and re-read at every call; the OpenBao token it
                # buys carries the openbao-seeder policy and a short TTL, and
                # every pass revokes it when done. This is the standing path
                # back into the store on every profile: no stored credential,
                # no root token, no recovery key (closes the deploy#1731 gap).
                # Prints the client token and nothing else.
                jwt=$(cat "$KUBE_TOKEN_FILE")
                body=$(jq -nc --arg r "$SEEDER_ROLE" --arg j "$jwt" '{role:$r,jwt:$j}')
                jwt=""
                code=$(curl -sS -o ${TMPD}/login.json -w '%{http_code}' \
                  -X POST -H "Content-Type: application/json" -d "$body" \
                  "${BAO_ADDR_LOCAL}/v1/auth/${AUTH_MOUNT}/login")
                body=""
                if [ "$code" != "200" ]; then
                  echo "[openbao-auto-init] WARN: login as ${OWN_SA} with role ${SEEDER_ROLE} returned HTTP $code: $(cat ${TMPD}/login.json)" >&2
                  rm -f ${TMPD}/login.json
                  bao_login_diagnose
                  return 1
                fi
                t=$(jq -r '.auth.client_token // empty' ${TMPD}/login.json)
                rm -f ${TMPD}/login.json
                [ -n "$t" ] || { echo "[openbao-auto-init] WARN: login response carried no client_token" >&2; return 1; }
                printf '%s' "$t"
              }

              vault_seeder_login_works() {
                # The precondition for revoking root: this pod can get back in
                # on its own. Logs in, proves the token, revokes it.
                t=$(bao_login_seeder) || return 1
                if ! vault_token_usable "$t"; then
                  echo "[openbao-auto-init] FATAL: the ${SEEDER_ROLE} login token failed lookup-self" >&2
                  vault_revoke_self "$t"
                  return 1
                fi
                vault_revoke_self "$t"
                echo "[openbao-auto-init] seeder role login OK: ServiceAccount ${OWN_SA} -> auth/${AUTH_MOUNT} role ${SEEDER_ROLE} (policy ${SEEDER_POLICY})"
              }

              vault_mint_token() {
                # $1 minter token, $2 policy, $3 the Secret that receives it.
                #
                # Mint a RENEWABLE service token for operator runtime use.
                # The initial root token is non-renewable by design, and it is
                # revoked at the end of bootstrap; the platform-operator's
                # vaulttoken.Renewer calls /auth/token/renew-self on a
                # 5-minute loop and needs a token that accepts it (deploy#454).
                #
                # period=1h and renewable=true keep the token alive
                # indefinitely as long as renew-self is called before the
                # period elapses — the Renewer fires at 2/3 TTL (~40 min), and
                # this sidecar renews it every ~5 min as well. no_parent=true
                # makes the token a service-orphan so it survives the
                # revocation of whatever minted it (the initial root at init,
                # a seeder login token on a re-mint).
                #
                # One token for each consumer, each in its own Secret:
                #   gibson-platform-operator-vault  policy platform-operator, the
                #     platform-operator's (through the ESO copy
                #     gibson-openbao-keys, see seed key gibson-vault-admin-token)
                #   gibson-tenant-operator-vault    policy tenant-operator, the
                #     tenant-operator's, read from this Secret directly
                # The tenant-operator's token reaches tenant namespaces, the
                # KEK HMAC and nothing in the root namespace's kv store, where
                # the escrowed Zitadel owner credentials live.
                #   JOB_TOKENS                      one token for each Job that
                #     configures the store, with the paths of its script only
                #
                # Nothing here restarts a workload. Reloader rolls each
                # operator when the Secret it reads changes (the
                # secret.reloader.stakater.com/reload annotation on each).
                minter="$1"; policy="$2"; secret="$3"
                body=$(jq -nc --arg p "$policy" '{"policies":[$p],"period":"1h","renewable":true,"no_parent":true}')
                code=$(curl -sS -o ${TMPD}/svc_tok.json -w '%{http_code}' \
                  -X POST -H "X-Vault-Token: ${minter}" -H "Content-Type: application/json" \
                  -d "$body" \
                  "${BAO_ADDR_LOCAL}/v1/auth/token/create")
                if [ "$code" != "200" ]; then
                  echo "[openbao-auto-init] FATAL: mint renewable service token (policy=${policy}) returned HTTP $code: $(cat ${TMPD}/svc_tok.json)" >&2
                  rm -f ${TMPD}/svc_tok.json
                  return 1
                fi
                svc_token=$(grep -o '"client_token":"[^"]*"' ${TMPD}/svc_tok.json | head -1 | cut -d'"' -f4)
                rm -f ${TMPD}/svc_tok.json
                if [ -z "$svc_token" ]; then
                  echo "[openbao-auto-init] FATAL: renewable service token response missing client_token" >&2
                  return 1
                fi
                echo "[openbao-auto-init] minted renewable service token (policy=${policy}, period=1h, renewable=true) for Secret ${secret}"
                # Idempotent: tries POST first (create); on 409 (already
                # exists) falls back to PATCH (update).
                svc_tok_b64=$(printf '%s' "$svc_token" | base64 | tr -d '\n')
                op_secret_body=$(jq -nc \
                  --arg ns "$NAMESPACE" \
                  --arg name "$secret" \
                  --arg b64 "$svc_tok_b64" \
                  '{
                    "apiVersion":"v1",
                    "kind":"Secret",
                    "metadata":{
                      "name":$name,
                      "namespace":$ns,
                      "labels":{
                        "app.kubernetes.io/managed-by":"openbao-auto-init",
                        "app.kubernetes.io/component":"openbao"
                      }
                    },
                    "type":"Opaque",
                    "data":{"VAULT_ADMIN_TOKEN":$b64}
                  }')
                op_code=$(kube_curl -o ${TMPD}/op_sec.json -w '%{http_code}' \
                  -H "Content-Type: application/json" \
                  -X POST \
                  --data-binary "$op_secret_body" \
                  "${KUBE_API}/api/v1/namespaces/${NAMESPACE}/secrets")
                if [ "$op_code" = "201" ]; then
                  echo "[openbao-auto-init] created ${secret} Secret"
                  return 0
                fi
                if [ "$op_code" = "409" ]; then
                  patch_body=$(jq -nc --arg b64 "$svc_tok_b64" \
                    '{"data":{"VAULT_ADMIN_TOKEN":$b64}}')
                  patch_code=$(kube_curl -o ${TMPD}/op_patch.json -w '%{http_code}' \
                    -H "Content-Type: application/strategic-merge-patch+json" \
                    -X PATCH \
                    --data-binary "$patch_body" \
                    "${KUBE_API}/api/v1/namespaces/${NAMESPACE}/secrets/${secret}")
                  if [ "$patch_code" = "200" ]; then
                    echo "[openbao-auto-init] patched ${secret} Secret (token refresh)"
                    return 0
                  fi
                  echo "[openbao-auto-init] FATAL: patch ${secret} returned HTTP $patch_code: $(cat ${TMPD}/op_patch.json)" >&2
                  return 1
                fi
                echo "[openbao-auto-init] FATAL: create ${secret} returned HTTP $op_code: $(cat ${TMPD}/op_sec.json)" >&2
                return 1
              }

              kube_read_token() {
                # Read the current renewable service token out of the Secret
                # named $1. Prints the decoded token, or nothing.
                b64=$(kube_curl \
                  "${KUBE_API}/api/v1/namespaces/${NAMESPACE}/secrets/$1" \
                  2>/dev/null | grep '"VAULT_ADMIN_TOKEN":' | head -1 | \
                  sed 's/.*"VAULT_ADMIN_TOKEN":[[:space:]]*"\([^"]*\)".*/\1/')
                if [ -n "$b64" ]; then
                  printf '%s' "$b64" | base64 -d 2>/dev/null | tr -d '\n' || true
                fi
              }

              vault_ensure_token() {
                # $1 the Secret, $2 its policy, $3 (optional) a seeder login
                # token the caller already holds.
                #
                # Ensure the Secret has a valid, non-expired renewable service
                # token. Called on every pod start and every 5 minutes in
                # steady state, once per operator token.
                #
                # Strategy:
                #   1. Read current token from the Secret.
                #   2. Call /v1/auth/token/lookup-self.
                #   3. If 200 and TTL > 1800s (30 min headroom) — nothing to do.
                #   4. If 200 but TTL <= 1800s — call renew-self to extend TTL.
                #      Renewal keeps the same token ID, so running pods pick up
                #      the extended TTL automatically without a restart.
                #   5. If non-200 — log in with the openbao-seeder role, mint a
                #      fresh token and write the Secret. Reloader rolls the
                #      operator that reads it.
                # Reaching step 5 means the sidecar was down for longer than
                # the token's period, or the store was restored from an
                # archive into a cluster that never saw this token. Either
                # way the re-auth path is the ServiceAccount, never a stored
                # credential (deploy#1732 closed the deploy#1731 gap).
                secret="$1"; policy="$2"; held="${3:-}"
                current_tok=$(kube_read_token "$secret")
                if [ -n "$current_tok" ]; then
                  lookup_resp=$(curl -sS -o ${TMPD}/lookup.json -w '%{http_code}' \
                    -H "X-Vault-Token: ${current_tok}" \
                    "${BAO_ADDR_LOCAL}/v1/auth/token/lookup-self")
                  if [ "$lookup_resp" = "200" ]; then
                    ttl=$(grep -o '"ttl":[0-9]*' ${TMPD}/lookup.json | head -1 | cut -d: -f2)
                    ttl=${ttl:-0}
                    # A token that carries another policy (a store from
                    # before the tenant-operator had its own) is replaced.
                    if jq -e --arg p "$policy" '.data.policies | index($p)' ${TMPD}/lookup.json >/dev/null; then
                      if [ "$ttl" -gt 1800 ] 2>/dev/null; then
                        return 0
                      fi
                      echo "[openbao-auto-init] ${secret} token TTL=${ttl}s below 1800s threshold — renewing"
                      renew_code=$(curl -sS -o /dev/null -w '%{http_code}' \
                        -X POST -H "X-Vault-Token: ${current_tok}" \
                        "${BAO_ADDR_LOCAL}/v1/auth/token/renew-self")
                      if [ "$renew_code" = "200" ]; then
                        echo "[openbao-auto-init] ${secret} token renewed (same ID, extended TTL)"
                        return 0
                      fi
                      echo "[openbao-auto-init] renew-self returned HTTP ${renew_code} — re-minting ${secret}"
                    else
                      echo "[openbao-auto-init] ${secret} token does not carry policy ${policy} — re-minting"
                    fi
                  else
                    echo "[openbao-auto-init] ${secret} token expired or invalid (HTTP ${lookup_resp}) — re-minting"
                  fi
                else
                  echo "[openbao-auto-init] no service token in ${secret} — minting one"
                fi
                minter="$held"
                if [ -z "$minter" ]; then
                  minter=$(bao_login_seeder) || {
                    echo "[openbao-auto-init] FATAL: the ${secret} token is unusable and the ${SEEDER_ROLE} login failed, so nothing can mint a replacement. Restore the store from its archive with the keyring it was sealed with" >&2
                    return 1
                  }
                fi
                if vault_mint_token "$minter" "$policy" "$secret"; then
                  echo "[openbao-auto-init] re-minted ${secret} with the ${SEEDER_ROLE} role (ServiceAccount ${OWN_SA}); no root token was involved"
                  erc=0
                else
                  erc=1
                fi
                # The KV copy the platform-operator reads through ESO must follow.
                if [ "$secret" = "$PLATFORM_TOKEN_SECRET" ]; then
                  seed_one "$minter" gibson-vault-admin-token token:svctoken || erc=1
                fi
                [ -n "$held" ] || vault_revoke_self "$minter"
                return $erc
              }

              vault_ensure_tokens() {
                # Every consumer token. $1 (optional) a held seeder token.
                trc=0
                vault_ensure_token "$PLATFORM_TOKEN_SECRET" "$PLATFORM_POLICY" "${1:-}" || trc=1
                vault_ensure_token "$TENANT_OP_TOKEN_SECRET" "$TENANT_OP_POLICY" "${1:-}" || trc=1
                for pair in $JOB_TOKENS; do
                  vault_ensure_token "${pair%%:*}" "${pair#*:}" "${1:-}" || trc=1
                done
                return $trc
              }

              vault_delete_legacy_policy() {
                # $1 token. Each token that carried the legacy policy was
                # re-minted with its own policy before this call (vault_ensure_token
                # replaces a token that lacks its policy). 204 and 404 are done.
                c=$(curl -sS -o ${TMPD}/delpol.json -w '%{http_code}' \
                  -X DELETE -H "X-Vault-Token: $1" \
                  "${BAO_ADDR_LOCAL}/v1/sys/policies/acl/${LEGACY_POLICY}")
                case "$c" in 200|204|404) return 0 ;; *)
                  echo "[openbao-auto-init] WARN: delete policy ${LEGACY_POLICY} returned HTTP $c: $(cat ${TMPD}/delpol.json)" >&2
                  return 1 ;;
                esac
              }

              # ---------------------------------------------------------------
              # The seed pass (deploy#1627, deploy#1732). OpenBao IS the ESO
              # backend on every profile, so the material ESO reads has to exist
              # before any workload starts, and the credential ESO uses must not
              # be a stored secret.
              #
              # All of this runs HERE, in the sidecar, with the initial root at
              # init and with a seeder login token on every later start. It is
              # deliberately not a separate Job: that would need a privileged
              # token to exist somewhere on disk, and deploy#1195 removed
              # exactly such a token from a readable Secret because it guarded
              # transit/derive/master-kek for every tenant.
              #
              # ESO authenticates with its OWN ServiceAccount through the
              # kubernetes auth method and gets a short-lived, policy-scoped
              # token. NOT the jwt mount — that one is configured against
              # SPIRE's JWKS and validates SPIFFE JWT-SVIDs, which a plain
              # ServiceAccount token is not.
              # ---------------------------------------------------------------

              # Values are generated from /dev/urandom, NOT openssl: the
              # alpine/k8s image this sidecar runs has no openssl (verified
              # against the running container, not assumed).
              gen_rand() {
                head -c "${1:-32}" /dev/urandom | base64 | tr -d '\n=' | tr '+/' '-_'
              }

              # A password that may be handed to a program as an ARGUMENT:
              # letters and digits only, never a leading '-'. gen_rand is
              # URL-safe base64, and one draw in 64 starts with '-'; the
              # Neo4j image then runs `neo4j-admin dbms set-initial-password
              # -Xyz...`, picocli reads the password as an option, exits 64,
              # and the pod crashloops until someone rotates the key (blocker
              # 3 loops #16 and #18, hosted run 34345134204, 2026-09-09).
              # 43 alphanumerics carry 256 bits, the same as gen_rand 32.
              # cut, not head, closes the pipe: every stage drains its input
              # before it exits, so nothing upstream dies of SIGPIPE under
              # pipefail. 512 random bytes give ~660 letters and digits.
              gen_pw() {
                head -c 512 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-"${1:-43}"
              }

              gen_rand_b64() {
                head -c "${1:-32}" /dev/urandom | base64 | tr -d '\n'
              }

              kv_get() {
                # Prints the current properties of secret/<key> as one JSON
                # object, `{}` for an absent key. Fails on any other answer.
                c=$(curl -sS -o ${TMPD}/kvget.json -w '%{http_code}' \
                  -H "X-Vault-Token: $1" "${BAO_ADDR_LOCAL}/v1/secret/data/$2")
                case "$c" in
                  200) jq -c '.data.data // {}' ${TMPD}/kvget.json ;;
                  404) printf '{}' ;;
                  *) echo "[openbao-auto-init] FATAL: read secret/$2 returned HTTP $c: $(cat ${TMPD}/kvget.json)" >&2; rm -f ${TMPD}/kvget.json; return 1 ;;
                esac
                rm -f ${TMPD}/kvget.json
              }

              kv_put() {
                # $1 token, $2 key, $3 JSON object of properties.
                c=$(curl -sS -o ${TMPD}/kv.json -w '%{http_code}' \
                  -X POST -H "X-Vault-Token: $1" -H "Content-Type: application/json" \
                  -d "$(jq -nc --argjson d "$3" '{data: $d}')" \
                  "${BAO_ADDR_LOCAL}/v1/secret/data/$2")
                case "$c" in
                  200|204) return 0 ;;
                  *) echo "[openbao-auto-init] FATAL: write secret/$2 returned HTTP $c: $(cat ${TMPD}/kv.json)" >&2; return 1 ;;
                esac
              }

              transit_ensure_key() {
                # $1 token, $2 name, $3 type. OpenBao mints its own signing
                # keys, so no openssl is needed and a private key is generated
                # inside the store that will hold it. Creating a key that
                # exists is a no-op.
                c=$(curl -sS -o ${TMPD}/tkey.json -w '%{http_code}' -X POST -H "X-Vault-Token: $1" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -nc --arg t "$3" '{type:$t,exportable:true}')" \
                  "${BAO_ADDR_LOCAL}/v1/transit/keys/$2")
                case "$c" in
                  200|204) return 0 ;;
                  *) echo "[openbao-auto-init] FATAL: create transit key $2 returned HTTP $c: $(cat ${TMPD}/tkey.json)" >&2; return 1 ;;
                esac
              }

              transit_private_pem() {
                # $1 token, $2 name, $3 type. Prints the private key PEM.
                transit_ensure_key "$1" "$2" "$3" || return 1
                v=$(curl -sS -H "X-Vault-Token: $1" \
                  "${BAO_ADDR_LOCAL}/v1/transit/export/signing-key/$2" \
                  | jq -r '.data.keys["1"] // empty')
                [ -n "$v" ] || { echo "[openbao-auto-init] FATAL: transit export for $2 returned no key material" >&2; return 1; }
                printf '%s' "$v"
              }

              transit_public_pem() {
                # $1 token, $2 name, $3 type. Prints the public key PEM.
                transit_ensure_key "$1" "$2" "$3" || return 1
                v=$(curl -sS -H "X-Vault-Token: $1" \
                  "${BAO_ADDR_LOCAL}/v1/transit/keys/$2" \
                  | jq -r '.data.keys["1"].public_key // empty')
                [ -n "$v" ] || { echo "[openbao-auto-init] FATAL: transit key $2 has no public key" >&2; return 1; }
                printf '%s' "$v"
              }

              seed_input() {
                # $1 kind (input|inputjson), $2 file under INPUTS_DIR, $3 property.
                # Prints the keyring value for the property, or nothing when
                # the bringup supplied none. Never fails: an absent or empty
                # input is the documented "not supplied" case.
                f="${INPUTS_DIR}/$2"
                [ -s "$f" ] || return 0
                if [ "$1" = "input" ]; then
                  tr -d '\r\n' < "$f"
                  return 0
                fi
                if ! jq -e 'type=="object"' "$f" >/dev/null 2>&1; then
                  echo "[openbao-auto-init] WARN: keyring input $2 is not a JSON object; treating it as not supplied" >&2
                  return 0
                fi
                jq -r --arg p "$3" '.[$p] // ""' "$f"
              }

              seed_generate() {
                # $1 token, $2 kind, $3 arg. Prints the value for a property
                # that does not exist yet.
                case "$2" in
                  rand)    gen_rand 32 ;;
                  randb64) gen_rand_b64 32 ;;
                  rand8)   gen_rand 8 ;;
                  pw)      gen_pw 43 ;;
                  ecpem)   transit_private_pem "$1" "$3" ecdsa-p256 ;;
                  rsapem)  transit_private_pem "$1" "$3" rsa-2048 ;;
                  rsapub)  transit_public_pem "$1" "$3" rsa-2048 ;;
                  literal) printf '%s' "$3" ;;
                  empty)   printf '' ;;
                  *) echo "[openbao-auto-init] FATAL: seed table names unknown kind '$2'" >&2; return 1 ;;
                esac
              }

              seed_one() {
                # $1 token, $2 key, $3 the property specs of one table line.
                # IDEMPOTENT BY PROPERTY, and that is load-bearing: overwriting
                # an existing value would rotate a credential underneath a
                # running workload on every restart. A property that is
                # present is left exactly as it is, except `input`/`inputjson`
                # (follow the keyring) and `svctoken` (follows the Secret).
                tok="$1"; key="$2"; specs="$3"
                cur=$(kv_get "$tok" "$key") || return 1
                new="$cur"
                written=""
                for spec in $specs; do
                  prop="${spec%%:*}"
                  rest="${spec#*:}"
                  kind="${rest%%:*}"
                  arg=""
                  case "$rest" in *:*) arg="${rest#*:}" ;; esac
                  present=$(printf '%s' "$cur" | jq -r --arg p "$prop" 'has($p)')
                  curval=$(printf '%s' "$cur" | jq -r --arg p "$prop" '.[$p] // ""')
                  val=""; write=0
                  case "$kind" in
                    input|inputjson)
                      val=$(seed_input "$kind" "$arg" "$prop")
                      if [ -n "$val" ] && [ "$val" != "$curval" ]; then
                        write=1
                      elif [ "$present" != "true" ]; then
                        val=""; write=1
                      fi ;;
                    inputor)
                      # inputor:<file>:<literal> (charts#486): the keyring
                      # input when the bringup supplied one, else the literal.
                      # A non-empty input replaces the stored value, as
                      # `input` does; an empty one leaves it, and an absent
                      # property gets the literal.
                      val=$(seed_input input "${arg%%:*}" "$prop")
                      if [ -n "$val" ] && [ "$val" != "$curval" ]; then
                        write=1
                      elif [ -z "$val" ] && [ "$present" != "true" ]; then
                        val="${arg#*:}"; write=1
                      fi ;;
                    svctoken)
                      val=$(kube_read_token "$PLATFORM_TOKEN_SECRET")
                      if [ -n "$val" ] && [ "$val" != "$curval" ]; then write=1; fi ;;
                    *)
                      if [ "$present" != "true" ]; then
                        val=$(seed_generate "$tok" "$kind" "$arg") || return 1
                        write=1
                      fi ;;
                  esac
                  if [ "$write" = 1 ]; then
                    new=$(printf '%s' "$new" | jq -c --arg p "$prop" --arg v "$val" '.[$p]=$v')
                    written="${written} ${prop}"
                  fi
                  val=""; curval=""
                done
                seed_checked=$((seed_checked + 1))
                if [ -n "$written" ]; then
                  kv_put "$tok" "$key" "$new" || return 1
                  seed_written=$((seed_written + 1))
                  echo "[openbao-auto-init] seeded secret/${key}:${written}"
                fi
                cur=""; new=""
              }

              vault_seed_platform_secrets() {
                # Walk the seed table. Every key ends up present with every
                # property; nothing present is rotated. Prints one summary line
                # so a second run is visibly a no-op ("0 written").
                tok="$1"
                seed_checked=0; seed_written=0; seed_failed=0
                while read -r key specs; do
                  case "$key" in ''|'#'*) continue ;; esac
                  seed_one "$tok" "$key" "$specs" || seed_failed=$((seed_failed + 1))
                done <<SEED_EOF
              $SEED_TABLE
              SEED_EOF
                echo "[openbao-auto-init] seed pass complete: ${seed_checked} keys checked, ${seed_written} written, ${seed_failed} failed"
                [ "$seed_failed" -eq 0 ]
              }

              vault_write_policy() {
                # $1 token, $2 name, $3 HCL.
                c=$(curl -sS -o ${TMPD}/pol.json -w '%{http_code}' \
                  -X PUT -H "X-Vault-Token: $1" -H "Content-Type: application/json" \
                  -d "$(jq -nc --arg p "$3" '{policy:$p}')" \
                  "${BAO_ADDR_LOCAL}/v1/sys/policies/acl/$2")
                case "$c" in 200|204) return 0 ;; *)
                  echo "[openbao-auto-init] FATAL: write policy $2 returned HTTP $c: $(cat ${TMPD}/pol.json)" >&2
                  return 1 ;;
                esac
              }

              vault_write_k8s_role() {
                # $1 token, $2 role, $3 SA name, $4 SA namespace, $5 policy, $6 ttl.
                c=$(curl -sS -o ${TMPD}/role.json -w '%{http_code}' \
                  -X POST -H "X-Vault-Token: $1" -H "Content-Type: application/json" \
                  -d "$(jq -nc --arg n "$3" --arg ns "$4" --arg p "$5" --arg t "$6" \
                        '{bound_service_account_names:$n,bound_service_account_namespaces:$ns,token_policies:$p,token_ttl:$t,token_max_ttl:"1h"}')" \
                  "${BAO_ADDR_LOCAL}/v1/auth/${AUTH_MOUNT}/role/$2")
                case "$c" in 200|204) return 0 ;; *)
                  echo "[openbao-auto-init] FATAL: write role $2 returned HTTP $c: $(cat ${TMPD}/role.json)" >&2
                  return 1 ;;
                esac
              }

              vault_configure_access() {
                # The two policies, the kubernetes auth mount and its two roles.
                # Idempotent: every write is a PUT of the same content.
                tok="$1"

                # Enable the kubernetes auth method. 400 "path is already in
                # use" is the idempotent re-run, same as the kv mount.
                c=$(curl -sS -o ${TMPD}/auth.json -w '%{http_code}' \
                  -X POST -H "X-Vault-Token: $tok" -H "Content-Type: application/json" \
                  -d '{"type":"kubernetes"}' "${BAO_ADDR_LOCAL}/v1/sys/auth/${AUTH_MOUNT}")
                if [ "$c" != "204" ] && [ "$c" != "200" ]; then
                  grep -q 'path is already in use' ${TMPD}/auth.json || {
                    echo "[openbao-auto-init] FATAL: enable kubernetes auth returned HTTP $c: $(cat ${TMPD}/auth.json)" >&2
                    return 1
                  }
                fi

                # TokenReview is done with the openbao pod's OWN ServiceAccount
                # token and CA (the method's local defaults), which is why the
                # openbao SA holds system:auth-delegator. No kubernetes_ca_cert
                # is pinned: a store restored from an archive into a NEW
                # cluster must still authenticate that cluster's tokens, and a
                # pinned CA from the old cluster would lock every login out.
                c=$(curl -sS -o ${TMPD}/authcfg.json -w '%{http_code}' \
                  -X POST -H "X-Vault-Token: $tok" -H "Content-Type: application/json" \
                  -d '{"kubernetes_host":"https://kubernetes.default.svc"}' \
                  "${BAO_ADDR_LOCAL}/v1/auth/${AUTH_MOUNT}/config")
                case "$c" in 200|204) ;; *)
                  echo "[openbao-auto-init] FATAL: auth/${AUTH_MOUNT}/config returned HTTP $c: $(cat ${TMPD}/authcfg.json)" >&2
                  return 1 ;;
                esac

                # One policy for each consumer, each with the paths its code
                # calls and nothing else. No policy grants path "*".
                # scripts/check-openbao-policies.py reads each policy of the
                # render and fails on path "*" and on sudo outside a named list.
                #
                # openbao-seeder: this sidecar, on every pass after the
                # bootstrap. It mounts kv and transit, enables the kubernetes
                # auth, writes these policies and roles, mints each consumer
                # token (a no_parent token with a policy the caller does not
                # hold needs sudo), seeds the platform KV keys and the transit
                # keypairs, and deletes the legacy policy. The seeder can still
                # write any policy, so it keeps the reach of the store by
                # design. Its token lives 15 minutes and only this pod logs in
                # with the role.
                vault_write_policy "$tok" "$SEEDER_POLICY" \
                  '
              path "sys/mounts/secret" { capabilities = ["create", "update"] }
              path "sys/mounts/transit" { capabilities = ["create", "update"] }
              path "sys/auth/kubernetes" { capabilities = ["create", "update", "read", "sudo"] }
              path "auth/kubernetes/config" { capabilities = ["create", "update", "read"] }
              path "auth/kubernetes/role/*" { capabilities = ["create", "update", "read"] }
              path "sys/policies/acl/*" { capabilities = ["create", "update", "read"] }
              path "sys/policies/acl/platform-admin" { capabilities = ["delete"] }
              path "auth/token/create" { capabilities = ["create", "update", "sudo"] }
              path "secret/data/*" { capabilities = ["create", "read", "update"] }
              path "transit/keys/*" { capabilities = ["create", "read", "update"] }
              path "transit/export/signing-key/*" { capabilities = ["read"] }' || return 1

                # platform-operator: gibson operators/platform/internal/clients/vault.
                #   sys/mounts               mountExists reads the mount table
                #   sys/mounts/transit       EnsureTransitMounted
                #   transit/keys/<key>       EnsureTransitKey, the one key of
                #                            platformBootstrap.vaultTransit.keyName
                #   secret/data/gibson-zitadel-iam-admin-pat
                #                            the admin token it mints (gibson#794)
                # lookup-self and renew-self come with the default policy.
                vault_write_policy "$tok" "$PLATFORM_POLICY" \
                  '
              path "sys/mounts" { capabilities = ["read"] }
              path "sys/mounts/transit" { capabilities = ["create", "update"] }
              path "transit/keys/master-kek" { capabilities = ["create", "read", "update"] }
              path "secret/data/gibson-zitadel-iam-admin-pat" { capabilities = ["create", "read", "update"] }' || return 1

                # The Jobs that configure the store, each with the paths of its
                # own script (helpers in _openbao-policies.tpl).
                vault_write_policy "$tok" iam-admin-escrow \
                  '
              path "secret/data/gibson-zitadel-iam-admin-pat" { capabilities = ["create", "read", "update"] }
              path "secret/data/gibson-zitadel-iam-admin-machinekey" { capabilities = ["create", "read", "update"] }
              path "secret/data/gibson-zitadel-login-client-pat" { capabilities = ["create", "read", "update"] }' || return 1
                vault_write_policy "$tok" jwt-auth-init \
                  '
              path "sys/auth/jwt" { capabilities = ["create", "update", "read", "sudo"] }
              path "auth/jwt/config" { capabilities = ["create", "update", "read"] }' || return 1

                # tenant-operator: what the tenant-operator's code calls, and
                # nothing in the root namespace's kv store, where the escrowed
                # Zitadel owner credentials live (gibson
                # operators/tenant/internal/clients/vault):
                #   sys/auth/jwt              VerifyJWTAuthMounted reads the
                #                             root jwt mount (a sys/auth/<path>
                #                             read needs sudo)
                #   sys/namespaces/tenant-*   create and delete tenant-<id>
                #   transit/hmac/*            KEK derivation (HMAC only, which
                #                             reveals no key material)
                #   tenant-*                  everything inside a tenant
                #                             namespace: its kv mount, jwt
                #                             auth mount, policy and role
                # lookup-self and renew-self come with the default policy.
                vault_write_policy "$tok" "$TENANT_OP_POLICY" \
                  'path "sys/auth/jwt" { capabilities = ["read", "sudo"] }
              path "sys/namespaces/tenant-*" { capabilities = ["create", "update", "read", "delete"] }
              path "transit/hmac/*" { capabilities = ["update"] }
              path "tenant-*" { capabilities = ["create", "read", "update", "delete", "list", "sudo", "patch"] }
              ' || return 1

                # eso-reader: read-only, and only the platform material. ESO
                # never needs write, and never needs transit.
                #
                # The two sys/ paths are NOT optional and NOT scope creep: the
                # ESO vault provider does a mount preflight to resolve the KV
                # version before every read. Without them the store still
                # validates Valid/Ready — login succeeds — and then EVERY read
                # fails with the uninformative "could not get secret data from
                # provider". Verified both ways on a live cluster: 20 of 21
                # ExternalSecrets went from SecretSyncedError to SecretSynced
                # the moment these two lines were added, with nothing else
                # changed.
                vault_write_policy "$tok" "$ESO_POLICY" \
                  'path "secret/data/*" { capabilities = ["read"] }
              path "secret/metadata/*" { capabilities = ["read", "list"] }
              path "sys/internal/ui/mounts/*" { capabilities = ["read"] }
              path "sys/mounts" { capabilities = ["read"] }
              ' || return 1

                vault_write_k8s_role "$tok" "$ESO_ROLE" "$ESO_SA_NAME" "$ESO_SA_NS" "$ESO_POLICY" "1h" || return 1
                vault_write_k8s_role "$tok" "$SEEDER_ROLE" "$OWN_SA" "$NAMESPACE" "$SEEDER_POLICY" "15m" || return 1
                echo "[openbao-auto-init] access configured: auth/${AUTH_MOUNT} roles ${ESO_ROLE} (${ESO_SA_NS}/${ESO_SA_NAME}, policy ${ESO_POLICY}) and ${SEEDER_ROLE} (${NAMESPACE}/${OWN_SA}, policy ${SEEDER_POLICY})"
              }

              vault_ensure_kv_v2_secret_mount() {
                # tenant-operator reads + writes platform-scoped data at
                # `secret/data/platform/...` and every seed key lives under
                # `secret/data/<key>`, so the kv v2 mount at `secret` is the
                # one mount of the contract. Enable it once on first init;
                # idempotent on every subsequent pass (400 "already in use" =
                # success).
                initial="$1"
                code=$(curl -sS -o ${TMPD}/mount.json -w '%{http_code}' \
                  -X POST -H "X-Vault-Token: ${initial}" -H "Content-Type: application/json" \
                  -d '{"type":"kv","options":{"version":"2"},"description":"gibson platform kv v2"}' \
                  "${BAO_ADDR_LOCAL}/v1/sys/mounts/secret")
                if [ "$code" = "204" ] || [ "$code" = "200" ]; then
                  echo "[openbao-auto-init] mounted kv v2 at secret/ (HTTP $code)"
                  return 0
                fi
                if [ "$code" = "400" ] && grep -q 'path is already in use' ${TMPD}/mount.json; then
                  return 0
                fi
                echo "[openbao-auto-init] FATAL: mount secret/ returned HTTP $code: $(cat ${TMPD}/mount.json)" >&2
                return 1
              }

              vault_ensure_transit_mount() {
                # The transit engine mints the seed keypairs and holds the
                # per-tenant KEK derivation root. Same idempotency as above.
                code=$(curl -sS -o ${TMPD}/tmount.json -w '%{http_code}' \
                  -X POST -H "X-Vault-Token: $1" -H "Content-Type: application/json" \
                  -d '{"type":"transit"}' "${BAO_ADDR_LOCAL}/v1/sys/mounts/transit")
                if [ "$code" = "204" ] || [ "$code" = "200" ]; then
                  echo "[openbao-auto-init] mounted transit at transit/ (HTTP $code)"
                  return 0
                fi
                if [ "$code" = "400" ] && grep -q 'path is already in use' ${TMPD}/tmount.json; then
                  return 0
                fi
                echo "[openbao-auto-init] FATAL: mount transit/ returned HTTP $code: $(cat ${TMPD}/tmount.json)" >&2
                return 1
              }

              # The keyring inputs (ghcr-pull-token, smtp-username, the three
              # stripe-* members,
              # smtp-password) follow the keyring: a member set AFTER the
              # bringup reaches the Secret through keyring-to-cluster.sh and the
              # kubelet, and this pass writes it into OpenBao without a pod
              # restart. seed_one writes an input only when the mounted value
              # is non-empty and differs from the stored one, and never touches
              # a generated property that is present, so the pass is a no-op
              # when nothing changed. Measured on staging 2026-09-11: the pull
              # token set after bringup stayed empty in ghcr-pull-secret until
              # the pod was restarted, and every image pull ran on an empty
              # password meanwhile.
              vault_follow_keyring_inputs() {
                seeder=$(bao_login_seeder) || return 1
                rc=0
                vault_seed_platform_secrets "$seeder" >/dev/null || rc=1
                vault_revoke_self "$seeder"
                seeder=""
                return $rc
              }

              vault_steady_reconcile() {
                # Every pod start: the same pass the init ran, with a seeder
                # login token instead of root, and a no-op when nothing
                # changed. This is what makes a chart upgrade that adds a key
                # seed it, a rotated keyring input reach the store, and a
                # store restored into a new cluster grow a fresh service token.
                seeder=$(bao_login_seeder) || {
                  echo "[openbao-auto-init] WARN: cannot log in with role ${SEEDER_ROLE}; the reconcile pass is skipped. A store from before deploy#1732 has no such role, and gains one on the next bootstrap" >&2
                  return 1
                }
                echo "[openbao-auto-init] logged in as ${OWN_SA} with role ${SEEDER_ROLE}; reconciling"
                rc=0
                vault_ensure_kv_v2_secret_mount "$seeder" || rc=1
                vault_ensure_transit_mount "$seeder" || rc=1
                vault_configure_access "$seeder" || rc=1
                vault_ensure_tokens "$seeder" || rc=1
                vault_seed_platform_secrets "$seeder" || rc=1
                [ "$rc" -eq 0 ] && { vault_delete_legacy_policy "$seeder" || rc=1; }
                vault_revoke_self "$seeder"
                seeder=""
                return $rc
              }

              retry_n() {
                # retry_n <attempts> <sleep-seconds> <command...>
                #
                # deploy#1195 review: the post-init tail used
                # `|| { sleep 5; continue; }`, which CANNOT work — `/sys/init`
                # has already flipped `initialized` to true, so `continue` never
                # re-enters the init branch. A single transient failure
                # abandoned the rest of bootstrap permanently and silently,
                # while the sidecar went on to report steady state.
                #
                # Retrying HERE, inside the pass, is what keeps the initial root
                # token in memory long enough to finish or to be revoked. The
                # loop-level fallback still exists, but it is now the second
                # line of defence, not the only one.
                attempts="$1"; pause="$2"; shift 2
                i=1
                while [ "$i" -le "$attempts" ]; do
                  if "$@"; then
                    return 0
                  fi
                  if [ "$i" -lt "$attempts" ]; then
                    echo "[openbao-auto-init] retry ${i}/${attempts} for: $* (sleeping ${pause}s)"
                    sleep "$pause"
                  fi
                  i=$((i + 1))
                done
                return 1
              }

              echo "[openbao-auto-init] starting reconcile loop (seal=static, keyring Secret ${KEYRING_SECRET} key ${KEYRING_KEY}, seeder role ${SEEDER_ROLE})"
              announced_steady=0
              while true; do
                status=$(vault_status 2>/dev/null || echo "")
                if [ -z "$status" ]; then
                  sleep 2
                  continue
                fi

                initialized=$(json_get "$status" initialized)
                sealed=$(json_get "$status" sealed)
                seal_type=$(json_get "$status" type)

                if [ "$initialized" = "false" ]; then
                  echo "[openbao-auto-init] store uninitialized — performing init under the ${seal_type} seal"
                  initial_root=$(vault_init) || { sleep 5; continue; }
                  # Bootstrap ordering is load-bearing (deploy#1195). Everything
                  # that needs the initial root token happens HERE, in this one
                  # pass, while the token is held in memory and written nowhere;
                  # the token is then revoked at the end. Each step is verified
                  # before the next, and revocation is skipped unless every
                  # precondition held.
                  #
                  # These use retry_n rather than `|| { sleep 5; continue; }`
                  # where a `continue` could never re-enter this branch:
                  # /sys/init has already flipped `initialized` to true.
                  retry_n 5 5 vault_ensure_kv_v2_secret_mount "$initial_root" || { sleep 5; continue; }
                  retry_n 5 5 vault_ensure_transit_mount "$initial_root" || { sleep 5; continue; }
                  # Policies and roles first: the seeder role is the standing
                  # path back in, and the ESO role has to exist before any
                  # workload starts looking.
                  retry_n 5 5 vault_configure_access "$initial_root" || { sleep 5; continue; }
                  # This pod must be able to get back in WITHOUT root before
                  # root is destroyed. A cluster where the login fails (RBAC,
                  # TokenReview) keeps the initial root in memory and says so.
                  if ! retry_n 5 5 vault_seeder_login_works; then
                    echo "[openbao-auto-init] FATAL: the ${SEEDER_ROLE} login does not work — NOT revoking the initial root. Check the openbao ServiceAccount's system:auth-delegator binding." >&2
                    sleep 5
                    continue
                  fi
                  retry_n 5 5 vault_mint_token "$initial_root" "$TENANT_OP_POLICY" "$TENANT_OP_TOKEN_SECRET" || { sleep 5; continue; }
                  jobs_ok=1
                  for pair in $JOB_TOKENS; do
                    retry_n 5 5 vault_mint_token "$initial_root" "${pair#*:}" "${pair%%:*}" || jobs_ok=0
                  done
                  [ "$jobs_ok" = 1 ] || { sleep 5; continue; }
                  # The platform token last: svc_token holds it for the check below.
                  retry_n 5 5 vault_mint_token "$initial_root" "$PLATFORM_POLICY" "$PLATFORM_TOKEN_SECRET" || { sleep 5; continue; }
                  retry_n 5 5 vault_seed_platform_secrets "$initial_root" || { sleep 5; continue; }
                  # The replacement credential must authenticate BEFORE the
                  # initial root is destroyed.
                  if ! retry_n 5 5 vault_service_token_usable "$svc_token"; then
                    echo "[openbao-auto-init] FATAL: minted service token failed lookup-self — NOT revoking the initial root" >&2
                    sleep 5
                    continue
                  fi
                  vault_revoke_initial_root "$initial_root" || true
                  initial_root=""
                  echo "[openbao-auto-init] init complete (seal=${seal_type})"
                  announced_steady=0
                  sleep 5
                  continue
                fi

                if [ "$sealed" = "true" ]; then
                  # Under the static seal a sealed, initialized store means the
                  # mounted key is not the key this store was sealed with
                  # (measured: "cipher: message authentication failed" every
                  # 5 s, deploy#1731). Nothing here can open it: the static
                  # seal has no unseal key and this sidecar holds no recovery
                  # key. Say so, and never POST /v1/sys/unseal.
                  echo "[openbao-auto-init] store is initialized but SEALED under the ${seal_type} seal: the key in Secret ${KEYRING_SECRET}/${KEYRING_KEY} does not open this store. Put the bringup keyring this store was sealed with in place and restart the pod. No unseal is attempted: this seal has no unseal key and this sidecar holds no recovery key" >&2
                  sleep 30
                  continue
                fi

                # Initialized + unsealed = steady state.
                # On entry (every pod start) run the reconcile pass. Then
                # re-check the service token every ~5 min (30 × 10s loops) so
                # an expired token is detected and replaced before either
                # operator crashes (tenant-operator#212).
                if [ "$announced_steady" = "0" ]; then
                  echo "[openbao-auto-init] steady state: initialized=true sealed=false seal=${seal_type}"
                  vault_steady_reconcile || echo "[openbao-auto-init] WARN: the reconcile pass did not complete; it runs again on the next pod start"
                  # Readiness marker (deploy#1737). The pod may only report
                  # Ready when the store SERVES its consumers: initialized,
                  # unsealed, and past the entry reconcile, so the auth mount,
                  # the eso-reader role and the seed keys exist. The sync-wave
                  # ordering above gates the ClusterSecretStore on exactly
                  # this. A fixed path is safe here: this shell is one
                  # container, and the probe reads the same filesystem.
                  touch /tmp/openbao-auto-init-ready
                  announced_steady=1
                  steady_tick=0
                fi
                steady_tick=$((${steady_tick:-0} + 1))
                if [ "$steady_tick" -ge 30 ]; then
                  vault_ensure_tokens || echo "[openbao-auto-init] WARN: service token refresh failed"
                  vault_follow_keyring_inputs || echo "[openbao-auto-init] WARN: keyring input pass did not complete; it runs again in five minutes"
                  steady_tick=0
                fi
                sleep 10
              done
          volumeMounts:
            # The keyring INPUTS the bringup may supply (deploy#1732): the GHCR
            # pull token and the SMTP relay credential. Projected from the same
            # bringup keyring Secret as the seal key, but as a SEPARATE volume
            # that never lists the seal key, so the sidecar cannot read it
            # by construction, not by assertion. `optional: true`:
            # a bringup that supplies no input still comes up, with the keys
            # seeded empty.
            - name: bringup-inputs
              mountPath: /etc/openbao/inputs
            # The ready marker and mktemp write here. The root filesystem is read-only.
            - name: auto-init-tmp
              mountPath: /tmp
              readOnly: true
          # Ready = the store serves its consumers (see the marker above).
          # A readiness probe never restarts the container; until the marker
          # exists the pod stays NotReady, which is the truth.
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/openbao-auto-init-ready"]
            initialDelaySeconds: 5
            periodSeconds: 5
            # An exec probe forks a process. Under CPU throttling that is not
            # reliably inside the default 1s, and this marker is what the store's
            # own readiness waits on.
            timeoutSeconds: 3
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
            # The root filesystem is read-only. A tool that writes to HOME
            # writes to the scratch volume.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: auto-init-tmp
          emptyDir: {}
        - name: config
          configMap:
            name: gibson-openbao-config
        # The bringup keyring Secret (deploy#1731). Produced by the
        # bringup, never by this chart. Only the seal key is projected, so a
        # keyring Secret that later carries other members exposes none of
        # them to this pod. A missing Secret or key keeps the pod in
        # ContainerCreating, which is the loud failure we want.
        - name: seal-key
          secret:
            secretName: "bringup-keyring"
            defaultMode: 0440
            items:
              - key: "openbao-seal-key"
                path: openbao-seal-key
        # The two keyring INPUTS for the sidecar (deploy#1732): the same
        # bringup keyring Secret, a different volume, and NEVER the seal key.
        # Item names follow scripts/keyring.sh: member GHCR_PULL_TOKEN is the
        # Secret key ghcr-pull-token; the relay credential is smtp-username
        # and smtp-password. optional so a keyring that carries none still
        # starts the pod.
        - name: bringup-inputs
          secret:
            secretName: "bringup-keyring"
            defaultMode: 0440
            optional: true
            items:
              - key: ghcr-pull-token
                path: ghcr-pull-token
              - key: smtp-username
                path: smtp-username
              - key: smtp-password
                path: smtp-password
              # The Stripe account (charts#486): written by the bringup from
              # the keyring members STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY
              # and STRIPE_WEBHOOK_SECRET, the empty string when not supplied.
              - key: stripe-secret-key
                path: stripe-secret-key
              - key: stripe-publishable-key
                path: stripe-publishable-key
              - key: stripe-webhook-secret
                path: stripe-webhook-secret
              # The sandbox disk signing seed (ADR-0166): the keyring member
              # SETEC_DISK_SIGNING_SEED, seeded to secret/data/setec-disk-signing.
              - key: setec-disk-signing-seed
                path: setec-disk-signing-seed
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Source: gibson/charts/gibson-workloads/templates/databases/redis-stack.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gibson-redis-stack
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: redis
spec:
  serviceName: gibson-redis-stack
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gibson-workloads
      app.kubernetes.io/instance: gibson
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-workloads
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: redis
        gibson.zeroroot.ai/net-role: datastore
        gibson.zeroroot.ai/datastore: redis
      annotations:
        # Velero fs-backup skips the ACL file an init container renders; the
        # data claim stays in the backup. scripts/check-velero-volume-excludes.sh.
        backup.velero.io/backup-volumes-excludes: "redis-acl"
        # Pod-roll-on-Secret-change delegated to Stakater Reloader (deploy / PRD deploy#255 / slice S7, deploy#263). The redis-stack
        # image bakes the REQUIREPASS value from $REDIS_PASSWORD into its
        # internal ACL at startup and does NOT re-read the env var when the
        # backing Secret rotates; the Reloader controller watches the
        # explicitly-named Secret and rolls this StatefulSet whenever it
        # changes. The prior checksum-annotation pattern (computing a
        # sha256sum of a lookup-loaded Secret) was broken under Argo's offline
        # `helm template` render — lookup returned nil, the checksum never
        # changed, the pod never rolled on rotation, and the WRONGPASS loop
        # took sign-in down. See PRD deploy#255 for the incident.
        secret.reloader.stakater.com/reload: "gibson-redis-stack"
    spec:
      priorityClassName: gibson-platform-critical
      # Redis does not call the Kubernetes API, so the pod mounts no
      # ServiceAccount token.
      automountServiceAccountToken: false
      # Redis runs as a non-root user (ADR-0165, charts#401). The image has no
      # user of its own, so the pod names the numeric user and group 999.
      # fsGroup makes the data volume writable for that group on each volume
      # type that supports it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A volume that the earlier root pod wrote holds files that only root
        # can write. A hostPath-backed volume (local-path on k3s and kind)
        # does not get fsGroup, so Redis could not open its append-only file
        # there. The earlier pod left the directories world-writable, so this
        # container can replace each such file with a copy that the Redis
        # user owns. It needs no root for that. On a volume with fsGroup, and
        # on a new volume, it finds no such file and does nothing.
        - name: own-data
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          command: ['sh', '-c']
          args:
            - |
              set -eu
              umask 077
              for f in /data/appendonlydir/* /data/*.rdb; do
                [ -f "$f" ] || continue
                [ -w "$f" ] && continue
                cp "$f" "$f.own"
                mv -f "$f.own" "$f"
                echo "[own-data] took over $f"
              done
              echo "[own-data] done"
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # Writes /etc/redis-acl/users.acl from the current password Secret.
        # Redis starts with this file; the rotation CronJob (deploy#517) adds
        # the previous password in-memory during the rolling-restart window
        # via `ACL SETUSER`, so it never appears on disk.
        - name: init-acl
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          command: ['sh', '-c']
          args:
            - |
              umask 077
              printf 'user default on >%s ~* &* +@all\n' "$REDIS_PASSWORD" \
                > /etc/redis-acl/users.acl
              echo "[init-acl] ACL file written"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibson-redis-stack
                  key: redis-password
          volumeMounts:
            - name: redis-acl
              mountPath: /etc/redis-acl
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: redis-stack
          image: "ghcr.io/zeroroot-ai/mirror/redis-stack-server:7.4.0-v1@sha256:72035434f455ecd897090d3dd83ec357d34857287f159378b965a7006312a797"
          imagePullPolicy: IfNotPresent
          # Redis auth is always on (one-code-path epic / deploy#199);
          # `redis.auth.enabled` was deleted as a configuration toggle.
          # ACL auth is declared in the conf file via `aclfile` (deploy#518).
          # The init-acl init container writes the ACL file before this
          # container starts. No --requirepass flag needed.
          #
          # --dir /data (durable-Timeline, deploy#1063): the redis-stack-server
          # wrapper script unconditionally passes --dir /var/lib/redis-stack as
          # a CLI flag, which overrides the `dir /data` in the conf file — the
          # AOF log would land on the ephemeral overlay, not the PVC. Passing
          # --dir /data as a trailing arg ($* in the script) wins because Redis
          # applies CLI flags left-to-right and last-one-wins for duplicates.
          #
          # umask 077: only the Redis user can read the files that Redis
          # writes to the data volume.
          command:
            - sh
            - -c
            - 'umask 077; exec redis-stack-server /etc/redis-stack/redis-stack.conf --dir /data'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibson-redis-stack
                  key: redis-password
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/redis-stack
            - name: data
              mountPath: /data
            - name: redis-acl
              mountPath: /etc/redis-acl
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: gibson-redis-stack-config
        - name: redis-acl
          emptyDir: {}
  volumeClaimTemplates:
    
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
# Source: gibson/charts/gibson-workloads/templates/gibson/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gibson-gibson-workloads
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: daemon
    # spec zero-trust-hardening Task 5.4 — operational traceability of the
    # post-fix configuration. Daemon-only label (NOT a selector key); other
    # workloads in the chart do not carry this label by design.
    zeroroot.ai/zero-trust-hardening-version: "1"
spec:
  serviceName: gibson-gibson-workloads
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gibson-workloads
      app.kubernetes.io/instance: gibson
      app.kubernetes.io/component: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson-workloads
        app.kubernetes.io/instance: gibson
        app.kubernetes.io/component: daemon
        gibson.zeroroot.ai/net-role: platform
        gibson.zeroroot.ai/client-postgres: "true"
        gibson.zeroroot.ai/client-redis: "true"
        gibson.zeroroot.ai/client-openbao: "true"
        gibson.zeroroot.ai/client-neo4j: "true"
        gibson.zeroroot.ai/kube-api: "true"
        gibson.zeroroot.ai/egress-internet: "true"
        gibson.zeroroot.ai/egress-namespaces: "true"
      annotations:
        # Velero fs-backup (defaultVolumesToFsBackup on the shipped Schedule)
        # snapshots every pod volume it is not told to skip. These hold a
        # socket, a scratch dir or an init-rendered file: nothing to keep,
        # and on restore each one becomes a PodVolumeRestore that can only
        # finish once this pod is running. Measured 2026-09-07: 9 of 22
        # PodVolumeRestores in a preserve backup were volumes like these.
        # scripts/check-velero-volume-excludes.sh keeps this list equal to
        # the pod's emptyDir and CSI-ephemeral volumes.
        backup.velero.io/backup-volumes-excludes: "tmp,spire-agent-socket"
        checksum/config: 978165bfca7b61cd0d21cae9c562cd922c4986f4bca31113a81c5ce78e04859f
        # Pod-roll-on-Secret-change delegated to Stakater Reloader (deploy / PRD deploy#255 / slice S7, deploy#263). Consumer envFrom
        # resolution is frozen for the pod's lifetime; Reloader watches the
        # named Secrets and triggers a rolling restart when any changes.
        #
        # NOTE: gibson-workloads-redis-stack is intentionally NOT listed here.
        # Redis password rotation requires ordered restarts (redis-stack first,
        # then daemon, then tenant-operator); the rotation CronJob
        # (deploy#517) enforces that order. Listing this Secret in Reloader
        # would race-restart the daemon simultaneously with redis-stack,
        # causing WRONGPASS.
        #
        # gibson-daemon-metrics-tls: the metrics listener loads its cert one
        # time at start, so a cert-manager renewal restarts the daemon
        # (ADR-0171, row component-tls).
        secret.reloader.stakater.com/reload: "gibson-gibson-workloads-db-secrets,gibson-platform-postgres-credentials,gibson-native-login-oidc,gibson-daemon-metrics-tls"
        configmap.reloader.stakater.com/reload: "gibson-fga-config"
    spec:
      serviceAccountName: gibson
      
      imagePullSecrets:
        - name: ghcr-credentials
      # Gibson binary respects HOME via os.UserHomeDir(); HOME is set
      # explicitly in the container env below.
      # Spec 3 R3 — daemon runs as non-root (uid 65532, distroless nonroot).
      securityContext:
        fsGroup: 65532
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-spire-socket
          image: ghcr.io/zeroroot-ai/mirror/busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c']
          args:
            - |
              # deploy#201: SPIRE is required infrastructure. Fail-fast (60s) if the
              # Workload API socket is not present on this node — a missing socket
              # means the SPIRE agent DaemonSet is unhealthy and SPIFFE-consuming
              # workloads MUST NOT proceed (their mTLS / JWT-SVID minting would
              # silently hang otherwise).
              SOCK="/run/spire/agent/spire-agent.sock"
              DEADLINE=$(( $(date +%s) + 60 ))
              echo "[wait-for-spire-socket] waiting for ${SOCK} (timeout: 60s)..."
              until [ -S "${SOCK}" ]; do
                if [ $(date +%s) -ge ${DEADLINE} ]; then
                  echo "[wait-for-spire-socket] ERROR: ${SOCK} not present after 60s; SPIRE agent DaemonSet is not healthy on this node. Fix the SPIRE control plane before this pod can start." >&2
                  exit 1
                fi
                sleep 1
              done
              echo "[wait-for-spire-socket] ok"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent
              readOnly: true
        # No wait for the IdP-admin Secret (gibson#664, charts#435): the
        # daemon holds no Secret grant. Its secretKeyRef entries make the
        # kubelet hold the container until ESO has written the Secret.
        # Setup config directory with correct config file location.
        # Spec 3 R3 — directories are now under /var/lib/gibson because the
        # nonroot user has no $HOME; HOME=/var/lib/gibson is exported in the
        # daemon container env.
        - name: setup-config
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          command: ['sh', '-c']
          args:
            - |
              set -e
              # Runs as the daemon user (the pod securityContext), like the
              # daemon that writes the same volume. An earlier version ran as
              # root and left a root-owned config.yaml; the directory is
              # writable, so rm then cp replaces it (ADR-0165, charts#394).
              rm -f /var/lib/gibson/.gibson/config.yaml
              cp /etc/gibson/gibson.yaml /var/lib/gibson/.gibson/config.yaml
              echo "Config file copied to /var/lib/gibson/.gibson/config.yaml"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/gibson
              readOnly: true
            - name: data
              mountPath: /var/lib/gibson/.gibson
        # Wait for the tenant-operator Pod to be Ready. This replaces the
        # render-time `lookup` preflight that lived in
        # templates/preconditions.yaml (deploy#202): the operator's Pod
        # cannot become Ready without the gibson-operators chart having
        # been applied AND the CRDs it watches being Established, so a
        # single Ready check transitively covers both the "CRDs installed"
        # and "operator installed" preconditions that lookup attempted to
        # verify against Helm Release Secrets.
        #
        # The daemon ServiceAccount already has pods/get,list,watch via
        # templates/gibson/role.yaml -- no additional RBAC needed.
        #
        # Fails fast (exit 1, structured log) after the 5-min budget so a
        # missing prerequisite surfaces as `kubectl describe pod` output,
        # not a silent boot with degraded behavior.
        - name: wait-for-prerequisites
          image: ghcr.io/zeroroot-ai/mirror/kubectl:1.31.4@sha256:64614ef8290f3fb27fed5164b338debeeb79a1e5e26c93eb920770b71abd7c48
          command: ['/bin/bash', '-c']
          args:
            - |
              set -eu
              ns="gibson"
              echo "[wait-for-prerequisites] waiting for tenant-operator Pod Ready in ${ns}..."
              # 5 min budget. The tenant-operator's own probes settle
              # quickly once the operator binary starts up; this gives
              # plenty of headroom for cluster-wide cold-starts and Argo
              # sync waves.
              for i in $(seq 1 150); do
                phase=$(kubectl get pods -n "${ns}" \
                  -l app.kubernetes.io/name=gibson-tenant-operator \
                  -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}' \
                  2>/dev/null || true)
                if [ "${phase}" = "True" ]; then
                  echo "[wait-for-prerequisites] ok (tenant-operator Pod Ready)"
                  exit 0
                fi
                if [ $((i % 5)) -eq 0 ]; then
                  echo "[wait-for-prerequisites] tenant-operator not Ready yet (status=${phase:-<absent>}); retrying..."
                fi
                sleep 2
              done
              echo "[wait-for-prerequisites] timed out after 5 min -- the gibson-operators chart may not be applied, or the tenant-operator Pod is unhealthy. Check: kubectl get pods -n ${ns} -l app.kubernetes.io/name=gibson-tenant-operator" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        # Wait for Redis
        - name: wait-for-redis
          image: ghcr.io/zeroroot-ai/mirror/alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
          command: ['sh', '-c']
          args:
            - |
              until nc -z gibson-redis-stack 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: gibson
          image: "ghcr.io/zeroroot-ai/gibson:v0.154.0@sha256:560d708bc9814dfb272643baa8afe14d1869b98f1833518a2f1c4048dbdccc23"
          imagePullPolicy: Always
          ports:
            - name: callback
              containerPort: 50001
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: registration
              containerPort: 50100
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            # gibson#623 — unauthenticated native-login bootstrap listener
            # (GET /.well-known/gibson-login). Envoy publishes it on a public,
            # ext_authz-disabled route (gibson_native_login cluster).
            - name: native-login
              containerPort: 8085
              protocol: TCP
            # deploy#852: mTLS authz-registry endpoint ext-authz fetches from.
            - name: authz-registry
              containerPort: 8086
              protocol: TCP
          env:
            # the daemon reads FGA store_id + model_id from env
            # vars instead of calling the Kubernetes API to GET the
            # gibson-fga-config ConfigMap. The gibson-fga-init Job writes
            # the ConfigMap keys `store_id` and `model_id`; we map them
            # explicitly here to the env-var names the daemon's
            # internal/authz/config_resolver.go reads
            # (GIBSON_AUTHZ_FGA_STORE_ID + GIBSON_AUTHZ_FGA_MODEL_ID).
            # Marked optional so the daemon boots even when the Job has
            # not yet completed — ResolveWithRetry waits for both vars
            # to populate before the FGA authorizer initialises.
            - name: GIBSON_AUTHZ_FGA_STORE_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: store_id
                  optional: true
            - name: GIBSON_AUTHZ_FGA_MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: gibson-fga-config
                  key: model_id
                  optional: true
            - name: HOME
              value: /var/lib/gibson
            # The Dockerfile bakes GIBSON_HOME=/root/.gibson which the daemon
            # main.go reads with higher precedence than HOME via os.Getenv
            # ("GIBSON_HOME") in cmd/gibson/main.go. Override here so the
            # config-loader resolves under the writable HOME path mounted
            # from the StatefulSet's data volume.
            - name: GIBSON_HOME
              value: /var/lib/gibson/.gibson
            # GIBSON_PUBLIC_URL — the public Envoy URL the daemon stamps into
            # the CreateAgentIdentity response (gibson_url + the copy-pasteable
            # `gibson component register` enroll command). server.go reads this
            # via os.Getenv; without it the daemon returns an empty gibson_url
            # and a <gibson-url> placeholder, breaking agent registration.
            # Mirrors the dashboard's GIBSON_PUBLIC_URL byte-for-byte so both
            # surfaces advertise the identical public URL (same override key,
            # same global.domain default). deploy#662.
            - name: GIBSON_PUBLIC_URL
              value: "https://api.localhost.zeroroot.ai"
            # GIBSON_APP_URL — the PRODUCT-surface origin (app.<domain>) used to
            # build user-facing links, above all the self-serve signup email
            # verification link (gibson#1228 companion, deploy
            # signup-email-delivery). Deliberately distinct from
            # GIBSON_PUBLIC_URL above: that is the API-plane origin
            # (api.<domain>), and it serves no product routes — a verification
            # link built from it resolves to nothing. The fallback
            # (gibson.externalOrigin) is unconditional, so this always resolves.
            #
            # The daemon is not the only reader. The tenant-operator
            # (gibson-operators/templates/tenant-operator/deployment.yaml)
            # reads the same env var name, wired from its own
            # gibson.appUrl value, to build its two human-facing email
            # links: the tenant-member invitation accept-link and the new
            # tenant's welcome-email link. Both consumers exist because a
            # link a human's browser must open can never point at an
            # API-plane or in-cluster address.
            - name: GIBSON_APP_URL
              value: "https://app.localhost.zeroroot.ai"
            # gibson#632 — invitation accept-link email transport; ALSO, as of
            # gibson#1228, the ONLY transport the self-serve signup email
            # verification flow may use. Defaults to the "log" provider, which
            # the daemon's mailer package treats as a NON-DELIVERING development
            # stub (internal/platform/mailer.LogMailer.Delivers() == false) — it
            # drops the message. That is fine for invitations (best-effort) but
            # not for signup verification.
            #
            # A missing transport does NOT stop the daemon booting: mail
            # misconfiguration must never take down every other RPC on the
            # platform. resolveSignupMailer warns once at startup and leaves
            # the signup mailer unwired; RequestEmailVerification then refuses
            # each call with FailedPrecondition, creating no state. So a
            # profile with `registration: open` (the default)
            # still boots, but self-serve signup is inert until provider=smtp
            # is set here (kind: mailpit dev sink, values-kind.yaml;
            # staging/prod: SES SMTP, values-aws-prod.yaml).
            #
            # The accept/verification links are built from GIBSON_PUBLIC_URL and
            # GIBSON_APP_URL respectively, above.
            - name: GIBSON_PLATFORM_TENANT
              value: "primary"
            - name: GIBSON_AUDIT_EXPORT_BUCKET
              value: "example-durable-bucket"
            - name: GIBSON_AUDIT_EXPORT_ENDPOINT
              value: "https://s3.us-east-1.amazonaws.com"
            - name: GIBSON_AUDIT_EXPORT_REGION
              value: "us-east-1"
            - name: GIBSON_AUDIT_EXPORT_LOCK_MODE
              value: "GOVERNANCE"
            - name: GIBSON_AUDIT_EXPORT_LOCK_DAYS
              value: "2192"
            - name: GIBSON_AUDIT_EXPORT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bringup-keyring
                  key: bucket-access-key
            - name: GIBSON_AUDIT_EXPORT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bringup-keyring
                  key: bucket-secret-key
            - name: GIBSON_EMAIL_PROVIDER
              value: "log"
            - name: GIBSON_EMAIL_FROM
              value: "no-reply@localhost.zeroroot.ai"
            # Provider catalogue hot-reload path (spec: gibson#296).
            # When set, the daemon reads the operator-mounted YAML instead of
            # the embedded copy and hot-reloads it every 5 minutes.
            - name: GIBSON_PROVIDERS_CATALOGUE_PATH
              value: "/etc/gibson-providers/provider-catalogue.yaml"
            - name: GIBSON_CGJWT_SIGNING_KEY_DIR
              value: "/etc/gibson/cg-signing-key"
            # Spec 3 R11 — Redis password sourced from chart-managed Secret
            # (or external ESO Secret when redis.auth.passwordSecret is set).
            # Redis auth is always on (one-code-path epic / deploy#199);
            # `redis.auth.enabled` was deleted as a configuration toggle.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibson-redis-stack
                  key: redis-password
            # Dashboard / platform PostgreSQL password — for tenant_provisioning
            # table access and gibson_platform schema. Sourced via the
            # gibson.platformPostgres.passwordSecret{Name,Key} helpers so
            # prod overlays can point at an externally-managed RDS secret.
            # Spec helm-eks-readiness-and-pg-split Phase 2.
            - name: DASHBOARD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibson-platform-postgres-credentials
                  key: password
            # NO TENANT_POSTGRES_ADMIN_PASSWORD. The daemon does not read it: its
            # only consumer was `tenant_postgres.admin_password:
            # ${TENANT_POSTGRES_ADMIN_PASSWORD}` in the ConfigMap, and gibson#599
            # unbound that key, so viper dropped the line. The name is absent from
            # helm/contracts/gibson-env-readers.txt, which is the proof there is no
            # Go reader either. The TENANT POSTGRES bootstrap credential now reaches
            # only the tenant-operator, which really does use it, through
            # $(TENANT_POSTGRES_ADMIN_PASSWORD) inside DATAPLANE_PG_ADMIN_DSN.
            # Delivering it here was a credential handed to a pod with no caller.
            # ---------------------------------------------------------------
            # IdP admin credentials (spec: agent-service-credentials task 13).
            # The daemon's TenantAdminService uses these to call the IdP's
            # management API. `provider` is read from values; the rest are
            # pulled from the K8s Secret named by
            # .Values.idp.adminCredentialsSecret. The platform-operator's
            # OIDCClient reconciler writes it.
            # ---------------------------------------------------------------
            - name: GIBSON_IDP_PROVIDER
              value: "zitadel"
            - name: GIBSON_IDP_ADMIN_ISSUER
              value: "https://app.localhost.zeroroot.ai"
            - name: ZITADEL_URL
              value: "http://gibson-zitadel.gibson.svc.cluster.local:8080"
            - name: ZITADEL_EXTERNAL_DOMAIN
              value: "app.localhost.zeroroot.ai"
            - name: GIBSON_IDP_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: "idp-admin-credentials"
                  key: client_id
            - name: GIBSON_IDP_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "idp-admin-credentials"
                  key: client_secret
            - name: GIBSON_IDP_ZITADEL_ORG_ID
              valueFrom:
                secretKeyRef:
                  name: "idp-admin-credentials"
                  key: org_id
            - name: GIBSON_IDP_ZITADEL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: "idp-admin-credentials"
                  key: project_id
            # gibson#623 — public client id for the native-login device-grant
            # app, served by the daemon's unauthenticated /.well-known/gibson-login
            # bootstrap endpoint. Minted into the gibson-native-login-oidc Secret
            # by the gibson-native-login OIDCClient CR (platform-operator#80,
            # gibson-operators values idp.oidcClients[gibson-native-login]).
            - name: GIBSON_NATIVE_LOGIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gibson-native-login-oidc
                  key: client_id
                  # optional: the native-login bootstrap endpoint
                  # (/.well-known/gibson-login) is a CLI-login convenience that
                  # 503s gracefully when this is empty (gibson#623). It MUST NOT
                  # gate daemon liveness — a not-yet-provisioned gibson-native-login
                  # OIDCClient secret previously crashlooped the daemon
                  # (CreateContainerConfigError → sign-in outage). Stakater
                  # Reloader rolls the pod once the secret lands.
                  # TODO(deploy#203): optional retained intentionally per
                  # gibson#623 (graceful 503 until the native-login OIDCClient
                  # secret is provisioned); revisit under one-code-path.
                  optional: true
            # Envoy SPIFFE ID the daemon's identity interceptor pins peer
            # cert URI SAN against: the trust domain of the install and the
            # fixed path platform/envoy.
            - name: GIBSON_SPIFFE_ENVOY_ID
              value: "spiffe://zeroroot.ai/platform/envoy"
            # Peer SPIFFE IDs for the harness callback listener allowlist.
            # REQUIRED when SPIFFE is configured — the daemon fails to start
            # otherwise (fail-closed per critical-tls-no-fallbacks Req 1.5).
            # Comma-separated list built from the paths in .Values.spiffe.callbackPeers.
            - name: GIBSON_CALLBACK_PEER_SVIDS
              value: "spiffe://zeroroot.ai/platform/dashboard,spiffe://zeroroot.ai/platform/envoy,spiffe://zeroroot.ai/platform/daemon"
            # Additional inbound mTLS allow-list for the daemon's main gRPC
            # listener. Envoy is always accepted via
            # GIBSON_SPIFFE_ENVOY_ID; the entries here are direct control-
            # plane callers (today: the tenant-operator). Comma-separated.
            - name: GIBSON_SPIFFE_ALLOWED_PEER_IDS
              value: "spiffe://zeroroot.ai/platform/tenant-operator,spiffe://zeroroot.ai/platform/connector-operator,spiffe://zeroroot.ai/platform/platform-operator"
            # deploy#852: the daemon serves its compiled-in authz registry to
            # ext-authz over mTLS (single source of truth — no version-pinned
            # OCI artifact to drift). Pin the listener port + the reader
            # allow-list (the SVIDs permitted to fetch it — the ext-authz SVID).
            # REQUIRED when SPIFFE is configured: the daemon fails closed on an
            # empty reader list (never serves the enforcement policy openly).
            - name: GIBSON_AUTHZ_REGISTRY_PORT
              value: "8086"
            - name: GIBSON_AUTHZ_REGISTRY_READER_SVIDS
              value: "spiffe://zeroroot.ai/platform/ext-authz"
            # gRPC reflection on the daemon listeners. OFF by default;
            # set .Values.spiffe.grpcReflection to "1" in dev overlays only.
            # Spec: critical-tls-no-fallbacks Component 3 / Requirement 4.
            # SPIRE→Vault audience contract (gibson#167 / deploy#360).
            # The daemon's broker init calls SPIRE Workload API
            # source.Token(ctx, audience) for every per-tenant Vault
            # auth refresh; the per-tenant Vault role's bound_audiences
            # MUST contain this exact value (the tenant-operator writes
            # the same value via GIBSON_VAULT_JWT_BOUND_AUDIENCE per
            # tenant-operator#148). openbao.jwtAuth.audience is the single
            # chart source of truth — plumbed to both env vars by the
            # owning templates. REQUIRED — chart fails render LOUDLY
            # when empty, same pattern as openbao.jwtAuth.spireOidcIssuer.
            - name: GIBSON_DAEMON_VAULT_JWT_AUDIENCE
              value: "gibson-saas"
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/etc/ssl/envoy-ca:/etc/ssl/fga-ca"
            # ----------------------------------------------------------------
            # Signup seam knob (deploy#1055, gibson#1094): the registration
            # rung, from the one value `registration` (gibson.registrationKnob).
            # Absent: closed. "approval": approval. "true": open.
            - name: SIGNUP_SELF_SERVE
              value: "true"
            # ----------------------------------------------------------------
            # Entitlements provider seam knob (/ deploy#1032).
            # ENTITLEMENTS_ENDPOINT set → daemon dials a remote
            # EntitlementsService over SPIFFE mTLS.
            # Unset (default) → OSS embedded ConfigProvider (no-op, unlimited).
            #
            # The seam knob: .Values.gibson.entitlementsEndpoint (string, empty
            # by default). The SaaS overlay (helm/saas-overlay/entitlements-svc)
            # deploys the actual Service and sets this knob via the gitops
            # overlay composition. Self-hosted installs leave this unset.
            #
            # The core umbrella carries ZERO closed/SaaS image references.
            # The closed billing image lives exclusively in the SaaS overlay.
            # ----------------------------------------------------------------
            # Entitlements-required fail-closed guard (/ deploy#1055,
            # gibson#1097+#1098). SaaS profile ONLY.
            # When true, the daemon refuses boot if the entitlements seam fails
            # to wire — it fails closed instead of silently serving unlimited.
            # NEVER set on self-hosted installs; the OSS fail-open is correct.
            # Invariant: if ENTITLEMENTS_ENDPOINT is set, this MUST also be set.
            # Enforced at RENDER time by validateEntitlementsCoherence below,
            # not only by the umbrella's signup-seam.bats CI fixtures — the
            # dangerous overlay is the one this repo never sees (GHSA-455w).
            # ----------------------------------------------------------------
            # Setec sandbox wiring.
            #
            # There is exactly ONE env var here, and it is a metrics label.
            # The daemon learns Setec's address, tenant and mTLS material from
            # its CONFIG FILE, not from the environment: templates/gibson/
            # configmap.yaml renders the `sandbox:` block that the daemon
            # unmarshals into config.SandboxConfig (gibson
            # internal/infra/config/sandbox.go).
            #
            # SETEC_FRONTEND_ADDRESS and SETEC_MTLS_SPIFFE_ID used to be set
            # here and are gone (deploy#1106). No gibson code ever read
            # either one — grep the daemon for the names and you get this
            # chart and nothing else. SETEC_MTLS_SPIFFE_ID in particular
            # advertised a trust model the platform does not implement: it
            # described the daemon presenting its SPIRE workload SVID and
            # pinning the frontend's SPIFFE peer SAN, while the frontend
            # serves a cert-manager cert with no SPIFFE URI SAN and the
            # daemon's adapter only ever built a file-based
            # component.TLSConfig (cert_file/key_file/ca_file/server_name).
            # Two configuration surfaces describing incompatible trust roots,
            # one of them dead, is how deploy#1106 got filed against a
            # mismatch that did not exist in the running code.
            #
            # GIBSON_SETEC_TIER feeds the gibson_setec_tier{tier} Prometheus
            # gauge (pkg/gibsond reads it; internal/engine/sandbox/health).
            # ----------------------------------------------------------------
            - name: GIBSON_SETEC_TIER
              value: "production"
            # ----------------------------------------------------------------
            # Dispatch policy / quota / health gating REMOVED 2026-05-10
            # (operator decision: unlimited usage). The daemon previously
            # accepted GIBSON_DISPATCH_POLICY_*, GIBSON_SETEC_MAX_CONCURRENT_*,
            # and GIBSON_SETEC_KVM_REQUIRED env vars; those code paths and
            # the env vars themselves were dropped. SANDBOXED tools still
            # route through Setec; PLUGIN/AGENT tools dispatch unchanged.
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/gibson
              readOnly: true
            - name: data
              mountPath: /var/lib/gibson/.gibson
            # Spec 3 R4 — readOnlyRootFilesystem requires writable /tmp.
            - name: tmp
              mountPath: /tmp
            # — reserved-names denylist via file-mount (no K8s API).
            # The daemon's internal/reservednames provider reads
            # /etc/gibson/reserved-names/{exact,prefix} and watches for
            # kubelet's in-place symlink-swap updates with fsnotify.
            - name: reserved-names
              mountPath: /etc/gibson/reserved-names
              readOnly: true
            # — master KEK via file-mount (no K8s API).
            # The daemon's internal/crypto file KeyProvider reads the
            # 32-byte master KEK from /etc/gibson-kek/master-key.
            #
            # IMPORTANT: this mount is at /etc/gibson-kek/ — NOT a
            # subpath of /etc/gibson/. kubelet rejects subPath-style
            # mounts that target a path already-occupied by another
            # volume (the `config` ConfigMap at /etc/gibson). Mounting
            # at a sibling path with the Secret's keys projected as
            # files (the default behavior, no subPath) sidesteps the
            # collision and keeps the file mode at 0o400.
            - name: master-kek
              mountPath: /etc/gibson-kek
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            # Spec: canonical-service-identity Req 8.2 — sa-identity-map
            # projected one-file-per-key for the log-enrichment resolver
            # (numeric sub → readable SA name). The ConfigMap is
            # `optional: true` so the pod schedules before the post-install
            # Job populates it; the resolver returns ("", false) for
            # unknown subs.
            - name: sa-identity-map
              mountPath: /etc/gibson/sa-identity-map
              readOnly: true
            - name: cg-signing-key
              mountPath: "/etc/gibson/cg-signing-key"
              readOnly: true
            - name: metrics-tls
              mountPath: /etc/gibson/tls/metrics
              readOnly: true
            - name: envoy-ca
              mountPath: /etc/ssl/envoy-ca
              readOnly: true
            # CA for the OpenFGA HTTP-listener cert (deploy#1382); picked
            # up via SSL_CERT_DIR above.
            - name: fga-http-ca
              mountPath: /etc/ssl/fga-ca
              readOnly: true
            # Provider catalogue hot-reload mount (spec: gibson#296).
            # The daemon reads GIBSON_PROVIDERS_CATALOGUE_PATH and polls
            # this file every 5 minutes; mtime changes trigger an in-process
            # catalogue swap without a restart.  See
            # templates/gibson/provider-catalogue-cm.yaml.
            # NOTE: mounted at /etc/gibson-providers/ (not inside /etc/gibson/)
            # because subPath file mounts inside an already-mounted directory
            # cause ENOTDIR in runc — the config volume occupies /etc/gibson.
            - name: provider-catalogue
              mountPath: /etc/gibson-providers/provider-catalogue.yaml
              subPath: provider-catalogue.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # Spec 2 R16: switch readiness to /readyz so kubelet only routes
            # traffic once dependent stores (Postgres, Neo4j, Redis, FGA, KMS)
            # are reachable. Liveness stays on /healthz (process-up only).
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            # Spec 3 R4 — readOnlyRootFilesystem hardens against arbitrary
            # writes if the daemon is compromised. /tmp is the only writable
            # path (emptyDir) and the data volume is RW under /var/lib/gibson.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      priorityClassName: gibson-platform-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gibson-workloads
              app.kubernetes.io/instance: gibson
              app.kubernetes.io/component: gibson
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gibson-workloads
                    app.kubernetes.io/instance: gibson
                    app.kubernetes.io/component: gibson
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: config
          configMap:
            name: gibson-gibson-workloads-config
        # Spec 3 R4 — writable /tmp for binaries that need a scratch dir.
        - name: tmp
          emptyDir: {}
        # Spec: canonical-service-identity Req 8.2 — kubelet projects each
        # ConfigMap key as a file under the mount path. The Go resolver
        # at internal/auth/identityresolver reads the directory and treats
        # filenames as readable SA names, contents as the numeric sub.
        - name: cg-signing-key
          secret:
            secretName: gibson-gibson-workloads-cg-signing-key
            defaultMode: 0o400
            optional: true
        - name: sa-identity-map
          configMap:
            name: gibson-sa-identity-map
            # allowlist (one-code-path #203): VOLUME-level optional, not
            # env-level. Slice #203 scope is env `valueFrom.*Ref` only;
            # this ConfigMap is populated by the post-install Zitadel
            # bootstrap Job and the identity-resolver returns ("", false)
            # for unknown subs, so a missing-at-startup mount is the
            # documented graceful path (Spec canonical-service-identity
            # Req 8.2).
            optional: true
            defaultMode: 0444
        # the daemon reads the reserved-names denylist from
        # /etc/gibson/reserved-names/ rather than calling the K8s API.
        # kubelet projects each ConfigMap key as a file; the provider
        # watches the directory with fsnotify so kubelet's in-place
        # symlink-swap update reloads the denylist without a daemon
        # restart. The ConfigMap is rendered at
        # templates/gibson/reserved-names-configmap.yaml.
        - name: reserved-names
          configMap:
            name: gibson-reserved-names
            defaultMode: 0444
        # the daemon reads the master KEK from a file mounted
        # from the gibson-master-key Secret. The Secret is provisioned
        # by the platform-operator's KEK-init flow; values overlays may
        # point at a different Secret name (set gibson.config.security
        # .key_provider.file.path + override this volume in an overlay).
        # The file KeyProvider validates that the file is exactly 32
        # bytes; defaultMode 0400 keeps it readable only by the pod UID.
        - name: master-kek
          secret:
            secretName: gibson-master-key
            defaultMode: 0o400
        - name: metrics-tls
          secret:
            secretName: gibson-daemon-metrics-tls
            defaultMode: 0440
        # SPIRE Workload API socket via csi.spiffe.io CSI driver — see spec
        # kind-dashboard-bringup-e2e (D2).
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # Provider catalogue ConfigMap (spec: gibson#296).
        # Mounted at /etc/gibson-providers/provider-catalogue.yaml (outside /etc/gibson)
        # so the daemon can hot-reload the model list via GIBSON_PROVIDERS_CATALOGUE_PATH.
        - name: provider-catalogue
          configMap:
            name: gibson-gibson-workloads-provider-catalogue
            defaultMode: 0444
        - name: envoy-ca
          secret:
            secretName: gibson-envoy-tls
            defaultMode: 0444
        # CA that signs the OpenFGA HTTP-listener cert (deploy#1382). Only
        # ca.crt is projected — the daemon must never hold the listener's
        # private key.
        - name: fga-http-ca
          secret:
            secretName: gibson-openfga-http-tls
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
