                            # prefix off the public api host; requests now fall to
                            # the explicit 404 below. The jwt_authn `/api/admin/`
                            # rule is deliberately KEPT so anything re-added under
                            # that prefix inherits the S2S audience requirement by
                            # default rather than starting unguarded.
                            # ---------------------------------------------------
                            # ---------------------------------------------------
