apiVersion: v1
kind: Pod
metadata:
  name: "gibson-gibson-workloads-test-sandbox-host-denied"
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    helm-test/keep: "false"
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/kube-api: "true"
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "0"
spec:
  restartPolicy: Never
  serviceAccountName: "gibson-gibson-workloads-test-sandbox-admission"
  # Secure pod (ADR-0165, charts#394): non-root, the RuntimeDefault seccomp
  # profile, a read-only root filesystem and no capabilities. kubectl
  # writes its cache under HOME=/tmp, an emptyDir.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: tmp
      emptyDir: {}
  containers:
    - name: probe
      image: "ghcr.io/zeroroot-ai/mirror/alpine-k8s:1.33.0@sha256:60333a52c38e9a8df0a9b93a5a24a4870f0db2c7ea3266b185386bd0a500d7dc"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      env:
        - name: HOME
          value: /tmp
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='::error file=helm-test::'
          POLICY=setec-sandbox-host-guard
          fail=0
          pod() { # <name> <spec fragment json>
            printf '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"%s"},"spec":{"containers":[{"name":"c","image":"busybox"}]%s}}' "$1" "$2"
          }
          try() { # <ns> <label> <spec fragment> <want: denied|admitted>
            out="$(pod "vap-probe-$2" "$3" | kubectl -n "$1" create --dry-run=server -f - 2>&1)" && rc=0 || rc=$?
            case "$4:$rc" in
              admitted:0) echo "  ok  $1: a plain Pod is admitted" ;;
              denied:0)   echo "$ERR $1: a $2 Pod was ADMITTED; the sandbox admission policy is not enforced"; fail=1 ;;
              denied:*)
                if printf '%s' "$out" | grep -q "$POLICY"; then echo "  ok  $1: $2 refused by $POLICY"
                else echo "$ERR $1: $2 was refused, but not by $POLICY: $out"; fail=1; fi ;;
              admitted:*) echo "$ERR $1: a plain Pod was refused, so this test proves nothing here: $out"; fail=1 ;;
            esac
          }
          try "setec-sandboxes" plain '' admitted
          try "setec-sandboxes" hostnetwork ',"hostNetwork":true' denied
          try "setec-sandboxes" hostpid ',"hostPID":true' denied
          try "setec-sandboxes" hostpath ',"volumes":[{"name":"h","hostPath":{"path":"/"}}]' denied
          # privileged is gated on the container, not the pod spec fragment
          out="$(printf '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"vap-probe-priv"},"spec":{"containers":[{"name":"c","image":"busybox","securityContext":{"privileged":true}}]}}' | kubectl -n "setec-sandboxes" create --dry-run=server -f - 2>&1)" && { echo "$ERR setec-sandboxes: a privileged container was ADMITTED"; fail=1; } || { printf '%s' "$out" | grep -q "$POLICY" && echo "  ok  setec-sandboxes: privileged refused by $POLICY" || { echo "$ERR setec-sandboxes: privileged refused, but not by $POLICY: $out"; fail=1; }; }
          exit "$fail"
