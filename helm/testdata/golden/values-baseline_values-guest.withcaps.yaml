        backup.velero.io/backup-volumes-excludes: "spire-agent-socket,tmp"
        # A quota change is a ConfigMap change; roll the pod so ratelimit
        # re-reads it (RUNTIME_WATCH_ROOT is off: watching a projected
        # ConfigMap is racy across the kubelet's symlink swap).
        checksum/config: 30962682d913a481f7f891c3e6762f82807aa5e3c0f8a1788b5a5fa5564d3c8c
    spec:
      
      imagePullSecrets:
        - name: ghcr-credentials
      serviceAccountName: gibson-ratelimit
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
