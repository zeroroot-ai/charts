            defaultMode: 0444
        - name: envoy-ca
          secret:
            # Trust anchor = the self-signed ROOT CA (gitops wave -12), NOT the
            # Envoy leaf secret (gibson-envoy-tls, wave 10) — see deploy#971 and
            # envoy.tls.caSecretName in values.yaml. tls.crt IS the CA cert for a
            # self-signed CA; project only the cert, never the CA key.
            secretName: "gibson-selfsigned-ca"
            items:
              - key: tls.crt
                path: envoy-ca.crt
        # Vault/OpenBao admin token, mounted OPTIONAL (deploy#971 / gibson#1000):
        # the Secret is produced later in the sync order (OpenBao mints/writes it
        # at wave 10), so the volume must tolerate it being absent at pod start.
        # When the Secret appears the kubelet projects the file; the operator
        # polls VAULT_TOKEN_PATH and requeues until then. Project only the token
        # key to a stable filename.
        - name: vault-admin-token
          secret:
            secretName: "gibson-openbao-keys"
            optional: true
            items:
              - key: "VAULT_ADMIN_TOKEN"
                path: VAULT_ADMIN_TOKEN
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        # Zitadel System API user private key (platform-operator#28,
        #). Materialised by ESO from OpenBao, the store on every
        # profile (ADR-0014). The matching
        # public key is also stored at PublicKey: this Secret carries
        # only the private half; the public half lives in the Zitadel
        # SystemAPIUsers config block.
        - name: zitadel-system-key
          secret:
            secretName: gibson-zitadel-system-key
            items:
              - key: private-key.pem
                path: private-key.pem
      terminationGracePeriodSeconds: 30
