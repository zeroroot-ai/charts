apiVersion: gibson.zeroroot.ai/v1alpha1
kind: PlatformBootstrap
metadata:
  name: platform
  labels:
    helm.sh/chart: gibson-operators-0.3.0
    app.kubernetes.io/name: gibson-operators
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    # Desired state, excluded from the Velero backup (deploy#1735, CONTEXT.md
    # § Velero backup). The chart renders this CR on every sync, so a restore
