# Source: gibson/charts/gibson-workloads/templates/envoy/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gibson-envoy
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: envoy
data:
  envoy.yaml: |
    # Envoy bootstrap config — Gibson SaaS edge gateway.
    #
    # Spec: unified-identity-and-authorization Phase H/8.8.
    # Supersedes the per-credential filter chain from
    # zitadel-envoy-gateway-migration task 10. The new shape is:
    #
    #   - Single ingress listener (:10000 internally, :443 externally) with
    #     HTTP/2 + gRPC multiplexing for ALL services: daemon user RPCs,
    #     tenant/platform/user admin RPCs, dashboard provisioning callbacks,
    #     future tool-runner control RPCs.
    #   - jwt_authn validates Zitadel JWTs only. The capability-grant JWT is
    #     validated INSIDE ext_authz, which resolves its signing key per-kid from
    #     the daemon (GET /capabilitygrant/v1/keys/{kid}) and interprets
    #     the allowed_rpcs claim.
    #     The spiffe in-cluster JWT-SVID provider is REMOVED — every caller
    #     (in-cluster or external) presents a Zitadel JWT end-to-end.
    #   - ext_authz makes the FGA decision and injects the trusted
    #     x-gibson-identity-* headers on the upstream (no HMAC; SPIFFE mTLS
    #     between Envoy and the daemon is the channel guarantee).
    #   - The legacy gsk_ API key Lua filter is REMOVED. Service callers use
    #     Zitadel client_credentials grants → bearer JWTs.
    #
    # The api.<domain> and app.<domain> filter chains are still SNI-dispatched
    # on the same TLS listener so cert-manager can mint one wildcard or several
    # SANs without changing this file. (The auth.<domain> filter chain was
    # retired in the single-host consolidation — see "auth.<domain> RETIRED"
    # below.)
    #
    # Templated via `.Files.Get` + `tpl` from templates/envoy/configmap.yaml so
    # the domain, JWKS URLs, and upstream cluster names are injected at chart
    # render time.
    
    admin:
      address:
        # Loopback only. The admin interface serves /config_dump,
        # /runtime_modify and /quitquitquit with no authentication, so nothing
        # outside the pod may reach it. The kubelet probes and the metrics
        # scraper connect from the pod IP; they reach the admin_probe listener on
        # :9901 below, which forwards exactly /ready and /stats/prometheus here
        # and answers 404 to everything else.
        # scripts/check-envoy-admin-loopback.py keeps this shape.
        socket_address: { address: 127.0.0.1, port_value: 9902 }
    
    static_resources:
      listeners:
        # -------------------------------------------------------------------------
        # Single TLS listener on :10000 (mapped to :443 in the Service). Filter
        # chain match dispatches by SNI — api/app/apex/docs share one listener
        # and one cert source. This is THE edge, on every substrate:
        # the L4 load balancer in front of it preserves the client IP, and every
        # HTTP connection manager below trusts the socket peer only
        # (use_remote_address: true, xff_num_trusted_hops: 0). There is no second
        # listener, no ALB, no CloudFront, and no PROXY protocol.
        # -------------------------------------------------------------------------
        - name: edge_tls
          address:
            socket_address: { address: 0.0.0.0, port_value: 10000 }
          listener_filters:
            - name: envoy.filters.listener.tls_inspector
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
          filter_chains:
    
            # =====================================================================
            # api.<domain> — single multiplexed surface for ALL services:
            #   - gibson.daemon.v1.DaemonService          (user/member RPCs)
            #   - gibson.daemon.operator.v1.DaemonOperatorService (ZD-internal operator RPCs)
            #   - gibson.component.v1.ComponentService    (component reg / tool runner)
            #   - gibson.harness.v1.HarnessCallbackService (agent + off-cluster
            #       component callbacks — the ONE service here whose upstream is
            #       NOT the daemon's main gRPC port; see gibson_daemon_callback)
            #   - each other gibson.* service, through the /gibson. catch-all
            #       (scripts/check-edge-grpc-routes.py fails on a route for a
            #       service that the daemon does not serve)
            #   - /api/admin/provisioning/*               (tenant-operator → dashboard)
            # All h2/h2c (gRPC + HTTP/2 multiplex). HTTP/1.1 fallback for
            # browser clients hitting /.well-known/.
            # =====================================================================
            - filter_chain_match:
                server_names: ["api.localhost.zeroroot.ai"]
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: { filename: /etc/envoy/tls/tls.crt }
                        private_key:       { filename: /etc/envoy/tls/tls.key }
                    alpn_protocols: ["h2", "http/1.1"]
                  # External callers use Zitadel JWT over server-side TLS only;
                  # SPIFFE mTLS is the in-cluster Envoy → daemon hop, not the
                  # client → Envoy hop.
                  require_client_certificate: false
              filters:
                # -----------------------------------------------------------------
                # L4 connection admission (deploy#1189). Runs BEFORE the HTTP
                # connection manager, so a connection flood is dropped before Envoy
                # spends anything on HTTP parsing, jwt_authn or ext_authz.
                #
                # This is the connection-level half of the edge limiter; the
                # per-route HTTP buckets below are the priority half. Together with
                # the HCM's max_concurrent_streams they bound how much one client
                # can extract per connection AND how fast it can open new ones.
                #
                # The network filter's `runtime_enabled` defaults to ENABLED when
                # omitted (unlike the HTTP filter's filter_enabled/filter_enforced,
                # which default to 0% — see the note on that filter below), so the
                # bucket alone is sufficient here.
                #
                # Not keyed on anything: see the envoy.rateLimit block in
                # values.yaml for why this edge has no trustworthy client address.
                # -----------------------------------------------------------------
                - name: envoy.filters.network.local_ratelimit
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: api_edge_connections
                    token_bucket:
                      max_tokens: 1000
                      tokens_per_fill: 500
                      fill_interval: 1s
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: api_ingress
                    codec_type: AUTO
                    # Client-IP contract. The L4 load balancer preserves
                    # the client IP, so the socket peer IS the client. Trust it and
                    # nothing else: never a client-supplied x-forwarded-for, and no
                    # trusted-hop count, which is only correct behind an ALB.
                    use_remote_address: true
                    xff_num_trusted_hops: 0
                    # deploy#1189 — Envoy's downstream default is 2147483647, i.e.
                    # a single HTTP/2 connection may open unlimited concurrent
                    # streams. That is the cheapest amplification available at a
                    # TLS edge: one handshake, unbounded in-flight requests. h2
                    # clients honour SETTINGS_MAX_CONCURRENT_STREAMS by queueing,
                    # so this bounds amplification without failing legitimate
                    # multiplexed callers (the dashboard's server-side gRPC pool,
                    # `gibson` CLI streams).
                    http2_protocol_options:
                      max_concurrent_streams: 256
                      #. The NLB drops any flow with no bytes for 350
                      # seconds and that value is NOT configurable on an NLB, so a
                      # mission that goes quiet longer than that has its TCP flow
                      # removed underneath it — neither peer notices until the next
                      # write. These PINGs keep the flow warm. They are also what
                      # reaps a stream whose client vanished without a FIN, which
                      # matters now that the daemon routes carry idle_timeout: 0s
                      # and nothing else would ever collect them.
                      connection_keepalive:
                        interval: 30s
                        timeout: 10s
                    #. Stated explicitly rather than inherited: Envoy's
                    # default is 5 minutes, and this listener carries app/docs
                    # as well as api. (one edge on every substrate).
                    # Browser streams SHOULD still be reaped — holding one open at
                    # no cost is free amplification. The mission streams opt out
                    # per-route instead, via idle_timeout: 0s on the /gibson.
                    # routes, which overrides this for exactly those paths.
                    stream_idle_timeout: 300s
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              start_time: "%START_TIME%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              response_code: "%RESPONSE_CODE%"
                              response_flags: "%RESPONSE_FLAGS%"
                              duration_ms: "%DURATION%"
                              upstream_host: "%UPSTREAM_HOST%"
                              upstream_cluster: "%UPSTREAM_CLUSTER%"
                              # Presence-only indicator: "-" when no Authorization,
                              # the scheme word ("Bearer") when one was attached.
                              # The :6 truncates the header to its first six
                              # characters, so the token itself never reaches the
                              # log. Measured 2026-09-29 on staging: without the
                              # truncation this field carried every caller's whole
                              # JWT into the pod log.
                              authorization_present: "%REQ(AUTHORIZATION):6%"
                              # Decoded Zitadel JWT claims surfaced by jwt_authn under
                              # the `zitadel` metadata key.
                              zitadel_sub: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:zitadel:sub)%"
                              zitadel_aud: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:zitadel:aud)%"
                              zitadel_iss: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:zitadel:iss)%"
                              # ext_authz identity headers it added on ALLOW.
                              gibson_subject: "%REQ(X-GIBSON-IDENTITY-SUBJECT)%"
                              gibson_tenant: "%REQ(X-GIBSON-IDENTITY-TENANT)%"
                              gibson_cred_type: "%REQ(X-GIBSON-IDENTITY-CREDENTIAL-TYPE)%"
                              user_agent: "%REQ(USER-AGENT)%"
                              x_request_id: "%REQ(X-REQUEST-ID)%"
                    route_config:
                      name: api_routes
                      # NOTE: previously had request_headers_to_remove for
                      # the x-gibson-identity-* set, intending to strip
                      # client-supplied identity headers. That config sits
                      # at the route_config level, which Envoy applies in
                      # the router filter — AFTER the ext_authz HTTP filter
                      # runs — so it was stripping the trusted headers
                      # ext_authz had just added. The daemon then saw zero
                      # identity headers and rejected every request with
                      # PermissionDenied. The strip is removed; ext_authz's
                      # OkHttpResponse.headers default action overwrites any
                      # client-supplied versions, which is the protection
                      # this strip was trying to provide.
                      # The edge owns the headers that select a Zitadel instance
                      # (ADR-0092, charts#161). Zitadel trusts them, so a client on
                      # the internet must never supply them. This runs in the router,
                      # after ext_authz, which adds none of these four.
                      request_headers_to_remove:
                        - x-zitadel-instance-host
                        - x-zitadel-public-host
                        - x-forwarded-host
                        - forwarded
                      virtual_hosts:
                        - name: api
                          # Both port-less and port-ful Host headers, since
                          # clients hitting a non-443 port (dev Kind uses
                          # :30443) send the port in Host and Envoy doesn't
                          # strip it by default.
                          domains: ["api.localhost.zeroroot.ai", "api.localhost.zeroroot.ai:443"]
                          routes:
                            # ---------------------------------------------------
                            # Daemon gRPC services. Each RPC method falls under
                            # its FQN prefix; ext_authz looks up the per-method
                            # authz rule from the SDK-generated registry.
                            # ---------------------------------------------------
                            - match: { prefix: "/gibson.daemon.v1.DaemonService/" }
                              route:
                                cluster: gibson_daemon_grpc
                                timeout: 0s
                                idle_timeout: 0s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.apiAuthenticated, by the
                                # identity ext-authz asserted. skip_if_absent so a
                                # route ext-authz did not label (none today) is not
                                # silently unlimited under a half-descriptor.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: api_authenticated
                                      - request_headers:
                                          header_name: x-gibson-identity-tenant
                                          descriptor_key: tenant
                                          skip_if_absent: false
                                      - request_headers:
                                          header_name: x-gibson-identity-subject
                                          descriptor_key: subject
                                          skip_if_absent: false
                            # ---------------------------------------------------
                            # DaemonOperatorService — strictly ZD-internal operator
                            # RPCs split out of the member-facing DaemonService into
                            # a distinct platform-sdk-published service (parent epic zeroroot-ai/.github#143). The prefix MUST
                            # appear before the /gibson. catch-all below so the more-
                            # specific match wins. Per-RPC FGA rules live in the
                            # ext-authz registry; member JWTs are rejected at
                            # the FGA check, not at jwt_authn.
                            # ---------------------------------------------------
                            - match: { prefix: "/gibson.daemon.operator.v1.DaemonOperatorService/" }
                              route:
                                cluster: gibson_daemon_grpc
                                timeout: 0s
                                idle_timeout: 0s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.apiAuthenticated, by the
                                # identity ext-authz asserted. skip_if_absent so a
                                # route ext-authz did not label (none today) is not
                                # silently unlimited under a half-descriptor.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: api_authenticated
                                      - request_headers:
                                          header_name: x-gibson-identity-tenant
                                          descriptor_key: tenant
                                          skip_if_absent: false
                                      - request_headers:
                                          header_name: x-gibson-identity-subject
                                          descriptor_key: subject
                                          skip_if_absent: false
                            - match: { prefix: "/gibson.component.v1.ComponentService/" }
                              route:
                                cluster: gibson_daemon_grpc
                                timeout: 0s
                                idle_timeout: 0s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.apiAuthenticated, by the
                                # identity ext-authz asserted. skip_if_absent so a
                                # route ext-authz did not label (none today) is not
                                # silently unlimited under a half-descriptor.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: api_authenticated
                                      - request_headers:
                                          header_name: x-gibson-identity-tenant
                                          descriptor_key: tenant
                                          skip_if_absent: false
                                      - request_headers:
                                          header_name: x-gibson-identity-subject
                                          descriptor_key: subject
                                          skip_if_absent: false
                            # ---------------------------------------------------
                            # HarnessCallbackService — the ONLY route on this vhost
                            # that does NOT go to gibson_daemon_grpc (gibson#1450).
                            #
                            # The daemon registers this service on its harness
                            # callback listener alone (gibson
                            # internal/engine/harness/callback_server.go); :50051
                            # does not serve it and has no UnknownServiceHandler, so
                            # while this route pointed at gibson_daemon_grpc every
                            # off-cluster component call passed jwt_authn, ext_authz
                            # and FGA and then got Unimplemented from grpc-go. The
                            # session-context RPCs (gibson#1184) were unreachable by
                            # the component they were built for.
                            #
                            # Fronting the callback listener rather than moving the
                            # service onto :50051 is deliberate: the callback
                            # listener applies a per-peer method policy on top of
                            # ext_authz/FGA, so the RPCs with no handler stay denied
                            # even though this prefix routes them.
                            # ---------------------------------------------------
                            - match: { prefix: "/gibson.harness.v1.HarnessCallbackService/" }
                              route:
                                cluster: gibson_daemon_callback
                                timeout: 0s
                                idle_timeout: 0s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.apiAuthenticated, by the
                                # identity ext-authz asserted. skip_if_absent so a
                                # route ext-authz did not label (none today) is not
                                # silently unlimited under a half-descriptor.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: api_authenticated
                                      - request_headers:
                                          header_name: x-gibson-identity-tenant
                                          descriptor_key: tenant
                                          skip_if_absent: false
                                      - request_headers:
                                          header_name: x-gibson-identity-subject
                                          descriptor_key: subject
                                          skip_if_absent: false
                            # Catch-all for each other gibson.* service (the tenant,
                            # user, budget and secrets services among them), and for
                            # a service that a release adds. The daemon's startup
                            # self-check (Req 4.8) panics if a method without an
                            # ext-authz registry entry is registered, so this
                            # remains safe — there's no ext-authz bypass.
                            - match: { prefix: "/gibson." }
                              route:
                                cluster: gibson_daemon_grpc
                                timeout: 0s
                                idle_timeout: 0s
                                # Per-client quota (deploy#1659):
                                # envoy.rateLimit.perClient.apiAuthenticated, by the
                                # identity ext-authz asserted. skip_if_absent so a
                                # route ext-authz did not label (none today) is not
                                # silently unlimited under a half-descriptor.
                                rate_limits:
                                  - actions:
                                      - generic_key:
                                          descriptor_key: route
                                          descriptor_value: api_authenticated
                                      - request_headers:
                                          header_name: x-gibson-identity-tenant
                                          descriptor_key: tenant
                                          skip_if_absent: false
                                      - request_headers:
                                          header_name: x-gibson-identity-subject
                                          descriptor_key: subject
                                          skip_if_absent: false
                            # ---------------------------------------------------
                            # OIDC discovery — agent/tool registration
                            # (`gibson component register`) bootstraps the issuer
                            # by fetching <gibson-url>/.well-known/openid-configuration,
                            # where <gibson-url> is this daemon API host. Post-#630
                            # single-host consolidation OIDC lives on the app vhost,
                            # so we proxy discovery to Zitadel here, rewriting Host
                            # to the app domain (Zitadel's instance router matches on
                            # its registered ExternalDomain). The returned document's
                            # `issuer` is the app origin, so the subsequent token
                            # exchange (/oauth/v2/token) targets the app host — token
                            # endpoints are deliberately NOT exposed on this daemon
                            # host. Pre-auth surface: jwt_authn allows-missing (rule
                            # below) and ext_authz is disabled per-route — OIDC
                            # discovery is public by design (mirrors the in-cluster
                            # cluster_oidc vhost). deploy#661.
