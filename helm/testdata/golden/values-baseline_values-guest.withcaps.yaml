# Source: gibson/charts/gibson-workloads/templates/tests/05-spire-attestation.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "gibson-gibson-workloads-test-spire-attestation"
  namespace: gibson
  labels:
    helm.sh/chart: gibson-workloads-0.2.0
    app.kubernetes.io/name: gibson-workloads
    app.kubernetes.io/instance: gibson
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    helm-test/keep: "false"
    gibson.zeroroot.ai/net-role: platform
    gibson.zeroroot.ai/kube-api: "true"
    # Matches the podSelector of the `gibson-platform-helm-test`
    # ClusterSPIFFEID. This label selects the CR; the serviceAccountName
    # below then has to satisfy its literal `k8s:sa:` workload selector.
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "3"
spec:
  restartPolicy: Never
  # Must equal the helm-test CR's literal `k8s:sa:` workload selector, which
  # the SPIRE agent checks against kubelet at attestation time. Changing this
  # breaks the test — that is the point of the selector.
  serviceAccountName: gibson-gibson-workloads-helm-test
  containers:
    - name: svid-fetch
      image: ghcr.io/zeroroot-ai/mirror/spire-agent:1.10.4@sha256:ecb3e00fa38d38e0166a678e4c4c1e1b3517b63a37e2a57154e7f5d5d0ee1f98
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ERR='::error file=helm-test::'
          SOCK='/run/spire/sockets/api.sock'
          EXPECT_TD='zeroroot.ai'

          if [ ! -S "$SOCK" ]; then
            echo "$ERR spire-attestation: workload-api socket missing at $SOCK"
            echo "[spire-attestation] SPIRE agent has not started, or the socket is mounted at a different path"
            ls -la "$(dirname "$SOCK")" 2>&1 || true
            exit 1
          fi
          echo "[spire-attestation] workload-api socket present: $SOCK"

          # `spire-agent api fetch x509` blocks until an SVID is available or
          # the deadline expires. -timeout caps total wall-clock.
          if ! spire-agent api fetch x509 -socketPath "$SOCK" -timeout 30s -write /tmp 2>/tmp/svid.err ; then
            echo "$ERR spire-attestation: no SVID issued within 30s"
            cat /tmp/svid.err >&2 || true
            echo "[spire-attestation] check ClusterSPIFFEID selector matches this pod's labels:"
            echo "[spire-attestation]   - app.kubernetes.io/component=helm-test"
            echo "[spire-attestation]   - app.kubernetes.io/name=$(echo 'gibson-workloads')"
            echo "[spire-attestation]   - SA: $(echo 'gibson-gibson-workloads-helm-test')"
            exit 1
          fi

          # `api fetch x509 -write /tmp` writes bundle.0.pem + svid.0.pem + svid.0.key.
          if [ ! -s /tmp/svid.0.pem ]; then
            echo "$ERR spire-attestation: SVID PEM not written"
            exit 1
          fi

          # Verify the SAN URI is in the expected trust domain.
          # openssl is in the spire-agent image. Parse the SAN block.
          # The SPIFFE ID embeds as a URI SAN: spiffe://<td>/...
          san_uri=$(openssl x509 -in /tmp/svid.0.pem -noout -ext subjectAltName 2>/dev/null \
            | grep -oE 'URI:spiffe://[^,[:space:]]+' \
            | head -1 \
            | cut -d: -f2-)

          if [ -z "$san_uri" ]; then
            echo "$ERR spire-attestation: SVID has no SPIFFE-URI SAN"
            openssl x509 -in /tmp/svid.0.pem -noout -text 2>&1 | head -50
            exit 1
          fi

          # Strip leading "spiffe:" (cut -d: gave us the rest after URI:).
          spiffe_id=$(printf '%s' "$san_uri" | sed 's|^//|spiffe://|')

          echo "[spire-attestation] SVID issued, SPIFFE ID: $spiffe_id"

          # Trust-domain prefix check.
          case "$spiffe_id" in
            "spiffe://${EXPECT_TD}/"*)
              echo "[spire-attestation] OK trust domain matches: ${EXPECT_TD}"
              ;;
            *)
              echo "$ERR spire-attestation: SPIFFE ID '$spiffe_id' is NOT under expected trust domain 'spiffe://${EXPECT_TD}/'"
              exit 1
              ;;
          esac

          echo "[spire-attestation] PASS"
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        # The restricted Pod Security Standard (ADR-0165, charts#394). The
        # Workload API socket accepts each local user, so the probe needs no root.
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
        - name: tmp
          mountPath: /tmp
  volumes:
    # The SPIRE Workload API socket, via the csi.spiffe.io driver — the same
    # volume, by the same mechanism, that the daemon, ext-authz, the dashboard,
    # Envoy and both operators use. This is what makes the test's attestation
    # path identical to a real workload's.
    #
    # deploy#1578: this was a hostPath at /run/spire/sockets, which is not a
    # path on the node — the agent's hostPath is /run/spire/agent-sockets, and
    # /run/spire/sockets is only the in-pod mountPath the CSI driver publishes
    # to (a tmpfs, per /proc/mounts inside a live consumer). `DirectoryOrCreate`
    # therefore created an EMPTY directory on the node and the `[ ! -S "$SOCK" ]`
    # gate below could never pass, in any environment.
    - name: spire-agent-socket
      csi:
        driver: csi.spiffe.io
        readOnly: true
    - name: tmp
      emptyDir: {}
  imagePullSecrets:
    - name: ghcr-credentials
