                      # unlimited. The six pre-auth routes each override it with a
                      # tighter bucket; an override REPLACES this one rather than
                      # stacking, so a flood on one pre-auth route drains only that
                      # route's bucket and the authenticated /gibson.* surface keeps
                      # serving. That containment is the difference between a fuse
                      # and "one source locks everyone out".
