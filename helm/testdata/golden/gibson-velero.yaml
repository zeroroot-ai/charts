# Source: gibson-velero/templates/backupstoragelocation.yaml
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  annotations:
    # This is a CR of a kind the velero sub-chart in THIS SAME RELEASE
    # registers. Helm cannot order a CRD and a CR of it within one release, and
    # it sorts kinds it does not recognise alphabetically — so without this the
    # CR is applied before its CRD exists and the apply is refused.
    #
    # Both barriers, because there are two orderings to satisfy:
    #   helm.sh/hook      a plain `helm install` has no barrier in its main phase
    #   argocd sync-wave  Argo orders hooks and ordinary resources together
    #
    # Observed before this: Argo reported a controller sync timeout and
    # recovered on retry, which hid the defect behind a retry that a plain
    # helm install does not have. See charts#2.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "20"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation
  namespace: gibson
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: gibson-velero
    app.kubernetes.io/component: backup-storage-location
    app.kubernetes.io/managed-by: Helm
  annotations:
    # After the server Deployment: a location the controller cannot reconcile
    # yet reports its phase as empty, which reads as a failure.
    argocd.argoproj.io/sync-wave: "10"
spec:
  provider: aws
  default: true
  # The platform credential can write and read and cannot delete, so a
  # ReadWrite location never prunes: the bucket lifecycle rule owns removal.
  accessMode: ReadWrite
  validationFrequency: "1h"
  objectStorage:
    bucket: "gibson-kind"
    prefix: "backups/velero"
  config:
    region: "us-east-1"
    s3ForcePathStyle: "true"
    # Empty on AWS: the plugin then resolves the regional S3 endpoint itself.
    s3Url: "http://172.18.255.250:9000"
---
# Source: gibson-velero/templates/schedule.yaml
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: platform-hourly
  annotations:
    # This is a CR of a kind the velero sub-chart in THIS SAME RELEASE
    # registers. Helm cannot order a CRD and a CR of it within one release, and
    # it sorts kinds it does not recognise alphabetically — so without this the
    # CR is applied before its CRD exists and the apply is refused.
    #
    # Both barriers, because there are two orderings to satisfy:
    #   helm.sh/hook      a plain `helm install` has no barrier in its main phase
    #   argocd sync-wave  Argo orders hooks and ordinary resources together
    #
    # Observed before this: Argo reported a controller sync timeout and
    # recovered on retry, which hid the defect behind a retry that a plain
    # helm install does not have. See charts#2.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "20"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation
  namespace: gibson
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: gibson-velero
    app.kubernetes.io/component: schedule
    app.kubernetes.io/managed-by: Helm
  annotations:
    # With the BackupStorageLocation (wave 10): a Schedule the server cannot
    # reconcile against an Available location yet would log errors on every
    # tick.
    argocd.argoproj.io/sync-wave: "10"
    # ARGO MUST NOT OWN THE BACKUPS THIS SCHEDULE MAKES.
    #
    # Velero copies a Schedule's OWN labels and annotations onto every Backup
    # it creates from it (pkg/controller/schedule_controller.go, getBackup),
    # and Argo stamps its tracking id onto this object. So without this line
    # every scheduled Backup arrives wearing Argo's tracking id, Argo adopts
    # it as a resource of this Application, finds it in no manifest, reports
    # the Application OutOfSync forever, and with `prune: true` DELETES the
    # platform's backups. Measured on kind 2026-09-02 (deploy#1739): the
    # velero Application never reached Synced, and the extraneous resource was
    # a Backup the server had just synced from the durable bucket.
    #
    # IgnoreExtraneous tells Argo to ignore a live resource that is not in the
    # desired state. It rides to every Backup through the same copy, and it is
    # a no-op on this Schedule itself, which IS in the desired state.
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  schedule: "0 * * * *"
  # The first backup waits for the first cron tick. An install-time backup
  # would race the node-agent rollout and record a PartiallyFailed run as the
  # schedule's first result.
  skipImmediately: true
  template:
    includedNamespaces:
      - gibson
      - tenant-*
    includedNamespaceScopedResources:
      - "*"
    excludedNamespaceScopedResources:
      - secrets
      # The ESO generator kinds get the secrets treatment: a Fake generator
      # spec and a GeneratorState can carry literal secret material. The RBAC
      # holds no verb on the group (templates/rbac.yaml), and this glob keeps
      # the item collector from even asking, so the phase stays Completed.
      - "*.generators.external-secrets.io"
    includedClusterScopedResources:
      - tenants.gibson.zeroroot.ai
    defaultVolumesToFsBackup: true
    storageLocation: default
    # Velero's garbage collector deletes a backup whose ttl expired, with the
    # server's own credential. Retention is the bucket lifecycle rule
    # (`backups/` expires at 180 days, CONTEXT.md § Backup cadence), so the
    # ttl states the SAME horizon and the two mechanisms agree instead of
    # racing: at 180 days the lifecycle rule has expired the objects and the
    # GC removes the record that points at them. A shorter ttl would have
    # Velero pruning backups the bucket still holds, which contradicts
    # "retention is the bucket's job and nothing else".
    ttl: "4320h0m0s"
    hooks:
      resources:
        # One hook per Neo4j pod shape. The two label sets come from the two
        # producers: the tenant operator stamps
        # app.kubernetes.io/component=tenant-neo4j on every per-tenant pod
        # (gibson operators/tenant/internal/dataplane/neo4j_networkpolicy.go),
        # and the upstream neo4j chart stamps
        # helm.neo4j.com/pod_category=neo4j-instance on the platform graph
        # pod. Both run the container `neo4j` and both carry their auth as
        # `neo4j/<password>`: the tenant pod in the env var NEO4J_AUTH, the
        # platform pod in the file NEO4J_AUTH_PATH points at. The command
        # reads whichever is present and checkpoints over bolt on localhost.
        - name: tenant-neo4j-checkpoint
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: tenant-neo4j
          pre:
            - exec:
                container: neo4j
                command:
                  - /bin/sh
                  - -c
                  - |
                    A="${NEO4J_AUTH:-$(cat "$NEO4J_AUTH_PATH")}"
                    out="$(cypher-shell -a bolt://127.0.0.1:7687 -u "${A%%/*}" -p "${A#*/}" "CALL db.checkpoint()" 2>&1)" && { echo "$out"; exit 0; }
                    case "$out" in
                      *"no procedure with the name"*)
                        echo "community edition has no db.checkpoint (measured on neo4j:5.26.0-community, deploy#1735): the periodic checkpoint bounds replay, asserting the store answers instead"
                        exec cypher-shell -a bolt://127.0.0.1:7687 -u "${A%%/*}" -p "${A#*/}" "CALL db.ping()"
                        ;;
                      *) echo "$out" >&2; exit 1 ;;
                    esac
                onError: Fail
                timeout: "5m"
        - name: platform-neo4j-checkpoint
          labelSelector:
            matchLabels:
              helm.neo4j.com/pod_category: neo4j-instance
          pre:
            - exec:
                container: neo4j
                command:
                  - /bin/sh
                  - -c
                  - |
                    A="${NEO4J_AUTH:-$(cat "$NEO4J_AUTH_PATH")}"
                    out="$(cypher-shell -a bolt://127.0.0.1:7687 -u "${A%%/*}" -p "${A#*/}" "CALL db.checkpoint()" 2>&1)" && { echo "$out"; exit 0; }
                    case "$out" in
                      *"no procedure with the name"*)
                        echo "community edition has no db.checkpoint (measured on neo4j:5.26.0-community, deploy#1735): the periodic checkpoint bounds replay, asserting the store answers instead"
                        exec cypher-shell -a bolt://127.0.0.1:7687 -u "${A%%/*}" -p "${A#*/}" "CALL db.ping()"
                        ;;
                      *) echo "$out" >&2; exit 1 ;;
                    esac
                onError: Fail
                timeout: "5m"
