# Source: gibson-velero/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-server
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: gibson-velero
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: Helm
rules:
  # READ, for the backup itself. The item collector lists and gets every
  # resource named in a backup spec; anything absent here cannot enter a
  # backup. `secrets` is absent, and that absence is the control.
  - apiGroups: [""]
    resources:
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - configmaps
      - services
      - endpoints
      - serviceaccounts
      - limitranges
      - resourcequotas
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  # Nodes: the node-agent schedules a data mover onto the node that holds the
  # volume, which needs to read the node list.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # PriorityClasses, cluster-wide and read only. Velero's built-in related-item
  # action for a Pod follows the pod's `priorityClassName` and GETS that object
  # (pkg/backup/actions/pod_action.go), so every backed-up platform pod asks
  # for one. Measured on kind 2026-09-02 (deploy#1740): the loop's backup
  # logged seven "Error while trying to get related item
  # priorityclasses.scheduling.k8s.io" for `gibson-platform-critical` and
  # `gibson-platform`. A PriorityClass carries a number and a description and
  # no credential.
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  # The rest of what a namespace is made of, read for one reason: Velero's item
  # collector enumerates EVERY namespaced kind in an included namespace, and a
  # kind it cannot list is an error that ends the backup PartiallyFailed. With
  # these granted, `secrets` is the ONLY denial in a namespace backup — so a
  # PartiallyFailed backup means something real, and the one exclusion every
  # backup spec carries is `secrets` and nothing else. None of these carries a
  # credential. (Measured on kind 2026-09-01: without them, one backup of one
  # tenant namespace logged 41 errors.)
  - apiGroups: [""]
    resources: ["events", "podtemplates"]
    verbs: ["get", "list", "watch"]
  # events.k8s.io is the SAME objects as the core `events` above, served under
  # a second group. The item collector asks discovery for every namespaced
  # kind, gets both, and lists both, so a role that reads one and not the
  # other ends the backup PartiallyFailed on the half it cannot read.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  # Velero's own API, cluster-wide and READ ONLY, for the same enumeration
  # reason. The objects themselves live in Velero's namespace, where the Role
  # below carries the write half; a tenant namespace holds none of them.
  - apiGroups: ["velero.io"]
    resources:
      - backups
      - backuprepositories
      - backupstoragelocations
      - deletebackuprequests
      - downloadrequests
      - podvolumebackups
      - podvolumerestores
      - restores
      - schedules
      - serverstatusrequests
      - datauploads
      - datadownloads
      - volumesnapshotlocations
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # Storage: a restore must place a PVC on a class that exists, and the
  # node-agent needs the CSI topology of the volume it is copying.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # The CRDs themselves are read so a backup records which custom kinds
  # existed. They are never created from a backup: gibson-crds installs them
  # first on a recreate, which is why `create` is absent.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # RBAC is read, never written. Creating a Role or a RoleBinding needs the
  # permissions inside it (Kubernetes escalation prevention) or the
  # `escalate` verb, and a backup controller that can write RBAC is a
  # cluster-admin with extra steps.
  #
  # The cluster-scoped half is not optional: when a backup includes a
  # ServiceAccount, Velero's built-in related-item action LISTS
  # ClusterRoleBindings to find the ones that bind it, and without the verb
  # every backup fails outright ("cannot list resource clusterrolebindings at
  # the cluster scope", measured on kind 2026-09-01).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # The platform's own custom resources: the tenant records a recreate has to
  # bring back. Named one by one, never `*`, so a new CRD is a deliberate
  # edit here rather than a silent widening. `patch` rides with `create` for
  # the same reason it does on the restore targets below: Velero patches the
  # backup's managedFields onto every restored item (pkg/restore/restore.go),
  # and without it every CR restore errors — measured on kind 2026-09-02 on
  # the tenant drill's TenantDataPlane (deploy#1735). These kinds produce no
  # pods, so the deploy#1210 pod-template concern does not apply.
  - apiGroups: ["gibson.zeroroot.ai"]
    resources:
      - tenants
      - tenantdataplanes
      - tenantidentities
      - tenantmembers
      - tenantgrants
      - tenantsecretsbackends
      - componentgrants
      - connectorinstances
      - oidcclients
      - agentenrollments
      - platformbootstraps
    verbs: ["get", "list", "watch", "create", "patch"]
  # The rest of the platform's own CRD surface (helm/gibson-crds), read for
  # the same enumeration reason as the built-in kinds above: the item
  # collector lists EVERY namespaced kind in an included namespace, and a
  # kind it cannot list ends the backup PartiallyFailed. Measured on kind
  # 2026-09-02 (deploy#1735): with the gibson-crds chart installed, one
  # backup of one tenant namespace and gibson logged 152 forbidden errors
  # across these groups. Named one by one from the shipped CRD files, never
  # `*`. None of these kinds carries secret material: a CNPG or cert-manager
  # or monitoring CR references Secrets by name and never holds a value.
  #
  # generators.external-secrets.io is DELIBERATELY absent: a Fake generator
  # spec and a GeneratorState can carry literal secret material, so that
  # group gets the secrets treatment — no verb here, and the Schedule
  # excludes the group by glob so the phase stays Completed
  # (templates/schedule.yaml).
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - backups
      - clusters
      - databaseroles
      - databases
      - failoverquorums
      - imagecatalogs
      - poolers
      - publications
      - scheduledbackups
      - subscriptions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests", "certificates", "issuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["challenges", "orders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "pushsecrets", "secretstores"]
    verbs: ["get", "list", "watch"]
  # The kinds the rest of the bringup registers, read for the same enumeration
  # reason. They are NOT in the platform's CRD chart, so the list above missed
  # them and every backup of the whole platform ended PartiallyFailed:
  # measured on kind 2026-09-02 (deploy#1740), three runs of the preserve loop
  # each logged 134 errors, and the named kinds were these groups.
  #
  #   argoproj.io                Argo CD, installed by stage 1 (kind/gibson).
  #                              Its objects live in the `argocd` namespace, so
  #                              a backup of `gibson` and `tenant-*` collects
  #                              none; the list still has to be allowed.
  #   toolhive.stacklok.dev      The ToolHive operator, a cluster prerequisite
  #                              of the connector runtime (scripts/recreate-kind.sh).
  #                              The connector-operator renders MCPServer and
  #                              MCPRemoteProxy CRs into tenant namespaces.
  #   setec.zeroroot.ai          The sandbox runtime, an umbrella subchart
  #                              (the setec chart). `sandboxclasses` is
  #                              cluster-scoped and a namespace backup never
  #                              lists it.
  #   externaldns.k8s.io         external-dns, an umbrella subchart.
  #
  # Named one by one from the CRDs those charts ship, never `*`, and read
  # only: none of them is a kind a recreate rebuilds, so none carries `create`.
  # A CR of one of these that DID ride in a backup surfaces at restore as a
  # loud error, which is the failure direction chose.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["toolhive.stacklok.dev"]
    resources:
      - embeddingservers
      - mcpexternalauthconfigs
      - mcpgroups
      - mcpregistries
      - mcpremoteproxies
      - mcpservers
      - mcptoolconfigs
      - virtualmcpcompositetooldefinitions
      - virtualmcpservers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["setec.zeroroot.ai"]
    resources: ["sandboxes", "snapshots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagerconfigs
      - alertmanagers
      - podmonitors
      - probes
      - prometheusagents
      - prometheuses
      - prometheusrules
      - scrapeconfigs
      - servicemonitors
      - thanosrulers
    verbs: ["get", "list", "watch"]

  # CREATE, for the restore. The kinds a recreate rebuilds, and nothing else.
  # A kind absent here restores as a loud error, never as silent data loss,
  # which is the failure direction chose.
  - apiGroups: [""]
    resources:
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
      - services
      - endpoints
      - serviceaccounts
      - limitranges
      - resourcequotas
    verbs: ["create", "patch"]
  # Pods carry the same pair, for the reason given below the apps rule.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "patch"]
  # The pod-producing kinds a tenant data plane is made of. `create` AND
  # `patch`: Velero restores an item and then patches the backup's
  # managedFields onto it (pkg/restore/restore.go, "error patch for managed
  # fields"), so a restore target without `patch` fails every restore —
  # measured on kind 2026-09-01, on the pod of the tenant drill. The patch
  # capability this hands out (rewriting a running workload's pod template,
  # deploy#1210) is bounded by the platform-identity VAP in the gibson
  # namespace, and every grant here carries its written reason in
  # scripts/.workload-rbac-allowlist.txt. daemonsets and cronjobs stay
  # absent: no tenant namespace holds either, and the ones in the gibson
  # namespace are chart-rendered desired state that a backup excludes.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["create", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "patch"]

  # Pre-backup hooks (deploy#1735). A backup hook is an exec into the target
  # pod, issued by the server through this subresource
  # (internal/hook/item_hook_handler.go). The platform runs two: the Neo4j
  # checkpoint on the per-tenant pods and on the platform graph pod
  # (templates/schedule.yaml). The grant is `create` on pods/exec alone: it
  # enters a running container, it authors nothing, and the role still holds
  # no verb on secrets, so the API path to a Secret object stays closed. What
  # exec does reach is whatever the entered container itself can read, which
  # is why the hooks target only the Neo4j pods by label and why this rule is
  # tracked in scripts/.workload-rbac-allowlist.txt with its written reason.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

  # Progress. Velero records every backup and restore step as an Event on the
  # object it is working on, in that object's namespace.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
