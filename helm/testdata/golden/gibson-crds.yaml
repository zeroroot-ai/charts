                    type: string
                  sourceSecret:
                    description: |-
                      SourceSecret is the Secret the openbao-auto-init sidecar mints the
                      unseal key into. Defaults to <release>-openbao-unseal-keys / unsealKey.
                    properties:
                      key:
                        description: Key is the entry within the Secret's data map.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret name.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace overrides the default namespace.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  volume:
                    description: Volume configures destination=volume.
                    properties:
                      path:
                        description: |-
                          Path is an absolute file path inside the operator pod, on a volume the
