                type: string
              toolHiveKind:
                description: |-
                  ToolHiveKind and ToolHiveName record the ToolHive resource the operator
                  owns (MCPServer or MCPRemoteProxy). Internal; never a product surface.
                type: string
              toolHiveName:
                type: string
            type: object
        type: object
