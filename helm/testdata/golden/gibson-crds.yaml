                  connector's tools/list.
                format: int32
                type: integer
              lastError:
                description: LastError is the most recent human-readable failure,
                  with remediation.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: Phase is the scalar lifecycle phase.
                type: string
              proxyURL:
