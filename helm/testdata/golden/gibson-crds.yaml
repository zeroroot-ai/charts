                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation most recently
                  reconciled.
                format: int64
                type: integer
              phase:
                description: TenantMemberPhase represents the lifecycle phase of a
                  TenantMember.
                enum:
                - Pending
                - Invited
                - Accepting
                - Active
                - Expired
                - Revoked
                type: string
              userId:
                description: UserID is the Zitadel subject (sub claim) recorded after
                  acceptance.
                type: string
              zitadelMembershipID:
                description: |-
                  ZitadelMembershipID is the stable key identifying this user's membership
                  within the tenant's Zitadel organization (composite "orgID/userID").
                type: string
              zitadelUserID:
